            instance_store: none
            size_derived_iops_ceiling: ""
            size_derived_throughput_mib_s_ceiling: ""
      general:
        family: ""
        modifiers: ""
        arch: arm64
        generation_policy: newest
        generation_pin: ""
        price_policy: newest-within
        price_step_max_pct: 10
        price_generations: ""
        size: ""
        source: vm-sizes
        instance_iops_ceiling: ""
