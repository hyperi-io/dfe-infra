## THE DEPLOYMENT DIAL -- one config file the whole deployment reads. This is the
## CANONICAL SUPERSET: it spans every substrate (docker-vm + k8s) and every cloud,
## and it is the persisted, wizard-populatable form of the DeployContext (the
## LOCKED schema in docs/plans/2026-07-08-branch-preview-cycle.md). The chain is
##
##     dial  ->  DeployContext  ->  deploy(context)  ->  running stack
##
## so a redeploy is a dial edit, not a re-argument of the orchestrator. A QA GUI
## wizard populates this same file later; every field is a labelled dial with a
## default and its allowed values.
##
## HOW EACH SUBSTRATE READS IT:
##   docker-vm -- `scripts/render_dial.py` in dfe-docker renders the `docker:`
##     slice into that repo's .env. A lone dfe-docker clone carries its own
##     subset copy of this file, so it deploys standalone with no dfe-infra
##     checkout.
##   k8s -- `scripts/render_dial.py` here renders the `k8s:` slice into the flat
##     DFE_* env file `dfe-ops` already consumes (bootstrap/.env), then prints the
##     derived `dfe-ops cycle` line. dfe-ops is the orchestrator unchanged; the
##     dial just feeds it.
##
## SECRETS ARE REFERENCES, never values (a bao path + field, resolved at deploy).
## ESTATE ENDPOINTS stay BLANK in this committed template -- hyperi-infra's thin
## caller injects them from OpenBao at deploy time, or an operator fills them by
## hand in the copied deployment.yaml. This file ships publicly, so it must never
## carry a real domain, host, cluster address, or credential.
##
## Copy to deployment.yaml (gitignored) and populate.

apiVersion: dfe.hyperi.io/v1
kind: DeployContext

## Which substrate this deployment targets.
##   docker-vm -- single-VM docker compose stack (dfe-docker).
##   k8s       -- an RKE2/EKS/GKE/AKS cluster via dfe-ops (this repo).
## The k8s renderer here requires substrate: k8s; the docker renderer requires
## docker-vm. One file, sliced per substrate.
substrate: k8s

## WHO + WHAT LIFECYCLE. metadata.name is the deploy id -> namespace / release /
## Argo-app prefix. lifecycle drives whether the deployment is torn down with its
## test (ephemeral) or kept (persistent); ttl is advisory for ephemeral only.
metadata:
  name: dfe
  owner: ""
  lifecycle: ephemeral       # ephemeral | persistent
  ttl: 48h                   # ephemeral only; ignored when persistent
  # labels: team=dfe         # optional; free-form, not read by the renderer

## WHERE it lands. Exactly one of existing | provision (steps.provision gates it).
## The committed default is `existing` -- deploy ONTO a cluster you already have
## (preview, BYO-prod, devex). `provision` runs OpenTofu to create the cluster
## first (marketplace / greenfield); see the AWS worked example under `cloud:`.
target:
  existing:
    clusterRef: ""           # -> kubeconfig context / Argo cluster-secret (estate)
    namespace: dfe
  # provision:               # cloud-provisioned (tofu runs). Set steps.provision: true.
  #   cloud: aws             # aws | gcp | azure | rancher
  #   account: "000000000000"  # the root asserts the caller's identity against it before creating anything
  #   region: ap-southeast-2
  #   cidr: 10.42.0.0/16       # must not overlap what you peer with, nor 172.31.0.0/16

## ---------------------------------------------------------------------------
## CLOUD PROVISIONING -- read only when target.provision names a cloud.
## `python3 scripts/render_dial.py --tofu` turns this section plus
## target.provision into terraform/environments/<cloud>/dial.auto.tfvars.json,
## which is the whole of what the tofu root knows: the roots receive values and
## compute none. Ignored entirely on the target.existing path.
## ---------------------------------------------------------------------------

## Control-plane minor version. dfe-infra#285 adds a `platform:` stage to
## versions.yaml and the renderer prefers it once present; this is the value
## until it lands.
kubernetes_version: "1.36"

## Egress. per-az puts a NAT gateway in every zone, so a zone failure and the
## cross-zone data charge both stay contained; single puts one in the first
## zone and is the cheaper tyre-kick default.
network:
  nat: single                # per-az | single
  az_count: 3                # 2-6; empty takes 3, enough for a quorum without a fourth zone's cross-zone charge

## The Kubernetes API endpoint. The private one is always on; public adds the
## public one for operators outside the VPC, and the root refuses 0.0.0.0/0.
endpoint:
  public: "false"            # true | false
  allowed_cidrs: ""          # comma-separated; must be set when public is true

## DNS. private_zone resolves inside the VPC and carries everything internal;
## public_zone is the delegated zone the exposed UIs answer on, empty for none.
dns:
  private_zone: dfe.internal
  public_zone: ""

## THE EXPOSED UIs. Everything DFE uses internally is private; the UIs are the
## exception, because their users sit outside the VPC. Nothing here does
## anything while dns.public_zone is empty. These keys are the gateway chart's
## `ui:` values verbatim, so an overlay is a copy rather than a translation --
## which is exactly why every boolean below is unquoted, unlike the rest of
## this dial (render_dial.py's own convention writes true/false as quoted
## strings, see _flag()). This block is meant to be pasted straight into a
## real Helm values file, where Go templates read an unquoted true/false as a
## bool and a quoted "false" as a non-empty string that is always truthy. The
## chart refuses a quoted one at render rather than guessing what you meant.
ui:
  ## dfe-ui is the product surface and is public by default on a cloud deploy.
  ## Every admin UI is opt-in, one at a time. cruise_control has no route yet --
  ## it arrives with the rebalancer UI, and turning it on before then fails the
  ## render rather than silently doing nothing.
  public:
    dfe_ui: true
    kafbat: false
    cruise_control: false
    hyperdx: false
    argocd: false
    links: false
  ## Who may reach a public UI; empty = any address. Enforced at Envoy AND at
  ## the cloud load balancer, so one misconfiguration is not the whole wall.
  ## The load-balancer half fences the entire front door, ingest included.
  allowed_cidrs: ""
  ## The proxy ranges Envoy may believe about the client address -- the load
  ## balancer's subnets, plus any CDN in front. Required when allowed_cidrs is
  ## set: without it the address comes from a header the caller writes.
  trusted_proxy_cidrs: ""
  ## Sized for a handful of analysts and admins, so a credential-stuffing run
  ## hits a wall before it hits the login. local counts per route per proxy
  ## replica, not per attacker; per-attacker counting needs Redis and is refused.
  rate_limit:
    enabled: true
    requests: "300"
    unit: Minute             # Second | Minute | Hour | Day | Month | Year
    scope: local             # local only
  ## Every public route already sits behind a login with deny-by-default
  ## authorisation, so managed rules would guard code no unauthenticated caller
  ## reaches. Any other mode terminates TLS above Envoy and moves the public
  ## certificate to the cloud's own store, which is not rendered here.
  waf:
    mode: none               # none only
    plan: ""                 # reserved
    managed_rules: ""        # reserved
  ## Public edge TLS. min_version is a STRING -- unquoted 1.2 parses as a float
  ## and is rejected. hsts stops a browser retrying the name over plaintext.
  tls:
    min_version: "1.2"
    hsts: true

## THE RECEIVER'S INGRESS DOOR. DFE pushes terabytes a day through the
## receiver, and every cloud front door bills by volume -- on AWS an NLB is
## USD 0.006 per LCU-hour with 1 GB processed per LCU-hour, so one fronting
## the receiver runs about USD 196/month at 1 TB/day and about USD
## 1,800/month at 10 TB/day (us-east-1, verified 2026-09-15 against AWS's
## own pricing page -- docs/deployment/aws.md#receiver-ingress has the
## source and the full arithmetic). So the receiver carries NO public front
## door by default: it stays private in the VPC, and there are three ways to
## reach it --
##   1. culvert (helm/charts/culvert), dialled through an address the
##      deployer brings -- e.g. an Elastic IP on a small forwarder instance
##      in front of culvert's NodePort. Free ingress, no per-byte line.
##   2. the deployer's own peering, VPN or Direct Connect, straight to the
##      receiver's node port or ClusterIP.
##   3. a public or internal load balancer, the explicit costed opt-in below
##      -- `mode: public` plus `loadBalancerSourceRanges` set, never empty.
## These keys are the dfe-receiver chart's `exposure:` values verbatim, the
## same paste-into-a-values-file convention as `ui:` above: unquoted
## true/false and mode as a plain string, because this is meant to land in a
## real Helm values file rather than go through render_dial.py's own DFE_*
## translation.
ingest:
  mode: vpn                  # public | internal | vpn -- vpn is the safe cloud default
  public:
    serviceType: LoadBalancer
    loadBalancerIP: ""
    loadBalancerClass: ""
    annotations: {}
    ## Empty is not "unset" -- it is 0.0.0.0/0, the whole internet. A
    ## deployer opting into `mode: public` sets this, always.
    loadBalancerSourceRanges: []
  vpn:
    ## Selector label of the tunnel pods -- dfe-common.selectorLabels on the
    ## culvert chart. Matches that chart's default project/component name;
    ## change only alongside a renamed culvert release.
    podLabel: dfe-culvert
  networkPolicy:
    enabled: true

## TOOLBOX -- two independent troubleshooting surfaces sharing one top-level
## key, because this restricted YAML subset allows no duplicate key. `pod:`
## is the IN-CLUSTER one (any cloud, or on-prem); `enabled`/`aws:`/
## `ttl_minutes`/`session:`/`session_log_retention_days` below it are the
## on-demand SSM-managed EC2 instance for a CLOUD-PROVISIONED deployment only
## (terraform/modules/toolbox/aws; docs/deployment/toolbox.md) -- ignored on
## target.existing the same as the rest of the CLOUD PROVISIONING section,
## even though it is written here rather than beside kafka: below, for the
## one-`toolbox:`-key reason just given.
toolbox:
  ## An opt-in troubleshooting pod (helm/charts/dfe-toolbox), off by default
  ## and idle at replicas: 0 even when the chart is deployed. render_dial.py
  ## carries this sub-block through to the DFE_TOOLBOX_POD_* env keys,
  ## bootstrap.sh onto the cluster-secret annotations, and
  ## argocd/appsets/layer2-platform.yaml reads them back as this app's own
  ## `toolbox.pod.*` parameters -- the same shape retention.defaultTtlDays
  ## already uses (layer2-apps.yaml). This dial value is therefore
  ## authoritative over argocd/values/common.yaml's fleet-wide `false`
  ## default and over anything a deploy repo's own infra/dfe-toolbox.yaml
  ## overlay sets. camelCase and unquoted booleans, like `ui:` above, because
  ## these ARE the chart's own toolbox.pod.* values, not a render_dial.py
  ## translation. A quoted "true"/"false" is refused by the chart's own
  ## validate.yaml.
  pod:
    enabled: false
    ## Read-only Kubernetes API access (pods/services/endpoints/configmaps, pods/log,
    ## pods/portforward -- never secrets, never pods/exec). Refused unless enabled is
    ## also true.
    kubeApiAccess: false
    ## Seconds before the companion CronJob scales the pod back to zero. Empty runs it
    ## until an operator disables it by hand.
    ttlSeconds: ""
  ## The on-demand SSM-managed EC2 instance, READ by render_dial.py --tofu
  ## (unlike pod: above). `enabled` is the `dfe-ops bastion up`/`down` toggle
  ## -- down means the instance, its security group, its IAM role and both
  ## kinds of Session document do not exist (terminate, never stop). Tool
  ## versions are NEVER set here: render_dial.py assembles them from
  ## versions.yaml's own toolbox: stage, so a deployer cannot pin a stale
  ## tool by hand independent of everything else this repo pins through the
  ## same file.
  enabled: "false"
  aws:
    ## Smallest Graviton burstable size -- shapes/compute-shapes.yaml's own
    ## `toolbox` use case resolves to the same family for the node-pool path.
    instance_type: t4g.small
    ## The IAM role EKS grants a read-only (AmazonEKSViewPolicy) access entry
    ## to when enabled is true -- required then. The toolbox INSTANCE itself
    ## gets no EKS access entry at all: a forward's kubectl identity is the
    ## OPERATOR's own role, authenticated at the laptop end of the tunnel,
    ## never the instance's (toolbox/aws/CONTRACT.md, "EKS access").
    operator_role_arn: ""
  ## Minutes with no active SSM session before the on-instance timer shuts
  ## the box down (a systemd timer counting local ssm-session-worker
  ## processes, not a CPU alarm -- an idle-looking tunnel can still be
  ## carrying a live kcat consumer). Bounded 15-480 by the module itself, not
  ## only here. `dfe-ops bastion up --ttl` overrides this for one call.
  ttl_minutes: 60
  ## Session Manager preferences for the SHELL session only -- a port-forward
  ## session carries no such preferences, because Session Manager records no
  ## transcript for one at all (toolbox/aws/CONTRACT.md #6). Both bounded by
  ## Session Manager's own ceilings (60 minutes, 1440 minutes).
  session:
    idle_timeout_minutes: 15
    max_duration_minutes: 240
  ## S3 lifecycle expiry on the session-log bucket. Deliberately independent
  ## of telemetry.aws.retention_days above (2-7 days) -- a session log is
  ## evidence of human access to a customer's private data plane, not
  ## service telemetry.
  session_log_retention_days: 90

## The system node pool -- what the cluster runs before any DFE workload lands.
## shape_ref indexes shapes/resolved/<cloud>-<region>.json; an instance type is never
## named here, because the shape resolver owns that answer.
node_pools:
  system:
    shape_ref: eks-system
    min_size: 2
    max_size: 3
    desired_size: 2
    capacity_type: ON_DEMAND # ON_DEMAND | SPOT
    disk_gb: 40

## TELEMETRY -- recorded policy: DFE's monitoring goes to its own OTel feed and
## HyperDX, never CloudWatch. Where a managed cloud service forces a
## CloudWatch-shaped touchpoint anyway (MSK's broker logs, EKS's control-plane
## audit log -- neither has any other export path), it is kept minimal and
## short-retention rather than removed. sink: cloudwatch is the OPT-IN
## AWS-native path for a compliance need CloudWatch itself satisfies.
telemetry:
  aws:
    sink: otel               # otel | cloudwatch. otel is the default -- never CloudWatch by choice.
    ## LEAVE EMPTY so render_dial.py's own sink-conditional default applies: 2
    ## (S3 lifecycle expiry) under otel, 7 under cloudwatch. CloudWatch Logs
    ## only accepts a fixed retention list, which does not include 2 -- a
    ## literal 2 here fails the plan the moment sink flips to cloudwatch and
    ## nothing else changes.
    retention_days: ""

## SIZING -- `python3 scripts/resolve_sizing.py` turns these into node counts,
## CPU, memory, disk, IOPS, partitions and retention. Scale tier only.
sizing:
  ## Estimated ingest in GB/day. LEAVE IT EMPTY for the tyre-kick floor, whose
  ## carried throughput the sizing report states rather than targets. Above
  ## 100,000 the resolver refuses and points at professional services.
  ingest_gb_per_day: ""
  ## economy (the minimum that could do it) | balanced | performance. It buys
  ## headroom over the sized peak, and never trades RF3 or the controllers away.
  focus: economy
  ## Peak over the daily average -- log volume is diurnal, and a broker built for
  ## the average falls over in the evening. Empty takes the researched 2.0.
  peak_factor: ""
  ## Average event size in bytes, which is what decides ClickHouse rows a second.
  avg_event_bytes: ""
  ## Uncompressed bytes in to compressed bytes on disk. Empty takes the
  ## conservative 5, which is the largest unmeasured line in the disk estimate.
  compression_ratio: ""
  ## Days of recent data the hunts read, which is what the ClickHouse RAM band
  ## applies to. Empty takes one day.
  hunt_window_days: ""
  ## Extra hours of dfe-archiver lag carried on top of the consumer-downtime
  ## assumption, which together set Kafka retention.
  archiver_lag_hours: ""
  ## Monthly on-demand spend above which the report warns. Empty never warns.
  spend_warn_usd_month: ""
  ## On-prem only: converge anyway when the real nodes are smaller than the
  ## requirements table demands, with the warning stated in the report.
  allow_undersized: "false"
  ## ClickHouse storage model override. auto (the default) leaves the choice
  ## to the chart: cached-object when an objectStore.endpoint is configured
  ## (always on a populated cloud, on-prem too once a MinIO or S3-compatible
  ## endpoint is supplied), local otherwise. cached-object forces the object
  ## store and refuses to render with no endpoint set. local forces local
  ## storage even with an endpoint configured -- the deploy pipeline still
  ## carries the endpoint through, so a later switch stays possible, but that
  ## switch is a data migration, not a values edit. See
  ## docs/deployment/storage.md.
  storage_model: auto   # auto | cached-object | local
  ## Values set BY HAND, per workload, over whatever the ratios derived. Every
  ## field is optional and every one still goes through the storage-cap
  ## assertions -- an override is a different answer, not an exemption. Workloads:
  ## eks-system, general, kafka-broker, kraft-controller, clickhouse, keeper,
  ## ci-burst, msk-broker, toolbox.
  overrides: {}
  # overrides:
  #   kafka-broker:
  #     cpu: 16              # vCPU a broker, replacing the derived requirement
  #     memory: 64           # GiB a broker
  #     disk_gb: 2000        # the broker log volume, in GiB
  #     replicas: 6          # how many brokers, replacing the derived count
  #     instance_type: m9g.4xlarge  # refused unless every target zone offers it
  #     iops: 6000           # provisioned IOPS on the data volume
  #     throughput_mibs: 750 # provisioned MiB/s on the data volume

## KAFKA -- who runs the brokers. strimzi and redpanda run inside the cluster and
## tofu creates nothing for them; msk, confluent-cloud and redpanda-cloud are the
## managed bodies the aws root creates. num_partitions, log_retention_ms and
## message_max_bytes below are read for WHICHEVER of the three is selected --
## every managed body applies the same canonical profile
## (terraform/modules/managed-kafka/CONTRACT.md) -- but the rest of the msk:
## block (shape_ref, broker_count, broker_version, scram_username,
## bootstrap_job) is msk-only: the two SaaS bodies size, version and tune the
## cluster themselves and take no block of their own. The same token is the
## last segment of the credential's store key (<project>/<env>/kafka/<provider>),
## which is how the kafka chart reads the password back.
kafka:
  # strimzi | redpanda | msk | confluent-cloud | redpanda-cloud. DOCUMENTATION
  # ONLY below, not yet resolved by the sizing overlay: the provider-by-tier
  # default the resolver's aws overlay (sizing/targets/aws.yaml) is expected to
  # apply once it picks this up is msk at Small and Medium, confluent-cloud at
  # Large -- that file is in flight elsewhere, so this stays a comment until it
  # lands there.
  provider: strimzi
  msk:
    shape_ref: msk-broker     # indexes shapes/resolved/<cloud>-<region>.json
    broker_count: 3           # >= 3, and a multiple of the zone count
    ## The BROKER version, in MSK's own spelling, and defaulted nowhere: the
    ## newest ACTIVE one is read from the vendor at build time, because a default
    ## rots into a deprecated line silently. (`version:` above is the DFE stack
    ## pin -- a different thing entirely.)
    broker_version: 4.2.x.kraft
    num_partitions: 12            # NOT yet wired to the chart's own partition count at these defaults (kafka.external.numPartitions) -- see helm/charts/kafka/values.yaml
    log_retention_ms: 259200000   # three days in front of the archiver
    message_max_bytes: 16777216   # 16 MiB, the one size the whole chain carries
    scram_username: dfe-kafka-user  # matches the kafka chart's user.name
    ## The in-cluster Job that pre-creates the landing topics and writes the
    ## first ACLs -- the one thing tofu cannot do, because Kafka ACLs live in the
    ## data plane. namespace is where the kafka app is deployed
    ## (argocd/appsets/layer2-data.yaml); bootstrap.sh and that appset wire
    ## mode=external and this broker's bootstrapIam onto the chart automatically
    ## for kafka.provider: msk, so service_account only needs to match what the
    ## tofu root's Pod Identity association names -- an identity bound to a name
    ## nothing renders grants nothing, silently.
    bootstrap_job:
      namespace: strimzi
      service_account: dfe-kafka-bootstrap
    ## The broker-count scaler: a CloudWatch alarm on cluster-wide BytesInPerSec
    ## driving a Lambda that raises the broker count (MSK Express has no native
    ## equivalent -- UpdateBrokerCount is a manual API with no scaling policy of
    ## its own). Every field is optional; a value left blank takes the module's
    ## own default (terraform/modules/managed-kafka/msk/variables.tf), so an
    ## operator only ever states what they want to CHANGE.
    autoscaling:
      enabled: "true"          # the off switch, never an on switch
      max_brokers: 6           # the ceiling; must be >= broker_count and a multiple of the zone count
      step: ""                 # brokers added per scale-out; empty takes the zone count
      per_broker_capacity_mb_s: 50  # the resolved broker shape's published network throughput
      headroom: 1.3            # multiplies broker_count x per_broker_capacity_mb_s for the alarm threshold; must be > 1
  ## Topics tofu pre-creates for a managed body with NO bootstrap Job
  ## (confluent-cloud, redpanda-cloud) -- msk needs none here, since its Job
  ## above creates the same topics the chart's Strimzi path does. dfe-loader
  ## treats a missing *_land topic as fatal, so main_land is the floor every
  ## provider needs; an empty map ({}) takes num_partitions/log_retention_ms
  ## above, and a topic may override either:
  ##   landing_topics:
  ##     main_land: {}
  ##     okta_land:
  ##       partitions: 24
  landing_topics:
    main_land: {}

## Where the tofu state lives. The store is created once per account by
## terraform/environments/<cloud>-state, before the first plan here.
state:
  bucket: ""                 # from the <cloud>-state root's output
  key: dfe/test/aws.tfstate  # unique per deployment -- two sharing one key destroy each other
  region: ""                 # the state store's own region

## GOVERNANCE TAGS, applied to every taggable cloud resource. The seventh key
## the roots demand, iac-source, names the root that created the resource and
## the renderer writes it. owner and cost-center have no safe default, and the
## plan refuses any of the seven left empty.
tags:
  service-name: dfe
  service-namespace: dfe
  environment: test          # dev | test | staging | prod | customer-<id>
  owner: ""                  # the team or address answerable for the spend
  cost-center: ""            # whatever your finance side reconciles against
  lifecycle: ephemeral       # ephemeral | persistent

## Image registry hosting the published dfe-* images.
registry: ghcr.io/hyperi-io

## VERSION dial: pin XOR track. Pinned is the default and the safe production
## choice -- `version.pin` names a whole certified stack, which `dfe-stack render`
## expands into the per-component version set. track-latest is the opt-in daemon
## roll to the newest certified stack tag.
version:
  pin: 2.2.0-rc.13
  # track: latest
  # allow_prerelease: "false"

## SHAPE. The deploy profile (== dfe-ops --mode) selects the service set + the
## resource envelope.
##   slim   -- gRPC, no Kafka, single-node ClickHouse (smallest).
##   single -- one node of everything WITH Kafka (non-operator broker).
##   scale  -- HA: operator ClickHouse cluster + Strimzi Kafka.
profile: single

## STEPS -- which stages run. dev/BYO deploys skip provision; a marketplace
## greenfield runs all. Values are strings so the wizard writes them plainly.
steps:
  provision: "false"
  layer1: "true"
  layer2: "true"
  ddl: "true"
  smoke: "true"

## SECRETS -- REFERENCES only, never values. The backend + base path; the thin
## caller resolves the real values from here and injects the registry pull creds
## and the OpenBao AppRole id into the rendered env. `render_dial.py` never reads
## or writes a secret.
## backend also reaches bootstrap.sh as DFE_SECRETS_BACKEND: on openbao it
## requires DFE_VAULT_ADDR + DFE_VAULT_ROLE_ID and seeds an AppRole SecretID, on
## aws-sm it requires neither and the store authenticates by the pod's own
## identity. ref is the path prefix every reference hangs off -- optional, and
## empty means the deployment's own <project>/<env> path with nothing above it.
secrets:
  backend: openbao           # file | openbao | eso | aws-sm | gcp-sm | azure-kv
  ref: kv/services           # base path; the value (which path) is estate context

## OVERLAY -- optional private-context ref (fleet-scale ops, per-env config repo).
## Blank in the committed template; its value points at a private repo.
overlay: ""

## RETENTION -- the deployment-wide TTL for every time-series table DFE deploys,
## the OTel tables included. Whole days; 0 disables the default TTL. A source, or
## a dfe-schemas definition, that declares its own TTL overrides it. Read by both
## substrates: k8s -> DFE_CLICKHOUSE_DEFAULT_TTL_DAYS, docker-vm the same key.
retention:
  default_ttl_days: 90

## ---------------------------------------------------------------------------
## docker-vm SLICE -- consumed by dfe-docker's render_dial. Field names match
## that repo's dial exactly, so one maintained dial slices to both substrates.
## Ignored by the k8s renderer.
## ---------------------------------------------------------------------------
docker:
  kafka_backend: redpanda    # redpanda | apache
  kafbat_enabled: "true"
  core_enabled: "true"
  hyperdx_enabled: "false"
  post_enabled: "true"
  bind_host: 127.0.0.1       # operator surface (0.0.0.0 only on an exposed box)
  ingress_bind_host: 0.0.0.0 # user ingest surface
  # profile: default         # overrides the top-level profile for docker-vm only

## ---------------------------------------------------------------------------
## k8s SLICE -- consumed by this repo's render_dial. Each field maps to one DFE_*
## key in the env file dfe-ops reads (bootstrap/.env). The cloud-swap knobs are
## the DeployContext seam expressed as dial fields -- change the cloud, change
## these, everything else is the same orchestrator.
## ---------------------------------------------------------------------------
k8s:
  env: local                 # DFE_ENV
  cloud: local               # DFE_CLOUD -- local | aws | gcp | azure | rancher
  region: local              # DFE_REGION
  domain: ""                 # DFE_DOMAIN -- estate, blank in template
  storage_class: local-path  # DFE_STORAGE_CLASS -- local-path | gp3 | standard-rwo | managed-csi
  repo_url: ""               # DFE_REPO_URL -- this repo's URL (dfe-infra); private until GA, so DFE_REPO_TOKEN is required, estate
  target_revision: main      # DFE_TARGET_REVISION -- the ref under deployment (versionSet ref)
  workload_identity_annotations: "{}"  # DFE_WORKLOAD_IDENTITY_ANNOTATIONS -- IRSA / WI, cloud
  ## Cloud-swap knobs. Blank = the cluster/chart default (local-path, ClusterIP).
  ## Set per cloud (see the AWS worked example below). These layer onto the
  ## per-cloud argocd/values/<cloud>.yaml the chart already carries.
  load_balancer_type: ""     # e.g. nlb (AWS), "" for the default Service type
  config_storage: ""         # e.g. s3 (AWS), "" for in-cluster config storage

## ---------------------------------------------------------------------------
## CLOUD worked example -- AWS. The genericised swap: to move this deployment to
## AWS you set target.provision.cloud: aws (or point target.existing at an EKS
## kubeconfig) and copy these values up into the k8s slice. Every one of them is
## a single field / values / module swap -- no new code path. gcp/azure follow
## the same shape against argocd/values/{gcp,azure}.yaml.
## ---------------------------------------------------------------------------
# cloud_aws:
#   cloud: aws
#   region: ap-southeast-2
#   storage_class: gp3
#   load_balancer_type: nlb
#   config_storage: s3
#   # secrets.backend: aws-sm    # AWS Secrets Manager via ESO instead of OpenBao

## ENDPOINTS -- estate-specific, BLANK in the committed template. Injected by
## hyperi-infra's thin caller from OpenBao at deploy time, or set by hand. Left
## empty, the in-cluster service DNS defaults in argocd/values/common.yaml apply.
endpoints:
  clickhouse_host: ""        # DFE_CLICKHOUSE_HOST
  kafka_bootstrap: ""        # DFE_KAFKA_BOOTSTRAP (empty in slim -- gRPC transport)
  otel_endpoint: ""          # DFE_OTEL_ENDPOINT
  vault_addr: ""             # DFE_VAULT_ADDR -- the OpenBao address for this estate
