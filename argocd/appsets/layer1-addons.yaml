# IMPORTANT: Chart versions in this file MUST match versions.yaml (the SSOT).
# When updating versions, change versions.yaml first, then update this file to match.
# Wave 2-3: cert-manager (adopted), ESO (adopted), Envoy Gateway, KEDA,
# metrics-server, VPA, Reloader, CNPG operator, Strimzi operator, ClickHouse operator.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer1-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                - chart: cert-manager
                  repo: https://charts.jetstack.io
                  version: "v1.17.2"
                  namespace: cert-manager
                  wave: "2"
                  appProject: infra
                - chart: external-secrets
                  repo: https://charts.external-secrets.io
                  version: "0.17.0"
                  namespace: external-secrets
                  wave: "2"
                  appProject: infra
                - chart: envoy-gateway
                  repo: oci://docker.io/envoyproxy/gateway-helm
                  version: "v1.4.0"
                  namespace: envoy-gateway-system
                  wave: "2"
                  appProject: infra
                - chart: external-dns
                  repo: https://kubernetes-sigs.github.io/external-dns/
                  version: "1.14.3"
                  namespace: external-dns
                  wave: "2"
                  appProject: infra
                - chart: keda
                  repo: https://kedacore.github.io/charts
                  version: "2.14.0"
                  namespace: keda
                  wave: "3"
                  appProject: infra
                - chart: metrics-server
                  repo: https://kubernetes-sigs.github.io/metrics-server/
                  version: "3.12.0"
                  namespace: kube-system
                  wave: "3"
                  appProject: infra
                - chart: stakater-reloader
                  repo: https://stakater.github.io/stakater-reloader
                  version: "1.1.0"
                  namespace: reloader
                  wave: "3"
                  appProject: infra
                - chart: cnpg
                  repo: https://cloudnative-pg.github.io/charts
                  version: "0.27.1"
                  namespace: cnpg-system
                  wave: "3"
                  appProject: infra
                - chart: strimzi-kafka-operator
                  repo: https://strimzi.io/charts/
                  version: "0.50.1"
                  namespace: strimzi
                  wave: "3"
                  appProject: infra
                - chart: clickhouse-operator
                  repo: https://docs.altinity.com/clickhouse-operator/
                  version: "0.23.0"
                  namespace: clickhouse-operator
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          valuesObject:
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
