# Layer 1 addons: KEDA, metrics-server, Reloader, the DocumentDB operator, and
# external-dns where the cluster declares a DNS provider.
# Chart versions MUST match versions.yaml (the SSOT).
# Envoy Gateway uses OCI and is deployed as a standalone app in bootstrap/.
#
# OWNERSHIP (dedup fix, dfe-infra#4): cert-manager + external-secrets are
# detect-or-installed by bootstrap.sh -- they are needed BEFORE Argo (ESO backs
# the ClusterSecretStore + repo creds; cert-manager backs the gateway certs and the
# AWS load balancer controller's webhook certificate). They
# are deliberately NOT listed here, else Argo installs a SECOND copy alongside the
# bootstrap one (two ESO cert-controllers + two cert-manager cainjectors churning
# ~0.8 core, and double-reconciling every CR). bootstrap owns cert-manager+ESO;
# Argo owns the rest.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer1-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                # cert-manager + external-secrets intentionally absent -- bootstrap
                # owns them (see header). Adding them here re-introduces the dup.
                # chartValues is merged into helm.valuesObject below. goTemplate
                # runs with missingkey=error, so every element must carry the key.
                # chartDigest is empty unless versions.yaml pins the chart's OCI
                # digest under services-digests.
                # external-dns is absent too, and gated below on the cluster's
                # declared DNS provider.
                - chart: keda
                  repo: https://kedacore.github.io/charts
                  version: "2.21.0"
                  chartDigest: ""
                  namespace: keda
                  wave: "3"
                  appProject: infra
                  # Scaler value, active flag and error counters pushed to the
                  # collector gateway over OTLP, rather than exposed for scraping
                  # via prometheus.operator.enabled.
                  # Port 4318, not 4317: KEDA's exporter speaks OTLP/HTTP and POSTs
                  # to /v1/metrics, so the gRPC port answers with a frame it cannot
                  # parse ("malformed HTTP response").
                  # The uri needs its scheme; a bare host:port is an invalid URI.
                  # OTEL_SERVICE_NAME because KEDA sets no service.name of its
                  # own, so the Go SDK falls back to `unknown_service:keda` and
                  # every KEDA series groups under that instead of the operator.
                  chartValuesYaml: |
                    opentelemetry:
                      operator:
                        enabled: true
                      collector:
                        uri: http://dfe-otel-collector-gateway.otel.svc.cluster.local:4318
                    env:
                      - name: OTEL_SERVICE_NAME
                        value: keda
                - chart: metrics-server
                  repo: https://kubernetes-sigs.github.io/metrics-server/
                  version: "3.14.0"
                  chartDigest: ""
                  namespace: kube-system
                  wave: "3"
                  appProject: infra
                  chartValuesYaml: ""
                - chart: reloader
                  repo: https://stakater.github.io/stakater-charts
                  version: "2.2.18"
                  chartDigest: ""
                  namespace: reloader
                  wave: "3"
                  appProject: infra
                  chartValuesYaml: ""
                # The operator behind HyperDX's document store (layer2-data's
                # documentdb). Its chart bundles CloudNativePG, which it requires
                # and installs into cnpg-system, and needs cert-manager, which
                # bootstrap installs first. OCI only, pinned by digest. The chart
                # composes repository:tag, so each tag carries its image digest.
                # CloudNativePG runs 1.29.3, the 1.29 line's last patch, over the
                # chart's 1.29.1: it fixes GHSA-x8c2-3p4r-v9r6, GHSA-w3gf-xc94-wvmj
                # and CVE-2026-84304. The EndpointSlice read it needs and the
                # bundled chart lacks is granted by helm/charts/documentdb.
                - chart: documentdb-operator
                  repo: ghcr.io/documentdb
                  version: "1.0.0"
                  chartDigest: "sha256:6325eccd12db73ad2b3ffd2df294c79187c0521fb31b1f9a1c3061fa89f35114"
                  namespace: documentdb-operator
                  wave: "3"
                  appProject: infra
                  chartValuesYaml: |
                    image:
                      documentdbk8soperator:
                        tag: "1.0.0@sha256:9d433fd486ac49de79565318e573de08ff67e8819d2f4a955f43dee6db8a5e14"
                      sidecarinjector:
                        tag: "1.0.0@sha256:53942efe095ebff72f6332c02d478476183bb5763885f870ac485a0d5e8d29e5"
                    operator:
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          memory: 256Mi
                    sidecarInjector:
                      resources:
                        requests:
                          cpu: 50m
                          memory: 64Mi
                        limits:
                          memory: 128Mi
                    cloudnative-pg:
                      # The chart's own value, stated because the network policies
                      # admit this namespace (operatorNamespaces.cnpg).
                      namespaceOverride: cnpg-system
                      image:
                        tag: "1.29.3@sha256:cc0594bd9fd8cdd654dfbd91e4cf2c8fc1bfc4e3a09c4a90a2ab4ffc524f1db5"
                      resources:
                        requests:
                          cpu: 100m
                          memory: 256Mi
                        limits:
                          memory: 512Mi
                # strimzi-kafka-operator (Kafka substrate) and clickhouse-operator
                # (clickhouse.com CRDs) are cluster-only operators: deployed in the
                # scale profile via appsets/layer-scale.yaml (cluster-label gated).
                # slim + single CH use a plain StatefulSet -- no operator.
    # external-dns, deployed ONLY where the cluster declares a DNS provider it has
    # credentials for. The chart's own default provider is aws, so an
    # unconfigured install runs a controller that fails every minute against
    # Route 53 and publishes nothing (#223). Exists AND NotIn: a cluster secret
    # with no dns-provider label is excluded, because NotIn alone matches an
    # absent key.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/dns-provider
                    operator: Exists
                  - key: dfe.hyperi.io/dns-provider
                    operator: NotIn
                    values: ["none", ""]
          - list:
              elements:
                - chart: external-dns
                  repo: https://kubernetes-sigs.github.io/external-dns/
                  version: "1.23.0"
                  chartDigest: ""
                  namespace: external-dns
                  wave: "2"
                  appProject: infra
                  chartValuesYaml: ""
    # The two AWS-only controllers.
    #
    # The AWS Load Balancer Controller: a type=LoadBalancer Service annotated
    # aws-load-balancer-type: external is OWNED by this controller and sits at
    # "Ensuring load balancer" forever without it, because the annotation is
    # also what tells the in-tree cloud provider to keep its hands off. Wave 1
    # so it is running before any Service that names it.
    #
    # Karpenter: the node provisioner every pool outside the managed group comes
    # from. Wave 1 as well -- a workload scheduled before it is running has
    # nowhere to go but the managed group, which is sized for the cluster's own
    # controllers.
    #
    # Gated on the cluster's declared cloud, the same shape external-dns uses
    # above: Exists AND In, because NotIn/In alone matches an absent key.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/cloud
                    operator: Exists
                  - key: dfe.hyperi.io/cloud
                    operator: In
                    values: ["aws"]
          - list:
              elements:
                # imageTag and imageDigest are versions.yaml's
                # services.aws-load-balancer-controller-image pin, empty until a
                # stack pins it; the chart's own tag runs while they are.
                - chart: aws-load-balancer-controller
                  repo: https://aws.github.io/eks-charts
                  version: "3.6.2"
                  chartDigest: ""
                  imageTag: "v3.6.2"
                  imageDigest: "sha256:fd51f0ec82f8d357837aa57fdfaa4fca7137b75f25a09b421d95c425c9dc2d94"
                  namespace: kube-system
                  wave: "1"
                  appProject: infra
                  chartValuesYaml: ""
                # OCI, the only place Karpenter publishes -- same bare-host form
                # the clickhouse-operator entry in layer-scale.yaml uses. The
                # chart carries its own crds/ directory, which Argo renders and
                # applies with the release, so a CRD field added by an upgrade
                # arrives with the controller that reads it. Its values pin the
                # controller image by digest, so a chart digest pins both.
                - chart: karpenter
                  repo: public.ecr.aws/karpenter
                  version: "1.14.3"
                  chartDigest: "sha256:622aa6317b26c40d48237b3072ccb71a6ea09ff25ce5ee58c7c413d215a472a9"
                  namespace: kube-system
                  wave: "1"
                  appProject: infra
                  chartValuesYaml: ""
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      # A chartDigest switches the element to Argo's OCI source at that digest, the shape
      # layer2-apps.yaml deploys the thin charts with. Without one the chart comes from its
      # repository by version, and the empty chart and path below are dropped as unset.
      source:
        repoURL: '{{ if .chartDigest }}oci://{{ .repo }}/{{ .chart }}{{ else }}{{ .repo }}{{ end }}'
        chart: '{{ if not .chartDigest }}{{ .chart }}{{ end }}'
        path: '{{ if .chartDigest }}.{{ end }}'
        targetRevision: |-
          {{- if not .chartDigest -}}
          {{- .version -}}
          {{- else if hasPrefix "http" .repo -}}
          {{- fail (printf "%s comes from a classic chart repository, which serves no digest" .chart) -}}
          {{- else if not (regexMatch "^sha256:[0-9a-f]{64}$" .chartDigest) -}}
          {{- fail (printf "the chart digest pinned for %s is %q, not a sha256 digest" .chart .chartDigest) -}}
          {{- else -}}
          {{- .chartDigest -}}
          {{- end -}}
        helm:
          # `values` (a YAML string) rather than `valuesObject`: the ApplicationSet
          # template is parsed as YAML before it is Go-templated, so a structured
          # valuesObject cannot carry a per-element block. Inside this string the
          # generator's chartValuesYaml is plain text.
          values: |
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
            {{- if eq .chart "external-dns" }}
            provider:
              name: '{{ index .metadata.labels "dfe.hyperi.io/dns-provider" }}'
            # Named, not generated -- the same reason the two controllers below
            # name theirs. The chart derives the account name from the release,
            # which is external-dns-<cluster>, while the cluster module's Pod
            # Identity association names external-dns/external-dns; unmatched,
            # the controller gets no credential and logs a Route 53 401 every
            # minute while reporting Ready.
            serviceAccount:
              create: true
              name: external-dns
            # sync, not the chart's own upsert-only default: upsert-only never
            # removes a record it published, so a deleted Service or Ingress
            # leaves its DNS record behind for as long as the zone exists.
            # txtOwnerId must be unique per deployment, or two controllers
            # sharing a zone can delete records neither of them still owns.
            # '{{ .name }}' is the cluster generator's own field -- the Argo
            # cluster secret's stringData.name (bootstrap/templates/
            # cluster-secret.yaml.tpl, "dfe-${DFE_CLOUD}-${DFE_ENV}") -- and it
            # is present on every managed cluster regardless of cloud. The
            # dfe.hyperi.io/cluster_name annotation is AWS-only (blank on any
            # other cloud) and this generator's selector is not cloud-gated,
            # so reading it here would fail goTemplate's missingkey=error on
            # the day a second cloud declares a dns-provider.
            policy: sync
            # Held at the alpha prefix the gateway annotates with, so a sync cannot drop records.
            annotationPrefix: external-dns.alpha.kubernetes.io/
            txtOwnerId: '{{ .name }}'
            # The HTTP plane is Gateway API: the gateway chart renders Gateways
            # and HTTPRoutes and never an Ingress, so the chart's own
            # service+ingress default can publish no HTTPRoute hostname at all.
            # It has been working only because the gateway annotates its own
            # LoadBalancer Service with the hostname, which makes that one
            # annotation the single point of failure for every DFE hostname.
            # The chart grants the httproutes RBAC from this list, so naming
            # the source is the whole change.
            sources:
              - service
              - ingress
              - gateway-httproute
            # The Gateway admits routes from EVERY namespace, so with the route
            # source on, any namespace-scoped actor could otherwise attach an
            # HTTPRoute to the wildcard listener and have a resolvable, publicly
            # certificated name published under the deployment's own domain.
            # helm/edge/gateway marks every route it renders with this
            # annotation, and its own front-door Service alongside them --
            # external-dns applies the filter to Services as well as routes, so
            # an unmarked object of either kind is read by nothing.
            annotationFilter: dfe.hyperi.io/publish-dns=true
            {{- end }}
            {{- if eq .chart "aws-load-balancer-controller" }}
            # The EKS cluster's own name, not the name Argo registered the
            # cluster under -- the controller tags what it creates with
            # kubernetes.io/cluster/<name> and finds its subnets by that tag.
            clusterName: '{{ index .metadata.annotations "dfe.hyperi.io/cluster_name" }}'
            region: '{{ index .metadata.annotations "dfe.hyperi.io/region" }}'
            # IMDS is two hops from a pod, and the managed node groups keep the
            # hop limit at 1 -- so the controller is told its VPC here.
            vpcId: '{{ index .metadata.annotations "dfe.hyperi.io/vpc_id" }}'
            # Named, not generated. The chart would otherwise derive the account
            # name from the release name, and the cluster module's Pod Identity
            # association names kube-system/aws-load-balancer-controller.
            serviceAccount:
              create: true
              name: aws-load-balancer-controller
            # The service mutator webhook makes this controller the default for
            # EVERY new LoadBalancer Service and fails closed, so while the
            # controller is down no LoadBalancer Service can be created at all.
            # Off: the Services that want it say so by annotation.
            enableServiceMutatorWebhook: false
            # cert-manager issues the webhook's serving certificate and injects
            # its CA into the webhook configurations, so a re-render cannot split
            # the two: the chart's own default mints a new CA on every render.
            enableCertManager: true
            # A test run's id and expiry on every load balancer, target group and
            # security group the controller creates, which default_tags never
            # reaches; the annotation is absent outside a run. JSON keeps an
            # ISO expiry a quoted string rather than a YAML timestamp.
            {{- with index .metadata.annotations "dfe.hyperi.io/run_tags" }}
            defaultTags: {{ . | fromJson | toJson }}
            {{- end }}
            {{- if .imageDigest }}
            {{- if not .imageTag }}{{ fail "imageDigest is set for aws-load-balancer-controller with no imageTag" }}{{ end }}
            # The chart renders repository:tag, so the tag carries the digest the stack pins.
            image:
              tag: '{{ .imageTag }}@{{ .imageDigest }}'
            {{- end }}
            {{- end }}
            {{- if eq .chart "karpenter" }}
            settings:
              # The EKS cluster's own name. Karpenter tags what it launches with
              # it and refuses to start without it.
              clusterName: '{{ index .metadata.annotations "dfe.hyperi.io/cluster_name" }}'
              # The tofu names the interruption queue after the cluster, so there
              # is one annotation to carry rather than two. Left empty, Karpenter
              # drops interruption handling silently and a spot node goes away
              # with its pods still on it.
              interruptionQueue: '{{ index .metadata.annotations "dfe.hyperi.io/cluster_name" }}'
              # settings.clusterEndpoint is deliberately absent: the controller
              # asks EKS for it at startup, which is what its eks:DescribeCluster
              # grant is for.
            # Named, not generated. The chart would otherwise derive the account
            # name from the release, and the cluster module's Pod Identity
            # association names kube-system/karpenter.
            serviceAccount:
              create: true
              name: karpenter
            {{- end }}
            {{- with .chartValuesYaml }}{{ . | nindent 0 }}{{- end }}
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
