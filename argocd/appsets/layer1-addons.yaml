# Layer 1 addons: external-dns, KEDA, metrics-server, Reloader, CNPG operator.
# Chart versions MUST match versions.yaml (the SSOT).
# Envoy Gateway uses OCI and is deployed as a standalone app in bootstrap/.
#
# OWNERSHIP (dedup fix, dfe-infra#4): cert-manager + external-secrets are
# detect-or-installed by bootstrap.sh -- they are needed BEFORE Argo (ESO backs
# the ClusterSecretStore + repo creds; cert-manager backs the gateway certs). They
# are deliberately NOT listed here, else Argo installs a SECOND copy alongside the
# bootstrap one (two ESO cert-controllers + two cert-manager cainjectors churning
# ~0.8 core, and double-reconciling every CR). bootstrap owns cert-manager+ESO;
# Argo owns the rest.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer1-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                # cert-manager + external-secrets intentionally absent -- bootstrap
                # owns them (see header). Adding them here re-introduces the dup.
                - chart: external-dns
                  repo: https://kubernetes-sigs.github.io/external-dns/
                  version: "1.21.1"
                  namespace: external-dns
                  wave: "2"
                  appProject: infra
                - chart: keda
                  repo: https://kedacore.github.io/charts
                  version: "2.20.1"
                  namespace: keda
                  wave: "3"
                  appProject: infra
                - chart: metrics-server
                  repo: https://kubernetes-sigs.github.io/metrics-server/
                  version: "3.13.1"
                  namespace: kube-system
                  wave: "3"
                  appProject: infra
                - chart: reloader
                  repo: https://stakater.github.io/stakater-charts
                  version: "2.2.12"
                  namespace: reloader
                  wave: "3"
                  appProject: infra
                - chart: cloudnative-pg
                  repo: https://cloudnative-pg.github.io/charts
                  version: "0.28.3"
                  namespace: cnpg-system
                  wave: "3"
                  appProject: infra
                # strimzi-kafka-operator (Kafka substrate) and clickhouse-operator
                # (clickhouse.com CRDs) are cluster-only operators: deployed in the
                # scale profile via appsets/layer-scale.yaml (cluster-label gated).
                # Single/standard CH uses a plain StatefulSet -- no operator.
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          valuesObject:
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
