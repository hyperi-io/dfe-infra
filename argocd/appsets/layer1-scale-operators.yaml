# Platform (scale profile only): Kafka (Strimzi) + ClickHouse operators.
#
# These are PLATFORM operators needed before the scale-profile data layer's CRs
# (ClickHouseCluster, Kafka/KafkaNodePool) can reconcile. They deploy ONLY on
# clusters labelled dfe.hyperi.io/profile: scale; standard clusters lack the
# label so nothing is generated (single CH = plain StatefulSet, no operator;
# kafka disabled).
#
# The scale-profile WORKLOADS (transform services, Kafka/CH CRs, etc.) are
# PAYLOAD -- authored by dfe-engine into the deploy-repo, applied via the
# deploy-repo app-of-apps. They are NOT here. See the platform/payload split in
# the deployment architecture doc.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                - chart: strimzi-kafka-operator
                  repo: https://strimzi.io/charts/
                  version: "0.51.0"
                  namespace: strimzi
                  wave: "3"
                  appProject: infra
                # Official ClickHouse operator (clickhouse.com CRDs) -- cluster
                # mode only. Single mode uses a plain StatefulSet (no operator).
                # OCI chart; wave 3 so CRDs exist before the payload
                # ClickHouseCluster CR. Pinned 0.0.5 @sha256:bbdaf6f... .
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.5"
                  namespace: clickhouse-operator
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          valuesObject:
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
