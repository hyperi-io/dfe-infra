# Waves 4 and 6: ClickHouse, Kafka and the DocumentDB store at 4. OTel Collector, Kafbat and links at 6.
# HyperDX is an app: layer2-apps deploys it at wave 5. See docs/deployment/appsets.md#layer-2-data.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-data
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                - app: clickhouse-cluster
                  namespace: clickhouse
                  wave: "4"
                  appProject: data
                # The Strimzi operator is layer-scale.yaml's.
                # A DocumentDB CR, which the layer1 documentdb-operator (wave 3) turns into a CloudNativePG cluster.
                - app: documentdb
                  namespace: cnpg
                  wave: "4"
                  appProject: data
                # Wave 5 is dfe-engine (layer2-apps), which applies the schema. Wave 6 needs the otel tables it creates.
                - app: otel-collector
                  namespace: otel
                  wave: "6"
                  appProject: data
                # Mode-driven: nothing on slim, one non-operator broker on single, a cluster on scale.
                - app: kafka
                  namespace: strimzi
                  wave: "4"
                  appProject: data
                # Kafbat, the Kafka web UI, deploys with the broker on single and scale.
                - app: kafbat
                  namespace: kafka
                  wave: "6"
                  appProject: data
                # The links page, the one URL answering "where is everything?" (#75). Off with links.enabled=false.
                - app: links
                  namespace: links
                  wave: "6"
                  appProject: data
  template:
    metadata:
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      # Two sources: the base chart, then the deploy repo as ref values, layered last so a deployer's
      # clickhouse.mode, kafka.mode and storage model beat the tier defaults.
      # A cluster secret naming a ClickHouse bucket locks the bucket, region, storage model and cache placement in the inline values below.
      # On a bundled deploy these report ComparisonError until layer2-deploy-repo's Forgejo is up.
      sources:
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          path: 'helm/charts/{{ .app }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - "../../../argocd/values/common.yaml"
              - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # The resolver's Kafka and ClickHouse sizing from the deploy repo's sizing/. It sits under infra/, so a deployer's edit to a sized key wins. Optional.
              - '$values/sizing/{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.data-charts.values.yaml'
              # infra/common.yaml is the deployer's shared facts, infra/<chart>.yaml the per-chart overlay. Both optional.
              - '$values/infra/common.yaml'
              - '$values/infra/{{ .app }}.yaml'
            parameters:
              # Guarded as in layer2-apps: a missing annotation fails the render rather than pulling from Docker Hub.
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              # The namespace layer2-apps places the apps in, so data services and apps agree. kafka and documentdb project a credential into it.
              # Helm ignores it for the other charts.
              - name: appNamespace
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
              # A cluster fact: tracked overlays carry placeholders. links builds its gateway URLs from it.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # Every chart labels what it renders from these, and the chart defaults say local.
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              # strimzi or redpanda, and for msk the host list the collector scrapes. A managed provider reaches the charts as kafka.external.provider below.
              - name: kafka.provider
                value: '{{ $p := index .metadata.annotations "dfe.hyperi.io/kafka_provider" | default "strimzi" }}{{ if has $p (list "strimzi" "redpanda") }}{{ $p }}{{ else }}strimzi{{ end }}'
              - name: kafka.brokerHosts
                value: '{{ index .metadata.annotations "dfe.hyperi.io/kafka_broker_hosts" | default "" }}'
              # The provider's own logs for otel-collector. A blank flavour renders nothing.
              - name: clusterTelemetry.providerLogs.flavour
                value: '{{ index .metadata.annotations "dfe.hyperi.io/provider_logs_flavour" | default "none" }}'
              - name: clusterTelemetry.providerLogs.aws.region
                value: '{{ index .metadata.annotations "dfe.hyperi.io/region" | default "" }}'
              - name: clusterTelemetry.providerLogs.aws.eksAuditLogGroup
                value: '{{ index .metadata.annotations "dfe.hyperi.io/eks_audit_log_group" | default "" }}'
              - name: clusterTelemetry.providerLogs.aws.cloudTrailLogGroup
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloudtrail_log_group" | default "" }}'
              # Whether dfe-internal-ca exists. Without it clickhouse-cluster serves HTTP unless an issuerRef is named. Same parameter as layer2-apps.
              - name: clickhouse.tls.internalCA.present
                value: '{{ ne (index .metadata.labels "dfe.hyperi.io/edge" | default "true") "false" }}'
            # A string: the template is parsed as YAML before Go templating, so a conditional cannot be structured.
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- $kafkaBootstrap := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap" }}
              {{- $bootstrapIam := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap_iam" }}
              {{- $kafkaProvider := index .metadata.annotations "dfe.hyperi.io/kafka_provider" }}
              {{- $credentialRef := index .metadata.annotations "dfe.hyperi.io/kafka_credential_ref" | default "" }}
              {{- $managed := and $kafkaMode (eq $kafkaMode "external") }}
              {{- if or $kafkaMode $bootstrapIam }}
              # kafka.mode, the broker endpoint and the MSK bootstrap Job's own
              # IAM endpoint -- rendered ONLY when bootstrap.sh set the
              # annotation (a managed broker), so a strimzi/redpanda deploy's
              # kafka.mode stays exactly what its profile overlay says. The
              # mode reaches every chart in this appset, not the kafka chart
              # alone: kafbat and the collector resolve the same broker. Read
              # by the kafka chart's msk-bootstrap-job.yaml /
              # msk-bootstrap-rbac.yaml, which render only at mode=external +
              # provider=msk + a non-empty bootstrapIam.
              kafka:
                {{- if $kafkaMode }}
                mode: {{ $kafkaMode | quote }}
                {{- end }}
                {{- if and $managed $kafkaBootstrap }}
                # The profile overlay's bootstrapServers names an in-cluster
                # Service that does not exist on a managed broker, so the
                # managed endpoint replaces it rather than sitting beside it.
                bootstrapServers: {{ $kafkaBootstrap | quote }}
                {{- end }}
                {{- if or $bootstrapIam (and $managed (or $kafkaBootstrap $kafkaProvider)) }}
                external:
                  {{- if and $managed $kafkaProvider }}
                  # Names the managed broker to the kafka chart, which then
                  # projects its seeded credential into the app namespaces
                  # with the mechanism the provider table derives.
                  provider: {{ $kafkaProvider | quote }}
                  {{- end }}
                  {{- if and $managed $kafkaBootstrap }}
                  bootstrap: {{ $kafkaBootstrap | quote }}
                  {{- end }}
                  {{- if or $bootstrapIam (and $managed $credentialRef) }}
                  msk:
                    {{- if $bootstrapIam }}
                    bootstrapIam: {{ $bootstrapIam | quote }}
                    {{- end }}
                    {{- if and $managed $credentialRef }}
                    # The one copy of the SCRAM credential, MSK's own secret, which
                    # the apps' dfe-kafka-user is read from.
                    credentialRef: {{ $credentialRef | quote }}
                    {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
              {{- $clickhouseMode := index .metadata.annotations "dfe.hyperi.io/clickhouse_mode" | default "" }}
              {{- if eq $clickhouseMode "external" }}
              {{- $chHost := index .metadata.annotations "dfe.hyperi.io/clickhouse_host" }}
              {{- $chPort := index .metadata.annotations "dfe.hyperi.io/clickhouse_port" }}
              {{- $chUser := index .metadata.annotations "dfe.hyperi.io/clickhouse_user" }}
              # The deployer's own server, whose certificate the system roots verify, so no CA copy is named.
              clickhouse:
                mode: external
                host: {{ $chHost | quote }}
                port: {{ $chPort }}
                nativePort: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_native_port" }}
                user: {{ $chUser | quote }}
                tls:
                  enabled: {{ eq (index .metadata.annotations "dfe.hyperi.io/clickhouse_secure" | default "") "true" }}
                  port: {{ $chPort }}
                  ca:
                    secretName: ""
                    configMapName: ""
                external:
                  host: {{ $chHost | quote }}
                  port: {{ $chPort }}
                  user: {{ $chUser | quote }}
              {{- else if eq .app "clickhouse-cluster" }}
              {{- /* Inline values beat every deploy-repo file, so nothing here is written without a
              bucket: a deploy-repo overlay's own endpoint, on-prem MinIO say, then stands. */}}
              {{- /* clickhouse.objectStore.endpoint: the aws root's bucket, and the one region its disk signs for. */}}
              {{- with index .metadata.annotations "dfe.hyperi.io/clickhouse_object_store_endpoint" | default "" }}
              {{- $clickhouse := dict }}
              {{- /* clickhouse.storageModel and the cache placement land with the bucket or not at all: an instance-store cache needs one to front. */}}
              {{- with index $.metadata.annotations "dfe.hyperi.io/clickhouse_storage" | default "" }}
              {{- $clickhouse = mustFromJson . }}
              {{- end }}
              {{- $objectStore := get $clickhouse "objectStore" | default (dict) }}
              {{- $_ := set $objectStore "endpoint" . }}
              {{- with index $.metadata.annotations "dfe.hyperi.io/region" | default "" }}
              {{- $_ := set $objectStore "region" . }}
              {{- end }}
              {{- $_ := set $clickhouse "objectStore" $objectStore }}
              clickhouse:
                {{- toYaml $clickhouse | nindent 2 }}
              {{- end }}
              {{- end }}
              {{- if or (eq .app "kafka") (eq .app "clickhouse-cluster") }}
              {{- with index .metadata.annotations "dfe.hyperi.io/node_pools" | default "" }}
              {{- $dedicated := list }}
              {{- range $name, $pool := get (mustFromJson .) "classes" | default dict }}
              {{- if get $pool "taints" }}
              {{- $dedicated = append $dedicated $name }}
              {{- end }}
              {{- end }}
              {{- if $dedicated }}
              # The tainted pools on the cluster secret, which each data workload
              # then requires. A cluster secret naming none adds no requirement.
              nodeScheduling:
                dedicatedPools: {{ $dedicated | toJson }}
              {{- end }}
              {{- end }}
              {{- end }}
              {{- $pullSecret := index .metadata.annotations "dfe.hyperi.io/image_pull_secret" | default "" }}
              {{- if $pullSecret }}
              # Only the secret bootstrap.sh created. An absent annotation names none: images pull anonymously.
              imagePullSecrets:
                - {{ $pullSecret | quote }}
              {{- end }}
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      # KEDA owns the broker KafkaNodePool's replicas once the kafka chart renders its ScaledObject, so selfHeal must not revert a scale-out. See docs/deployment/kafka/autoscaling.md.
      ignoreDifferences:
        - group: kafka.strimzi.io
          kind: KafkaNodePool
          jqPathExpressions:
            - 'select(.metadata.labels["dfe.hyperi.io/replicas-owner"] == "keda") | .spec.replicas'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: '{{ if eq .namespace "otel" }}privileged{{ else }}baseline{{ end }}'
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
