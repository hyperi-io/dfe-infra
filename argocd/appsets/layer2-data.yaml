# Wave 4: ClickHouse cluster, Strimzi Kafka, FerretDB (with its own DocumentDB
# PostgreSQL backend). Wave 6: OTel Collector, Kafbat, links.
# HyperDX is an app, not substrate: layer2-apps deploys it at wave 5 from the
# deploy repo's values/hyperdx-<instance>-values.yaml, like every other app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-data
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                - app: clickhouse-cluster
                  namespace: clickhouse
                  wave: "4"
                  appProject: data
                # strimzi-kafka is Kafka substrate: deployed only in the scale
                # profile via appsets/layer-scale.yaml (cluster-label gated).
                - app: ferretdb
                  namespace: cnpg
                  wave: "4"
                  appProject: data
                # Wave 5 is dfe-engine, deployed from layer2-apps: it is the only
                # thing that applies schema, and it does it at its own startup.
                # Wave 6: needs its otel tables, which dfe-engine creates.
                - app: otel-collector
                  namespace: otel
                  wave: "6"
                  appProject: data
                # NOTE: the in-cluster git server (forgejo) is NOT substrate.
                # It is the deploy-repo FALLBACK, deployed ONLY when no external git
                # (GitHub/GitLab) is supplied -- see appsets/layer2-deploy-repo.yaml,
                # gated on the dfe.hyperi.io/bundled-deploy-repo cluster label. The
                # deploy repo is a seam (external git PRIMARY); never a hard dep.
                # Kafka substrate -- mode-driven: disabled on slim -> nothing;
                # non-operator single broker on single; cluster on scale. The
                # cluster (scale) path with provider strimzi (default) needs the
                # Strimzi operator (installed scale-only via layer-scale).
                - app: kafka
                  namespace: strimzi
                  wave: "4"
                  appProject: data
                # Kafbat (Kafka web UI) -- bundled by DEFAULT with the kafka
                # substrate (single + scale). After the broker.
                - app: kafbat
                  namespace: kafka
                  wave: "6"
                  appProject: data
                # Deployment links page -- the one well-known URL answering
                # "where is everything?" (dfe-infra#75). Bundled by default;
                # gate off with links.enabled=false in a values overlay. The
                # default page needs no deployment values (standard
                # port-forward layout); deployments append/override via the
                # chart's page values.
                - app: links
                  namespace: links
                  wave: "6"
                  appProject: data
  template:
    metadata:
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      # Multi-source, the same shape layer2-apps uses: source 1 = the pinned
      # dfe-infra base chart, source 2 = the deploy repo (ref: values). The
      # deploy-repo overlay is layered LAST, so a deployer's clickhouse.mode,
      # kafka.mode and storage model beat the profile file's tier defaults and
      # the resolver's sizing without editing dfe-infra. The one exception is a
      # cluster secret that names a ClickHouse bucket: then the inline values
      # below lock the bucket, its region and whatever storage model and cache
      # placement the resolver decided, and the overlay cannot move them.
      #
      # Substrate therefore depends on the deploy repo resolving. On a bundled
      # deploy the git host is layer2-deploy-repo's own single-source Application,
      # so these report ComparisonError until it is up and then converge.
      sources:
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          path: 'helm/charts/{{ .app }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - "../../../argocd/values/common.yaml"
              - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # The resolver's Kafka and ClickHouse sizing, as the deploy repo's
              # sizing/ holds it. It sits under the infra/ files below, so a
              # deployer's or the engine's edit to a sized key wins. A bundled
              # deploy repo is seeded with it in its first commit, and an
              # external one carries the resolver's sizing/ as committed.
              # Optional, like both below.
              - '$values/sizing/{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.data-charts.values.yaml'
              # infra/common.yaml is the deployer's own common.yaml -- shared
              # facts declared once and read by every appset; infra/<chart>.yaml
              # is the per-chart overlay. Both optional.
              - '$values/infra/common.yaml'
              - '$values/infra/{{ .app }}.yaml'
            parameters:
              # The registry every dfe-* image is pulled from -- otel-collector
              # renders one -- guarded exactly as in layer2-apps: a missing
              # annotation fails the render rather than sending the image to
              # Docker Hub, which publishes none.
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              # Where the DFE apps run -- the SAME annotation layer2-apps places them
              # with, so the data services and apps cannot disagree about the
              # namespace. kafka and ferretdb read it (each projects a credential
              # into the app namespace); Helm ignores an unused value, so passing
              # it to every data chart is harmless.
              - name: appNamespace
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
              # The deployment's own domain (bootstrap sets the annotation from
              # DFE_DOMAIN). The tracked values overlays carry only placeholder
              # domains; the real one is a cluster fact. Consumed by links for
              # its gateway-first URLs; harmless elsewhere.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # The deployment's own posture and cloud. Every chart labels what
              # it renders from these and the chart defaults say local, so
              # without them a cloud deployment's objects claim to be a local
              # one and anything selecting on those labels misses.
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              # Who runs the brokers, and (msk only) their bare host list -- the
              # otel-collector chart's MSK open_monitoring scrape needs both, to
              # decide whether to render the job and what to target. Only
              # otel-collector reads either; harmless elsewhere.
              - name: kafka.provider
                value: '{{ index .metadata.annotations "dfe.hyperi.io/kafka_provider" | default "strimzi" }}'
              - name: kafka.brokerHosts
                value: '{{ index .metadata.annotations "dfe.hyperi.io/kafka_broker_hosts" | default "" }}'
              # Whether dfe-internal-ca exists: the gateway chart that mints it is
              # deployed unless the edge label is "false" (layer2-edge.yaml, and
              # layer2-platform.yaml for a secret with no label, hence the "true"
              # default). Without it clickhouse-cluster serves HTTP unless an
              # issuerRef is named. Same parameter in layer2-apps.yaml, so both
              # ends agree on the scheme.
              - name: clickhouse.tls.internalCA.present
                value: '{{ ne (index .metadata.labels "dfe.hyperi.io/edge" | default "true") "false" }}'
            # `values` (a YAML string) rather than a structured parameters block,
            # same reason layer2-platform.yaml gives: a per-element conditional
            # cannot live in a field this file's own tests parse as plain YAML
            # before any Go templating runs.
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- $kafkaBootstrap := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap" }}
              {{- $bootstrapIam := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap_iam" }}
              {{- $kafkaProvider := index .metadata.annotations "dfe.hyperi.io/kafka_provider" }}
              {{- $credentialRef := index .metadata.annotations "dfe.hyperi.io/kafka_credential_ref" | default "" }}
              {{- $managed := and $kafkaMode (eq $kafkaMode "external") }}
              {{- if or $kafkaMode $bootstrapIam }}
              # kafka.mode, the broker endpoint and the MSK bootstrap Job's own
              # IAM endpoint -- rendered ONLY when bootstrap.sh set the
              # annotation (a managed broker), so a strimzi/redpanda deploy's
              # kafka.mode stays exactly what its profile overlay says. The
              # mode reaches every chart in this appset, not the kafka chart
              # alone: kafbat and the collector resolve the same broker. Read
              # by the kafka chart's msk-bootstrap-job.yaml /
              # msk-bootstrap-rbac.yaml, which render only at mode=external +
              # provider=msk + a non-empty bootstrapIam.
              kafka:
                {{- if $kafkaMode }}
                mode: {{ $kafkaMode | quote }}
                {{- end }}
                {{- if and $managed $kafkaBootstrap }}
                # The profile overlay's bootstrapServers names an in-cluster
                # Service that does not exist on a managed broker, so the
                # managed endpoint replaces it rather than sitting beside it.
                bootstrapServers: {{ $kafkaBootstrap | quote }}
                {{- end }}
                {{- if or $bootstrapIam (and $managed (or $kafkaBootstrap $kafkaProvider)) }}
                external:
                  {{- if and $managed $kafkaProvider }}
                  # Names the managed broker to the kafka chart, which then
                  # projects its seeded credential into the app namespaces
                  # with the mechanism the provider table derives.
                  provider: {{ $kafkaProvider | quote }}
                  {{- end }}
                  {{- if and $managed $kafkaBootstrap }}
                  bootstrap: {{ $kafkaBootstrap | quote }}
                  {{- end }}
                  {{- if or $bootstrapIam (and $managed $credentialRef) }}
                  msk:
                    {{- if $bootstrapIam }}
                    bootstrapIam: {{ $bootstrapIam | quote }}
                    {{- end }}
                    {{- if and $managed $credentialRef }}
                    # The one copy of the SCRAM credential, MSK's own secret, which
                    # the apps' dfe-kafka-user is read from.
                    credentialRef: {{ $credentialRef | quote }}
                    {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
              {{- $clickhouseMode := index .metadata.annotations "dfe.hyperi.io/clickhouse_mode" | default "" }}
              {{- if eq $clickhouseMode "external" }}
              {{- $chHost := index .metadata.annotations "dfe.hyperi.io/clickhouse_host" }}
              {{- $chPort := index .metadata.annotations "dfe.hyperi.io/clickhouse_port" }}
              {{- $chUser := index .metadata.annotations "dfe.hyperi.io/clickhouse_user" }}
              # The deployer's own server, whose certificate the system roots verify, so no CA copy is named.
              clickhouse:
                mode: external
                host: {{ $chHost | quote }}
                port: {{ $chPort }}
                nativePort: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_native_port" }}
                user: {{ $chUser | quote }}
                tls:
                  enabled: {{ eq (index .metadata.annotations "dfe.hyperi.io/clickhouse_secure" | default "") "true" }}
                  port: {{ $chPort }}
                  ca:
                    secretName: ""
                    configMapName: ""
                external:
                  host: {{ $chHost | quote }}
                  port: {{ $chPort }}
                  user: {{ $chUser | quote }}
              {{- else if eq .app "clickhouse-cluster" }}
              {{- /* Inline values beat every deploy-repo file, so nothing here is written without a
              bucket: a deploy-repo overlay's own endpoint, on-prem MinIO say, then stands. */}}
              {{- /* clickhouse.objectStore.endpoint: the aws root's bucket, and the one region its disk signs for. */}}
              {{- with index .metadata.annotations "dfe.hyperi.io/clickhouse_object_store_endpoint" | default "" }}
              {{- $clickhouse := dict }}
              {{- /* clickhouse.storageModel and the cache placement land with the bucket or not at all: an instance-store cache needs one to front. */}}
              {{- with index $.metadata.annotations "dfe.hyperi.io/clickhouse_storage" | default "" }}
              {{- $clickhouse = mustFromJson . }}
              {{- end }}
              {{- $objectStore := get $clickhouse "objectStore" | default (dict) }}
              {{- $_ := set $objectStore "endpoint" . }}
              {{- with index $.metadata.annotations "dfe.hyperi.io/region" | default "" }}
              {{- $_ := set $objectStore "region" . }}
              {{- end }}
              {{- $_ := set $clickhouse "objectStore" $objectStore }}
              clickhouse:
                {{- toYaml $clickhouse | nindent 2 }}
              {{- end }}
              {{- end }}
              {{- $pullSecret := index .metadata.annotations "dfe.hyperi.io/image_pull_secret" | default "" }}
              {{- if $pullSecret }}
              # Only the secret bootstrap.sh created. An absent annotation names none: images pull anonymously.
              imagePullSecrets:
                - {{ $pullSecret | quote }}
              {{- end }}
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      # KEDA owns the broker KafkaNodePool's replica count (kafka-autoscaler.yaml),
      # so selfHeal must not revert a scale-out as drift -- the same
      # ignoreDifferences + RespectIgnoreDifferences=true pattern layer2-apps.yaml
      # uses for Deployment replicas. Inert for every other app in this
      # ApplicationSet's matrix: none of them render a KafkaNodePool.
      ignoreDifferences:
        - group: kafka.strimzi.io
          kind: KafkaNodePool
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
