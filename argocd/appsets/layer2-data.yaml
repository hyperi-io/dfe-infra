# Wave 4: CNPG PostgreSQL cluster, ClickHouse cluster, Strimzi Kafka, FerretDB, OTel Collector.
# HyperDX is deployed with dfe-ui at wave 5 (integrated into dfe-ui, not standalone).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-data
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                - app: cnpg-cluster
                  namespace: cnpg
                  wave: "4"
                  appProject: data
                - app: clickhouse-cluster
                  namespace: clickhouse
                  wave: "4"
                  appProject: data
                # strimzi-kafka is Kafka substrate: deployed only in the scale
                # profile via appsets/layer-scale.yaml (cluster-label gated).
                - app: ferretdb
                  namespace: cnpg
                  wave: "4"
                  appProject: data
                - app: otel-collector
                  namespace: otel
                  wave: "4"
                  appProject: data
                - app: gitea
                  namespace: gitea
                  wave: "4"
                  appProject: data
                # Kafka substrate -- mode-driven (disabled on standard -> nothing;
                # cluster on scale). Provider strimzi (default) needs the Strimzi
                # operator (installed scale-only via layer-scale).
                - app: kafka
                  namespace: strimzi
                  wave: "4"
                  appProject: data
  template:
    metadata:
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      sources:
        # Source 1: pinned dfe-infra base chart (the RO core: substrate machinery
        # + defaults). The deploy-repo overlay is layered LAST so the deployer's /
        # engine's substrate scaling (pod size, node/broker count) in
        # dfe-deploy/infra/ wins -- base defaults <- overlay. ignoreMissingValueFiles
        # so substrate runs on base defaults until the overlay is published.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          path: 'helm/charts/{{ .app }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - "../../../argocd/values/common.yaml"
              - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - '$values/infra/values.yaml'
              - '$values/infra/{{ .app }}-values.yaml'
        # Source 2: the per-env deploy-repo instance (overlay values only).
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
