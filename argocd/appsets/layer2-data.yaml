# Wave 4: CNPG PostgreSQL cluster, ClickHouse cluster, Strimzi Kafka, FerretDB, OTel Collector, HyperDX.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-data
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                - app: cnpg-cluster
                  namespace: cnpg
                  wave: "4"
                  project: data
                - app: clickhouse-cluster
                  namespace: clickhouse
                  wave: "4"
                  project: data
                - app: strimzi-kafka
                  namespace: strimzi
                  wave: "4"
                  project: data
                - app: ferretdb
                  namespace: ferretdb
                  wave: "4"
                  project: data
                - app: otel-collector
                  namespace: otel
                  wave: "4"
                  project: data
                - app: hyperdx
                  namespace: hyperdx
                  wave: "4"
                  project: data
  template:
    metadata:
      name: "{{app}}-{{name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: "{{project}}"
      source:
        repoURL: '{{metadata.annotations.dfe\.hyperi\.io/repo_url}}'
        targetRevision: '{{metadata.annotations.dfe\.hyperi\.io/target_revision}}'
        path: "helm/charts/{{app}}"
        helm:
          valueFiles:
            - "../../argocd/values/common.yaml"
            - '../../argocd/values/{{metadata.annotations.dfe\.hyperi\.io/cloud}}.yaml'
      destination:
        server: "{{server}}"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
