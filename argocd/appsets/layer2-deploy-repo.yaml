# Wave 4: in-cluster Forgejo deploy-repo FALLBACK.
#
# Deployed ONLY when no external git (GitHub/GitLab) is supplied -- gated on the
# cluster label dfe.hyperi.io/bundled-deploy-repo: "true" (bootstrap.sh sets it
# true when DFE_CONFIG_REPO_URL is unset). The deploy repo is a provider-agnostic
# seam (external git is PRIMARY, ~95%); Forgejo is the ~5% tyre-kicking/air-gapped
# fallback and is NEVER a hard dependency -- the substrate (layer2-data) does not
# depend on it. SINGLE source (base chart + profile/cloud values only): it hosts
# the config repo, so it must NOT itself reference the config repo (that was the
# self-dependency deadlock). Wave 4 so it is up before layer2-apps (wave 5) reads
# the deploy repo via its git-files generator.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-deploy-repo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
            dfe.hyperi.io/bundled-deploy-repo: "true"
  template:
    metadata:
      name: 'forgejo-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: data
      source:
        repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
        targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
        path: 'helm/charts/forgejo'
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "../../../argocd/values/common.yaml"
            - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
            - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: forgejo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
