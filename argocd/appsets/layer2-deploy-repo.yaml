# Wave 4: the in-cluster Forgejo deploy repo, deployed only where bootstrap set dfe.hyperi.io/bundled-deploy-repo.
# See docs/deployment/state-and-repos.md#the-repositories.
# Single source, because it hosts the config repo and must not reference it. Wave 4 so it is up before layer2-apps reads the deploy repo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-deploy-repo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
            dfe.hyperi.io/bundled-deploy-repo: "true"
  template:
    metadata:
      name: 'forgejo-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: data
      source:
        repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
        targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
        path: 'helm/charts/forgejo'
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "../../../argocd/values/common.yaml"
            - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
            - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
          # A string: the template is parsed as YAML before Go templating, so a conditional cannot be structured.
          values: |
            {{- $pullSecret := index .metadata.annotations "dfe.hyperi.io/image_pull_secret" | default "" }}
            {{- if $pullSecret }}
            # Only the secret bootstrap.sh created. An absent annotation names none: images pull anonymously.
            imagePullSecrets:
              - {{ $pullSecret | quote }}
            {{- end }}
      destination:
        server: '{{ .server }}'
        namespace: forgejo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
