# Wave 2: cluster platform config (network policy, the toolbox pod, node pools) as first-party charts.
# Generated here so a rebuild recreates them with the profile overlay and the domain.
# The public gateway belongs to the edge module: layer2-edge.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                - app: network-policies
                  namespace: default
                  wave: "2"
                  appProject: infra
                # Always deployed, not cloud-gated. The chart renders replicas: 0 and no RBAC until toolbox.pod.enabled says otherwise.
                - app: dfe-toolbox
                  namespace: default
                  wave: "2"
                  appProject: infra
    # envoy-gateway-config, until dfe-infra#342 moves it to layer2-edge.yaml.
    # A secret written before the edge module has no dfe.hyperi.io/edge key, so layer2-edge generates nothing for it.
    # DoesNotExist, not NotIn: edge set to false is a deliberate off, and NotIn would override it.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/edge
                    operator: DoesNotExist
          - list:
              elements:
                # Name and wave unchanged, so Argo adopts the live objects.
                - app: envoy-gateway-config
                  chart: edge/gateway
                  namespace: envoy-gateway-system
                  wave: "2"
                  appProject: infra
    # The node-pools chart: the NodePools and EC2NodeClasses workloads schedule onto. AWS-only, gated as layer1-addons
    # gates its AWS controllers. Wave 3, after the karpenter controller (wave 1).
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/cloud
                    operator: Exists
                  - key: dfe.hyperi.io/cloud
                    operator: In
                    values: ["aws"]
          - list:
              elements:
                # The Application keeps the name its live NodePools are tracked under.
                - app: karpenter-pools
                  chart: charts/node-pools
                  overlay: node-pools
                  namespace: kube-system
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      # app is the Application name and chart only its directory, so a moved chart keeps its tracking id.
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      # Two sources: the base chart, then the deploy repo as ref values, layered last.
      sources:
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          # index, not .chart: missingkey=error fails a field lookup on an element with no chart. Only a chart outside helm/charts states its directory.
          path: 'helm/{{ index . "chart" | default (printf "charts/%s" .app) }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - "../../../argocd/values/common.yaml"
              - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # What a resolver wrote for this app into the deploy repo's sizing/, such as the node-pools gated node image. Under infra/, so a deployer's value wins. Optional.
              - '$values/sizing/{{ index . "overlay" | default .app }}.values.yaml'
              # infra/common.yaml is the deployer's shared facts, infra/<app>.yaml the per-app overlay, keyed on the Application name. An element's overlay names the file instead. Both optional.
              - '$values/infra/common.yaml'
              - '$values/infra/{{ index . "overlay" | default .app }}.yaml'
            parameters:
              # Guarded as in layer2-apps: a missing annotation fails the render rather than pulling from Docker Hub.
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              # A cluster fact: tracked overlays carry placeholders.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # The address DNS already names. Empty lets the LB pool choose, which re-rolls it on a rebuild.
              - name: envoyGateway.service.loadBalancerIP
                value: '{{ index .metadata.annotations "dfe.hyperi.io/gateway_address" }}'
              - name: appNamespace
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
              # network-policies reads dfeNamespaces, not appNamespace. A policy aimed at an absent namespace is rejected, which fails the sync and leaves no policies.
              - name: dfeNamespaces[0]
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
              # Every chart here labels what it renders from these, and the chart defaults say local.
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              # envoy-gateway-config renders its git route only where layer2-deploy-repo.yaml deploys Forgejo, on this label.
              - name: deployRepo.bundled
                value: '{{ eq (index .metadata.labels "dfe.hyperi.io/bundled-deploy-repo") "true" }}'
              # The toolbox pod's dial facts, which bootstrap.sh carries onto the cluster secret. enabled and kubeApiAccess take Helm's
              # type inference (a real boolean, which the chart's validate.yaml requires). The three limits are forced to strings so a number is never coerced.
              - name: toolbox.pod.enabled
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_enabled" | default "false" }}'
              - name: toolbox.pod.kubeApiAccess
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_kube_api_access" | default "false" }}'
              - name: toolbox.pod.idleSeconds
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_idle_seconds" | default "" }}'
                forceString: true
              - name: toolbox.pod.idleWarnSeconds
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_idle_warn_seconds" | default "300" }}'
                forceString: true
              - name: toolbox.pod.ttlSeconds
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_ttl_seconds" | default "" }}'
                forceString: true
            # A string: the template is parsed as YAML before Go templating, so a conditional cannot be structured.
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- $kafkaProvider := index .metadata.annotations "dfe.hyperi.io/kafka_provider" | default "" }}
              {{- if $kafkaMode }}
              # network-policies derives its external-service egress from the
              # declared mode, so without this the baseline default-deny holds
              # and no pod can reach a managed broker at all. bootstrap.sh sets
              # the annotation only for msk, confluent-cloud and redpanda-cloud;
              # an in-cluster broker keeps the profile overlay's own kafka.mode
              # and renders no external egress. The provider picks the ports
              # that broker serves, in place of the generic listener range.
              kafka:
                mode: {{ $kafkaMode | quote }}
                {{- if and (eq $kafkaMode "external") $kafkaProvider }}
                external:
                  provider: {{ $kafkaProvider | quote }}
                {{- end }}
              {{- end }}
              {{- if eq (index .metadata.annotations "dfe.hyperi.io/clickhouse_mode" | default "") "external" }}
              # network-policies opens the ClickHouse clients' egress on the external server's own two ports.
              clickhouse:
                mode: external
              externalEgress:
                clickhouse:
                  ports:
                    - port: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_port" }}
                      protocol: TCP
                    - port: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_native_port" }}
                      protocol: TCP
              {{- end }}
              {{- /* dfe-engine writes Secrets Manager itself, so network-policies opens its secrets egress. */}}
              {{- if and (eq .app "network-policies") (index .metadata.annotations "dfe.hyperi.io/engine_secrets_prefix" | default "") }}
              secrets:
                provider: aws
              {{- end }}
              {{- $podCIDR := index .metadata.annotations "dfe.hyperi.io/pod_cidr" | default "" }}
              {{- $serviceCIDR := index .metadata.annotations "dfe.hyperi.io/service_cidr" | default "" }}
              {{- if or $podCIDR $serviceCIDR }}
              # The ranges the cloud root built the cluster with, inline so no deploy-repo overlay can restate them.
              networkModel:
                {{- if $podCIDR }}
                podCIDR: {{ $podCIDR | quote }}
                {{- end }}
                {{- if $serviceCIDR }}
                serviceCIDR: {{ $serviceCIDR | quote }}
                {{- end }}
              {{- end }}
              {{- if eq .app "karpenter-pools" }}
              {{- $pools := index .metadata.annotations "dfe.hyperi.io/node_pools" }}
              pools:
                aws:
                  # The three facts pools.aws.cluster.* names, carried onto the
                  # cluster secret by bootstrap.sh from the kubernetes-cluster
                  # module's `karpenter` output. Without them the chart's own
                  # guards refuse to render (helm/charts/node-pools/templates/karpenter/_karpenter.tpl).
                  cluster:
                    discoveryTag: {{ index .metadata.annotations "dfe.hyperi.io/karpenter_discovery_tag" | quote }}
                    instanceProfile: {{ index .metadata.annotations "dfe.hyperi.io/karpenter_instance_profile" | quote }}
                    kmsKeyId: {{ index .metadata.annotations "dfe.hyperi.io/karpenter_kms_key_id" | quote }}
                    # The registry cache's node script, base64. Absent renders no userData.
                    userData: {{ index .metadata.annotations "dfe.hyperi.io/node_user_data" | default "" | quote }}
                  # A test run's id and expiry, parsed for the same reason the pools
                  # are and re-emitted as JSON so an ISO expiry stays a string. The
                  # annotation is absent outside a run.
                  {{- with index .metadata.annotations "dfe.hyperi.io/run_tags" }}
                  tags: {{ . | fromJson | toJson }}
                  {{- end }}
                {{- if $pools }}
                {{- with $pools | fromJson }}
                # The renderer and the pool classes the resolver sized, carried
                # as one line of JSON on the cluster secret. Parsed rather than
                # spliced, so an annotation that is not JSON fails this render
                # instead of injecting arbitrary values into the Application.
                # Absent or empty beside the cluster facts, the chart fails the
                # render rather than leaving `classes: {}` for prune to act on.
                {{- toYaml . | nindent 2 }}
                {{- end }}
                {{- end }}
              {{- end }}
              {{- $pullSecret := index .metadata.annotations "dfe.hyperi.io/image_pull_secret" | default "" }}
              {{- if $pullSecret }}
              # Only the secret bootstrap.sh created. An absent annotation names none: images pull anonymously.
              imagePullSecrets:
                - {{ $pullSecret | quote }}
              {{- end }}
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      # The toolbox idle check scales the Deployment to zero under this field manager, and selfHeal must not revert it. Only the field that manager owns is ignored, so toggling toolbox.pod.enabled still syncs.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: dfe-toolbox
          managedFieldsManagers:
            - dfe-toolbox-idle
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: '{{ if has .namespace (list "kube-system" "default") }}privileged{{ else }}baseline{{ end }}'
            pod-security.kubernetes.io/warn: '{{ if has .namespace (list "kube-system" "default") }}privileged{{ else }}restricted{{ end }}'
            pod-security.kubernetes.io/audit: '{{ if has .namespace (list "kube-system" "default") }}privileged{{ else }}restricted{{ end }}'
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
