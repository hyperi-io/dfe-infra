# Wave 2: cluster platform config -- edge routing and network policy.
#
# First-party dfe-infra charts that configure the CLUSTER rather than run a
# workload, so they sit apart from layer2-data (substrate) and layer2-apps (DFE
# services). Both are generated here so a rebuild recreates them; applied by hand
# they take neither the profile overlay nor the domain, and every HTTPRoute
# renders on local.yaml's placeholder host.
#
# Wave 2 puts the Gateway and its routes in place before the workloads they route
# to; an HTTPRoute whose backend is absent reports NotFound until it exists.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                # Gateway + HTTPRoutes for every deployment surface. Needs the
                # envoy-gateway operator, installed at wave 3 by layer1-addons;
                # the CRDs it depends on come with that install, so this Application
                # reports SyncFailed until the operator lands and then converges.
                - app: envoy-gateway-config
                  namespace: envoy-gateway-system
                  wave: "2"
                  appProject: infra
                # Default-deny plus the explicit allows between DFE namespaces.
                - app: network-policies
                  namespace: default
                  wave: "2"
                  appProject: infra
                # Opt-in in-cluster troubleshooting pod. Always deployed here
                # (not cloud-gated, unlike karpenter-pools below) -- the chart
                # itself renders replicas: 0 and no RBAC until a deployment's
                # own toolbox.pod.enabled says otherwise (argocd/values/common.yaml).
                # Same namespace as network-policies for the same reason: a
                # generic platform namespace, not a DFE app or data one.
                - app: dfe-toolbox
                  namespace: default
                  wave: "2"
                  appProject: infra
    # karpenter-pools: the NodePools and EC2NodeClasses a workload actually
    # schedules onto. AWS-only, the same shape layer1-addons gates its two
    # AWS-only controllers on -- Exists AND In, because NotIn/In alone matches
    # an absent key. Wave 3, after the karpenter controller itself (wave 1 in
    # layer1-addons.yaml): a NodePool applied before the controller that reads
    # it just sits unclaimed.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/cloud
                    operator: Exists
                  - key: dfe.hyperi.io/cloud
                    operator: In
                    values: ["aws"]
          - list:
              elements:
                - app: karpenter-pools
                  namespace: kube-system
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      # Multi-source, the same shape layer2-apps uses: source 1 = the pinned
      # dfe-infra base chart, source 2 = the deploy repo (ref: values). The
      # deploy-repo overlay is layered LAST, so a deployer's clickhouse.mode
      # beats the profile file's tier default without editing dfe-infra.
      sources:
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          path: 'helm/charts/{{ .app }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - "../../../argocd/values/common.yaml"
              - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # infra/common.yaml is the deployer's own common.yaml -- shared
              # facts declared once and read by every appset; infra/<chart>.yaml
              # is the per-chart overlay. Both optional.
              - '$values/infra/common.yaml'
              - '$values/infra/{{ .app }}.yaml'
            parameters:
              # The deployment's own domain, from the cluster fact rather than a
              # values file -- the tracked overlays carry placeholders only. Every
              # hostname envoy-gateway-config publishes derives from it.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # The address the deployment's DNS already names. Empty lets the
              # LB pool choose, which re-rolls the edge address on a rebuild.
              - name: envoyGateway.service.loadBalancerIP
                value: '{{ index .metadata.annotations "dfe.hyperi.io/gateway_address" }}'
              # Where the DFE apps run, so the network policies name the same
              # namespace the apps are actually placed in.
              - name: appNamespace
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
              # The toolbox pod's own dial facts (deployment.yaml's
              # toolbox.pod.*, carried onto the cluster secret by bootstrap.sh
              # the same way retention.defaultTtlDays is in layer2-apps.yaml).
              # Applied to every app this generator deploys, same as domain/
              # appNamespace above -- harmless on envoy-gateway-config and
              # network-policies, which read neither. enabled/kubeApiAccess
              # are left to Helm's own --set type inference (bare true/false
              # becomes a real YAML boolean, which the chart's own
              # validate.yaml requires); ttlSeconds forces a string so a
              # numeric TTL is never silently coerced to an int.
              - name: toolbox.pod.enabled
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_enabled" | default "false" }}'
              - name: toolbox.pod.kubeApiAccess
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_kube_api_access" | default "false" }}'
              - name: toolbox.pod.ttlSeconds
                value: '{{ index .metadata.annotations "dfe.hyperi.io/toolbox_pod_ttl_seconds" | default "" }}'
                forceString: true
            # `values` (a YAML string) rather than a structured block, same
            # reason the karpenter addon in layer1-addons.yaml gives: a
            # per-element conditional cannot live in a field this file's own
            # tests parse as plain YAML before any Go templating runs.
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- if $kafkaMode }}
              # network-policies derives its external-service egress from the
              # declared mode, so without this the baseline default-deny holds
              # and no pod can reach a managed broker at all. bootstrap.sh sets
              # the annotation only for msk, confluent-cloud and redpanda-cloud;
              # an in-cluster broker keeps the profile overlay's own kafka.mode
              # and renders no external egress.
              kafka:
                mode: {{ $kafkaMode | quote }}
              {{- end }}
              {{- if eq .app "karpenter-pools" }}
              # The three facts karpenter.cluster.* names, carried onto the
              # cluster secret by bootstrap.sh from the kubernetes-cluster
              # module's `karpenter` output. Without them the chart's own
              # guards refuse to render (helm/charts/karpenter-pools/templates/_pools.tpl).
              karpenter:
                cluster:
                  discoveryTag: {{ index .metadata.annotations "dfe.hyperi.io/karpenter_discovery_tag" | quote }}
                  instanceProfile: {{ index .metadata.annotations "dfe.hyperi.io/karpenter_instance_profile" | quote }}
                  kmsKeyId: {{ index .metadata.annotations "dfe.hyperi.io/karpenter_kms_key_id" | quote }}
              {{- end }}
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
