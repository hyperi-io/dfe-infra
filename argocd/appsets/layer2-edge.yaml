# The edge module: the public gateway (helm/edge/gateway) and the fleet tunnel (culvert's thin chart),
# one module because they are one job and turn off together. See docs/deployment/edge.md.
#
# This file serves new clusters only. A secret written before the module has no dfe.hyperi.io/edge key,
# so layer2-platform.yaml and layer2-apps.yaml keep generating both Applications for it until dfe-infra#342.
# The off switch is the secret's dfe.hyperi.io/edge label, because a cluster selector matches labels only.
# Exists AND In: NotIn would match an absent key, so the pair says so out loud.
# Per-flavour tier tables are argocd/values/edge-<flavour>.yaml, read by this appset alone.
# Two ApplicationSets because the gateway is wave 2 and the tunnel wave 7, so they share no template.
# The Application names are unchanged from layer2-platform and layer2-apps so Argo adopts the live objects.
# Nothing sets preserveResourcesOnDeletion, so a rename would take the Gateway, routes and certificates.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-edge-gateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/edge
                    operator: Exists
                  - key: dfe.hyperi.io/edge
                    operator: In
                    values: ["true"]
          - list:
              elements:
                # The Gateway and HTTPRoutes, from the envoy-gateway operator layer1-addons installs at wave 3.
                # Reports SyncFailed until the operator lands. Wave 2 so the routes exist before the workloads they route to.
                - app: envoy-gateway-config
                  chart: edge/gateway
                  namespace: envoy-gateway-system
                  wave: "2"
                  appProject: infra
  template:
    metadata:
      # app is the Application name and chart only its directory, so the chart can move without a rename.
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      # Two sources: the base chart, then the deploy repo as ref values, layered last.
      sources:
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          # index, not .chart: missingkey=error would fail the render on an element with no chart.
          path: 'helm/{{ index . "chart" | default (printf "charts/%s" .app) }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - "../../../argocd/values/common.yaml"
              - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              # The flavour's tier table, after the cloud overlay so an edge key beats the cloud file it moved out of. local, local-dfe and rancher are one onprem flavour.
              - '../../../argocd/values/edge-{{ $c := index .metadata.annotations "dfe.hyperi.io/cloud" }}{{ if or (eq $c "local") (eq $c "local-dfe") (eq $c "rancher") }}onprem{{ else }}{{ $c }}{{ end }}.yaml'
              - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # infra/common.yaml is the deployer's shared facts, infra/<app>.yaml the per-app overlay, keyed on the Application name so moving the chart orphans nothing. Both optional.
              - '$values/infra/common.yaml'
              - '$values/infra/{{ .app }}.yaml'
            parameters:
              # A cluster fact: tracked overlays carry placeholders.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # The address DNS already names. Empty lets the LB pool choose, which re-rolls it on a rebuild.
              - name: envoyGateway.service.loadBalancerIP
                value: '{{ index .metadata.annotations "dfe.hyperi.io/gateway_address" }}'
              # Where the apps run, so a route names the right namespace.
              - name: appNamespace
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
              # Every object here is labelled from these, and the chart defaults say local.
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              # The label layer2-deploy-repo.yaml deploys Forgejo on, so the git route exists when its backend does.
              - name: deployRepo.bundled
                value: '{{ eq (index .metadata.labels "dfe.hyperi.io/bundled-deploy-repo") "true" }}'
            # A string: the template is parsed as YAML before Go templating, so a conditional cannot be structured.
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- if $kafkaMode }}
              # Carried for the same reason layer2-platform carries it: the
              # declared mode reaches every app that appset deploys. This chart
              # reads no kafka key, so it is inert here and kept only so the
              # cascade is the one the Application already had.
              kafka:
                mode: {{ $kafkaMode | quote }}
              {{- end }}
              {{- $selfRanges := index .metadata.annotations "dfe.hyperi.io/edge_self_ranges" | default "" }}
              {{- if $selfRanges }}
              # The addresses this deployment reaches its own gateway from, a
              # fact the cloud root writes and every web exposure group admits.
              # Who else may reach each surface is exposure.groups, which the
              # deploy repo's infra/common.yaml sets and this never overrides.
              exposure:
                selfRanges: {{ splitList "," $selfRanges | toJson }}
              {{- end }}
              {{- $trusted := index .metadata.annotations "dfe.hyperi.io/edge_trusted_proxy_cidrs" | default "" }}
              {{- if $trusted }}
              # The CDN ranges whose X-Forwarded-For names the client.
              ui:
                trusted_proxy_cidrs: {{ $trusted | quote }}
              {{- end }}
              # The cloud root's tag set, for the store entries the internal CA's
              # PushSecret creates; parsed and re-emitted as JSON so every value
              # stays a string.
              {{- with index .metadata.annotations "dfe.hyperi.io/resource_tags" }}
              tls:
                internalCA:
                  persist:
                    tags: {{ . | fromJson | toJson }}
              {{- end }}
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
# The fleet tunnel, deployed per instance from the deploy repo as layer2-apps deploys every app.
# Turning it on is an engine git write, not a flag here (docs/deployment/edge-vpn.md).
# layer2-apps excludes this glob, so one generator owns the Application: two would fight and none would delete it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-edge-culvert
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/edge
                    operator: Exists
                  - key: dfe.hyperi.io/edge
                    operator: In
                    values: ["true"]
          - git:
              repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              revision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              files:
                - path: "values/culvert-*-values.yaml"
  template:
    metadata:
      # The name layer2-apps generated for this file, unchanged.
      name: '{{ .deploy.service }}-{{ .deploy.instance }}-{{ .name }}'
      namespace: argocd
      annotations:
        # Wave 7, as layer2-apps puts every app but the engine.
        argocd.argoproj.io/sync-wave: "7"
    spec:
      project: dfe-apps
      # The four sources layer2-apps.yaml gives every component, in the same order.
      sources:
        - repoURL: 'oci://{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}/charts/{{ .deploy.service }}'
          path: "."
          # The literal map layer2-apps.yaml carries, held to versions.yaml chart-digests by scripts/check_versions_drift.py.
          targetRevision: |-
            {{- $pins := dict
                "culvert" "sha256:423166ccc25223b702864e49684f95b150cc1d8dded42f0bace6b05844b068f6"
            -}}
            {{- $pin := index $pins .deploy.service | default "" -}}
            {{- if not $pin -}}
            {{- fail (printf "no chart digest is pinned for %s -- add chart-digests.%s to versions.yaml and run scripts/check_versions_drift.py --fix" .deploy.service .deploy.service) -}}
            {{- end -}}
            {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $pin) -}}
            {{- fail (printf "the chart digest pinned for %s is %q, not a published sha256 digest" .deploy.service $pin) -}}
            {{- end -}}
            {{- $pin -}}
          helm:
            # releaseName is set only past Helm's 53 character cap, as in layer2-apps.
            releaseName: '{{ $app := printf "%v-%v-%v" .deploy.service .deploy.instance .name }}{{ if gt (len $app) 53 }}{{ trunc 44 $app | trimSuffix "-" }}-{{ sha256sum $app | trunc 8 }}{{ end }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - "$infra/argocd/values/common.yaml"
              - '$infra/argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              # The gateway's flavour file, in the same place: one tier table serves both doors.
              - '$infra/argocd/values/edge-{{ $c := index .metadata.annotations "dfe.hyperi.io/cloud" }}{{ if or (eq $c "local") (eq $c "local-dfe") (eq $c "rancher") }}onprem{{ else }}{{ $c }}{{ end }}.yaml'
              - '$infra/argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - "$infra/argocd/values/apps/_common.yaml"
              - "$infra/argocd/values/apps/{{ .deploy.service }}/values.yaml"
              - '$infra/argocd/values/apps/{{ .deploy.service }}/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/apps/{{ .deploy.service }}/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # The deployer's common.yaml, below the instance file.
              - '$values/infra/common.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            parameters:
              # The registry culvert's image and chart come from, refused when absent as in layer2-apps.
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              # vpn.serverCN derives {hostnames.vpn}.{domain} from it when the instance file names no server CN.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # From the cluster annotations, so the chart is not labelled as a local one.
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              - name: stackVersion
                value: '{{ index .metadata.annotations "dfe.hyperi.io/stack_version" | default "" }}'
              - name: profile
                value: '{{ index .metadata.annotations "dfe.hyperi.io/profile" }}'
              # The receiver lives in this namespace, not the tunnel's. Its telemetry endpoint and egress policy name it.
              - name: dfeNamespace
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
            # A string: the template is parsed as YAML before Go templating, so a conditional cannot be structured.
            values: |
              {{- $tunnelZone := index .metadata.annotations "dfe.hyperi.io/tunnel_zone" }}
              {{- if $tunnelZone }}
              # The AWS tunnel forwarder is pinned to one availability zone
              # (terraform/modules/edge/aws), and a hop from it to a node in
              # another zone crosses a boundary billed per GB. Absent on every
              # flavour that brings its own address, where nothing pins a zone.
              # A map, so it merges with the cloud file's own nodeSelector.
              nodeSelector:
                topology.kubernetes.io/zone: {{ $tunnelZone | quote }}
              {{- end }}
              {{- $cloud := index .metadata.annotations "dfe.hyperi.io/cloud" }}
              {{- if not (or (eq $cloud "local") (eq $cloud "rancher")) }}
              # culvert writes its revocations and its WireGuard peer
              # allocations into the pod's PKI directory, so a restart without a
              # volume re-issues a revoked peer's address and forgets which
              # appliance is which. On-prem is left alone because not every
              # cluster has a StorageClass (apps/culvert/local.yaml, rancher.yaml).
              writablePaths:
                pki:
                  persistence:
                    enabled: true
              {{- end }}
              {{- $adminCIDR := index .metadata.annotations "dfe.hyperi.io/toolbox_admin_cidr" }}
              {{- if $adminCIDR }}
              # The toolbox instance's own /32, written on the cluster secret by
              # `dfe-ops bastion up` and taken off by `down`. It is the one shape
              # culvert's admin hole matches today -- a source off the pod's
              # ethernet side, never a peer -- so an operator reaches one
              # appliance by routing the client range at this pod rather than by
              # dialling in.
              peers:
                classes:
                  admin:
                    adminCIDRs:
                      - {{ $adminCIDR | quote }}
              {{- end }}
        # The DFE-only objects beside the thin chart, plus chartName.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          path: helm/charts/dfe-extras
          helm:
            # Helm caps this source's release name alike. dfe-common labels objects app.kubernetes.io/instance with it.
            releaseName: '{{ $app := printf "%v-%v-%v" .deploy.service .deploy.instance .name }}{{ if gt (len $app) 53 }}{{ trunc 44 $app | trimSuffix "-" }}-{{ sha256sum $app | trunc 8 }}{{ end }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - "$infra/argocd/values/common.yaml"
              - '$infra/argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/edge-{{ $c := index .metadata.annotations "dfe.hyperi.io/cloud" }}{{ if or (eq $c "local") (eq $c "local-dfe") (eq $c "rancher") }}onprem{{ else }}{{ $c }}{{ end }}.yaml'
              - '$infra/argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - "$infra/argocd/values/apps/_common.yaml"
              - "$infra/argocd/values/apps/{{ .deploy.service }}/values.yaml"
              - '$infra/argocd/values/apps/{{ .deploy.service }}/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/apps/{{ .deploy.service }}/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - '$values/infra/common.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            parameters:
              - name: chartName
                value: "{{ .deploy.service }}"
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              - name: stackVersion
                value: '{{ index .metadata.annotations "dfe.hyperi.io/stack_version" | default "" }}'
              - name: profile
                value: '{{ index .metadata.annotations "dfe.hyperi.io/profile" }}'
              # The receiver lives in this namespace, so the tunnel's egress policy selects it by name.
              - name: dfeNamespace
                value: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
            values: |
              {{- $tunnelZone := index .metadata.annotations "dfe.hyperi.io/tunnel_zone" }}
              {{- if $tunnelZone }}
              nodeSelector:
                topology.kubernetes.io/zone: {{ $tunnelZone | quote }}
              {{- end }}
              {{- $cloud := index .metadata.annotations "dfe.hyperi.io/cloud" }}
              {{- if not (or (eq $cloud "local") (eq $cloud "rancher")) }}
              writablePaths:
                pki:
                  persistence:
                    enabled: true
              {{- end }}
              {{- $adminCIDR := index .metadata.annotations "dfe.hyperi.io/toolbox_admin_cidr" }}
              {{- if $adminCIDR }}
              peers:
                classes:
                  admin:
                    adminCIDRs:
                      - {{ $adminCIDR | quote }}
              {{- end }}
        # This repo again at dfe-extras' revision: Argo reads one revision per repo URL.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          ref: infra
        # The deploy repo, refused at another revision of this repo for the same reason.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ $infra := index .metadata.annotations "dfe.hyperi.io/repo_url" | default "" | lower | trimSuffix "/" | trimSuffix ".git" }}{{ $deploy := index .metadata.annotations "dfe.hyperi.io/config_repo_url" | default "" | lower | trimSuffix "/" | trimSuffix ".git" }}{{ $revision := index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}{{ if and (eq $infra $deploy) (ne $revision (index .metadata.annotations "dfe.hyperi.io/target_revision")) }}{{ fail "dfe.hyperi.io/config_repo_url names the chart repo at a revision other than dfe.hyperi.io/target_revision -- Argo CD reads one revision per repo, so give the deploy repo its own repo or the same revision" }}{{ end }}{{ $revision }}'
          ref: values
      # Its own namespace, privileged: the pod holds NET_ADMIN, a hostPath tun device and a privileged init container, which baseline refuses.
      # The receiver's ingest policy names it (dfe-extras exposure.vpn.namespace).
      destination:
        server: '{{ .server }}'
        namespace: culvert
      # The chart holds at one replica, so no KEDA scale needs protecting. The block matches layer2-apps.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
