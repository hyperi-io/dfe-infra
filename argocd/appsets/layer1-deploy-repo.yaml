# Platform: in-cluster Gitea deploy-repo host.
#
# Gitea is PLATFORM, not payload: it hosts the per-environment deploy-repo that
# dfe-engine authors and the `deploy-repo` app-of-apps (argocd/bootstrap/
# deploy-repo-app.yaml, wave 6) syncs. It must exist BEFORE any payload, so it is
# deployed here from dfe-infra git (it cannot come from the repo it serves).
#
# All other data-layer + app workloads are PAYLOAD: authored by dfe-engine into
# the deploy-repo and applied via the deploy-repo app-of-apps -- NOT from here.
# See docs deployment architecture: platform vs payload split.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer1-deploy-repo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
  template:
    metadata:
      name: 'gitea-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: infra
      source:
        repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
        targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
        path: helm/charts/gitea
        helm:
          valueFiles:
            - "../../../argocd/values/common.yaml"
            - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
            - '../../../argocd/values/profile-{{ dig "dfe.hyperi.io/profile" "standard" .metadata.annotations }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: gitea
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
