# Wave 5: DFE application services + HyperDX (embedded in dfe-ui).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - list:
              elements:
                - app: dfe-engine
                  wave: "5"
                - app: dfe-ui
                  wave: "5"
                - app: dfe-receiver
                  wave: "5"
                - app: dfe-loader
                  wave: "5"
                - app: dfe-archiver
                  wave: "5"
                - app: dfe-fetcher
                  wave: "5"
                - app: hyperdx
                  wave: "5"
                # dfe-transform-* apps (optional, scale-to-zero via KEDA Kafka trigger)
                - app: dfe-transform-wasm
                  wave: "5"
                - app: dfe-transform-vrl
                  wave: "5"
                - app: dfe-transform-vector
                  wave: "5"
                - app: dfe-transform-elastic
                  wave: "5"
                - app: dfe-transform-splack
                  wave: "5"
  template:
    metadata:
      name: "{{app}}-{{name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: dfe-apps
      source:
        repoURL: '{{metadata.annotations.dfe\.hyperi\.io/repo_url}}'
        targetRevision: '{{metadata.annotations.dfe\.hyperi\.io/target_revision}}'
        path: "helm/charts/{{app}}"
        helm:
          valueFiles:
            - "../../argocd/values/common.yaml"
            - '../../argocd/values/{{metadata.annotations.dfe\.hyperi\.io/cloud}}.yaml'
      destination:
        server: "{{server}}"
        namespace: '{{metadata.annotations.dfe\.hyperi\.io/dfe_namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
