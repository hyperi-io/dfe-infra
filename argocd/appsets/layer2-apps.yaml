# Waves 5 and 7: DFE application services -- deployed per service-instance from
# the deploy repo via a git-files generator. ONE Application per overlay values file:
# the engine (or the dfe-deploy template) writes values/<svc>-<inst>-values.yaml
# with a `deploy: {service, instance}` block, and the generator fans out one
# Application per file. This handles BOTH shapes uniformly -- singleton-scaled
# apps (receiver/loader/engine/ui: one file each) and multi-instance apps
# (fetcher: N files, each its own config). Adding/removing an instance is an
# engine git write, not an appset edit (the engine declares instances; this
# appset deploys them -- boundary-clean).
#
# Each Application has four sources, in this order:
#   1. the component's thin chart, assembled from its deployment contract and
#      pulled over OCI from the registry its images come from, pinned by digest;
#   2. helm/charts/dfe-extras, the DFE-only objects beside it, at target_revision;
#   3. this repo as ref `infra`, at the same revision, for the value files;
#   4. the deploy repo as ref `values`, whose instance file is layered last.
# Both helm sources read the same value files, parameters and inline values, so
# the engine overlay wins over every default in either. ignoreMissingValueFiles
# lets a chart run on its defaults until the engine publishes its overlay.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - git:
              repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              revision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              files:
                - path: "values/*-values.yaml"
                # culvert is the edge module's and is generated below instead,
                # for the clusters layer2-edge.yaml does not reach. Excluded from
                # THIS generator so exactly one generates it: two would have the
                # controllers fight over one Application.
                - path: "values/culvert-*-values.yaml"
                  exclude: true
    # culvert, for the clusters the edge module does not reach, until
    # dfe-infra#342 retires this bridge. Same reasoning as envoy-gateway-config
    # in layer2-platform.yaml: a cluster secret written before the edge module
    # carries no dfe.hyperi.io/edge key, so layer2-edge generates nothing for it
    # and the tunnel would go away underneath a running deployment.
    # DoesNotExist, not NotIn: a deployer who set the key to false turned the
    # edge off on purpose and gets no tunnel from here either.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/edge
                    operator: DoesNotExist
          - git:
              repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              revision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              files:
                - path: "values/culvert-*-values.yaml"
  template:
    metadata:
      # Unchanged from the 2.2.0 charts: Argo's tracking id is built from the
      # name, so it adopts every live object rather than deleting and rebuilding.
      name: '{{ .deploy.service }}-{{ .deploy.instance }}-{{ .name }}'
      namespace: argocd
      annotations:
        # dfe-engine at wave 5, everything else at 7. The engine applies every
        # ClickHouse object and every bootstrap topic at its own startup and
        # reports converged on /readyz, so its Application reaching Healthy IS
        # the schema being there. Wave 6 (otel-collector) then has its otel
        # tables, and wave 7 has the tables and topics it writes to. Stamped
        # here rather than per generator element: this appset's elements come
        # from the deploy repo's values files, so the wave has to be derived
        # from the service each file names.
        argocd.argoproj.io/sync-wave: '{{ if eq .deploy.service "dfe-engine" }}5{{ else }}7{{ end }}'
    spec:
      project: dfe-apps
      sources:
        # The thin chart, under the same registry annotation global.registry
        # reads, so a mirrored deployment moves its charts with its images. Its
        # name is the service, except hyperdx, whose contract names dfe-hyperdx.
        # No releaseName on either helm source, so app.kubernetes.io/instance
        # stays the Application name.
        - repoURL: 'oci://{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}/charts/{{ if eq .deploy.service "hyperdx" }}dfe-hyperdx{{ else }}{{ .deploy.service }}{{ end }}'
          path: "."
          # A literal map, because an appset cannot read versions.yaml:
          # scripts/check_versions_drift.py holds each entry to chart-digests
          # there, and --fix writes them. A service with no entry, or one whose
          # chart is not published yet, fails the render, which leaves its
          # Application on its current spec.
          targetRevision: |-
            {{- $pins := dict
                "culvert" "sha256:32b71c5730a29721ad34907148c39949bc766cf3ce46e775acc8bd57587ac92c"
                "dfe-archiver" "sha256:90f7d9ec8cddb4d18c41caca5e38ab21a96be7159ddceb1fa2899bb726da5aae"
                "dfe-engine" "sha256:83c219ab2685db3275882eb8e4bb30f451c7f7253dcfc1c911f801bbfd2a58fe"
                "dfe-fetcher" "sha256:17b44639cd741115bd8f287b3b959ac86133b7f8fc14e8e1ee389a4856b1235f"
                "dfe-loader" "sha256:d08d0416925e7322b4580d54f5226cce340a77c150e39845efe3e2ac910875b3"
                "dfe-receiver" "sha256:11a8972d1681aa46a07c1e516c7733a6f1d3688462da33f3c36866ba2ffc46d9"
                "dfe-transform-elastic" "sha256:85af7d98187c9fc8a82adb05fbc827316f59e1a795e9b649e44f5aa41036a752"
                "dfe-transform-vector" "sha256:124db1bada639381231806a882b525388ec61837c02c85dfb8329b60b3856104"
                "dfe-transform-vrl" "sha256:f04ff3cee742d4c3c0f3a33127bc2addd309b89ca87ab151ff0fa517c2849881"
                "dfe-ui" "sha256:6a09e4c70be92c5696b33936372fc40056f382bda522cadfb74edf45ccec9102"
                "hyperdx" "sha256:95a0ab3a12b56360d43cd22099d0ad7f19ec7a6065408459ce6f6a12a2f4cc00"
            -}}
            {{- $pin := index $pins .deploy.service | default "" -}}
            {{- if not $pin -}}
            {{- fail (printf "no chart digest is pinned for %s -- add chart-digests.%s to versions.yaml and run scripts/check_versions_drift.py --fix" .deploy.service .deploy.service) -}}
            {{- end -}}
            {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $pin) -}}
            {{- fail (printf "the chart digest pinned for %s is %q, not a published sha256 digest" .deploy.service $pin) -}}
            {{- end -}}
            {{- $pin -}}
          helm:
            ignoreMissingValueFiles: true
            # The stack's files, then the component's own, then the deploy repo's.
            # Read through the `infra` ref, because a chart pulled over OCI has
            # no repo for a relative path to resolve in.
            valueFiles:
              - "$infra/argocd/values/common.yaml"
              - '$infra/argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - "$infra/argocd/values/apps/_common.yaml"
              - "$infra/argocd/values/apps/{{ .deploy.service }}/values.yaml"
              - '$infra/argocd/values/apps/{{ .deploy.service }}/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/apps/{{ .deploy.service }}/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # The deployer's own common.yaml, read by every appset so
              # clickhouse.mode / kafka.mode are declared once rather than per
              # app. Below the instance file, which stays the last word.
              - '$values/infra/common.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            # SSoT for the deploy repo: the engine's WRITE target (gitops.repoUrl/
            # branch) is injected from the SAME config_repo_url/revision annotation
            # Argo reads (the `values` ref + the git generator). No second place to
            # set the deploy repo, so the engine's write target cannot drift from
            # what Argo reads. Only the dfe-engine chart has a gitops block; other
            # charts ignore these params.
            parameters:
              # The registry every dfe-* image is pulled from. `index` returns an
              # empty string for a missing annotation, and an empty parameter
              # beats every values file, so a cluster secret written before this
              # fact existed would send each image to Docker Hub. The render
              # fails instead, which leaves every Application on its current spec.
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              - name: gitops.repoUrl
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              - name: gitops.branch
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              # The deployment's own domain (a cluster fact; tracked overlays
              # carry placeholders). dfe-ui derives NEXTAUTH_URL from it.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # The deployment's posture, from the same annotation the cluster
              # label carries, so DFE_ENV cannot drift from what the deploy
              # declared. Left at the chart's `local` default, every deployment
              # self-identifies as dev -- which is what the engine's gitcrud
              # commit policy and the default-admin-password check gate on (#233).
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              # The deployment's cloud, from the annotation that picks the cloud
              # values file above. apps/_common.yaml labels every object with it.
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              # The dfe-ui suite's e2e posture, which bootstrap writes on every
              # cluster secret. Only dfe-engine reads it, and its chart refuses it
              # outside a dev posture; a secret written before the key reads off.
              - name: e2eServer
                value: '{{ index .metadata.annotations "dfe.hyperi.io/e2e_server" | default "false" }}'
              # The ingest door's address, for the same reason the gateway has
              # one. Only dfe-receiver's contract marks a port public, so no other
              # chart renders a Service to put it on.
              - name: publicService.loadBalancerIP
                value: '{{ index .metadata.annotations "dfe.hyperi.io/receiver_address" }}'
              # Deployment-wide retention, read by dfe-engine -- the only thing
              # that applies a TTL. A cluster secret without it falls back to 90.
              - name: retention.defaultTtlDays
                value: '{{ index .metadata.annotations "dfe.hyperi.io/clickhouse_default_ttl_days" | default "90" }}'
              # The stack this revision certifies, so the engine can report it
              # when the deploy repo's pins name no base. Only dfe-engine reads it.
              - name: stackVersion
                value: '{{ index .metadata.annotations "dfe.hyperi.io/stack_version" | default "" }}'
              # The tier, from the same annotation that picks the profile values
              # file above -- so what the engine reports and what the charts were
              # rendered with are one value. dfe-extras reads the transport the
              # profile runs from it too.
              - name: profile
                value: '{{ index .metadata.annotations "dfe.hyperi.io/profile" }}'
              # Whether dfe-internal-ca exists, from the edge label that decides
              # whether the gateway minting it is deployed. The same parameter
              # layer2-data.yaml hands clickhouse-cluster, so dfe-engine,
              # dfe-loader and hyperdx dial the scheme the server serves.
              - name: clickhouse.tls.internalCA.present
                value: '{{ ne (index .metadata.labels "dfe.hyperi.io/edge" | default "true") "false" }}'
            # `values` (a YAML string) rather than a structured block, same
            # reason layer2-data.yaml gives: a conditional cannot live in a
            # field this file's own tests parse as plain YAML before any Go
            # templating runs.
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- $kafkaBootstrap := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap" }}
              {{- $kafkaSecurityProtocol := index .metadata.annotations "dfe.hyperi.io/kafka_security_protocol" }}
              {{- $kafkaMessageMaxBytes := index .metadata.annotations "dfe.hyperi.io/kafka_message_max_bytes" }}
              {{- if $kafkaMode }}
              # A managed broker (msk, confluent-cloud, redpanda-cloud) is the
              # only case bootstrap.sh sets this annotation for, so an
              # in-cluster deploy's kafka.mode stays whatever its profile
              # overlay says. The profile's bootstrapServers names a Service
              # that does not exist on a managed broker, so the endpoint the
              # deploy was actually built with replaces it here.
              kafka:
                mode: {{ $kafkaMode | quote }}
                {{- if and (eq $kafkaMode "external") $kafkaBootstrap }}
                bootstrapServers: {{ $kafkaBootstrap | quote }}
                {{- end }}
                {{- if and (eq $kafkaMode "external") $kafkaSecurityProtocol }}
                # A managed broker serves TLS only, so its protocol replaces
                # common.yaml's in-cluster plain listener for every app.
                securityProtocol: {{ $kafkaSecurityProtocol | quote }}
                {{- end }}
                {{- if $kafkaMessageMaxBytes }}
                # The message size the managed broker was built with, so the
                # topics dfe-engine creates are not left at the provider's
                # default. Only dfe-engine reads it.
                messageMaxBytes: {{ $kafkaMessageMaxBytes | quote }}
                {{- end }}
              {{- end }}
              {{- $pullSecret := "ghcr-pull-secret" }}
              {{- range $key, $name := .metadata.annotations }}{{ if eq $key "dfe.hyperi.io/image_pull_secret" }}{{ $pullSecret = $name }}{{ end }}{{ end }}
              {{- if $pullSecret }}
              # Only the secret bootstrap.sh created, or ghcr-pull-secret on an older cluster secret.
              imagePullSecrets:
                - {{ $pullSecret | quote }}
              {{- end }}
        # The DFE-only objects beside the thin chart. The chart source's value
        # files, parameters and inline values, plus chartName, the thin chart's
        # name, which picks this component's objects.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          path: helm/charts/dfe-extras
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - "$infra/argocd/values/common.yaml"
              - '$infra/argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - "$infra/argocd/values/apps/_common.yaml"
              - "$infra/argocd/values/apps/{{ .deploy.service }}/values.yaml"
              - '$infra/argocd/values/apps/{{ .deploy.service }}/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/apps/{{ .deploy.service }}/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - '$values/infra/common.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            parameters:
              - name: chartName
                value: '{{ if eq .deploy.service "hyperdx" }}dfe-hyperdx{{ else }}{{ .deploy.service }}{{ end }}'
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              - name: gitops.repoUrl
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              - name: gitops.branch
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              - name: e2eServer
                value: '{{ index .metadata.annotations "dfe.hyperi.io/e2e_server" | default "false" }}'
              - name: publicService.loadBalancerIP
                value: '{{ index .metadata.annotations "dfe.hyperi.io/receiver_address" }}'
              - name: retention.defaultTtlDays
                value: '{{ index .metadata.annotations "dfe.hyperi.io/clickhouse_default_ttl_days" | default "90" }}'
              - name: stackVersion
                value: '{{ index .metadata.annotations "dfe.hyperi.io/stack_version" | default "" }}'
              - name: profile
                value: '{{ index .metadata.annotations "dfe.hyperi.io/profile" }}'
              - name: clickhouse.tls.internalCA.present
                value: '{{ ne (index .metadata.labels "dfe.hyperi.io/edge" | default "true") "false" }}'
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- $kafkaBootstrap := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap" }}
              {{- $kafkaSecurityProtocol := index .metadata.annotations "dfe.hyperi.io/kafka_security_protocol" }}
              {{- $kafkaMessageMaxBytes := index .metadata.annotations "dfe.hyperi.io/kafka_message_max_bytes" }}
              {{- if $kafkaMode }}
              kafka:
                mode: {{ $kafkaMode | quote }}
                {{- if and (eq $kafkaMode "external") $kafkaBootstrap }}
                bootstrapServers: {{ $kafkaBootstrap | quote }}
                {{- end }}
                {{- if and (eq $kafkaMode "external") $kafkaSecurityProtocol }}
                securityProtocol: {{ $kafkaSecurityProtocol | quote }}
                {{- end }}
                {{- if $kafkaMessageMaxBytes }}
                messageMaxBytes: {{ $kafkaMessageMaxBytes | quote }}
                {{- end }}
              {{- end }}
              {{- $pullSecret := "ghcr-pull-secret" }}
              {{- range $key, $name := .metadata.annotations }}{{ if eq $key "dfe.hyperi.io/image_pull_secret" }}{{ $pullSecret = $name }}{{ end }}{{ end }}
              {{- if $pullSecret }}
              imagePullSecrets:
                - {{ $pullSecret | quote }}
              {{- end }}
        # This repo again, at the revision dfe-extras is read at: Argo reads one
        # revision per repo URL, and a second ref at another revision is read
        # from the wrong tree without a word.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          ref: infra
        # The deploy repo. A cluster secret naming this repo for it at another
        # revision fails the render, for the same one-revision-per-repo reason.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ $infra := index .metadata.annotations "dfe.hyperi.io/repo_url" | default "" | lower | trimSuffix "/" | trimSuffix ".git" }}{{ $deploy := index .metadata.annotations "dfe.hyperi.io/config_repo_url" | default "" | lower | trimSuffix "/" | trimSuffix ".git" }}{{ $revision := index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}{{ if and (eq $infra $deploy) (ne $revision (index .metadata.annotations "dfe.hyperi.io/target_revision")) }}{{ fail "dfe.hyperi.io/config_repo_url names the chart repo at a revision other than dfe.hyperi.io/target_revision -- Argo CD reads one revision per repo, so give the deploy repo its own repo or the same revision" }}{{ end }}{{ $revision }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
      # Replica count belongs to KEDA's HPA, so selfHeal must not revert a scale as
      # drift. RespectIgnoreDifferences applies the rule during sync, not only in
      # the diff view. The charts omit `replicas:` under KEDA too -- this covers
      # charts this repo does not own.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
