# Waves 5 and 7: one Application per deploy-repo values/<svc>-<inst>-values.yaml.
# See docs/deployment/appsets.md#layer-2-apps for the four sources.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-layer2-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
          - git:
              repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              revision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              files:
                - path: "values/*-values.yaml"
                # culvert is generated below for clusters the edge module does not reach. One generator owns it.
                - path: "values/culvert-*-values.yaml"
                  exclude: true
    # culvert for clusters the edge module does not reach, until dfe-infra#342 retires this bridge.
    # DoesNotExist, not NotIn: edge set to false is a deliberate off and gets no tunnel from here either.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/edge
                    operator: DoesNotExist
          - git:
              repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              revision: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              files:
                - path: "values/culvert-*-values.yaml"
  template:
    metadata:
      # Argo's tracking id is built from the name, so a rename rebuilds every object.
      name: '{{ .deploy.service }}-{{ .deploy.instance }}-{{ .name }}'
      namespace: argocd
      annotations:
        # dfe-engine at wave 5, everything else at 7. See docs/architecture.md.
        argocd.argoproj.io/sync-wave: '{{ if eq .deploy.service "dfe-engine" }}5{{ else }}7{{ end }}'
    spec:
      project: dfe-apps
      sources:
        # The thin chart, under the registry global.registry reads. Its name is the service.
        # releaseName is set only past Helm's 53 character cap: the first 44 characters plus 8 of the sha256.
        - repoURL: 'oci://{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}/charts/{{ .deploy.service }}'
          path: "."
          # A literal map: an appset cannot read versions.yaml, so scripts/check_versions_drift.py --fix writes it.
          # A service with no entry fails the render and its Application keeps its current spec.
          targetRevision: |-
            {{- $pins := dict
                "culvert" "sha256:423166ccc25223b702864e49684f95b150cc1d8dded42f0bace6b05844b068f6"
                "dfe-archiver" "sha256:a71b1913549002ef394c81a846791923a32750e5650c90e7c1711e24c8bd8edf"
                "dfe-engine" "sha256:2516ac740158b83820cf17980271ad8f4209e20258ca1978e30c14a7b47632e0"
                "dfe-fetcher" "sha256:d822a22c662dd8e10f39ac805d6d1d916594c2d083d854e905f8ed83bea0fa02"
                "dfe-hyperdx" "sha256:c3ab8cac57d5219a9d5eaa1b85e2fc060c3370ab1867172c38660b087098b799"
                "dfe-loader" "sha256:b21cf0303e8d34907355a346418c1d5c80244a4ff085c828083efe096308d7b4"
                "dfe-receiver" "sha256:fa5a38ea564c9ce549f959b109d7207f5120cad48455627c82df1a5a3a841e9d"
                "dfe-transform-elastic" "sha256:5656c542b791cc2a94fef2b902d22eb90f8aaf25aacd39e0070620720c838344"
                "dfe-transform-vector" "sha256:2c3e6479f4eb2808f759c67d20514a863cf22914c5e1ee675e6602df03005f1d"
                "dfe-transform-vrl" "sha256:fd052331a72b1b1b67f5fccc38493b00baad2774d3a531b9e8f91f06bf91d7bf"
                "dfe-ui" "sha256:e53e5a4990dff6a7ab1bafbfd65306bb17266ab2736f205a83e141e98643fc30"
            -}}
            {{- $pin := index $pins .deploy.service | default "" -}}
            {{- if not $pin -}}
            {{- fail (printf "no chart digest is pinned for %s -- add chart-digests.%s to versions.yaml and run scripts/check_versions_drift.py --fix" .deploy.service .deploy.service) -}}
            {{- end -}}
            {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $pin) -}}
            {{- fail (printf "the chart digest pinned for %s is %q, not a published sha256 digest" .deploy.service $pin) -}}
            {{- end -}}
            {{- $pin -}}
          helm:
            releaseName: '{{ $app := printf "%v-%v-%v" .deploy.service .deploy.instance .name }}{{ if gt (len $app) 53 }}{{ trunc 44 $app | trimSuffix "-" }}-{{ sha256sum $app | trunc 8 }}{{ end }}'
            ignoreMissingValueFiles: true
            # Stack files, then the component's, then the deploy repo's, read through the infra ref because an OCI chart has no repo for relative paths.
            valueFiles:
              - "$infra/argocd/values/common.yaml"
              - '$infra/argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - "$infra/argocd/values/apps/_common.yaml"
              - "$infra/argocd/values/apps/{{ .deploy.service }}/values.yaml"
              - '$infra/argocd/values/apps/{{ .deploy.service }}/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/apps/{{ .deploy.service }}/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              # The deployer's common.yaml, below the instance file, which has the last word.
              - '$values/infra/common.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            # gitops.repoUrl and gitops.branch come from the annotations Argo reads, so the engine's write target cannot drift. Only dfe-extras reads them.
            parameters:
              # index returns an empty string for a missing annotation, and an empty parameter beats every values file,
              # so the render fails rather than pulling every image from Docker Hub.
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              - name: gitops.repoUrl
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              - name: gitops.branch
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              # A cluster fact: tracked overlays carry placeholders.
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              # From the annotation the cluster label carries. The chart default (local) would make every deployment report as dev (#233).
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              # Read by dfe-engine alone, and its chart refuses it outside a dev environment.
              - name: e2eServer
                value: '{{ index .metadata.annotations "dfe.hyperi.io/e2e_server" | default "false" }}'
              # Only dfe-receiver's contract marks a port public, so only it renders a Service to carry this.
              - name: publicService.loadBalancerIP
                value: '{{ index .metadata.annotations "dfe.hyperi.io/receiver_address" }}'
              # Read by dfe-engine, the only thing that applies a TTL.
              - name: retention.defaultTtlDays
                value: '{{ index .metadata.annotations "dfe.hyperi.io/clickhouse_default_ttl_days" | default "90" }}'
              # The stack this revision certifies, reported by the engine when the deploy repo's pins name no base.
              - name: stackVersion
                value: '{{ index .metadata.annotations "dfe.hyperi.io/stack_version" | default "" }}'
              - name: profile
                value: '{{ index .metadata.annotations "dfe.hyperi.io/profile" }}'
              # Whether dfe-internal-ca exists. Same parameter as layer2-data, so every client dials the scheme the server serves.
              - name: clickhouse.tls.internalCA.present
                value: '{{ ne (index .metadata.labels "dfe.hyperi.io/edge" | default "true") "false" }}'
            # A string: the template is parsed as YAML before Go templating, so a conditional cannot be structured.
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- $kafkaBootstrap := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap" }}
              {{- $kafkaSecurityProtocol := index .metadata.annotations "dfe.hyperi.io/kafka_security_protocol" }}
              {{- $kafkaMessageMaxBytes := index .metadata.annotations "dfe.hyperi.io/kafka_message_max_bytes" }}
              {{- $kafkaRetentionMs := index .metadata.annotations "dfe.hyperi.io/kafka_retention_ms" }}
              {{- if or $kafkaMode $kafkaMessageMaxBytes $kafkaRetentionMs }}
              kafka:
                {{- if $kafkaMode }}
                # A managed broker (msk, confluent-cloud, redpanda-cloud) is the
                # only case bootstrap.sh sets this annotation for, so an
                # in-cluster deploy's kafka.mode stays whatever its profile
                # overlay says. The profile's bootstrapServers names a Service
                # that does not exist on a managed broker, so the endpoint the
                # deploy was actually built with replaces it here.
                mode: {{ $kafkaMode | quote }}
                {{- if and (eq $kafkaMode "external") $kafkaBootstrap }}
                bootstrapServers: {{ $kafkaBootstrap | quote }}
                {{- end }}
                {{- if and (eq $kafkaMode "external") $kafkaSecurityProtocol }}
                # A managed broker serves TLS only, so its protocol replaces
                # common.yaml's in-cluster plain listener for every app.
                securityProtocol: {{ $kafkaSecurityProtocol | quote }}
                {{- end }}
                {{- if eq $kafkaMode "external" }}
                # Confluent Cloud and Redpanda Cloud refuse a topic below 3
                # replicas, and MSK's min.insync.replicas of 2 refuses acks=all on
                # fewer, so dfe-extras hands the engine 3 for each source's topics.
                topicReplicationFactor: 3
                {{- end }}
                {{- end }}
                {{- if $kafkaMessageMaxBytes }}
                # The message size the broker was built with, whether or not
                # kafka_mode is set. dfe-extras reads it for dfe-engine's topics
                # and dfe-receiver's body limit; the block below derives the
                # limits only an app's own config file or env carries.
                messageMaxBytes: {{ $kafkaMessageMaxBytes | quote }}
                {{- end }}
                {{- if $kafkaRetentionMs }}
                # The dial's topic retention, which dfe-extras hands dfe-engine
                # for the topics it creates.
                topicRetentionMs: {{ $kafkaRetentionMs | quote }}
                {{- end }}
              {{- end }}
              {{- if $kafkaMessageMaxBytes }}
              {{- if eq .deploy.service "dfe-receiver" "dfe-loader" }}
              # The producer's own record ceiling, so a record the topic would
              # refuse is dead-lettered before the send. A config file's map
              # replaces the app's default overrides whole, so the statistics
              # interval each default carried is restated.
              configOverrides:
                kafka:
                  librdkafka_overrides:
                    message.max.bytes: {{ $kafkaMessageMaxBytes | quote }}
                    statistics.interval.ms: {{ ternary "0" "5000" (eq .deploy.service "dfe-receiver") | quote }}
              {{- else if eq .deploy.service "dfe-fetcher" "dfe-archiver" }}
              # Each lays this map over its own settings key by key, so it names the
              # size alone and the archiver keeps the statistics its lag signal reads.
              configOverrides:
                kafka:
                  librdkafka_overrides:
                    message.max.bytes: {{ $kafkaMessageMaxBytes | quote }}
              {{- else if eq .deploy.service "dfe-transform-vrl" "dfe-transform-vector" }}
              # The sink producer's record ceiling, and the size dfe-transform-vector
              # filters records off Vector's Kafka sink at.
              configOverrides:
                sink:
                  librdkafka_options:
                    message.max.bytes: {{ $kafkaMessageMaxBytes | quote }}
              {{- else if eq .deploy.service "dfe-transform-elastic" }}
              # Its producer keeps the stack's ceiling, so its record budget sits
              # under the broker's by the 1 MiB in 16 the app keeps for framing.
              extraEnv:
                DFE_TRANSFORM_ELASTIC_SINK_MAX_MESSAGE_BYTES: {{ div (mul (int64 $kafkaMessageMaxBytes) 15) 16 | quote }}
              {{- end }}
              {{- end }}
              {{- if eq (index .metadata.annotations "dfe.hyperi.io/clickhouse_mode" | default "") "external" }}
              {{- $chPort := index .metadata.annotations "dfe.hyperi.io/clickhouse_port" }}
              # The deployer's own server, which every app dials in its own scheme and verifies against the system roots.
              clickhouse:
                mode: external
                host: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_host" | quote }}
                port: {{ $chPort }}
                nativePort: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_native_port" }}
                user: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_user" | quote }}
                tls:
                  enabled: {{ eq (index .metadata.annotations "dfe.hyperi.io/clickhouse_secure" | default "") "true" }}
                  port: {{ $chPort }}
                  ca:
                    secretName: ""
                    configMapName: ""
              {{- end }}
              {{- $pullSecret := index .metadata.annotations "dfe.hyperi.io/image_pull_secret" | default "" }}
              {{- if $pullSecret }}
              # Only the secret bootstrap.sh created. An absent annotation names none: images pull anonymously.
              imagePullSecrets:
                - {{ $pullSecret | quote }}
              {{- end }}
              {{- $eipAllocations := index .metadata.annotations "dfe.hyperi.io/receiver_eip_allocations" | default "" }}
              {{- $subnets := index .metadata.annotations "dfe.hyperi.io/receiver_subnets" | default "" }}
              {{- if and $eipAllocations (eq .deploy.service "dfe-receiver") }}
              # The Elastic IPs the cloud root allocated for the receiver's NLB, one
              # per public subnet in the same order. A fact, so the deploy repo's
              # exposure.groups.ingest decides whether the NLB exists, never these.
              exposure:
                public:
                  eipAllocations: {{ splitList "," $eipAllocations | toJson }}
                  subnets: {{ splitList "," $subnets | toJson }}
              {{- end }}
        # The DFE-only objects beside the thin chart. chartName picks this component's objects.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          path: helm/charts/dfe-extras
          helm:
            # Helm caps this source's release name alike. dfe-common labels objects app.kubernetes.io/instance with it.
            releaseName: '{{ $app := printf "%v-%v-%v" .deploy.service .deploy.instance .name }}{{ if gt (len $app) 53 }}{{ trunc 44 $app | trimSuffix "-" }}-{{ sha256sum $app | trunc 8 }}{{ end }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - "$infra/argocd/values/common.yaml"
              - '$infra/argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - "$infra/argocd/values/apps/_common.yaml"
              - "$infra/argocd/values/apps/{{ .deploy.service }}/values.yaml"
              - '$infra/argocd/values/apps/{{ .deploy.service }}/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
              - '$infra/argocd/values/apps/{{ .deploy.service }}/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
              - '$values/infra/common.yaml'
              - '$values/{{ .path.path }}/{{ .path.filename }}'
            parameters:
              - name: chartName
                value: '{{ .deploy.service }}'
              - name: global.registry
                value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
              - name: gitops.repoUrl
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
              - name: gitops.branch
                value: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}'
              - name: domain
                value: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              - name: env
                value: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
              - name: cloud
                value: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              - name: e2eServer
                value: '{{ index .metadata.annotations "dfe.hyperi.io/e2e_server" | default "false" }}'
              - name: publicService.loadBalancerIP
                value: '{{ index .metadata.annotations "dfe.hyperi.io/receiver_address" }}'
              - name: retention.defaultTtlDays
                value: '{{ index .metadata.annotations "dfe.hyperi.io/clickhouse_default_ttl_days" | default "90" }}'
              - name: stackVersion
                value: '{{ index .metadata.annotations "dfe.hyperi.io/stack_version" | default "" }}'
              - name: profile
                value: '{{ index .metadata.annotations "dfe.hyperi.io/profile" }}'
              - name: clickhouse.tls.internalCA.present
                value: '{{ ne (index .metadata.labels "dfe.hyperi.io/edge" | default "true") "false" }}'
            values: |
              {{- $kafkaMode := index .metadata.annotations "dfe.hyperi.io/kafka_mode" }}
              {{- $kafkaBootstrap := index .metadata.annotations "dfe.hyperi.io/kafka_bootstrap" }}
              {{- $kafkaSecurityProtocol := index .metadata.annotations "dfe.hyperi.io/kafka_security_protocol" }}
              {{- $kafkaMessageMaxBytes := index .metadata.annotations "dfe.hyperi.io/kafka_message_max_bytes" }}
              {{- $kafkaRetentionMs := index .metadata.annotations "dfe.hyperi.io/kafka_retention_ms" }}
              {{- if or $kafkaMode $kafkaMessageMaxBytes $kafkaRetentionMs }}
              kafka:
                {{- if $kafkaMode }}
                mode: {{ $kafkaMode | quote }}
                {{- if and (eq $kafkaMode "external") $kafkaBootstrap }}
                bootstrapServers: {{ $kafkaBootstrap | quote }}
                {{- end }}
                {{- if and (eq $kafkaMode "external") $kafkaSecurityProtocol }}
                securityProtocol: {{ $kafkaSecurityProtocol | quote }}
                {{- end }}
                {{- if eq $kafkaMode "external" }}
                topicReplicationFactor: 3
                {{- end }}
                {{- end }}
                {{- if $kafkaMessageMaxBytes }}
                messageMaxBytes: {{ $kafkaMessageMaxBytes | quote }}
                {{- end }}
                {{- if $kafkaRetentionMs }}
                topicRetentionMs: {{ $kafkaRetentionMs | quote }}
                {{- end }}
              {{- end }}
              {{- if $kafkaMessageMaxBytes }}
              {{- if eq .deploy.service "dfe-receiver" "dfe-loader" }}
              configOverrides:
                kafka:
                  librdkafka_overrides:
                    message.max.bytes: {{ $kafkaMessageMaxBytes | quote }}
                    statistics.interval.ms: {{ ternary "0" "5000" (eq .deploy.service "dfe-receiver") | quote }}
              {{- else if eq .deploy.service "dfe-fetcher" "dfe-archiver" }}
              configOverrides:
                kafka:
                  librdkafka_overrides:
                    message.max.bytes: {{ $kafkaMessageMaxBytes | quote }}
              {{- else if eq .deploy.service "dfe-transform-vrl" "dfe-transform-vector" }}
              configOverrides:
                sink:
                  librdkafka_options:
                    message.max.bytes: {{ $kafkaMessageMaxBytes | quote }}
              {{- else if eq .deploy.service "dfe-transform-elastic" }}
              extraEnv:
                DFE_TRANSFORM_ELASTIC_SINK_MAX_MESSAGE_BYTES: {{ div (mul (int64 $kafkaMessageMaxBytes) 15) 16 | quote }}
              {{- end }}
              {{- end }}
              {{- if eq (index .metadata.annotations "dfe.hyperi.io/clickhouse_mode" | default "") "external" }}
              {{- $chPort := index .metadata.annotations "dfe.hyperi.io/clickhouse_port" }}
              clickhouse:
                mode: external
                host: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_host" | quote }}
                port: {{ $chPort }}
                nativePort: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_native_port" }}
                user: {{ index .metadata.annotations "dfe.hyperi.io/clickhouse_user" | quote }}
                tls:
                  enabled: {{ eq (index .metadata.annotations "dfe.hyperi.io/clickhouse_secure" | default "") "true" }}
                  port: {{ $chPort }}
                  ca:
                    secretName: ""
                    configMapName: ""
              {{- end }}
              {{- $pullSecret := index .metadata.annotations "dfe.hyperi.io/image_pull_secret" | default "" }}
              {{- if $pullSecret }}
              imagePullSecrets:
                - {{ $pullSecret | quote }}
              {{- end }}
              {{- $eipAllocations := index .metadata.annotations "dfe.hyperi.io/receiver_eip_allocations" | default "" }}
              {{- $subnets := index .metadata.annotations "dfe.hyperi.io/receiver_subnets" | default "" }}
              {{- if and $eipAllocations (eq .deploy.service "dfe-receiver") }}
              exposure:
                public:
                  eipAllocations: {{ splitList "," $eipAllocations | toJson }}
                  subnets: {{ splitList "," $subnets | toJson }}
              {{- end }}
              {{- if and (index .metadata.annotations "dfe.hyperi.io/engine_secrets_prefix" | default "") (eq .deploy.service "dfe-engine") }}
              # Where the aws root fenced the engine's own role: what the engine
              # mints goes to Secrets Manager under this prefix, region and key,
              # tagged so a sweep finds it, and deletes keep no window. Here alone:
              # the thin chart's schema holds every secrets.<key> to a secret group.
              secrets:
                provider: aws
                region: {{ index .metadata.annotations "dfe.hyperi.io/region" | quote }}
                namePrefix: {{ index .metadata.annotations "dfe.hyperi.io/engine_secrets_prefix" | quote }}
                kmsKeyId: {{ index .metadata.annotations "dfe.hyperi.io/kms_key_arn" | default "" | quote }}
                tags: {{ index .metadata.annotations "dfe.hyperi.io/resource_tags" | default "{}" | fromJson | toJson }}
                recoveryWindowDays: 0
              {{- end }}
              {{- if and (index .metadata.annotations "dfe.hyperi.io/engine_secrets_prefix" | default "") (eq .deploy.service "dfe-receiver") }}
              # The store the receiver reads the engine's bearer-token secrets from.
              # Pod Identity injects credentials and no region.
              secrets:
                provider: aws
                region: {{ index .metadata.annotations "dfe.hyperi.io/region" | quote }}
              {{- end }}
        # This repo again at dfe-extras' revision: Argo reads one revision per repo URL.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
          targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
          ref: infra
        # The deploy repo. A cluster secret naming it at another revision fails the render, for the same reason.
        - repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/config_repo_url" }}'
          targetRevision: '{{ $infra := index .metadata.annotations "dfe.hyperi.io/repo_url" | default "" | lower | trimSuffix "/" | trimSuffix ".git" }}{{ $deploy := index .metadata.annotations "dfe.hyperi.io/config_repo_url" | default "" | lower | trimSuffix "/" | trimSuffix ".git" }}{{ $revision := index .metadata.annotations "dfe.hyperi.io/config_repo_revision" }}{{ if and (eq $infra $deploy) (ne $revision (index .metadata.annotations "dfe.hyperi.io/target_revision")) }}{{ fail "dfe.hyperi.io/config_repo_url names the chart repo at a revision other than dfe.hyperi.io/target_revision -- Argo CD reads one revision per repo, so give the deploy repo its own repo or the same revision" }}{{ end }}{{ $revision }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}'
      # Replica count belongs to KEDA's HPA, so selfHeal must not revert a scale. Covers charts this repo does not own.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        # dfe-engine writes bearer tokens and alert destinations into these Secrets, so a sync must not take them back.
        # The names are common.yaml's ingestBearer.secretName and alertDestinations.secretName, held equal by test_ingest_bearer_secret.py.
        - kind: Secret
          name: dfe-ingest-bearer-tokens
          jsonPointers:
            - /data
        - kind: Secret
          name: dfe-alert-destinations
          jsonPointers:
            - /data
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
