# Scale-profile-only apps: Kafka operator + Strimzi Kafka + transform services.
# These deploy ONLY on clusters labelled dfe.hyperi.io/profile: scale.
# slim + single clusters lack the label, so nothing here is generated (no
# goTemplate skipping needed): slim has no Kafka at all, and single runs a
# NON-operator single broker (kafka-single.yaml) that needs no operator.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                - chart: strimzi-kafka-operator
                  repo: https://strimzi.io/charts/
                  version: "0.51.0"
                  namespace: strimzi
                  wave: "3"
                  appProject: infra
                # Official ClickHouse operator (clickhouse.com CRDs) -- cluster
                # mode only. Single mode uses a plain StatefulSet (no operator).
                # OCI chart; wave 3 so CRDs exist before the ClickHouseCluster CR
                # (layer2-data, wave 4). Pinned 0.0.7 @sha256:927f432f... .
                # Swappable: the HyperI private cloud may replace this with the
                # internal n-tier cached operator + CH fork (docs/deployment/
                # clickhouse.md). The Altinity operator is NOT tested with this
                # stack -- do not substitute it and expect the CRs to hold.
                # Namespace is upstream's own and MUST match common.yaml
                # operatorNamespaces.clickhouse, which is what opens the
                # NetworkPolicy the operator needs to probe Keeper and run DDL.
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.7"
                  namespace: clickhouse-operator-system
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          valuesObject:
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Redpanda operator -- installed ONLY when a deployer runs the scale profile
  # AND has explicitly chosen the redpanda kafka provider (cluster label
  # dfe.hyperi.io/kafka-provider: redpanda). Strimzi (default, Apache-2.0) is in
  # dfe-scale-operators above and lands on every scale cluster; redpanda is BSL,
  # so its operator only appears on an explicit opt-in (the same choice the kafka
  # chart's acceptLicense gate enforces). Serves the Redpanda + User CRDs that the
  # kafka chart's redpanda path uses. Wave 3 so CRDs exist before layer2-data
  # (wave 4) creates the Redpanda CR.
  name: dfe-redpanda-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
            dfe.hyperi.io/profile: scale
            dfe.hyperi.io/kafka-provider: redpanda
  template:
    metadata:
      name: 'redpanda-operator-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: infra
      source:
        repoURL: https://charts.redpanda.com
        chart: operator
        targetRevision: "26.1.6"
        helm:
          valuesObject:
            crds:
              enabled: true
      destination:
        server: '{{ .server }}'
        namespace: redpanda-operator
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                # Kafka itself moved to layer2-data (mode-driven, all profiles).
                # layer-scale keeps the Strimzi operator (dfe-scale-operators) +
                # the Kafka-dependent transforms.
                #
                # NO transforms are deployed by default, and that is deliberate.
                #
                # A transform is PER-SOURCE and opt-in (the Source-Definition SSoT):
                # it moves one topic to another, so it is meaningless until a Source
                # says which. The default data path -- receiver -> Kafka -> loader ->
                # ClickHouse -- has no transform hop at all.
                #
                # Every transform listed here was broken in deploy, two different ways:
                #   - wasm / elastic / splack are built-FOR, not built-WITH -- nowhere
                #     near GA. elastic and splack have no Dockerfile at all (library
                #     crates: there is no image to pull, ever), wasm is unpublished
                #     alpha. All three sat in ImagePullBackOff for the life of the
                #     cluster. This restores the contract versions.yaml ALREADY states:
                #     "An app with no digest here is NOT YET PUBLISHED and is excluded
                #     from rendered manifests."
                #   - vrl / vector ARE published, but their sourceTopic/destTopic are
                #     empty ("set per deployment") and nothing set them, so they died
                #     on "sink.topic must not be empty" and crashlooped.
                #
                # Between them they jammed `dfe-ops verify`, whose gate is
                # all-pods-Ready -- so unconfigured, unshippable transforms were
                # blocking the default E2E acceptance for the whole deploy.
                #
                # To deploy one: give it a Source-driven config (sourceTopic +
                # destTopic) and add it back here. For wasm/elastic/splack, GA and a
                # digest in versions.yaml come first.
                []
  template:
    metadata:
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
        targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
        path: 'helm/charts/{{ .app }}'
        helm:
          valueFiles:
            - "../../../argocd/values/common.yaml"
            - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
            - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: '{{ if .namespace }}{{ .namespace }}{{ else }}{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}{{ end }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
