# Operators and apps the scale tiers need, selected by dfe.hyperi.io/profile.
# dfe-scale-operators: Strimzi + the ClickHouse operator, profile scale only.
# dfe-mesh-operators: the ClickHouse operator alone, profile mesh only
# (that tier runs no broker).
# dfe-redpanda-operator: scale plus an explicit redpanda provider opt-in.
# dfe-scale-apps: the per-source transform workers, on both scale tiers; the
# element list is empty by default (see its own header).
# slim + single clusters match none of these: slim has no Kafka at all, and single
# runs a NON-operator single broker (kafka-single.yaml) that needs no operator.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                - chart: strimzi-kafka-operator
                  repo: https://strimzi.io/charts/
                  version: "0.51.0"
                  namespace: strimzi
                  wave: "3"
                  appProject: infra
                # Official ClickHouse operator (clickhouse.com CRDs) -- cluster
                # mode only. Single mode uses a plain StatefulSet (no operator).
                # OCI chart; wave 3 so CRDs exist before the ClickHouseCluster CR
                # (layer2-data, wave 4). Pinned 0.0.7 @sha256:927f432f... .
                # Swappable: the HyperI private cloud may replace this with the
                # internal n-tier cached operator + CH fork (docs/deployment/
                # clickhouse.md). The Altinity operator is NOT tested with this
                # stack -- do not substitute it and expect the CRs to hold.
                # Namespace is upstream's own and MUST match common.yaml
                # operatorNamespaces.clickhouse, which is what opens the
                # NetworkPolicy the operator needs to probe Keeper and run DDL.
                # dfe-mesh-operators below carries the same pin; both move together.
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.7"
                  namespace: clickhouse-operator-system
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          valuesObject:
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
# The mesh tier runs a ClickHouse cluster and no broker, so it needs the
# ClickHouse operator without Strimzi. A separate ApplicationSet rather than a
# wider selector on dfe-scale-operators: moving an element between ApplicationSets
# orphans the Applications a running scale cluster already owns by name.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-mesh-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: mesh
          - list:
              elements:
                # Same pin as dfe-scale-operators above; the two move together.
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.7"
                  namespace: clickhouse-operator-system
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          valuesObject:
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Redpanda operator -- installed ONLY when a deployer runs the scale profile
  # AND has explicitly chosen the redpanda kafka provider (cluster label
  # dfe.hyperi.io/kafka-provider: redpanda). Strimzi (default, Apache-2.0) is in
  # dfe-scale-operators above and lands on every scale cluster; redpanda is BSL,
  # so its operator only appears on an explicit opt-in (the same choice the kafka
  # chart's acceptLicense gate enforces). Serves the Redpanda + User CRDs that the
  # kafka chart's redpanda path uses. Wave 3 so CRDs exist before layer2-data
  # (wave 4) creates the Redpanda CR.
  name: dfe-redpanda-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
            dfe.hyperi.io/profile: scale
            dfe.hyperi.io/kafka-provider: redpanda
  template:
    metadata:
      name: 'redpanda-operator-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: infra
      source:
        repoURL: https://charts.redpanda.com
        chart: operator
        targetRevision: "26.1.11"
        helm:
          valuesObject:
            crds:
              enabled: true
      destination:
        server: '{{ .server }}'
        namespace: redpanda-operator
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                matchExpressions:
                  - key: dfe.hyperi.io/profile
                    operator: In
                    values: [scale, mesh]
          - list:
              elements:
                # Kafka itself moved to layer2-data (mode-driven, all profiles).
                # layer-scale keeps the Strimzi operator (dfe-scale-operators) +
                # the Kafka-dependent transforms.
                #
                # NO transforms are deployed by default, and that is deliberate.
                #
                # A transform is PER-SOURCE and opt-in (the Source-Definition SSoT):
                # it moves one topic to another, so it is meaningless until a Source
                # says which. The default data path -- receiver -> Kafka -> loader ->
                # ClickHouse -- has no transform hop at all.
                #
                # Every transform listed here was broken in deploy, two different ways:
                #   - splack and wasm have no published image: their versions.yaml
                #     pins are commented out, so they are excluded from every
                #     rendered manifest and sat in ImagePullBackOff for the life of
                #     the cluster. This restores the contract versions.yaml ALREADY
                #     states: "An app with no digest here is NOT YET PUBLISHED and is
                #     excluded from rendered manifests."
                #   - vrl / vector ARE published, but their sourceTopic/destTopic are
                #     empty ("set per deployment") and nothing set them, so they died
                #     on "sink.topic must not be empty" and crashlooped.
                #
                # Between them they jammed `dfe-ops verify`, whose gate is
                # all-pods-Ready -- so unconfigured, unshippable transforms were
                # blocking the default E2E acceptance for the whole deploy.
                #
                # elastic is no longer in that set: it publishes images (v1.1.2 on
                # GHCR as a multi-arch index) and its pin moves with the rc.14 cut.
                # Its chart also has no topic dials to set -- PR #344 removed
                # sourceTopic, destTopic and consumerGroup because the app reads
                # none of them, and the engine compiles its routing from the source.
                #
                # To deploy vrl or vector: give it a Source-driven config
                # (sourceTopic + destTopic) and add it back here. For splack and
                # wasm, a published image and a digest in versions.yaml come first.
                #
                # dfe-transform-splack and dfe-transform-wasm are coming: alpha,
                # unpublished, and their versions.yaml pins are commented out, so
                # they cannot be added back here until both are uncommented.
                []
  template:
    metadata:
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
        targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
        path: 'helm/charts/{{ .app }}'
        helm:
          valueFiles:
            - "../../../argocd/values/common.yaml"
            - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
            - '../../../argocd/values/profile-{{ index .metadata.annotations "dfe.hyperi.io/profile" }}.yaml'
          parameters:
            # The registry every dfe-* image is pulled from, guarded exactly as
            # in layer2-apps: a missing annotation fails the render rather than
            # sending each image to Docker Hub.
            - name: global.registry
              value: '{{ $r := index .metadata.annotations "dfe.hyperi.io/registry" }}{{ if not $r }}{{ fail "the cluster secret carries no dfe.hyperi.io/registry -- re-run dfe-ops stack-deploy from this revision to write it" }}{{ end }}{{ $r }}'
          # `values` (a YAML string) rather than a structured block, same reason
          # layer2-apps.yaml gives: a conditional cannot live in a field this
          # file's own tests parse as plain YAML before any Go templating runs.
          values: |
            {{- $pullSecret := "ghcr-pull-secret" }}
            {{- range $key, $name := .metadata.annotations }}{{ if eq $key "dfe.hyperi.io/image_pull_secret" }}{{ $pullSecret = $name }}{{ end }}{{ end }}
            {{- if $pullSecret }}
            # Only the secret bootstrap.sh created, or ghcr-pull-secret on an older cluster secret.
            imagePullSecrets:
              - {{ $pullSecret | quote }}
            {{- end }}
      destination:
        server: '{{ .server }}'
        namespace: '{{ if .namespace }}{{ .namespace }}{{ else }}{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}{{ end }}'
      # Replica count belongs to KEDA's HPA, so selfHeal must not revert a scale as
      # drift. RespectIgnoreDifferences applies the rule during sync, not only in
      # the diff view. The charts omit `replicas:` under KEDA too
      # (dfe-common.replicas) -- this covers charts this repo does not own.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
