# Scale-profile-only apps: Kafka operator + Strimzi Kafka + transform services.
# These deploy ONLY on clusters labelled dfe.hyperi.io/profile: scale.
# Standard-profile clusters lack the label, so nothing here is generated --
# that is how "standard = no Kafka" is enforced (no goTemplate skipping needed).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                - chart: strimzi-kafka-operator
                  repo: https://strimzi.io/charts/
                  version: "0.51.0"
                  namespace: strimzi
                  wave: "3"
                  appProject: infra
                # Official ClickHouse operator (clickhouse.com CRDs) -- cluster
                # mode only. Single mode uses a plain StatefulSet (no operator).
                # OCI chart; wave 3 so CRDs exist before the ClickHouseCluster CR
                # (layer2-data, wave 4). Pinned 0.0.5 @sha256:bbdaf6f... .
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.5"
                  namespace: clickhouse-operator
                  wave: "3"
                  appProject: infra
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          valuesObject:
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Redpanda operator -- installed ONLY when a deployer runs the scale profile
  # AND has explicitly chosen the redpanda kafka provider (cluster label
  # dfe.hyperi.io/kafka-provider: redpanda). Strimzi (default, Apache-2.0) is in
  # dfe-scale-operators above and lands on every scale cluster; redpanda is BSL,
  # so its operator only appears on an explicit opt-in (the same choice the kafka
  # chart's acceptLicense gate enforces). Serves the Redpanda + User CRDs that the
  # kafka chart's redpanda path uses. Wave 3 so CRDs exist before layer2-data
  # (wave 4) creates the Redpanda CR.
  name: dfe-redpanda-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
            dfe.hyperi.io/profile: scale
            dfe.hyperi.io/kafka-provider: redpanda
  template:
    metadata:
      name: 'redpanda-operator-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: infra
      source:
        repoURL: https://charts.redpanda.com
        chart: operator
        targetRevision: "26.1.6"
        helm:
          valuesObject:
            crds:
              enabled: true
      destination:
        server: '{{ .server }}'
        namespace: redpanda-operator
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                # Kafka itself moved to layer2-data (mode-driven, all profiles).
                # layer-scale keeps the Strimzi operator (dfe-scale-operators) +
                # the Kafka-dependent transforms.
                - app: dfe-transform-wasm
                  namespace: ""
                  wave: "5"
                  appProject: dfe-apps
                - app: dfe-transform-vrl
                  namespace: ""
                  wave: "5"
                  appProject: dfe-apps
                - app: dfe-transform-vector
                  namespace: ""
                  wave: "5"
                  appProject: dfe-apps
                - app: dfe-transform-elastic
                  namespace: ""
                  wave: "5"
                  appProject: dfe-apps
                - app: dfe-transform-splack
                  namespace: ""
                  wave: "5"
                  appProject: dfe-apps
  template:
    metadata:
      name: '{{ .app }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ index .metadata.annotations "dfe.hyperi.io/repo_url" }}'
        targetRevision: '{{ index .metadata.annotations "dfe.hyperi.io/target_revision" }}'
        path: 'helm/charts/{{ .app }}'
        helm:
          valueFiles:
            - "../../../argocd/values/common.yaml"
            - '../../../argocd/values/{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}.yaml'
            - '../../../argocd/values/profile-{{ dig "dfe.hyperi.io/profile" "standard" .metadata.annotations }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: '{{ if .namespace }}{{ .namespace }}{{ else }}{{ index .metadata.annotations "dfe.hyperi.io/dfe_namespace" }}{{ end }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
