# Operators for the scale tiers, selected by dfe.hyperi.io/profile. See docs/deployment/appsets.md#scale-operators.
# dfe-scale-operators: profile scale. dfe-mesh-operators: profile mesh. dfe-redpanda-operator: scale with kafka-provider redpanda.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                - chart: strimzi-kafka-operator
                  repo: https://strimzi.io/charts/
                  version: "1.2.0"
                  namespace: strimzi
                  wave: "3"
                  appProject: infra
                  chartValuesYaml: ""
                # Wave 3 so the CRDs exist before layer2-data's wave 4.
                # The namespace must match common.yaml operatorNamespaces.clickhouse, which opens the NetworkPolicy the operator needs.
                # dfe-mesh-operators below carries the same pin and chartValuesYaml.
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.8"
                  namespace: clickhouse-operator-system
                  wave: "3"
                  appProject: infra
                  # manager.args replaces the chart's default list, so --leader-elect is restated.
                  chartValuesYaml: |
                    manager:
                      args:
                        - --leader-elect
                        - --zap-log-level=info
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          # A string: the template is parsed as YAML before Go templating, so only a string carries chartValuesYaml.
          values: |
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
            {{- with .chartValuesYaml }}{{ . | nindent 0 }}{{- end }}
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
# The mesh tier runs ClickHouse and no broker. A separate ApplicationSet, because moving an element would orphan the Applications a running scale cluster owns by name.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-mesh-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: mesh
          - list:
              elements:
                # Same pin and chartValuesYaml as dfe-scale-operators.
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.8"
                  namespace: clickhouse-operator-system
                  wave: "3"
                  appProject: infra
                  chartValuesYaml: |
                    manager:
                      args:
                        - --leader-elect
                        - --zap-log-level=info
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          # A string: the template is parsed as YAML before Go templating, so only a string carries chartValuesYaml.
          values: |
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
            {{- with .chartValuesYaml }}{{ . | nindent 0 }}{{- end }}
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Only on scale with kafka-provider redpanda, an explicit opt-in because redpanda is BSL. Wave 3 so the CRDs exist before layer2-data's wave 4.
  name: dfe-redpanda-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
            dfe.hyperi.io/profile: scale
            dfe.hyperi.io/kafka-provider: redpanda
  template:
    metadata:
      name: 'redpanda-operator-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: infra
      source:
        repoURL: https://charts.redpanda.com
        chart: operator
        targetRevision: "26.2.5"
        helm:
          valuesObject:
            crds:
              enabled: true
      destination:
        server: '{{ .server }}'
        namespace: redpanda-operator
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
