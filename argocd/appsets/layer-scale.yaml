# Operators the scale tiers need, selected by dfe.hyperi.io/profile.
# dfe-scale-operators: Strimzi + the ClickHouse operator, profile scale only.
# dfe-mesh-operators: the ClickHouse operator alone, profile mesh only
# (that tier runs no broker).
# dfe-redpanda-operator: scale plus an explicit redpanda provider opt-in.
# The transforms deploy from their thin charts through layer2-apps.yaml.
# slim + single clusters match none of these: slim has no Kafka at all, and single
# runs a NON-operator single broker (kafka-single.yaml) that needs no operator.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-scale-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: scale
          - list:
              elements:
                - chart: strimzi-kafka-operator
                  repo: https://strimzi.io/charts/
                  version: "1.2.0"
                  namespace: strimzi
                  wave: "3"
                  appProject: infra
                  chartValuesYaml: ""
                # Official ClickHouse operator (clickhouse.com CRDs) -- cluster
                # mode only. Single mode uses a plain StatefulSet (no operator).
                # OCI chart; wave 3 so CRDs exist before the ClickHouseCluster CR
                # (layer2-data, wave 4). Pinned 0.0.8 @sha256:61d97bb4... .
                # Swappable: the HyperI private cloud may replace this with the
                # internal n-tier cached operator + CH fork (docs/deployment/
                # clickhouse.md). The Altinity operator is NOT tested with this
                # stack -- do not substitute it and expect the CRs to hold.
                # Namespace is upstream's own and MUST match common.yaml
                # operatorNamespaces.clickhouse, which is what opens the
                # NetworkPolicy the operator needs to probe Keeper and run DDL.
                # dfe-mesh-operators below carries the same pin and the same
                # chartValuesYaml; both move together.
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.8"
                  namespace: clickhouse-operator-system
                  wave: "3"
                  appProject: infra
                  # The operator builds its logger in zap development mode, which
                  # is debug level (cmd/main.go, v0.0.8). manager.args is appended
                  # to the chart's own flags but replaces its default list, so
                  # --leader-elect has to be restated.
                  chartValuesYaml: |
                    manager:
                      args:
                        - --leader-elect
                        - --zap-log-level=info
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          # A string, not valuesObject: the template is parsed as YAML before it
          # is Go-templated, so only a string can carry an element's chartValuesYaml.
          values: |
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
            {{- with .chartValuesYaml }}{{ . | nindent 0 }}{{- end }}
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
# The mesh tier runs a ClickHouse cluster and no broker, so it needs the
# ClickHouse operator without Strimzi. A separate ApplicationSet rather than a
# wider selector on dfe-scale-operators: moving an element between ApplicationSets
# orphans the Applications a running scale cluster already owns by name.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dfe-mesh-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  dfe.hyperi.io/managed: "true"
                  dfe.hyperi.io/profile: mesh
          - list:
              elements:
                # Same pin and chartValuesYaml as dfe-scale-operators above; the
                # two move together.
                - chart: clickhouse-operator-helm
                  repo: ghcr.io/clickhouse
                  version: "0.0.8"
                  namespace: clickhouse-operator-system
                  wave: "3"
                  appProject: infra
                  chartValuesYaml: |
                    manager:
                      args:
                        - --leader-elect
                        - --zap-log-level=info
  template:
    metadata:
      name: '{{ .chart }}-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ .appProject }}'
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
        helm:
          # A string, not valuesObject: the template is parsed as YAML before it
          # is Go-templated, so only a string can carry an element's chartValuesYaml.
          values: |
            global:
              domain: '{{ index .metadata.annotations "dfe.hyperi.io/domain" }}'
              cloud: '{{ index .metadata.annotations "dfe.hyperi.io/cloud" }}'
              env: '{{ index .metadata.annotations "dfe.hyperi.io/env" }}'
            {{- with .chartValuesYaml }}{{ . | nindent 0 }}{{- end }}
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Redpanda operator -- installed ONLY when a deployer runs the scale profile
  # AND has explicitly chosen the redpanda kafka provider (cluster label
  # dfe.hyperi.io/kafka-provider: redpanda). Strimzi (default, Apache-2.0) is in
  # dfe-scale-operators above and lands on every scale cluster; redpanda is BSL,
  # so its operator only appears on an explicit opt-in (the same choice the kafka
  # chart's acceptLicense gate enforces). Serves the Redpanda + User CRDs that the
  # kafka chart's redpanda path uses. Wave 3 so CRDs exist before layer2-data
  # (wave 4) creates the Redpanda CR.
  name: dfe-redpanda-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            dfe.hyperi.io/managed: "true"
            dfe.hyperi.io/profile: scale
            dfe.hyperi.io/kafka-provider: redpanda
  template:
    metadata:
      name: 'redpanda-operator-{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: infra
      source:
        repoURL: https://charts.redpanda.com
        chart: operator
        targetRevision: "26.2.4"
        helm:
          valuesObject:
            crds:
              enabled: true
      destination:
        server: '{{ .server }}'
        namespace: redpanda-operator
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
