# Standalone Application for the in-repo envoy-gateway-config chart.
# Cannot use the layer1-addons ApplicationSet because it templates
# source.chart (external repos), while this needs source.path (git repo).
# NOTE: repoURL and valueFiles cloud overlay are templated by bootstrap.sh via envsubst.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infra
  source:
    repoURL: ${DFE_REPO_URL}
    targetRevision: ${DFE_TARGET_REVISION}
    path: helm/charts/envoy-gateway-config
    helm:
      valueFiles:
        - ../../../argocd/values/common.yaml
        - ../../../argocd/values/${DFE_CLOUD}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
