# NOTE: repoURL and valueFiles cloud overlay are templated by bootstrap.sh via envsubst.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infra
  source:
    repoURL: ${DFE_REPO_URL}
    targetRevision: ${DFE_TARGET_REVISION}
    path: helm/charts/network-policies
    helm:
      valueFiles:
        - ../../../argocd/values/common.yaml
        - ../../../argocd/values/${DFE_CLOUD}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
