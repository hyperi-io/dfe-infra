# In-repo chart — standalone Application (same pattern as envoy-gateway-config).
# NOTE: repoURL and valueFiles cloud overlay are templated by bootstrap.sh via envsubst.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-scalers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: infra
  source:
    repoURL: ${DFE_REPO_URL}
    targetRevision: ${DFE_TARGET_REVISION}
    path: helm/charts/keda-scalers
    helm:
      valueFiles:
        - ../../../argocd/values/common.yaml
        - ../../../argocd/values/${DFE_CLOUD}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
