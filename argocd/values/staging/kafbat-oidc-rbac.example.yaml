# STAGED, NOT LIVE. Kafbat auth: local break-glass + OIDC locked to dfe-infra roles.
#
# The kafbat chart (helm/charts/kafbat) already ships the full auth build - local
# break-glass LOGIN_FORM recovery PLUS native kafbat OIDC (OAUTH2) with an RBAC
# role map. It is dormant by default (oidc.enabled=false, ro and rw empty, admin
# taking the deployment's adminGroups from argocd/values/common.yaml) so a bare
# cluster still boots. This overlay ENABLES it and fills the read-only subjects.
#
# It lives under argocd/values/staging/ so ArgoCD does NOT read it (the appset
# cascade only reads common.yaml + <cloud>.yaml + profile-<tier>.yaml). Every key
# below is the kafbat chart's own top-level value, the way layer2-data hands its
# values files to the chart. Applying = copy this file into the deployment's
# deploy repo as infra/kafbat.yaml, the per-chart overlay layer2-data layers last
# and onto the kafbat chart alone, and commit - but ONLY after the parked
# provisioning below, because kafbat REFUSES TO BOOT if OAUTH2 is enabled with
# no reachable provider/secret.
#
# ---------------------------------------------------------------------------
# PARKED provisioning (do these first, in order - each needs network/bao/live IdP)
# ---------------------------------------------------------------------------
# 1. Register a `kafbat` OIDC client at the deployment's external OIDC provider
#    (the SAME IdP configured in oidc.providers - Entra / Okta / Google / any
#    conformant OIDC IdP). Register the redirect URI:
#      https://kafbat.example.com/login/oauth2/code/dfe
#    (spring-security's redirect path is /login/oauth2/code/<registrationId>;
#    the chart's registrationId is `dfe` - see templates/configmap.yaml.)
# 2. Store the client secret in the estate secret store and add an ExternalSecret
#    `dfe-kafbat-oidc` in the kafka namespace that materialises it with key
#    `client-secret` (clientSecretName below).
# 3. The dfe-infra groups the RBAC subjects reference must be REAL group claims
#    the IdP emits: dfe-infra, dfe-admins (full admin) and dfe-infra-viewers
#    (read-only). An OIDC test fixture for this overlay must emit exactly these.
# 4. Exposing kafbat at a hostname needs a working L7 gateway on the target
#    cluster; without one, reach it via `kubectl -n kafka port-forward`.
#    kafbat is deliberately NOT behind the Envoy edge OIDC policy: it does
#    its OWN OIDC so it can read the group claim for RBAC (the edge only injects
#    X-Oidc-* headers, which carry no groups).
# 5. Copy this file into the deploy repo as infra/kafbat.yaml and commit.
#
# Break-glass stays enabled throughout: if the IdP is down, flip auth.type to
# LOGIN_FORM and log in as dfe-breakglass (secret dfe-kafbat-breakglass) which
# maps to the admin role.
# ---------------------------------------------------------------------------

auth:
  type: OAUTH2            # primary: OIDC. Break-glass recovery = LOGIN_FORM.

oidc:
  enabled: true
  issuerUri: https://oidc.example.com   # the deployment's external OIDC provider
  clientId: kafbat
  clientSecretName: dfe-kafbat-oidc   # ESO Secret, key: client-secret
  rolesField: groups                  # the claim carrying the user's groups

# RBAC locked to the dfe-infra role vocabulary (dfe-engine roles.yaml /
# rbac-vocabulary.md). Full admin is the deployment's adminGroups
# (argocd/values/common.yaml: dfe-admins, dfe-infra), so it is not restated
# here; read-only for the infra viewers group.
rbac:
  enabled: true
  roles:
    rw:
      subjects: []            # no write-but-not-admin tier requested
    ro:
      subjects: [dfe-infra-viewers]

# Local recovery admin - the only non-OIDC path, for IdP-down / bootstrap.
breakGlass:
  enabled: true
  username: dfe-breakglass
  secretName: dfe-kafbat-breakglass
  generate: true             # ESO-generated on a bare cluster

# Manage the deployed DFE Kafka. -no-tls because both DFE-owned brokers serve
# SASL on a TLS-off listener; a supplied broker over TLS takes the bare key.
kafka:
  clusters:
    - name: dfe
      provider: strimzi-no-tls
      bootstrapServers: dfe-kafka-bootstrap.kafka.svc:9092
      credentialsSecretName: dfe-kafka-user
