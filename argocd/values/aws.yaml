# Must exist so the layer 2 valueFiles resolution succeeds on EKS. See docs/deployment/values-clouds-edge.md#cloud-files.
global:
  cloud: aws
  # Unset: the dial's registry field is the one source.

storageClass: gp3

# The edge module's AWS keys are in edge-aws.yaml.

# Reached through EKS Pod Identity, so no static key.
clickhouse:
  objectStore:
    usePodIdentity: true

# Link-local alone: carving the pod or service range breaks in-VPC backends and kube-dns. See docs/deployment/values-shared.md#network-ranges.
networkModel:
  carveOut: [linkLocalCIDR]

# Stays here because kafbat and dfe-engine read it. See docs/deployment/values-clouds-edge.md#cloud-files.
oidc:
  enabled: true
