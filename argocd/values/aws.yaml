# AWS EKS overrides — populated in Plan 07 (aws-eks).
# Stub required so Layer 2 ApplicationSet valueFiles resolution succeeds on EKS targets.
global:
  cloud: aws
  # registry: "123456789.dkr.ecr.us-east-1.amazonaws.com/dfe"  # Set per AWS account
  registry: "ghcr.io/hyperi-io"  # HyperI-hosted images (shared until per-customer ECR)

storageClass: gp3

envoyGateway:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

configStorage:
  type: s3
  # bucket: set from cluster secret annotation dfe.hyperi.io/config_bucket
