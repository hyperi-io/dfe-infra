# Profile: slim -- the smallest k8s tier (below this -> dfe-docker compose).
# gRPC transport, NO Kafka, pods sized to MINIMUM VIABLE + safety. Bare-minimum
# footprint: engine + ui + the receiver/loader ingest path ONLY. archiver,
# fetcher and the transform workers are NOT deployed by default (the slim deploy
# repo simply omits their values/<svc>-<inst>-values.yaml files; add them later).
# No web infra UIs unless cheap (Kafbat off -- no Kafka anyway; Argo CD runs
# headless; Forgejo only as the deploy-repo fallback). Merged after common.yaml +
# <cloud>.yaml. Keys unknown to a chart are ignored by Helm.

# DFE service deployments -- minimum viable + a little safety headroom.
# Requests are the tier's real cost (scheduling); limits are only a runaway
# cap. The 1Gi memory limit exists for hyperdx (multi-process Node: app + api
# + alert-task + provisioner OOMs at 384Mi); the Rust apps never approach it.
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Pressure OFF on this tier: slim runs no broker (receiver -> loader direct gRPC),
# so the composite's kafka_lag term has nothing to measure and the native cpu scaler
# is the honest signal. The other tiers carry a broker and keep the chart default on.
keda:
  minReplicaCount: 1
  maxReplicaCount: 2
  pressure:
    enabled: false
    targetValue: 75

# ClickHouse -- single standalone node (keeperless, MergeTree).
# mode and storageModel are TIER DEFAULTS: the deploy repo's infra/ overlay is
# layered after this file, so a deployer reaches external, cached-object or
# tiered-block there.
clickhouse:
  mode: single
  replicas: 1
  shardsCount: 1

# Kafka -- DISABLED. slim uses gRPC transport (receiver -> loader direct).
kafka:
  mode: disabled

# Kafbat -- not deployed (no Kafka to manage in slim). Scoped under `kafbat:` so it
# gates ONLY the kafbat chart; a bare top-level `enabled` would apply to every chart
# in this cascade (this file is merged into every chart's values).
kafbat:
  enabled: false

# Its HTTPRoute lives in the kafka namespace, which slim never creates; left on,
# envoy-gateway-config stays OutOfSync forever on `namespaces "kafka" not found`.
# `routes:` is a key only that chart carries.
routes:
  kafbat:
    enabled: false

# CNPG -- single instance (no HA).
cluster:
  instances: 1

# Observability collection -- the cheap scrapers only. Per-container kubelet stats
# are the cardinality cost this tier exists to avoid, and there is no Kafka to scrape.
clusterTelemetry:
  kubeletStats:
    enabled: false
  kafka:
    enabled: false

# BEGIN seeded apps -- rendered by `python3 scripts/composition.py --write-seed`
# The apps this tier deploys by default. Derived from apps.yaml's
# `default_in`, which is where the default composition is declared; edit
# the manifest, then re-render. A Helm list is replaced rather than merged,
# so this states the whole set.
deployRepo:
  seedApps:
    - dfe-archiver
    - dfe-engine
    - dfe-loader
    - dfe-receiver
    - dfe-ui
    - hyperdx
# END seeded apps
