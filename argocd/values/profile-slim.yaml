# The smallest k8s tier: gRPC, no Kafka. See docs/deployment/values-tiers-apps.md#tier-profiles.

# The 1Gi memory limit is for dfe-hyperdx, which OOMs at 384Mi.
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Pressure off: no broker, so CPU alone scales it. See docs/deployment/values-tiers-apps.md#tier-profiles.
keda:
  minReplicaCount: 1
  maxReplicaCount: 2
  pressure:
    targetValue: 75

# Tier defaults: the deploy repo's infra/ overlay layers after this file.
clickhouse:
  mode: single
  replicas: 1
  shardsCount: 1

kafka:
  mode: disabled

# Scoped under kafbat: because a bare enabled would reach every chart in the cascade.
kafbat:
  enabled: false

# This tier has no kafka namespace, so the route would stay OutOfSync.
routes:
  kafbat:
    enabled: false

clusterTelemetry:
  kubeletStats:
    enabled: false
  kafka:
    enabled: false

# BEGIN seeded apps -- rendered by `python3 scripts/composition.py --write-seed`
# The apps this tier deploys by default. Derived from apps.yaml's
# `default_in`, which is where the default composition is declared; edit
# the manifest, then re-render. A Helm list is replaced rather than merged,
# so this states the whole set.
deployRepo:
  seedApps:
    - dfe-archiver
    - dfe-engine
    - dfe-hyperdx
    - dfe-loader
    - dfe-receiver
    - dfe-ui
# END seeded apps
