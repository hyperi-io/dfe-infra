# GCP GKE overrides — populated in Plan 07 (gcp).
global:
  cloud: gcp

storageClass: standard-rwo

# THE EDGE MODULE'S OWN GCP KEYS LIVE IN argocd/values/edge-gcp.yaml, layered
# after this file by argocd/appsets/layer2-edge.yaml: the gateway Service and
# culvert's PKI mode. That file carries the GCP tier table in one place; what
# stays here is what a chart OUTSIDE the edge module reads as well.

# THE RECEIVER'S FRONT DOOR is exposure.groups.ingest (common.yaml), as on AWS:
# its own load balancer, which renders only once the deploy repo names the
# senders in exposure.groups.ingest.allow. Its values are
# argocd/values/apps/dfe-receiver/gcp.yaml.

# The engine's runtime store is a PVC against the cluster's default
# StorageClass (the engine contract's persistent `config` writable path) -- no per-cloud
# storage seam needed.
