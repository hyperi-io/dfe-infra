# GCP GKE overrides — populated in Plan 07 (gcp).
global:
  cloud: gcp

storageClass: standard-rwo

# THE EDGE MODULE'S OWN GCP KEYS LIVE IN argocd/values/edge-gcp.yaml, layered
# after this file by argocd/appsets/layer2-edge.yaml: the gateway Service and
# culvert's PKI mode. That file carries the GCP tier table in one place; what
# stays here is what a chart OUTSIDE the edge module reads as well.

# THE RECEIVER'S FRONT DOOR -- same rule as AWS (argocd/values/aws.yaml's
# exposure: block, docs/deployment/aws.md#receiver-ingress): GCP's load
# balancers bill by volume too, so the receiver stays off one by default.
# dfe-receiver is not an edge chart, so this key stays here. The receiver only:
# culvert keeps its chart-default LoadBalancer on this flavour, so a deployment
# that brings the tunnel pays GCP's per-GB rate on the tunnel's bytes until
# edge-gcp.yaml carries edge-aws.yaml's NodePort override as well.
exposure:
  mode: vpn

# The engine's runtime store is a PVC against the cluster's default
# StorageClass (dfe-engine chart config.persistence) -- no per-cloud
# storage seam needed.
