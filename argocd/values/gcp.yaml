# GCP GKE overrides — populated in Plan 07 (gcp).
global:
  cloud: gcp

storageClass: standard-rwo

envoyGateway:
  service:
    type: LoadBalancer

# THE RECEIVER'S FRONT DOOR -- same rule as AWS (argocd/values/aws.yaml's
# exposure: block, docs/deployment/aws.md#receiver-ingress): GCP's load
# balancers bill by volume too, so the receiver stays off one by default.
# The receiver only: culvert keeps its chart-default LoadBalancer here, so a
# deployment that brings the tunnel pays GCP's per-GB rate on the tunnel's
# bytes until this overlay carries aws.yaml's NodePort override as well.
exposure:
  mode: vpn

# The engine's runtime store is a PVC against the cluster's default
# StorageClass (dfe-engine chart config.persistence) -- no per-cloud
# storage seam needed.
