# Default Helm values shared across all cloud targets.
global:
  project: dfe
  env: ""
  cloud: ""
  domain: ""
  region: local
  # Container registry — GHCR (ghcr.io/hyperi-io).
  # All Helm charts reference: image: "{{ .Values.global.registry }}/dfe-{component}:{tag}"
  # Images are pushed by CI or manually: docker push ghcr.io/hyperi-io/dfe-engine:2.2.0
  registry: "ghcr.io/hyperi-io"

# Node scheduling — empty by default (no constraints).
# Override in cloud-specific values to target dedicated DFE node pools.
nodeScheduling: {}

otel:
  endpoint: "otel-collector-gateway.otel.svc.cluster.local:4317"
  tls: false

kafka:
  bootstrapServers: "dfe-kafka-kafka-bootstrap.strimzi.svc.cluster.local:9092"
  sasl:
    enabled: true
    mechanism: SCRAM-SHA-512

clickhouse:
  host: "clickhouse.clickhouse.svc.cluster.local"
  port: 8123
  database: dfe

postgresql:
  host: "cnpg-cluster-rw.dfe-prod.svc.cluster.local"
  port: 5432
  database: dfe

receiver:
  listenCIDR: "100.64.0.0/10"

keda:
  minReplicas: 1
  maxReplicas: 5
  scalingPressureThreshold: "0.7"

# ArgoCD — Envoy Gateway handles OIDC, not Dex
argocd:
  dex:
    enabled: false  # Envoy Gateway manages OIDC for ArgoCD
  rbac:
    # Default RBAC policy — deny all, explicit grants only
    defaultPolicy: "role:readonly"
    # DFE role mappings (group → ArgoCD role)
    # Populated by dfe-engine generate_rbac_csv() when OIDC is enabled
    policy: |
      p, role:dfe-admin, applications, *, */*, allow
      p, role:dfe-admin, clusters, *, *, allow
      p, role:dfe-admin, repositories, *, *, allow
      p, role:dfe-operator, applications, get, */*, allow
      p, role:dfe-operator, applications, sync, */*, allow
      p, role:dfe-viewer, applications, get, */*, allow
      g, dfe-admins, role:dfe-admin
      g, dfe-operators, role:dfe-operator
      g, dfe-viewers, role:dfe-viewer
