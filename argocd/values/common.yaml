# Default Helm values shared across all cloud targets.
# Environment-specific overrides go in local.yaml, aws.yaml, gcp.yaml, azure.yaml.
global:
  project: dfe
  env: ""
  cloud: ""
  domain: ""
  region: ""
  # Container registry — MUST be set in environment-specific values file.
  # Examples: ghcr.io/my-org, my-registry.example.com/dfe, 123456.dkr.ecr.us-east-1.amazonaws.com/dfe
  # Charts reference: image: "{{ .Values.global.registry }}/dfe-{component}:{tag}"
  registry: ""

# Image pull secrets — list of K8s secret names for private registries.
# Override in cloud-specific values. Bootstrap creates these secrets.
imagePullSecrets: []

# Node scheduling — empty by default (no constraints).
# Override in cloud-specific values to target dedicated DFE node pools.
nodeScheduling: {}

# Self-monitoring telemetry (OTel) for the WHOLE stack -- selectable destination
# so monitoring need not depend on the data pipeline working. Every app resolves
# its OTLP endpoint via the dfe-common.otelEndpoint helper from telemetry.mode:
#   hyperdx   (DEFAULT) -- push OTLP straight to HyperDX's own collector, so
#             monitoring does NOT rely on receiver/loader/ClickHouse being up.
#   receiver  -- push through the dfe-receiver ingest path (reuses the scalable
#             pipeline; for truly large scale).
#   external  -- push to a deployer-supplied OTLP endpoint (their own backend).
#   prometheus -- no OTLP push; expose /metrics + scrape annotations for an
#             external Prometheus to scrape.
telemetry:
  mode: hyperdx
  hyperdxEndpoint: "dfe-hyperdx-otel.hyperdx.svc.cluster.local:4317"
  receiverEndpoint: "dfe-receiver.dfe.svc.cluster.local:8443"
  externalEndpoint: ""
  prometheus:
    port: 9090
    path: /metrics

otel:
  # Explicit OVERRIDE of the resolved telemetry endpoint (empty -> use the
  # telemetry.mode resolution above). Kept for per-deploy escape hatches.
  endpoint: ""
  tls: false

kafka:
  bootstrapServers: "dfe-kafka-kafka-bootstrap.strimzi.svc.cluster.local:9092"
  sasl:
    enabled: true
    mechanism: SCRAM-SHA-512

# Consumer-facing ClickHouse endpoint. Default = DFE's own single-mode service.
# cluster mode: override host with the operator's service (confirm name at deploy);
# external mode: override host with the supplied endpoint. (Seam: per-deploy this
# should come from the dfe.hyperi.io/clickhouse_host annotation.)
clickhouse:
  host: "dfe-clickhouse.clickhouse.svc.cluster.local"
  port: 8123
  database: dfe

postgresql:
  host: ""  # Set per-environment: cnpg-cluster-rw.{namespace}.svc.cluster.local
  port: 5432
  database: dfe

receiver:
  listenCIDR: "100.64.0.0/10"

keda:
  minReplicas: 1
  maxReplicas: 5
  scalingPressureThreshold: "0.7"

# ArgoCD — Envoy Gateway handles OIDC, not Dex
argocd:
  dex:
    enabled: false  # Envoy Gateway manages OIDC for ArgoCD
  rbac:
    # Default RBAC policy — deny all, explicit grants only
    defaultPolicy: "role:readonly"
    # DFE role mappings (group → ArgoCD role)
    # Populated by dfe-engine generate_rbac_csv() when OIDC is enabled.
    #
    # Group names are the canonical set — dfe-engine docs/control-plane/
    # rbac-vocabulary.md is the SSoT. Do not invent names here: a group ArgoCD
    # does not know about is a user who looks authorised in the engine and is
    # invisible to Argo.
    policy: |
      p, role:dfe-admin, applications, *, */*, allow
      p, role:dfe-admin, clusters, *, *, allow
      p, role:dfe-admin, repositories, *, *, allow
      p, role:dfe-infra, applications, *, */*, allow
      p, role:dfe-infra, repositories, *, *, allow
      p, role:dfe-operator, applications, get, */*, allow
      p, role:dfe-operator, applications, sync, */*, allow
      p, role:dfe-viewer, applications, get, */*, allow
      g, dfe-admins, role:dfe-admin
      g, dfe-infra, role:dfe-infra
      g, dfe-operators, role:dfe-operator
      g, dfe-viewers, role:dfe-viewer
