# Shared deploy facts, each defined once. See docs/deployment/values-shared.md#shared-facts.
global:
  project: dfe
  cloud: ""
  domain: ""
  # Written by bootstrap from DFE_REGISTRY, so no values file sets it.
  registry: ""

# Service-name map: every surface is {hostname}.{domain}. See docs/deployment/values-shared.md#shared-facts.
hostnames:
  dfe: dfe
  hyperdx: hyperdx
  argocd: argocd
  git: git
  kafbat: kafbat
  cruiseControl: cruise-control
  links: links
  otel: otel
  receiver: receiver
  vpn: vpn

# OIDC groups that administer the ops surfaces. See docs/deployment/values-shared.md#shared-facts.
adminGroups:
  - dfe-admins
  - dfe-infra

# Exposure dial, product defaults: an empty allow list means no fence here. See docs/deployment/values-shared.md#shared-facts.
exposure:
  groups:
    ingest:
      enabled: true
      allow: []
      deny: []
      door: loadbalancer  # loadbalancer | gateway | tunnel
    console:
      enabled: true
      allow: []
      deny: []
    api:
      enabled: true
      allow: []
      deny: []
      scim: false
    admin:
      enabled: true
      allow: []
      deny: []
      allowPublic: false
      tools:
        argocd: false
        kafbat: false
        cruiseControl: false
        forgejo: false
        links: false
    vpn:
      enabled: false
      allow: []
      door: culvert       # culvert | awsClientVpn
  selfRanges: []

# Must agree with the destinations in argocd/appsets/layer-scale.yaml. A wrong name matches nothing and fails silently. See docs/deployment/values-shared.md#shared-facts.
operatorNamespaces:
  clickhouse: clickhouse-operator-system
  strimzi: strimzi
  cnpg: cnpg-system

imagePullSecrets: []

# nodeSelector and tolerations repeat nodeScheduling under the keys the thin charts read. Keep them equal.
nodeScheduling: {}
nodeSelector: {}
tolerations: []

# Where every app sends its telemetry. See docs/deployment/values-shared.md#telemetry.
telemetry:
  mode: hyperdx
  hyperdxEndpoint: ""
  receiverEndpoint: ""
  externalEndpoint: ""

# versionCheck is unset, so the apps default to on. See docs/deployment/values-shared.md#telemetry.

otel:
  # Overrides the resolved endpoint. Needs a scheme, https://host:4317.
  endpoint: ""
  tls: false
  # OTLP ingest from outside the cluster, off by default. See docs/deployment/values-shared.md#telemetry.
  ingress:
    enabled: false
    port: 4319
    auth:
      remoteKey: ""

# "true", "false" or empty, which serves the pages in development environments. See docs/deployment/values-shared.md#shared-facts.
api:
  docsEnabled: ""

# Secret dfe-engine writes ingest bearer tokens into. See docs/deployment/values-shared.md#shared-facts.
ingestBearer:
  secretName: dfe-ingest-bearer-tokens

# Secret dfe-engine writes hunt alert destinations into. See docs/deployment/values-shared.md#shared-facts.
alertDestinations:
  secretName: dfe-alert-destinations

# The single tier's broker Service. profile-scale.yaml overrides it for the cluster tier.
kafka:
  bootstrapServers: "dfe-kafka.strimzi.svc.cluster.local:9092"
  # SCRAM over a plain listener. See docs/deployment/values-shared.md#kafka-and-clickhouse-endpoints.
  securityProtocol: SASL_PLAINTEXT

# Pool balancer for the direct transport, on in the mesh profile. See docs/deployment/values-shared.md#mesh-pool-balancer.
mesh:
  enabled: false
  gateway:
    name: dfe-mesh
    className: dfe-envoy
    namespace: envoy-gateway-system
    proxySelector:
      gateway.envoyproxy.io/owning-gateway-name: dfe-mesh
      gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
  port: 6000
  routePolicy:
    enabled: true
    requestTimeout: 30s
    retry:
      numRetries: 2
      baseInterval: 100ms
      maxInterval: 1s
    outlier:
      consecutive5xxErrors: 5
      interval: 3s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

# The kafka chart projects the SCRAM credential into these namespaces. otel is needed or the gateway pod never starts.
user:
  password:
    extraAppNamespaces:
      - otel

# DFE's single-mode service. profile-scale.yaml and profile-mesh.yaml name the operator's headless Service.
clickhouse:
  host: "dfe-clickhouse.clickhouse.svc.cluster.local"
  port: 8123
  nativePort: 9000
  database: dfe
  # Admin account dfe-engine uses to create every other user. See docs/deployment/values-shared.md#kafka-and-clickhouse-endpoints.
  user: default
  passwordSecretName: clickhouse-admin-password
  passwordSecretKey: password
  serviceUsers:
    loader:
      user: dfe_loader
      passwordSecretName: loader-clickhouse
      passwordSecretKey: password
    queryReader:
      user: dfe_query_reader
      passwordSecretName: query-reader-clickhouse
      passwordSecretKey: password
    otelWriter:
      user: dfe_otel_writer
      passwordSecretName: otel-writer-clickhouse
      passwordSecretKey: password
  # HTTPS between the apps and ClickHouse. See docs/deployment/values-shared.md#clickhouse-tls.
  tls:
    enabled: true
    required: false
    port: 8443
    nativePort: 9440
    verify: true
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    internalCA:
      issuerName: dfe-internal-ca
      present: true
    ca:
      secretName: dfe-clickhouse-ca
      configMapName: ""
      dataKey: ca.crt
      extraNamespaces: [otel]

# Set derives the engine's egress to the secret backend.
vault:
  address: ""

# Set derives the engine's egress to the index server.
elasticsearch:
  endpoint: ""

# Cluster network ranges, as installed. See docs/deployment/values-shared.md#network-ranges.
networkModel:
  podCIDR: "198.18.0.0/16"
  serviceCIDR: "198.19.0.0/16"
  linkLocalCIDR: "169.254.0.0/16"
  carveOut: [podCIDR, serviceCIDR, linkLocalCIDR]

# Tunnel client range, CGNAT per RFC 6598. See docs/deployment/values-shared.md#network-ranges.
vpn:
  clientCIDR: "100.64.0.0/10"

# Opt-in toolbox pod, set through the dial (deployment.yaml toolbox.pod.*) and not here. See docs/deployment/toolbox.md.
toolbox:
  pod:
    enabled: false
    # Needs enabled: true.
    kubeApiAccess: false
    ttlSeconds: ""

# Profiles override these per tier. pressure.targetValue is on the 0-100 ScalingPressure gauge.
keda:
  minReplicaCount: 1
  maxReplicaCount: 5
  pressure:
    targetValue: 70
