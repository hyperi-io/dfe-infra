# THE EDGE MODULE, AWS FLAVOUR, layered by argocd/appsets/layer2-edge.yaml. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
# TIER 1 is on by default, TIER 2 is a costed opt-in and TIER 3 is absent by design.

envoyGateway:
  service:
    type: LoadBalancer
    # Fences every web route to its exposure group's allow list.
    internetFacing: true
    annotations:
      # Why each annotation: docs/deployment/values-clouds-edge.md#aws-edge.
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled=true"
      # No aws-load-balancer-security-groups, deliberately: a named group blocks the controller's frontend group.
      service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"

# The internal CA issues the edge certificate. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
tls:
  issuerName: dfe-internal-ca

exposure:
  groups:
    # Off, because the gateway Service is internet-facing.
    admin:
      enabled: false
  # NodePort, not LoadBalancer: no per-GB NLB charge on tunnel bytes. See docs/deployment/values-clouds-edge.md#aws-edge.
  serviceType: NodePort
  # Cluster, so a forwarder works on any node. It SNATs the source IP. See docs/deployment/values-clouds-edge.md#aws-edge.
  externalTrafficPolicy: Cluster

pki:
  # External PKI, so a restart keeps issued client configs. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
  mode: external

# persistence.enabled is set in layer2-edge.yaml, not here.

peers:
  classes:
    admin:
      # The reach-back for dfe-ops bastion hub. See docs/deployment/values-clouds-edge.md#aws-edge.
      enabled: true

# Tier 2 and tier 3 have no key here. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
