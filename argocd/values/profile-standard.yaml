# Profile: standard -- single-node, frugal, gRPC transport, NO Kafka.
# Merged after common.yaml + <cloud>.yaml (third in the valueFiles cascade).
# Keys unknown to a given chart are ignored by Helm, so one file safely carries
# keys for multiple charts. Kafka-dependent apps (strimzi, transforms) are NOT
# deployed in this profile (gated by cluster label in appsets/layer-scale.yaml),
# so no kafka keys are needed here.

# DFE service deployments (dfe-engine, dfe-receiver, dfe-loader, ...).
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# KEDA defaults (common.yaml carries the same shape) -- keep tight in standard.
keda:
  minReplicas: 1
  maxReplicas: 3
  scalingPressureThreshold: "0.7"

# ClickHouse cluster chart -- single node.
clickhouse:
  replicas: 1
  shardsCount: 1

# CNPG -- single instance is enough for standard (no HA).
cluster:
  instances: 1
