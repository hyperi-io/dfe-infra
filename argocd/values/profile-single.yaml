# Profile: single -- single node of EVERYTHING, but WITH Kafka (the difference
# from slim). All components run one replica; pods are sized for RELIABILITY (more
# headroom than slim's minimum-viable). Merged after common.yaml + <cloud>.yaml.
# Keys unknown to a chart are ignored by Helm.

# DFE service deployments -- 1 pod each, reliability-sized.
replicaCount: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

keda:
  minReplicaCount: 1
  maxReplicaCount: 3
  pressure:
    targetValue: 70

# ClickHouse -- single standalone node (keeperless, MergeTree).
# mode and storageModel are TIER DEFAULTS: the deploy repo's infra/ overlay is
# layered after this file, so a deployer reaches external, s3backed or tiered
# there.
clickhouse:
  mode: single
  replicas: 1
  shardsCount: 1

# Kafka -- ENABLED, single broker. (This is what makes `single` != `slim`.)
# The kafka chart renders a NON-operator StatefulSet in this mode
# (templates/kafka-single.yaml) -- a plain broker of the chosen provider, mirroring
# ClickHouse-single. So the single tier needs NO Kafka operator; the Strimzi CR path
# (and its operator, installed scale-only via layer-scale.yaml) is used ONLY at scale.
kafka:
  mode: single

# Kafbat (Kafka UI) -- deployed with Kafka. Scoped under `kafbat:` (see profile-slim)
# so the toggle never leaks to other charts in the cascade.
kafbat:
  enabled: true

# CNPG -- single instance (no HA at this tier).
cluster:
  instances: 1

# Observability collection -- full set. Kafka exists at this tier, and one node's
# worth of container series is affordable.
clusterTelemetry:
  kubeletStats:
    enabled: true
  kafka:
    enabled: true
