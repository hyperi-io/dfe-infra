# One node of everything, with Kafka. See docs/deployment/values-tiers-apps.md#tier-profiles.

replicaCount: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The ceiling matches defaultTopic.partitions: a group assigns one consumer per partition. See docs/deployment/values-tiers-apps.md#tier-profiles.
keda:
  minReplicaCount: 1
  maxReplicaCount: 3
  pressure:
    targetValue: 70

# Tier defaults: the deploy repo's infra/ overlay layers after this file.
clickhouse:
  mode: single
  replicas: 1
  shardsCount: 1

# A plain broker StatefulSet, with no operator at this tier. See docs/deployment/values-tiers-apps.md#tier-profiles.
kafka:
  mode: single
  # Pinned to the KEDA ceiling so partitions land on 3, not on the scale default.
  sizing:
    consumerCeiling: 3
    minPartitionsPerBroker: 3

kafbat:
  enabled: true

clusterTelemetry:
  kubeletStats:
    enabled: true
  kafka:
    enabled: true

# BEGIN seeded apps -- rendered by `python3 scripts/composition.py --write-seed`
# The apps this tier deploys by default. Derived from apps.yaml's
# `default_in`, which is where the default composition is declared; edit
# the manifest, then re-render. A Helm list is replaced rather than merged,
# so this states the whole set.
deployRepo:
  seedApps:
    - dfe-archiver
    - dfe-engine
    - dfe-hyperdx
    - dfe-loader
    - dfe-receiver
    - dfe-transform-elastic
    - dfe-transform-vrl
    - dfe-ui
# END seeded apps
