# HA on gRPC, no Kafka: ClickHouse cluster, KEDA. See docs/deployment/values-tiers-apps.md#scale-and-mesh-profiles.

# Replicas and KEDA floors are scale's. Memory is not: each stage holds what the next has not taken.
replicaCount: 2
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Pressure stays on: buffer depth and memory stand in for kafka_lag.
keda:
  minReplicaCount: 2
  maxReplicaCount: 10
  pressure:
    targetValue: 70

# Tier defaults: the deploy repo's infra/ overlay layers after this file. host moves with mode, and is overridden here because the operator emits only a headless Service. See docs/deployment/values-tiers-apps.md#scale-and-mesh-profiles.
clickhouse:
  mode: cluster
  host: "dfe-clickhouse-clickhouse-headless.clickhouse.svc.cluster.local"
  replicas: 3
  shardsCount: 1

kafka:
  mode: disabled

# Pool balancer on. See docs/deployment/values-shared.md#mesh-pool-balancer.
mesh:
  enabled: true

# Scoped under kafbat: because a bare enabled would reach every chart in the cascade.
kafbat:
  enabled: false

# This profile has no kafka namespace, so the route would stay OutOfSync.
routes:
  kafbat:
    enabled: false

clusterTelemetry:
  kubeletStats:
    enabled: true
  kafka:
    enabled: false

# BEGIN seeded apps -- rendered by `python3 scripts/composition.py --write-seed`
# The apps this tier deploys by default. Derived from apps.yaml's
# `default_in`, which is where the default composition is declared; edit
# the manifest, then re-render. A Helm list is replaced rather than merged,
# so this states the whole set.
deployRepo:
  seedApps:
    - dfe-archiver
    - dfe-engine
    - dfe-hyperdx
    - dfe-loader
    - dfe-receiver
    - dfe-ui
# END seeded apps
