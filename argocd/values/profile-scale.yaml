# Profile: scale -- HA, Kafka via Strimzi, ClickHouse cluster, KEDA autoscaling.
# Merged after common.yaml + <cloud>.yaml (third in the valueFiles cascade).
# Keys unknown to a given chart are ignored by Helm.

# DFE service deployments.
replicaCount: 2
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Pressure stays on (the chart default): this tier carries a broker, so the
# composite's kafka_lag term measures the real backlog the cpu trigger misses on an
# I/O-bound loader. The ceiling is a DIVISOR of defaultTopic.partitions (12) -- at 10
# replicas two consumers hold 2 partitions and eight hold 1, and the busy pair sets
# the group's lag while the rest idle at half load.
keda:
  minReplicaCount: 2
  maxReplicaCount: 12
  pressure:
    targetValue: 70

# ClickHouse -- operator cluster (own Keeper, ReplicatedMergeTree).
# host MUST be overridden here: common.yaml defaults to the single-mode service
# name, which does not exist in cluster mode (the operator owns the services and
# emits ONLY a headless one -- confirmed live 2026-07-16, there is no non-headless
# client service to prefer). Round-robin across the headless service is correct
# because the engine senses the cluster and creates ReplicatedMergeTree ON
# CLUSTER, so every node carries the table and the data replicates. It is NOT
# safe with unreplicated tables - that silently splits rows across replicas.
# Name follows the operator's convention: <clickhouse.name>-clickhouse-headless.
# mode and storageModel are TIER DEFAULTS: the deploy repo's infra/ overlay is
# layered after this file, so a deployer reaches external, cached-object or
# tiered-block there. A deployer who moves mode must move host in the same overlay.
clickhouse:
  mode: cluster
  host: "dfe-clickhouse-clickhouse-headless.clickhouse.svc.cluster.local"
  replicas: 3
  shardsCount: 1

# Kafka -- cluster mode via Strimzi (default provider). replicas default 3.
# bootstrapServers MUST be overridden here: common.yaml defaults to the single
# tier's plain Service name, which does not exist in cluster mode. Strimzi owns the
# broker Services and names its bootstrap <cluster>-kafka-bootstrap.
# mode and storageModel are TIER DEFAULTS, overridable from the deploy repo's
# infra/ overlay; a deployer who moves mode must move bootstrapServers with it.
kafka:
  mode: cluster
  provider: strimzi
  replicas: 3
  bootstrapServers: "dfe-kafka-kafka-bootstrap.strimzi.svc.cluster.local:9092"
  # Partitions are derived in the kafka chart (kafka.sizing) from the broker
  # count, the KEDA consumer ceiling and the per-partition throughput cap, and
  # feed the broker's num.partitions and the landing topic alike -- so there is
  # no literal here to drift from the one the broker uses.

# Observability collection -- full set. Container-level kubelet series scale with
# the node count here; measure before widening metricGroups.
clusterTelemetry:
  kubeletStats:
    enabled: true
  kafka:
    enabled: true

# BEGIN seeded apps -- rendered by `python3 scripts/composition.py --write-seed`
# The apps this tier deploys by default. Derived from apps.yaml's
# `default_in`, which is where the default composition is declared; edit
# the manifest, then re-render. A Helm list is replaced rather than merged,
# so this states the whole set.
deployRepo:
  seedApps:
    - dfe-archiver
    - dfe-engine
    - dfe-loader
    - dfe-receiver
    - dfe-transform-elastic
    - dfe-transform-vrl
    - dfe-ui
    - hyperdx
# END seeded apps
