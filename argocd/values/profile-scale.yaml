# Profile: scale -- HA, Kafka via Strimzi, ClickHouse cluster, KEDA autoscaling.
# Merged after common.yaml + <cloud>.yaml (third in the valueFiles cascade).
# Keys unknown to a given chart are ignored by Helm.

# DFE service deployments.
replicaCount: 2
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

keda:
  minReplicaCount: 2
  maxReplicaCount: 10
  pressure:
    targetValue: 70

# ClickHouse -- operator cluster (own Keeper, ReplicatedMergeTree).
# host MUST be overridden here: common.yaml defaults to the single-mode service
# name, which does not exist in cluster mode (the operator owns the services and
# emits ONLY a headless one -- confirmed live 2026-07-16, there is no non-headless
# client service to prefer). Round-robin across the headless service is correct
# because the engine senses the cluster and creates ReplicatedMergeTree ON
# CLUSTER, so every node carries the table and the data replicates. It is NOT
# safe with unreplicated tables - that silently splits rows across replicas.
# Name follows the operator's convention: <clickhouse.name>-clickhouse-headless.
clickhouse:
  mode: cluster
  host: "dfe-clickhouse-clickhouse-headless.clickhouse.svc.cluster.local"
  replicas: 3
  shardsCount: 1
  # The operator names its cluster `default` in remote_servers. Consumed by the
  # otel collector, whose exporter creates the otel tables: without it the
  # creation lands on one replica and a query against any other returns 404.
  clusterName: "default"

# CNPG -- HA.
cluster:
  instances: 3

# Kafka -- cluster mode via Strimzi (default provider). replicas default 3.
# bootstrapServers MUST be overridden here: common.yaml defaults to the single
# tier's plain Service name, which does not exist in cluster mode. Strimzi owns the
# broker Services and names its bootstrap <cluster>-kafka-bootstrap.
kafka:
  mode: cluster
  provider: strimzi
  replicas: 3
  bootstrapServers: "dfe-kafka-kafka-bootstrap.strimzi.svc.cluster.local:9092"
  # Partitions cap consumer parallelism -- a group assigns at most one consumer
  # per partition, so a loader replica past this count joins and idles.
  # Sized from the KEDA ceiling of 10, rounded up to divide by 2/3/4/6.
  # Raise only: Kafka cannot shrink a topic and KIP-694 is unadopted.
  defaultTopic:
    partitions: 12

# Observability collection -- full set. Container-level kubelet series scale with
# the node count here; measure before widening metricGroups.
clusterTelemetry:
  kubeletStats:
    enabled: true
  kafka:
    enabled: true
