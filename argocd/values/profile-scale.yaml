# HA: Strimzi Kafka, ClickHouse cluster, KEDA. See docs/deployment/values-tiers-apps.md#scale-and-mesh-profiles.

replicaCount: 2
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# The ceiling divides defaultTopic.partitions so replicas load evenly.
keda:
  minReplicaCount: 2
  maxReplicaCount: 12
  pressure:
    targetValue: 70

# Tier defaults: the deploy repo's infra/ overlay layers after this file. host moves with mode, and is overridden here because the operator emits only a headless Service. See docs/deployment/values-tiers-apps.md#scale-and-mesh-profiles.
clickhouse:
  mode: cluster
  host: "dfe-clickhouse-clickhouse-headless.clickhouse.svc.cluster.local"
  replicas: 3
  shardsCount: 1

# bootstrapServers moves with mode and is overridden here because Strimzi names one bootstrap Service.
kafka:
  mode: cluster
  provider: strimzi
  replicas: 3
  bootstrapServers: "dfe-kafka-kafka-bootstrap.strimzi.svc.cluster.local:9092"
  # Partitions come from kafka.sizing in the kafka chart. The engine creates topics at topicReplicationFactor, which moves with mode.
  topicReplicationFactor: 3

clusterTelemetry:
  kubeletStats:
    enabled: true
  kafka:
    enabled: true

# BEGIN seeded apps -- rendered by `python3 scripts/composition.py --write-seed`
# The apps this tier deploys by default. Derived from apps.yaml's
# `default_in`, which is where the default composition is declared; edit
# the manifest, then re-render. A Helm list is replaced rather than merged,
# so this states the whole set.
deployRepo:
  seedApps:
    - dfe-archiver
    - dfe-engine
    - dfe-hyperdx
    - dfe-loader
    - dfe-receiver
    - dfe-transform-elastic
    - dfe-transform-vrl
    - dfe-ui
# END seeded apps
