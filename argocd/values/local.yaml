# Sample "local" cloud overlay (Rancher RKE2), one deploy's values -- the charts
# and appsets hardcode none of it. Hostnames here are PLACEHOLDERS (RFC 2606
# example.com), never a real estate: this repo ships publicly. A real deployment
# supplies its own domain/vault/storage via the cluster-secret annotations that
# bootstrap.sh sets from the private .env (dfe.hyperi.io/domain <- DFE_DOMAIN,
# etc.) or its private deploy-repo overlay, which is layered last and wins.
global:
  cloud: local
  region: local
  domain: dfe.example.com
  registry: "ghcr.io/hyperi-io"

domain: dfe.example.com
storageClass: local-path

# Pull secret for GHCR private images (created by bootstrap.sh)
imagePullSecrets:
  - ghcr-pull-secret

postgresql:
  host: "cnpg-cluster-rw.cnpg.svc.cluster.local"

# Target dedicated DFE worker nodes (dfe-k8s-1/2/3).
# Matches label + tolerates taint applied during node provisioning.
nodeScheduling:
  nodeSelector:
    dfe.hyperi.io/workload: dfe
  tolerations:
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: dfe
      effect: NoSchedule

envoyGateway:
  service:
    type: LoadBalancer
    externalIPs: []

# Edge wildcard-cert issuer. The chart default (dfe-letsencrypt) renders a
# ClusterIssuer only when tls.acme.email or tls.vault.server is set; with neither
# the gateway-shim requests against an issuer that does not exist, so
# dfe-wildcard-tls is never created and the https listener stays
# InvalidCertificateRef. These domains are internal split-horizon names that
# public ACME cannot validate. The self-signed internal CA issues instantly with
# no DNS-01 and no external credential; clients must trust dfe-internal-ca-tls
# (ns cert-manager) or see a warning. For a browser-trusted leaf use OpenBao PKI
# via tls.vault.* (server, path, caBundle, appRole.roleId).
tls:
  issuerName: dfe-internal-ca

# No LoadBalancer provisioner on this cloud: the gateway's own LB Service stays
# <pending>, so the receiver's chart default (exposure.mode: public) would render
# Services that never get an address. Ingest routes through the gateway instead.
exposure:
  mode: internal

# The gateway routes HTTP, so grpc drops back to exposed: false here -- left
# true it fails the receiver render, which is the point of that guard. OTLP/gRPC
# stays reachable in-cluster on the ClusterIP.
listeners:
  - { name: http, port: 8080, protocol: TCP, exposed: true }
  - { name: grpc, port: 8443, protocol: TCP, exposed: false }

# The receiver's ingest door in internal mode (receiver.{domain}).
routes:
  receiver:
    enabled: true

# devex runs DFE's OWN ClickHouse (single/keeperless interim -- stops the
# exit-231 crashloop from the prior cluster-mode instance that shared
# hyperi-keeper). Flip to cluster (with DFE-owned dfe-keeper) or external to
# test those paths. devex does NOT reuse hyperi-infra's hyperi-clickhouse.
clickhouse:
  mode: single
  # cluster mode here uses DFE's own dfe-keeper (chart default) -- self-contained,
  # NOT hyperi-infra's hyperi-keeper.

vault:
  address: "https://bao.example.com:8200"

# The engine's runtime store is a PVC against the cluster's default
# StorageClass (dfe-engine chart config.persistence) -- no per-cloud
# storage seam needed.
