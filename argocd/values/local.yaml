# HyperI DevEx (Rancher RKE2) — internal development and testing.
global:
  cloud: local
  region: local
  domain: devex.hyperi.io
  registry: "ghcr.io/hyperi-io"

domain: devex.hyperi.io
storageClass: local-path

# Pull secret for GHCR private images (created by bootstrap.sh)
imagePullSecrets:
  - ghcr-pull-secret

postgresql:
  host: "cnpg-cluster-rw.cnpg.svc.cluster.local"

# Target dedicated DFE worker nodes (dfe-k8s-1/2/3).
# Matches label + tolerates taint applied during node provisioning.
nodeScheduling:
  nodeSelector:
    dfe.hyperi.io/workload: dfe
  tolerations:
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: dfe
      effect: NoSchedule

envoyGateway:
  service:
    type: LoadBalancer
    externalIPs: []

# devex uses hyperi-infra's shared hyperi-clickhouse, so DFE does NOT deploy its
# own dedicated ClickHouseCluster here (the dfe-clickhouse instance was redundant
# and crash-looping). Argo prunes it. Keeper ref kept for if it is re-enabled.
clickhouse:
  enabled: false
  keeperClusterRef:
    name: hyperi-keeper

vault:
  address: "https://bao.devex.hyperi.io:8200"

configStorage:
  type: nfs
  server: "storage.devex.hyperi.io"
  path: /data/dfe-config
