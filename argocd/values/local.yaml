# Sample on-prem overlay for Rancher RKE2. Domain and vault are placeholders, and a deployment supplies one. See docs/deployment/values-clouds-edge.md#cloud-files.
global:
  cloud: local
  domain: dfe.example.com

domain: dfe.example.com
storageClass: local-path

# The dedicated DFE worker nodes, by the label and taint set at provisioning.
nodeScheduling:
  nodeSelector:
    dfe.hyperi.io/workload: dfe
  tolerations:
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: dfe
      effect: NoSchedule

# The same placement under the keys the thin charts read. test_apps_common.py keeps the two equal.
nodeSelector:
  dfe.hyperi.io/workload: dfe
tolerations:
  - key: dfe.hyperi.io/workload
    operator: Equal
    value: dfe
    effect: NoSchedule

# The edge module's on-prem keys are in edge-onprem.yaml.

# No LoadBalancer provisioner, so ingest goes through the gateway. See docs/deployment/values-clouds-edge.md#cloud-files.
exposure:
  groups:
    ingest:
      door: gateway

# grpc is not exposed because the gateway routes HTTP. Helm replaces a list, so every listener is restated. See docs/deployment/values-clouds-edge.md#cloud-files.
listeners:
  - { name: http, port: 8080, protocol: TCP, exposed: true }
  - { name: grpc, port: 8443, protocol: TCP, exposed: false }
  - { name: pushgrpc, port: 6000, protocol: TCP, exposed: false }

# DFE's single-mode ClickHouse, never one the cluster already runs.
clickhouse:
  mode: single

vault:
  address: "https://bao.example.com:8200"
