# HyperI DevEx (Rancher RKE2) — internal development and testing.
global:
  cloud: local
  region: local
  domain: devex.hyperi.io
  registry: "ghcr.io/hyperi-io"

domain: devex.hyperi.io
storageClass: local-path

# Pull secret for GHCR private images (created by bootstrap.sh)
imagePullSecrets:
  - ghcr-pull-secret

postgresql:
  host: "cnpg-cluster-rw.cnpg.svc.cluster.local"

# Target dedicated DFE worker nodes (dfe-k8s-1/2/3).
# Matches label + tolerates taint applied during node provisioning.
nodeScheduling:
  nodeSelector:
    dfe.hyperi.io/workload: dfe
  tolerations:
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: dfe
      effect: NoSchedule

envoyGateway:
  service:
    type: LoadBalancer
    externalIPs: []

# devex runs DFE's OWN ClickHouse (single/keeperless interim -- stops the
# exit-231 crashloop from the prior cluster-mode instance that shared
# hyperi-keeper). Flip to cluster (with DFE-owned dfe-keeper) or external to
# test those paths. devex does NOT reuse hyperi-infra's hyperi-clickhouse.
clickhouse:
  mode: single
  keeperClusterRef:
    name: hyperi-keeper   # only used in cluster mode; moot for single

vault:
  address: "https://bao.devex.hyperi.io:8200"

configStorage:
  type: nfs
  server: "storage.devex.hyperi.io"
  path: /data/dfe-config
