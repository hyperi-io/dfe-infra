# THE EDGE MODULE, GCP FLAVOUR, layered by argocd/appsets/layer2-edge.yaml. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
# TIER 1 is on by default, TIER 2 is a costed opt-in and TIER 3 is absent by design.
# Values-only: there is no GCP tofu root.

# GKE makes this Service internet-facing unless annotated internal.
envoyGateway:
  service:
    type: LoadBalancer
    internetFacing: true

# The internal CA issues the edge certificate.
tls:
  issuerName: dfe-internal-ca

# Off, because the gateway Service is internet-facing.
exposure:
  groups:
    admin:
      enabled: false

pki:
  # External PKI, so a restart keeps issued client configs. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
  mode: external
