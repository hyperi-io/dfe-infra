# Sample overlay where DFE owns every node, so nodeScheduling is empty. Selected by dfe.hyperi.io/cloud local-dfe. See docs/deployment/values-clouds-edge.md#cloud-files.
global:
  cloud: local-dfe
  domain: dfe.example.com

domain: dfe.example.com
storageClass: ""  # the cluster default, which bootstrap adopts or installs (local-path)

nodeScheduling: {}
nodeSelector: {}
tolerations: []

envoyGateway:
  service:
    type: LoadBalancer
    externalIPs: []

exposure:
  groups:
    ingest:
      door: gateway

# The internal CA issues the edge certificate. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
tls:
  issuerName: dfe-internal-ca

clickhouse:
  mode: single

# Archives to local disk because this deployment has no object store.
archive:
  localPath: /var/lib/dfe/archive
