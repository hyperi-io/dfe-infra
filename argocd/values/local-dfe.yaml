# DFE clean cluster (Cluster B) overlay -- the install-from-bare target.
#
# This is the SAMPLE overlay for a cluster where DFE owns every node (no shared
# pets to fence off), exactly like a customer Rancher/EKS cluster. It is selected
# by the cluster secret's dfe.hyperi.io/cloud value (= "local-dfe"). Contrast with
# local.yaml (devex Cluster A) which pins workloads to tainted dfe-k8s nodes; here
# there is NOTHING to avoid, so nodeScheduling is EMPTY -- pods schedule anywhere.
#
# Nothing here is product code -- it is one deploy's values, like aws.yaml would
# be a customer's. The charts/appsets hardcode none of it.
global:
  cloud: local-dfe
  region: local
  domain: dfe.example.com
  registry: "ghcr.io/hyperi-io"

domain: dfe.example.com
storageClass: local-path

# DFE owns the whole cluster -> generic nodes, no pinning/tolerations.
nodeScheduling: {}

# Pull secret for GHCR private images (created by bootstrap.sh from
# DFE_PULL_SECRET_* env). If DFE ships public images this can be dropped.
imagePullSecrets:
  - ghcr-pull-secret

postgresql:
  host: "cnpg-cluster-rw.cnpg.svc.cluster.local"

# KEDA dials the shim at the address the chart renders, and that default names
# namespace dfe; this deploy's apps and their shim run in dfe-local.
keda:
  pressure:
    shimAddress: "dfe-keda-shim.dfe-local.svc.cluster.local:8080"

envoyGateway:
  service:
    type: LoadBalancer
    externalIPs: []

# Edge wildcard-cert issuer. The chart default (dfe-letsencrypt) renders a
# ClusterIssuer only when tls.acme.email or tls.vault.server is set; with neither,
# the gateway-shim requests against a ClusterIssuer that never exists ->
# IssuerNotFound, dfe-wildcard-tls stuck Ready=False. dfe.devex.hyperi.io is an
# internal split-horizon name, so public ACME cannot validate it. Point the edge
# cert at the self-signed internal CA: instant issue, no DNS-01, no external
# credential. Clients must trust dfe-internal-ca-tls (ns cert-manager) or see a
# warning. For a browser-trusted leaf, use OpenBao PKI via tls.vault.* (server,
# path, caBundle, appRole.roleId -- SecretID already seeded as cert-manager-approle).
tls:
  issuerName: dfe-internal-ca

# Standard profile substrate: DFE's own single-node ClickHouse (keeperless,
# MergeTree), no Kafka (gRPC transport). Flip to cluster/external to test those.
clickhouse:
  mode: single

# Archive to local disk in the archiver pod. This deployment has no object
# store, and an ephemeral destination is enough to prove the landing topics
# reach the archiver; a deployment that KEEPS archives sets s3.* instead.
archive:
  localPath: /var/lib/dfe/archive
