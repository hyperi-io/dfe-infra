# dfe-receiver's own load balancer on AKS, layered after apps/dfe-receiver/values.yaml
# by argocd/appsets/layer2-apps.yaml. It renders only on exposure.groups.ingest.door
# loadbalancer with an allow list, which AKS turns into NSG rules from the
# Service's loadBalancerSourceRanges. There is no Azure tofu root, so this
# flavour is values-only.
exposure:
  public:
    # The Standard load balancer targets nodes, and Cluster would SNAT each
    # sender to a node address before the receiver's rate limit and ip_filter
    # see it. Local keeps the sender's address and serves only from nodes
    # running a receiver pod.
    externalTrafficPolicy: Local
