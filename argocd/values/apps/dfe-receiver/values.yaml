# dfe-receiver's integration values over its thin chart, layered after
# apps/_common.yaml: the receiver's wiring, under the keys the scalo-service
# library reads. The keys below them are the receiver's own dials, read here
# through tpl and by dfe-extras, which renders the ingest NetworkPolicy, the mesh
# listener and the dfe-receiver-env ConfigMap.

# The env dfe-extras renders under conditionals, so a variable stays absent
# where its condition is off. Reloader restarts the pod when the ConfigMap changes.
extraEnvFrom:
  - configMapRef:
      name: '{{ include "scalo-service.fullname" . }}-env'
reload:
  configmaps:
    - dfe-receiver-env

# The contract's kafka group on the Secret the stack's broker user writes. Its
# keys are named as that Secret names them; the library's key names take no tpl.
secrets:
  kafka:
    existingSecret: '{{ .Values.kafka.saslSecretName }}'
    keys:
      username: username
      password: password
      mechanism: sasl.mechanism
kafka:
  saslSecretName: dfe-kafka-user

# The receiver's front door, from exposure.groups.ingest (argocd/values/common.yaml)
# and the load balancer's shape in exposure.public, as docs/ingest-edge.md
# documents them. scalo-service's publicService reads none of them, so it stays
# off and dfe-extras refuses it switched on.
publicService:
  enabled: false
# Door loadbalancer renders the load balancers and the ingest NetworkPolicy from
# one list, the contract's public ports the config turns on, and only while
# exposure.groups.ingest.allow names someone: an empty list is no public door.
# The allow list is each load balancer's loadBalancerSourceRanges, and a /0 in it
# marks the Service dfe.hyperi.io/ingest-fence: allow-all. The TCP door takes
# publicService.loadBalancerIP, the cluster secret's receiver address the appset
# hands in, else exposure.public.loadBalancerIP, and the Elastic IPs the appset
# hands in as exposure.public.eipAllocations, one per subnet in
# exposure.public.subnets. The policy names no source, because the allow list
# is the load balancer's. exposure.networkPolicy.enabled: false drops the policy,
# and dfe-extras renders the tunnel door's policy of the same name.
extraObjects:
  - |
    {{- $exposure := .Values.exposure | default dict -}}
    {{- $ingest := dig "groups" "ingest" dict $exposure -}}
    {{- $allow := $ingest.allow | default list -}}
    {{- if and (eq (toString $ingest.enabled) "true") (eq (toString $ingest.door) "loadbalancer") $allow -}}
    {{- $pub := $exposure.public | default dict -}}
    {{- $type := toString ($pub.serviceType | default "LoadBalancer") -}}
    {{- $address := (.Values.publicService | default dict).loadBalancerIP | default $pub.loadBalancerIP -}}
    {{- $fence := "listed" -}}
    {{- range $allow }}{{ if hasSuffix "/0" (toString .) }}{{ $fence = "allow-all" }}{{ end }}{{ end -}}
    {{- $groups := dict "public" list "public-udp" list -}}
    {{- $admitted := list -}}
    {{- range (include "scalo-service.ports" . | fromJson).items -}}
    {{- if .public -}}
    {{- $suffix := ternary "public-udp" "public" (eq .protocol "UDP") -}}
    {{- $_ := set $groups $suffix (append (get $groups $suffix) .) -}}
    {{- $admitted = append $admitted (dict "protocol" .protocol "port" (int .port)) -}}
    {{- end -}}
    {{- end -}}
    {{- range $suffix := list "public" "public-udp" -}}
    {{- with get $groups $suffix -}}
    {{- $spec := dict "type" $type "selector" (include "scalo-service.selectorLabelSet" $ | fromJson) "ports" (include "scalo-service.servicePorts" (dict "ports" .) | fromJson).items -}}
    {{- $annotations := merge (dict "dfe.hyperi.io/ingest-fence" $fence) (deepCopy ($pub.annotations | default dict)) -}}
    {{- if has $type (list "LoadBalancer" "NodePort") -}}
    {{- with $pub.externalTrafficPolicy }}{{ $_ := set $spec "externalTrafficPolicy" . }}{{ end -}}
    {{- end -}}
    {{- if eq $type "LoadBalancer" -}}
    {{- if and (eq $suffix "public") $address }}{{ $_ := set $spec "loadBalancerIP" $address }}{{ end -}}
    {{- with $pub.loadBalancerClass }}{{ $_ := set $spec "loadBalancerClass" . }}{{ end -}}
    {{- $_ := set $spec "loadBalancerSourceRanges" $allow -}}
    {{- if and (eq $suffix "public") $pub.eipAllocations -}}
    {{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-eip-allocations" (join "," $pub.eipAllocations) -}}
    {{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-subnets" (join "," $pub.subnets) -}}
    {{- end -}}
    {{- end -}}
    {{- $meta := include "scalo-service.metadata" (dict "ctx" $ "name" (printf "%s-%s" (include "scalo-service.fullname" $) $suffix) "annotations" $annotations) | fromYaml -}}
    {{- $_ := set $meta "labels" (merge (dict "dfe.hyperi.io/exposure" "public") $meta.labels) }}
    ---
    {{ dict "apiVersion" "v1" "kind" "Service" "metadata" $meta "spec" $spec | toYaml }}
    {{- end -}}
    {{- end -}}
    {{- if and $admitted (dig "networkPolicy" "enabled" true $exposure) -}}
    {{- $spec := dict "podSelector" (dict "matchLabels" (include "scalo-service.selectorLabelSet" . | fromJson)) "policyTypes" (list "Ingress") "ingress" (list (dict "ports" $admitted)) -}}
    {{- $meta := include "scalo-service.metadata" (dict "ctx" . "name" (printf "%s-ingest" (include "scalo-service.fullname" .))) | fromYaml -}}
    {{- $_ := set $meta "labels" (merge (dict "dfe.hyperi.io/exposure" "public") $meta.labels) }}
    ---
    {{ dict "apiVersion" "networking.k8s.io/v1" "kind" "NetworkPolicy" "metadata" $meta "spec" $spec | toYaml }}
    {{- end -}}
    {{- end -}}

# The ingest bearer tokens dfe-engine writes into ingestBearer.secretName while it
# keeps what it mints on its own volume, one file per listener, the file: sources
# the engine compiles. A directory mount, never subPath, so a rewritten key reaches
# the file the receiver re-reads. Optional, because an engine store in Secrets
# Manager renders no Secret and the receiver reads aws: sources instead.
extraVolumes:
  - name: ingest-bearer-tokens
    secret:
      secretName: '{{ .Values.ingestBearer.secretName }}'
      optional: true
extraVolumeMounts:
  - name: ingest-bearer-tokens
    mountPath: /var/run/secrets/dfe/ingest-bearer-tokens
    readOnly: true

# Keys written into the config file that no overlay beats: the
# PushEvents server dfe-fetcher sends to on the direct transport, and the buffer
# figure the app reads only with acknowledgements off. The app's own default for
# both is off and auto-detect.
configOverrides:
  buffer:
    memory_limit: 0
  grpc:
    enabled: true
    bind_address: "0.0.0.0:6000"

keda:
  cpu:
    targetUtilization: 70
  # profile-slim.yaml clears it.
  extraTriggers:
    # BEGIN fragment pressure-trigger -- rendered by `python3 scripts/composition.py --write-fragments`
    - type: metrics-api
      metricType: Value
      metadata:
        targetValue: '{{ .Values.keda.pressure.targetValue | default 70 }}'
        url: 'http://{{ .Values.keda.pressure.shimAddress | default (printf "dfe-keda-shim.%s.svc.cluster.local:8080" .Release.Namespace) }}/keda/pressure?service={{ .Values.keda.pressure.service | default (.Values.fullnameOverride | default .Chart.Name) }}'
        valueLocation: value
    # END fragment pressure-trigger

initContainers:
  # BEGIN fragment wait-for-engine -- rendered by `python3 scripts/composition.py --write-fragments`
  - name: wait-for-engine
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        URL="http://{{ .Values.waitForEngine.service }}.{{ .Values.waitForEngine.namespace | default .Release.Namespace }}.svc.cluster.local:{{ .Values.waitForEngine.port }}/readyz"
        DEADLINE=$(( $(date +%s) + {{ .Values.waitForEngine.timeoutSeconds }} ))
        echo "waiting for ${URL}"
        until curl -fsS -o /dev/null --max-time 5 "$URL"; do
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "dfe-engine did not report ready at ${URL} within {{ .Values.waitForEngine.timeoutSeconds }}s -- GET /api/v1/system/schema on the engine says why" >&2
            exit 1
          fi
          sleep {{ .Values.waitForEngine.intervalSeconds }}
        done
        echo "dfe-engine is ready"
  # END fragment wait-for-engine

waitForEngine:
  service: dfe-engine
  # Empty is the release's own namespace.
  namespace: ""
  port: 8000
  timeoutSeconds: 600
  intervalSeconds: 5
