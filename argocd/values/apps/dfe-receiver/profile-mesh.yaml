# No broker: sends to the loader pool's mesh listener over gRPC.

# loader.transport has no flat-env key, and without brokers the receiver rejects its kafka default.
config:
  loader:
    grpc_endpoint: "http://dfe-loader-mesh.envoy-gateway-system.svc.cluster.local:6000"
  destinations:
    default: loader

# Buffer and spool sizing. See docs/deployment/values-tiers-apps.md#receiver-buffer.
configOverrides:
  loader:
    transport: grpc
  buffer:
    memory_limit: 3221225472
    spillover:
      enabled: true
      path: /var/spool/dfe-receiver
writablePaths:
  spool:
    sizeLimit: 20Gi

secrets:
  kafka:
    enabled: false
