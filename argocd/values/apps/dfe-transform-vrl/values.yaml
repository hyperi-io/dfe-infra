# dfe-transform-vrl's integration values over its thin chart, layered after
# apps/_common.yaml: the wiring the 2.2.0 chart derived, under the keys the
# scalo-service library reads. What depends on the transport sits in the
# profile files beside this one.

# The .vrl programs and the lookup tables they read, each a ConfigMap mounted
# read-only. dfe-engine writes the files into the instance overlay.
fileSets:
  transforms:
    mountPath: /etc/dfe-transform-vrl-transforms
    files: []
  enrichment:
    mountPath: /etc/dfe-transform-vrl-enrichment
    files: []

extraEnv:
  # Outranks the config file, so the app reads the programs mounted above. The
  # app reads an empty value as unset, which leaves its own config to decide.
  DFE_TRANSFORM_TRANSFORMS_DIR: '{{ with .Values.fileSets.transforms.files }}{{ $.Values.fileSets.transforms.mountPath }}{{ end }}'

# The contract's secret group, on the Secret the 2.2.0 chart named.
secrets:
  kafka:
    existingSecret: '{{ .Values.kafka.saslSecretName }}'

keda:
  cpu:
    targetUtilization: 70

initContainers:
  # BEGIN fragment wait-for-engine -- rendered by `python3 scripts/composition.py --write-fragments`
  - name: wait-for-engine
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        URL="http://{{ .Values.waitForEngine.service }}.{{ .Values.waitForEngine.namespace | default .Release.Namespace }}.svc.cluster.local:{{ .Values.waitForEngine.port }}/readyz"
        DEADLINE=$(( $(date +%s) + {{ .Values.waitForEngine.timeoutSeconds }} ))
        echo "waiting for ${URL}"
        until curl -fsS -o /dev/null --max-time 5 "$URL"; do
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "dfe-engine did not report ready at ${URL} within {{ .Values.waitForEngine.timeoutSeconds }}s -- GET /api/v1/system/schema on the engine says why" >&2
            exit 1
          fi
          sleep {{ .Values.waitForEngine.intervalSeconds }}
        done
        echo "dfe-engine is ready"
  # END fragment wait-for-engine

waitForEngine:
  service: dfe-engine
  # Empty is the release's own namespace.
  namespace: ""
  port: 8000
  timeoutSeconds: 600
  intervalSeconds: 5

# The 2.2.0 chart's keys, read here and in the profile files through tpl.
kafka:
  saslSecretName: dfe-kafka-user
  sourceTopic: ""
  destTopic: ""
  # Empty is the instance's own name.
  consumerGroup: ""
