# Flat env outranks the config file. An empty value reads as unset.
extraEnv:
  DFE_TRANSFORM_VRL_SOURCE_BROKERS: '{{ .Values.kafka.bootstrapServers }}'
  DFE_TRANSFORM_VRL_SINK_BROKERS: '{{ .Values.kafka.bootstrapServers }}'
  DFE_TRANSFORM_VRL_SOURCE_TOPICS: '{{ .Values.kafka.sourceTopic }}'
  DFE_TRANSFORM_VRL_SINK_TOPIC: '{{ .Values.kafka.destTopic }}'
  DFE_TRANSFORM_VRL_SOURCE_GROUP_ID: '{{ .Values.kafka.consumerGroup | default (.Values.fullnameOverride | default .Chart.Name) }}'
  # A protocol naming SSL turns TLS on for source and sink.
  DFE_TRANSFORM_VRL_KAFKA_SECURITY_PROTOCOL: '{{ .Values.kafka.securityProtocol }}'

configOverrides:
  source:
    transport: bus
  sink:
    transport: bus

# A group born with its source starts at the oldest record. An overlay value wins.
config:
  source:
    auto_offset_reset: earliest

keda:
  extraTriggers:
    # BEGIN fragment pressure-trigger -- rendered by `python3 scripts/composition.py --write-fragments`
    - type: metrics-api
      metricType: Value
      metadata:
        targetValue: '{{ .Values.keda.pressure.targetValue | default 70 }}'
        url: 'http://{{ .Values.keda.pressure.shimAddress | default (printf "dfe-keda-shim.%s.svc.cluster.local:8080" .Release.Namespace) }}/keda/pressure?service={{ .Values.keda.pressure.service | default (.Values.fullnameOverride | default .Chart.Name) }}'
        valueLocation: value
    # END fragment pressure-trigger
