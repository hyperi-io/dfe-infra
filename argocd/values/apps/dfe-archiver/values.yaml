# dfe-archiver's wiring over its thin chart. See docs/deployment/values-tiers-apps.md#per-app-notes.

# An image that spools to a relative path still finds a writable one.
workingDir: /tmp

extraEnv:
  DFE_ARCHIVER_SPOOL_DIR: /var/spool/dfe/archiver
  # Env beats the config file, and an empty value reads as unset.
  DFE_ARCHIVER_DESTINATION: '{{ with (.Values.archive | default dict).localPath }}file://{{ . }}{{ end }}'
  DFE_ARCHIVER_S3_ENDPOINT: '{{ .Values.s3.endpoint }}'
  DFE_ARCHIVER_S3_BUCKET: '{{ .Values.s3.bucket }}'

secrets:
  kafka:
    existingSecret: '{{ .Values.kafka.saslSecretName }}'
  s3:
    existingSecret: '{{ .Values.s3.secretName | default (printf "%s-s3" (include "scalo-service.fullname" .)) }}'

# A file:// destination needs a writable directory on a read-only root filesystem.
extraVolumes:
  - name: archive
    emptyDir: {}
extraVolumeMounts:
  - name: archive
    mountPath: '{{ (.Values.archive | default dict).localPath | default "/var/lib/dfe-archiver/archive" }}'

keda:
  cpu:
    targetUtilization: 70

initContainers:
  # BEGIN fragment wait-for-engine -- rendered by `python3 scripts/composition.py --write-fragments`
  - name: wait-for-engine
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        URL="http://{{ .Values.waitForEngine.service }}.{{ .Values.waitForEngine.namespace | default .Release.Namespace }}.svc.cluster.local:{{ .Values.waitForEngine.port }}/readyz"
        DEADLINE=$(( $(date +%s) + {{ .Values.waitForEngine.timeoutSeconds }} ))
        echo "waiting for ${URL}"
        until curl -fsS -o /dev/null --max-time 5 "$URL"; do
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "dfe-engine did not report ready at ${URL} within {{ .Values.waitForEngine.timeoutSeconds }}s -- GET /api/v1/system/schema on the engine says why" >&2
            exit 1
          fi
          sleep {{ .Values.waitForEngine.intervalSeconds }}
        done
        echo "dfe-engine is ready"
  # END fragment wait-for-engine

waitForEngine:
  service: dfe-engine
  namespace: ""
  port: 8000
  timeoutSeconds: 600
  intervalSeconds: 5

kafka:
  saslSecretName: dfe-kafka-user
# A default here would beat the cloud file, which sets archive.localPath.
archive: {}
s3:
  endpoint: ""
  bucket: ""
  secretName: dfe-archiver-s3
dlq:
  topic: dfe_archiver_dlq
  mode: kafka_only
