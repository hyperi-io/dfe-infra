# The bus. The mechanism comes from the Secret holding the credential, where the
# kafka chart derives it from the broker's provider. With secrets.kafka off it
# names an optional key the app's own config ConfigMap never carries, so it stays
# unset as the credential does.
extraEnv:
  DFE_LOADER_KAFKA_SASL_MECHANISM:
    valueFrom:
      '{{ if eq (toString (dig "kafka" "enabled" true .Values.secrets)) "false" }}configMapKeyRef{{ else }}secretKeyRef{{ end }}':
        name: '{{ if eq (toString (dig "kafka" "enabled" true .Values.secrets)) "false" }}{{ include "scalo-service.fullname" . }}-config{{ else }}{{ .Values.kafka.saslSecretName }}{{ end }}'
        key: sasl.mechanism
        optional: true
