# The bus: brokers, topics and group through the DFE_TRANSFORM_* flat env, which
# outranks the config file. The app reads an empty value as unset.
extraEnv:
  DFE_TRANSFORM_SOURCE_BROKERS: '{{ .Values.kafka.bootstrapServers }}'
  DFE_TRANSFORM_SINK_BROKERS: '{{ .Values.kafka.bootstrapServers }}'
  DFE_TRANSFORM_SOURCE_TOPICS: '{{ .Values.kafka.sourceTopic }}'
  DFE_TRANSFORM_SINK_TOPIC: '{{ .Values.kafka.destTopic }}'
  DFE_TRANSFORM_SOURCE_GROUP_ID: '{{ .Values.kafka.consumerGroup | default (.Values.fullnameOverride | default .Chart.Name) }}'
  # A protocol naming SSL turns TLS on for source and sink. Any other leaves the config's setting.
  DFE_TRANSFORM_KAFKA_SECURITY_PROTOCOL: '{{ .Values.kafka.securityProtocol }}'
  # From the Secret holding the credential, where the kafka chart derives it from
  # the broker's provider. With secrets.kafka off it names an optional key the
  # app's own config ConfigMap never carries, so it stays unset.
  DFE_TRANSFORM_KAFKA_SASL_MECHANISM:
    valueFrom:
      '{{ if eq (toString (dig "kafka" "enabled" true .Values.secrets)) "false" }}configMapKeyRef{{ else }}secretKeyRef{{ end }}':
        name: '{{ if eq (toString (dig "kafka" "enabled" true .Values.secrets)) "false" }}{{ include "scalo-service.fullname" . }}-config{{ else }}{{ .Values.kafka.saslSecretName }}{{ end }}'
        key: sasl.mechanism
        optional: true

# Which transport carries the records is this profile's, never the engine's.
configOverrides:
  source:
    transport: bus
  sink:
    transport: bus

# A group born with its source starts at the oldest record, in Vector's own
# spelling. An overlay value wins.
config:
  source:
    auto_offset_reset: smallest
