# The file alone, not its directory: the lookup tables mount inside it.
configMount:
  subPath: true

# The bundled filebeat pipeline reads /etc/dfe-transform-vector/data/timezones.csv.
fileSets:
  transforms:
    mountPath: /etc/dfe-transform-vector-transforms
    files: []
  enrichment:
    mountPath: /etc/dfe-transform-vector/data
    files: []

extraEnv:
  # Outranks the config file. An empty value reads as unset.
  DFE_TRANSFORM_VECTOR_TRANSFORMS_DIR: '{{ with .Values.fileSets.transforms.files }}{{ $.Values.fileSets.transforms.mountPath }}{{ end }}'
  DFE_TRANSFORM_VECTOR_VECTOR_DATA_DIR: /var/lib/vector

secrets:
  kafka:
    existingSecret: '{{ .Values.kafka.saslSecretName }}'

keda:
  cpu:
    targetUtilization: 70

initContainers:
  # BEGIN fragment wait-for-engine -- rendered by `python3 scripts/composition.py --write-fragments`
  - name: wait-for-engine
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        URL="http://{{ .Values.waitForEngine.service }}.{{ .Values.waitForEngine.namespace | default .Release.Namespace }}.svc.cluster.local:{{ .Values.waitForEngine.port }}/readyz"
        DEADLINE=$(( $(date +%s) + {{ .Values.waitForEngine.timeoutSeconds }} ))
        echo "waiting for ${URL}"
        until curl -fsS -o /dev/null --max-time 5 "$URL"; do
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "dfe-engine did not report ready at ${URL} within {{ .Values.waitForEngine.timeoutSeconds }}s -- GET /api/v1/system/schema on the engine says why" >&2
            exit 1
          fi
          sleep {{ .Values.waitForEngine.intervalSeconds }}
        done
        echo "dfe-engine is ready"
  # END fragment wait-for-engine

waitForEngine:
  service: dfe-engine
  namespace: ""
  port: 8000
  timeoutSeconds: 600
  intervalSeconds: 5

kafka:
  saslSecretName: dfe-kafka-user
  sourceTopic: ""
  destTopic: ""
  consumerGroup: ""
