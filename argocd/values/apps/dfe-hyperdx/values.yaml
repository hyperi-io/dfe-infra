# dfe-hyperdx's wiring over its thin chart. See docs/deployment/values-tiers-apps.md#per-app-notes.

extraEnvFrom:
  - configMapRef:
      name: '{{ include "scalo-service.fullname" . }}-env'
reload:
  configmaps:
    - dfe-hyperdx-env

secrets:
  session:
    existingSecret: '{{ .Values.sessionSecret.name }}'
  token-encryption:
    existingSecret: '{{ .Values.tokenEncryption.name }}'
  # Off: HyperDX queries ClickHouse on the connection dfe-engine hands each team.
  clickhouse:
    enabled: false

extraEnv:
  # The collector's OTLP/HTTP port, which the image exports to with no protocol set.
  OTEL_EXPORTER_OTLP_ENDPOINT: '{{ regexReplaceAll ":4317$" (tpl .Values.telemetry.otlpEndpointTemplate .) ":4318" }}'
  MONGO_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: '{{ .Values.mongodb.passwordSecretName }}'
        key: '{{ .Values.mongodb.passwordSecretKey }}'
  # The kubelet expands $(MONGO_PASSWORD) because extraEnv renders in name order.
  MONGO_URI: '{{ .Values.mongodb.uri }}'

initContainers:
  - name: dashboards
    image: '{{ with .Values.dashboards.image.repository }}{{ . }}{{ else }}{{ $.Values.global.registry }}/dfe-engine{{ end }}:{{ .Values.dashboards.image.tag }}{{ with .Values.dashboards.image.digest }}@{{ . }}{{ end }}'
    imagePullPolicy: '{{ .Values.dashboards.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    command:
      - python
      - -m
      - dfe_engine.hyperdx.dashboards
      - --out
      - '{{ .Values.dashboards.mountPath }}'
    volumeMounts:
      - name: dashboards
        mountPath: '{{ .Values.dashboards.mountPath }}'
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  # Holds the pod until the CA file exists, because Node reads NODE_EXTRA_CA_CERTS once as each process starts.
  - name: wait-for-clickhouse-ca
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    envFrom:
      - configMapRef:
          name: '{{ include "scalo-service.fullname" . }}-env'
    env:
      - name: WAIT_TIMEOUT_SECONDS
        value: '{{ .Values.waitForClickhouseCa.timeoutSeconds }}'
      - name: WAIT_INTERVAL_SECONDS
        value: '{{ .Values.waitForClickhouseCa.intervalSeconds }}'
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "${NODE_EXTRA_CA_CERTS:-}" ]; then
          exit 0
        fi
        DEADLINE=$(( $(date +%s) + ${WAIT_TIMEOUT_SECONDS} ))
        echo "waiting for ${NODE_EXTRA_CA_CERTS}"
        until [ -s "${NODE_EXTRA_CA_CERTS}" ]; do
          if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
            echo "no ClickHouse CA at ${NODE_EXTRA_CA_CERTS} after ${WAIT_TIMEOUT_SECONDS}s -- {{ if .Values.clickhouse.tls.ca.secretName }}Secret{{ else }}ConfigMap{{ end }} {{ .Values.clickhouse.tls.ca.secretName | default .Values.clickhouse.tls.ca.configMapName }} has not reached this namespace" >&2
            exit 1
          fi
          sleep "${WAIT_INTERVAL_SECONDS}"
        done
        echo "ClickHouse CA present"
    volumeMounts:
      - name: clickhouse-ca
        mountPath: /etc/dfe/clickhouse-ca
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi

extraVolumes:
  - name: dashboards
    emptyDir: {}
  # The CA the document store's gateway chains to, which MONGO_URI's tlsCAFile names.
  - name: documentdb-ca
    secret:
      secretName: '{{ .Values.mongodb.caSecretName }}'
  # Optional: plaintext ClickHouse has no CA object.
  - name: clickhouse-ca
    '{{ if .Values.clickhouse.tls.ca.secretName }}secret{{ else }}configMap{{ end }}':
      '{{ if .Values.clickhouse.tls.ca.secretName }}secretName{{ else }}name{{ end }}': '{{ .Values.clickhouse.tls.ca.secretName | default .Values.clickhouse.tls.ca.configMapName | default "dfe-clickhouse-ca" }}'
      optional: true
      items:
        - key: '{{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}'
          path: '{{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}'

extraVolumeMounts:
  - name: dashboards
    mountPath: '{{ .Values.dashboards.mountPath }}'
    readOnly: true
  - name: clickhouse-ca
    mountPath: /etc/dfe/clickhouse-ca
    readOnly: true
  - name: documentdb-ca
    mountPath: /etc/dfe/documentdb-ca
    readOnly: true

# The bundled DocumentDB gateway, TLS with SCRAM-SHA-256. An external endpoint sets uri, an empty extraEnv.MONGO_PASSWORD and caSecretName.
mongodb:
  uri: "mongodb://hyperdx:$(MONGO_PASSWORD)@documentdb-service-dfe-documentdb.cnpg.svc.cluster.local:10260/hyperdx?tls=true&tlsCAFile=/etc/dfe/documentdb-ca/ca.crt&authMechanism=SCRAM-SHA-256"
  passwordSecretName: dfe-documentdb-credentials
  passwordSecretKey: password
  caSecretName: dfe-documentdb-ca

waitForClickhouseCa:
  timeoutSeconds: 600
  intervalSeconds: 5

sessionSecret:
  name: dfe-hyperdx-session
tokenEncryption:
  name: dfe-hyperdx-token-encryption

dashboards:
  mountPath: /etc/hyperdx/dashboards
  image:
    repository: ""
    tag: "v1.22.94-rc.8"
    # Runs the engine image: versions.yaml digests.dfe-engine.
    digest: "sha256:20953163ba109dfacc70f85a7fbc19257f50154294d2b3cdde8cabed0b232776"
