        if dfe-fetcher config-schema --dir "$dir"; then
          # The contract names no image, so the writer records itself --
          # without this the engine cannot report which pin it read.
          printf '{"app": "%s", "ref": "%s", "emitted_at": "%s"}\n' \
            "dfe-fetcher" "{{ range .Values.content.entries }}{{ if eq .name "dfe-fetcher-contract" }}{{ .ref }}{{ end }}{{ end }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$dir/source.json"
          echo "content: dfe-fetcher emitted its contract to $dir"
        else
          echo "content: dfe-fetcher emitted no contract; the mount stays empty" >&2
        fi
    volumeMounts: *content-mounts
  - name: content-dfe-transform-vrl-contract
    image: '{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-vrl-contract" }}{{ .ref }}{{ end }}{{ end }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
      - /bin/sh
      - -c
      - |
        set -u
        dir="{{ .Values.content.mountPath }}/contract/dfe-transform-vrl"
        # An image that carries no contract must not wedge the engine's
        # pod: the app exits non-zero on a write failure.
        if dfe-transform-vrl config-schema --dir "$dir"; then
          # The contract names no image, so the writer records itself --
          # without this the engine cannot report which pin it read.
          printf '{"app": "%s", "ref": "%s", "emitted_at": "%s"}\n' \
            "dfe-transform-vrl" "{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-vrl-contract" }}{{ .ref }}{{ end }}{{ end }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$dir/source.json"
          echo "content: dfe-transform-vrl emitted its contract to $dir"
        else
