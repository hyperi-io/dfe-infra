        fi
    volumeMounts: *content-mounts
  - name: content-dfe-fetcher-contract
    image: '{{ $ref := "" }}{{ range .Values.content.entries }}{{ if eq .name "dfe-fetcher-contract" }}{{ $ref = .ref }}{{ end }}{{ end }}{{ $ref | default (include "scalo-service.image" .) }}'
    imagePullPolicy: *pull-policy
