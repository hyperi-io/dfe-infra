  - name: content-dfe-transform-vrl-contract
    image: '{{ $ref := "" }}{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-vrl-contract" }}{{ $ref = .ref }}{{ end }}{{ end }}{{ $ref | default (include "scalo-service.image" .) }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
      - /bin/sh
      - -c
      - |
        set -u
        ref="{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-vrl-contract" }}{{ .ref }}{{ end }}{{ end }}"
        # Its entry is gone from content.entries: this pod runs the engine image.
        if [ -z "$ref" ]; then
