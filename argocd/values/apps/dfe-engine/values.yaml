# dfe-engine's integration values over its thin chart, layered after
# apps/_common.yaml: the wiring the 2.2.0 chart derived, under the keys the
# scalo-service library reads. The keys below them are the 2.2.0 chart's own,
# read here through tpl and by dfe-extras, which renders the hunt runner, the keda
# shim, the minted Secrets, the app catalogue and the dfe-engine-env ConfigMap.

# The env the 2.2.0 chart wrote under conditionals, so a variable stays absent
# where 2.2.0 left it out. Reloader restarts the pod when either ConfigMap
# changes, as the 2.2.0 catalogue checksum rolled it.
extraEnvFrom:
  - configMapRef:
      name: '{{ include "scalo-service.fullname" . }}-env'
reload:
  configmaps:
    - dfe-engine-env
    - dfe-engine-app-catalogue

# The contract's secret groups, on the Secrets the 2.2.0 chart named.
secrets:
  clickhouse:
    existingSecret: '{{ .Values.clickhouse.passwordSecretName }}'
  jwt:
    existingSecret: '{{ .Values.auth.jwtSecretName }}'
  admin:
    existingSecret: '{{ .Values.auth.adminSecretName }}'
  breakglass:
    existingSecret: '{{ .Values.auth.breakglassSecretName }}'
  hunt-runner:
    existingSecret: '{{ .Values.huntRunner.clickhouse.passwordSecretName }}'
  kafka:
    existingSecret: '{{ .Values.kafka.saslSecretName }}'
  gitops:
    existingSecret: '{{ .Values.gitops.credentialsSecret }}'
  seed-accounts:
    existingSecret: '{{ .Values.seedAuth.secretName }}'

extraEnv:
  # Rendered by the gateway chart beside the engine, and optional, so an engine
  # with no gateway starts with no admin links rather than not at all.
  DFE_ADMIN_LINKS:
    valueFrom:
      configMapKeyRef:
        name: dfe-admin-links
        key: admin_links.json
        optional: true
  # The engine composes the login page's credential-fetch command from it.
  DFE_DEPLOYMENT_NAMESPACE:
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

# One init container per content pin in content.entries, each reading its pin by
# name, so the ref has one copy. An overlay that adds or drops an entry restates
# this list.
initContainers:
  - name: content-dfe-receiver-contract
    image: '{{ range .Values.content.entries }}{{ if eq .name "dfe-receiver-contract" }}{{ .ref }}{{ end }}{{ end }}'
    imagePullPolicy: &pull-policy '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext: &init-security
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    command:
      - /bin/sh
      - -c
      - |
        set -u
        dir="{{ .Values.content.mountPath }}/contract/dfe-receiver"
        # An image that carries no contract must not wedge the engine's
        # pod: the app exits non-zero on a write failure.
        if dfe-receiver config-schema --dir "$dir"; then
          # The contract names no image, so the writer records itself --
          # without this the engine cannot report which pin it read.
          printf '{"app": "%s", "ref": "%s", "emitted_at": "%s"}\n' \
            "dfe-receiver" "{{ range .Values.content.entries }}{{ if eq .name "dfe-receiver-contract" }}{{ .ref }}{{ end }}{{ end }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$dir/source.json"
          echo "content: dfe-receiver emitted its contract to $dir"
        else
          echo "content: dfe-receiver emitted no contract; the mount stays empty" >&2
        fi
    volumeMounts: &content-mounts
      - name: content
        mountPath: '{{ .Values.content.mountPath }}'
  - name: content-dfe-loader-contract
    image: '{{ range .Values.content.entries }}{{ if eq .name "dfe-loader-contract" }}{{ .ref }}{{ end }}{{ end }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
      - /bin/sh
      - -c
      - |
        set -u
        dir="{{ .Values.content.mountPath }}/contract/dfe-loader"
        # An image that carries no contract must not wedge the engine's
        # pod: the app exits non-zero on a write failure.
        if dfe-loader config-schema --dir "$dir"; then
          # The contract names no image, so the writer records itself --
          # without this the engine cannot report which pin it read.
          printf '{"app": "%s", "ref": "%s", "emitted_at": "%s"}\n' \
            "dfe-loader" "{{ range .Values.content.entries }}{{ if eq .name "dfe-loader-contract" }}{{ .ref }}{{ end }}{{ end }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$dir/source.json"
          echo "content: dfe-loader emitted its contract to $dir"
        else
          echo "content: dfe-loader emitted no contract; the mount stays empty" >&2
        fi
    volumeMounts: *content-mounts
  - name: content-dfe-archiver-contract
    image: '{{ range .Values.content.entries }}{{ if eq .name "dfe-archiver-contract" }}{{ .ref }}{{ end }}{{ end }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
