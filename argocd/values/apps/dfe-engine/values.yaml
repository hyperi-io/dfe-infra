        fi
    volumeMounts: *content-mounts
  - name: content-dfe-transform-vector-contract
    image: '{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-vector-contract" }}{{ .ref }}{{ end }}{{ end }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
      - /bin/sh
      - -c
      - |
        set -u
        dir="{{ .Values.content.mountPath }}/contract/dfe-transform-vector"
        # An image that carries no contract must not wedge the engine's
        # pod: the app exits non-zero on a write failure.
        if dfe-transform-vector config-schema --dir "$dir"; then
          # The contract names no image, so the writer records itself --
