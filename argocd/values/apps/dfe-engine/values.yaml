  - name: content-dfe-transform-vector-contract
    image: '{{ $ref := "" }}{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-vector-contract" }}{{ $ref = .ref }}{{ end }}{{ end }}{{ $ref | default (include "scalo-service.image" .) }}'
