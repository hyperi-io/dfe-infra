            > "$dir/source.json"
          echo "content: dfe-transform-elastic emitted its contract to $dir"
        else
          echo "content: dfe-transform-elastic emitted no contract; the mount stays empty" >&2
        fi
    volumeMounts: *content-mounts
  # Seeds the auth ConfigMaps authConfig names into the writable config volume.
  # It runs on every pod because a list item cannot follow authConfig, and it
  # copies nothing where authConfig names no ConfigMap.
  - name: auth-config-seed
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
      - python3
      - -c
      - |
        import shutil
        import ssl
        from pathlib import Path
        # An unnamed ConfigMap mounts as an empty directory, which seeds nothing.
        for src, dst in (
            ("/seed/oidc-providers", "{{ .Values.config.mountPath }}/auth/oidc-providers"),
            ("/seed/groups", "{{ .Values.config.mountPath }}/auth/groups"),
        ):
            files = [f for f in Path(src).iterdir() if f.is_file()]
            if not files:
                continue
            d = Path(dst)
            d.mkdir(parents=True, exist_ok=True)
            for f in files:
                shutil.copyfile(f, d / f.name)
                print("seeded", d / f.name)
        # SSL_CERT_FILE REPLACES the trust store, it does not add to it, so a
        # private-CA bundle on its own fails every PUBLIC TLS peer -- a hosted
        # IdP's discovery fetch dies on certificate_verify_failed. Merge the
        # image's own roots in and point SSL_CERT_FILE at the result.
        ca = Path("/seed/ca/ca-bundle.pem")
        if ca.is_file():
            merged = Path("{{ .Values.config.mountPath }}/auth/ca-bundle.pem")
            merged.parent.mkdir(parents=True, exist_ok=True)
            text = ca.read_text(encoding="utf-8")
            roots = Path(ssl.get_default_verify_paths().openssl_cafile or "")
            if roots.is_file():
                text += "\n" + roots.read_text(encoding="utf-8")
            merged.write_text(text, encoding="utf-8", newline="\n")
            print("merged", merged)
    volumeMounts:
      - name: writable-config
        mountPath: '{{ .Values.config.mountPath }}'
      - name: oidc-providers
        mountPath: /seed/oidc-providers
        readOnly: true
      - name: auth-groups
        mountPath: /seed/groups
        readOnly: true
      - name: ca-bundle
        mountPath: /seed/ca
        readOnly: true

extraVolumes:
  - name: app-catalogue
    configMap:
      name: '{{ include "scalo-service.fullname" . }}-app-catalogue'
  # Pod-local: the content is materialised from the pins on every start.
  - name: content
    emptyDir: {}
  - name: deploy-repo
    emptyDir: {}
  # Optional: a deployment on plaintext ClickHouse has no CA object, and
  # DFE_CLICKHOUSE_CA_CERT (dfe-engine-env) is set only where it has one. tpl
  # mounts the CA from a Secret when clickhouse.tls.ca.secretName is set, else
  # from a ConfigMap.
  - name: clickhouse-ca
    '{{ if .Values.clickhouse.tls.ca.secretName }}secret{{ else }}configMap{{ end }}':
      '{{ if .Values.clickhouse.tls.ca.secretName }}secretName{{ else }}name{{ end }}': '{{ .Values.clickhouse.tls.ca.secretName | default .Values.clickhouse.tls.ca.configMapName | default "dfe-clickhouse-ca" }}'
      optional: true
      items:
        - key: '{{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}'
          path: '{{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}'
  # The auth seed's sources: each ConfigMap authConfig names, else a small empty
  # directory, as a list item cannot be left out.
  - name: oidc-providers
    '{{ if .Values.authConfig.providersConfigMap }}configMap{{ else }}emptyDir{{ end }}':
      '{{ if .Values.authConfig.providersConfigMap }}name{{ else }}sizeLimit{{ end }}': '{{ .Values.authConfig.providersConfigMap | default "1Mi" }}'
  - name: auth-groups
    '{{ if .Values.authConfig.groupsConfigMap }}configMap{{ else }}emptyDir{{ end }}':
      '{{ if .Values.authConfig.groupsConfigMap }}name{{ else }}sizeLimit{{ end }}': '{{ .Values.authConfig.groupsConfigMap | default "1Mi" }}'
  - name: ca-bundle
    '{{ if .Values.authConfig.caBundleConfigMap }}configMap{{ else }}emptyDir{{ end }}':
      '{{ if .Values.authConfig.caBundleConfigMap }}name{{ else }}sizeLimit{{ end }}': '{{ .Values.authConfig.caBundleConfigMap | default "1Mi" }}'

extraVolumeMounts:
  - name: app-catalogue
    mountPath: /etc/dfe-engine/catalogue
    readOnly: true
  # Read-only here, writable in the init containers that fill it.
  - name: content
    mountPath: '{{ .Values.content.mountPath }}'
    readOnly: true
  - name: deploy-repo
    mountPath: '{{ dir .Values.gitops.localPath }}'
  - name: clickhouse-ca
    mountPath: /etc/dfe/clickhouse-ca
    readOnly: true

# The engine's own keys, read above through tpl and by dfe-extras. Keys
# common.yaml sets (clickhouse.*) are not restated, as this file layers after it.
content:
  mountPath: /etc/dfe-engine/content
  entries:
    - name: dfe-receiver-contract
      kind: emit
      role: contract
      app: dfe-receiver
      ref: "ghcr.io/hyperi-io/dfe-receiver:v1.15.58@sha256:44a5874e7db073dd6c273fce20e6d61cc7cd0654a757b934099f2c5343a63369"
    - name: dfe-loader-contract
      kind: emit
      role: contract
      app: dfe-loader
      ref: "ghcr.io/hyperi-io/dfe-loader:v1.18.58@sha256:4f35277451d5c9e42560515bff58ab5c40cdde3f350a2ec69e9fd3539668ac21"
    - name: dfe-archiver-contract
      kind: emit
      role: contract
      app: dfe-archiver
      ref: "ghcr.io/hyperi-io/dfe-archiver:v1.7.39@sha256:08ce1f184c20b202aea45c853b9545cfb473c44e2c161869a810618ff6fc91e2"
    - name: dfe-fetcher-contract
      kind: emit
      role: contract
      app: dfe-fetcher
      ref: "ghcr.io/hyperi-io/dfe-fetcher:v1.4.43@sha256:e7b3e550a49ccaf42b8290ddf6d20036476d23900a976df061735d6e02981e5e"
    - name: dfe-transform-vrl-contract
      kind: emit
      role: contract
      app: dfe-transform-vrl
      ref: "ghcr.io/hyperi-io/dfe-transform-vrl:v1.1.38@sha256:d22603d34e48ae7d6c71239b6eecd7160ca30d805f26f9bd6ff54ff39e973429"
    - name: dfe-transform-vector-contract
      kind: emit
      role: contract
      app: dfe-transform-vector
      ref: "ghcr.io/hyperi-io/dfe-transform-vector:v1.0.55@sha256:2457922b8bd88b7660db0627f3ce4ca75881fed3e4df84a43cc95706f4179ce1"
    - name: dfe-transform-elastic-contract
      kind: emit
      role: contract
      app: dfe-transform-elastic
      ref: "ghcr.io/hyperi-io/dfe-transform-elastic:v1.1.19@sha256:510d443ab1d5198b409e5fed7dda41fb6e8b1ac1e3850a4cc66aa1a14f29717e"
# The env names this mount; the contract's writable path `config` mounts at /config.
config:
  mountPath: /config
authConfig:
  providersConfigMap: ""
  groupsConfigMap: ""
  caBundleConfigMap: ""
gitops:
  localPath: /var/run/dfe/deploy-repo
  credentialsSecret: dfe-deploy-repo-auth
auth:
  jwtSecretName: dfe-engine-jwt
  adminSecretName: dfe-engine-admin
  breakglassSecretName: dfe-engine-breakglass
huntRunner:
  clickhouse:
    passwordSecretName: hunt-runner-clickhouse
kafka:
  saslSecretName: dfe-kafka-user
seedAuth:
  secretName: dfe-engine-seed-accounts
