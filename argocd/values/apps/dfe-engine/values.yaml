          printf '{"app": "%s", "ref": "%s", "emitted_at": "%s"}\n' \
            "dfe-transform-vector" "{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-vector-contract" }}{{ .ref }}{{ end }}{{ end }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$dir/source.json"
          echo "content: dfe-transform-vector emitted its contract to $dir"
        else
