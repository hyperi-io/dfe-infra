      - -c
      - |
        set -u
        dir="{{ .Values.content.mountPath }}/contract/dfe-archiver"
        # An image that carries no contract must not wedge the engine's
        # pod: the app exits non-zero on a write failure.
        if dfe-archiver config-schema --dir "$dir"; then
          # The contract names no image, so the writer records itself --
          # without this the engine cannot report which pin it read.
          printf '{"app": "%s", "ref": "%s", "emitted_at": "%s"}\n' \
            "dfe-archiver" "{{ range .Values.content.entries }}{{ if eq .name "dfe-archiver-contract" }}{{ .ref }}{{ end }}{{ end }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$dir/source.json"
          echo "content: dfe-archiver emitted its contract to $dir"
        else
          echo "content: dfe-archiver emitted no contract; the mount stays empty" >&2
        fi
    volumeMounts: *content-mounts
  - name: content-dfe-fetcher-contract
    image: '{{ range .Values.content.entries }}{{ if eq .name "dfe-fetcher-contract" }}{{ .ref }}{{ end }}{{ end }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
      - /bin/sh
      - -c
      - |
        set -u
        dir="{{ .Values.content.mountPath }}/contract/dfe-fetcher"
        # An image that carries no contract must not wedge the engine's
