  - name: content-dfe-transform-elastic-contract
    image: '{{ $ref := "" }}{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-elastic-contract" }}{{ $ref = .ref }}{{ end }}{{ end }}{{ $ref | default (include "scalo-service.image" .) }}'
    imagePullPolicy: *pull-policy
    securityContext: *init-security
    command:
      - /bin/sh
      - -c
      - |
        set -u
        ref="{{ range .Values.content.entries }}{{ if eq .name "dfe-transform-elastic-contract" }}{{ .ref }}{{ end }}{{ end }}"
        # Its entry is gone from content.entries: this pod runs the engine image.
