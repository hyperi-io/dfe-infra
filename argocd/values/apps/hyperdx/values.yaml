# dfe-hyperdx's integration values over its thin chart, layered after
# apps/_common.yaml: HyperDX's wiring, under the keys the scalo-service library
# reads. The keys below them are HyperDX's own dials, read here through tpl and
# by dfe-extras, which renders the generated keys and the dfe-hyperdx-env
# ConfigMap.

# The env dfe-extras renders under conditionals, so a variable stays absent
# where its condition is off. Reloader restarts the pod when the ConfigMap changes.
extraEnvFrom:
  - configMapRef:
      name: '{{ include "scalo-service.fullname" . }}-env'
reload:
  configmaps:
    - dfe-hyperdx-env

# The contract's secret groups, on the Secrets these values name.
secrets:
  session:
    existingSecret: '{{ .Values.sessionSecret.name }}'
  token-encryption:
    existingSecret: '{{ .Values.tokenEncryption.name }}'
  # Off: HyperDX queries ClickHouse on the connection dfe-engine hands each team,
  # and nothing it runs reads a password of its own.
  clickhouse:
    enabled: false

extraEnv:
  # The telemetry.mode endpoint (apps/_common.yaml), on the collector's OTLP/HTTP
  # port, which the image exports to with no protocol set.
  OTEL_EXPORTER_OTLP_ENDPOINT: '{{ regexReplaceAll ":4317$" (tpl .Values.telemetry.otlpEndpointTemplate .) ":4318" }}'
  MONGO_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: '{{ .Values.mongodb.passwordSecretName }}'
        key: '{{ .Values.mongodb.passwordSecretKey }}'
  # The kubelet expands $(MONGO_PASSWORD) here because extraEnv renders in name order.
  MONGO_URI: '{{ .Values.mongodb.uri }}'

# dfe-engine owns the dashboard JSON: this init container copies it out of the
# engine image into the directory HyperDX's provisioner reads.
initContainers:
  - name: dashboards
    image: '{{ with .Values.dashboards.image.repository }}{{ . }}{{ else }}{{ $.Values.global.registry }}/dfe-engine{{ end }}:{{ .Values.dashboards.image.tag }}{{ with .Values.dashboards.image.digest }}@{{ . }}{{ end }}'
    imagePullPolicy: '{{ .Values.dashboards.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    command:
      - python
      - -m
      - dfe_engine.hyperdx.dashboards
      - --out
      - '{{ .Values.dashboards.mountPath }}'
    volumeMounts:
      - name: dashboards
        mountPath: '{{ .Values.dashboards.mountPath }}'
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  # Node reads NODE_EXTRA_CA_CERTS once, as each process starts, and the CA lands
  # here through two asynchronous copies (clickhouse-cluster's tls-ca.yaml and
  # clickhouse-admin-appns.yaml), so this holds the pod until the file
  # dfe-hyperdx-env names is present. It exits at once where that names none.
  - name: wait-for-clickhouse-ca
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    envFrom:
      - configMapRef:
          name: '{{ include "scalo-service.fullname" . }}-env'
    env:
      - name: WAIT_TIMEOUT_SECONDS
        value: '{{ .Values.waitForClickhouseCa.timeoutSeconds }}'
      - name: WAIT_INTERVAL_SECONDS
        value: '{{ .Values.waitForClickhouseCa.intervalSeconds }}'
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "${NODE_EXTRA_CA_CERTS:-}" ]; then
          exit 0
        fi
        DEADLINE=$(( $(date +%s) + ${WAIT_TIMEOUT_SECONDS} ))
        echo "waiting for ${NODE_EXTRA_CA_CERTS}"
        until [ -s "${NODE_EXTRA_CA_CERTS}" ]; do
          if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
            echo "no ClickHouse CA at ${NODE_EXTRA_CA_CERTS} after ${WAIT_TIMEOUT_SECONDS}s -- {{ if .Values.clickhouse.tls.ca.secretName }}Secret{{ else }}ConfigMap{{ end }} {{ .Values.clickhouse.tls.ca.secretName | default .Values.clickhouse.tls.ca.configMapName }} has not reached this namespace" >&2
            exit 1
          fi
          sleep "${WAIT_INTERVAL_SECONDS}"
        done
        echo "ClickHouse CA present"
    volumeMounts:
      - name: clickhouse-ca
        mountPath: /etc/dfe/clickhouse-ca
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi

extraVolumes:
  - name: dashboards
    emptyDir: {}
  # Optional: a deployment on plaintext ClickHouse has no CA object, and
  # NODE_EXTRA_CA_CERTS (dfe-hyperdx-env) is set only where it has one. There,
  # wait-for-clickhouse-ca holds the pod until the CA is in this volume. tpl
  # mounts the CA from a Secret when clickhouse.tls.ca.secretName is set, else
  # from a ConfigMap.
  - name: clickhouse-ca
    '{{ if .Values.clickhouse.tls.ca.secretName }}secret{{ else }}configMap{{ end }}':
      '{{ if .Values.clickhouse.tls.ca.secretName }}secretName{{ else }}name{{ end }}': '{{ .Values.clickhouse.tls.ca.secretName | default .Values.clickhouse.tls.ca.configMapName | default "dfe-clickhouse-ca" }}'
      optional: true
      items:
        - key: '{{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}'
          path: '{{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}'

extraVolumeMounts:
  - name: dashboards
    mountPath: '{{ .Values.dashboards.mountPath }}'
    readOnly: true
  - name: clickhouse-ca
    mountPath: /etc/dfe/clickhouse-ca
    readOnly: true

# Mongo-protocol metadata store: the bundled FerretDB. An external endpoint sets
# uri with its credentials inline and extraEnv.MONGO_PASSWORD to an empty string.
mongodb:
  uri: "mongodb://hyperdx:$(MONGO_PASSWORD)@dfe-ferretdb.cnpg.svc.cluster.local:27017/hyperdx?authSource=admin"
  passwordSecretName: dfe-ferretdb-password
  passwordSecretKey: password

waitForClickhouseCa:
  timeoutSeconds: 600
  intervalSeconds: 5

sessionSecret:
  name: dfe-hyperdx-session
tokenEncryption:
  name: dfe-hyperdx-token-encryption

dashboards:
  mountPath: /etc/hyperdx/dashboards
  image:
    repository: ""     # empty -> {{ global.registry }}/dfe-engine
    tag: "v1.22.51"     # == versions.yaml apps.dfe-engine (drift-checked)
    # The init container runs the ENGINE image, so this is versions.yaml
    # digests.dfe-engine (drift-checked).
    digest: "sha256:e0ec14ccbd2d8b020b42ce2aab04cbbf48211c366fd858d5a5abc7b91ac841c6"
