# dfe-fetcher's wiring over its thin chart. See docs/deployment/values-tiers-apps.md#per-app-notes.

# One pod per fetcher config: N replicas of one config poll the same source N times.
replicaCount: 1
keda:
  cpu:
    targetUtilization: 70

# The cursor claim is off by default. Argo never prunes it, so a render that drops it leaves the Application OutOfSync until the claim is deleted by hand.
writablePaths:
  cursor:
    persistence:
      enabled: false
      annotations:
        argocd.argoproj.io/sync-options: Prune=false

config:
  cursor:
    directory: /var/lib/dfe-fetcher

extraEnvFrom:
  - secretRef:
      name: '{{ .Values.credentials.secretName }}'
      optional: true

secrets:
  kafka:
    existingSecret: '{{ .Values.kafka.saslSecretName }}'

initContainers:
  # BEGIN fragment wait-for-engine -- rendered by `python3 scripts/composition.py --write-fragments`
  - name: wait-for-engine
    image: '{{ include "scalo-service.image" . }}'
    imagePullPolicy: '{{ .Values.image.pullPolicy | default "IfNotPresent" }}'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        URL="http://{{ .Values.waitForEngine.service }}.{{ .Values.waitForEngine.namespace | default .Release.Namespace }}.svc.cluster.local:{{ .Values.waitForEngine.port }}/readyz"
        DEADLINE=$(( $(date +%s) + {{ .Values.waitForEngine.timeoutSeconds }} ))
        echo "waiting for ${URL}"
        until curl -fsS -o /dev/null --max-time 5 "$URL"; do
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "dfe-engine did not report ready at ${URL} within {{ .Values.waitForEngine.timeoutSeconds }}s -- GET /api/v1/system/schema on the engine says why" >&2
            exit 1
          fi
          sleep {{ .Values.waitForEngine.intervalSeconds }}
        done
        echo "dfe-engine is ready"
  # END fragment wait-for-engine

waitForEngine:
  service: dfe-engine
  namespace: ""
  port: 8000
  timeoutSeconds: 600
  intervalSeconds: 5

kafka:
  saslSecretName: dfe-kafka-user
credentials:
  secretName: dfe-fetcher-credentials
dlq:
  topic: dfe_fetcher_dlq
  mode: kafka_only
