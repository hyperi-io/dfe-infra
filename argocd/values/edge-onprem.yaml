# THE EDGE MODULE, ON-PREM FLAVOUR, layered by argocd/appsets/layer2-edge.yaml. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
# TIER 1 is on by default, TIER 2 is a costed opt-in and TIER 3 is absent by design.

# Addressed by MetalLB.
envoyGateway:
  service:
    type: LoadBalancer
    externalIPs: []

# The internal CA issues the edge certificate. See docs/deployment/values-clouds-edge.md#edge-flavour-files.
tls:
  issuerName: dfe-internal-ca

exposure:
  serviceType: LoadBalancer
