      dfe-ui: "sha256:1c5c23c71574b6ae063d93012c00aecad39f177997e7706f67633b56a001b1f8"
      dfe-receiver: "sha256:f3a358673743e9e0e9501f917e6905974edc79b35bf0d475c7825c78e8f02c05"
      dfe-loader: "sha256:32259b6405f3dcb6353c588cf45622d77373d2773cf72cace10cb48ceff59b9c"
      dfe-archiver: "sha256:cbfb645c93b908b84612832b5d7ea8d291f2e0a262181fbcfcffd5072edb17d0"
      dfe-fetcher: "sha256:6376b48b1ab8f0c2339aec2658e5813cf8e2b3e730feb6959d7c4b1fba268324"
      dfe-transform-vrl: "sha256:bea4ea432ecf36a536167b962a71b814d178c7254a2bde9ecb040f83176904f7"
      dfe-transform-vector: "sha256:3c3b8528485634a0b6846ad2dc9350effffbaab067628943660989a64fa248f2"

    # Digests for the DOCKER-path third-party plain images -- the immutable half
    # of the tag@sha256 pin that `dfe-stack render --target docker` emits. Keyed
    # by the SAME logical name as the version field in `services:`. VERIFIED
    # 2026-07-16 via `docker buildx imagetools inspect <ref> --format
    # '{{.Manifest.Digest}}'` (manifest-list digest -> multi-arch safe). k8s note:
