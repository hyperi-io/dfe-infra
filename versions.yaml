# versions.yaml — SINGLE SOURCE OF TRUTH for all pinned versions.
# Every version pin in the repo reads from this file.
# To upgrade a component: change the version here, commit, push.
# bootstrap.sh, ArgoCD ApplicationSets, and CI all consume this.

# Layer 1: Bootstrap components (installed by bootstrap.sh)
bootstrap:
  cert-manager: "v1.20.1"
  external-secrets: "2.2.0"
  argocd: "7.8.26"
  valkey: "1.0.0"

# Layer 1: Operators (deployed by ArgoCD wave 2-3)
operators:
  envoy-gateway: "v1.7.1"
  external-dns: "1.20.0"
  keda: "2.19.0"
  metrics-server: "3.13.0"
  reloader: "2.2.9"
  cloudnative-pg: "0.27.1"
  strimzi-kafka-operator: "0.51.0"
  # clickhouse-operator: devex uses hyperi-infra, standalone TBD

# Layer 2: Data platform (deployed by ArgoCD wave 4)
data:
  postgresql: "17"               # CNPG cluster PG major version
  cnpg-cluster-instances: "3"    # Number of PG instances (HA)
  kafka-version: "4.1.1"         # Kafka version inside Strimzi (0.51+ requires 4.x)
  kafka-replicas: "3"            # Kafka broker count
  clickhouse-version: "24.8"     # ClickHouse server version
  clickhouse-replicas: "1"       # default; overridden by profile (standard=1, scale=3)
  ferretdb: "1.24.0"             # FerretDB version
  otel-collector: "0.114.0"      # OpenTelemetry Collector version
  hyperdx: "2.16.0"             # HyperDX (hyperi-hyperdx fork) app version
  gitea: "1.26.4"                # In-cluster deploy-repo git host

# Layer 2: DFE apps (deployed by ArgoCD wave 5)
apps:
  dfe-engine: "2.2.0"
  dfe-ui: "2.2.0"
  dfe-receiver: "2.2.0"
  dfe-loader: "2.2.0"
  dfe-archiver: "2.2.0"
  dfe-fetcher: "2.2.0"
  dfe-transform-wasm: "2.2.0"
  dfe-transform-vrl: "2.2.0"
  dfe-transform-vector: "2.2.0"
  dfe-transform-elastic: "2.2.0"
  dfe-transform-splack: "2.2.0"

# Terraform providers
providers:
  hashicorp-null: "~> 3.0"
  hashicorp-vault: "~> 4.0"

# CI tools
tools:
  terraform: "1.9.0"
  opentofu: "1.7.0"
  helm: "3.14.0"
