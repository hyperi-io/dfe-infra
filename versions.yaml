    apps:
      dfe-engine: "v1.17.1"         # ghcr.io/hyperi-io/dfe-engine (Python; own line). scalo 2.29.15: [metrics] carries the OTel SDK, so /metrics + OTLP export work on the single extra (the self-monitoring E2E was green while exporting nothing).
