# versions.yaml -- SINGLE SOURCE OF TRUTH for all pinned versions.
# Every version pin in the repo MUST match this file. A CI drift-check
# (scripts/check_versions_drift.py) fails the build if an appset / chart /
# bootstrap manifest diverges from these values.
#
# Pin policy (see CI standards + auto-memory feedback_sha_pin_cooldown):
#   - Only adopt a version whose upstream release date is >= 7 days old
#     (supply-chain cooldown). Verify dates via `gh` API, not cached web.
#   - Prefer an LTS line when the upstream publishes one.
#   - Pin container images by digest where practical; charts by exact version.
# Last verified: 2026-06-25 (cutoff 2026-06-18).

# Layer 1: Bootstrap components (installed by bootstrap.sh via read_versions.py)
bootstrap:
  cert-manager: "v1.20.2"        # 2026-04-11
  external-secrets: "2.6.0"      # 2026-06-07 (chart series is 2.x; app v2.6.x)
  argocd: "9.5.21"               # 2026-06-11 chart -> Argo CD app v3.x. 9.7.0 (06-22) too fresh. MAJOR jump from 7.8.x; gated apply.
  valkey: "8.1.8-alpine"         # image tag for bootstrap/templates/valkey.yaml (plain manifest, not a chart). 2026-06-02

# Layer 1: Operators (deployed by ArgoCD wave 2-3 via appsets/layer1-addons.yaml)
operators:
  envoy-gateway: "v1.8.1"        # 2026-06-05 (OCI gateway-helm; chart==app version)
  external-dns: "1.21.1"         # 2026-04-30 (chart; review endpointslices RBAC change)
  keda: "2.20.1"                 # 2026-06-15 (chart; needs events.k8s.io RBAC at 2.20)
  metrics-server: "3.13.1"       # 2026-06-11 (chart; app v0.8.x)
  reloader: "2.2.12"             # 2026-05-25 (chart; app v1.4.x)
  cloudnative-pg: "0.28.3"       # 2026-06-10 (chart; operator app 1.29.x; needs K8s >=1.29)
  strimzi-kafka-operator: "0.51.0"  # KEEP -- latest 0.x. 1.0 drops v1alpha1/v1beta1/v1beta2 CRDs we use.
  clickhouse-operator: "0.0.5"   # OCI helm CHART tag (appVersion v0.0.5; 2026-05-18). OFFICIAL ClickHouse Inc operator (serves ClickHouseCluster + KeeperCluster CRDs). v0.0.6 (06-19) too fresh. DECISION: official over Altinity (greenfield + 1-shard topology fits + we own DDL + safe Keeper consensus + CH partner support). Scale-profile only (cluster mode); single mode needs no operator. OCI ghcr.io/clickhouse/clickhouse-operator-helm@sha256:bbdaf6fcf1837c59f71076e0b92feb42fa6356dd37369756f7e4dd7c5c3eb181. Altinity is the documented unbuilt fallback.
  redpanda-operator: "26.1.6"    # redpanda/operator chart+app (2026-06-17, 9d old; clears cooldown). Serves Redpanda + User + Topic CRDs (cluster.redpanda.com/v1alpha2). ONLY installed when a deployer picks provider=redpanda AND acceptLicense=true (BSL gate -- see kafka chart). redpanda is a FIRST-CLASS provider choice alongside strimzi; the operator gives it the same operator+thin-CR model strimzi has (User CR mirrors KafkaUser). No distinct LTS line (date-based trains); 26.1.x is current.

# Layer 2: Data platform (deployed by ArgoCD wave 4)
data:
  postgresql: "17"               # CNPG cluster PG major version
  cnpg-cluster-instances: "3"    # Number of PG instances (HA)
  kafka-version: "4.1.1"         # Kafka inside Strimzi (0.51 supports 4.1.x/4.2.0). VERIFY against strimzi kafka-versions.yaml before bump to 4.2.0.
  kafka-replicas: "3"            # Kafka broker count (cluster mode default; settable higher)
  redpanda-version: "v26.1.8"    # redpanda broker image tag the operator chart 26.1.6 pairs with (tested pairing). Used in the Redpanda CR spec.clusterSpec.image.tag when provider=redpanda.
  clickhouse-version: "26.3.13.31"  # DOCKER tag (NOT the v..-lts release tag -- Docker drops -lts; verified pullable). LTS release v26.3.13.31-lts 2026-06-08. 24.8 was past-EOL; 26.3.14/15 (06-22/23) too fresh.
  clickhouse-replicas: "1"       # default; overridden by profile (standard=1, scale=3)
  ferretdb: "2.7.0"              # 2025-11-10. 2.x requires DocumentDB PG ext; NOT in-place upgradable from 1.x (dump/restore). Pair with postgres-documentdb:17-0.107.0-ferretdb-2.7.0
  documentdb-pg: "17-0.107.0-ferretdb-2.7.0"  # FerretDB 2.x PG backend image tag
  otel-collector: "0.154.0"      # 2026-06-09. v0.155.0 (06-24) too fresh. Large jump from 0.114 -- review removed components.
  hyperdx: "2.16.0"              # TODO reconcile: this is the UPSTREAM HyperDX app version; our hyperi-hyperdx fork is v1.0.0. Pin the fork's published image tag. Tied to fork-update workstream.
  gitea: "1.26.4"                # In-cluster deploy-repo git host

# Layer 2: DFE apps (deployed by ArgoCD wave 5)
apps:
  dfe-engine: "2.2.0"
  dfe-ui: "2.2.0"
  dfe-receiver: "2.2.0"
  dfe-loader: "2.2.0"
  dfe-archiver: "2.2.0"
  dfe-fetcher: "2.2.0"
  dfe-transform-wasm: "2.2.0"
  dfe-transform-vrl: "2.2.0"
  dfe-transform-vector: "2.2.0"
  dfe-transform-elastic: "2.2.0"
  dfe-transform-splack: "2.2.0"

# Terraform providers
providers:
  hashicorp-null: "~> 3.0"
  hashicorp-vault: "~> 4.0"

# CI tools
# NOTE: terraform/opentofu/helm bumps deferred to the TF/Tofu dual-CI workstream
# (OpenTofu to be canonical; terraform kept for dual-CI compat). Do not bump here
# in isolation -- they move together with that change.
tools:
  terraform: "1.9.0"
  opentofu: "1.7.0"
  helm: "3.14.0"
