      dfe-ui: "sha256:144800e1cc7479ca1fd713228daaa02bbb348b2293a02abdbac9c581b9a3e2dd"
      dfe-receiver: "sha256:c750b08c808cf3574a6a7a24d62064013aca18071cf2251df2e687b4cfb7465d"
      dfe-loader: "sha256:26e3e438cafa1b3b3305299ce07d6040abbb829b123575f13e26ccb5463fd9a2"
      dfe-archiver: "sha256:1ccaa927a5a2398c3448b04ed8c6a608484218a4238ed3980fda365d7463f698"
      dfe-fetcher: "sha256:dc3def6f4ba52b170ac6c42f35a80b8de5cc38ee03fb67abe3fdfc9666946d96"
      dfe-transform-vrl: "sha256:75d97417d09456fabc0931202cbcb7a13e015b1eae46ccde67b920e8a2514a2c"
      dfe-transform-vector: "sha256:f0e3ccfe6c4dac66e5256da1272c4c0dcfee97ef1b1dc2388fe9e1a4e299d465"
      # The multi-arch INDEX digest; a per-platform digest under it would strand the other architecture.
      dfe-transform-elastic: "sha256:447ecd904de58c1c7bc209335e9b72c57e3a17eb3ea652bc1574239860d9fe8b"
      # Keyed here rather than under content:, which carries versions and
      # not digests -- the renderer reads digests.dfe-hyperdx and found none.
      dfe-hyperdx: "sha256:7989490936fee5dae750202d0027d6a5e3dae4e63521f19776997b995335496d"
      # ghcr.io/hyperi-io/culvert:v2.1.15. Manifest-LIST digest (amd64 + arm64),
      # read via `oras manifest fetch --descriptor`.
      culvert: "sha256:a58a2ee3daeffc7cbb72deb1d58968441fa7507c9959395cf1824671aebbaf0b"
      # ghcr.io/hyperi-io/dfe-toolbox-base, tagged by the family pin
      # toolbox.dfe-toolbox (v1.0.0). Index digest (amd64 + arm64), built
      # 2026-10-01, read via `docker buildx imagetools inspect`. A published
      # family tag never moves: Toolbox Build refuses changed inputs under it,
      # so new inputs ship under a bumped toolbox.dfe-toolbox (scripts/toolbox_inputs.py).
      dfe-toolbox-base: "sha256:7374ea315c37179168d8d1e830d83ce6c3eccfbb1311a0f05c27d059f045dc58"

    # Digests for the third-party images a pin tags -- the immutable half of the
    # tag@sha256 pin that `dfe-stack render --target docker` emits and that every
    # k8s chart or manifest running one of these images renders (drift-checked).
    # Keyed by the SAME logical name as the version field in `services:`, or in
    # `bootstrap:` for the plain-manifest images bootstrap.sh applies. Each is the
    # manifest-list digest, read with `docker buildx imagetools inspect <ref>
    # --format '{{.Manifest.Digest}}'`, so it is multi-arch safe. Two images a pin
    # names still deploy by tag on k8s: the cluster-mode Redpanda CR (the
    # operator's chart accepts only a semver tag) and Strimzi's broker, which
    # the operator resolves itself.
    services-digests:
      clickhouse-version: "sha256:456063a689194186633bb3db0862283068f4c2ee538852d3aaffa7eb66f1f841"  # clickhouse/clickhouse-server:26.3.32.14 (both paths; helm/charts/clickhouse-cluster values clickhouse.imageDigest mirrors it, drift-checked)
      clickhouse-keeper: "sha256:8dd3ed81719ae9467ad659d86b7af53a9ec5be6b50320f9ca84cf9c31dc7ccc8"   # docker.io/clickhouse/clickhouse-keeper:26.3.32.14 (k8s only; helm/charts/clickhouse-cluster values clickhouse.keeper.image.digest mirrors it, drift-checked). Index digest, read 2026-10-01 via `docker buildx imagetools inspect`.
      kafka-version: "sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"       # apache/kafka:4.3.1 (docker path, and on k8s the single-mode broker and MSK bootstrap Job; helm/charts/kafka values kafka.imageDigest mirrors it, drift-checked. Strimzi resolves its own broker image in cluster mode)
      redpanda-version: "sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96"    # docker.redpanda.com/redpandadata/redpanda:v26.2.2 (docker path and the k8s single-mode StatefulSet; helm/charts/kafka values kafka.redpanda.image.digest mirrors it, drift-checked)
      kafbat: "sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1"              # ghcr.io/kafbat/kafka-ui:v1.5.0 (both paths)
      ferretdb: "sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985"            # ghcr.io/ferretdb/ferretdb:2.7.0 (both paths; the hyperdx fork target; helm/charts/ferretdb values image.digest mirrors it, drift-checked)
      documentdb-pg: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"       # ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0 (both paths; k8s pins it in helm/charts/ferretdb values + cnpg-cluster values, both drift-checked)
      envoy-proxy: "sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66"         # envoyproxy/envoy:v1.39.0 (docker-only; k8s uses envoy-gateway). Resolved 2026-08-18 via buildx imagetools (manifest-list digest, multi-arch safe). Unlike the nginx tag it replaced, an Envoy vX.Y.Z tag is IMMUTABLE, so this only needs re-resolving when the version moves. Verified: dfe-docker config/proxy/envoy.yaml passes `envoy --mode validate` on this image, and it carries bash + grep for the compose healthcheck.
      nginx-unprivileged: "sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af"   # nginxinc/nginx-unprivileged:1.31.6-alpine (k8s links page and Cruise Control UI; helm/charts/links and helm/charts/kafka values image.digest mirror this, drift-checked). The same index digest 1.31-alpine resolved to on 2026-10-01, read via `docker buildx imagetools inspect`. Re-resolved by `dfe-stack refresh-digests`.
      otel-collector: "sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5"       # otel/opentelemetry-collector-contrib:0.158.0 (both paths: dfe-docker DFE_OTEL_COLLECTOR_VERSION, and helm/charts/otel-collector values image.digest mirrors it, drift-checked). Resolved via buildx imagetools (manifest-list digest, multi-arch safe).
      git-sync: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"            # registry.k8s.io/git-sync/git-sync:v4.7.1 (k8s only; helm/charts/dfe-engine values huntRunner.gitSync.image.digest mirrors this, drift-checked). Manifest-LIST digest, so it is multi-arch safe. Resolved 2026-09-04 off the registry v2 API (registry.k8s.io redirects to the Artifact Registry mirrors; the same digest came back from australia-southeast1 and us-central1).
      busybox: "sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"             # docker.io/library/busybox:1.38.0 (k8s only; bootstrap/templates/local-path-helper-pod.yaml mirrors it, drift-checked). Index digest, read 2026-10-01 via `docker buildx imagetools inspect`; `latest` resolved to the same digest that day.
      forgejo: "sha256:eda2e378442d2f18cfa563994f8ad66e71f04ac9c3bb4259cc57bdd641890f5c"             # code.forgejo.org/forgejo/forgejo:15.0.5 (k8s only; helm/charts/forgejo values image.digest mirrors it, drift-checked). Index digest, read 2026-10-01 via `docker buildx imagetools inspect`.
      valkey: "sha256:4934d214fd7e091d4ee77b398945b3fd62c6dd0ac71d8b79e2e3cbad8364f3b1"              # valkey/valkey:8.1.9-alpine (k8s only; bootstrap/templates/valkey.yaml mirrors it, drift-checked). Index digest, read 2026-10-01 via `docker buildx imagetools inspect`.
      local-path-provisioner: "sha256:1eba82e9c386038b4af6d69cca7519fac738c28c42735ed48ce70c882ad0d80f"  # docker.io/rancher/local-path-provisioner:v0.0.36 (k8s only; bootstrap.sh reads it at runtime and pins upstream's manifest with it). Index digest, read 2026-10-01 via `docker buildx imagetools inspect`.
      envoy-gateway-proxy: "sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4" # docker.io/envoyproxy/envoy:distroless-v1.39.1 (k8s only; helm/edge/gateway values envoyGateway.proxy.image mirrors it, drift-checked). Index digest, read 2026-10-01 via `docker buildx imagetools inspect`; the same digest Envoy Gateway v1.9.1 compiles in.

    # Content repos -- tagged in LOCKSTEP with this stack release (one name for
    # the whole set). PENDING entries have no release tag / published image yet;
    # the first release cut stamps them.
    content:
      dfe-schemas: "v0.2.8"              # baseline DDL; the dfe-schemas release engine v1.22.8 locks and applies at startup
      # renovate: datasource=github-tags depName=hyperi-io/dfe-deploy
      dfe-deploy: "v1.0.4"               # the deploy-repo template (seeded at this tag); the newest tag on the remote at this cut
      # A GIT REF, not a version: dfe-docker cuts no per-stack tag, so the
      # immutable record of what ran a stack is the commit. `dfe-stack cut`
      # re-resolves it from dfe-docker main.
      dfe-docker: "941f48961c41d2ada25f722442c6929493a8adc7"
      dfe-hyperdx: "v0.2.7"              # ghcr.io/hyperi-io/dfe-hyperdx@sha256:7989490936fee5dae750202d0027d6a5e3dae4e63521f19776997b995335496d (an engine token still pending a password change is refused, members read their own team, the restore surface is gated, and the node base is pinned by digest; upstream 2.36.0); deployment tag pin lives in the deploy repo values

    # Stage toolbox: the dfe-toolbox ops shell image family (docker/dfe-toolbox/),
    # NOT a component of the deployed stack -- an operator convenience
    # container. Built by .github/workflows/toolbox-build.yml to
    # ghcr.io/hyperi-io/dfe-toolbox-{base,aws,gcp,azure}. Every ARG default in
    # those Dockerfiles equals the matching pin here; check_versions_drift.py
    # holds the two together. clickhouse-client is NOT re-pinned here -- it
    # tracks services.clickhouse-version directly, so the two can never drift.
    toolbox:
      # renovate: datasource=docker depName=ghcr.io/hyperi-io/dfe-toolbox-base
      dfe-toolbox: "v1.0.1"              # the image family's own release tag (all four images move together). A published family tag never moves, so every input change ships under a new one. v1.0.1: the Debian base pinned by digest (toolbox.debian); v1.0.0 stays published as it was.
      # renovate: datasource=docker depName=debian
      debian: "trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"  # dfe-toolbox-base's FROM (docker/dfe-toolbox/base/Dockerfile ARG DEBIAN_TAG, drift-checked). Debian 13.7: trixie-slim, 13.7-slim and trixie-20260918-slim share this index digest, pushed 2026-09-19 (Docker Hub tag API) and read 2026-10-01 via `docker buildx imagetools inspect`. Renovate moves the digest under the trixie-slim tag; a move changes the base image's inputs, so it ships under a bumped dfe-toolbox family tag.
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      kubectl: "v1.35.8"                 # 2026-08-20 (clears the 7-day cooldown), verified via `curl -I https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl`. Deliberately the MIDDLE of platform.kubernetes's 1.34-1.36 window, not the 1.36 ceiling: kubectl's official skew policy supports a server up to 1 minor away either side, and 1.35 is within that of both 1.34 and 1.36 while 1.36 would be 2 minors from a 1.34 server. renovate.json holds Renovate to 1.35.x; move that rule with the window.
      # renovate: datasource=github-releases depName=helm/helm
      helm: "v4.2.4"                     # 2026-08-13 (clears the 7-day cooldown), verified via `curl -I https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz`. v4.3.0 (2026-09-09) was inside the cooldown at this cut. Helm v3 and v4 are both still released; v4 was picked as the actively-developed line, and both read this stack's `apiVersion: v2` charts unchanged.
      # renovate: datasource=github-releases depName=argoproj/argo-cd
      argocd-cli: "v3.5.2"               # matches the ArgoCD APP version bootstrap.argocd's chart (10.9.0) deploys -- not the chart's own version number -- so the CLI never talks to a server outside its own supported skew. Released 2026-08-27, clears the 7-day cooldown. Coupled to that chart: a bump here moves only with the chart the bootstrap installs.
      # renovate: datasource=github-releases depName=opentofu/opentofu
      tofu: "1.12.6"                     # OpenTofu. 2026-08-19 (clears the 7-day cooldown), verified via `gh api repos/opentofu/opentofu/releases`.
      # renovate: datasource=github-releases depName=mikefarah/yq
      yq: "v4.53.6"                      # mikefarah/yq, the Go binary -- NOT Debian's python3-yq apt package. 2026-08-20 (clears the 7-day cooldown), verified via `gh api repos/mikefarah/yq/releases`.
      # renovate: datasource=github-tags depName=aws/aws-cli
      aws-cli: "2.36.36"                 # 2026-08-31 (clears the 7-day cooldown). aws-cli publishes no GitHub Releases (tags only, so the annotation above reads tags); dated via the tag's own commit (`gh api repos/aws/aws-cli/commits/<sha>`). No LTS line.
      aws-session-manager-plugin: "1.2.835.0"  # AWS publishes only a floating "latest" URL per OS/arch -- no versioned download exists. This records the version `latest` resolved to when last verified (observed 2026-09-13; the artifact itself is dated 2026-06-17); docker/dfe-toolbox/aws/Dockerfile asserts the installed version still matches this pin and fails the build if AWS has moved `latest` again, which is what makes this pin worth having despite the URL floating under it. UNWATCHED by Renovate on purpose: there is no version feed to watch, so the Dockerfile assertion is the only signal that AWS moved it.
      gcloud: "583.0.0"                  # google-cloud-cli. 2026-09-01 (clears the 7-day cooldown), verified via `curl -I https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-583.0.0-linux-x86_64.tar.gz`. 584.0.0 (2026-09-09) was inside the cooldown at this cut. No LTS line; the SDK ships weekly. UNWATCHED by Renovate: the SDK ships off dl.google.com with no GitHub repo and no datasource Renovate carries, so this one moves by hand.
      # renovate: datasource=pypi depName=azure-cli
      az-cli: "2.90.0"                   # azure-cli. 2026-09-01 (clears the 7-day cooldown), verified via `gh api repos/Azure/azure-cli/releases`. Watched through PyPI rather than the GitHub tag, which is spelled `azure-cli-2.90.0` and does not compare against this value. Installed from Microsoft's apt repo pinned to the `bookworm` codename: packages.microsoft.com/repos/azure-cli has no `trixie` suite yet, and the bookworm build (a self-contained venv under /opt/az) installs and runs cleanly on trixie regardless.

    # Stack upgrade metadata for THIS version.
    stack:
      # Versions an environment may upgrade to THIS release from (verified paths).
      # Empty = first release under the graph model. Derived graph:
      # dfe-stack graph walks the `stacks:` keys + each stack's previous.
      previous: "2.2.0-rc.13"
      # Rollout order between component groups on a stack upgrade (lockstep does
      # not remove ordering -- schemas before the engine that expects them, data
      # plane before the UI that surfaces it).
      upgrade-order: "dfe-schemas, dfe-engine, data-plane, dfe-ui"

    # OpenTofu/Terraform provider constraints (pinned per-stack for a complete
    # manifest). These MIRROR the required_providers blocks under terraform/ --
    # keep them equal, the value here is a record, the module is what runs.
    providers:
      hashicorp-null: "~> 3.0"       # terraform/modules/tf-naming
      hashicorp-vault: "~> 5.0"      # terraform/modules/tf-iam, tf-secrets, environments/local
      hashicorp-random: "~> 3.6"     # terraform/modules/tf-secrets, secrets/aws-sm, environments/aws
      # The AWS deployment path: every capability module, the root that composes
      # them, and the one-shot root that creates the state bucket.
      hashicorp-aws: "~> 6.64"       # terraform/modules/{kubernetes-cluster/aws,managed-kafka/{msk,confluent-cloud,redpanda-cloud},secrets/aws-sm}, terraform/environments/{aws,aws-state}
      # The two SaaS Kafka modules each pair their own provider with aws, for
      # the private-link handshake's other end (see the module's versions.tf).
      confluentinc-confluent: "~> 2.86"  # terraform/modules/managed-kafka/confluent-cloud
      redpanda-data-redpanda: "~> 2.3"   # terraform/modules/managed-kafka/redpanda-cloud
      # Zips the broker-count autoscaler's inline Lambda source. Local-only,
      # no cloud API.
      hashicorp-archive: "~> 2.8"    # terraform/modules/managed-kafka/msk
      # The optional OIDC modules ship with no lock file, so the constraint is
      # the only ceiling a customer's `tofu init` has to resolve against.
      okta-okta: "~> 6.0"            # terraform/modules/tf-oidc-okta
      hashicorp-google: "~> 7.0"     # terraform/modules/tf-oidc-google
      hashicorp-azuread: "~> 3.0"    # terraform/modules/tf-oidc-entra

