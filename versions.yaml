      dfe-ui: "sha256:144800e1cc7479ca1fd713228daaa02bbb348b2293a02abdbac9c581b9a3e2dd"
      dfe-receiver: "sha256:c750b08c808cf3574a6a7a24d62064013aca18071cf2251df2e687b4cfb7465d"
      dfe-loader: "sha256:26e3e438cafa1b3b3305299ce07d6040abbb829b123575f13e26ccb5463fd9a2"
      dfe-archiver: "sha256:1ccaa927a5a2398c3448b04ed8c6a608484218a4238ed3980fda365d7463f698"
      dfe-fetcher: "sha256:dc3def6f4ba52b170ac6c42f35a80b8de5cc38ee03fb67abe3fdfc9666946d96"
      dfe-transform-vrl: "sha256:75d97417d09456fabc0931202cbcb7a13e015b1eae46ccde67b920e8a2514a2c"
      dfe-transform-vector: "sha256:f0e3ccfe6c4dac66e5256da1272c4c0dcfee97ef1b1dc2388fe9e1a4e299d465"
      # The multi-arch INDEX digest; a per-platform digest under it would strand the other architecture.
      dfe-transform-elastic: "sha256:447ecd904de58c1c7bc209335e9b72c57e3a17eb3ea652bc1574239860d9fe8b"
      # Keyed here rather than under content:, which carries versions and
      # not digests -- the renderer reads digests.dfe-hyperdx and found none.
      dfe-hyperdx: "sha256:7989490936fee5dae750202d0027d6a5e3dae4e63521f19776997b995335496d"
      # ghcr.io/hyperi-io/culvert:v2.1.15. Manifest-LIST digest (amd64 + arm64),
      # read via `oras manifest fetch --descriptor`.
      culvert: "sha256:a58a2ee3daeffc7cbb72deb1d58968441fa7507c9959395cf1824671aebbaf0b"
      # ghcr.io/hyperi-io/dfe-toolbox-base, tagged by the family pin
      # toolbox.dfe-toolbox (v1.0.1). Index digest (amd64 + arm64), built
      # 2026-10-01 on the digest-pinned Debian base, read via `docker buildx
      # imagetools inspect`. A published family tag never moves: Toolbox Build
      # refuses changed inputs under it, so new inputs ship under a bumped
      # toolbox.dfe-toolbox (scripts/toolbox_inputs.py).
      dfe-toolbox-base: "sha256:0e086e98c2ff74249cdb4b35f8ab3c4e0d4cbc5133eb367045d54c17dcdb9dc7"

    # Digests for the third-party images a pin tags -- the immutable half of the
    # tag@sha256 pin that `dfe-stack render --target docker` emits and that every
    # k8s chart or manifest running one of these images renders (drift-checked).
    # Keyed by the SAME logical name as the version field in `services:`, or in
    # `bootstrap:` for the plain-manifest images bootstrap.sh applies. Each is the
    # manifest-list digest, read with `docker buildx imagetools inspect <ref>
    # --format '{{.Manifest.Digest}}'`, so it is multi-arch safe. Two images a pin
    # names still deploy by tag on k8s: the cluster-mode Redpanda CR (the
    # operator's chart accepts only a semver tag) and Strimzi's broker, which
    # the operator resolves itself.
    services-digests:
      clickhouse-version: "sha256:21d572843e59539c7d100286b6f5a6053c341fe4b33c2d7b74b1ff7cb24c5399"  # clickhouse/clickhouse-server:26.3.42.3 (both paths; helm/charts/clickhouse-cluster values clickhouse.imageDigest mirrors it, drift-checked)
      clickhouse-keeper: "sha256:8361ed78996d087f3e85622566f15517c502e169a63e70b44dafe6ddca6dd3f5"   # docker.io/clickhouse/clickhouse-keeper:26.3.42.3 (k8s only; helm/charts/clickhouse-cluster values clickhouse.keeper.image.digest mirrors it, drift-checked). Index digest, read via `docker buildx imagetools inspect`.
      kafka-version: "sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"       # apache/kafka:4.3.1 (docker path, and on k8s the single-mode broker and MSK bootstrap Job; helm/charts/kafka values kafka.imageDigest mirrors it, drift-checked. Strimzi resolves its own broker image in cluster mode)
      redpanda-version: "sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9"    # docker.redpanda.com/redpandadata/redpanda:v26.2.3 (docker path and the k8s single-mode StatefulSet; helm/charts/kafka values kafka.redpanda.image.digest mirrors it, drift-checked)
      kafbat: "sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1"              # ghcr.io/kafbat/kafka-ui:v1.5.0 (both paths)
      ferretdb: "sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985"            # ghcr.io/ferretdb/ferretdb:2.7.0 (both paths; the hyperdx fork target; helm/charts/ferretdb values image.digest mirrors it, drift-checked)
      documentdb-pg: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"       # ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0 (both paths; k8s pins it in helm/charts/ferretdb values, drift-checked)
      envoy-proxy: "sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85"         # envoyproxy/envoy:v1.39.2 (docker-only; k8s uses envoy-gateway). Resolved via buildx imagetools (manifest-list digest, multi-arch safe). An Envoy vX.Y.Z tag is IMMUTABLE, so this only needs re-resolving when the version moves. Verified: dfe-docker config/proxy/envoy.yaml and config/proxy/hyperdx.yaml pass `envoy --mode validate` on this image, and it carries bash + grep for the compose healthcheck.
      nginx-unprivileged: "sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083"   # nginxinc/nginx-unprivileged:1.31.6-alpine (k8s links page and Cruise Control UI; helm/charts/links and helm/charts/kafka values image.digest mirror this, drift-checked). Upstream re-pushed the tag 2026-10-05; 1.31-alpine resolves to the same index digest. Re-resolved by `dfe-stack refresh-digests`.
      otel-collector: "sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6"       # otel/opentelemetry-collector-contrib:0.162.0 (both paths: dfe-docker DFE_OTEL_COLLECTOR_VERSION, and helm/charts/otel-collector values image.digest mirrors it, drift-checked). Resolved via buildx imagetools (manifest-list digest, multi-arch safe).
      git-sync: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"            # registry.k8s.io/git-sync/git-sync:v4.7.1 (k8s only; helm/charts/dfe-engine values huntRunner.gitSync.image.digest mirrors this, drift-checked). Manifest-LIST digest, so it is multi-arch safe. Resolved 2026-09-04 off the registry v2 API (registry.k8s.io redirects to the Artifact Registry mirrors; the same digest came back from australia-southeast1 and us-central1).
      busybox: "sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"             # docker.io/library/busybox:1.38.0 (k8s only; bootstrap/templates/local-path-helper-pod.yaml mirrors it, drift-checked). Index digest, read 2026-10-01 via `docker buildx imagetools inspect`; `latest` resolved to the same digest that day.
      forgejo: "sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1"             # code.forgejo.org/forgejo/forgejo:15.0.9 (k8s only; helm/charts/forgejo values image.digest mirrors it, drift-checked). Index digest, read via `docker buildx imagetools inspect`.
      valkey: "sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507"              # valkey/valkey:8.1.10-alpine (k8s only; bootstrap/templates/valkey.yaml mirrors it, drift-checked). Index digest, read via `docker buildx imagetools inspect`.
      local-path-provisioner: "sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f"  # docker.io/rancher/local-path-provisioner:v0.0.37 (k8s only; bootstrap.sh reads it at runtime and pins upstream's manifest with it). Index digest, read via `docker buildx imagetools inspect`.
      envoy-gateway-proxy: "sha256:dced08cf7c472e1a1d067f906878266078eeeb63c110b4961882c039a622853a" # docker.io/envoyproxy/envoy:distroless-v1.39.2 (k8s only; helm/edge/gateway values envoyGateway.proxy.image mirrors it, drift-checked). Index digest, read via `docker buildx imagetools inspect`; Envoy Gateway v1.9.2 compiles in the distroless-v1.39.1 one instead.

    # Content repos -- tagged in LOCKSTEP with this stack release (one name for
    # the whole set). PENDING entries have no release tag / published image yet;
    # the first release cut stamps them.
    content:
      dfe-schemas: "v0.2.8"              # baseline DDL; the dfe-schemas release engine v1.22.8 locks and applies at startup
      # renovate: datasource=github-tags depName=hyperi-io/dfe-deploy
      dfe-deploy: "v1.0.4"               # the deploy-repo template (seeded at this tag); the newest tag on the remote at this cut
      # A GIT REF, not a version: dfe-docker cuts no per-stack tag, so the
      # immutable record of what ran a stack is the commit. `dfe-stack cut`
      # re-resolves it from dfe-docker main.
      dfe-docker: "941f48961c41d2ada25f722442c6929493a8adc7"
      dfe-hyperdx: "v0.2.7"              # ghcr.io/hyperi-io/dfe-hyperdx@sha256:7989490936fee5dae750202d0027d6a5e3dae4e63521f19776997b995335496d (an engine token still pending a password change is refused, members read their own team, the restore surface is gated, and the node base is pinned by digest; upstream 2.36.0); deployment tag pin lives in the deploy repo values

    # Stage toolbox: the dfe-toolbox ops shell image family (docker/dfe-toolbox/),
    # NOT a component of the deployed stack -- an operator convenience
    # container. Built by .github/workflows/toolbox-build.yml to
    # ghcr.io/hyperi-io/dfe-toolbox-{base,aws,gcp,azure}. Every ARG default in
    # those Dockerfiles equals the matching pin here; check_versions_drift.py
    # holds the two together. clickhouse-client is NOT re-pinned here -- it
    # tracks services.clickhouse-version directly, so the two can never drift.
    toolbox:
      # renovate: datasource=docker depName=ghcr.io/hyperi-io/dfe-toolbox-base
      dfe-toolbox: "v1.0.2"              # the image family's own release tag (all four images move together). A published family tag never moves, so every input change ships under a new one. v1.0.2: kubectl, helm, argocd-cli, tofu, yq, aws-cli, gcloud and az-cli moved, and clickhouse-client with services.clickhouse-version; v1.0.1 stays published as it was.
      # renovate: datasource=docker depName=debian
      debian: "trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"  # dfe-toolbox-base's FROM (docker/dfe-toolbox/base/Dockerfile ARG DEBIAN_TAG, drift-checked). Debian 13.7: trixie-slim, 13.7-slim and trixie-20260918-slim share this index digest, pushed 2026-09-19 (Docker Hub tag API) and read 2026-10-01 via `docker buildx imagetools inspect`. Renovate moves the digest under the trixie-slim tag; a move changes the base image's inputs, so it ships under a bumped dfe-toolbox family tag.
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      kubectl: "v1.35.9"                 # 2026-09-23, verified by a HEAD on https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl. Deliberately the MIDDLE of platform.kubernetes's 1.34-1.36 window, not the 1.36 ceiling: kubectl's official skew policy supports a server up to 1 minor away either side, and 1.35 is within that of both 1.34 and 1.36 while 1.36 would be 2 minors from a 1.34 server. renovate.json holds Renovate to 1.35.x; move that rule with the window.
      # renovate: datasource=github-releases depName=helm/helm
      helm: "v4.3.0"                     # 2026-09-09, verified by a HEAD on https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz. Helm v3 and v4 are both still released; v4 was picked as the actively-developed line, and both read this stack's `apiVersion: v2` charts unchanged.
      # renovate: datasource=github-releases depName=argoproj/argo-cd
      argocd-cli: "v3.5.3"               # matches the ArgoCD APP version bootstrap.argocd's chart (10.9.6) deploys -- not the chart's own version number -- so the CLI never talks to a server outside its own supported skew. Released 2026-09-14. Coupled to that chart: a bump here moves only with the chart the bootstrap installs.
      # renovate: datasource=github-releases depName=opentofu/opentofu
      tofu: "1.12.7"                     # OpenTofu. 2026-10-01, verified via `gh api repos/opentofu/opentofu/releases`; fixes the SSH provisioner deadlock (CVE-2026-78662, CVE-2026-56855). Newest on the 1.12 line; 1.13 is out.
      # renovate: datasource=github-releases depName=mikefarah/yq
      yq: "v4.54.1"                      # mikefarah/yq, the Go binary -- NOT Debian's python3-yq apt package. 2026-09-29, verified via `gh api repos/mikefarah/yq/releases`.
      # renovate: datasource=github-tags depName=aws/aws-cli
      aws-cli: "2.37.9"                  # 2026-10-02. aws-cli publishes no GitHub Releases (tags only, so the annotation above reads tags); dated via the tag's own commit (`gh api repos/aws/aws-cli/commits/<sha>`). No LTS line.
      aws-session-manager-plugin: "1.2.835.0"  # AWS publishes only a floating "latest" URL per OS/arch -- no versioned download exists. This records the version `latest` resolved to when last verified (observed 2026-09-13; the artifact itself is dated 2026-06-17); docker/dfe-toolbox/aws/Dockerfile asserts the installed version still matches this pin and fails the build if AWS has moved `latest` again, which is what makes this pin worth having despite the URL floating under it. aws/session-manager-plugin GitHub releases are the version feed; the current stack's pin is the one Renovate watches.
      gcloud: "587.0.0"                  # google-cloud-cli. 2026-09-29 (Last-Modified on https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-587.0.0-linux-x86_64.tar.gz); 588.0.0 is not published. No LTS line; the SDK ships weekly. UNWATCHED by Renovate: the SDK ships off dl.google.com with no GitHub repo and no datasource Renovate carries, so this one moves by hand.
      # renovate: datasource=pypi depName=azure-cli
      az-cli: "2.91.0"                   # azure-cli. 2026-10-05, verified via `gh api repos/Azure/azure-cli/releases`; its bookworm .deb is on packages.microsoft.com for amd64 and arm64. Watched through PyPI rather than the GitHub tag, which is spelled `azure-cli-2.91.0` and does not compare against this value. Installed from Microsoft's apt repo pinned to the `bookworm` codename: packages.microsoft.com/repos/azure-cli has no `trixie` suite yet, and the bookworm build (a self-contained venv under /opt/az) installs and runs cleanly on trixie regardless.

    # Stack upgrade metadata for THIS version.
    stack:
      # Versions an environment may upgrade to THIS release from (verified paths).
      # Empty = first release under the graph model. Derived graph:
      # dfe-stack graph walks the `stacks:` keys + each stack's previous.
      previous: "2.2.0-rc.13"
      # Rollout order between component groups on a stack upgrade (lockstep does
      # not remove ordering -- schemas before the engine that expects them, data
      # plane before the UI that surfaces it).
      upgrade-order: "dfe-schemas, dfe-engine, data-plane, dfe-ui"

    # OpenTofu/Terraform provider constraints (pinned per-stack for a complete
    # manifest). These MIRROR the required_providers blocks under terraform/ --
    # keep them equal, the value here is a record, the module is what runs.
    providers:
      hashicorp-null: "~> 3.0"       # terraform/modules/tf-naming
      hashicorp-vault: "~> 5.0"      # terraform/modules/tf-iam, tf-secrets, environments/local
      hashicorp-random: "~> 3.6"     # terraform/modules/tf-secrets, secrets/aws-sm, environments/aws
      # The AWS deployment path: every capability module, the root that composes
      # them, and the one-shot root that creates the state bucket.
      hashicorp-aws: "~> 6.64"       # terraform/modules/{kubernetes-cluster/aws,managed-kafka/{msk,confluent-cloud,redpanda-cloud},secrets/aws-sm}, terraform/environments/{aws,aws-state}
      # The two SaaS Kafka modules each pair their own provider with aws, for
      # the private-link handshake's other end (see the module's versions.tf).
      confluentinc-confluent: "~> 2.86"  # terraform/modules/managed-kafka/confluent-cloud
      redpanda-data-redpanda: "~> 2.3"   # terraform/modules/managed-kafka/redpanda-cloud
      # Zips the broker-count autoscaler's inline Lambda source. Local-only,
      # no cloud API.
      hashicorp-archive: "~> 2.8"    # terraform/modules/managed-kafka/msk
      # The optional OIDC modules ship with no lock file, so the constraint is
      # the only ceiling a customer's `tofu init` has to resolve against.
      # okta 7.0.0 (2026-08-24, current major, GA waives the cooldown): none of
      # its breaking changes touch okta_app_oauth.
      okta-okta: "~> 7.0"            # terraform/modules/tf-oidc-okta
      # google 8.5.0 (2026-09-29, newest 8.x, GA waives the cooldown): the 8.0
      # upgrade guide changes neither service-account resource the module uses.
      hashicorp-google: "~> 8.5"     # terraform/modules/tf-oidc-google
      hashicorp-azuread: "~> 3.0"    # terraform/modules/tf-oidc-entra

  2.2.0:
    maturity: release
    support: standard
    constraints: "constraints/2.2.0.yaml"   # interdependency locks, checked by dfe-stack compat-check

    # What the cluster must already be. Floors, because the operator owns the cluster and upgrades it.
    # Keep every leaf a string: check_versions_drift.py skips a nested map without saying so.
    platform:
      # bootstrap/check_platform.py refuses below 1.34 and warns above 1.36, the newest minor tested.
      kubernetes: "1.34-1.36"
      # Checked when the server version carries +rke2. 1.37 waits on Rancher 2.16.
      rke2: ">=v1.34"
      # Declared, not checked -- nothing in a cluster reports the Rancher managing it.
      rancher: ">=2.15"
      eks: ">=1.34"

    # Installed by bootstrap.sh, which reads these through read_versions.py.
    bootstrap:
      cert-manager: "v1.21.2"        # 2026-09-11, K8s 1.33-1.36. Minors cannot be skipped. Upgrade with --reset-values --set crds.enabled=true; --reuse-values fails on this hop.
      external-secrets: "2.11.0"     # 2026-09-18, tested on K8s 1.36. Never downgrade to 0.x: it strands the generator CRDs.
      argocd: "10.9.6"               # chart 2026-10-01, Argo CD v3.5.3 (2026-09-14), K8s 1.33-1.36. --reuse-values fails across a chart hop; re-supply redis.enabled=false and externalRedis.host/port.
      # image: valkey/valkey
      valkey: "8.1.10-alpine"        # 2026-08-31, fixes GHSA-jcj7-v34w-v9vv. Held on the 8.1 line.
      # image: docker.io/rancher/local-path-provisioner
      local-path-provisioner: "v0.0.37"  # 2026-08-05. Only installed when the cluster has no default StorageClass; bootstrap/local_path_image.py pins the manifest's image by digest.
      metallb: "0.16.1"              # 2026-05-27. On-prem LoadBalancer when nothing else provides one (DFE_CLOUD=local). No LTS line.

    # Cluster addons and the data operators: Argo waves 2-3 (appsets/layer1-addons.yaml, layer-scale.yaml).
    operators:
      envoy-gateway: "v1.9.2"        # 2026-09-28, fixes GHSA-gmx8-fhfh-mgjx. Runs on chart defaults, so upgrade with --reset-values.
      external-dns: "1.23.0"         # chart 2026-09-30, app v0.23.0. layer1-addons.yaml holds annotationPrefix at external-dns.alpha.kubernetes.io/ so existing records survive.
      keda: "2.21.0"                 # 2026-09-23, fixes GHSA-637c-6jxx-4rwm. K8s 1.34-1.36.
      metrics-server: "3.14.0"       # 2026-08-19, app v0.9.0.
      reloader: "2.2.18"             # 2026-09-30, app v1.4.22.
      strimzi-kafka-operator: "1.2.0"  # 2026-08-20. Needed for Kafka 4.3.1. A 0.51 cluster must convert its v1beta2 resources (v1-api-conversion.sh convert-resource, then crd-upgrade) before upgrading; dfe-ops refuses to deploy over a CRD still stored at v1beta2.
      clickhouse-operator: "0.0.8"   # 2026-09-25, ghcr.io/clickhouse/clickhouse-operator-helm@sha256:61d97bb43a16859f485af1099251fc591b527a4c01013e6de355be11a80fbc9c. ClickHouse Inc's own operator, scale profile only; Altinity's is untested with DFE. See docs/deployment/clickhouse.md.
      redpanda-operator: "26.2.4"    # 2026-09-24. Installed only when provider=redpanda and acceptLicense=true (BSL). Moves with services.redpanda-version.
      # renovate: datasource=github-releases depName=kubernetes-sigs/aws-load-balancer-controller
      aws-load-balancer-controller: "3.6.0"  # 2026-10-05. AWS only. Its CRDs ship in the chart.
      # renovate: datasource=github-releases depName=aws/karpenter-provider-aws
      karpenter: "1.14.1"            # 2026-08-21, LTS. AWS only, OCI chart from public.ecr.aws/karpenter. helm/charts/karpenter-pools is checked against this release's CRDs, so they move together.
      # renovate: datasource=github-releases depName=awslabs/amazon-eks-ami
      karpenter-al2023-ami: "v20260930"  # 2026-10-01. helm/charts/karpenter-pools uses it as the EC2NodeClass alias al2023@v20260930.

    # Datastores, brokers and telemetry: Argo waves 4-5 (appsets/layer2-data.yaml).
    services:
      postgresql: "17"               # The major of FerretDB's DocumentDB backend; moves with documentdb-pg. Only read to install a matching psql in the AWS toolbox.
      # image: apache/kafka rejects=apache/kafka-native
      # The version moves by hand with Strimzi; refresh-digests moves the digest.
      kafka-version: "4.3.1"         # 2026-06-23. The newest Kafka Strimzi 1.2.0 runs, and its default. Docker and k8s run the same version.
      kafka-replicas: "3"            # cluster mode default
      # image: docker.redpanda.com/redpandadata/redpanda aliases=redpandadata/redpanda
      # The version moves by hand with the operator; refresh-digests moves the digest.
      redpanda-version: "v26.2.3"    # 2026-09-17, the broker operator chart 26.2.4 ships with. dfe-loader's dev compose and PGO script use the same tag. The cluster-mode CR takes a bare tag, no digest.
      # image: clickhouse/clickhouse-server
      # The version moves by hand with the operator; refresh-digests moves the digest.
      clickhouse-version: "26.3.42.3"  # v26.3.42.3-lts, 2026-10-05. The 26.3 LTS line is supported to about 2027-03. Docker tags drop the -lts suffix.
      # image: docker.io/clickhouse/clickhouse-keeper
      # Moves with clickhouse-version (constraints rule clickhouse-keeper-server-pairing).
      clickhouse-keeper: "26.3.42.3"  # Same release as the server.
      clickhouse-replicas: "1"       # default; the scale profile sets 3
      # renovate: datasource=docker depName=ghcr.io/ferretdb/ferretdb
      ferretdb: "2.7.0"              # 2025-11-10. Needs the DocumentDB backend; 1.x to 2.x is a dump and restore.
      # renovate: datasource=docker depName=ghcr.io/ferretdb/postgres-documentdb
      documentdb-pg: "17-0.107.0-ferretdb-2.7.0"  # The newest PostgreSQL 17 build for FerretDB 2.7.0. FerretDB ships no 18 build yet.
      # image: code.forgejo.org/forgejo/forgejo
      forgejo: "15.0.9"              # 2026-09-17, v15 LTS, supported to 2027-07; fixes remote code execution. The bundled deploy repo, used only when no GitHub or GitLab is supplied. Pull from code.forgejo.org, not codeberg.org.
      # renovate: datasource=docker depName=otel/opentelemetry-collector-contrib
      otel-collector: "0.162.0"      # 2026-09-29. Both rendered collector configs pass otelcol validate on it.
      hyperdx: "2.36.0"              # The upstream HyperDX release our fork tracks; the image is content.dfe-hyperdx.
      # renovate: datasource=docker depName=ghcr.io/kafbat/kafka-ui
      kafbat: "v1.5.0"               # 2026-04-20. Kafka web UI, behind DFE sign-in.
      # renovate: datasource=docker depName=envoyproxy/envoy
      envoy-proxy: "v1.39.2"         # 2026-10-01, fixes CVE-2026-35189. The docker stack's front proxy. Ubuntu build, not distroless: the compose healthcheck needs bash.
      # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
      nginx-unprivileged: "1.31.6-alpine"  # 2026-09-15. Serves the k8s links page and the Cruise Control UI. Upstream rebuilds tags in place, so the digest is what pins it.
      # renovate: datasource=docker depName=registry.k8s.io/git-sync/git-sync
      git-sync: "v4.7.1"             # 2026-07-16. Pulls the deploy repo's hunts and rules into the hunt runner pod.
      # renovate: datasource=github-releases depName=aws/aws-msk-iam-auth
      aws-msk-iam-auth: "2.3.9"      # 2026-09-24. A jar, not an image: the MSK bootstrap Job downloads it and checks its sha256.
      # renovate: datasource=github-releases depName=linkedin/cruise-control-ui
      cruise-control-ui: "0.4.0"     # 2022-05-27, unmaintained (last commit 2024-08). A tarball, not an image: the chart serves it from nginx-unprivileged and checks its sha256.
      # renovate: datasource=docker depName=docker.io/library/busybox
      busybox: "1.38.0"              # 2026-05-13. The local-path-provisioner helper pod, which upstream leaves untagged. Re-diff bootstrap/templates/local-path-helper-pod.yaml against upstream when local-path-provisioner moves.
      # image: docker.io/envoyproxy/envoy
      # Moves with operators.envoy-gateway (constraints rule envoy-gateway-proxy-pairing).
      envoy-gateway-proxy: "distroless-v1.39.2"  # 2026-10-01, fixes CVE-2026-35189. Replaces the distroless-v1.39.1 that Envoy Gateway v1.9.2 defaults to.

    # DFE apps: Argo wave 5 (appsets/layer2-apps.yaml). Each has its own release line on GHCR.
    # check_versions_drift.py holds each chart's appVersion to its pin.
    apps:
      dfe-engine: "v1.22.14"        # 2026-10-06. scalo-py 2.31.1, dfe-schemas 0.2.9. Apply Defaults changes the deployed tables, and drift reads them.
      dfe-ui: "v1.7.6"              # 2026-10-06. Defaults drift and Apply Defaults, the services feature removed, and the source view fixes.
      dfe-receiver: "v1.15.42"      # 2026-10-06. scalo-rs 2.14.1, PGO+BOLT, amd64 and arm64.
      dfe-loader: "v1.18.46"        # 2026-10-06. scalo-rs 2.14.1, PGO+BOLT, amd64 and arm64. reqwest stays on 0.12 (dfe-loader#240).
      dfe-archiver: "v1.7.28"       # 2026-10-06. scalo-rs 2.14.1, PGO+BOLT, amd64 and arm64.
      dfe-fetcher: "v1.4.32"        # 2026-10-06. scalo-rs 2.14.1, PGO+BOLT, amd64 and arm64.
      dfe-transform-vrl: "v1.1.30"   # 2026-10-06. scalo-rs 2.14.1, PGO+BOLT, amd64 and arm64.
      dfe-transform-vector: "v1.0.45"  # 2026-10-06. scalo-rs 2.14.1, PGO+BOLT, amd64 and arm64.
      dfe-transform-elastic: "v1.1.9" # 2026-10-06. scalo-rs 2.14.1, PGO+BOLT, amd64 and arm64. Idle until a source names it.
      # Alpha and unpublished. A commented pin is read by nothing.
      # dfe-transform-wasm: "2.2.0"
      # dfe-transform-splack: "2.2.0"
      # The edge-fleet VPN, opt in per deployment (helm/charts/culvert). A public Apache-2.0 repo.
      culvert: "v2.1.17"            # 2026-10-06. scalo-py 2.31.1, wstunnel 10.7.1.

    # The immutable half of each app's tag@sha256 pin, always the multi-arch index digest.
    # An app with no digest here is unpublished and left out of rendered manifests.
    digests:
      dfe-engine: "sha256:36f4e647053f3ddb6f1997bbbb6e99aaf6dc467ae09c7282639e7d1bc4c50044"
      dfe-ui: "sha256:b152f9564b3a92f8379efc8c957dfbaa165b9f8995f2a8d8db2fbf87a6de8bb9"
      dfe-receiver: "sha256:6b2da2ebe3b6ab0d38b6da8ac8709228bdd9a6e5af0f5f1cc2c855053078f6ae"
      dfe-loader: "sha256:e5138a95c5714cc3cd9895f026db36ceb7908d5f58214c6f6f0bd9e9cf1b682a"
      dfe-archiver: "sha256:7293f3601aaac634ff187c50e47ed337f38c5eaa4134c067654527fc86e47458"
      dfe-fetcher: "sha256:1cb24225a027aa06f9fb08289f8df4567e3202bd9c89fb789706c7d7d028bf7d"
      dfe-transform-vrl: "sha256:07455044dad76fbe7e2e305ea44d2ba071abd7f314f44f230568095c48df562e"
      dfe-transform-vector: "sha256:baa9ccb150a743c2a0cac08d0fa2172a3238f51e980dea2e6de616be215572b1"
      dfe-transform-elastic: "sha256:60e0d6891283137d024a99434c4c4231e6271925d460247c0b78b0421151ada4"
      dfe-hyperdx: "sha256:9ddfc727828b8b97e3aff347c22083a20e317adfa7c5621ec2c563e3b1a79ae6"
      culvert: "sha256:6a791a4ba432e03a896a9c503be17f15facae1b49cb5eebf50cb416c8a4711df"
      # Tagged by toolbox.dfe-toolbox.
      dfe-toolbox-base: "sha256:250999940ec42da4bee512f1d122a613ad2962bf1a7ecdc5a21d5bb50716d0f2"

    # Digests for the third-party images, keyed like their version under services: or bootstrap:.
    # Index digests, so multi-arch safe. On k8s the cluster-mode Redpanda CR and Strimzi's broker deploy by tag.
    services-digests:
      clickhouse-version: "sha256:21d572843e59539c7d100286b6f5a6053c341fe4b33c2d7b74b1ff7cb24c5399"  # clickhouse/clickhouse-server:26.3.42.3
      clickhouse-keeper: "sha256:8361ed78996d087f3e85622566f15517c502e169a63e70b44dafe6ddca6dd3f5"   # docker.io/clickhouse/clickhouse-keeper:26.3.42.3
      kafka-version: "sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"       # apache/kafka:4.3.1
      redpanda-version: "sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9"    # docker.redpanda.com/redpandadata/redpanda:v26.2.3
      kafbat: "sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1"              # ghcr.io/kafbat/kafka-ui:v1.5.0
      ferretdb: "sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985"            # ghcr.io/ferretdb/ferretdb:2.7.0
      documentdb-pg: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"       # ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
      envoy-proxy: "sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85"         # envoyproxy/envoy:v1.39.2
      nginx-unprivileged: "sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083"   # nginxinc/nginx-unprivileged:1.31.6-alpine
      otel-collector: "sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6"       # otel/opentelemetry-collector-contrib:0.162.0
      git-sync: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"            # registry.k8s.io/git-sync/git-sync:v4.7.1
      busybox: "sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"             # docker.io/library/busybox:1.38.0
      forgejo: "sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1"             # code.forgejo.org/forgejo/forgejo:15.0.9
      valkey: "sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507"              # valkey/valkey:8.1.10-alpine
      local-path-provisioner: "sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f"  # docker.io/rancher/local-path-provisioner:v0.0.37
      envoy-gateway-proxy: "sha256:dced08cf7c472e1a1d067f906878266078eeeb63c110b4961882c039a622853a" # docker.io/envoyproxy/envoy:distroless-v1.39.2

    # Content repos, tagged with this stack.
    content:
      dfe-schemas: "v0.2.9"              # 2026-10-06. The engine applies it at startup.
      # renovate: datasource=github-tags depName=hyperi-io/dfe-deploy
      dfe-deploy: "v1.0.7"               # The deploy-repo template, seeded from this tag.
      # A commit, not a version: dfe-docker cuts no per-stack tag.
      dfe-docker: "2105701a016839862dae3c17012801048486caf5"
      dfe-hyperdx: "v0.2.8"              # 2026-09-29, amd64 and arm64.

    # The dfe-toolbox operator shell images (docker/dfe-toolbox/), not part of the deployed stack.
    # Each Dockerfile ARG default equals its pin here (drift-checked). clickhouse-client follows services.clickhouse-version.
    toolbox:
      # renovate: datasource=docker depName=ghcr.io/hyperi-io/dfe-toolbox-base
      dfe-toolbox: "v1.0.2"              # The family tag for all four images. A published tag never moves, so any input change ships under a new one.
      # renovate: datasource=docker depName=debian
      debian: "trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"  # Debian 13.7, pushed 2026-09-19.
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      kubectl: "v1.35.9"                 # 2026-09-23. The middle of the platform window, so within kubectl's one-minor skew of both 1.34 and 1.36. renovate.json holds it to 1.35.x.
      # renovate: datasource=github-releases depName=helm/helm
      helm: "v4.3.0"                     # 2026-09-09.
      # renovate: datasource=github-releases depName=argoproj/argo-cd
      argocd-cli: "v3.5.3"               # 2026-09-14. Matches the Argo CD that bootstrap.argocd installs.
      # renovate: datasource=github-releases depName=opentofu/opentofu
      tofu: "1.12.7"                     # 2026-10-01, fixes CVE-2026-78662 and CVE-2026-56855.
      # renovate: datasource=github-releases depName=mikefarah/yq
      yq: "v4.54.1"                      # 2026-09-29. mikefarah/yq, not Debian's python3-yq.
      # renovate: datasource=github-tags depName=aws/aws-cli
      aws-cli: "2.37.9"                  # 2026-10-02.
      aws-session-manager-plugin: "1.2.835.0"  # The download is a floating latest, so the aws Dockerfile fails the build when latest stops matching this. aws/session-manager-plugin GitHub releases are the version feed.
      gcloud: "587.0.0"                  # 2026-09-29. No Renovate feed; moves by hand.
      # renovate: datasource=pypi depName=azure-cli
      az-cli: "2.91.0"                   # 2026-10-05. From Microsoft's bookworm apt repo, which installs on trixie; there is no trixie suite yet.

    stack:
      # The release an environment upgrades to this one from.
      previous: "2.2.0-rc.14"
      # Rollout order between component groups on an upgrade.
      upgrade-order: "dfe-schemas, dfe-engine, data-plane, dfe-ui"

    # OpenTofu provider constraints. They mirror required_providers under terraform/, which is what runs.
    providers:
      hashicorp-null: "~> 3.0"       # terraform/modules/tf-naming
      hashicorp-vault: "~> 5.0"      # terraform/modules/tf-iam, tf-secrets, environments/local
      hashicorp-random: "~> 3.6"     # terraform/modules/tf-secrets, secrets/aws-sm, environments/aws
      hashicorp-aws: "~> 6.64"       # terraform/modules/{kubernetes-cluster/aws,managed-kafka/{msk,confluent-cloud,redpanda-cloud},secrets/aws-sm}, terraform/environments/{aws,aws-state}
      confluentinc-confluent: "~> 2.86"  # terraform/modules/managed-kafka/confluent-cloud
      redpanda-data-redpanda: "~> 2.3"   # terraform/modules/managed-kafka/redpanda-cloud
      hashicorp-archive: "~> 2.8"    # terraform/modules/managed-kafka/msk, for the broker autoscaler's Lambda
      # The OIDC modules ship no lock file, so these are a customer's only ceiling.
      okta-okta: "~> 7.0"            # terraform/modules/tf-oidc-okta. 7.0.0, 2026-08-24.
      hashicorp-google: "~> 8.5"     # terraform/modules/tf-oidc-google. 8.5.0, 2026-09-29.
      hashicorp-azuread: "~> 3.0"    # terraform/modules/tf-oidc-entra

  2.2.1-rc.1:
    maturity: rc
    support: standard
    constraints: "constraints/2.2.1-rc.1.yaml"   # interdependency locks, checked by dfe-stack compat-check

    # What the cluster must already be. Floors, because the operator owns the cluster and upgrades it.
    # Keep every leaf a string: check_versions_drift.py skips a nested map without saying so.
    platform:
      # bootstrap/check_platform.py refuses below 1.34 and warns above 1.36, the newest minor tested.
      kubernetes: "1.34-1.36"
      # Checked when the server version carries +rke2. 1.37 waits on Rancher 2.16.
      rke2: ">=v1.34"
      # Declared, not checked -- nothing in a cluster reports the Rancher managing it.
      rancher: ">=2.15"
      eks: ">=1.34"

    # Installed by bootstrap.sh, which reads these through read_versions.py.
    bootstrap:
      cert-manager: "v1.21.2"        # 2026-09-11, K8s 1.33-1.36. Minors cannot be skipped. Upgrade with --reset-values --set crds.enabled=true; --reuse-values fails on this hop.
      external-secrets: "2.11.0"     # 2026-09-18, tested on K8s 1.36. Never downgrade to 0.x: it strands the generator CRDs.
      argocd: "10.10.0"              # chart 2026-10-07, Argo CD v3.5.4 (2026-10-06), K8s 1.33-1.36. The highest chart on v3.5.4: 10.9.7 carries the same app, and 10.10.0 adds only server.enabled (default true) and a redis-ha exporter bump. --reuse-values fails across a chart hop; re-supply redis.enabled=false and externalRedis.host/port.
      # image: valkey/valkey
      valkey: "8.1.10-alpine"        # 2026-08-31, fixes GHSA-jcj7-v34w-v9vv. Held on the 8.1 line.
      # image: docker.io/rancher/local-path-provisioner
      local-path-provisioner: "v0.0.37"  # 2026-08-05. Only installed when the cluster has no default StorageClass; bootstrap/local_path_image.py pins the manifest's image by digest.
      metallb: "0.16.1"              # 2026-05-27. On-prem LoadBalancer when nothing else provides one (DFE_CLOUD=local). No LTS line.

    # Cluster addons and the data operators: Argo waves 2-3 (appsets/layer1-addons.yaml, layer-scale.yaml).
    operators:
      envoy-gateway: "v1.9.2"        # 2026-09-28, fixes GHSA-gmx8-fhfh-mgjx. Runs on chart defaults, so upgrade with --reset-values.
      external-dns: "1.23.0"         # chart 2026-09-30, app v0.23.0. layer1-addons.yaml holds annotationPrefix at external-dns.alpha.kubernetes.io/ so existing records survive.
      keda: "2.21.0"                 # 2026-09-23, fixes GHSA-637c-6jxx-4rwm. K8s 1.34-1.36.
      metrics-server: "3.14.0"       # 2026-08-19, app v0.9.0.
      reloader: "2.2.18"             # 2026-09-30, app v1.4.22.
      strimzi-kafka-operator: "1.2.0"  # 2026-08-20. Needed for Kafka 4.3.1. A 0.51 cluster must convert its v1beta2 resources (v1-api-conversion.sh convert-resource, then crd-upgrade) before upgrading; dfe-ops refuses to deploy over a CRD still stored at v1beta2.
      clickhouse-operator: "0.0.8"   # 2026-09-25, ghcr.io/clickhouse/clickhouse-operator-helm@sha256:61d97bb43a16859f485af1099251fc591b527a4c01013e6de355be11a80fbc9c. ClickHouse Inc's own operator, scale profile only; Altinity's is untested with DFE. See docs/deployment/clickhouse.md.
      redpanda-operator: "26.2.4"    # 2026-09-24. Installed only when provider=redpanda and acceptLicense=true (BSL). Moves with services.redpanda-version.
      # renovate: datasource=github-releases depName=kubernetes-sigs/aws-load-balancer-controller
      aws-load-balancer-controller: "3.6.0"  # 2026-10-05. AWS only. Its CRDs ship in the chart.
      # renovate: datasource=github-releases depName=aws/karpenter-provider-aws
      karpenter: "1.14.1"            # 2026-08-21, LTS. AWS only, OCI chart from public.ecr.aws/karpenter. helm/charts/karpenter-pools is checked against this release's CRDs, so they move together.
      # renovate: datasource=github-releases depName=awslabs/amazon-eks-ami
      karpenter-al2023-ami: "v20260930"  # 2026-10-01. helm/charts/karpenter-pools uses it as the EC2NodeClass alias al2023@v20260930.

    # Datastores, brokers and telemetry: Argo waves 4-5 (appsets/layer2-data.yaml).
    services:
      postgresql: "17"               # The major of FerretDB's DocumentDB backend; moves with documentdb-pg. Only read to install a matching psql in the AWS toolbox.
      # image: apache/kafka rejects=apache/kafka-native
      # The version moves by hand with Strimzi; refresh-digests moves the digest.
      kafka-version: "4.3.1"         # 2026-06-23. The newest Kafka Strimzi 1.2.0 runs, and its default. Docker and k8s run the same version.
      kafka-replicas: "3"            # cluster mode default
      # image: docker.redpanda.com/redpandadata/redpanda aliases=redpandadata/redpanda
      # The version moves by hand with the operator; refresh-digests moves the digest.
      redpanda-version: "v26.2.3"    # 2026-09-17, the broker operator chart 26.2.4 ships with. dfe-loader's dev compose and PGO script use the same tag. The cluster-mode CR takes a bare tag, no digest.
      # image: clickhouse/clickhouse-server
      # The version moves by hand with the operator; refresh-digests moves the digest.
      clickhouse-version: "26.3.42.3"  # v26.3.42.3-lts, 2026-10-05. The 26.3 LTS line is supported to about 2027-03. Docker tags drop the -lts suffix.
      # image: docker.io/clickhouse/clickhouse-keeper
      # Moves with clickhouse-version (constraints rule clickhouse-keeper-server-pairing).
      clickhouse-keeper: "26.3.42.3"  # Same release as the server.
      clickhouse-replicas: "1"       # default; the scale profile sets 3
      # renovate: datasource=docker depName=ghcr.io/ferretdb/ferretdb
      ferretdb: "2.7.0"              # 2025-11-10. Needs the DocumentDB backend; 1.x to 2.x is a dump and restore.
      # renovate: datasource=docker depName=ghcr.io/ferretdb/postgres-documentdb
      documentdb-pg: "17-0.107.0-ferretdb-2.7.0"  # The newest PostgreSQL 17 build for FerretDB 2.7.0. FerretDB ships no 18 build yet.
      # image: code.forgejo.org/forgejo/forgejo
      forgejo: "15.0.9"              # 2026-09-17, v15 LTS, supported to 2027-07; fixes remote code execution. The bundled deploy repo, used only when no GitHub or GitLab is supplied. Pull from code.forgejo.org, not codeberg.org.
      # renovate: datasource=docker depName=otel/opentelemetry-collector-contrib
      otel-collector: "0.162.0"      # 2026-09-29. Both rendered collector configs pass otelcol validate on it.
      hyperdx: "2.40.0"              # The upstream HyperDX release dfe-hyperdx v0.3.1 merges, its packages/app version. The image is content.dfe-hyperdx.
      # renovate: datasource=docker depName=ghcr.io/kafbat/kafka-ui
      kafbat: "v1.5.0"               # 2026-04-20. Kafka web UI, behind DFE sign-in.
      # renovate: datasource=docker depName=envoyproxy/envoy
      envoy-proxy: "v1.39.2"         # 2026-10-01, fixes CVE-2026-35189. The docker stack's front proxy. Ubuntu build, not distroless: the compose healthcheck needs bash.
      # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
      nginx-unprivileged: "1.31.6-alpine"  # 2026-09-15. Serves the k8s links page and the Cruise Control UI. Upstream rebuilds tags in place, so the digest is what pins it.
      # renovate: datasource=docker depName=registry.k8s.io/git-sync/git-sync
      git-sync: "v4.7.1"             # 2026-07-16. Pulls the deploy repo's hunts and rules into the hunt runner pod.
      # renovate: datasource=github-releases depName=aws/aws-msk-iam-auth
      aws-msk-iam-auth: "2.3.9"      # 2026-09-24. A jar, not an image: the MSK bootstrap Job downloads it and checks its sha256.
      # renovate: datasource=github-releases depName=linkedin/cruise-control-ui
      cruise-control-ui: "0.4.0"     # 2022-05-27, unmaintained (last commit 2024-08). A tarball, not an image: the chart serves it from nginx-unprivileged and checks its sha256.
      # renovate: datasource=docker depName=docker.io/library/busybox
      busybox: "1.38.0"              # 2026-05-13. The local-path-provisioner helper pod, which upstream leaves untagged. Re-diff bootstrap/templates/local-path-helper-pod.yaml against upstream when local-path-provisioner moves.
      # image: docker.io/envoyproxy/envoy
      # Moves with operators.envoy-gateway (constraints rule envoy-gateway-proxy-pairing).
      envoy-gateway-proxy: "distroless-v1.39.2"  # 2026-10-01, fixes CVE-2026-35189. Replaces the distroless-v1.39.1 that Envoy Gateway v1.9.2 defaults to.

    # DFE apps: Argo wave 5 (appsets/layer2-apps.yaml). Each has its own release line on GHCR.
    # check_versions_drift.py holds each chart's appVersion to its pin.
    apps:
      dfe-engine: "v1.22.16"        # 2026-10-09, amd64 and arm64. The image thin chart 1.22.16 pins. Writes the thin-chart overlay keys (dfe-engine#773).
      dfe-ui: "v1.7.7"              # 2026-10-09, amd64 and arm64. The image thin chart 1.7.7 pins.
      dfe-receiver: "v1.15.43"      # 2026-10-09, amd64 and arm64. The image thin chart 1.15.43 pins.
      dfe-loader: "v1.18.47"        # 2026-10-09, amd64 and arm64. The image thin chart 1.18.47 pins. reqwest stays on 0.12 (dfe-loader#240).
      dfe-archiver: "v1.7.29"       # 2026-10-09, amd64 and arm64. The image thin chart 1.7.29 pins.
      dfe-fetcher: "v1.4.33"        # 2026-10-09, amd64 and arm64. The image thin chart 1.4.33 pins.
      dfe-transform-vrl: "v1.1.31"   # 2026-10-09, amd64 and arm64. The image thin chart 1.1.31 pins.
      dfe-transform-vector: "v1.0.46"  # 2026-10-09, amd64 and arm64. The image thin chart 1.0.46 pins.
      dfe-transform-elastic: "v1.1.10" # 2026-10-09, amd64 and arm64. The image thin chart 1.1.10 pins. Idle until a source names it.
      # Alpha and unpublished. A commented pin is read by nothing.
      # dfe-transform-wasm: "2.2.0"
      # dfe-transform-splack: "2.2.0"
      # The edge-fleet VPN, opt in per deployment (helm/edge/culvert). A public Apache-2.0 repo.
      culvert: "v2.1.18"            # 2026-10-09, amd64 and arm64. The image thin chart 2.1.18 pins.

    # The immutable half of each app's tag@sha256 pin, always the multi-arch index digest.
    # An app with no digest here is unpublished and left out of rendered manifests.
    digests:
      dfe-engine: "sha256:7ab69a428c7c0d8b9ad647891dbba27067c5b63853a2ece97f02a976a68c2b58"
      dfe-ui: "sha256:76633eb720e127ed170fa94fba848441164d3424a2eb2a51eb2fd91c1481eb82"
      dfe-receiver: "sha256:2729443b687bdce058fbfd77fad9eb07573267f260215ea44f807115347b729b"
      dfe-loader: "sha256:f764250959c84ac5744744f5c8a973c2ed6bee7049762632a0150fd6cf5b9ea7"
      dfe-archiver: "sha256:01c44c367cac8a1b24b6ca4b58c2dba46ab6c947e4d5123298ef0bb3f35ec9eb"
      dfe-fetcher: "sha256:cdd45e404e75b5a42faca89fc9b30424894904535376909a8e1f2ffaf4dcb856"
      dfe-transform-vrl: "sha256:41b035383ed29f9fadc46f638b94d6c2eda1a29f03d85ce3d91acf26f149e5ae"
      dfe-transform-vector: "sha256:b79bebc159c1de416fb579d02949c0145139dac26c16b362b71bbfe8076ddee6"
      dfe-transform-elastic: "sha256:0776f6546d4cf49b9270c5c86b04ab53b38e1a9380075c0629adbde171dc831c"
      dfe-hyperdx: "sha256:1317906009657449448c4397dbd974ee14ea6cf6e481cbb6a43d58f4877d7f17"
      culvert: "sha256:27666a427c2cf66d8a327874782bb47b108afebbb8c699f76155557bf4598a6e"
      # Tagged by toolbox.dfe-toolbox.
      dfe-toolbox-base: "sha256:056ab60643f2a0814f3e4baacca2534ac852367e15ba22665caa869c043dcc4b"

    # Each component's thin chart, assembled from its deployment contract, by manifest digest and
    # keyed by deploy.service. The layer 2 appsets carry a literal copy (check_versions_drift.py),
    # and refuse to render a service whose entry is not a sha256 digest: "unpublished" marks a chart
    # not published yet. The chart version is the app tag without its v, so it has no key here.
    chart-digests:
      culvert: "sha256:32b71c5730a29721ad34907148c39949bc766cf3ce46e775acc8bd57587ac92c"                # 2.1.18
      dfe-archiver: "sha256:90f7d9ec8cddb4d18c41caca5e38ab21a96be7159ddceb1fa2899bb726da5aae"           # 1.7.29
      dfe-engine: "sha256:a7482652b4dc4c1ad5268127edb81fd87bd6308ca5117d77d301b5e467d54f57"             # 1.22.16
      dfe-fetcher: "sha256:17b44639cd741115bd8f287b3b959ac86133b7f8fc14e8e1ee389a4856b1235f"            # 1.4.33
      dfe-loader: "sha256:d08d0416925e7322b4580d54f5226cce340a77c150e39845efe3e2ac910875b3"             # 1.18.47
      dfe-receiver: "sha256:11a8972d1681aa46a07c1e516c7733a6f1d3688462da33f3c36866ba2ffc46d9"           # 1.15.43
      dfe-transform-elastic: "sha256:85af7d98187c9fc8a82adb05fbc827316f59e1a795e9b649e44f5aa41036a752"  # 1.1.10
      dfe-transform-vector: "sha256:124db1bada639381231806a882b525388ec61837c02c85dfb8329b60b3856104"   # 1.0.46
      dfe-transform-vrl: "sha256:f04ff3cee742d4c3c0f3a33127bc2addd309b89ca87ab151ff0fa517c2849881"      # 1.1.31
      dfe-ui: "sha256:58adaa98e3d8840a5e81a66b9bef20ff7518e17c5394f6dea11e72b8dff0458c"                 # 1.7.7
      hyperdx: "sha256:5a11ced9e1d7778ec87e01b3f247cd5b853774cb8ae0823f4195738b238a0d80"                # 0.3.1

    # Digests for the third-party images, keyed like their version under services: or bootstrap:.
    # Index digests, so multi-arch safe. On k8s the cluster-mode Redpanda CR and Strimzi's broker deploy by tag.
    services-digests:
      clickhouse-version: "sha256:21d572843e59539c7d100286b6f5a6053c341fe4b33c2d7b74b1ff7cb24c5399"  # clickhouse/clickhouse-server:26.3.42.3
      clickhouse-keeper: "sha256:8361ed78996d087f3e85622566f15517c502e169a63e70b44dafe6ddca6dd3f5"   # docker.io/clickhouse/clickhouse-keeper:26.3.42.3
      kafka-version: "sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"       # apache/kafka:4.3.1
      redpanda-version: "sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9"    # docker.redpanda.com/redpandadata/redpanda:v26.2.3
      kafbat: "sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1"              # ghcr.io/kafbat/kafka-ui:v1.5.0
      ferretdb: "sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985"            # ghcr.io/ferretdb/ferretdb:2.7.0
      documentdb-pg: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"       # ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
      envoy-proxy: "sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85"         # envoyproxy/envoy:v1.39.2
      nginx-unprivileged: "sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083"   # nginxinc/nginx-unprivileged:1.31.6-alpine
      otel-collector: "sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6"       # otel/opentelemetry-collector-contrib:0.162.0
      git-sync: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"            # registry.k8s.io/git-sync/git-sync:v4.7.1
      busybox: "sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"             # docker.io/library/busybox:1.38.0
      forgejo: "sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1"             # code.forgejo.org/forgejo/forgejo:15.0.9
      valkey: "sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507"              # valkey/valkey:8.1.10-alpine
      local-path-provisioner: "sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f"  # docker.io/rancher/local-path-provisioner:v0.0.37
      envoy-gateway-proxy: "sha256:dced08cf7c472e1a1d067f906878266078eeeb63c110b4961882c039a622853a" # docker.io/envoyproxy/envoy:distroless-v1.39.2

    # Content repos, tagged with this stack.
    content:
      dfe-schemas: "v0.2.9"              # 2026-10-06. The engine applies it at startup.
      # renovate: datasource=github-tags depName=hyperi-io/dfe-deploy
      dfe-deploy: "v1.0.7"               # The deploy-repo template, seeded from this tag.
      # A commit, not a version: dfe-docker cuts no per-stack tag.
      dfe-docker: "2105701a016839862dae3c17012801048486caf5"
      dfe-hyperdx: "v0.3.1"              # 2026-10-09, amd64 and arm64. The image thin chart 0.3.1 pins.

    # The dfe-toolbox operator shell images (docker/dfe-toolbox/), not part of the deployed stack.
    # Each Dockerfile ARG default equals its pin here (drift-checked). clickhouse-client follows services.clickhouse-version.
    toolbox:
      # renovate: datasource=docker depName=ghcr.io/hyperi-io/dfe-toolbox-base
      dfe-toolbox: "v1.0.3"              # The family tag for all four images. A published tag never moves, so any input change ships under a new one. v1.0.3 carries argocd-cli v3.5.4; v1.0.2 stays published as it was.
      # renovate: datasource=docker depName=debian
      debian: "trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"  # Debian 13.7, pushed 2026-09-19.
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      kubectl: "v1.35.9"                 # 2026-09-23. The middle of the platform window, so within kubectl's one-minor skew of both 1.34 and 1.36. renovate.json holds it to 1.35.x.
      # renovate: datasource=github-releases depName=helm/helm
      helm: "v4.3.0"                     # 2026-09-09.
      # renovate: datasource=github-releases depName=argoproj/argo-cd
      argocd-cli: "v3.5.4"               # 2026-10-06. Matches the Argo CD that bootstrap.argocd installs.
      # renovate: datasource=github-releases depName=opentofu/opentofu
      tofu: "1.12.7"                     # 2026-10-01, fixes CVE-2026-78662 and CVE-2026-56855.
      # renovate: datasource=github-releases depName=mikefarah/yq
      yq: "v4.54.1"                      # 2026-09-29. mikefarah/yq, not Debian's python3-yq.
      # renovate: datasource=github-tags depName=aws/aws-cli
      aws-cli: "2.37.9"                  # 2026-10-02.
      # renovate: datasource=github-releases depName=aws/session-manager-plugin
      aws-session-manager-plugin: "1.2.889.0"  # Observed 2026-10-10 as what latest serves on amd64 and arm64. The download is a floating latest, so the aws Dockerfile fails the build when latest stops matching this. Renovate watches the GitHub releases, which can land minutes before latest moves.
      gcloud: "587.0.0"                  # 2026-09-29. No Renovate feed; moves by hand.
      # renovate: datasource=pypi depName=azure-cli
      az-cli: "2.91.0"                   # 2026-10-05. From Microsoft's bookworm apt repo, which installs on trixie; there is no trixie suite yet.

    stack:
      # The release an environment upgrades to this one from.
      previous: "2.2.0"
      # Rollout order between component groups on an upgrade.
      upgrade-order: "dfe-schemas, dfe-engine, data-plane, dfe-ui"

    # OpenTofu provider constraints. They mirror required_providers under terraform/, which is what runs.
    providers:
      hashicorp-null: "~> 3.0"       # terraform/modules/tf-naming
      hashicorp-vault: "~> 5.0"      # terraform/modules/tf-iam, tf-secrets, environments/local
      hashicorp-random: "~> 3.6"     # terraform/modules/tf-secrets, secrets/aws-sm, environments/aws
      hashicorp-aws: "~> 6.64"       # terraform/modules/{kubernetes-cluster/aws,managed-kafka/{msk,confluent-cloud,redpanda-cloud},secrets/aws-sm}, terraform/environments/{aws,aws-state}
      confluentinc-confluent: "~> 2.86"  # terraform/modules/managed-kafka/confluent-cloud
      redpanda-data-redpanda: "~> 2.3"   # terraform/modules/managed-kafka/redpanda-cloud
      hashicorp-archive: "~> 2.8"    # terraform/modules/managed-kafka/msk, for the broker autoscaler's Lambda
      # The OIDC modules ship no lock file, so these are a customer's only ceiling.
      okta-okta: "~> 7.0"            # terraform/modules/tf-oidc-okta. 7.0.0, 2026-08-24.
      hashicorp-google: "~> 8.5"     # terraform/modules/tf-oidc-google. 8.5.0, 2026-09-29.
      hashicorp-azuread: "~> 3.0"    # terraform/modules/tf-oidc-entra
  2.2.1-rc.2:
    maturity: rc
    support: standard
    constraints: "constraints/2.2.1-rc.2.yaml"   # interdependency locks, checked by dfe-stack compat-check

    # What the cluster must already be. Floors, because the operator owns the cluster and upgrades it.
    # Keep every leaf a string: check_versions_drift.py skips a nested map without saying so.
    platform:
      # bootstrap/check_platform.py refuses below 1.34 and warns above 1.36, the newest minor tested.
      kubernetes: "1.34-1.36"
      # Checked when the server version carries +rke2. 1.37 waits on Rancher 2.16.
      rke2: ">=v1.34"
      # Declared, not checked -- nothing in a cluster reports the Rancher managing it.
      rancher: ">=2.15"
      eks: ">=1.34"

    # Installed by bootstrap.sh, which reads these through read_versions.py.
    bootstrap:
      cert-manager: "v1.21.2"        # 2026-09-11, K8s 1.33-1.36. Minors cannot be skipped. Upgrade with --reset-values --set crds.enabled=true; --reuse-values fails on this hop.
      external-secrets: "2.11.0"     # 2026-09-18, tested on K8s 1.36. Never downgrade to 0.x: it strands the generator CRDs.
      argocd: "10.10.0"              # chart 2026-10-07, Argo CD v3.5.4 (2026-10-06), K8s 1.33-1.36. The highest chart on v3.5.4: 10.9.7 carries the same app, and 10.10.0 adds only server.enabled (default true) and a redis-ha exporter bump. --reuse-values fails across a chart hop; re-supply redis.enabled=false and externalRedis.host/port.
      # image: valkey/valkey
      valkey: "8.1.10-alpine"        # 2026-08-31, fixes GHSA-jcj7-v34w-v9vv. Held on the 8.1 line.
      # image: docker.io/rancher/local-path-provisioner
      local-path-provisioner: "v0.0.37"  # 2026-08-05. Only installed when the cluster has no default StorageClass; bootstrap/local_path_image.py pins the manifest's image by digest.
      metallb: "0.16.1"              # 2026-05-27. On-prem LoadBalancer when nothing else provides one (DFE_CLOUD=local). No LTS line.

    # Cluster addons and the data operators: Argo waves 2-3 (appsets/layer1-addons.yaml, layer-scale.yaml).
    operators:
      envoy-gateway: "v1.9.2"        # 2026-09-28, fixes GHSA-gmx8-fhfh-mgjx. Runs on chart defaults, so upgrade with --reset-values.
      external-dns: "1.23.0"         # chart 2026-09-30, app v0.23.0. layer1-addons.yaml holds annotationPrefix at external-dns.alpha.kubernetes.io/ so existing records survive.
      keda: "2.21.0"                 # 2026-09-23, fixes GHSA-637c-6jxx-4rwm. K8s 1.34-1.36.
      metrics-server: "3.14.0"       # 2026-08-19, app v0.9.0.
      reloader: "2.2.18"             # 2026-09-30, app v1.4.22.
      strimzi-kafka-operator: "1.2.0"  # 2026-08-20. Needed for Kafka 4.3.1. A 0.51 cluster must convert its v1beta2 resources (v1-api-conversion.sh convert-resource, then crd-upgrade) before upgrading; dfe-ops refuses to deploy over a CRD still stored at v1beta2.
      clickhouse-operator: "0.0.8"   # 2026-09-25, ghcr.io/clickhouse/clickhouse-operator-helm@sha256:61d97bb43a16859f485af1099251fc591b527a4c01013e6de355be11a80fbc9c. ClickHouse Inc's own operator, scale profile only; Altinity's is untested with DFE. See docs/deployment/clickhouse.md.
      redpanda-operator: "26.2.4"    # 2026-09-24. Installed only when provider=redpanda and acceptLicense=true (BSL). Moves with services.redpanda-version.
      # renovate: datasource=github-releases depName=kubernetes-sigs/aws-load-balancer-controller
      aws-load-balancer-controller: "3.6.0"  # 2026-10-05. AWS only. Its CRDs ship in the chart.
      # renovate: datasource=github-releases depName=aws/karpenter-provider-aws
      karpenter: "1.14.1"            # 2026-08-21, LTS. AWS only, OCI chart from public.ecr.aws/karpenter. helm/charts/karpenter-pools is checked against this release's CRDs, so they move together.
      # renovate: datasource=github-releases depName=awslabs/amazon-eks-ami
      karpenter-al2023-ami: "v20260930"  # 2026-10-01. helm/charts/karpenter-pools uses it as the EC2NodeClass alias al2023@v20260930.

    # Datastores, brokers and telemetry: Argo waves 4-5 (appsets/layer2-data.yaml).
    services:
      postgresql: "17"               # The major of FerretDB's DocumentDB backend; moves with documentdb-pg. Only read to install a matching psql in the AWS toolbox.
      # image: apache/kafka rejects=apache/kafka-native
      # The version moves by hand with Strimzi; refresh-digests moves the digest.
      kafka-version: "4.3.1"         # 2026-06-23. The newest Kafka Strimzi 1.2.0 runs, and its default. Docker and k8s run the same version.
      kafka-replicas: "3"            # cluster mode default
      # image: docker.redpanda.com/redpandadata/redpanda aliases=redpandadata/redpanda
      # The version moves by hand with the operator; refresh-digests moves the digest.
      redpanda-version: "v26.2.3"    # 2026-09-17, the broker operator chart 26.2.4 ships with. dfe-loader's dev compose and PGO script use the same tag. The cluster-mode CR takes a bare tag, no digest.
      # image: clickhouse/clickhouse-server
      # The version moves by hand with the operator; refresh-digests moves the digest.
      clickhouse-version: "26.3.42.3"  # v26.3.42.3-lts, 2026-10-05. The 26.3 LTS line is supported to about 2027-03. Docker tags drop the -lts suffix.
      # image: docker.io/clickhouse/clickhouse-keeper
      # Moves with clickhouse-version (constraints rule clickhouse-keeper-server-pairing).
      clickhouse-keeper: "26.3.42.3"  # Same release as the server.
      clickhouse-replicas: "1"       # default; the scale profile sets 3
      # renovate: datasource=docker depName=ghcr.io/ferretdb/ferretdb
      ferretdb: "2.7.0"              # 2025-11-10. Needs the DocumentDB backend; 1.x to 2.x is a dump and restore.
      # renovate: datasource=docker depName=ghcr.io/ferretdb/postgres-documentdb
      documentdb-pg: "17-0.107.0-ferretdb-2.7.0"  # The newest PostgreSQL 17 build for FerretDB 2.7.0. FerretDB ships no 18 build yet.
      # image: code.forgejo.org/forgejo/forgejo
      forgejo: "15.0.9"              # 2026-09-17, v15 LTS, supported to 2027-07; fixes remote code execution. The bundled deploy repo, used only when no GitHub or GitLab is supplied. Pull from code.forgejo.org, not codeberg.org.
      # renovate: datasource=docker depName=otel/opentelemetry-collector-contrib
      otel-collector: "0.162.0"      # 2026-09-29. Both rendered collector configs pass otelcol validate on it.
      hyperdx: "2.40.0"              # The upstream HyperDX release dfe-hyperdx v0.3.2 merges, its packages/app version. The image is content.dfe-hyperdx.
      # renovate: datasource=docker depName=ghcr.io/kafbat/kafka-ui
      kafbat: "v1.5.0"               # 2026-04-20. Kafka web UI, behind DFE sign-in.
      # renovate: datasource=docker depName=envoyproxy/envoy
      envoy-proxy: "v1.39.2"         # 2026-10-01, fixes CVE-2026-35189. The docker stack's front proxy. Ubuntu build, not distroless: the compose healthcheck needs bash.
      # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
      nginx-unprivileged: "1.31.6-alpine"  # 2026-09-15. Serves the k8s links page and the Cruise Control UI. Upstream rebuilds tags in place, so the digest is what pins it.
      # renovate: datasource=docker depName=registry.k8s.io/git-sync/git-sync
      git-sync: "v4.7.1"             # 2026-07-16. Pulls the deploy repo's hunts and rules into the hunt runner pod.
      # renovate: datasource=github-releases depName=aws/aws-msk-iam-auth
      aws-msk-iam-auth: "2.3.9"      # 2026-09-24. A jar, not an image: the MSK bootstrap Job downloads it and checks its sha256.
      # renovate: datasource=github-releases depName=linkedin/cruise-control-ui
      cruise-control-ui: "0.4.0"     # 2022-05-27, unmaintained (last commit 2024-08). A tarball, not an image: the chart serves it from nginx-unprivileged and checks its sha256.
      # renovate: datasource=docker depName=docker.io/library/busybox
      busybox: "1.38.0"              # 2026-05-13. The local-path-provisioner helper pod, which upstream leaves untagged. Re-diff bootstrap/templates/local-path-helper-pod.yaml against upstream when local-path-provisioner moves.
      # image: docker.io/envoyproxy/envoy
      # Moves with operators.envoy-gateway (constraints rule envoy-gateway-proxy-pairing).
      envoy-gateway-proxy: "distroless-v1.39.2"  # 2026-10-01, fixes CVE-2026-35189. Replaces the distroless-v1.39.1 that Envoy Gateway v1.9.2 defaults to.

    # DFE apps: Argo wave 5 (appsets/layer2-apps.yaml). Each has its own release line on GHCR.
    # check_versions_drift.py holds each chart's appVersion to its pin.
    apps:
      dfe-engine: "v1.22.17"        # 2026-10-10, amd64 and arm64. The image thin chart 1.22.17 pins. Writes the thin-chart overlay keys (dfe-engine#773).
      dfe-ui: "v1.7.7"              # 2026-10-09, amd64 and arm64. The image thin chart 1.7.7 pins.
      dfe-receiver: "v1.15.43"      # 2026-10-09, amd64 and arm64. The image thin chart 1.15.43 pins.
      dfe-loader: "v1.18.47"        # 2026-10-09, amd64 and arm64. The image thin chart 1.18.47 pins. reqwest stays on 0.12 (dfe-loader#240).
      dfe-archiver: "v1.7.29"       # 2026-10-09, amd64 and arm64. The image thin chart 1.7.29 pins.
      dfe-fetcher: "v1.4.33"        # 2026-10-09, amd64 and arm64. The image thin chart 1.4.33 pins.
      dfe-transform-vrl: "v1.1.31"   # 2026-10-09, amd64 and arm64. The image thin chart 1.1.31 pins.
      dfe-transform-vector: "v1.0.46"  # 2026-10-09, amd64 and arm64. The image thin chart 1.0.46 pins.
      dfe-transform-elastic: "v1.1.10" # 2026-10-09, amd64 and arm64. The image thin chart 1.1.10 pins. Idle until a source names it.
      # Alpha and unpublished. A commented pin is read by nothing.
      # dfe-transform-wasm: "2.2.0"
      # dfe-transform-splack: "2.2.0"
      # The edge-fleet VPN, opt in per deployment (helm/edge/culvert). A public Apache-2.0 repo.
      culvert: "v2.1.18"            # 2026-10-09, amd64 and arm64. The image thin chart 2.1.18 pins.

    # The immutable half of each app's tag@sha256 pin, always the multi-arch index digest.
    # An app with no digest here is unpublished and left out of rendered manifests.
    digests:
      dfe-engine: "sha256:f5487f843c3048001757b00b6cc4276977ca2c3a787fdb57768ef3b498081095"
      dfe-ui: "sha256:76633eb720e127ed170fa94fba848441164d3424a2eb2a51eb2fd91c1481eb82"
      dfe-receiver: "sha256:2729443b687bdce058fbfd77fad9eb07573267f260215ea44f807115347b729b"
      dfe-loader: "sha256:f764250959c84ac5744744f5c8a973c2ed6bee7049762632a0150fd6cf5b9ea7"
      dfe-archiver: "sha256:01c44c367cac8a1b24b6ca4b58c2dba46ab6c947e4d5123298ef0bb3f35ec9eb"
      dfe-fetcher: "sha256:cdd45e404e75b5a42faca89fc9b30424894904535376909a8e1f2ffaf4dcb856"
      dfe-transform-vrl: "sha256:41b035383ed29f9fadc46f638b94d6c2eda1a29f03d85ce3d91acf26f149e5ae"
      dfe-transform-vector: "sha256:b79bebc159c1de416fb579d02949c0145139dac26c16b362b71bbfe8076ddee6"
      dfe-transform-elastic: "sha256:0776f6546d4cf49b9270c5c86b04ab53b38e1a9380075c0629adbde171dc831c"
      dfe-hyperdx: "sha256:cf098734100e04c13965039da460dc8ac88a53be3bdc5ff7ab9defbf3dc25e0c"
      culvert: "sha256:27666a427c2cf66d8a327874782bb47b108afebbb8c699f76155557bf4598a6e"
      # Tagged by toolbox.dfe-toolbox.
      dfe-toolbox-base: "sha256:056ab60643f2a0814f3e4baacca2534ac852367e15ba22665caa869c043dcc4b"

    # Each component's thin chart, assembled from its deployment contract, by manifest digest and
    # keyed by deploy.service. The layer 2 appsets carry a literal copy (check_versions_drift.py),
    # and refuse to render a service whose entry is not a sha256 digest: "unpublished" marks a chart
    # not published yet. The chart version is the app tag without its v, so it has no key here.
    chart-digests:
      culvert: "sha256:32b71c5730a29721ad34907148c39949bc766cf3ce46e775acc8bd57587ac92c"                # 2.1.18
      dfe-archiver: "sha256:90f7d9ec8cddb4d18c41caca5e38ab21a96be7159ddceb1fa2899bb726da5aae"           # 1.7.29
      dfe-engine: "sha256:923b06285df474560eaefd3ba1f78be7dd17bce9f71cdc690d826c3c69df78af"             # 1.22.17
      dfe-fetcher: "sha256:17b44639cd741115bd8f287b3b959ac86133b7f8fc14e8e1ee389a4856b1235f"            # 1.4.33
      dfe-loader: "sha256:d08d0416925e7322b4580d54f5226cce340a77c150e39845efe3e2ac910875b3"             # 1.18.47
      dfe-receiver: "sha256:11a8972d1681aa46a07c1e516c7733a6f1d3688462da33f3c36866ba2ffc46d9"           # 1.15.43
      dfe-transform-elastic: "sha256:85af7d98187c9fc8a82adb05fbc827316f59e1a795e9b649e44f5aa41036a752"  # 1.1.10
      dfe-transform-vector: "sha256:124db1bada639381231806a882b525388ec61837c02c85dfb8329b60b3856104"   # 1.0.46
      dfe-transform-vrl: "sha256:f04ff3cee742d4c3c0f3a33127bc2addd309b89ca87ab151ff0fa517c2849881"      # 1.1.31
      dfe-ui: "sha256:58adaa98e3d8840a5e81a66b9bef20ff7518e17c5394f6dea11e72b8dff0458c"                 # 1.7.7
      hyperdx: "sha256:43ab5e64fe8f43e6e0d133fe70403e7b6786f26ef840f36497600c1b07d3258b"                # 0.3.2

    # Digests for the third-party images, keyed like their version under services: or bootstrap:.
    # Index digests, so multi-arch safe. On k8s the cluster-mode Redpanda CR and Strimzi's broker deploy by tag.
    services-digests:
      clickhouse-version: "sha256:21d572843e59539c7d100286b6f5a6053c341fe4b33c2d7b74b1ff7cb24c5399"  # clickhouse/clickhouse-server:26.3.42.3
      clickhouse-keeper: "sha256:8361ed78996d087f3e85622566f15517c502e169a63e70b44dafe6ddca6dd3f5"   # docker.io/clickhouse/clickhouse-keeper:26.3.42.3
      kafka-version: "sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"       # apache/kafka:4.3.1
      redpanda-version: "sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9"    # docker.redpanda.com/redpandadata/redpanda:v26.2.3
      kafbat: "sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1"              # ghcr.io/kafbat/kafka-ui:v1.5.0
      ferretdb: "sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985"            # ghcr.io/ferretdb/ferretdb:2.7.0
      documentdb-pg: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"       # ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
      envoy-proxy: "sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85"         # envoyproxy/envoy:v1.39.2
      nginx-unprivileged: "sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083"   # nginxinc/nginx-unprivileged:1.31.6-alpine
      otel-collector: "sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6"       # otel/opentelemetry-collector-contrib:0.162.0
      git-sync: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"            # registry.k8s.io/git-sync/git-sync:v4.7.1
      busybox: "sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"             # docker.io/library/busybox:1.38.0
      forgejo: "sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1"             # code.forgejo.org/forgejo/forgejo:15.0.9
      valkey: "sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507"              # valkey/valkey:8.1.10-alpine
      local-path-provisioner: "sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f"  # docker.io/rancher/local-path-provisioner:v0.0.37
      envoy-gateway-proxy: "sha256:dced08cf7c472e1a1d067f906878266078eeeb63c110b4961882c039a622853a" # docker.io/envoyproxy/envoy:distroless-v1.39.2

    # Content repos, tagged with this stack.
    content:
      dfe-schemas: "v0.2.9"              # 2026-10-06. The engine applies it at startup.
      # renovate: datasource=github-tags depName=hyperi-io/dfe-deploy
      dfe-deploy: "v1.0.7"               # The deploy-repo template, seeded from this tag.
      # A commit, not a version: dfe-docker cuts no per-stack tag. 03ee6b97 is #216, which runs the e2e suites under console TLS.
      dfe-docker: "03ee6b97eeb0f081a4c637a995cd6441216818bf"
      dfe-hyperdx: "v0.3.2"              # 2026-10-10, amd64 and arm64. The image thin chart 0.3.2 pins.

    # The dfe-toolbox operator shell images (docker/dfe-toolbox/), not part of the deployed stack.
    # Each Dockerfile ARG default equals its pin here (drift-checked). clickhouse-client follows services.clickhouse-version.
    toolbox:
      # renovate: datasource=docker depName=ghcr.io/hyperi-io/dfe-toolbox-base
      dfe-toolbox: "v1.0.3"              # The family tag for all four images. A published tag never moves, so any input change ships under a new one. v1.0.3 carries argocd-cli v3.5.4; v1.0.2 stays published as it was.
      # renovate: datasource=docker depName=debian
      debian: "trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"  # Debian 13.7, pushed 2026-09-19.
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      kubectl: "v1.35.9"                 # 2026-09-23. The middle of the platform window, so within kubectl's one-minor skew of both 1.34 and 1.36. renovate.json holds it to 1.35.x.
      # renovate: datasource=github-releases depName=helm/helm
      helm: "v4.3.0"                     # 2026-09-09.
      # renovate: datasource=github-releases depName=argoproj/argo-cd
      argocd-cli: "v3.5.4"               # 2026-10-06. Matches the Argo CD that bootstrap.argocd installs.
      # renovate: datasource=github-releases depName=opentofu/opentofu
      tofu: "1.12.7"                     # 2026-10-01, fixes CVE-2026-78662 and CVE-2026-56855.
      # renovate: datasource=github-releases depName=mikefarah/yq
      yq: "v4.54.1"                      # 2026-09-29. mikefarah/yq, not Debian's python3-yq.
      # renovate: datasource=github-tags depName=aws/aws-cli
      aws-cli: "2.37.9"                  # 2026-10-02.
      # renovate: datasource=github-releases depName=aws/session-manager-plugin
      aws-session-manager-plugin: "1.2.889.0"  # Observed 2026-10-10 as what latest serves on amd64 and arm64. The download is a floating latest, so the aws Dockerfile fails the build when latest stops matching this. Renovate watches the GitHub releases, which can land minutes before latest moves.
      gcloud: "587.0.0"                  # 2026-09-29. No Renovate feed; moves by hand.
      # renovate: datasource=pypi depName=azure-cli
      az-cli: "2.91.0"                   # 2026-10-05. From Microsoft's bookworm apt repo, which installs on trixie; there is no trixie suite yet.

    stack:
      # The release an environment upgrades to this one from.
      previous: "2.2.1-rc.1"
      # Rollout order between component groups on an upgrade.
      upgrade-order: "dfe-schemas, dfe-engine, data-plane, dfe-ui"

    # OpenTofu provider constraints. They mirror required_providers under terraform/, which is what runs.
    providers:
      hashicorp-null: "~> 3.0"       # terraform/modules/tf-naming
      hashicorp-vault: "~> 5.0"      # terraform/modules/tf-iam, tf-secrets, environments/local
      hashicorp-random: "~> 3.6"     # terraform/modules/tf-secrets, secrets/aws-sm, environments/aws
      hashicorp-aws: "~> 6.64"       # terraform/modules/{kubernetes-cluster/aws,managed-kafka/{msk,confluent-cloud,redpanda-cloud},secrets/aws-sm}, terraform/environments/{aws,aws-state}
      confluentinc-confluent: "~> 2.86"  # terraform/modules/managed-kafka/confluent-cloud
      redpanda-data-redpanda: "~> 2.3"   # terraform/modules/managed-kafka/redpanda-cloud
      hashicorp-archive: "~> 2.8"    # terraform/modules/managed-kafka/msk, for the broker autoscaler's Lambda
      # The OIDC modules ship no lock file, so these are a customer's only ceiling.
      okta-okta: "~> 7.0"            # terraform/modules/tf-oidc-okta. 7.0.0, 2026-08-24.
      hashicorp-google: "~> 8.5"     # terraform/modules/tf-oidc-google. 8.5.0, 2026-09-29.
      hashicorp-azuread: "~> 3.0"    # terraform/modules/tf-oidc-entra
  2.2.1-rc.3:
    maturity: rc
    support: standard
    constraints: "constraints/2.2.1-rc.3.yaml"   # interdependency locks, checked by dfe-stack compat-check

    # What the cluster must already be. Floors, because the operator owns the cluster and upgrades it.
    # Keep every leaf a string: check_versions_drift.py skips a nested map without saying so.
    platform:
      # bootstrap/check_platform.py refuses below 1.34 and warns above 1.36, the newest minor tested.
      kubernetes: "1.34-1.36"
      # Checked when the server version carries +rke2. 1.37 waits on Rancher 2.16.
      rke2: ">=v1.34"
      # Declared, not checked -- nothing in a cluster reports the Rancher managing it.
      rancher: ">=2.15"
      eks: ">=1.34"

    # Installed by bootstrap.sh, which reads these through read_versions.py.
    bootstrap:
      cert-manager: "v1.21.2"        # 2026-09-11, K8s 1.33-1.36. Minors cannot be skipped. Upgrade with --reset-values and the values in bootstrap/helm_releases.py; --reuse-values fails on this hop.
      external-secrets: "2.11.0"     # 2026-09-18, tested on K8s 1.36. Never downgrade to 0.x: it strands the generator CRDs.
      argocd: "10.10.0"              # chart 2026-10-07, Argo CD v3.5.4 (2026-10-06), K8s 1.33-1.36. The highest chart on v3.5.4: 10.9.7 carries the same app, and 10.10.0 adds only server.enabled (default true) and a redis-ha exporter bump. Upgrade with --reset-values and the values in bootstrap/helm_releases.py; --reuse-values fails across a chart hop.
      # image: valkey/valkey
      valkey: "8.1.10-alpine"        # 2026-08-31, fixes GHSA-jcj7-v34w-v9vv. Held on the 8.1 line.
      # image: docker.io/rancher/local-path-provisioner
      local-path-provisioner: "v0.0.37"  # 2026-08-05. Only installed when the cluster has no default StorageClass; bootstrap/local_path_image.py pins the manifest's image by digest.
      metallb: "0.16.1"              # 2026-05-27. On-prem LoadBalancer when nothing else provides one (DFE_CLOUD=local). No LTS line.

    # Cluster addons and the data operators: Argo waves 2-3 (appsets/layer1-addons.yaml, layer-scale.yaml).
    operators:
      envoy-gateway: "v1.9.2"        # 2026-09-28, fixes GHSA-gmx8-fhfh-mgjx. Runs on chart defaults, so upgrade with --reset-values.
      external-dns: "1.23.0"         # chart 2026-09-30, app v0.23.0. layer1-addons.yaml holds annotationPrefix at external-dns.alpha.kubernetes.io/ so existing records survive.
      keda: "2.21.0"                 # 2026-09-23, fixes GHSA-637c-6jxx-4rwm. K8s 1.34-1.36.
      metrics-server: "3.14.0"       # 2026-08-19, app v0.9.0.
      reloader: "2.2.18"             # 2026-09-30, app v1.4.22.
      strimzi-kafka-operator: "1.2.0"  # 2026-08-20. Needed for Kafka 4.3.1. A 0.51 cluster must convert its v1beta2 resources (v1-api-conversion.sh convert-resource, then crd-upgrade) before upgrading; dfe-ops refuses to deploy over a CRD still stored at v1beta2.
      clickhouse-operator: "0.0.8"   # 2026-09-25, ghcr.io/clickhouse/clickhouse-operator-helm@sha256:61d97bb43a16859f485af1099251fc591b527a4c01013e6de355be11a80fbc9c. ClickHouse Inc's own operator, scale profile only; Altinity's is untested with DFE. See docs/deployment/clickhouse.md.
      redpanda-operator: "26.2.4"    # 2026-09-24. Installed only when provider=redpanda and acceptLicense=true (BSL). Moves with services.redpanda-version.
      # renovate: datasource=github-releases depName=kubernetes-sigs/aws-load-balancer-controller
      aws-load-balancer-controller: "3.6.0"  # 2026-10-05. AWS only. Its CRDs ship in the chart.
      # renovate: datasource=github-releases depName=aws/karpenter-provider-aws
      karpenter: "1.14.1"            # 2026-08-21, LTS. AWS only, OCI chart from public.ecr.aws/karpenter. helm/charts/karpenter-pools is checked against this release's CRDs, so they move together.
      # renovate: datasource=github-releases depName=awslabs/amazon-eks-ami
      karpenter-al2023-ami: "v20260930"  # 2026-10-01. helm/charts/karpenter-pools uses it as the EC2NodeClass alias al2023@v20260930.

    # Datastores, brokers and telemetry: Argo waves 4-5 (appsets/layer2-data.yaml).
    services:
      postgresql: "17"               # The major of FerretDB's DocumentDB backend; moves with documentdb-pg. Only read to install a matching psql in the AWS toolbox.
      # image: apache/kafka rejects=apache/kafka-native
      # The version moves by hand with Strimzi; refresh-digests moves the digest.
      kafka-version: "4.3.1"         # 2026-06-23. The newest Kafka Strimzi 1.2.0 runs, and its default. Docker and k8s run the same version.
      kafka-replicas: "3"            # cluster mode default
      # image: docker.redpanda.com/redpandadata/redpanda aliases=redpandadata/redpanda
      # The version moves by hand with the operator; refresh-digests moves the digest.
      redpanda-version: "v26.2.3"    # 2026-09-17, the broker operator chart 26.2.4 ships with. dfe-loader's dev compose and PGO script use the same tag. The cluster-mode CR takes a bare tag, no digest.
      # image: clickhouse/clickhouse-server
      # The version moves by hand with the operator; refresh-digests moves the digest.
      clickhouse-version: "26.3.42.3"  # v26.3.42.3-lts, 2026-10-05. The 26.3 LTS line is supported to about 2027-03. Docker tags drop the -lts suffix.
      # image: docker.io/clickhouse/clickhouse-keeper
      # Moves with clickhouse-version (constraints rule clickhouse-keeper-server-pairing).
      clickhouse-keeper: "26.3.42.3"  # Same release as the server.
      clickhouse-replicas: "1"       # default; the scale profile sets 3
      # renovate: datasource=docker depName=ghcr.io/ferretdb/ferretdb
      ferretdb: "2.7.0"              # 2025-11-10. Needs the DocumentDB backend; 1.x to 2.x is a dump and restore.
      # renovate: datasource=docker depName=ghcr.io/ferretdb/postgres-documentdb
      documentdb-pg: "17-0.107.0-ferretdb-2.7.0"  # The newest PostgreSQL 17 build for FerretDB 2.7.0. FerretDB ships no 18 build yet.
      # image: code.forgejo.org/forgejo/forgejo
      forgejo: "15.0.9"              # 2026-09-17, v15 LTS, supported to 2027-07; fixes remote code execution. The bundled deploy repo, used only when no GitHub or GitLab is supplied. Pull from code.forgejo.org, not codeberg.org.
      # renovate: datasource=docker depName=otel/opentelemetry-collector-contrib
      otel-collector: "0.162.0"      # 2026-09-29. Both rendered collector configs pass otelcol validate on it.
      hyperdx: "2.40.0"              # The upstream HyperDX release dfe-hyperdx v0.3.3 merges, its packages/app version. The image is content.dfe-hyperdx.
      # renovate: datasource=docker depName=ghcr.io/kafbat/kafka-ui
      kafbat: "v1.5.0"               # 2026-04-20. Kafka web UI, behind DFE sign-in.
      # renovate: datasource=docker depName=envoyproxy/envoy
      envoy-proxy: "v1.39.2"         # 2026-10-01, fixes CVE-2026-35189. The docker stack's front proxy. Ubuntu build, not distroless: the compose healthcheck needs bash.
      # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
      nginx-unprivileged: "1.31.6-alpine"  # 2026-09-15. Serves the k8s links page and the Cruise Control UI. Upstream rebuilds tags in place, so the digest is what pins it.
      # renovate: datasource=docker depName=registry.k8s.io/git-sync/git-sync
      git-sync: "v4.7.1"             # 2026-07-16. Pulls the deploy repo's hunts and rules into the hunt runner pod.
      # renovate: datasource=github-releases depName=aws/aws-msk-iam-auth
      aws-msk-iam-auth: "2.3.9"      # 2026-09-24. A jar, not an image: the MSK bootstrap Job downloads it and checks its sha256.
      # renovate: datasource=github-releases depName=linkedin/cruise-control-ui
      cruise-control-ui: "0.4.0"     # 2022-05-27, unmaintained (last commit 2024-08). A tarball, not an image: the chart serves it from nginx-unprivileged and checks its sha256.
      # renovate: datasource=docker depName=docker.io/library/busybox
      busybox: "1.38.0"              # 2026-05-13. The local-path-provisioner helper pod, which upstream leaves untagged. Re-diff bootstrap/templates/local-path-helper-pod.yaml against upstream when local-path-provisioner moves.
      # image: docker.io/envoyproxy/envoy
      # Moves with operators.envoy-gateway (constraints rule envoy-gateway-proxy-pairing).
      envoy-gateway-proxy: "distroless-v1.39.2"  # 2026-10-01, fixes CVE-2026-35189. Replaces the distroless-v1.39.1 that Envoy Gateway v1.9.2 defaults to.

    # DFE apps: Argo wave 5 (appsets/layer2-apps.yaml). Each has its own release line on GHCR.
    # check_versions_drift.py holds each chart's appVersion to its pin.
    apps:
      dfe-engine: "v1.22.18"        # 2026-10-10, amd64 and arm64. The image thin chart 1.22.18 pins. Keeps backend error text out of API responses, grants transform compile/test, audits admin and SCIM writes, counts each request once (dfe-engine#786 #787 #789 #790).
      dfe-ui: "v1.7.7"              # 2026-10-09, amd64 and arm64. The image thin chart 1.7.7 pins.
      dfe-receiver: "v1.15.43"      # 2026-10-09, amd64 and arm64. The image thin chart 1.15.43 pins.
      dfe-loader: "v1.18.47"        # 2026-10-09, amd64 and arm64. The image thin chart 1.18.47 pins. reqwest stays on 0.12 (dfe-loader#240).
      dfe-archiver: "v1.7.29"       # 2026-10-09, amd64 and arm64. The image thin chart 1.7.29 pins.
      dfe-fetcher: "v1.4.33"        # 2026-10-09, amd64 and arm64. The image thin chart 1.4.33 pins.
      dfe-transform-vrl: "v1.1.31"   # 2026-10-09, amd64 and arm64. The image thin chart 1.1.31 pins.
      dfe-transform-vector: "v1.0.46"  # 2026-10-09, amd64 and arm64. The image thin chart 1.0.46 pins.
      dfe-transform-elastic: "v1.1.10" # 2026-10-09, amd64 and arm64. The image thin chart 1.1.10 pins. Idle until a source names it.
      # Alpha and unpublished. A commented pin is read by nothing.
      # dfe-transform-wasm: "2.2.0"
      # dfe-transform-splack: "2.2.0"
      # The edge-fleet VPN, opt in per deployment (helm/edge/culvert). A public Apache-2.0 repo.
      culvert: "v2.1.18"            # 2026-10-09, amd64 and arm64. The image thin chart 2.1.18 pins.

    # The immutable half of each app's tag@sha256 pin, always the multi-arch index digest.
    # An app with no digest here is unpublished and left out of rendered manifests.
    digests:
      dfe-engine: "sha256:43bb478f819b528bf1faa70efdda690c8442fa51d94eb728e1688a328a15f941"
      dfe-ui: "sha256:76633eb720e127ed170fa94fba848441164d3424a2eb2a51eb2fd91c1481eb82"
      dfe-receiver: "sha256:2729443b687bdce058fbfd77fad9eb07573267f260215ea44f807115347b729b"
      dfe-loader: "sha256:f764250959c84ac5744744f5c8a973c2ed6bee7049762632a0150fd6cf5b9ea7"
      dfe-archiver: "sha256:01c44c367cac8a1b24b6ca4b58c2dba46ab6c947e4d5123298ef0bb3f35ec9eb"
      dfe-fetcher: "sha256:cdd45e404e75b5a42faca89fc9b30424894904535376909a8e1f2ffaf4dcb856"
      dfe-transform-vrl: "sha256:41b035383ed29f9fadc46f638b94d6c2eda1a29f03d85ce3d91acf26f149e5ae"
      dfe-transform-vector: "sha256:b79bebc159c1de416fb579d02949c0145139dac26c16b362b71bbfe8076ddee6"
      dfe-transform-elastic: "sha256:0776f6546d4cf49b9270c5c86b04ab53b38e1a9380075c0629adbde171dc831c"
      dfe-hyperdx: "sha256:3e594123968b7775540c4e8ace4ca96585badc892d2e769764160f7bde63c6c5"
      culvert: "sha256:27666a427c2cf66d8a327874782bb47b108afebbb8c699f76155557bf4598a6e"
      # Tagged by toolbox.dfe-toolbox.
      dfe-toolbox-base: "sha256:056ab60643f2a0814f3e4baacca2534ac852367e15ba22665caa869c043dcc4b"

    # Each component's thin chart, assembled from its deployment contract, by manifest digest and
    # keyed by deploy.service. The layer 2 appsets carry a literal copy (check_versions_drift.py),
    # and refuse to render a service whose entry is not a sha256 digest: "unpublished" marks a chart
    # not published yet. The chart version is the app tag without its v, so it has no key here.
    chart-digests:
      culvert: "sha256:32b71c5730a29721ad34907148c39949bc766cf3ce46e775acc8bd57587ac92c"                # 2.1.18
      dfe-archiver: "sha256:90f7d9ec8cddb4d18c41caca5e38ab21a96be7159ddceb1fa2899bb726da5aae"           # 1.7.29
      dfe-engine: "sha256:11500ab98a1b008111a96be46903d8bda89c55815e1a2024da3a338ff8c22c4c"             # 1.22.18
      dfe-fetcher: "sha256:17b44639cd741115bd8f287b3b959ac86133b7f8fc14e8e1ee389a4856b1235f"            # 1.4.33
      dfe-loader: "sha256:d08d0416925e7322b4580d54f5226cce340a77c150e39845efe3e2ac910875b3"             # 1.18.47
      dfe-receiver: "sha256:11a8972d1681aa46a07c1e516c7733a6f1d3688462da33f3c36866ba2ffc46d9"           # 1.15.43
      dfe-transform-elastic: "sha256:85af7d98187c9fc8a82adb05fbc827316f59e1a795e9b649e44f5aa41036a752"  # 1.1.10
      dfe-transform-vector: "sha256:124db1bada639381231806a882b525388ec61837c02c85dfb8329b60b3856104"   # 1.0.46
      dfe-transform-vrl: "sha256:f04ff3cee742d4c3c0f3a33127bc2addd309b89ca87ab151ff0fa517c2849881"      # 1.1.31
      dfe-ui: "sha256:58adaa98e3d8840a5e81a66b9bef20ff7518e17c5394f6dea11e72b8dff0458c"                 # 1.7.7
      hyperdx: "sha256:95a0ab3a12b56360d43cd22099d0ad7f19ec7a6065408459ce6f6a12a2f4cc00"                # 0.3.3

    # Digests for the third-party images, keyed like their version under services: or bootstrap:.
    # Index digests, so multi-arch safe. On k8s the cluster-mode Redpanda CR and Strimzi's broker deploy by tag.
    services-digests:
      clickhouse-version: "sha256:21d572843e59539c7d100286b6f5a6053c341fe4b33c2d7b74b1ff7cb24c5399"  # clickhouse/clickhouse-server:26.3.42.3
      clickhouse-keeper: "sha256:8361ed78996d087f3e85622566f15517c502e169a63e70b44dafe6ddca6dd3f5"   # docker.io/clickhouse/clickhouse-keeper:26.3.42.3
      kafka-version: "sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"       # apache/kafka:4.3.1
      redpanda-version: "sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9"    # docker.redpanda.com/redpandadata/redpanda:v26.2.3
      kafbat: "sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1"              # ghcr.io/kafbat/kafka-ui:v1.5.0
      ferretdb: "sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985"            # ghcr.io/ferretdb/ferretdb:2.7.0
      documentdb-pg: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"       # ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
      envoy-proxy: "sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85"         # envoyproxy/envoy:v1.39.2
      nginx-unprivileged: "sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083"   # nginxinc/nginx-unprivileged:1.31.6-alpine
      otel-collector: "sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6"       # otel/opentelemetry-collector-contrib:0.162.0
      git-sync: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"            # registry.k8s.io/git-sync/git-sync:v4.7.1
      busybox: "sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"             # docker.io/library/busybox:1.38.0
      forgejo: "sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1"             # code.forgejo.org/forgejo/forgejo:15.0.9
      valkey: "sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507"              # valkey/valkey:8.1.10-alpine
      local-path-provisioner: "sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f"  # docker.io/rancher/local-path-provisioner:v0.0.37
      envoy-gateway-proxy: "sha256:dced08cf7c472e1a1d067f906878266078eeeb63c110b4961882c039a622853a" # docker.io/envoyproxy/envoy:distroless-v1.39.2

    # Content repos, tagged with this stack.
    content:
      dfe-schemas: "v0.2.9"              # 2026-10-06. The engine applies it at startup.
      # renovate: datasource=github-tags depName=hyperi-io/dfe-deploy
      dfe-deploy: "v1.0.7"               # The deploy-repo template, seeded from this tag.
      # A commit, not a version: dfe-docker cuts no per-stack tag. 0f2cb6ef (2026-10-10) is "fix(stack): pin the stack dial at 2.2.1-rc.2 (#217)".
      dfe-docker: "0f2cb6efe56ea1fc297826173c579ea5eca28c79"
      dfe-hyperdx: "v0.3.3"              # 2026-10-10, amd64 and arm64. The image thin chart 0.3.3 pins. Reads the caller's own team and carries two ReDoS patches (dfe-hyperdx#136 #137).

    # The dfe-toolbox operator shell images (docker/dfe-toolbox/), not part of the deployed stack.
    # Each Dockerfile ARG default equals its pin here (drift-checked). clickhouse-client follows services.clickhouse-version.
    toolbox:
      # renovate: datasource=docker depName=ghcr.io/hyperi-io/dfe-toolbox-base
      dfe-toolbox: "v1.0.3"              # The family tag for all four images. A published tag never moves, so any input change ships under a new one. v1.0.3 carries argocd-cli v3.5.4; v1.0.2 stays published as it was.
      # renovate: datasource=docker depName=debian
      debian: "trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a"  # Debian 13.7, pushed 2026-09-19.
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      kubectl: "v1.35.9"                 # 2026-09-23. The middle of the platform window, so within kubectl's one-minor skew of both 1.34 and 1.36. renovate.json holds it to 1.35.x.
      # renovate: datasource=github-releases depName=helm/helm
      helm: "v4.3.0"                     # 2026-09-09.
      # renovate: datasource=github-releases depName=argoproj/argo-cd
      argocd-cli: "v3.5.4"               # 2026-10-06. Matches the Argo CD that bootstrap.argocd installs.
      # renovate: datasource=github-releases depName=opentofu/opentofu
      tofu: "1.12.7"                     # 2026-10-01, fixes CVE-2026-78662 and CVE-2026-56855.
      # renovate: datasource=github-releases depName=mikefarah/yq
      yq: "v4.54.1"                      # 2026-09-29. mikefarah/yq, not Debian's python3-yq.
      # renovate: datasource=github-tags depName=aws/aws-cli
      aws-cli: "2.37.9"                  # 2026-10-02.
      # renovate: datasource=github-releases depName=aws/session-manager-plugin
      aws-session-manager-plugin: "1.2.889.0"  # Observed 2026-10-10 as what latest serves on amd64 and arm64. The download is a floating latest, so the aws Dockerfile fails the build when latest stops matching this. Renovate watches the GitHub releases, which can land minutes before latest moves.
      gcloud: "587.0.0"                  # 2026-09-29. No Renovate feed; moves by hand.
      # renovate: datasource=pypi depName=azure-cli
      az-cli: "2.91.0"                   # 2026-10-05. From Microsoft's bookworm apt repo, which installs on trixie; there is no trixie suite yet.

    stack:
      # The release an environment upgrades to this one from.
      previous: "2.2.1-rc.2"
      # Rollout order between component groups on an upgrade.
      upgrade-order: "dfe-schemas, dfe-engine, data-plane, dfe-ui"

    # OpenTofu provider constraints. They mirror required_providers under terraform/, which is what runs.
    providers:
      hashicorp-null: "~> 3.0"       # terraform/modules/tf-naming
      hashicorp-vault: "~> 5.0"      # terraform/modules/tf-iam, tf-secrets, environments/local
      hashicorp-random: "~> 3.6"     # terraform/modules/tf-secrets, secrets/aws-sm, environments/aws
      hashicorp-aws: "~> 6.64"       # terraform/modules/{kubernetes-cluster/aws,managed-kafka/{msk,confluent-cloud,redpanda-cloud},secrets/aws-sm}, terraform/environments/{aws,aws-state}
      confluentinc-confluent: "~> 2.86"  # terraform/modules/managed-kafka/confluent-cloud
      redpanda-data-redpanda: "~> 2.3"   # terraform/modules/managed-kafka/redpanda-cloud
      hashicorp-archive: "~> 2.8"    # terraform/modules/managed-kafka/msk, for the broker autoscaler's Lambda
      # The OIDC modules ship no lock file, so these are a customer's only ceiling.
      okta-okta: "~> 7.0"            # terraform/modules/tf-oidc-okta. 7.0.0, 2026-08-24.
      hashicorp-google: "~> 8.5"     # terraform/modules/tf-oidc-google. 8.5.0, 2026-09-29.
      hashicorp-azuread: "~> 3.0"    # terraform/modules/tf-oidc-entra
