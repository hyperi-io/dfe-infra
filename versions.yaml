# Content repos -- tagged in LOCKSTEP with each stack release (a stack release
# tags these alongside dfe-infra so the whole set is one name). PENDING entries
# have no release tag / published image yet -- the first stack release cut
# after this lands stamps them.
content:
  dfe-schemas: "PENDING-FIRST-TAG"   # baseline DDL; repo has no release tags yet
  dfe-deploy: "PENDING-FIRST-TAG"    # the deploy-repo template (seeded at this tag)
  dfe-hyperdx: "PENDING-FIRST-IMAGE" # fork image not on GHCR yet; resolves data.hyperdx TODO

# Stack release metadata -- the "DFE X.Y.Z" layer over this manifest.
# The stack VERSION is the dfe-infra git tag (semantic-release owns it; never
# hand-written here). The upgrade GRAPH is derived by walking the git tags and
# reading each tag's stack.previous -- auto-managed, no curated graph file
# (cincinnati-lite; see dfe-docs/deployment/stack-versioning.md).
stack:
  # Versions an environment may upgrade to THIS release from (verified paths).
  # Rule of thumb encoded by `dfe-stack check-upgrade`: sequential minors,
  # free z-hops within a minor. Empty = first release under the graph model.
  previous: ""
  # Rollout order between component groups on a stack upgrade (lockstep does
  # not remove ordering -- schemas land before the engine that expects them,
  # data plane before the UI that surfaces it).
  upgrade-order: "dfe-schemas, dfe-engine, data-plane, dfe-ui"
  # Support stance: latest z of the two most recent minors. Within a minor,
  # z-releases are cumulative and must not change configs, deprecate APIs,
  # change schemas, or break backward compatibility. EUS/LTS lines are a
  # future commercial decision, deliberately NOT built yet.

# Terraform providers
providers:
  hashicorp-null: "~> 3.0"
  hashicorp-vault: "~> 4.0"

