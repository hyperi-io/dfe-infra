# Ruff config for scripts/. Standalone, because dfe-infra ships no Python package.

# The scripts are wrapped by hand at 100, and CI runs ruff check only.
line-length = 100
target-version = "py314"

# These CLIs carry no .py suffix, so without this ruff never reads them and an
# undefined name reaches a live run.
extend-include = [
    "scripts/dfe-ops",
    "scripts/dfe-stack",
    "scripts/dfe-suite",
    "scripts/dfe-fleet",
    "scripts/dfe-sweep",
    "scripts/dfe-weave",
]

extend-exclude = [
    ".tmp",
    "helm",
]

[lint]
# dfe-engine's rule families. No T20: these are command-line tools, so they print.
select = ["E4", "E7", "E9", "F", "B", "S", "I", "UP", "N", "PT", "RUF", "PIE"]
ignore = [
    "S101",  # assert -- the drift-guard tests are built on it
    "S105",  # hardcoded password: sentinel and secret-NAME strings, not secrets
    "S603",  # subprocess without shell -- every one of these shells out to gh/kubectl/helm
    "S607",  # partial executable path -- gh, kubectl and helm come from PATH by design
    "S608",  # SQL built by format -- ClickHouse DDL from config, never user input
    "S110",  # try-except-pass, where a probe genuinely has nothing to do on failure
    "S112",  # try-except-continue, where the next candidate IS the handling
    "S310",  # urlopen of a URL the operator passed as an argument or config
    "S311",  # seeded random in loadgen -- reproducibility, not cryptography
    "N814",  # a deliberate short local alias for a long ruamel class
]

[lint.isort]
# _bootstrap, _charts, _expect, _forgejo_job, _gate, _oci, _smoke, _spread and _weave are
# the shared test helpers sitting beside the tests that import them, so they belong in
# the first-party group rather than beside PyPI packages.
known-first-party = [
    "_bootstrap", "_charts", "_expect", "_forgejo_job", "_gate", "_oci", "_smoke", "_spread", "_weave",
]

[lint.per-file-ignores]
# Test helpers load the script under test by path, which needs the import
# machinery rather than a module import.
"scripts/tests/*" = ["S102"]
# The suite CLIs and their tests put `scripts/` on sys.path before importing
# the package, which is an import that cannot be at the top of the file.
"scripts/dfe-suite" = ["E402"]
"scripts/dfe-fleet" = ["E402"]
"scripts/dfe-sweep" = ["E402"]
"scripts/tests/test_suite_kinds.py" = ["S102", "E402", "N802"]
"scripts/tests/test_dfe_suite_cli.py" = ["S102", "E402"]
"scripts/tests/test_scalo_fleet.py" = ["S102", "E402"]

