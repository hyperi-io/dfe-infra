apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config blob changes -- the app reads the file at
        # startup only, so a ConfigMap update alone would not take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      # k8s injects a legacy Docker-link env var per Service in the namespace, and
      # this chart now ADDS svc/dfe-loader -> DFE_LOADER_PORT="tcp://IP:6000". The
      # loader layers `Env::prefixed("DFE_LOADER_")` over its config (config/loader.rs),
      # so that lands as config key `port` -- a key it does not have, injected by the
      # platform rather than by us. The engine hits the identical class and DIES on it
      # (svc/dfe-keda-shim vs its DFE_KEDA_SHIM_PORT setting). DFE resolves by DNS and
      # reads none of these: switch them off rather than wait for the collision.
      enableServiceLinks: false
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: loader
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          # Mirrors the image CMD (dfe-loader Dockerfile:43). Explicit so the
          # config path is visible here rather than buried in the image.
          args:
            - "--config"
            - "/etc/dfe/loader.yaml"
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            # scalo's metrics server (metrics.enabled defaults true on 0.0.0.0:9090
            # -- dfe-loader config/pipeline.rs:496-502). Named so the liveness probe
            # and the prometheus scrape annotation agree on one port.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Prefixed, like the SASL block below: the loader's flat-env contract is
            # DFE_LOADER_* (loader.rs:194), and a bare KAFKA_BOOTSTRAP_SERVERS matches
            # nothing, leaving the broker list on its localhost:9092 default.
            - name: DFE_LOADER_KAFKA_BROKERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- include "dfe-common.kafkaProviderEnv" . | nindent 12 }}
            {{- if .Values.kafka.saslSecretName }}
            # The SASL credential MUST arrive by env, not in the config blob: the
            # engine's model_dump masks the pydantic SecretStr, so the authored
            # loader.yaml carries password "**********". That is deliberate (the real
            # password can never leak into the ConfigMap or the gitops repo) and it
            # works because env BEATS the config file in dfe-loader's cascade
            # (src/config/loader.rs:6-12). Without these two vars the loader would
            # try to authenticate with literal asterisks.
            #
            # Names are the loader's own flat-env contract (loader.rs:210-217),
            # prefix DFE_LOADER (loader.rs:183). NOTE: dfe-receiver spells the same
            # field KAFKA_SASL_USER, not USERNAME -- do not copy this block verbatim.
            - name: DFE_LOADER_KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: username
            - name: DFE_LOADER_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: password
            {{- end }}
            # Same prefix trap as the brokers above: bare CLICKHOUSE_* matched
            # nothing, so the loader kept its localhost:9000 / default / no-password
            # defaults. hosts is a LIST of host:port (loader.rs) and the port belongs
            # in the string -- there is no separate port setting.
            # HTTP, not native: the pinned clickhouse-rs fork has no TCP row
            # fetch, so schema queries silently fail on 9000 and every message
            # DLQs on schema_pending_timeout. hosts and transport must move
            # TOGETHER (the loader validates the pairing).
            - name: DFE_LOADER_CLICKHOUSE_HOSTS
              value: {{ printf "%s:%v" .Values.clickhouse.host .Values.clickhouse.port | quote }}
            - name: DFE_LOADER_CLICKHOUSE__TRANSPORT
              value: "http"
            - name: DFE_LOADER_CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            {{- with .Values.clickhouse.user }}
            - name: DFE_LOADER_CLICKHOUSE_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.clickhouse.passwordSecretName }}
            - name: DFE_LOADER_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.clickhouse.passwordSecretKey | default "password" }}
            {{- end }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-loader
          volumeMounts:
            - name: config
              mountPath: /etc/dfe
              readOnly: true
            # Writable scratch: the container rootfs is read-only
            # (dfe-common.containerSecurityContext), so anything writing /tmp
            # needs this emptyDir.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The scalo probe contract (scalo-rs docs/core-pillars/HEALTH.md): the metrics
          # server hosts health too, so both ride the metrics port. No separate health
          # listener. All live-verified against the running pod 2026-07-17.
          #
          # This WAS `exec: pgrep dfe-loader`, a probe that could never pass -- pgrep
          # is not in the image ("/bin/sh: 1: pgrep: not found" in the pod events), so
          # every probe failed and kubelet killed the loader every ~100s (10s delay +
          # 3 x 30s) for the whole life of the deployment. That is the 64- and
          # 281-restart pods, and why rows_inserted never left 0: the loader was never
          # up long enough to consume. A liveness probe that cannot pass is worse than
          # none -- it turns a healthy process into a crashloop.
          #
          # A startupProbe, if added, targets /livez. There is no startup route: k8s
          # suspends liveness until the startup probe passes, so one path carries both
          # the long boot budget and the tight liveness period. The old trap here was a
          # startupProbe aimed at a path that answered a permanent 503 -- the same shape
          # as the pgrep probe, a check that could never pass.
          livenessProbe:
            httpGet:
              path: /livez  # always 200 while the process can answer
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          # The loader had NO readiness probe at all, so k8s could not tell a warming
          # pod from a serving one. /readyz is the real signal.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
