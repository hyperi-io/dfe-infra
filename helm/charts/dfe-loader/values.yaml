project: dfe
component: loader
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

kafka:
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user

clickhouse:
  host: ""
  port: 8123
  database: dfe

config:
  mountPath: /config
  nfs:
    server: ""
    path: ""

otel:
  endpoint: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- folded into the chart (no side-car keda-scalers chart).
# Engine/overlay drives these. Default trigger = OTel-native scaling pressure.
# minReplicaCount stays 1 (scale-to-zero is 2.2 backlog; set min/idle 0 to opt in).
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: metrics-api
      metadata:
        targetValue: "70"
        url: "http://dfe-otel-collector-gateway.otel.svc.cluster.local:8889/api/v1/query?query=avg(dfe_scaling_pressure{service_name=\"dfe-loader\"})"
        valueLocation: "data.result.0.value.1"

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
