project: dfe
component: loader
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

kafka:
  # "disabled" (set by the no-kafka profiles) drops every kafka env + secret ref
  # and flips the transport to receiver -> loader direct gRPC. Empty = kafka on.
  mode: ""
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""

clickhouse:
  host: ""
  port: 8123
  database: dfe

# The DFE DLQ standard: kafka is the DLQ backend (a file DLQ write is an EROFS
# no-op on the read-only rootfs) and every write lands on the app's pre-created
# topic -- the kafka chart's kafka.dlqTopics list. Change the topic only
# together with that list, or the app dead-letters into a topic nothing created.
dlq:
  topic: dfe_loader_dlq
  mode: kafka_only

# Internal Service. grpcPort carries the receiver -> loader direct-gRPC path (the
# no-Kafka transport). 6000 is the DFE gRPC convention: the receiver listens on
# 6000 (dfe-receiver config default bind_address 0.0.0.0:6000) and names the
# loader target as grpc://loader.internal:6000 (dfe-receiver src/error.rs:257);
# the loader's own GrpcConfig documents "0.0.0.0:6000" (dfe-loader
# src/config/kafka.rs:80). The config blob's grpc.listen port MUST match this.
service:
  type: ClusterIP
  grpcPort: 6000

# The app's scalo config, mounted VERBATIM at /etc/dfe/loader.yaml (the image's
# CMD path -- dfe-loader Dockerfile:43). This is an OPAQUE passthrough blob: the
# engine is the config authority and publishes it as the per-instance Argo
# multi-source $values overlay (values/dfe-loader-<instance>-values.yaml), so the
# chart never needs to know the per-app keys. Empty here on purpose -- baking
# defaults in would put deployment-specific addresses in a product chart, and
# Helm's map merge would silently leave stale keys behind when the engine's
# overlay does not overwrite them.
# http, not native: the pinned clickhouse-rs fork has no TCP row fetch, so
# schema queries silently fail on 9000 (messages DLQ on
# schema_pending_timeout). Pairs with the HTTP port in the HOSTS env.
# The loader's config key is `protocol` (config/loader.rs From impl matches
# cfg.protocol); a `transport` key is silently ignored.
config:
  clickhouse:
    protocol: http

otel:
  endpoint: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- folded into the chart (no side-car keda-scalers chart).
# DEFAULT trigger is CPU (native KEDA cpu scaler, no shim). scalo ScalingPressure
# (dfe_scaling_pressure, 0-100) is OPT-IN via the fail-safe dfe-keda-shim (a metric
# outage FREEZES scaling, never runs replicas up). minReplicaCount stays 1
# (scale-to-zero is 2.2 backlog; set min/idle 0 to opt in).
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # DEFAULT: native KEDA cpu scaler (no shim needed)
  pressure:
    enabled: false            # opt-in: scalo ScalingPressure via the fail-safe dfe-keda-shim
    # service: dfe-loader     # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: dfe-keda-shim.dfe.svc.cluster.local:8080

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
