project: dfe
component: archiver
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

kafka:
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""

s3:
  endpoint: ""
  bucket: dfe-archive
  secretName: dfe-archiver-s3

config:
  mountPath: /config
  nfs:
    server: ""
    path: ""

otel:
  endpoint: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- DEFAULT trigger is CPU (native cpu scaler, no shim). scalo
# ScalingPressure (0-100) is OPT-IN via the fail-safe dfe-keda-shim (a metric outage
# FREEZES scaling, never runs replicas up). minReplicaCount stays 1.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # DEFAULT: native KEDA cpu scaler (no shim needed)
  pressure:
    enabled: false            # opt-in: scalo ScalingPressure via the fail-safe dfe-keda-shim
    # service: dfe-archiver   # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: dfe-keda-shim.dfe.svc.cluster.local:8080

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
