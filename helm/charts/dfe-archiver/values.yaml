project: dfe
component: archiver
env: local
cloud: local

image:
  repository: ""
  tag: ""
  # The immutable half of the pin; GHCR tags are mutable. == versions.yaml
  # digests.dfe-archiver (drift-checked).
  digest: "sha256:d9fb174704dc2e98f6850afdb8d9d5d35db16761f7d96c9d0ffe2b54e1bdda33"
  pullPolicy: IfNotPresent

replicaCount: 1

# Internal Service for the scalo Push listener, rendered on the direct transport
# only (dfe-common.pushService). 6000 is the DFE gRPC convention.
service:
  pushPort: 6000

kafka:
  # "disabled" is the DEPLOYMENT-WIDE transport dial, set once in the profile
  # values. Templates read it through dfe-common.transport, never by comparing
  # this string themselves.
  mode: ""
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""
  # Wire protocol for the broker's listener (PLAINTEXT | SASL_PLAINTEXT | SSL |
  # SASL_SSL). Empty leaves the app's own PLAINTEXT default; the deployment's
  # kafka layer names it beside bootstrapServers.
  securityProtocol: ""
  # No topicInclude dial, and no KAFKA_TOPIC_INCLUDE env: the landing topics are
  # COMPILED from the sources that asked to be archived (apps.yaml, dfe-archiver
  # routing.compiler: archiver) and reach the app as config.kafka.topics in the
  # engine's overlay. A discovery pattern here outranks that answer in the only
  # case where the two differ -- an empty compiled list means archive nothing,
  # and a pattern turns it into archive everything the broker holds, which also
  # keeps the app out of the idle state its manifest declares.

# Local disk INSIDE the pod: an emptyDir mounted at this path, with the
# destination pointed at it (ARCHIVER_DESTINATION). Empty by default -- a
# pod-local directory loses every file when the pod is replaced, so it proves
# the path rather than keeping archives. A deployment with object storage sets
# s3.* and leaves this empty.
archive:
  localPath: ""

# Tier-2 spool: an emptyDir, because the rootfs is read-only and the archiver
# creates this directory at construction -- without it the pod never starts.
# The path is sent as ARCHIVER_SPOOL_DIR too, so the mount and the app agree.
# Matches the app's own default (dfe-archiver DEFAULT_SPOOL_DIR) and moves only
# together with it.
spool:
  path: /var/spool/dfe/archiver

# Archive destination. Both keys are rendered as env (S3_ENDPOINT / S3_BUCKET,
# the archiver's flat-env contract) and env BEATS the config file, so a value set
# here would override whatever the engine's overlay authored. Both are EMPTY for
# that reason -- the engine is the config authority, and a chart default here is
# an override nobody asked for. Empty is omitted rather than sent blank, so a
# deployment that sets one in its own values still wins.
s3:
  endpoint: ""
  bucket: ""
  secretName: dfe-archiver-s3

# The DFE DLQ standard: kafka is the DLQ backend (a file DLQ write is an EROFS
# no-op on the read-only rootfs) and every write lands on the app's pre-created
# topic -- the kafka chart's kafka.dlqTopics list. Change the topic only
# together with that list, or the app dead-letters into a topic nothing created.
dlq:
  topic: dfe_archiver_dlq
  mode: kafka_only

# The app's scalo config, mounted VERBATIM at /etc/dfe/archiver.yaml (the image's
# CMD path -- dfe-archiver Dockerfile:43). This is an OPAQUE passthrough blob: the
# engine is the config authority and publishes it as the per-instance Argo
# multi-source $values overlay (values/dfe-archiver-<instance>-values.yaml), so
# the chart never needs to know the per-app keys. Empty here on purpose -- baking
# defaults in would put deployment-specific addresses in a product chart, and
# Helm's map merge would silently leave stale keys behind when the engine's
# overlay does not overwrite them.
config: {}

# Environment keys this deployment sets on top of the derived ones, as
# {NAME: value}. dfe-engine writes them here from the overlay's own extraEnv
# block, for a setting the app carries and this chart does not model. Rendered
# first in the container's env, so a key the chart also sets is overridden by
# the chart's own value below it.
extraEnv: {}

otel:
  endpoint: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- two triggers render and the HPA takes the higher: the native
# cpu scaler (no component in the path) and the scalo ScalingPressure composite
# (0-100) via the fail-safe dfe-keda-shim, which matches this ServiceName's gauge
# under any metric prefix (dfe-engine#379). Pressure needs the shim in the release
# namespace (the engine chart ships it); the slim profile turns it off because that
# tier carries no broker. minReplicaCount stays 1.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # second trigger: native KEDA cpu scaler (no shim needed)
  pressure:
    enabled: true             # scalo ScalingPressure via the fail-safe dfe-keda-shim
    # service: dfe-archiver   # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: dfe-keda-shim.<ns>.svc.cluster.local:8080 (default: the release namespace)

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
