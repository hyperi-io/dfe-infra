apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config blob changes -- the app reads the file at
        # startup only, so a ConfigMap update alone would not take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: archiver
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Mirrors the image CMD (dfe-archiver Dockerfile:43). Explicit so the
          # config path is visible here rather than buried in the image.
          args:
            - "--config"
            - "/etc/dfe/archiver.yaml"
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- include "dfe-common.kafkaProviderEnv" . | nindent 12 }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-archiver
          volumeMounts:
            - name: config
              mountPath: /etc/dfe
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep dfe-archiver"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
