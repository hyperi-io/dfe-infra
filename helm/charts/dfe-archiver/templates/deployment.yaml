apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  {{- include "dfe-common.replicas" . }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config blob changes -- the app reads the file at
        # startup only, so a ConfigMap update alone would not take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: archiver
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          # Mirrors the image CMD (dfe-archiver Dockerfile:43). Explicit so the
          # config path is visible here rather than buried in the image.
          args:
            - "--config"
            - "/etc/dfe/archiver.yaml"
          ports:
            # scalo's metrics server (defaults on 0.0.0.0:9090) hosts /metrics and
            # the /livez + /readyz health endpoints -- one port for the scrape
            # annotation and the probes to agree on. Same scalo contract as dfe-loader.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            {{- include "dfe-common.versionCheckEnv" (dict "ctx" . "prefix" "ARCHIVER_") | nindent 12 }}
            # The archiver's only broker key, bare namespace (core config.rs:370).
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- include "dfe-common.kafkaProviderEnv" . | nindent 12 }}
            {{- if .Values.kafka.saslSecretName }}
            # The engine masks the password when it authors the config, so env is
            # the only path a real credential travels. USER, not USERNAME
            # (config.rs:385-390). The mechanism must come too: normalize()
            # (config.rs:476-484) otherwise infers PLAIN, which a SCRAM broker
            # refuses. It rides the same secret so the two cannot drift.
            - name: KAFKA_SASL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: username
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: password
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: sasl.mechanism
            # The archiver derives nothing here: security_protocol defaults to
            # PLAINTEXT (config.rs:134) and goes straight to librdkafka.
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafka.securityProtocol | quote }}
            {{- end }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            {{- with .Values.s3.secretName }}
            # Names are config.rs:455-461. Empty secretName means no env at all,
            # leaving the archiver on the platform's ambient identity.
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.s3.secretAccessKeyIdKey }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.s3.secretAccessKeySecretKey }}
            {{- end }}
            # DLQ standard: fixed per-app topic on the kafka backend -- a file
            # DLQ write is an EROFS no-op on the read-only rootfs. The topic is
            # pre-created by the kafka chart (kafka.dlqTopics); names are the
            # archiver's bare flat-env contract (core config.rs DLQ_TOPIC/DLQ_MODE).
            - name: DLQ_TOPIC
              value: {{ .Values.dlq.topic | quote }}
            - name: DLQ_MODE
              value: {{ .Values.dlq.mode | quote }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-archiver
          volumeMounts:
            - name: config
              mountPath: /etc/dfe
              readOnly: true
            # Writable scratch: the container rootfs is read-only
            # (dfe-common.containerSecurityContext), so anything writing /tmp
            # needs this emptyDir.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # WAS `exec: pgrep dfe-archiver` -- a process-existence check that stays
          # green on a wedged-but-alive process, exactly the state liveness must
          # catch (k8s.md:970, containers.md:688-711). Moved to the scalo HTTP health
          # endpoints, matching dfe-loader (live-verified). A startupProbe, if added,
          # targets /livez -- there is no startup route, and k8s suspends liveness
          # until the startup probe passes.
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
