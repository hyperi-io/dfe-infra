apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  {{- include "dfe-common.replicas" . }}
  {{- include "dfe-common.rollout" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        # Roll the pods on ANY config change -- this app applies nothing live
        # (apps.yaml hot_reload: false), and the rolling update is the one
        # delivery mechanism every app chart uses either way.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: archiver
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          # Mirrors the image CMD (dfe-archiver Dockerfile:43). Explicit so the
          # config path is visible here rather than buried in the image.
          args:
            - "--config"
            - "/etc/dfe/archiver.yaml"
          ports:
            # scalo's metrics server (defaults on 0.0.0.0:9090) hosts /metrics and
            # the /livez + /readyz health endpoints -- one port for the scrape
            # annotation and the probes to agree on. Same scalo contract as dfe-loader.
            - name: metrics
              containerPort: 9090
              protocol: TCP
            {{- include "dfe-common.pushContainerPort" . | nindent 12 }}
          env:
            {{- include "dfe-common.versionCheckEnv" (dict "ctx" . "prefix" "ARCHIVER_") | nindent 12 }}
            {{- if (include "dfe-common.transportIsBus" .) }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- include "dfe-common.kafkaProviderEnv" . | nindent 12 }}
            {{- with .Values.kafka.topicInclude }}
            # Broker-side topic discovery, so a source created after this pod
            # started is archived without a roll. Comma-separated: scalo's
            # flat_env_list splits on it.
            - name: KAFKA_TOPIC_INCLUDE
              value: {{ join "," . | quote }}
            {{- end }}
            {{- else }}
            # Receive on the scalo Push listener the Service fronts instead of a
            # landing topic. Single underscore: this app reads its own flat-env
            # contract, not figment's nested cascade.
            - name: ARCHIVER_TRANSPORT
              value: "grpc"
            - name: ARCHIVER_GRPC_LISTEN
              value: {{ printf "0.0.0.0:%v" (include "dfe-common.pushPort" .) | quote }}
            {{- end }}
            {{- with .Values.archive.localPath }}
            # Local disk in the pod. Env BEATS the config file, the same rule as
            # S3_*, so this wins over whatever the engine's overlay authored.
            - name: ARCHIVER_DESTINATION
              value: {{ printf "file://%s" . | quote }}
            {{- end }}
            {{- with .Values.s3.endpoint }}
            # An S3-compatible endpoint (the AWS default when unset). Env BEATS
            # the config file in the archiver's cascade, so an empty value would
            # be an override to nothing; it is omitted rather than sent blank.
            - name: S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.s3.bucket }}
            - name: S3_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- if (include "dfe-common.transportIsBus" .) }}
            # DLQ standard: fixed per-app topic on the kafka backend -- a file
            # DLQ write is an EROFS no-op on the read-only rootfs. The topic is
            # pre-created by the kafka chart (kafka.dlqTopics); names are the
            # archiver's bare flat-env contract (core config.rs DLQ_TOPIC/DLQ_MODE).
            - name: DLQ_TOPIC
              value: {{ .Values.dlq.topic | quote }}
            - name: DLQ_MODE
              value: {{ .Values.dlq.mode | quote }}
            {{- else }}
            # No broker, so no kafka DLQ backend to write to.
            - name: DLQ_ENABLED
              value: "false"
            {{- end }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-archiver
          volumeMounts:
            - name: config
              mountPath: /etc/dfe
              readOnly: true
            # Writable scratch: the container rootfs is read-only
            # (dfe-common.containerSecurityContext), so anything writing /tmp
            # needs this emptyDir.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.archive.localPath }}
            - name: archive
              mountPath: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # WAS `exec: pgrep dfe-archiver` -- a process-existence check that stays
          # green on a wedged-but-alive process, exactly the state liveness must
          # catch (k8s.md:970, containers.md:688-711). Moved to the scalo HTTP health
          # endpoints, matching dfe-loader (live-verified). A startupProbe, if added,
          # targets /livez -- there is no startup route, and k8s suspends liveness
          # until the startup probe passes.
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
        {{- with .Values.archive.localPath }}
        - name: archive
          emptyDir: {}
        {{- end }}
