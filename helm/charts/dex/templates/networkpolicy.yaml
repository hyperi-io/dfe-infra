{{- if and .Values.dex.enabled .Values.networkPolicy.enabled }}
{{- $engineNs := .Values.networkPolicy.engineNamespace | default .Values.appNamespace | default .Release.Namespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gateway -> http (OIDC auth flows)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
    {{- if .Values.grpc.enabled }}
    # engine -> gRPC (the management surface -- engine only, nothing else)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $engineNs }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dfe-engine
      ports:
        - protocol: TCP
          port: {{ .Values.service.grpcPort }}
    {{- end }}
    # scrape/probes -> telemetry
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.scrapeNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.telemetryPort }}
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # k8s API (CRD storage), upstream IdPs, secrets/CA backends. TCP 443 fronts the
    # API on managed clusters (EKS/GKE/AKS); RKE2/kubeadm DNAT the API ClusterIP to
    # the node's 6443, and Calico enforces egress post-DNAT -- so allow both.
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
