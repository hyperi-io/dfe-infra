{{- if and .Values.dex.enabled .Values.grpc.enabled (eq .Values.grpc.tls.mode "certManager") }}
# gRPC server cert for dex; the engine's client cert (mTLS) is issued engine-side
# from the SAME estate issuer, so the shared CA (ca.crt here) is dex's tlsClientCA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "dfe-common.fullname" . }}-grpc
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  secretName: {{ include "dex.grpcTlsSecret" . }}
  duration: 2160h        # 90d
  renewBefore: 360h      # 15d
  privateKey:
    algorithm: ECDSA
    size: 384
  commonName: {{ include "dfe-common.fullname" . }}.{{ .Release.Namespace }}.svc
  dnsNames:
    - {{ include "dfe-common.fullname" . }}
    - {{ include "dfe-common.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "dfe-common.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "dfe-common.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - server auth
    - client auth
  issuerRef:
    name: {{ .Values.grpc.tls.issuerRef.name }}
    kind: {{ .Values.grpc.tls.issuerRef.kind }}
{{- end }}
