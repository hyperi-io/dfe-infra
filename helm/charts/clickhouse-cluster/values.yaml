project: dfe
component: clickhouse
env: local
cloud: local

# Namespace the DFE apps run in, supplied by the appset from the cluster's
# dfe.hyperi.io/dfe_namespace annotation. Empty -> the app-namespace credential
# copy is skipped, and the apps have no way to authenticate.
appNamespace: ""

# Further namespaces the admin credential is projected into (same ESO copy as
# appNamespace). The otel collector's ClickHouse exporter authenticates with it.
extraCredentialNamespaces:
  - otel

clickhouse:
  # Deployment mode (DFE owns its data layer; deploy unless external given):
  #   cluster  -> ClickHouseCluster (operator) + DFE-owned Keeper, ReplicatedMergeTree
  #   single   -> standalone clickhouse-server, no Keeper, MergeTree (small/test)
  #   external -> deploy nothing; connect to a supplied CH (BYO / ClickHouse Cloud)
  # Profile sets the default (scale->cluster, standard->single); deployer overrides.
  #
  # OPERATOR TARGETS (full matrix + history: docs/deployment/clickhouse.md):
  # cluster mode targets the OFFICIAL ClickHouse operator; external covers
  # ClickHouse Cloud/BYO -- the two main public targets. The HyperI private
  # cloud can swap this chart + operator for the internal n-tier cached
  # operator + CH fork (SSD cache over spinning disk; not referenced by name
  # here -- public repo). The Altinity operator is NOT tested with this stack.
  mode: cluster
  name: dfe-clickhouse
  version: "26.3.32.14"
  # Cluster-mode node count. Defaults to 3; set higher for more nodes.
  # (single mode ignores this -- it is always 1 standalone pod.)
  replicas: 3
  shardsCount: 1
  # Spread cluster pods evenly across k8s workers (best-effort: ScheduleAnyway,
  # so it never blocks scheduling when workers < replicas).
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  database: dfe
  # Keeper reference for cluster mode -- DFE deploys its OWN keeper (below),
  # self-contained. Do NOT point at another product's keeper.
  keeperClusterRef:
    name: dfe-keeper
  # DFE-owned Keeper (cluster mode only).
  keeper:
    name: dfe-keeper
    replicas: 3
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "26.3.32.14"
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
  # External CH (mode=external): connect to a supplied endpoint; deploy nothing.
  # Password materialised by ESO from Vault <project>/<env>/clickhouse/external.
  external:
    host: ""
    port: 8123
    user: default
    secretName: dfe-clickhouse-external
    secretStoreName: dfe-secret-store
  # Storage model, decided at deploy and refused afterwards (the engine holds
  # clickhouse.storageModel as a protected var). Named <family>-<bulk>: the
  # family says whether parts MOVE to the bulk store or are COPIED to it, the
  # bulk half says what that store is. Full matrix: docs/deployment/storage.md
  #   local          -> parts live on the PVC, which is the capacity ceiling.
  #                     Growing it needs allowVolumeExpansion on the
  #                     StorageClass and a StatefulSet recreate
  #                     (volumeClaimTemplates are immutable).
  #   cached-object  -> parts live on an object-store disk fronted by a local
  #                     read-through cache, so the PVC sizes the cache and the
  #                     part metadata rather than the data. The cache is
  #                     disposable; the bucket holds the durable copy.
  #   tiered-block   -> two local volumes ranked hot then cold. New parts land
  #                     on the fast one and ClickHouse demotes the oldest to the
  #                     cold one once free space there falls below
  #                     tieredBlock.moveFactor. No object store required, and no
  #                     table DDL changes. Both volumes must be durable.
  # tiered-object and cached-block are named cells this chart does not render
  # yet; the render fails on either rather than deploying something inert.
  # Applies to both cluster and single mode; external mode owns its own storage.
  storageModel: local
  # Object bulk store, for any model whose bulk half is `object`. Credentials
  # NEVER appear here -- the server reads them from the environment, wired from
  # a Secret the secrets store materialises (externalsecret-object-store.yaml),
  # the same seam mode=external uses.
  objectStore:
    # Full disk endpoint including bucket and path prefix, trailing slash
    # required, e.g. https://my-bucket.s3.ap-southeast-2.amazonaws.com/clickhouse/
    endpoint: ""
    region: ""
    # cached-object only: the local read-through cache in front of the object
    # store. Sized BELOW storage.size -- the cache and the part metadata share
    # that PVC.
    cacheSize: 20Gi
    # Empty leaves the server default. GCS rejects the batch-delete call, so a
    # deployment against a GCS endpoint sets this false.
    supportBatchDelete: ""
    secretName: dfe-clickhouse-s3
    secretStoreName: dfe-secret-store
    # Where the credential sits in the store. Empty derives the DFE-seeded path
    # <project>/<env>/clickhouse/s3, which is frozen: moving it would strand a
    # deployment that seeded there and never set this. Set it to reuse an
    # existing entry, e.g. services/minio on a store mounting kv.
    remoteKey: ""
    # Field names within that entry.
    accessKeyProperty: access_key_id
    secretKeyProperty: secret_access_key
    # Bound how long a read blocks when the store is unreachable. Left unset the
    # server retries for minutes: a read blocked over nine minutes on the rig,
    # and 1 / 2000 / 5000 brought the same failure down to 10.4 seconds. Those
    # numbers are a demonstration, not a recommendation -- one retry is
    # aggressive against real S3, which returns transient 5xx routinely. What
    # they must not stay is unbounded, because a nine-minute stall on a
    # dashboard is indistinguishable from an outage.
    retryAttempts: ""
    connectTimeoutMs: ""
    requestTimeoutMs: ""
  # Cold tier for storageModel: tiered-block. The HOT tier is clickhouse.storage
  # below -- point its storageClass at the SSD class and size it for the working
  # set. Both volumes must be durable: tiering MOVES parts, so the cold volume
  # holds the only copy of what it carries, unlike the cached-object cache.
  # Decided at deploy and refused afterwards, like the model itself -- the
  # operator takes no new disk on an existing ClickHouseCluster, and the engine
  # holds clickhouse.tieredBlock.* as a protected var. Rationale and the
  # verification queries: docs/deployment/clickhouse-tiering.md
  tieredBlock:
    # Names the PVC template, the mount, the disk and the cold volume. Must sort
    # after "default": volume order is tier priority and the API server
    # re-serialises the policy with sorted keys, so a name like "cold" would
    # silently make the bulk volume the hot tier. The chart fails the render on
    # a name that does not sort correctly.
    coldName: slow
    coldSize: 1Ti
    coldStorageClass: ""
    # Free fraction of the HOT volume below which the oldest parts are demoted
    # to the cold volume. Policy-level, so it needs no per-table DDL. Proven on
    # two real devices: at a hot free ratio of 0.91, 0.95 demoted and 0.2 did not.
    moveFactor: 0.2
  storage:
    # With storageModel: tiered-block this volume is the HOT tier -- point
    # storageClass at the SSD class and size it for the working set.
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  users:
    # The one credential the deploy layer owns, named `default` on every target.
    # Only `default` can take its password from a Secret
    # (settings.defaultUserPassword); any other name needs it inline in the CR.
    # Every other user, role and policy is engine governance -- see
    # docs/CLICKHOUSE-IDENTITY.md.
    admin:
      name: default
      secretName: clickhouse-admin-password
