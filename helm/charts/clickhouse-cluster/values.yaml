project: dfe
component: clickhouse
env: local
cloud: local

# From the appset's dfe.hyperi.io/dfe_namespace annotation. Empty skips the credential copy, so the apps cannot authenticate.
appNamespace: ""

# More namespaces the admin credential is copied into. docs/deployment/clickhouse.md, Placement and identity.
extraCredentialNamespaces: []

clickhouse:
  # cluster, single or external. The profile sets the default and a deployer overrides it. docs/deployment/clickhouse.md
  mode: cluster
  name: dfe-clickhouse
  version: "26.3.42.3"
  # Digest of the version above. versions.yaml services-digests.clickhouse-version.
  imageDigest: "sha256:21d572843e59539c7d100286b6f5a6053c341fe4b33c2d7b74b1ff7cb24c5399"
  # Cluster mode only.
  replicas: 3
  shardsCount: 1
  # docs/deployment/clickhouse.md, Placement and identity.
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  database: dfe
  # name must equal terraform's clickhouse_object_store_service_account. docs/deployment/clickhouse.md, Placement and identity.
  serviceAccount:
    create: true
    name: dfe-clickhouse
    automountServiceAccountToken: false
  # The DFE Keeper below, never another product's.
  keeperClusterRef:
    name: dfe-keeper
  keeper:
    name: dfe-keeper
    replicas: 3
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "26.3.42.3"   # versions.yaml services.clickhouse-keeper
      # versions.yaml services-digests.clickhouse-keeper.
      digest: "sha256:8361ed78996d087f3e85622566f15517c502e169a63e70b44dafe6ddca6dd3f5"
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        # Keeper's default log caches take 1.5 GiB before a request.
        memory: 3Gi
    # ruok replaces the operator's TCP probe, which makes Keeper log a Warning each time. Empty keeps the operator's.
    livenessProbe:
      exec:
        command: ["sh", "-c", "echo ruok | nc 127.0.0.1 2181 | grep -q imok"]
      initialDelaySeconds: 60
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 10
    # Read-only words only. docs/threat-model.md, Accepted risks.
    fourLetterWords: "ruok,isro,mntr,srvr,stat"
    # Same fields as clickhouse.serverLog.
    log:
      level: information
      size: 50M
      count: 3
    serviceAccount:
      create: true
      name: dfe-keeper
      automountServiceAccountToken: false
  # mode: external. The password is read from the secrets store at <project>/<env>/clickhouse/external.
  external:
    host: ""
    port: 8123
    user: default
    secretName: dfe-clickhouse-external
    secretStoreName: dfe-secret-store
  # HTTPS and native TLS beside the plaintext ports. docs/deploy-tls-trust.md, In-cluster ClickHouse.
  tls:
    enabled: false
    # true closes 8123 and 9000, cluster mode only.
    required: false
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    internalCA:
      issuerName: dfe-internal-ca
      present: false
    secretName: dfe-clickhouse-tls
    privateKey:
      algorithm: ECDSA
      size: 384
    # Names on top of the Service names the chart derives.
    dnsNames: []
    ca:
      secretName: dfe-clickhouse-ca
      dataKey: ca.crt
      # Get the CA copy and never the admin credential.
      extraNamespaces: []
  # Fixed at deploy: auto, cached-object, local or tiered-block. docs/deployment/storage.md
  storageModel: auto
  # Never a credential here: ESO materialises it. docs/deployment/storage.md
  objectStore:
    # Bucket and prefix with a trailing slash, e.g. https://my-bucket.s3.ap-southeast-2.amazonaws.com/clickhouse/
    endpoint: ""
    region: ""
    # AWS only. true leaves the credential to EKS Pod Identity. docs/deployment/storage.md, Dimension 4: credential binding.
    usePodIdentity: false
    # cached-object only. Required under cache.volume: instance-store, optional under pvc.
    cacheSize: ""
    # cached-object only: the read-through cache. docs/deployment/storage.md, Dimension 4: cache placement.
    cache:
      # pvc or instance-store. instance-store needs cacheSize, cluster mode and the node-pools chart's clickhouse pool.
      volume: pvc
      # instance-store only: max_size as a fraction of cacheSize. Must be below 1.
      maxSizeRatioToSizeLimit: 0.95
      # Hunts read recent data, so cache parts on write.
      onWriteOperations: true
      # Ignored when cacheSize is set: ClickHouse refuses both.
      maxSizeRatioToTotalSpace: 0.6
      # The server default 0 disables background eviction.
      keepFreeSpaceSizeRatio: 0.05
      loadMetadataAsynchronously: true
    # Empty keeps the server default. false for GCS, which rejects batch delete.
    supportBatchDelete: ""
    secretName: dfe-clickhouse-s3
    secretStoreName: dfe-secret-store
    # Empty derives <project>/<env>/clickhouse/s3, which is frozen. Set it to reuse an existing entry.
    remoteKey: ""
    accessKeyProperty: access_key_id
    secretKeyProperty: secret_access_key
    # Unset, a read against an unreachable store blocks for minutes. docs/deployment/storage.md, Dimension 4: request bounds.
    retryAttempts: ""
    connectTimeoutMs: ""
    requestTimeoutMs: ""
  # Cold tier for storageModel: tiered-block. docs/deployment/clickhouse-tiering.md
  tieredBlock:
    # Must sort after "default" or the tiers invert. The render fails otherwise.
    coldName: slow
    coldSize: 1Ti
    coldStorageClass: ""
    # Free fraction of the hot volume below which the oldest parts demote to the cold one.
    moveFactor: 0.2
  storage:
    # With tiered-block this is the HOT tier.
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  # Cluster mode only. docs/deployment/clickhouse.md, Server and Keeper settings.
  serverProfile:
    concurrentThreadsSoftLimitRatioToCores: 2
    maxServerMemoryUsageToRamRatio: 0.8
    backgroundPoolSizeFloor: 16
    backgroundPoolSizePerCore: 2
  # Both modes, in the `default` profile. docs/deployment/clickhouse.md, Server and Keeper settings.
  userProfile:
    asyncInsert: 1
    # 0 is refused at render: the loader would commit a Kafka offset on an unflushed insert.
    waitForAsyncInsert: 1
  # Both modes. docs/deployment/clickhouse.md, Server and Keeper settings.
  serverLog:
    level: information
    size: 50M
    count: 3
  # Days each system log table keeps, both modes. 0 means no TTL. docs/deployment/clickhouse.md, Retention.
  systemLogTTLDays:
    asynchronous_metric_log: 7
    metric_log: 7
    part_log: 7
    query_log: 30
    text_log: 7
  # System log tables switched off, both modes. A table here cannot also carry a TTL above.
  systemLogsOff:
    - trace_log
  users:
    # The deploy layer's one credential. Only `default` takes its password from a Secret. docs/clickhouse-identity.md
    admin:
      name: default
      secretName: clickhouse-admin-password

# Tolerations for the clickhouse and keeper pool taints. An overlay's list replaces this one.
nodeScheduling:
  tolerations:
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: clickhouse
      effect: NoSchedule
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: keeper
      effect: NoSchedule
  # Set by layer2-data from the cluster secret's tainted pools. A pool named here is required by its pods.
  dedicatedPools: []
