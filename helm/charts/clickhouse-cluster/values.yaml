project: dfe
component: clickhouse
env: local
cloud: local

# Namespace the DFE apps run in, supplied by the appset from the cluster's
# dfe.hyperi.io/dfe_namespace annotation. Empty -> the app-namespace credential
# copy is skipped, and the apps have no way to authenticate.
appNamespace: ""

# Further namespaces the admin credential is projected into (same ESO copy as
# appNamespace). The otel collector's ClickHouse exporter authenticates with it.
extraCredentialNamespaces:
  - otel

clickhouse:
  # Deployment mode (DFE owns its data layer; deploy unless external given):
  #   cluster  -> ClickHouseCluster (operator) + DFE-owned Keeper, ReplicatedMergeTree
  #   single   -> standalone clickhouse-server, no Keeper, MergeTree (small/test)
  #   external -> deploy nothing; connect to a supplied CH (BYO / ClickHouse Cloud)
  # Profile sets the default (scale->cluster, standard->single); deployer overrides.
  #
  # OPERATOR TARGETS (full matrix + history: docs/deployment/clickhouse.md):
  # cluster mode targets the OFFICIAL ClickHouse operator; external covers
  # ClickHouse Cloud/BYO -- the two main public targets. The HyperI private
  # cloud can swap this chart + operator for the internal n-tier cached
  # operator + CH fork (SSD cache over spinning disk; not referenced by name
  # here -- public repo). The Altinity operator is NOT tested with this stack.
  mode: cluster
  name: dfe-clickhouse
  version: "26.3.32.14"
  # Cluster-mode node count. Defaults to 3; set higher for more nodes.
  # (single mode ignores this -- it is always 1 standalone pod.)
  replicas: 3
  shardsCount: 1
  # Spread cluster pods evenly across k8s workers (best-effort: ScheduleAnyway,
  # so it never blocks scheduling when workers < replicas).
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  database: dfe
  # Keeper reference for cluster mode -- DFE deploys its OWN keeper (below),
  # self-contained. Do NOT point at another product's keeper.
  keeperClusterRef:
    name: dfe-keeper
  # DFE-owned Keeper (cluster mode only).
  keeper:
    name: dfe-keeper
    replicas: 3
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "26.3.32.14"
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        # 3Gi because Keeper's own default log caches are 1 GiB plus 500 MiB
        # before a single request is served, so the old 1Gi limit was an OOMKill
        # waiting on load rather than a bound on it.
        memory: 3Gi
  # External CH (mode=external): connect to a supplied endpoint; deploy nothing.
  # Password materialised by ESO from Vault <project>/<env>/clickhouse/external.
  external:
    host: ""
    port: 8123
    user: default
    secretName: dfe-clickhouse-external
    secretStoreName: dfe-secret-store
  # Storage model, decided at deploy and refused afterwards (the engine holds
  # clickhouse.storageModel as a protected var, and the deployment repo's
  # governance/policies/storage-layout.yaml governs it post-deploy).
  # EMPTY DERIVES IT: an objectStore.endpoint below yields `cached-object`,
  # nothing yields `local`. Setting this is the explicit override and wins;
  # every template reads the derived answer, never this key directly.
  # Named <family>-<bulk>: the
  # family says whether parts MOVE to the bulk store or are COPIED to it, the
  # bulk half says what that store is. Full matrix: docs/deployment/storage.md
  #   local          -> parts live on the PVC, which is the capacity ceiling.
  #                     Growing it needs allowVolumeExpansion on the
  #                     StorageClass and a StatefulSet recreate
  #                     (volumeClaimTemplates are immutable).
  #   cached-object  -> parts live on an object-store disk fronted by a local
  #                     read-through cache, so the PVC sizes the part metadata
  #                     rather than the data -- plus the cache itself, unless
  #                     objectStore.cache.volume moves the cache to the node's
  #                     instance store instead. The cache is disposable either
  #                     way; the bucket holds the durable copy.
  #   tiered-block   -> two local volumes ranked hot then cold. New parts land
  #                     on the fast one and ClickHouse demotes the oldest to the
  #                     cold one once free space there falls below
  #                     tieredBlock.moveFactor. No object store required, and no
  #                     table DDL changes. Both volumes must be durable.
  # tiered-object and cached-block are named cells this chart does not render
  # yet; the render fails on either rather than deploying something inert.
  # Applies to both cluster and single mode; external mode owns its own storage.
  storageModel: ""
  # Object bulk store, for any model whose bulk half is `object`. Credentials
  # NEVER appear here -- the server reads them from the environment, wired from
  # a Secret the secrets store materialises (externalsecret-object-store.yaml),
  # the same seam mode=external uses.
  objectStore:
    # Full disk endpoint including bucket and path prefix, trailing slash
    # required, e.g. https://my-bucket.s3.ap-southeast-2.amazonaws.com/clickhouse/
    endpoint: ""
    region: ""
    # AWS only: true skips the static-key ExternalSecret and the credential
    # env vars below (objectStoreEnv), leaving use_environment_credentials
    # (always on, templates/_storage.tpl) to resolve through EKS Pod Identity
    # alone -- a static AWS_ACCESS_KEY_ID in the pod's own environment would
    # shadow the Pod Identity Agent's injected credentials, which the AWS
    # SDK's default credential chain checks first. false (every other target:
    # on-prem MinIO, GCS, a BYO S3-compatible endpoint) keeps the current
    # byte-for-byte behaviour: the server authenticates with secretName /
    # secretStoreName / remoteKey below. See docs/deployment/storage.md.
    usePodIdentity: false
    # cached-object only: a fixed cache size, which OVERRIDES the ratio below
    # when set. Under cache.volume: pvc this stays optional -- empty leaves the
    # cache tracking the PVC it is given -- and a value here must sit BELOW
    # storage.size, because the cache and the part metadata share that PVC.
    # Under cache.volume: instance-store it is REQUIRED: an emptyDir has no PVC
    # to size itself against, so the ratio below cannot apply, and this value
    # also becomes the emptyDir's own sizeLimit (see templates/clickhouse.yaml)
    # -- the two can never disagree because they are the same number.
    cacheSize: ""
    # cached-object only: the local read-through cache in front of the object
    # store, on the s3_object_cache disk.
    cache:
      # Where the cache disk's bytes actually live -- pvc (default, current
      # behaviour byte-for-byte) keeps it on a subdirectory of the data PVC
      # alongside the part metadata; instance-store moves it to an emptyDir on
      # the node's local NVMe instead, leaving the PVC to hold only the part
      # metadata. instance-store needs cacheSize set and clickhouse.mode:
      # cluster, and it needs a node that actually carries local NVMe -- the
      # karpenter-pools chart's `clickhouse` pool, whose instanceStorePolicy:
      # RAID0 is what makes that NVMe available to a pod at all. Unlike a gp3
      # PVC, which reattaches to whatever node picks the pod back up, an
      # emptyDir is destroyed with the pod: a node replacement empties the
      # cache and the server rewarms it from the object store on next read.
      # That is why the pool carries a disruption budget of one node at a
      # time. See docs/deployment/storage.md.
      volume: pvc
      # Cache parts as they are written, not only as they are read -- the default
      # false leaves every just-ingested part out of the cache, and hunts over
      # recent data are the primary read.
      onWriteOperations: true
      # Cache ceiling as a fraction of the PVC, so the cache grows with the volume
      # instead of needing a second edit; ClickHouse refuses max_size and this
      # ratio together, so cacheSize above wins whenever it is set. Meaningless
      # under cache.volume: instance-store, which always sets cacheSize.
      maxSizeRatioToTotalSpace: 0.6
      # Free fraction the cache keeps ahead of demand in the background; the
      # server default of 0 disables background eviction entirely.
      keepFreeSpaceSizeRatio: 0.05
      # Load the cache metadata after the server opens its ports, so a large cache
      # does not hold startup while it is walked.
      loadMetadataAsynchronously: true
      # cache_hits_threshold is deliberately NOT set: it is a deprecated no-op in
      # 26.3 (FileCacheSettings.cpp "Deprecated setting").
    # Empty leaves the server default. GCS rejects the batch-delete call, so a
    # deployment against a GCS endpoint sets this false.
    supportBatchDelete: ""
    secretName: dfe-clickhouse-s3
    secretStoreName: dfe-secret-store
    # Where the credential sits in the store. Empty derives the DFE-seeded path
    # <project>/<env>/clickhouse/s3, which is frozen: moving it would strand a
    # deployment that seeded there and never set this. Set it to reuse an
    # existing entry, e.g. services/minio on a store mounting kv.
    remoteKey: ""
    # Field names within that entry.
    accessKeyProperty: access_key_id
    secretKeyProperty: secret_access_key
    # Bound how long a read blocks when the store is unreachable. Left unset the
    # server retries for minutes: a read blocked over nine minutes on the rig,
    # and 1 / 2000 / 5000 brought the same failure down to 10.4 seconds. Those
    # numbers are a demonstration, not a recommendation -- one retry is
    # aggressive against real S3, which returns transient 5xx routinely. What
    # they must not stay is unbounded, because a nine-minute stall on a
    # dashboard is indistinguishable from an outage.
    retryAttempts: ""
    connectTimeoutMs: ""
    requestTimeoutMs: ""
  # Cold tier for storageModel: tiered-block. The HOT tier is clickhouse.storage
  # below -- point its storageClass at the SSD class and size it for the working
  # set. Both volumes must be durable: tiering MOVES parts, so the cold volume
  # holds the only copy of what it carries, unlike the cached-object cache.
  # Decided at deploy and refused afterwards, like the model itself -- the
  # operator takes no new disk on an existing ClickHouseCluster, and the engine
  # holds clickhouse.tieredBlock.* as a protected var. Rationale and the
  # verification queries: docs/deployment/clickhouse-tiering.md
  tieredBlock:
    # Names the PVC template, the mount, the disk and the cold volume. Must sort
    # after "default": volume order is tier priority and the API server
    # re-serialises the policy with sorted keys, so a name like "cold" would
    # silently make the bulk volume the hot tier. The chart fails the render on
    # a name that does not sort correctly.
    coldName: slow
    coldSize: 1Ti
    coldStorageClass: ""
    # Free fraction of the HOT volume below which the oldest parts are demoted
    # to the cold volume. Policy-level, so it needs no per-table DDL. Proven on
    # two real devices: at a hot free ratio of 0.91, 0.95 demoted and 0.2 did not.
    moveFactor: 0.2
  storage:
    # With storageModel: tiered-block this volume is the HOT tier -- point
    # storageClass at the SSD class and size it for the working set.
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  # Server settings, written through the operator CR's settings.extraConfig and
  # so CLUSTER MODE ONLY -- single mode runs no operator, and its 2-core shape is
  # what the thread and pool figures below would starve.
  #
  # Deliberately NOT set here: parts_to_delay_insert / parts_to_throw_insert /
  # max_parts_in_total, whose 26.3 defaults (1000 / 3000 / 100000) self-disable
  # above a 1 GiB average part size, so raising them hides a partition-key fault
  # instead of fixing it; and max_server_memory_usage, which ClickHouse already
  # derives from the cgroup limit.
  serverProfile:
    # Concurrent query threads as a multiple of the container's cores -- the
    # default 0 is unbounded, and hunts, engine queries and merges share a node.
    concurrentThreadsSoftLimitRatioToCores: 2
    # Fraction of container RAM the server may use: 0.9 of a cgroup limit is an
    # OOMKill rather than a graceful MEMORY_LIMIT_EXCEEDED.
    maxServerMemoryUsageToRamRatio: 0.8
    # Floor for the background merge and mutation pool -- ClickHouse's own
    # default, and enough for the small replica shapes.
    backgroundPoolSizeFloor: 16
    # Merge threads per CPU core of the replica's request, so a 24-core node
    # merges with 48 threads rather than sitting on the fixed floor.
    backgroundPoolSizePerCore: 2
  # User-profile settings, written into the `default` profile every identity
  # inherits. Both modes get these: async_insert is user/query scope with no
  # table-level form, and the loader sets no per-query settings, so this profile
  # is the only place they can land. async_insert_max_data_size and
  # async_insert_busy_timeout_ms stay unset -- the compiled 10 MiB buffer and the
  # adaptive timeout (24.2+) are the tuned values.
  userProfile:
    # Server-side async inserts for every writer. A shipped default since 26.2,
    # pinned here against a `compatibility` setting or a future re-default.
    asyncInsert: 1
    # The client waits for the flush, so an insert error still reaches it. Also a
    # shipped default since 26.2, and 0 is refused at render time: the loader
    # would commit a Kafka offset on an ack it never earned.
    waitForAsyncInsert: 1
  users:
    # The one credential the deploy layer owns, named `default` on every target.
    # Only `default` can take its password from a Secret
    # (settings.defaultUserPassword); any other name needs it inline in the CR.
    # Every other user, role and policy is engine governance -- see
    # docs/CLICKHOUSE-IDENTITY.md.
    admin:
      name: default
      secretName: clickhouse-admin-password
