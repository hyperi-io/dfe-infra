project: dfe
component: clickhouse
env: local
cloud: local

clickhouse:
  # Deployment mode (DFE owns its data layer; deploy unless external given):
  #   cluster  -> ClickHouseCluster (operator) + DFE-owned Keeper, ReplicatedMergeTree
  #   single   -> standalone clickhouse-server, no Keeper, MergeTree (small/test)
  #   external -> deploy nothing; connect to a supplied CH (BYO / ClickHouse Cloud)
  # Profile sets the default (scale->cluster, standard->single); deployer overrides.
  #
  # OPERATOR TARGETS (full matrix + history: docs/deployment/clickhouse.md):
  # cluster mode targets the OFFICIAL ClickHouse operator; external covers
  # ClickHouse Cloud/BYO -- the two main public targets. The HyperI private
  # cloud can swap this chart + operator for the internal n-tier cached
  # operator + CH fork (SSD cache over spinning disk; not referenced by name
  # here -- public repo). The Altinity operator is NOT tested with this stack.
  mode: cluster
  name: dfe-clickhouse
  version: "26.3.13.31"
  # Cluster-mode node count. Defaults to 3; set higher for more nodes.
  # (single mode ignores this -- it is always 1 standalone pod.)
  replicas: 3
  shardsCount: 1
  # Spread cluster pods evenly across k8s workers (best-effort: ScheduleAnyway,
  # so it never blocks scheduling when workers < replicas).
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  database: dfe
  # Keeper reference for cluster mode -- DFE deploys its OWN keeper (below),
  # self-contained. Do NOT point at another product's keeper.
  keeperClusterRef:
    name: dfe-keeper
  # DFE-owned Keeper (cluster mode only).
  keeper:
    name: dfe-keeper
    replicas: 3
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "26.7.1.1315"
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
  # External CH (mode=external): connect to a supplied endpoint; deploy nothing.
  # Password materialised by ESO from Vault <project>/<env>/clickhouse/external.
  external:
    host: ""
    port: 8123
    user: default
    secretName: dfe-clickhouse-external
    secretStoreName: dfe-secret-store
  storage:
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  users:
    # Default admin user (password via ESO secret)
    admin:
      name: admin
      secretName: clickhouse-admin-password
    # DFE loader role (async insert, limited permissions)
    loader:
      name: dfe_loader_role
      databases: ["dfe"]
    # DFE query role (read-only for hunts)
    query:
      name: dfe_query_role
      databases: ["dfe"]
