project: dfe
component: clickhouse
env: local
cloud: local

# Namespace the DFE apps run in, supplied by the appset from the cluster's
# dfe.hyperi.io/dfe_namespace annotation. Empty -> the app-namespace credential
# copy is skipped, and the apps have no way to authenticate.
appNamespace: ""

# Further namespaces the admin credential is projected into (same ESO copy as
# appNamespace). The otel collector's ClickHouse exporter authenticates with it.
extraCredentialNamespaces:
  - otel

clickhouse:
  # Deployment mode (DFE owns its data layer; deploy unless external given):
  #   cluster  -> ClickHouseCluster (operator) + DFE-owned Keeper, ReplicatedMergeTree
  #   single   -> standalone clickhouse-server, no Keeper, MergeTree (small/test)
  #   external -> deploy nothing; connect to a supplied CH (BYO / ClickHouse Cloud)
  # Profile sets the default (scale->cluster, standard->single); deployer overrides.
  #
  # OPERATOR TARGETS (full matrix + history: docs/deployment/clickhouse.md):
  # cluster mode targets the OFFICIAL ClickHouse operator; external covers
  # ClickHouse Cloud/BYO -- the two main public targets. The HyperI private
  # cloud can swap this chart + operator for the internal n-tier cached
  # operator + CH fork (SSD cache over spinning disk; not referenced by name
  # here -- public repo). The Altinity operator is NOT tested with this stack.
  mode: cluster
  name: dfe-clickhouse
  version: "26.3.17.56"
  # Cluster-mode node count. Defaults to 3; set higher for more nodes.
  # (single mode ignores this -- it is always 1 standalone pod.)
  replicas: 3
  shardsCount: 1
  # Spread cluster pods evenly across k8s workers (best-effort: ScheduleAnyway,
  # so it never blocks scheduling when workers < replicas).
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  database: dfe
  # Keeper reference for cluster mode -- DFE deploys its OWN keeper (below),
  # self-contained. Do NOT point at another product's keeper.
  keeperClusterRef:
    name: dfe-keeper
  # DFE-owned Keeper (cluster mode only).
  keeper:
    name: dfe-keeper
    replicas: 3
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "26.3.17.56"
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
  # External CH (mode=external): connect to a supplied endpoint; deploy nothing.
  # Password materialised by ESO from Vault <project>/<env>/clickhouse/external.
  external:
    host: ""
    port: 8123
    user: default
    secretName: dfe-clickhouse-external
    secretStoreName: dfe-secret-store
  storage:
    size: 50Gi
    # With tiering enabled this is the HOT tier -- point it at the SSD class.
    storageClass: ""
  # SSD tiering over the bulk store (cluster mode only). Opt-in, off by default,
  # and fixed at cluster CREATION: the operator takes no new disk on an existing
  # cluster. Rationale and rollout: docs/deployment/clickhouse-tiering.md.
  #
  #   off   -> one volume from dataVolumeClaimSpec
  #   tier  -> hot SSD volume + cold bulk volume, parts demoted as hot fills
  #   cache -> bulk on object storage, filesystem cache on an SSD volume
  #
  # ClickHouse cannot cache one local disk on another, so `tier` is the only
  # option over block storage; `cache` needs a real object store.
  tiering:
    mode: "off"

    # mode: tier. Data MOVES between volumes, so both must be durable.
    cold:
      # Names the PVC template, the mount, the disk, and the cold volume.
      # Must sort after "default", else the tiers invert silently; the chart
      # fails the render if it does not.
      name: slow
      size: 1Ti
      storageClass: ""
    # Fraction of the hot volume kept free before parts are demoted to cold.
    # Policy-level, so it applies without any table DDL.
    moveFactor: 0.2

    # mode: cache. The cache is disposable; the bucket holds the durable copy.
    bulkDiskName: bulk
    cache:
      name: fscache
      size: 500Gi
      # Keep below the volume size so eviction has headroom.
      maxSize: 450Gi
      storageClass: ""
      # Populates the cache on write, which ties INSERT success to cache health.
      cacheOnWrite: false
    objectStorage:
      # s3 only, which also covers GCS via its S3-compatible endpoint.
      # azure_blob_storage takes a different set of config keys and is not
      # wired up yet.
      type: s3
      endpoint: ""
      # Credentials reach the server as env vars and are read via "@from_env",
      # so they never land in the CR or the rendered config.
      secretName: dfe-clickhouse-object-storage
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
      # GCS rejects batch delete; set false against a GCS endpoint.
      supportBatchDelete: true
      # Request-rate ceilings, empty to leave ClickHouse's defaults alone.
      maxGetRps: ""
      maxPutRps: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  users:
    # The one credential the deploy layer owns, named `default` on every target.
    # Only `default` can take its password from a Secret
    # (settings.defaultUserPassword); any other name needs it inline in the CR.
    # Every other user, role and policy is engine governance -- see
    # docs/CLICKHOUSE-IDENTITY.md.
    admin:
      name: default
      secretName: clickhouse-admin-password
