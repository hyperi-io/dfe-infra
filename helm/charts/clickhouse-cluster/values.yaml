project: dfe
component: clickhouse
env: local
cloud: local

# Namespace the DFE apps run in, supplied by the appset from the cluster's
# dfe.hyperi.io/dfe_namespace annotation. Empty -> the app-namespace credential
# copy is skipped, and the apps have no way to authenticate.
appNamespace: ""

# Further namespaces the admin credential is projected into (same ESO copy as
# appNamespace). The otel collector's ClickHouse exporter authenticates with it.
extraCredentialNamespaces:
  - otel

clickhouse:
  # Deployment mode (DFE owns its data layer; deploy unless external given):
  #   cluster  -> ClickHouseCluster (operator) + DFE-owned Keeper, ReplicatedMergeTree
  #   single   -> standalone clickhouse-server, no Keeper, MergeTree (small/test)
  #   external -> deploy nothing; connect to a supplied CH (BYO / ClickHouse Cloud)
  # Profile sets the default (scale->cluster, standard->single); deployer overrides.
  #
  # OPERATOR TARGETS (full matrix + history: docs/deployment/clickhouse.md):
  # cluster mode targets the OFFICIAL ClickHouse operator; external covers
  # ClickHouse Cloud/BYO -- the two main public targets. The HyperI private
  # cloud can swap this chart + operator for the internal n-tier cached
  # operator + CH fork (SSD cache over spinning disk; not referenced by name
  # here -- public repo). The Altinity operator is NOT tested with this stack.
  mode: cluster
  name: dfe-clickhouse
  version: "26.3.17.56"
  # Cluster-mode node count. Defaults to 3; set higher for more nodes.
  # (single mode ignores this -- it is always 1 standalone pod.)
  replicas: 3
  shardsCount: 1
  # Spread cluster pods evenly across k8s workers (best-effort: ScheduleAnyway,
  # so it never blocks scheduling when workers < replicas).
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  database: dfe
  # Keeper reference for cluster mode -- DFE deploys its OWN keeper (below),
  # self-contained. Do NOT point at another product's keeper.
  keeperClusterRef:
    name: dfe-keeper
  # DFE-owned Keeper (cluster mode only).
  keeper:
    name: dfe-keeper
    replicas: 3
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "26.3.17.56"
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
  # External CH (mode=external): connect to a supplied endpoint; deploy nothing.
  # Password materialised by ESO from Vault <project>/<env>/clickhouse/external.
  external:
    host: ""
    port: 8123
    user: default
    secretName: dfe-clickhouse-external
    secretStoreName: dfe-secret-store
  # Storage model, decided at deploy and refused afterwards (the engine holds
  # clickhouse.storageModel as a protected var):
  #   local     -> parts live on the PVC, which is the capacity ceiling. Growing
  #                it needs allowVolumeExpansion on the StorageClass and a
  #                StatefulSet recreate (volumeClaimTemplates are immutable).
  #   s3backed  -> parts live on an object-store disk fronted by a local
  #                read-through cache, so the PVC sizes the cache and the part
  #                metadata rather than the data.
  # Applies to both cluster and single mode; external mode owns its own storage.
  storageModel: local
  # Object store for storageModel: s3backed. Credentials NEVER appear here --
  # the server reads them from the environment, wired from a Secret the secrets
  # store materialises (externalsecret-s3.yaml), the same seam mode=external uses.
  s3:
    # Full disk endpoint including bucket and path prefix, trailing slash
    # required, e.g. https://my-bucket.s3.ap-southeast-2.amazonaws.com/clickhouse/
    endpoint: ""
    region: ""
    # Local read-through cache in front of the object store. Sized BELOW
    # storage.size -- the cache and the part metadata share that PVC.
    cacheSize: 20Gi
    secretName: dfe-clickhouse-s3
    secretStoreName: dfe-secret-store
  storage:
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  users:
    # The one credential the deploy layer owns, named `default` on every target.
    # Only `default` can take its password from a Secret
    # (settings.defaultUserPassword); any other name needs it inline in the CR.
    # Every other user, role and policy is engine governance -- see
    # docs/CLICKHOUSE-IDENTITY.md.
    admin:
      name: default
      secretName: clickhouse-admin-password
