{{- if eq .Values.clickhouse.mode "single" }}
{{- $tls := include "dfe-clickhouse.tlsEnabled" . }}
# Standalone single-node ClickHouse (no operator). For small/test. Keeper runs
# embedded in the server and the server declares a cluster of one, so the
# engine's Replicated DDL lands here exactly as it does in cluster mode.
# Admin user/db created on first start via the official image's entrypoint env.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
    {{- if $tls }}
    - name: https
      port: 8443
      targetPort: https
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.clickhouse.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.clickhouse.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
    spec:
      {{- with .Values.clickhouse.serviceAccount.name }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      securityContext:
        fsGroup: 101            # clickhouse uid/gid in the official image
      containers:
        - name: clickhouse
          image: "clickhouse/clickhouse-server:{{ .Values.clickhouse.version }}{{ with .Values.clickhouse.imageDigest }}@{{ . }}{{ end }}"
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
            {{- if $tls }}
            - name: https
              containerPort: 8443
            {{- end }}
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.users.admin.name | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.users.admin.secretName }}
                  key: password
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            # The embedded Keeper's digest identity. Every znode the server creates
            # is readable with it alone, so a pod that reaches 9181 cannot write a
            # SQL user into the access storage.
            - name: DFE_KEEPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.name }}-keeper-identity
                  key: password
            - name: DFE_KEEPER_IDENTITY
              value: "dfe:$(DFE_KEEPER_PASSWORD)"
            {{- if and (eq (include "dfe-clickhouse.storageBulk" .) "object") (not .Values.clickhouse.objectStore.usePodIdentity) }}
            {{- include "dfe-clickhouse.objectStoreEnv" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            # Server config.d overlay: allow the SQL_ custom-settings prefix so
            # DFE tenant-isolation row policies can read
            # getSetting('SQL_current_tenant_id'). See the ConfigMap below.
            - name: custom-config
              mountPath: /etc/clickhouse-server/config.d/dfe-custom.xml
              subPath: dfe-custom.xml
            # config.d overlay: embedded Keeper, the macros, a one-node cluster and
            # SQL users in Keeper. See dfe-replication.xml in the ConfigMap below.
            - name: custom-config
              mountPath: /etc/clickhouse-server/config.d/dfe-replication.xml
              subPath: dfe-replication.xml
            # Over the image's file of that name, so Keeper, raft and interserver
            # stay on loopback. See dfe-listen.xml in the ConfigMap below.
            - name: custom-config
              mountPath: /etc/clickhouse-server/config.d/docker_related_config.xml
              subPath: dfe-listen.xml
            # users.d overlay: async inserts for every writer via the default
            # settings profile (async_insert has no table-level form).
            - name: custom-config
              mountPath: /etc/clickhouse-server/users.d/dfe-users.xml
              subPath: dfe-users.xml
            # config.d overlay: level and rotation for the server log, which
            # lands in this container's writable layer on the node's disk.
            - name: custom-config
              mountPath: /etc/clickhouse-server/config.d/dfe-logger.yaml
              subPath: dfe-logger.yaml
            {{- if (include "dfe-clickhouse.systemLogs" . | trim) }}
            # config.d overlay: the server's own system log tables, TTLs and switches.
            - name: custom-config
              mountPath: /etc/clickhouse-server/config.d/dfe-system-logs.yaml
              subPath: dfe-system-logs.yaml
            {{- end }}
            {{- if eq (include "dfe-clickhouse.storageBulk" .) "block" }}
            # The cold tier, on the mount path the disk declaration names. Same
            # path the operator uses for an additional volume in cluster mode.
            - name: {{ .Values.clickhouse.tieredBlock.coldName }}
              mountPath: /var/lib/clickhouse/disks/{{ .Values.clickhouse.tieredBlock.coldName }}
            {{- end }}
            {{- if (include "dfe-clickhouse.storageFamily" .) }}
            # config.d takes YAML as well as XML, so the disks and policies are
            # the same fragment cluster mode passes through the operator CR.
            - name: custom-config
              mountPath: /etc/clickhouse-server/config.d/dfe-storage.yaml
              subPath: dfe-storage.yaml
            {{- end }}
            {{- if $tls }}
            # config.d overlay: the HTTPS listener and the keypair it serves.
            - name: custom-config
              mountPath: /etc/clickhouse-server/config.d/dfe-tls.xml
              subPath: dfe-tls.xml
            # A directory, never a subPath, so a renewed Secret reaches the server.
            - name: tls
              mountPath: /etc/clickhouse-server/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: custom-config
          configMap:
            name: {{ .Values.clickhouse.name }}-custom-config
        {{- if $tls }}
        # 0440 under fsGroup 101: the server's own group reads the key, nobody else.
        - name: tls
          secret:
            secretName: {{ .Values.clickhouse.tls.secretName }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
  volumeClaimTemplates:
    # storageModel: tiered-block makes this the HOT tier -- it holds the only
    # copy of the parts that have not been demoted.
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.clickhouse.storage.storageClass | default .Values.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage.size }}
    {{- if eq (include "dfe-clickhouse.storageBulk" .) "block" }}
    # The cold tier. Also durable: tiering moves parts rather than copying them.
    - metadata:
        name: {{ .Values.clickhouse.tieredBlock.coldName }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.clickhouse.tieredBlock.coldStorageClass | default .Values.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.tieredBlock.coldSize }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.clickhouse.name }}-custom-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  # Allow the SQL_ custom-settings prefix (server config) so DFE tenant isolation
  # enforces. SQL_ is ClickHouse Cloud's built-in prefix; this self-hosted
  # single-node CH must allow it here so the per-_org_id row policy can read
  # getSetting('SQL_current_tenant_id'). Mounted into config.d by the StatefulSet.
  #
  # The system database is deny-by-default, so an org-fenced tenant cannot read
  # server metadata no row policy covers; dfe-engine grants back only what the
  # embedded HyperDX needs (governance/ch/models.py TENANT_SYSTEM_TABLES).
  dfe-custom.xml: |
    <clickhouse>
      <custom_settings_prefixes>SQL_</custom_settings_prefixes>
      <access_control_improvements>
        <select_from_system_db_requires_grant>true</select_from_system_db_requires_grant>
        <select_from_information_schema_requires_grant>true</select_from_information_schema_requires_grant>
      </access_control_improvements>
    </clickhouse>
  # What the engine's Replicated DDL needs, as a cluster of one: embedded Keeper,
  # the {cluster}/{shard}/{replica} macros, the cluster {cluster} names, and SQL
  # users and roles in Keeper. user_directories REPLACES the image's list, because
  # an appended <replicated> sits behind local_directory, which then takes every
  # role the engine creates. Keeper's log and snapshots share the data PVC with the
  # tables. The identity is hidden, or preprocessed_configs holds it in clear.
  # 127.0.0.1, not localhost: Keeper binds IPv4 loopback, and localhost resolves
  # to ::1 alone on some clusters.
  dfe-replication.xml: |
    <clickhouse>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <four_letter_word_white_list>{{ .Values.clickhouse.keeper.fourLetterWords }}</four_letter_word_white_list>
        <raft_configuration>
          <server><id>1</id><hostname>127.0.0.1</hostname><port>9234</port></server>
        </raft_configuration>
      </keeper_server>
      <zookeeper>
        <node><host>127.0.0.1</host><port>9181</port></node>
        <identity from_env="DFE_KEEPER_IDENTITY" hide_in_preprocessed="1"/>
      </zookeeper>
      <macros><cluster>dfe</cluster><shard>01</shard><replica>r1</replica></macros>
      <remote_servers>
        <dfe><shard><internal_replication>true</internal_replication><replica><host>127.0.0.1</host><port>9000</port></replica></shard></dfe>
      </remote_servers>
      <user_directories replace="replace">
        <users_xml><path>users.xml</path></users_xml>
        <replicated><zookeeper_path>/clickhouse/access/</zookeeper_path></replicated>
      </user_directories>
    </clickhouse>
  # Mounted over the image's own docker_related_config.xml, which opens every port
  # on every interface. Keeper (9181) binds listen_host. Raft (9234) and interserver
  # (9009) bind interserver_listen_host, and raft binds every interface when that is
  # unset. All three stay on loopback, so no other pod reaches them. Only the client
  # protocols below listen on the pod's address.
  dfe-listen.xml: |
    <clickhouse>
      <listen_host>127.0.0.1</listen_host>
      <listen_try>1</listen_try>
      <interserver_listen_host>127.0.0.1</interserver_listen_host>
      <http_port remove="remove"/>
      <tcp_port remove="remove"/>
      <!-- The client listeners are IPv4 only: a :: entry fails with EAI in docker and EADDRINUSE on kind. -->
      <protocols>
        <http><type>http</type><host>0.0.0.0</host><port>8123</port><description>http</description></http>
        <tcp><type>tcp</type><host>0.0.0.0</host><port>9000</port><description>native protocol</description></tcp>
      </protocols>
    </clickhouse>
  # users.d overlay: async inserts for EVERY writer, via the default settings
  # profile (the base every identity inherits). async_insert is user/query-scope
  # -- no table-level form exists -- so this one profile covers every table any
  # identity writes; the loader's minted profile still carries its own tuned
  # values on top. Both are ClickHouse's own defaults since 26.2 and are written
  # here EXPLICITLY, against a `compatibility` setting or a future re-default.
  # Flush cadence stays on ClickHouse's adaptive defaults (24.2+).
  dfe-users.xml: |
    <clickhouse>
      <profiles>
        <default>
          <async_insert>{{ .Values.clickhouse.userProfile.asyncInsert }}</async_insert>
          <wait_for_async_insert>{{ .Values.clickhouse.userProfile.waitForAsyncInsert }}</wait_for_async_insert>
        </default>
      </profiles>
    </clickhouse>
  # Merged over the image's own <logger>, which keeps its file paths and takes
  # the level and rotation from clickhouse.serverLog.
  dfe-logger.yaml: |
    logger:
      {{- include "dfe-clickhouse.logger" .Values.clickhouse.serverLog | nindent 6 }}
  {{- with (include "dfe-clickhouse.systemLogs" . | trim) }}
  # Merged over the image's own system log sections, which keep their
  # partitioning and flush settings, take a TTL from clickhouse.systemLogTTLDays,
  # and lose the sections clickhouse.systemLogsOff names.
  dfe-system-logs.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with (include "dfe-clickhouse.storageConfiguration" .) }}
  dfe-storage.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- if $tls }}
  # Merged over the image's own <openSSL>, which keeps its protocol and
  # verification defaults and takes the keypair from the mounted Secret. HTTPS is
  # a protocol with its own host, because https_port would bind loopback only
  # (dfe-listen.xml).
  dfe-tls.xml: |
    <clickhouse>
      <protocols>
        <https><type>tls</type><impl>http</impl><host>0.0.0.0</host><port>8443</port><description>https</description></https>
      </protocols>
      <openSSL>
        <server>
          <certificateFile>/etc/clickhouse-server/tls/tls.crt</certificateFile>
          <privateKeyFile>/etc/clickhouse-server/tls/tls.key</privateKeyFile>
        </server>
      </openSSL>
    </clickhouse>
  {{- end }}
{{- end }}
