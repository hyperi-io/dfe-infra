{{- if eq .Values.clickhouse.mode "cluster" }}
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: {{ .Values.clickhouse.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  shards: {{ .Values.clickhouse.shardsCount }}
  replicas: {{ .Values.clickhouse.replicas }}
  containerTemplate:
    # The operator drops `hash` whenever a tag is set, so the digest rides in the tag.
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: "{{ .Values.clickhouse.version }}{{ with .Values.clickhouse.imageDigest }}@{{ . }}{{ end }}"
    resources:
      requests:
        cpu: {{ .Values.clickhouse.resources.requests.cpu }}
        memory: {{ .Values.clickhouse.resources.requests.memory }}
      limits:
        cpu: {{ .Values.clickhouse.resources.limits.cpu }}
        memory: {{ .Values.clickhouse.resources.limits.memory }}
    {{- if and (eq (include "dfe-clickhouse.storageBulk" .) "object") (not .Values.clickhouse.objectStore.usePodIdentity) }}
    env:
      {{- include "dfe-clickhouse.objectStoreEnv" . | nindent 6 }}
    {{- end }}
    {{- if eq (include "dfe-clickhouse.cacheVolume" .) "instance-store" }}
    # Outside the data PVC. dfe-clickhouse.instanceStoreCacheMount says why.
    volumeMounts:
      - name: object-cache
        mountPath: {{ include "dfe-clickhouse.instanceStoreCacheMount" . }}
    {{- end }}
  # Durable in every model: the hot tier's only copy of its parts, or the map from paths to object blobs.
  dataVolumeClaimSpec:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: {{ .Values.clickhouse.storage.size }}
    {{- with (.Values.clickhouse.storage.storageClass | default .Values.storageClass) }}
    storageClassName: {{ . | quote }}
    {{- end }}
  {{- if eq (include "dfe-clickhouse.storageBulk" .) "block" }}
  # The operator mounts each entry at /var/lib/clickhouse/disks/<name> and registers a disk of that name.
  additionalVolumeClaimTemplates:
    - metadata:
        name: {{ .Values.clickhouse.tieredBlock.coldName }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.clickhouse.tieredBlock.coldSize }}
        {{- with (.Values.clickhouse.tieredBlock.coldStorageClass | default .Values.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
  keeperClusterRef:
    name: {{ .Values.clickhouse.keeperClusterRef.name | default "dfe-keeper" }}
  settings:
    logger:
      {{- include "dfe-clickhouse.logger" .Values.clickhouse.serverLog | nindent 6 }}
    {{- if include "dfe-clickhouse.tlsEnabled" . }}
    tls:
      enabled: true
      required: {{ .Values.clickhouse.tls.required }}
      serverCertSecret:
        name: {{ .Values.clickhouse.tls.secretName }}
    {{- end }}
    extraConfig:
      # Tenant isolation needs SQL_. custom_ must stay: the operator injects custom_operator_reload_revision.
      # docs/deployment/clickhouse.md, Server and Keeper settings.
      custom_settings_prefixes: SQL_,custom_
      access_control_improvements:
        select_from_system_db_requires_grant: true
        select_from_information_schema_requires_grant: true
      {{- with (include "dfe-clickhouse.storageConfiguration" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- /* Cluster mode only, gated in the helper. */ -}}
      {{- with (include "dfe-clickhouse.serverProfile" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "dfe-clickhouse.systemLogs" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
    # docs/deployment/clickhouse.md, Server and Keeper settings.
    extraUsersConfig:
      profiles:
        default:
          async_insert: {{ .Values.clickhouse.userProfile.asyncInsert }}
          wait_for_async_insert: {{ .Values.clickhouse.userProfile.waitForAsyncInsert }}
    # Secret-backed: extraUsersConfig takes a password only inline, which would commit it to git.
    defaultUserPassword:
      secret:
        name: {{ .Values.clickhouse.users.admin.secretName }}
        key: password
  {{- $cacheOnInstanceStore := eq (include "dfe-clickhouse.cacheVolume" .) "instance-store" }}
  {{- if or .Values.nodeScheduling .Values.clickhouse.podSpread.enabled $cacheOnInstanceStore .Values.clickhouse.serviceAccount.name }}
  podTemplate:
    {{- with .Values.clickhouse.serviceAccount.name }}
    serviceAccountName: {{ . }}
    {{- end }}
    {{- /* instance-store requires the clickhouse pool, the only one with the NVMe. */ -}}
    {{- with include "dfe-clickhouse.poolSelector" (dict "root" $ "pool" "clickhouse" "always" $cacheOnInstanceStore) | fromYaml }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if and .Values.nodeScheduling .Values.nodeScheduling.tolerations }}
    tolerations:
      {{- toYaml .Values.nodeScheduling.tolerations | nindent 6 }}
    {{- end }}
    {{- if .Values.clickhouse.podSpread.enabled }}
    {{- /* The operator's labels on server pods. matchLabelKeys counts each pod's own shard. */}}
    topologySpreadConstraints:
      - maxSkew: {{ .Values.clickhouse.podSpread.maxSkew }}
        topologyKey: {{ .Values.clickhouse.podSpread.topologyKey }}
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: {{ printf "%s-clickhouse" .Values.clickhouse.name | quote }}
            clickhouse.com/role: clickhouse-server
        matchLabelKeys:
          - clickhouse.com/shard-id
    {{- end }}
    {{- if $cacheOnInstanceStore }}
    volumes:
      # The cache disk's backing store. Its max_size is a fraction of this limit (templates/_storage.tpl).
      - name: object-cache
        emptyDir:
          sizeLimit: {{ .Values.clickhouse.objectStore.cacheSize | quote }}
    {{- end }}
  {{- end }}
{{- end }}
