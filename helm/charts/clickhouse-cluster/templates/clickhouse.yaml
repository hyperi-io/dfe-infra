{{- if eq .Values.clickhouse.mode "cluster" }}
# ZOMBIE-PROBE NOTE (dfe-infra#4.2): the official ClickHouse operator's DEFAULT
# readiness probe is `exec: bash -c "wget -qO- :8123 | grep -o Ok."` at
# periodSeconds=1 -- a shell pipe whose children are NOT reaped by clickhouse-
# server (PID 1), so every probe cycle leaks 2 zombies. The v0.0.5 CRD exposes NO
# probe override (no containerTemplate.*Probe, no podTemplate.spec.containers), so
# we CANNOT fix it from this CR. single mode (clickhouse-single.yaml) already uses
# httpGet /ping and is zombie-free -- that is the slim/single default. For cluster
# mode the fix is an OPERATOR bump to a version that defaults to httpGet (or runs a
# reaping init); tracked as a flagged follow-up, not fixable here.
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: {{ .Values.clickhouse.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  shards: {{ .Values.clickhouse.shardsCount }}
  replicas: {{ .Values.clickhouse.replicas }}
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: {{ .Values.clickhouse.version | quote }}
    resources:
      requests:
        cpu: {{ .Values.clickhouse.resources.requests.cpu }}
        memory: {{ .Values.clickhouse.resources.requests.memory }}
      limits:
        cpu: {{ .Values.clickhouse.resources.limits.cpu }}
        memory: {{ .Values.clickhouse.resources.limits.memory }}
  dataVolumeClaimSpec:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: {{ .Values.clickhouse.storage.size }}
    {{- if .Values.clickhouse.storage.storageClass }}
    storageClassName: {{ .Values.clickhouse.storage.storageClass }}
    {{- end }}
  keeperClusterRef:
    name: {{ .Values.clickhouse.keeperClusterRef.name | default "dfe-keeper" }}
  settings:
    extraConfig:
      {{- if .Values.clickhouse.prometheus.enabled }}
      # ClickHouse's NATIVE Prometheus exposition -- the datastore holds itself to the
      # same rule as the DFE services: expose /metrics for scrape AND let the OTel
      # destination take a copy (the deployed otel-collector scrapes this and forwards
      # to whatever telemetry.mode resolves). No exporter sidecar, no upstream hack --
      # ClickHouse has shipped this for years and it was simply never turned on, so the
      # busiest component in the stack reported nothing.
      #
      # Both halves, deliberately: the observability world is still split, and DFE is a
      # product other orgs deploy -- one wants CloudWatch, one runs Prometheus, ours
      # uses HyperDX. See helm/library/dfe-common/templates/_telemetry.tpl.
      prometheus:
        endpoint: {{ .Values.clickhouse.prometheus.path | quote }}
        port: {{ .Values.clickhouse.prometheus.port }}
        # The three families worth having: counters, event deltas, and the async
        # gauges (parts, replication lag, memory) -- replication lag being the one
        # that would have SHOUTED about the split brain we found by hand.
        metrics: true
        events: true
        asynchronous_metrics: true
        errors: true
      {{- end }}
      # Allow the SQL_ custom-settings prefix (server config) so DFE tenant
      # isolation enforces: the per-_org_id RESTRICTIVE row policy reads
      # getSetting('SQL_current_tenant_id') and the engine injects it per query.
      # SQL_ is ClickHouse Cloud's built-in prefix; this self-hosted cluster must
      # allow it here, else CH rejects every SQL_* setting and tenant scoping
      # silently cannot apply. See dfe-engine governance/ch/models.py TENANT_SETTING.
      custom_settings_prefixes: SQL_
      users:
        {{ .Values.clickhouse.users.loader.name }}:
          profile: default
          grants:
            - query: "GRANT ALL ON {{ .Values.clickhouse.database }}.*"
        {{ .Values.clickhouse.users.query.name }}:
          profile: readonly
          grants:
            - query: "GRANT SELECT ON {{ .Values.clickhouse.database }}.*"
  {{- if or .Values.nodeScheduling .Values.clickhouse.podSpread.enabled }}
  podTemplate:
    {{- if .Values.nodeScheduling }}
    {{- if .Values.nodeScheduling.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.nodeScheduling.nodeSelector | nindent 6 }}
    {{- end }}
    {{- if .Values.nodeScheduling.tolerations }}
    tolerations:
      {{- toYaml .Values.nodeScheduling.tolerations | nindent 6 }}
    {{- end }}
    {{- end }}
    {{- if .Values.clickhouse.podSpread.enabled }}
    topologySpreadConstraints:
      - maxSkew: {{ .Values.clickhouse.podSpread.maxSkew }}
        topologyKey: {{ .Values.clickhouse.podSpread.topologyKey }}
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            {{- include "dfe-common.selectorLabels" . | nindent 12 }}
    {{- end }}
  {{- end }}
{{- end }}
