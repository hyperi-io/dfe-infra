{{- if eq .Values.clickhouse.mode "cluster" }}
# CLUSTER-MODE CONFIG NOTE (dfe-infra#4.2): the earlier exit-231 crashloop here was
# NOT a zombie-probe leak (operator 0.0.7 uses httpGet /ping, verified). Its real
# cause was custom_settings_prefixes below rejecting the operator's injected
# custom_operator_reload_revision setting -> CANNOT_LOAD_CONFIG. Fixed by allowing
# the custom_ prefix (see settings.extraConfig). Keep both prefixes in cluster mode.
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: {{ .Values.clickhouse.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  shards: {{ .Values.clickhouse.shardsCount }}
  replicas: {{ .Values.clickhouse.replicas }}
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: {{ .Values.clickhouse.version | quote }}
    resources:
      requests:
        cpu: {{ .Values.clickhouse.resources.requests.cpu }}
        memory: {{ .Values.clickhouse.resources.requests.memory }}
      limits:
        cpu: {{ .Values.clickhouse.resources.limits.cpu }}
        memory: {{ .Values.clickhouse.resources.limits.memory }}
    {{- if eq (include "dfe-clickhouse.storageBulk" .) "object" }}
    env:
      {{- include "dfe-clickhouse.objectStoreEnv" . | nindent 6 }}
    {{- end }}
  # Must be durable in every storage model. Under a tiered family this is the HOT
  # tier and holds the only copy of the parts on it; under a cached family it
  # holds the map from ClickHouse paths to object blobs, which cannot be rebuilt
  # from the bucket.
  dataVolumeClaimSpec:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: {{ .Values.clickhouse.storage.size }}
    {{- with (.Values.clickhouse.storage.storageClass | default .Values.storageClass) }}
    storageClassName: {{ . | quote }}
    {{- end }}
  {{- if eq (include "dfe-clickhouse.storageBulk" .) "block" }}
  # The operator mounts each entry at /var/lib/clickhouse/disks/<name> and
  # registers a ClickHouse disk of the same name, which the ranked policy in
  # extraConfig then puts behind the hot volume. Fixed at cluster creation: the
  # CRD does not accept a new disk on an existing ClickHouseCluster.
  additionalVolumeClaimTemplates:
    - metadata:
        name: {{ .Values.clickhouse.tieredBlock.coldName }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.clickhouse.tieredBlock.coldSize }}
        {{- with (.Values.clickhouse.tieredBlock.coldStorageClass | default .Values.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
  keeperClusterRef:
    name: {{ .Values.clickhouse.keeperClusterRef.name | default "dfe-keeper" }}
  settings:
    extraConfig:
      # Allow the SQL_ custom-settings prefix (server config) so DFE tenant
      # isolation enforces: the per-_org_id RESTRICTIVE row policy reads
      # getSetting('SQL_current_tenant_id') and the engine injects it per query.
      # SQL_ is ClickHouse Cloud's built-in prefix; this self-hosted cluster must
      # allow it here, else CH rejects every SQL_* setting and tenant scoping
      # silently cannot apply. See dfe-engine governance/ch/models.py TENANT_SETTING.
      # custom_ is required in cluster mode: the ClickHouse operator injects
      # custom_operator_reload_revision into the __operator profile, and CH refuses
      # to load users.yaml (CANNOT_LOAD_CONFIG, crashloop) if that prefix is unallowed.
      custom_settings_prefixes: SQL_,custom_
      # The system database is deny-by-default, so an org-fenced tenant cannot read
      # server metadata no row policy covers; dfe-engine grants back only what the
      # embedded HyperDX needs (governance/ch/models.py TENANT_SYSTEM_TABLES).
      access_control_improvements:
        select_from_system_db_requires_grant: true
        select_from_information_schema_requires_grant: true
      {{- with (include "dfe-clickhouse.storageConfiguration" .) }}
      {{- . | nindent 6 }}
      {{- end }}
    # Server-side async inserts for EVERY writer, via the default settings
    # profile (the base every identity inherits). async_insert is a
    # user/query-scope setting -- there is no table-level form -- so this one
    # seam covers every table any identity writes; identities with tuned
    # values (dfe_loader's minted profile) still override it. wait=1 keeps
    # insert errors visible to the client instead of fire-and-forget. The
    # flush cadence stays on ClickHouse's adaptive defaults (24.2+).
    extraUsersConfig:
      profiles:
        default:
          async_insert: 1
          wait_for_async_insert: 1
    # The deploy layer's one credential. Cluster mode creates no account of its
    # own, so without this every app is refused with code 516 (dfe-infra#136).
    # Secret-backed rather than declared in extraUsersConfig, which takes a
    # password only inline and would commit it to git.
    defaultUserPassword:
      secret:
        name: {{ .Values.clickhouse.users.admin.secretName }}
        key: password
  {{- if or .Values.nodeScheduling .Values.clickhouse.podSpread.enabled }}
  podTemplate:
    {{- if .Values.nodeScheduling }}
    {{- if .Values.nodeScheduling.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.nodeScheduling.nodeSelector | nindent 6 }}
    {{- end }}
    {{- if .Values.nodeScheduling.tolerations }}
    tolerations:
      {{- toYaml .Values.nodeScheduling.tolerations | nindent 6 }}
    {{- end }}
    {{- end }}
    {{- if .Values.clickhouse.podSpread.enabled }}
    topologySpreadConstraints:
      - maxSkew: {{ .Values.clickhouse.podSpread.maxSkew }}
        topologyKey: {{ .Values.clickhouse.podSpread.topologyKey }}
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            {{- include "dfe-common.selectorLabels" . | nindent 12 }}
    {{- end }}
  {{- end }}
{{- end }}
