{{- if and (ne .Values.clickhouse.mode "external") .Values.appNamespace }}
{{- $caCopy := and (include "dfe-clickhouse.tlsEnabled" .) (dig "ca" "secretName" "" .Values.clickhouse.tls) }}
{{- $consumers := prepend (.Values.extraCredentialNamespaces | default list) .Values.appNamespace | uniq }}
# The admin credential, copied into the app namespace for dfe-engine. A generated value cannot be re-derived there, so ESO's kubernetes provider copies the one that exists.
# The ServiceAccount's Role names the only Secrets it may read. docs/deployment/clickhouse.md, Placement and identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.clickhouse.users.admin.secretName | quote }}
      {{- if $caCopy }}
      # The CA-only copy, never the keypair Secret (tls-ca.yaml).
      - {{ include "dfe-clickhouse.tlsCaSecret" . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clickhouse.users.admin.secretName }}-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-source-ns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  # Without this any namespace's ExternalSecret could read what the Role names.
  conditions:
    - namespaces:
        {{- range $consumers }}
        - {{ . | quote }}
        {{- end }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: {{ .Values.clickhouse.users.admin.secretName }}-reader
          namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-appns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.clickhouse.users.admin.secretName }}
  refreshTime: 1h
  namespaceSelectors:
    {{- range $consumers }}
    - matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.clickhouse.users.admin.secretName }}-source-ns
      kind: ClusterSecretStore
    target:
      # The name common.yaml's clickhouse.passwordSecretName points the apps at.
      name: {{ .Values.clickhouse.users.admin.secretName }}
      creationPolicy: Owner
    data:
      - secretKey: password
        remoteRef:
          key: {{ .Values.clickhouse.users.admin.secretName }}
          property: password
{{- if $caCopy }}
---
# The CA that signed the server certificate, copied into the app namespace from the CA-only Secret tls-ca.yaml writes.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.clickhouse.tls.ca.secretName }}-appns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.clickhouse.tls.ca.secretName }}
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: {{ .Values.appNamespace | quote }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.clickhouse.users.admin.secretName }}-source-ns
      kind: ClusterSecretStore
    target:
      name: {{ .Values.clickhouse.tls.ca.secretName }}
      creationPolicy: Owner
    data:
      - secretKey: {{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}
        remoteRef:
          key: {{ include "dfe-clickhouse.tlsCaSecret" . }}
          property: ca.crt
{{- end }}
{{- end }}
