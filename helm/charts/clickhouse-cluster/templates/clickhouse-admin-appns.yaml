{{- if and (ne .Values.clickhouse.mode "external") .Values.appNamespace }}
{{- $caCopy := and (include "dfe-clickhouse.tlsEnabled" .) (dig "ca" "secretName" "" .Values.clickhouse.tls) }}
{{- /* The namespaces the copies below land in, and the only ones the store serves. */}}
{{- $consumers := prepend (.Values.extraCredentialNamespaces | default list) .Values.appNamespace | uniq }}
# The admin credential, copied into the APP namespace.
#
# The server is started with CLICKHOUSE_USER set, so the official image stops
# accepting a passwordless `default` and every app that sends no credential is
# refused with code 194. admin-secret.yaml generates the password in-cluster, into
# THIS namespace; the apps run elsewhere and nothing bridged the two.
#
# Same shape as the kafka chart's app-namespace copy: an in-cluster generated
# value cannot be re-derived in a second namespace (the generator would mint a
# different password), so ESO's kubernetes provider copies the one that exists,
# through a ServiceAccount whose Role names the only Secrets it may read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.clickhouse.users.admin.secretName | quote }}
      {{- if $caCopy }}
      # The CA-only copy, never the keypair Secret beside it (tls-ca.yaml).
      - {{ include "dfe-clickhouse.tlsCaSecret" . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.clickhouse.users.admin.secretName }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clickhouse.users.admin.secretName }}-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-source-ns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  # A ClusterSecretStore serves every namespace unless told otherwise, so without
  # this any namespace's ExternalSecret could read what the Role above names.
  conditions:
    - namespaces:
        {{- range $consumers }}
        - {{ . | quote }}
        {{- end }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        # Every namespace carries kube-root-ca.crt, so the API server's CA needs
        # no separate distribution step.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: {{ .Values.clickhouse.users.admin.secretName }}-reader
          namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-appns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.clickhouse.users.admin.secretName }}
  refreshTime: 1h
  namespaceSelectors:
    {{- range $consumers }}
    - matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.clickhouse.users.admin.secretName }}-source-ns
      kind: ClusterSecretStore
    target:
      # The name common.yaml's clickhouse.passwordSecretName points every app at.
      name: {{ .Values.clickhouse.users.admin.secretName }}
      creationPolicy: Owner
    data:
      - secretKey: password
        remoteRef:
          key: {{ .Values.clickhouse.users.admin.secretName }}
          property: password
{{- if $caCopy }}
---
# The CA that signed the server certificate, copied into the APP namespace so a
# client can verify 8443, from the CA-only Secret tls-ca.yaml writes.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.clickhouse.tls.ca.secretName }}-appns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.clickhouse.tls.ca.secretName }}
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: {{ .Values.appNamespace | quote }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.clickhouse.users.admin.secretName }}-source-ns
      kind: ClusterSecretStore
    target:
      name: {{ .Values.clickhouse.tls.ca.secretName }}
      creationPolicy: Owner
    data:
      - secretKey: {{ .Values.clickhouse.tls.ca.dataKey | default "ca.crt" }}
        remoteRef:
          key: {{ include "dfe-clickhouse.tlsCaSecret" . }}
          property: ca.crt
{{- end }}
{{- end }}
