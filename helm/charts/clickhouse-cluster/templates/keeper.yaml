{{- if eq .Values.clickhouse.mode "cluster" }}
{{- if .Values.clickhouse.keeper.serviceAccount.create }}
# docs/deployment/clickhouse.md, Placement and identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clickhouse.keeper.serviceAccount.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.clickhouse.keeper.serviceAccount.automountServiceAccountToken }}
---
{{- end }}
# DFE's own Keeper for ReplicatedMergeTree coordination.
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: {{ .Values.clickhouse.keeper.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.clickhouse.keeper.replicas }}
  containerTemplate:
    # The operator drops `hash` whenever a tag is set, so the digest rides in the tag.
    image:
      repository: {{ .Values.clickhouse.keeper.image.repository }}
      tag: "{{ .Values.clickhouse.keeper.image.tag }}{{ with .Values.clickhouse.keeper.image.digest }}@{{ . }}{{ end }}"
    resources:
      requests:
        cpu: {{ .Values.clickhouse.keeper.resources.requests.cpu }}
        memory: {{ .Values.clickhouse.keeper.resources.requests.memory }}
      limits:
        cpu: {{ .Values.clickhouse.keeper.resources.limits.cpu }}
        memory: {{ .Values.clickhouse.keeper.resources.limits.memory }}
    {{- with .Values.clickhouse.keeper.livenessProbe }}
    livenessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  dataVolumeClaimSpec:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: {{ .Values.clickhouse.keeper.storage.size }}
    {{- with (.Values.clickhouse.keeper.storage.storageClass | default .Values.storageClass) }}
    storageClassName: {{ . | quote }}
    {{- end }}
  # The operator's own ingress policy. network-policies leaves these pods out of data-ingress-policy, which would open every port to every DFE namespace.
  # Risk-accepted: the any-namespace operator peer (docs/threat-model.md, Accepted risks).
  networkPolicy:
    policy: Enabled
  settings:
    logger:
      {{- include "dfe-clickhouse.logger" .Values.clickhouse.keeper.log | nindent 6 }}
    extraConfig:
      keeper_server:
        four_letter_word_white_list: {{ .Values.clickhouse.keeper.fourLetterWords | quote }}
  {{- if or .Values.nodeScheduling .Values.clickhouse.podSpread.enabled .Values.clickhouse.keeper.serviceAccount.name }}
  podTemplate:
    {{- with .Values.clickhouse.keeper.serviceAccount.name }}
    serviceAccountName: {{ . }}
    {{- end }}
    {{- if .Values.nodeScheduling }}
    {{- with include "dfe-clickhouse.poolSelector" (dict "root" $ "pool" "keeper") | fromYaml }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.nodeScheduling.tolerations }}
    tolerations:
      {{- toYaml .Values.nodeScheduling.tolerations | nindent 6 }}
    {{- end }}
    {{- end }}
    {{- if .Values.clickhouse.podSpread.enabled }}
    {{- /* The operator's labels on keeper pods, so only keepers are counted. */}}
    topologySpreadConstraints:
      - maxSkew: {{ .Values.clickhouse.podSpread.maxSkew }}
        topologyKey: {{ .Values.clickhouse.podSpread.topologyKey }}
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: {{ printf "%s-keeper" .Values.clickhouse.keeper.name | quote }}
            clickhouse.com/role: clickhouse-keeper
    {{- end }}
  {{- end }}
{{- end }}
