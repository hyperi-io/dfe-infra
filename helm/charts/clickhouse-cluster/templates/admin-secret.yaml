{{- if ne .Values.clickhouse.mode "external" }}
# DFE-owned ClickHouse admin password (single + cluster mode). Generated IN-CLUSTER
# by ESO's Password generator -- no external secret backend required (works on a
# bare cluster with an InvalidProviderConfig store), GitOps-native (Argo manages
# it), and stable across re-syncs: ESO writes the value once into the target Secret
# and refreshInterval=0 stops it rotating the password out from under a running
# server. Both consumers read users.admin.secretName / key "password" -- the single
# StatefulSet entrypoint (CLICKHOUSE_PASSWORD) and the operator-managed cluster.
# external mode does NOT render this: it materialises a BYO password from Vault via
# templates/externalsecret.yaml instead.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 6
  symbols: 0          # alphanumeric only -- avoids connection-string / shell escaping
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"      # generate once; never rotate under the live server
  target:
    name: {{ .Values.clickhouse.users.admin.secretName }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.clickhouse.users.admin.secretName }}-gen
{{- end }}
