{{- if ne .Values.clickhouse.mode "external" }}
# DFE-owned ClickHouse admin password (single + cluster mode). Generated IN-CLUSTER
# by ESO's Password generator, so a bare cluster with an InvalidProviderConfig store
# needs no secret backend. Both modes read users.admin.secretName / key "password"
# once, at server start -- the single StatefulSet as CLICKHOUSE_PASSWORD, the
# operator-managed cluster through defaultUserPassword -- and the apps read the copy
# clickhouse-admin-appns.yaml makes of it. external mode does NOT render this: it
# reads a supplied password from the deployment's secret store via
# templates/externalsecret.yaml instead.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 6
  symbols: 0          # alphanumeric only -- avoids connection-string / shell escaping
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ .Values.clickhouse.users.admin.secretName }}
    creationPolicy: Owner
    # CreatedOnce still re-runs the generator on any reconcile that finds no recorded
    # sync or an altered Secret. Immutable keeps the first password, the one the
    # running server holds.
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.clickhouse.users.admin.secretName }}-gen
{{- end }}
