{{- if ne .Values.clickhouse.mode "external" }}
# The admin password, generated in-cluster so a bare cluster needs no secrets backend. external mode reads its password from the store instead (externalsecret.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 6
  symbols: 0          # alphanumeric only, so it needs no escaping in a connection string or shell
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ .Values.clickhouse.users.admin.secretName }}
    creationPolicy: Owner
    # CreatedOnce still re-runs the generator when no sync is recorded or the Secret is altered. Immutable keeps the password the running server holds.
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.clickhouse.users.admin.secretName }}-gen
{{- end }}
