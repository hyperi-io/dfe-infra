{{- if and (ne .Values.clickhouse.mode "external") .Values.clickhouse.serviceAccount.create }}
# The server pods' own account, so the S3 Pod Identity role binds only ClickHouse. docs/deployment/clickhouse.md, Placement and identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clickhouse.serviceAccount.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.clickhouse.serviceAccount.automountServiceAccountToken }}
{{- end }}
