{{- if and (ne .Values.clickhouse.mode "external") .Values.clickhouse.serviceAccount.create }}
# Dedicated identity for the server pods (clickhouse.yaml's ClickHouseCluster
# CR, clickhouse-single.yaml's StatefulSet), so the S3 object-store Pod
# Identity association (terraform/modules/kubernetes-cluster/aws/
# object-store.tf) binds only ClickHouse. Before this, the association
# targeted the release namespace's default account, and the dfe-schema Job --
# which also runs under default in the same namespace -- inherited the role's
# S3 write and delete rights with it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clickhouse.serviceAccount.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.clickhouse.serviceAccount.automountServiceAccountToken }}
{{- end }}
