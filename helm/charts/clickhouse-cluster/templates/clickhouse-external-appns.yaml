{{- if and (eq .Values.clickhouse.mode "external") .Values.appNamespace }}
{{- /* The apps' namespace and every extra consumer, the otel collector's among them. */}}
{{- $consumers := prepend (.Values.extraCredentialNamespaces | default list) .Values.appNamespace | uniq }}
# The external server's password, read from the deployment's store straight into
# each consumer namespace under the name every app and the collector already read.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.clickhouse.users.admin.secretName }}-external
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.clickhouse.users.admin.secretName }}
  refreshTime: 1h
  namespaceSelectors:
    {{- range $consumers }}
    - matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.clickhouse.external.secretStoreName | default "dfe-secret-store" }}
      kind: ClusterSecretStore
    target:
      name: {{ .Values.clickhouse.users.admin.secretName }}
      creationPolicy: Owner
    data:
      - secretKey: password
        remoteRef:
          key: {{ .Values.project }}/{{ .Values.env }}/clickhouse/external
          property: password
{{- end }}
