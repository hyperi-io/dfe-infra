{{- if and (eq .Values.clickhouse.storageModel "s3backed") (ne .Values.clickhouse.mode "external") }}
{{- $key := .Values.clickhouse.s3.remoteKey | default (printf "%s/%s/clickhouse/s3" .Values.project .Values.env) }}
# Object-store credential for storageModel: s3backed. Same seam as the
# mode=external password: the deploy layer seeds the store, ESO materialises the
# Secret, and the server reads it as environment credentials -- so nothing is
# inline in the CR or the ConfigMap, both of which live in git.
{{- /*
The remote key and its field names are values, so a deployment can bind a
credential the estate already holds rather than re-seeding it under a DFE path.
Template comments, so the defaults still render byte-identically.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.s3.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.clickhouse.s3.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clickhouse.s3.secretName }}
    creationPolicy: Owner
  data:
    {{- /* secretKey is what the CR's env reads; only the remote side is settable. */}}
    - secretKey: access_key_id
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.clickhouse.s3.accessKeyProperty }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.clickhouse.s3.secretKeyProperty }}
{{- end }}
