{{- if and (eq (include "dfe-clickhouse.storageBulk" .) "object") (ne .Values.clickhouse.mode "external") }}
{{- /* The derived path is frozen at clickhouse/s3: a deployment that seeded
there and never set remoteKey would lose its credential if it moved. */ -}}
{{- $key := .Values.clickhouse.objectStore.remoteKey | default (printf "%s/%s/clickhouse/s3" .Values.project .Values.env) }}
# Object-store credential for any model with an object bulk store. Same seam as
# the mode=external password: the deploy layer seeds the store, ESO materialises
# the Secret, and the server reads it as environment credentials -- so nothing is
# inline in the CR or the ConfigMap, both of which live in git.
{{- /*
The remote key and its field names are values, so a deployment can bind a
credential the estate already holds rather than re-seeding it under a DFE path.
Template comments, so the defaults still render byte-identically.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.objectStore.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.clickhouse.objectStore.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clickhouse.objectStore.secretName }}
    creationPolicy: Owner
  data:
    {{- /* secretKey is what the CR's env reads; only the remote side is settable. */}}
    - secretKey: access_key_id
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.clickhouse.objectStore.accessKeyProperty }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.clickhouse.objectStore.secretKeyProperty }}
{{- end }}
