{{- if and (eq (include "dfe-clickhouse.storageBulk" .) "object") (ne .Values.clickhouse.mode "external") (not .Values.clickhouse.objectStore.usePodIdentity) }}
{{- /* The derived path is frozen: moving it strands a deployment that never set remoteKey. */ -}}
{{- $key := .Values.clickhouse.objectStore.remoteKey | default (printf "%s/%s/clickhouse/s3" .Values.project .Values.env) }}
# Object-store credential for an object bulk store. docs/deployment/storage.md, Dimension 4: credential binding.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.objectStore.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.clickhouse.objectStore.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clickhouse.objectStore.secretName }}
    creationPolicy: Owner
  data:
    {{- /* secretKey is what the CR's env reads. */}}
    - secretKey: access_key_id
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.clickhouse.objectStore.accessKeyProperty }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.clickhouse.objectStore.secretKeyProperty }}
{{- end }}
