{{- if eq .Values.clickhouse.mode "single" }}
# The digest identity single mode's embedded Keeper creates every znode under. Immutable like admin-secret.yaml, because a second value locks the server out of the znodes the first created.
# Cluster mode needs none: the operator mints its own.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.clickhouse.name }}-keeper-identity-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 6
  symbols: 0          # alphanumeric only, because the identity is split on the colon
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.name }}-keeper-identity
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ .Values.clickhouse.name }}-keeper-identity
    creationPolicy: Owner
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.clickhouse.name }}-keeper-identity-gen
{{- end }}
