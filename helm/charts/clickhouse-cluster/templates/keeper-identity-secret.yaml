{{- if eq .Values.clickhouse.mode "single" }}
# The digest identity single mode's embedded Keeper creates every znode under, so
# only the server reads or writes the replication metadata and the SQL users it
# keeps there. Generated in-cluster and immutable like admin-secret.yaml, because a
# second value leaves the server locked out of every znode the first one created.
# Cluster mode needs none: the operator mints its own Keeper identity.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.clickhouse.name }}-keeper-identity-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 6
  symbols: 0          # alphanumeric only -- the identity is user:password, split on the colon
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.name }}-keeper-identity
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ .Values.clickhouse.name }}-keeper-identity
    creationPolicy: Owner
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.clickhouse.name }}-keeper-identity-gen
{{- end }}
