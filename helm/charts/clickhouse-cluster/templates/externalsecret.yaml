{{- if eq .Values.clickhouse.mode "external" }}
# External ClickHouse (BYO / ClickHouse Cloud): DFE deploys no CH; it connects to
# clickhouse.external.host. The password is materialised by ESO from Vault. The
# consumer host is set via clickhouse.host in the deploy overlay/annotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clickhouse.external.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.clickhouse.external.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.clickhouse.external.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/clickhouse/external
        property: password
{{- end }}
