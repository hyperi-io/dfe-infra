# dfe-schema -- the DFE ClickHouse schema, applied before anything writes to it.
#
# Runs `dfe-schema apply` from the dfe-engine image as a Job, in a sync wave
# after ClickHouse and before the otel collector, the loader and the apps. The
# collector runs with create_schema=false and the loader assumes its table, so
# this is what makes the tables exist rather than each writer inventing its own.
#
# The image is the ENGINE image: dfe-schema is one of its entry points, not a
# separate artefact, so this chart's appVersion tracks apps.dfe-engine.

project: dfe
env: dev
cloud: local
component: engine

image:
  repository: ""     # set from global.registry
  tag: ""            # empty -> Chart.AppVersion
  # The immutable half of the pin; GHCR tags are mutable. This Job runs the ENGINE
  # image, so it is versions.yaml digests.dfe-engine (drift-checked).
  digest: "sha256:50c442839c79f3bfdbc2ccf6b45782408e5933656e8444d6c308cdd7550f4d60"
  pullPolicy: IfNotPresent

# Seconds the Job keeps retrying the ClickHouse connection before failing. A
# fresh deploy syncs this wave the moment ClickHouse reports Ready, which on a
# cluster is before the replicas have finished electing.
connectTimeout: 300

# Job-level retries on top of the in-process wait, for a failure the wait cannot
# cover (a node eviction, an image pull).
backoffLimit: 3

# How long the whole Job gets, retries included. Bounds a DDL statement that
# never returns, which connectTimeout does not cover -- without it a hung apply
# blocks the sync indefinitely. Set above connectTimeout x (backoffLimit + 1) so
# a slow cluster start is a retry, not a deadline.
activeDeadlineSeconds: 1800

clickhouse:
  host: ""
  port: 8123
  database: dfe
  user: ""
  passwordSecretName: ""
  passwordSecretKey: password

# Days every time-series table the apply creates or reconciles keeps rows.
# 0 disables the default TTL.
# A source or a dfe-schemas definition that declares its own TTL overrides it.
# Keep equal to the dfe-engine chart's retention.defaultTtlDays.
retention:
  defaultTtlDays: 90

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
