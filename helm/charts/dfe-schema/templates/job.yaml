{{- /*
The schema gate. `dfe-schema apply` creates or reconciles every DFE table and
exits non-zero if it cannot, so a failure leaves the wave unsynced rather than
letting the data plane start against a database with no tables.

A Job's pod template is immutable, so a re-sync needs a name that moves. It was
.Release.Revision, which works under `helm upgrade` and never under ArgoCD:
ArgoCD renders with `helm template`, where .Release.Revision is ALWAYS 1
(helm/helm#10690), so the name never changed and the apply never re-ran.

The name is the image digest-or-tag hashed instead. The image IS the schema
code, so the Job re-runs exactly when the DDL could have changed, ArgoCD prunes
the superseded one, and an unchanged sync leaves a Complete Job alone rather
than re-applying a no-op. It must stay deterministic across renders -- the
controller re-renders on every comparison, so anything time- or random-derived
would leave the app permanently OutOfSync.

An ArgoCD Sync hook was the other candidate and is worse here: a hook is not a
tracked resource, so this single-resource app would render as empty and trip
ArgoCD's "auto-sync will wipe out all resources" guard on every sync.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: dfe-schema-{{ include "dfe-common.image" . | sha256sum | trunc 8 }}
  labels: &schemaLabels
    app.kubernetes.io/name: dfe-schema
    app.kubernetes.io/part-of: {{ .Values.project | quote }}
    app.kubernetes.io/managed-by: "helm"
    app.kubernetes.io/version: {{ .Chart.AppVersion | default "0.0.0" | quote }}
    app.kubernetes.io/component: schema
    dfe.hyperi.io/env: {{ .Values.env | quote }}
    dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  # A hung apply would otherwise block the sync forever: the in-process --wait
  # bounds the CONNECT, not a DDL statement that never returns.
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels: *schemaLabels
    spec:
      restartPolicy: Never
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: schema
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          command: ["dfe-schema"]
          args:
            - "apply"
            - "--wait"
            - {{ .Values.connectTimeout | quote }}
          env:
            - name: DFE_CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: DFE_CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: DFE_CLICKHOUSE_DATA_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: DFE_CLICKHOUSE_SECURE
              value: "false"
            {{- with .Values.clickhouse.user }}
            - name: DFE_CLICKHOUSE_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.clickhouse.passwordSecretName }}
            - name: DFE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.clickhouse.passwordSecretKey | default "password" }}
            {{- end }}
            # No OTLP endpoint: this runs a wave BEFORE the collector, so an
            # export would have nothing to reach. The apply reports to stdout,
            # which is where a Job's record belongs.
            - name: OTEL_SERVICE_NAME
              value: dfe-schema
          volumeMounts:
            # The container rootfs is read-only, so anything writing /tmp needs this.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
