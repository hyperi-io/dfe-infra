# dfe-transform-splack is coming: alpha, unpublished, so nothing generates this chart until the app ships.
project: dfe
component: transform-splack
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

kafka:
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""
  sourceTopic: ""        # set per deployment via ArgoCD values
  destTopic: ""          # set per deployment
  consumerGroup: ""      # defaults to dfe-transform-splack

otel:
  endpoint: ""

config:
  mountPath: /config

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}

# KEDA autoscaling -- folded into the chart. The SHIPPED trigger is the native KEDA
# cpu scaler; scalo ScalingPressure (0-100) renders beside it and the HPA takes the
# higher of the two. The shim matches this ServiceName's gauge under any metric prefix
# (dfe-engine#379), so no app release is needed for the name. Pressure is the advanced signal: the composite fuses Kafka CG lag
# + container-contract metrics (buffer, memory) AND hard-gates to 0 when the downstream
# sink is unreachable (circuit-breaker open), so pressure never scales out pods that
# would not help when the real bottleneck is downstream. It routes through the fail-safe
# dfe-keda-shim (a metric outage FREEZES scaling, never runs replicas up). Transforms are
# multi-instance; set pressure.service per instance. minReplicaCount stays 1
# (scale-to-zero is 2.2 backlog).
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # second trigger: native KEDA cpu scaler (no shim needed)
  pressure:
    enabled: true             # scalo ScalingPressure via the fail-safe dfe-keda-shim
    # service: dfe-transform-splack   # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: dfe-keda-shim.<ns>.svc.cluster.local:8080 (default: the release namespace)

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
