project: dfe
component: links
env: local
cloud: local

# Namespaced gate (the kafbat pattern): the shared profile cascade can toggle
# this chart without a bare top-level `enabled` leaking into other charts.
links:
  enabled: true

# nginxinc/nginx-unprivileged -- non-root static file server (uid 101, listens
# 8080, pid + temp under /tmp). SHA-pinned like kafbat; the 1.31-alpine TAG
# FLOATS upstream (same as services.nginx-proxy), so the digest is re-resolved
# on every version refresh. versions.yaml services-digests.nginx-unprivileged
# pins it.
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.31-alpine@sha256:334d92979f15aaecd5dd50af5105e1230e2bb70765d45b1e2f964e7c5eda81c3"
  pullPolicy: IfNotPresent
  # Public Docker Hub image: suppress the fleet-wide imagePullSecrets.
  public: true

# The image runs as USER nginx = uid 101, not the DFE default 1000.
# runAsNonRoot needs a NUMERIC uid, so pin it here.
podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# Where the DFE app services run. The bundled ApplicationSet passes this from
# the cluster's dfe_namespace annotation; empty falls back to {project}-{env}.
appNamespace: ""

# The page content. The chart renders a DEFAULT page covering every standard
# stack surface as localhost port-forward URLs (true on any kubectl-reachable
# deployment); `groups` appends deployment-specific entries, and a deployment
# with real gateway hostnames overrides via these values. The page is a
# projection of values -- the same Argo sync that changes them re-renders it.
page:
  title: ""            # defaults to "<project> deployment"
  description: >-
    Every web surface this deployment exposes. Links default to the standard
    kubectl port-forward layout; each note is the forward that serves its
    link, and a grey/red dot means that target is not answering.
  # Client-side reachability dots: a no-cors fetch per link, green when the
  # host answers, grey when unreachable. Probes are skipped automatically for
  # http targets on an https page (the browser blocks mixed content).
  statusProbes: true
  # The standard stack surfaces (apps, data stores, GitOps). Disable when a
  # deployment writes its whole page via `groups`.
  includeDefaults: true
  # Names an engine OIDC provider to link its browser login entry; empty
  # omits the entry (the provider name is a deployment choice).
  oidcProvider: ""
  # Deployment-specific extras, appended after the defaults.
  # groups:
  #   - name: Observability
  #     links:
  #       - name: Grafana
  #         url: https://grafana.example.com
  #         note: estate dashboards
  groups: []

# PodDisruptionBudget (dfe-common.pdb): renders only when replicaCount >= 2.
pdb:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

serviceAccount:
  create: true
  annotations: {}

nodeScheduling: {}
