project: dfe
component: links
env: local
cloud: local

# Namespaced gate (the kafbat pattern): the shared profile cascade can toggle
# this chart without a bare top-level `enabled` leaking into other charts.
links:
  enabled: true

# nginxinc/nginx-unprivileged -- non-root static file server (uid 101, listens
# 8080, pid + temp under /tmp). SHA-pinned like kafbat; the 1.31-alpine TAG
# FLOATS upstream, so the digest is re-resolved on every version refresh.
# versions.yaml services-digests.nginx-unprivileged pins it, and the drift check
# compares the TAG only -- keep this digest in step with it by hand.
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.31-alpine@sha256:f972e5322b9797dc2a6b830030094426437b1ae7032e4644496395336ac6fdac"
  pullPolicy: IfNotPresent
  # Public Docker Hub image: suppress the fleet-wide imagePullSecrets.
  public: true

# The image runs as USER nginx = uid 101, not the DFE default 1000.
# runAsNonRoot needs a NUMERIC uid, so pin it here.
podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# Where the DFE app services run. The bundled ApplicationSet passes this from
# the cluster's dfe_namespace annotation; empty falls back to {project}-{env}.
appNamespace: ""

# The deployment's own domain -- every deployment owns one, and every surface
# is a name under it ({hostname}.{domain}), never an IP. Set (same value the
# gateway chart reads), the default page renders gateway-first https URLs;
# empty falls back to the kubectl port-forward debug layout.
domain: ""

# Canonical service-name map, supplied by the deploy-config SSoT
# (argocd/values/common.yaml) -- never redefined here.
hostnames: {}

# The page content. The chart renders a DEFAULT page covering every standard
# stack surface: gateway https URLs derived from `domain` + `hostnames` when
# a domain is set, else the localhost port-forward layout (true on any
# kubectl-reachable deployment); `groups` appends deployment-specific entries.
# The page is a projection of values -- the same Argo sync that changes them
# re-renders it.
page:
  title: ""            # defaults to "<project> deployment"
  description: ""      # defaults per layout (gateway-first or port-forward)
  # Client-side reachability dots: a no-cors fetch per link, green when the
  # host answers, grey when unreachable. Probes are skipped automatically for
  # http targets on an https page (the browser blocks mixed content).
  statusProbes: true
  # The standard stack surfaces (apps, data stores, GitOps). Disable when a
  # deployment writes its whole page via `groups`.
  includeDefaults: true
  # Names an engine OIDC provider to link its browser login entry; empty
  # omits the entry (the provider name is a deployment choice).
  oidcProvider: ""
  # Deployment-specific extras, appended after the defaults.
  # groups:
  #   - name: Observability
  #     links:
  #       - name: Grafana
  #         url: https://grafana.example.com
  #         note: estate dashboards
  groups: []

# PodDisruptionBudget (dfe-common.pdb): renders only when replicaCount >= 2.
pdb:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

serviceAccount:
  create: true
  annotations: {}

nodeScheduling: {}
