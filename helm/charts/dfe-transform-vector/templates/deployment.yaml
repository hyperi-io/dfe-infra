apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  {{- include "dfe-common.replicas" . }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config blob changes -- the app reads the file at
        # startup only, so a ConfigMap update alone would not take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # The supervisor's reload compares CONFIG STRUCTS, and TransformConfig holds
        # only the dir and file PATHS, so editing a transform's CONTENT leaves the
        # config identical and classify_change returns None. Only a roll applies it.
        checksum/transforms: {{ include (print $.Template.BasePath "/transforms-configmap.yaml") . | sha256sum }}
        # Vector materialises an enrichment table at config load, and its reload
        # path compares config structs rather than table contents, so an edit
        # needs a roll.
        checksum/enrichment: {{ include (print $.Template.BasePath "/enrichment-configmap.yaml") . | sha256sum }}
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      containers:
        - name: transform
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          # Mirrors the image CMD (dfe-transform-vector Dockerfile:60). Explicit
          # so the config path is visible here rather than buried in the image.
          args:
            - "--config"
            - "/etc/dfe-transform-vector/config.yaml"
          ports:
            # scalo's metrics server (defaults on 0.0.0.0:9090) hosts /metrics and
            # the /livez + /readyz health endpoints -- one port for the scrape
            # annotation and the probes to agree on. Same scalo contract as dfe-fetcher.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            {{- include "dfe-common.versionCheckEnv" (dict "ctx" . "prefix" "DFE_TRANSFORM_") | nindent 12 }}
            # dfe-transform-vector reads the DFE_TRANSFORM_* flat env contract
            # (src/config/loader.rs), never bare KAFKA_* names. Credentials arrive
            # only this way -- they cannot sit in the config blob, which is committed
            # to git.
            - name: DFE_TRANSFORM_SOURCE_BROKERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: DFE_TRANSFORM_SINK_BROKERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- with .Values.kafka.sourceTopic }}
            - name: DFE_TRANSFORM_SOURCE_TOPICS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.kafka.destTopic }}
            - name: DFE_TRANSFORM_SINK_TOPIC
              value: {{ . | quote }}
            {{- end }}
            - name: DFE_TRANSFORM_SOURCE_GROUP_ID
              value: {{ .Values.kafka.consumerGroup | default (printf "dfe-%s" .Values.component) | quote }}
            {{- if .Values.kafka.saslSecretName }}
            - name: DFE_TRANSFORM_SOURCE_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: username
            - name: DFE_TRANSFORM_SOURCE_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: password
            - name: DFE_TRANSFORM_SINK_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: username
            - name: DFE_TRANSFORM_SINK_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: password
            {{- end }}
            {{- include "dfe-common.transformFilesEnv" . | nindent 12 }}
            # The supervisor assembles Vector's config dir, caches the binary and
            # keeps Vector's data dir; all three must be writable under the
            # read-only rootfs, and the paths must match the volumes below.
            - name: DFE_TRANSFORM_VECTOR_DATA_DIR
              value: /var/lib/vector
            - name: DFE_TRANSFORM_VECTOR_CACHE_DIR
              value: /var/cache/vector
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            # Per-INSTANCE, not per-app: scalo otherwise defaults service.name to the
            # binary name, so two instances are indistinguishable in the otel tables.
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otelServiceName | default (printf "dfe-%s" .Values.component) | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/dfe-transform-vector
              readOnly: true
            {{- include "dfe-common.transformFilesMount" . | nindent 12 }}
            {{- include "dfe-common.enrichmentTablesMount" . | nindent 12 }}
            - name: vector-data
              mountPath: /var/lib/vector
            - name: vector-cache
              mountPath: /var/cache/vector
            - name: vector-runtime
              mountPath: /var/run/vector
            # Writable scratch: the container rootfs is read-only
            # (dfe-common.containerSecurityContext), so anything writing /tmp
            # needs this emptyDir.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # WAS `exec: pgrep -x transform` -- a process-existence check keyed to the
          # exact binary name that stays green on a wedged-but-alive process, exactly
          # the state liveness must catch. Moved to the scalo HTTP health endpoints,
          # matching dfe-fetcher. A startupProbe, if added, targets /livez -- there is
          # no startup route, and k8s suspends liveness until it passes.
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        {{- include "dfe-common.transformFilesVolume" . | nindent 8 }}
        {{- include "dfe-common.enrichmentTablesVolume" . | nindent 8 }}
        - name: vector-data
          emptyDir: {}
        - name: vector-cache
          emptyDir: {}
        - name: vector-runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
