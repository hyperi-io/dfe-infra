{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dfe-common.serviceAccountName" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No DFE data-plane app calls the Kubernetes API, so its pods get no token unless serviceAccount.mountToken asks.
{{ include "dfe-common.automountServiceAccountToken" . }}
{{- end }}
