project: dfe
component: transform-vector
# The component the IMAGE is published under. This app runs one deployment per
# source, so dfe-engine makes `component` instance-unique to keep the object
# names apart; the image is the app's, not the instance's. Empty falls back to
# `component`, which is only correct for a single-instance deployment.
imageComponent: transform-vector
env: local
cloud: local

image:
  repository: ""
  tag: ""
  # The immutable half of the pin; GHCR tags are mutable. == versions.yaml
  # digests.dfe-transform-vector (drift-checked).
  digest: "sha256:1e7da14a0bfe28ac37cefb968d0dc6b1e159d8f3da8990c3f1c051f3da724e64"
  pullPolicy: IfNotPresent

replicaCount: 1

kafka:
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""
  sourceTopic: ""        # set per deployment via ArgoCD values
  destTopic: ""          # set per deployment
  consumerGroup: ""      # defaults to dfe-transform-vector

otel:
  endpoint: ""

# The app's scalo config, mounted VERBATIM at
# /etc/dfe-transform-vector/config.yaml (the image's CMD path --
# dfe-transform-vector Dockerfile:60). This is an OPAQUE passthrough blob: the
# engine is the config authority and publishes it as the per-instance Argo
# multi-source $values overlay
# (values/dfe-transform-vector-<instance>-values.yaml), so the chart never needs
# to know the per-app keys. Empty here on purpose -- baking defaults in would put
# deployment-specific addresses in a product chart, and Helm's map merge would
# silently leave stale keys behind when the engine's overlay does not overwrite
# them.
config: {}

# The Vector transform YAML this instance runs, as a list of {name, content}.
# Written by dfe-engine into the per-instance overlay and rendered into a ConfigMap
# mounted at transformFilesDir. A list rather than a map because a filename's own
# dot would be ambiguous with the dot-path addressing the engine uses.
transformFiles: []

# Where transformFiles are mounted. Also exported as DFE_TRANSFORM_TRANSFORMS_DIR,
# which outranks the config file, so the app reads what the chart actually mounted.
transformFilesDir: ""

# Lookup tables the transforms read, as a list of {name, content}. Vector declares
# its own enrichment_tables in the config it assembles, so the engine writes those
# paths under the mount below.
enrichmentTables: []
enrichmentTablesDir: ""

# OTel service.name for this instance. Empty falls back to the app name, which
# leaves two instances of one app indistinguishable in the otel tables.
otelServiceName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}

# KEDA autoscaling -- folded into the chart. The DEFAULT trigger is CPU (native KEDA
# cpu scaler, no shim needed). scalo ScalingPressure (dfe_scaling_pressure, 0-100) is
# the OPT-IN advanced signal: the composite fuses Kafka CG lag + container-contract
# metrics (buffer, memory) AND hard-gates to 0 when the downstream sink is unreachable
# (circuit-breaker open), so pressure never scales out pods that would not help when
# the real bottleneck is downstream. It routes through the fail-safe dfe-keda-shim (a
# metric outage FREEZES scaling, never runs replicas up). Transforms are multi-instance;
# set pressure.service per instance. minReplicaCount stays 1 (scale-to-zero is 2.2 backlog).
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # DEFAULT: native KEDA cpu scaler (no shim needed)
  pressure:
    enabled: false            # opt-in: scalo ScalingPressure via the fail-safe dfe-keda-shim
    # service: dfe-transform-vector   # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: dfe-keda-shim.dfe.svc.cluster.local:8080

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
