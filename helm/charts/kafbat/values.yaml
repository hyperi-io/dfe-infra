project: dfe
component: kafbat
env: local
cloud: local

# Deployed with the Kafka substrate in the single + scale tiers; gated OFF on the
# brokerless tiers (slim, mesh -- gRPC, no Kafka). Namespaced under
# `kafbat:` so the shared profile cascade (common + <cloud> + profile-<tier>.yaml,
# applied to EVERY chart) can toggle it WITHOUT the switch leaking to other
# charts -- a bare top-level `enabled` would gate any chart that reads
# `.Values.enabled`. Those profile files set kafbat.enabled: false.
kafbat:
  enabled: true

# Kafbat UI (maintained Kafka UI fork). v1.5.0 (2026-04-20, clears the 7-day
# cooldown; no LTS line; still latest stable as of 2026-07-12 per `gh api
# repos/kafbat/kafka-ui/releases/latest`). Image on GHCR (public), SHA-pinned
# per the dfe-engine dependency rules -- digest verified via
# `gh api /orgs/kafbat/packages/container/kafka-ui/versions` (multi-arch
# manifest list tagged v1.5.0+latest, published 2026-04-20T18:17:18Z).
image:
  repository: ghcr.io/kafbat/kafka-ui
  tag: "v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1"
  pullPolicy: IfNotPresent
  # Public GHCR image: suppress the fleet-wide imagePullSecrets from the
  # deployment overlay. Kafbat runs in the kafka namespace where bootstrap
  # never materialises the ghcr pull secret, so referencing it there only
  # produces kubelet FailedToRetrieveImagePullSecret noise on every pull.
  public: true

# The image runs as USER "kafkaui" = uid 100 (verified from the image passwd),
# NOT the DFE default 1000. runAsNonRoot needs a NUMERIC uid, so pin 100 here.
podSecurityContext:
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# Kafka cluster(s) Kafbat manages. The engine/overlay (or later, the dfe CLI)
# points this at the deployed Kafka target(s) -- one entry per cluster. Empty
# by default (no cluster configured until an overlay supplies one).
#
# `provider` is the SAME provider identity scalo's KafkaConfig.provider uses
# (strimzi | redpanda | msk | redpanda-cloud | confluent-cloud | plaintext).
# The chart DERIVES security.protocol + sasl.mechanism + the sasl.jaas.config
# module from it -- mirrors the DFE Kafka credential contract (dfe-engine#98)
# and scalo-py's emit_kafbat_cluster() output shape exactly. Never hand-set
# the mechanism here. msk_iam is NOT supported by this chart yet (OAUTHBEARER
# has no JAAS module -- see templates/_helpers.tpl kafbat.jaasModule).
#
# `credentialsSecretName` names a K8s Secret with keys `username`/`password`
# (the SASL user or the Confluent Cloud API key/secret pair). Omit for
# provider: plaintext. The chart injects these as per-cluster env vars
# (KAFKA_CLUSTER_<i>_USERNAME/PASSWORD) and references them from the mounted
# config via a Spring ${VAR} placeholder -- credentials never land in the
# rendered ConfigMap in plaintext.
#
# `schemaRegistryUrl` is optional; only wired into the cluster's
# `schemaRegistry` key when the provider ships a registry (confluent-cloud,
# redpanda, redpanda-cloud) AND this is set.
#
# `properties` is an optional escape hatch: extra raw kafbat cluster
# properties merged in on top of the provider-derived ones (provider-derived
# keys always win -- see templates/configmap.yaml).
kafka:
  clusters: []
  # Example (filled in per deployment via the ArgoCD overlay):
  # clusters:
  #   - name: dfe
  #     provider: strimzi
  #     bootstrapServers: dfe-kafka-bootstrap.kafka.svc:9092
  #     credentialsSecretName: dfe-kafka-user
  #     schemaRegistryUrl: ""
  #     properties: {}

# AUTH -- DFE default integrated-app pattern (see docs/ARCHITECTURE.md).
#   primary  = OIDC (auth.type OAUTH2) against the SAME IdP as the rest of the
#              stack; RBAC maps an OIDC group/claim to ro|rw|admin.
#   recovery = a local break-glass admin in the secret store; flip auth.type to
#              LOGIN_FORM with it when the IdP is unavailable.
# Kafbat does its OWN OIDC (it cannot derive RBAC subjects from Envoy's X-Oidc-*
# headers), but uses the same IdP + groups, so identity + roles stay stack-aligned.
#
# OAUTH2 is only rendered when oidc.enabled=true. Until the overlay fills the
# oidc block, the chart degrades to LOGIN_FORM (break-glass) -- kafbat refuses
# to boot if OAuth2 is enabled with no providers, and a vanilla deployment must
# come up. RBAC renders only under effective OAUTH2 (kafbat RBAC subjects bind
# to oauth/ldap providers; under LOGIN_FORM the break-glass admin gets full
# access via rbac absence). See kafbat.effectiveAuthType in _helpers.tpl.
auth:
  type: OAUTH2        # OAUTH2 (OIDC, default) | LOGIN_FORM (break-glass) | DISABLED

oidc:
  enabled: false      # set true + fill these via the deploy overlay (DFE OIDC SSoT)
  issuerUri: ""
  clientId: ""
  clientSecretName: ""   # ESO-materialised Secret, key: client-secret
  rolesField: groups     # OIDC token claim carrying the user's groups

# Three stack-aligned RBAC roles. Subjects (the OIDC groups that map to each) are
# set per-deployment in the overlay. Permissions below are the ro/rw/admin
# semantics; tune resource scope in the overlay if needed.
rbac:
  enabled: true
  roles:
    ro:
      subjects: []     # e.g. ["dfe-kafka-ro"] -- OIDC groups granted read-only
    rw:
      subjects: []     # OIDC groups granted read + operate
    admin:
      subjects: []     # OIDC groups granted full control

# Local break-glass admin -- the ONLY non-OIDC path, for IdP-down / bootstrap.
# Credentials live in the secret store (ESO from Vault, or an ESO-generated
# password on a bare cluster). Maps to the admin role. NEVER a baked-in default.
breakGlass:
  enabled: true
  username: dfe-breakglass
  secretName: dfe-kafbat-breakglass   # keys: username, password
  # Generate the password in-cluster when no external backend exists (bare
  # cluster). Set false when ESO pulls it from Vault instead.
  generate: true

persistence:
  enabled: false        # Kafbat is stateless when DYNAMIC_CONFIG is off

# PodDisruptionBudget (dfe-common.pdb): renders only where the workload can
# carry two pods, so a single-replica deployment never gets a budget that blocks
# node drains. The helper picks the form from the workload's floor.
pdb:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  annotations: {}

nodeScheduling: {}
