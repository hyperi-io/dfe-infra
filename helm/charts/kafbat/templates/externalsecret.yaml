{{- if and .Values.kafbat.enabled .Values.breakGlass.enabled .Values.breakGlass.generate }}
# Break-glass admin generated IN-CLUSTER (bare cluster / no Vault). ESO Password
# generator + ExternalSecret; the template injects the static username alongside
# the generated password. When generate=false the deployer/ESO supplies
# breakGlass.secretName from Vault instead and this is not rendered.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.breakGlass.secretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.breakGlass.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ .Values.breakGlass.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: {{ .Values.breakGlass.username | quote }}
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.breakGlass.secretName }}-gen
{{- end }}
