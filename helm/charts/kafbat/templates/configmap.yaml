{{- if .Values.kafbat.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  # Kafbat config (Spring). Mounted and loaded via SPRING_CONFIG_ADDITIONAL_LOCATION.
  # Secrets (OIDC client secret, break-glass password) come from env, not here.
  application-local.yml: |
    kafka:
      clusters:
        {{- range $i, $c := .Values.kafka.clusters }}
        - name: {{ $c.name }}
          bootstrapServers: {{ $c.bootstrapServers | quote }}
          {{- $mechanism := "" }}
          {{- if $c.provider }}
          {{- $mechanism = include "dfe-common.kafkaSaslMechanism" $c.provider }}
          {{- end }}
          {{- if or $mechanism $c.properties }}
          properties:
            {{- if $mechanism }}
            security.protocol: {{ include "dfe-common.kafkaSecurityProtocol" $c.provider }}
            sasl.mechanism: {{ $mechanism | quote }}
            {{- $envPrefix := include "kafbat.clusterEnvPrefix" $i }}
            sasl.jaas.config: {{ printf "%s required username=\"${%s_USERNAME}\" password=\"${%s_PASSWORD}\";" (include "kafbat.jaasModule" $mechanism) $envPrefix $envPrefix | quote }}
            {{- end }}
            {{- with $c.properties }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          properties: {}
          {{- end }}
          {{- if and $c.schemaRegistryUrl $c.provider (include "dfe-common.kafkaHasSchemaRegistry" $c.provider) }}
          schemaRegistry: {{ $c.schemaRegistryUrl | quote }}
          {{- end }}
        {{- end }}
    auth:
      type: {{ include "kafbat.effectiveAuthType" . }}
    {{- if eq (include "kafbat.effectiveAuthType" .) "OAUTH2" }}
    spring:
      security:
        oauth2:
          client:
            registration:
              dfe:
                provider: dfe
                client-id: {{ .Values.oidc.clientId | quote }}
                client-secret: ${OAUTH_CLIENT_SECRET}
                scope: openid,profile,email,{{ .Values.oidc.rolesField }}
                authorization-grant-type: authorization_code
            provider:
              dfe:
                issuer-uri: {{ .Values.oidc.issuerUri | quote }}
                user-name-attribute: email
                custom-params:
                  type: oauth
                  roles-field: {{ .Values.oidc.rolesField }}
    {{- end }}
    {{- /* RBAC only under OAUTH2: kafbat RBAC subjects bind to oauth/ldap
    identity providers -- there is no login_form provider, so under the
    break-glass LOGIN_FORM path an rbac block would leave every user (incl.
    the break-glass admin) permissionless. Omitting rbac makes kafbat grant
    authenticated users full access, which IS the break-glass semantic. */}}
    {{- if and .Values.rbac.enabled (eq (include "kafbat.effectiveAuthType" .) "OAUTH2") }}
    rbac:
      roles:
        # admin -- full control (maps OIDC admin groups + the break-glass account).
        - name: admin
          clusters: [{{ range $i, $c := .Values.kafka.clusters }}{{ if $i }}, {{ end }}{{ $c.name }}{{ end }}]
          subjects:
            {{- range .Values.rbac.roles.admin.subjects }}
            - { provider: oauth, type: role, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.breakGlass.enabled }}
            - { provider: oauth, type: user, value: {{ .Values.breakGlass.username | quote }} }
            {{- end }}
          permissions:
            - { resource: applicationconfig, actions: all }
            - { resource: clusterconfig,     actions: all }
            - { resource: topic,    value: ".*", actions: all }
            - { resource: consumer, value: ".*", actions: all }
            - { resource: schema,   value: ".*", actions: all }
            - { resource: connect,  value: ".*", actions: all }
            - { resource: ksql,                  actions: all }
            - { resource: acl,                   actions: all }
            - { resource: audit,                 actions: [view] }
        # rw -- read + operate (produce, edit topics/schemas, reset consumers).
        - name: rw
          clusters: [{{ range $i, $c := .Values.kafka.clusters }}{{ if $i }}, {{ end }}{{ $c.name }}{{ end }}]
          subjects:
            {{- range .Values.rbac.roles.rw.subjects }}
            - { provider: oauth, type: role, value: {{ . | quote }} }
            {{- end }}
          permissions:
            - { resource: topic,    value: ".*", actions: [view, create, edit, messages_read, messages_produce] }
            - { resource: consumer, value: ".*", actions: [view, reset_offsets] }
            - { resource: schema,   value: ".*", actions: [view, create, edit] }
            - { resource: connect,  value: ".*", actions: [view, edit, create] }
            - { resource: clusterconfig,         actions: [view] }
            - { resource: ksql,                  actions: all }
        # ro -- read-only / observe.
        - name: ro
          clusters: [{{ range $i, $c := .Values.kafka.clusters }}{{ if $i }}, {{ end }}{{ $c.name }}{{ end }}]
          subjects:
            {{- range .Values.rbac.roles.ro.subjects }}
            - { provider: oauth, type: role, value: {{ . | quote }} }
            {{- end }}
          permissions:
            - { resource: topic,    value: ".*", actions: [view, messages_read] }
            - { resource: consumer, value: ".*", actions: [view] }
            - { resource: schema,   value: ".*", actions: [view] }
            - { resource: connect,  value: ".*", actions: [view] }
            - { resource: clusterconfig,         actions: [view] }
    {{- end }}
{{- end }}
