{{- if .Values.kafbat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: kafbat
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Load the mounted config (clusters + auth + RBAC roles).
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: /etc/kafbat/application-local.yml
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
            {{- if eq (include "kafbat.effectiveAuthType" .) "OAUTH2" }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretName }}
                  key: client-secret
            {{- end }}
            {{- range $i, $c := .Values.kafka.clusters }}
            {{- if $c.credentialsSecretName }}
            {{- $envPrefix := include "kafbat.clusterEnvPrefix" $i }}
            # Per-cluster SASL/API-key credentials -- referenced from the mounted
            # application-local.yml as a Spring ${VAR} placeholder (see configmap.yaml
            # sasl.jaas.config), never written into the ConfigMap in plaintext.
            - name: {{ printf "%s_USERNAME" $envPrefix }}
              valueFrom:
                secretKeyRef:
                  name: {{ $c.credentialsSecretName }}
                  key: username
            - name: {{ printf "%s_PASSWORD" $envPrefix }}
              valueFrom:
                secretKeyRef:
                  name: {{ $c.credentialsSecretName }}
                  key: password
            {{- end }}
            {{- end }}
            {{- if .Values.breakGlass.enabled }}
            # Break-glass local admin -- the ACTIVE door whenever the effective
            # auth type is LOGIN_FORM (explicitly set, or the OAUTH2-without-oidc
            # degrade). Inert while effective type is OAUTH2.
            - name: SPRING_SECURITY_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.breakGlass.secretName }}
                  key: username
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.breakGlass.secretName }}
                  key: password
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kafbat
              readOnly: true
            # Spring Boot / embedded Tomcat writes its work dir under /tmp, and the
            # rootfs is read-only, so give it a writable /tmp.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
{{- end }}
