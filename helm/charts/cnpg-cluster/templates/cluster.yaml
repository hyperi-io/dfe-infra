apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cluster.instances }}
  # The PG image is a VALUE, not a hardcoded repo, and it is digest-pinned.
  #
  # It defaults to FerretDB's postgres-documentdb build -- PostgreSQL 17 WITH the
  # DocumentDB extension. That is a strict superset of vanilla PG17, so `dfe` and
  # every other database on this cluster are unaffected, and it is REQUIRED by
  # FerretDB 2.x, which HyperDX 2.x requires in turn. Without it FerretDB can only
  # run 1.x, HyperDX cannot run at all, and the stack has no telemetry backend --
  # which is exactly the state this cluster was in.
  #
  # A deployer who wants plain PG (no FerretDB/HyperDX) sets image.repository back to
  # ghcr.io/cloudnative-pg/postgresql. Nothing here is estate-specific.
  imageName: {{ printf "%s:%s" .Values.cluster.image.repository .Values.cluster.image.tag }}{{ with .Values.cluster.image.digest }}@{{ . }}{{ end }}

  storage:
    size: {{ .Values.cluster.storage.size }}
    # CNPG's field is storageClass, NOT the core-PVC spelling storageClassName.
    # The CR is schema-checked strictly, so the wrong spelling does not degrade to
    # the default class -- the API server REJECTS the whole Cluster, and the
    # database never gets created. Only bites when a class is actually set, which
    # is why it survived: it is omitted entirely when the value is empty.
    {{- with (.Values.cluster.storage.storageClass | default .Values.storageClass) }}
    storageClass: {{ . | quote }}
    {{- end }}

  resources:
    requests:
      cpu: {{ .Values.cluster.resources.requests.cpu }}
      memory: {{ .Values.cluster.resources.requests.memory }}
    limits:
      cpu: {{ .Values.cluster.resources.limits.cpu }}
      memory: {{ .Values.cluster.resources.limits.memory }}

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"

  bootstrap:
    initdb:
      database: {{ index .Values.cluster.databases 0 }}
      owner: dfe
      postInitSQL:
        {{- range $db := .Values.cluster.databases }}
        {{- if ne $db (index $.Values.cluster.databases 0) }}
        - CREATE DATABASE {{ $db }};
        {{- end }}
        {{- end }}

  {{- if .Values.nodeScheduling }}
  affinity:
    {{- if .Values.nodeScheduling.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.nodeScheduling.nodeSelector | nindent 6 }}
    {{- end }}
    {{- if .Values.nodeScheduling.tolerations }}
    tolerations:
      {{- toYaml .Values.nodeScheduling.tolerations | nindent 6 }}
    {{- end }}
  {{- end }}

  monitoring:
    enablePodMonitor: false  # OTel handles monitoring, not Prometheus

  superuserSecret:
    name: {{ .Values.cluster.superuserSecretName }}
