project: dfe
component: cnpg-cluster
env: local
cloud: local

cluster:
  name: dfe-pg
  instances: 3
  postgresqlVersion: "17"
  # PostgreSQL image. DEFAULT is FerretDB's postgres-documentdb: PG17 WITH the
  # DocumentDB extension -- a superset of vanilla PG17, required by FerretDB 2.x
  # (and so by HyperDX 2.x). Pinned tag@digest per the SHA-pin rule; the pair is the
  # SSoT's services.documentdb-pg + services-digests.documentdb-pg.
  # Swap repository to ghcr.io/cloudnative-pg/postgresql for a deploy that runs no
  # FerretDB/HyperDX and wants plain PG.
  image:
    repository: ghcr.io/ferretdb/postgres-documentdb
    tag: "17-0.107.0-ferretdb-2.7.0"
    digest: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"
  storage:
    size: 10Gi
    storageClass: ""  # empty = default StorageClass
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Databases to create
  databases:
    - dfe
    - ferretdb
    - hyperdx
  # Superuser secret (created by CNPG operator)
  superuserSecretName: dfe-pg-superuser

backup:
  enabled: false  # Enable when S3/MinIO backup target is configured
  schedule: "0 0 */6 * * *"  # Every 6 hours
  retentionPolicy: "7d"
  destinationType: s3
  s3:
    endpoint: ""
    bucket: ""
    path: "/dfe/pg-backups"
