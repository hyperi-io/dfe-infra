project: dfe
component: network-policies
env: local
cloud: local

# Namespaces that get DFE app policies (ingress from gateway + dfe-*)
dfeNamespaces:
  - dfe-local   # changes per env: dfe-dev, dfe-prod, etc.

# Data platform namespaces (ingress only from dfe-* namespaces).
# NOT a ferretdb entry: FerretDB deploys INTO cnpg (appsets/layer2-data.yaml
# pins it there, and it shares that namespace with its PostgreSQL backend), so
# no ferretdb namespace exists. Naming one here does not merely do nothing -- a
# NetworkPolicy aimed at an absent namespace is rejected, which fails the whole
# Application sync and leaves the cluster with NO policies applied at all.
dataNamespaces:
  - cnpg
  - strimzi
  - clickhouse

# Operator namespaces (need access to data namespaces for reconciliation)
operatorNamespaces:
  - cnpg-system
  - strimzi
  - clickhouse-operator-system

# Envoy Gateway namespace (source of ingress traffic)
gatewayNamespace: envoy-gateway-system

# Autoscaler namespace. KEDA polls the in-namespace keda-shim for the pressure
# metric, so without this the metrics-api scaler times out and nothing scales.
kedaNamespace: keda
kedaShimPort: 8080

# OTel Collector namespace (all pods can send telemetry here)
otelNamespace: otel
otelPort: 4317

# Internet EGRESS allow-list. The baseline is default-deny-egress, so apps that
# must INITIATE outbound to the internet need an explicit policy. fetcher polls
# external data-source APIs; archiver uploads to object storage (S3/GCS/Azure).
# This opens egress to the internet for ONLY those apps, on ONLY the ports they
# need, and carves OUT the cluster-internal ranges so a compromised fetcher cannot
# pivot laterally into pod/service space. Tighten allowCIDRs (or add an egress
# proxy via the app overlay's HTTP(S)_PROXY env) in locked-down environments.
# NOTE: this is the k8s policy layer only -- the cluster still needs a real
# internet route (cloud NAT gateway on private subnets, or node default route).
internetEgress:
  enabled: true
  # Apps (matched by app.kubernetes.io/name) granted internet egress.
  apps:
    - dfe-fetcher
    - dfe-archiver
  ports:
    - { port: 443, protocol: TCP }   # HTTPS APIs + S3/object storage
    - { port: 80,  protocol: TCP }   # plain-HTTP data sources (fetcher)
  # Allowed destinations (default: the whole internet).
  allowCIDRs:
    - 0.0.0.0/0
  # Carved OUT of allowCIDRs to block lateral movement into the cluster. Defaults
  # to the pod + service CIDRs (network model) + link-local. RFC1918 is NOT
  # excluded by default so corporate/private data sources stay reachable; add them
  # here if the deployment forbids private-network egress.
  exceptCIDRs:
    - 198.18.0.0/16    # pod CIDR (network-model default)
    - 198.19.0.0/16    # service CIDR (network-model default)
    - 169.254.0.0/16   # link-local (cloud metadata, etc.)
