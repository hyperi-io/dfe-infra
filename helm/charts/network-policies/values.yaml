project: dfe
component: network-policies
env: local
cloud: local

# SSoT is argocd/values/common.yaml `networkModel`; these are chart defaults for
# a standalone render only. Every carve-out below reads them.
networkModel:
  podCIDR: "198.18.0.0/16"
  serviceCIDR: "198.19.0.0/16"
  linkLocalCIDR: "169.254.0.0/16"
  carveOut: [podCIDR, serviceCIDR, linkLocalCIDR]

# Namespaces that get DFE app policies (ingress from gateway + dfe-*)
dfeNamespaces:
  - dfe-local   # changes per env: dfe-dev, dfe-prod, etc.

# Data platform namespaces (ingress only from dfe-* namespaces).
# cnpg holds the DocumentDB store (appsets/layer2-data.yaml pins it there). Name
# only namespaces that exist -- a NetworkPolicy aimed at an absent namespace is
# rejected, which fails the whole Application sync and leaves the cluster with NO
# policies applied at all.
dataNamespaces:
  - cnpg
  - strimzi
  - clickhouse

# Operator namespaces -- the operators reconcile INTO the data namespaces, and
# the ClickHouse one also probes Keeper on 2181 and runs its DDL over 9000, so a
# name that does not match where the operator actually runs silently strands the
# whole cluster (dfe-infra#136).
# SSoT is argocd/values/common.yaml `operatorNamespaces`; these are chart
# defaults for a standalone render only.
operatorNamespaces:
  strimzi: strimzi
  clickhouse: clickhouse-operator-system
  # CloudNativePG, which polls each DocumentDB instance on its status port 8000.
  cnpg: cnpg-system

# Data-namespace pods whose ingress their operator's own NetworkPolicy states whole, by the label
# the operator writes on them. Policies are additive, so a pod data-ingress-policy selects takes
# every port from every DFE, data and operator namespace, and nothing narrower can take that back.
# Keeper is here because its client port holds every replicated table's coordination: the
# ClickHouse operator admits it only from pods labelled as the operator, in any namespace, and the
# clusters referencing the keeper (clickhouse-cluster's KeeperCluster turns that policy on).
# Empty selects every pod as before.
operatorIngressScoped:
  clickhouse.com/role: [clickhouse-keeper]

# Pod label that takes a workload OUT of the namespace-wide egress policies: the
# baseline, the backing services (allow-dfe-backing-egress) and the gateway
# (allow-gateway-egress).
# NetworkPolicies are additive: a pod the baseline selects can always reach the
# whole namespace, and nothing added later narrows that. A workload whose
# egress must be narrower carries this label and its own chart then states its
# WHOLE egress surface -- DNS and telemetry included, because it has no
# baseline left. Set it empty to select every pod as before.
egressScopedLabel: dfe.hyperi.io/egress-scoped

# Pod label naming the app whatever its instance is called, which
# argocd/values/apps/_common.yaml sets to the chart name on every thin-chart pod.
# A per-config instance's app.kubernetes.io/name is <app>-<source>, so each policy
# naming an app renders a second copy, "-instances", selecting on this label.
# Workloads outside the thin charts carry only app.kubernetes.io/name.
appLabel: dfe.hyperi.io/app

# Who reaches the DocumentDB store. Each instance pod runs PostgreSQL, which holds
# the documentdb superuser, with the gateway beside it, so a pod reaching either
# port is a step from owning every document. The apps listed here alone reach the
# gateway. The instances alone reach each other's PostgreSQL, and CloudNativePG
# alone reaches their status port. The pods leave data-ingress-policy and take
# their whole ingress from documentdb-ingress.yaml.
documentdbAccess:
  # appsets/layer2-data.yaml deploys the documentdb chart here.
  namespace: cnpg
  # The label CloudNativePG writes on every instance pod of the cluster.
  clusterLabel: cnpg.io/cluster
  cluster: dfe-documentdb
  # Container ports, which is what NetworkPolicy sees after DNAT.
  ports:
    - { port: 10260, protocol: TCP }
  # Streaming replication between instances.
  peerPorts:
    - { port: 5432, protocol: TCP }
  # The instance manager CloudNativePG polls, from operatorNamespaces.cnpg.
  operatorPorts:
    - { port: 8000, protocol: TCP }
  apps:
    - dfe-hyperdx   # mongodb.uri in argocd/values/apps/hyperdx/values.yaml

# Envoy Gateway namespace (source of ingress traffic)
gatewayNamespace: envoy-gateway-system

# Egress from the DFE app namespaces BACK to the gateway, for a pod that has to
# reach another component through the deployment's public hostname.
gatewayEgress:
  enabled: true
  # Envoy Gateway's managed proxy pods, so the policy does not open the whole
  # gateway namespace.
  podLabels:
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/component: proxy
  # The proxy's CONTAINER ports, which is what NetworkPolicy sees after DNAT --
  # not the Service's 443/80. Envoy Gateway offsets a privileged listener port by
  # 10000 unless EnvoyProxy sets useListenerPortAsContainerPort, which would make
  # these 443 and 80.
  ports:
    - { port: 10443, protocol: TCP }
    - { port: 10080, protocol: TCP }

# Autoscaler namespace. KEDA polls the in-namespace keda-shim for the pressure
# metric, so without this the metrics-api scaler times out and nothing scales.
kedaNamespace: keda
kedaShimPort: 8080

# OTel Collector namespace. Two directions: apps push OTLP out to otelPort, and
# the collector scrapes /metrics back in. Without the ingress half every DFE
# scrape target reports up=0 while pushed metrics keep arriving, so the gap
# looks like a slow endpoint rather than a blocked one.
otelNamespace: otel
otelPort: 4317
# The collector's OTLP/HTTP port, for the apps that push OTLP over HTTP
# (dfe-ui and dfe-hyperdx).
otelHttpPort: 4318

# EKS Pod Identity agent. A host-network DaemonSet, not a Service, so it sits
# outside the namespace model every other baseline rule uses -- every pod that
# resolves an AWS credential (the MSK bootstrap Job, an IAM-auth Kafka client,
# ClickHouse's object-store role) calls it directly at a fixed link-local
# address on every node. Address, port and the "host-network DaemonSet" shape
# are AWS-documented, not a cluster choice:
# https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
# ("occupying ports 80 and 2703 on the link-local address (169.254.170.23 for
# IPv4, [fd00:ec2::23] for IPv6)"). Only 80 is listed: that is the credentials
# endpoint AWS_CONTAINER_CREDENTIALS_FULL_URI calls; 2703 is the agent's own
# webhook port and no application pod calls it. The IPv6 address is left out
# on purpose -- podCIDR/serviceCIDR/linkLocalCIDR above are all IPv4, so this
# chart renders no IPv6 ipBlock anywhere else; a dual-stack deployment adding
# an IPv6 networkModel entry should extend baseline-egress.yaml to match.
# Disable on a cluster that never runs EKS Pod Identity to keep the baseline
# at its narrowest.
podIdentityAgent:
  enabled: true
  address: 169.254.170.23
  port: 80

# Internet EGRESS allow-list. The baseline is default-deny-egress, so apps that
# must INITIATE outbound to the internet need an explicit policy. fetcher polls
# external data-source APIs; archiver uploads to object storage (S3/GCS/Azure).
# This opens egress to the internet for ONLY those apps, on ONLY the ports they
# need, and carves OUT the cluster-internal ranges so a compromised fetcher cannot
# pivot laterally into pod/service space. Tighten allowCIDRs (or add an egress
# proxy via the app overlay's HTTP(S)_PROXY env) in locked-down environments.
# NOTE: this is the k8s policy layer only -- the cluster still needs a real
# internet route (cloud NAT gateway on private subnets, or node default route).
internetEgress:
  enabled: true
  # Apps (matched by app.kubernetes.io/name, then appLabel) granted internet egress.
  apps:
    - dfe-fetcher
    - dfe-archiver
  ports:
    - { port: 443, protocol: TCP }   # HTTPS APIs + S3/object storage
    - { port: 80,  protocol: TCP }   # plain-HTTP data sources (fetcher)
  # Allowed destinations (default: the whole internet).
  allowCIDRs:
    - 0.0.0.0/0
  # Carved OUT of allowCIDRs to block lateral movement into the cluster. Unset,
  # it is the networkModel ranges. RFC1918 is NOT excluded by default so
  # corporate/private data sources stay reachable; list them here if the
  # deployment forbids private-network egress.
  exceptCIDRs: ~

# EXTERNAL-SERVICE egress, DERIVED from the declared service modes. There is no
# enable flag here and there deliberately never will be: a purpose opens when the
# deployment DECLARES the matching external dependency, and stays shut otherwise.
#
#   clickhouse    <- clickhouse.mode: external
#   kafka         <- kafka.mode: external
#   oidc          <- oidc.enabled: true
#   secrets       <- vault.address non-empty, or secrets.provider: aws
#   elasticsearch <- elasticsearch.endpoint non-empty
#   otel          <- telemetry.mode: external, or otel.endpoint non-empty
#
# THE TRADE, stated plainly: setting a data-layer mode to external changes the
# cluster's network posture as a side effect. Choosing ClickHouse Cloud opens the
# ClickHouse clients' egress on the ClickHouse ports without a second decision
# anywhere. That is deliberate. The alternative is a pod that cannot reach the
# datastore it was just pointed at, crashlooping with nothing in the policy set to
# explain why, which is the failure this block exists to kill.
#
# Each purpose grants ONLY the ports that dependency speaks, so an app never
# inherits another purpose's ports -- the fetcher does not get ClickHouse ports
# because the loader needed them. `apps` matches app.kubernetes.io/name or appLabel, and the
# single entry "*" means every pod in the namespace. `appPorts` gives one app
# ports of its own in place of the purpose's. `providers` is keyed by the
# provider the declaration names (kafka.provider), and the entry for it replaces
# the purpose's ports, appPorts and extraNamespaceApps whole.
#
# baseline-egress rule 3 (the Kubernetes API allow) carries ports with no `to`,
# which in NetworkPolicy semantics is EVERY destination, so TCP 443 and 6443 are
# already open cluster-wide from any DFE or data namespace. The 443 entries below
# are what keeps a purpose working the day that rule is narrowed to the API
# server. Only the non-443 ports change reachability today.
#
# Only namespaces that ALREADY carry a baseline policy appear here. A
# NetworkPolicy is the thing that makes a pod default-deny, so adding one to a
# policy-free namespace (kafbat in `kafka`, the collector in `otel`, ESO, Envoy,
# cert-manager) would isolate a pod that is currently unrestricted and break it.
externalEgress:
  # Shared destination defaults. Any purpose may set its own allowCIDRs or
  # exceptCIDRs to override these -- an external ClickHouse has ONE known
  # endpoint, so pinning it is the tighter and better answer:
  #   externalEgress.clickhouse.allowCIDRs: ["203.0.113.7/32"]
  # Pinning allowCIDRs drops the shared exceptCIDRs, because Kubernetes rejects an
  # `except` entry outside its own `cidr`. Set the purpose's own exceptCIDRs to
  # carve anything out of a pinned range.
  allowCIDRs:
    - 0.0.0.0/0
  # Same lateral-movement carve-out internetEgress uses, applied to every purpose.
  exceptCIDRs: ~

  # Every chart that resolves clickhouse.host. All of them run beside the apps:
  # dfe-engine is the only thing that applies schema and it does it from its own
  # pod, so nothing needs egress from another namespace any more.
  clickhouse:
    apps:
      - dfe-loader        # dfe-loader/templates/deployment.yaml
      - dfe-engine        # dfe-engine/templates/deployment.yaml
      - dfe-hunt-runner   # dfe-engine/templates/hunt-runner.yaml
      - dfe-keda-shim     # dfe-engine/templates/keda-shim.yaml
      - dfe-hyperdx       # hyperdx/templates/deployment.yaml
    # Apps outside the DFE namespaces, keyed by the namespace they run in. The
    # namespace must already carry a baseline policy.
    extraNamespaceApps: {}
    # TLS ports only: ClickHouse Cloud's two, which every client here dials
    # (terraform/modules/managed-backends/offering.yaml). layer2-platform
    # replaces them with the cluster secret's clickhouse_port and
    # clickhouse_native_port, so a BYO server on plaintext 8123/9000 opens those
    # instead -- a deployer's choice, never the default, since credentials cross
    # an untrusted network here.
    ports:
      - { port: 8443, protocol: TCP }   # HTTPS interface
      - { port: 9440, protocol: TCP }   # native protocol over TLS

  # Every chart that resolves kafka.bootstrapServers. NOT kafbat (namespace
  # `kafka`) or the collector (namespace `otel`) -- neither namespace carries a
  # baseline policy, so both already have unrestricted egress and a policy here
  # would take it away.
  kafka:
    apps:
      # Creates the bootstrap and source topics, and holds its readiness (and so
      # every app's wait-for-engine) until the dead-letter topics are on the broker.
      - dfe-engine
      - dfe-receiver
      - dfe-loader
      - dfe-fetcher
      - dfe-archiver
      - dfe-transform-vrl
      - dfe-transform-vector
      - dfe-transform-elastic
      # dfe-transform-splack and dfe-transform-wasm are coming: alpha, unpublished, uncomment when they ship.
      # - dfe-transform-splack
      # - dfe-transform-wasm
    # The MSK bootstrap Job runs in `strimzi` (appsets/layer2-data.yaml pins the
    # kafka chart there) and writes the SCRAM principal's ACLs over the IAM
    # listener. That namespace already carries a baseline policy, so its egress
    # is denied until this names it.
    extraNamespaceApps:
      strimzi:
        - dfe-kafka        # kafka/templates/msk-bootstrap-job.yaml
    # A broker whose provider has no entry below, one the deployer brought: the
    # listener range Confluent Cloud, MSK and Redpanda Cloud publish between
    # them. 9092-9096 covers their SASL_SSL and SASL_PLAINTEXT listeners and 9098
    # is MSK's IAM listener.
    ports:
      - { port: 9092, protocol: TCP }
      - { port: 9093, protocol: TCP }
      - { port: 9094, protocol: TCP }
      - { port: 9095, protocol: TCP }
      - { port: 9096, protocol: TCP }
      - { port: 9098, protocol: TCP }   # MSK SASL/IAM
    # A managed broker the aws root builds opens only the ports its vendor serves
    # DFE on. Each list is offering.yaml's client_ports, plus its bootstrap_ports
    # for the bootstrap Job alone (terraform/modules/managed-backends);
    # scripts/tests/test_managed_backend_egress.py holds the two equal.
    providers:
      msk:
        ports:
          - { port: 9096, protocol: TCP }   # SASL/SCRAM, every app
        extraNamespaceApps:
          strimzi:
            - dfe-kafka
        appPorts:
          dfe-kafka:
            - { port: 9098, protocol: TCP }   # SASL/IAM, the bootstrap Job alone
      # Neither SaaS provider has a bootstrap Job: the vendor's tofu provider
      # writes the ACLs and topics, so nothing in strimzi dials the broker.
      confluent-cloud:
        ports:
          - { port: 9092, protocol: TCP }   # Kafka over TLS, bootstrap and brokers
      redpanda-cloud:
        ports:
          - { port: 9092, protocol: TCP }   # seed
          - { port: 9093, protocol: TCP }   # brokers
          - { port: 9094, protocol: TCP }
          - { port: 9095, protocol: TCP }

  # The engine fetches OIDC discovery and JWKS from the IdP itself. Envoy is not
  # here: the gateway runs in envoy-gateway-system, which carries no policy.
  oidc:
    apps:
      - dfe-engine
    ports:
      - { port: 443, protocol: TCP }

  # The store the engine writes what it mints to, and dfe-receiver reads its
  # ingest bearer tokens from. ESO is not here -- it runs in external-secrets with
  # no policy. layer2-platform declares provider aws from the cluster secret's
  # engine_secrets_prefix. No chart injects an OpenBao address into the engine
  # yet, so that half opens on the declaration alone.
  secrets:
    apps:
      - dfe-engine
      - dfe-receiver
    ports:
      - { port: 8200, protocol: TCP }   # OpenBao / Vault API
      - { port: 443,  protocol: TCP }   # cloud KMS and secret-manager APIs
    providers:
      # Secrets Manager and KMS answer on HTTPS alone, over NAT: no VPC endpoint.
      aws:
        ports:
          - { port: 443, protocol: TCP }

  # Live index-server schema import, an engine surface. dfe-transform-elastic is
  # deliberately NOT here: it is a Kafka-to-Kafka transform with no Elasticsearch
  # client at all, and its chart exposes no Elasticsearch endpoint, so granting it
  # these ports would be the port-inheritance this model exists to stop.
  elasticsearch:
    apps:
      - dfe-engine
    ports:
      - { port: 9200, protocol: TCP }   # Elasticsearch / OpenSearch HTTP
      - { port: 443,  protocol: TCP }   # managed endpoints

  # Every DFE pod emits OTLP, so this one is namespace-wide rather than an app
  # list that would have to be maintained against every new app.
  otel:
    apps:
      - "*"
    ports:
      - { port: 4317, protocol: TCP }   # OTLP/gRPC
      - { port: 4318, protocol: TCP }   # OTLP/HTTP
      - { port: 443,  protocol: TCP }   # managed collectors behind HTTPS
