# All DFE and data namespaces can send telemetry to OTel Collector
{{- $allNamespaces := concat .Values.dfeNamespaces .Values.dataNamespaces }}
{{- range $allNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-egress
  namespace: {{ . }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow egress to Kubernetes API (required by operators: CNPG, Strimzi, etc.)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Allow egress to OTel Collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.otelNamespace }}
      ports:
        - port: {{ $.Values.otelPort }}
          protocol: TCP
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
