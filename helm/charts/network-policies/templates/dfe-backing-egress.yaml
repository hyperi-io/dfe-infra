# DFE app egress to backing services -- the cross-namespace flows the baseline
# egress policy intentionally omits (see baseline-egress.yaml header, "Add
# per-service egress policies ... to ClickHouse, Kafka, FerretDB"). WITHOUT this the
# data plane (engine/receiver/loader/ui) cannot reach ClickHouse, Kafka, the
# bundled Forgejo deploy repo, or HyperDX -- every pod that tries CrashLoopBackOffs
# (proven live 2026-07-16: engine CH connect timed out, loader/receiver could not
# reach their backing services). Applied to the DFE app namespaces only.
{{- $optOut := .Values.egressScopedLabel }}
{{- $store := .Values.ferretdbEgress }}
{{- range $ns := .Values.dfeNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dfe-backing-egress
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  # A pod carrying the opt-out states its whole egress itself, as for the baseline.
  {{- if $optOut }}
  podSelector:
    matchExpressions:
      - key: {{ $optOut }}
        operator: DoesNotExist
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Egress
  egress:
    # ClickHouse: HTTP 8123 + native 9000, and the same two over TLS, 8443 + 9440
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clickhouse
      ports:
        - { port: 8123, protocol: TCP }
        - { port: 9000, protocol: TCP }
        - { port: 8443, protocol: TCP }
        - { port: 9440, protocol: TCP }
    # Kafka -- Strimzi brokers (plaintext 9092 + TLS 9093 listeners)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: strimzi
      ports:
        - { port: 9092, protocol: TCP }
        - { port: 9093, protocol: TCP }
    # Bundled Forgejo deploy repo (dfe-engine gitops writes here)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - { port: 3000, protocol: TCP }
{{- /* FerretDB is not here: its login is the backend's PostgreSQL superuser, so only
       ferretdbEgress.apps reach it, and nothing in this namespace reaches the backend. */}}
{{- range $app := $store.apps }}
{{- range $sel := include "network-policies.appSelectors" (dict "root" $ "app" $app) | fromYamlArray }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ferretdb-egress-{{ $app }}{{ $sel.suffix }}
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  podSelector:
    {{- toYaml $sel.podSelector | nindent 4 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $store.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $store.podLabels | nindent 14 }}
      ports:
        {{- toYaml $store.ports | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
