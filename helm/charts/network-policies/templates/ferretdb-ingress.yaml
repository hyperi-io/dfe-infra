{{- /*
  The whole ingress of FerretDB and its PostgreSQL backend. data-ingress-policy leaves
  both pods out, because policies are additive and it admits every DFE, data, operator,
  gateway and collector namespace on every port. Kubelet probes come from the node,
  which NetworkPolicy always admits.
*/ -}}
{{- if include "network-policies.ferretdbFenced" . }}
{{- $store := .Values.ferretdbAccess }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ferretdb-ingress
  namespace: {{ $store.namespace }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $store.nameLabel }}: {{ $store.proxy }}
  policyTypes:
    - Ingress
  {{- if $store.apps }}
  ingress:
    - from:
        {{- range $ns := .Values.dfeNamespaces }}
        {{- range $app := $store.apps }}
        {{- range $sel := include "network-policies.appSelectors" (dict "root" $ "app" $app) | fromYamlArray }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            {{- toYaml $sel.podSelector | nindent 12 }}
        {{- end }}
        {{- end }}
        {{- end }}
      ports:
        {{- toYaml $store.ports | nindent 8 }}
  {{- else }}
  ingress: []
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ferretdb-backend-ingress
  namespace: {{ $store.namespace }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $store.nameLabel }}: {{ $store.backend }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{ $store.nameLabel }}: {{ $store.proxy }}
      ports:
        {{- toYaml $store.backendPorts | nindent 8 }}
{{- end }}
