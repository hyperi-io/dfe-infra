# Baseline egress policy — applied to every DFE/data namespace.
#
# Standard 3-policy zero-trust baseline per
# https://kubernetes.io/docs/concepts/services-networking/network-policies/
# and https://github.com/ahmetb/kubernetes-network-policy-recipes.
#
# This policy expresses the default egress surface every namespace needs:
#   1. Intra-namespace pod-to-pod (required for clustered services like
#      ClickHouse replication, Kafka broker replication, CNPG → CNPG).
#   2. DNS (UDP + TCP 53) to the cluster DNS service.
#   3. Kubernetes API (TCP 443, 6443) — required by operators (CNPG, Strimzi,
#      ClickHouse operator) and by service-account auth from application pods.
#   4. OTel Collector (TCP 4317) in the OTel namespace, for telemetry.
#   5. EKS Pod Identity agent (TCP 80 on a fixed link-local address) — every
#      pod resolving an AWS credential calls it directly; see values.yaml
#      podIdentityAgent for the citation. A namespaceSelector cannot reach it,
#      because the agent is a host-network DaemonSet, not a namespaced Service.
#
# Everything else is denied by default (Kubernetes NetworkPolicy semantics).
# Add per-service egress policies layered on top for specific cross-namespace
# flows (e.g. DFE app egress to CNPG, ClickHouse, Kafka).
#
# THE OPT-OUT. Policies are additive, so a pod this one selects can always
# reach the whole namespace and no later policy can take that back. A workload
# whose egress must be narrower than the namespace therefore has to be OUTSIDE
# this policy, and it says so with the label below; its own chart then carries
# its WHOLE egress surface, DNS and telemetry included. Used by the edge-fleet
# VPN, whose tunnel clients may reach the receiver and nothing else.
{{- /* The agent's address is AWS-documented and constant, and the one address
       it must never become is the instance metadata service: 169.254.169.254
       on port 80 hands a caller the NODE's role, which carries the CNI policy
       on every resource in the account. One character apart from the value
       below, and additive policy means every pod in every DFE namespace would
       hold it with nothing later able to take it back. */ -}}
{{- if .Values.podIdentityAgent.enabled }}
{{- if ne .Values.podIdentityAgent.address "169.254.170.23" }}
{{- fail (printf "podIdentityAgent.address is %q -- the EKS Pod Identity agent answers on 169.254.170.23 and nothing else may be opened to every DFE namespace here (169.254.169.254 is the instance metadata service and hands out the node's role). Set podIdentityAgent.enabled to false on a cluster that runs no Pod Identity." .Values.podIdentityAgent.address) -}}
{{- end }}
{{- if ne (int .Values.podIdentityAgent.port) 80 }}
{{- fail (printf "podIdentityAgent.port is %v -- only 80, the credentials endpoint, is opened; 2703 is the agent's own webhook and no application pod calls it" .Values.podIdentityAgent.port) -}}
{{- end }}
{{- end }}
{{- $allNamespaces := concat .Values.dfeNamespaces .Values.dataNamespaces }}
{{- $optOut := .Values.egressScopedLabel }}
{{- range $allNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-baseline-egress
  namespace: {{ . }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  {{- if $optOut }}
  podSelector:
    matchExpressions:
      - key: {{ $optOut }}
        operator: DoesNotExist
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Egress
  egress:
    # 1. Intra-namespace pod-to-pod
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    # 2. DNS resolution (cluster DNS)
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 3. Kubernetes API server (used by operators and service-account auth)
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # 4. OTel Collector for telemetry
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.otelNamespace }}
      ports:
        - port: {{ $.Values.otelPort }}
          protocol: TCP
    # 5. EKS Pod Identity agent (host-network DaemonSet, not a namespaced
    #    Service, so this is an ipBlock rather than a namespaceSelector)
    {{- if $.Values.podIdentityAgent.enabled }}
    - to:
        - ipBlock:
            cidr: {{ $.Values.podIdentityAgent.address }}/32
      ports:
        - port: {{ $.Values.podIdentityAgent.port }}
          protocol: TCP
    {{- end }}
{{- end }}
