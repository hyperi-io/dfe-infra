{{- /*
  The whole ingress of the DocumentDB instances. data-ingress-policy leaves their pods
  out, because policies are additive and it admits every DFE, data, operator, gateway
  and collector namespace on every port. Kubelet probes come from the node, which
  NetworkPolicy always admits.
*/ -}}
{{- if include "network-policies.documentdbFenced" . }}
{{- $store := .Values.documentdbAccess }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-documentdb-ingress
  namespace: {{ $store.namespace }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $store.clusterLabel }}: {{ $store.cluster }}
  policyTypes:
    - Ingress
  ingress:
    {{- if $store.apps }}
    - from:
        {{- range $ns := .Values.dfeNamespaces }}
        {{- range $app := $store.apps }}
        {{- range $sel := include "network-policies.appSelectors" (dict "root" $ "app" $app) | fromYamlArray }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            {{- toYaml $sel.podSelector | nindent 12 }}
        {{- end }}
        {{- end }}
        {{- end }}
      ports:
        {{- toYaml $store.ports | nindent 8 }}
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{ $store.clusterLabel }}: {{ $store.cluster }}
      ports:
        {{- toYaml $store.peerPorts | nindent 8 }}
    {{- with .Values.operatorNamespaces.cnpg }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        {{- toYaml $store.operatorPorts | nindent 8 }}
    {{- end }}
{{- end }}
