# DFE app egress to the deployment's OWN gateway.
#
# baseline-egress rule 3 permits TCP 443 to anywhere, which reads as "pods may
# reach the gateway". They cannot: the Envoy Service maps 443 to container port
# 10443, NetworkPolicy is evaluated AFTER DNAT, so the packet is judged against
# 10443 and dropped. The tell is refused-vs-timeout -- 443 straight at the proxy
# pod is refused by the kernel, 10443 never arrives (#223).
#
# Anything that has to use a public hostname rather than a Service name makes
# this hop; the engine's OIDC discovery fetch is the first.
{{- $gw := .Values.gatewayEgress }}
{{- if $gw.enabled }}
{{- range .Values.dfeNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: {{ . }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.gatewayNamespace }}
          # The managed proxy pods, not the whole gateway namespace -- the
          # control plane is in there too and nothing in DFE calls it.
          podSelector:
            matchLabels:
              {{- toYaml $gw.podLabels | nindent 14 }}
      ports:
        {{- toYaml $gw.ports | nindent 8 }}
{{- end }}
{{- end }}
