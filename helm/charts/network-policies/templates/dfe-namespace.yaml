{{- range .Values.dfeNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dfe-ingress-policy
  namespace: {{ . }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow from Envoy Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.gatewayNamespace }}
    # Allow from other DFE namespaces
    {{- range $.Values.dfeNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- if $.Values.kedaNamespace }}
    # KEDA polls the keda-shim for the scaling-pressure metric.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.kedaNamespace }}
      ports:
        - protocol: TCP
          port: {{ $.Values.kedaShimPort }}
    {{- end }}
    {{- if $.Values.otelNamespace }}
    # The collector SCRAPES /metrics here, which is inbound and needs its own
    # rule -- the otel entry elsewhere is egress, for apps pushing OTLP out.
    # Unported: scrape targets are discovered from pod annotations, so a port
    # list would silently drop any app that picks a different one.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.otelNamespace }}
    {{- end }}
{{- end }}
