{{- $fenced := include "network-policies.ferretdbFenced" . }}
{{- range $ns := .Values.dataNamespaces }}
{{- $left := list }}
{{- range $key, $values := $.Values.operatorIngressScoped }}
{{- $left = append $left (dict "key" $key "values" $values) }}
{{- end }}
{{- with $.Values.ferretdbAccess }}
{{- if and $fenced (eq $ns .namespace) }}
{{- /* FerretDB's two pods take their whole ingress from ferretdb-ingress.yaml. */}}
{{- $left = append $left (dict "key" .nameLabel "values" (list .proxy .backend)) }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-ingress-policy
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  {{- if $left }}
  podSelector:
    matchExpressions:
      {{- range $left }}
      - key: {{ .key | quote }}
        operator: NotIn
        values: {{ toJson .values }}
      {{- end }}
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Ingress
  ingress:
    # Allow from DFE app namespaces
    {{- range $.Values.dfeNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    # Allow from other data namespaces (HyperDX->ClickHouse)
    {{- range $.Values.dataNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    # Allow from operator namespaces (Strimzi, ClickHouse operators)
    {{- range $operator, $operatorNamespace := $.Values.operatorNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $operatorNamespace }}
    {{- end }}
    # Allow from Envoy Gateway (external clients reach data services via gateway)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.gatewayNamespace }}
    # Allow from the OTel collector (its ClickHouse exporter writes the
    # otel_* tables the embedded HyperDX reads)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.otelNamespace }}
{{- end }}
