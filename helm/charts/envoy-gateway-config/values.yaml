project: dfe
component: gateway
env: local
cloud: local

gateway:
  name: dfe-gateway
  namespace: envoy-gateway-system
  listenerPort: 443
  # SWAPPABLE front-door LB for the whole HTTP plane (UI, HyperDX, engine API).
  # Realised via an EnvoyProxy CR referenced by the GatewayClass (parametersRef).
  # Swap cloud LB <-> k8s LB with the same values the receiver uses:
  #   type            -- LoadBalancer (cloud/MetalLB) | NodePort (front a HW LB)
  #   loadBalancerClass -- "" = cluster default CCM; "service.k8s.aws/nlb" for AWS;
  #                      a MetalLB/kube-vip class on bare metal
  #   annotations     -- provider LB config (NLB scheme, etc.)
  #   loadBalancerSourceRanges -- optional CIDR allow-list at the edge
  service:
    type: LoadBalancer
    loadBalancerClass: ""
    annotations: {}
    loadBalancerSourceRanges: []

tls:
  issuerName: dfe-letsencrypt

  # CNSA 2.0: the wildcard leaf cert is ECDSA P-384 / SHA-384 (192-bit),
  # not cert-manager's RSA-2048/SHA-256 default. Applied via the
  # cert-manager private-key annotations on the Gateway (gateway-shim
  # reads them), so the shim-issued dfe-wildcard-tls cert uses this key.
  privateKey:
    algorithm: ECDSA        # ECDSA | RSA
    size: 384               # P-384 for ECDSA; 3072+ if RSA is ever forced
    rotationPolicy: Always  # fresh key each renewal (algorithm agility)

  # Edge TLS posture (Envoy Gateway ClientTrafficPolicy). Track 3 owns
  # this; Track 1 owns the jwt_authn filter (templates/envoy-patch-policy.yaml).
  edge:
    enabled: true
    # TLS floor. Default 1.2 = the commercial-safe `prod` posture (TLS 1.2
    # minimum, 1.3 preferred) - broad client + enterprise-middlebox compat.
    # Still removes SSLv3/TLS 1.0/1.1, and at 1.2 the cipher list below
    # holds the line at AES-256-GCM. CNSA `highsec` deployments set
    # minVersion "1.3" via a values overlay. Values MUST be quoted strings
    # ("1.2"): an unquoted 1.2 parses as a float and is rejected.
    minVersion: "1.2"
    maxVersion: "1.3"
    # Key-exchange groups, preference order:
    # - X25519MLKEM768: hybrid post-quantum group giving real harvest-now-
    #   decrypt-later protection on the wire today (TLS 1.3 group, IANA
    #   0x11EC; mainstream in 2026: Chrome/Firefox/OpenSSL 3.5/Go 1.24/
    #   BoringSSL). HONEST caveats: its PQC half is ML-KEM-768 (below CNSA
    #   2.0's ML-KEM-1024) and its classical half is X25519 (not a NIST
    #   curve). The CNSA-pure hybrid is SecP384r1MLKEM1024 (P-384 + ML-KEM-
    #   1024) - specified but thin deployment; add it here (preferred) once
    #   BoringSSL/Envoy accept the name. We enable the interoperable group
    #   now for actual PQC protection over CNSA-purity.
    # - P-384: CNSA 1.0 classical curve.  - X25519: broad client compat.
    #   Non-PQC clients fall back to these, so offering the hybrid is a safe
    #   strict upgrade, not a compatibility break.
    # NB the accepted name is BoringSSL/Envoy-version-specific (older Envoy
    # used X25519Kyber768Draft00); this cluster runs envoy v1.37.
    ecdhCurves:
      - X25519MLKEM768
      - P-384
      - X25519
    # AEAD suites offered at TLS 1.2 (ignored at 1.3, where BoringSSL fixes
    # the suite set). AES-256-GCM first so a 1.2 fallback still lands on the
    # CNSA symmetric target; no AES-128, no CBC.
    ciphers:
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384

  # Internal mesh CA (Track 3 keystone). A self-signed root mints an
  # ECDSA P-384 CA exposed as the `dfe-internal-ca` ClusterIssuer;
  # backing-service certs (ClickHouse, Kafka, Mongo/FerretDB, CNPG, OTLP)
  # chain to it so in-cluster TLS shares one trust root. Inert until a
  # Certificate references the issuer -- adding it changes no running
  # workload, so it is safe to land ahead of the per-service rollout.
  internalCA:
    enabled: true
    issuerName: dfe-internal-ca
    # A ClusterIssuer reads its CA secret from cert-manager's
    # cluster-resource-namespace, so the CA cert + bootstrap Issuer live
    # there (default: cert-manager).
    namespace: cert-manager
    duration: "87600h"     # 10y root (SHA-384 signature follows P-384)
    renewBefore: "720h"    # 30d

  acme:
    email: ""
    server: "https://acme-v02.api.letsencrypt.org/directory"
    cloudflareTokenSecretName: cloudflare-api-token
    cloudflareTokenSecretKey: token

  # Vault/OpenBao PKI issuer mode -- the private-CA swap seam. vault.server
  # set renders the issuerName ClusterIssuer Vault-backed; acme.email set
  # renders it ACME (set exactly one). AppRole SecretID Secret is seeded by
  # bootstrap.sh from DFE_CERTMANAGER_SECRET_ID.
  vault:
    server: ""             # e.g. https://bao.example.com:8200
    path: ""               # PKI sign path, e.g. pki_tls/sign/example-role
    caBundle: ""           # base64 PEM chain that verifies `server`'s TLS
    appRole:
      path: approle
      roleId: ""
      secretName: cert-manager-approle
      secretKey: secretId

domain: ""

# Where the DFE app services run. Routes with no explicit backendNamespace are
# placed HERE so route and backend share a namespace (only the parentRef
# crosses namespaces, which the Gateway's allowedRoutes permits and needs no
# ReferenceGrant). bootstrap.sh passes it from DFE_NAMESPACE; empty falls back
# to the release namespace, where an app backendRef cannot resolve.
appNamespace: ""

# HTTPRoutes — map hostnames to backend services
routes:
  dfeUi:
    enabled: true
    hostname: "dfe"           # becomes {hostname}.{domain}
    backendService: dfe-ui
    backendNamespace: ""      # set via ArgoCD values overlay
    backendPort: 3000
    pathPrefix: /

  dfeEngine:
    enabled: true
    hostname: "dfe"
    backendService: dfe-engine
    backendNamespace: ""
    backendPort: 8000
    # /api/v1, never /api: NextAuth serves /api/auth/* on dfe-ui at the same
    # origin (the docker proxy draws the same line).
    pathPrefix: /api/v1

  argocd:
    enabled: true
    hostname: "argocd"
    backendService: argocd-server
    backendNamespace: argocd
    backendPort: 443

  hyperdx:
    enabled: true
    hostname: "hyperdx"
    backendService: dfe-hyperdx
    backendNamespace: ""      # set in values overlay (deployed with dfe-ui wave 5)
    backendPort: 8080

  # Forgejo (in-cluster deploy-repo FALLBACK git host). Infra UI -> default
  # internal; flip enabled:true to expose. Only deployed when no external git is
  # supplied (see layer2-deploy-repo appset).
  forgejo:
    enabled: false
    hostname: "forgejo"
    backendService: dfe-forgejo
    backendNamespace: forgejo
    backendPort: 3000

  # Kafbat (Kafka UI). Infra UI -> default internal; flip enabled:true to expose
  # (DFE test deployments do). Does its OWN OIDC (not an oidc.targetRoutes edge
  # policy), so do NOT add it there -- see the integrated-app auth pattern.
  kafbat:
    enabled: false
    hostname: "kafbat"
    backendService: dfe-kafbat
    backendNamespace: kafka
    backendPort: 8080

  # Deployment links page (bundled chart, ns links). Infra UI -> default
  # internal; flip enabled:true to expose. The page has NO auth of its own, so
  # exposing it without oidc.enabled leaves it open to the network -- when OIDC
  # is on it is fronted by the ADMIN policy (oidc.adminGroups), not the
  # standard targetRoutes one.
  links:
    enabled: false
    hostname: "links"
    backendService: dfe-links
    backendNamespace: links
    backendPort: 8080

# OIDC — disabled by default (local auth is default).
# Each provider gets its own SecurityPolicy targeting the dfe-engine HTTPRoute.
# Provider addition/removal is a Helm values change + ArgoCD sync — NOT a
# dfe-engine API call. dfe-infra owns this config, dfe-engine only reads headers.
oidc:
  enabled: false
  # ESO ClusterSecretStore used to pull each provider's client secret from Vault
  # into a dfe-oidc-<name> K8s Secret (key: client-secret) the SecurityPolicy refs.
  secretStoreName: dfe-secret-store
  # Interactive HTTPRoutes the OIDC SecurityPolicy fronts. One policy is
  # generated per route, each with its OWN redirectURL on its OWN hostname
  # (cookies must be set on the host the user is on). Universal: add any future
  # interactive service's route here -- {name = HTTPRoute metadata.name,
  # hostname = its subdomain label under {domain}, optional namespace when the
  # route is not in appNamespace} -- and it is fronted with no policy-code
  # change. A SecurityPolicy must live in its target route's namespace, so
  # each policy (and the provider's client-secret ExternalSecret) is rendered
  # there. NOT a blanket Gateway-level policy: dfe-engine /api machine paths
  # use API-key/JWT and must not be redirected to OIDC login.
  targetRoutes:
    - name: dfe-engine
      hostname: dfe
    - name: hyperdx
      hostname: hyperdx
  # Groups whose members may reach the ADMIN surfaces (the links page). The
  # canonical names come from dfe-engine docs/control-plane/rbac-vocabulary.md.
  adminGroups:
    - dfe-admins
    - dfe-infra
  providers: []
  # Example (jwksUrl feeds the admin policy's claim checks; default
  # {issuerUrl}/keys matches dex -- set it for providers with another layout):
  # providers:
  #   - name: google-workspace
  #     issuerUrl: https://accounts.google.com
  #     clientId: "123456.apps.googleusercontent.com"
  #     clientSecretName: dfe-oidc-google
  #     clientSecretKey: client-secret
  #     scopes: [openid, email, profile, groups]
  #     jwksUrl: https://www.googleapis.com/oauth2/v3/certs

# jwt_authn filter — chains after OIDC to extract claims into headers.
# These headers are the contract between Envoy and dfe-engine.
jwtAuthn:
  enabled: false
  issuer: ""
  audiences: []
  forwardHeaders:
    subject: X-Oidc-Subject
    groups: X-Oidc-Groups
    user: X-Forwarded-User    # backward compat (nginx convention)
