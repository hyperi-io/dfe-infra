project: dfe
component: gateway
env: local
cloud: local

gateway:
  name: dfe-gateway
  namespace: envoy-gateway-system
  listenerPort: 443

tls:
  issuerName: dfe-letsencrypt
  acme:
    email: ""
    server: "https://acme-v02.api.letsencrypt.org/directory"
    cloudflareTokenSecretName: cloudflare-api-token
    cloudflareTokenSecretKey: token

domain: ""

# HTTPRoutes — map hostnames to backend services
routes:
  dfeUi:
    enabled: true
    hostname: "dfe"           # becomes {hostname}.{domain}
    backendService: dfe-ui
    backendNamespace: ""      # set via ArgoCD values overlay
    backendPort: 3000
    pathPrefix: /

  dfeEngine:
    enabled: true
    hostname: "dfe"
    backendService: dfe-engine
    backendNamespace: ""
    backendPort: 8000
    pathPrefix: /api

  argocd:
    enabled: true
    hostname: "argocd"
    backendService: argocd-server
    backendNamespace: argocd
    backendPort: 443

  hyperdx:
    enabled: true
    hostname: "hyperdx"
    backendService: dfe-hyperdx
    backendNamespace: ""      # set in values overlay (deployed with dfe-ui wave 5)
    backendPort: 8080

# OIDC — disabled by default (local auth is default).
# Each provider gets its own SecurityPolicy targeting the dfe-engine HTTPRoute.
# Provider addition/removal is a Helm values change + ArgoCD sync — NOT a
# dfe-engine API call. dfe-infra owns this config, dfe-engine only reads headers.
oidc:
  enabled: false
  providers: []
  # Example:
  # providers:
  #   - name: google-workspace
  #     issuerUrl: https://accounts.google.com
  #     clientId: "123456.apps.googleusercontent.com"
  #     clientSecretName: dfe-oidc-google
  #     clientSecretKey: client-secret
  #     scopes: [openid, email, profile]

# jwt_authn filter — chains after OIDC to extract claims into headers.
# These headers are the contract between Envoy and dfe-engine.
jwtAuthn:
  enabled: false
  issuer: ""
  audiences: []
  forwardHeaders:
    subject: X-Oidc-Subject
    groups: X-Oidc-Groups
    user: X-Forwarded-User    # backward compat (nginx convention)
