project: dfe
component: gateway
env: local
cloud: local

gateway:
  name: dfe-gateway
  namespace: envoy-gateway-system
  listenerPort: 443
  # SWAPPABLE front-door LB for the whole HTTP plane (UI, HyperDX, engine API).
  # Realised via an EnvoyProxy CR referenced by the GatewayClass (parametersRef).
  # Swap cloud LB <-> k8s LB with the same values the receiver uses:
  #   type            -- LoadBalancer (cloud/MetalLB) | NodePort (front a HW LB)
  #   loadBalancerClass -- "" = cluster default CCM; "service.k8s.aws/nlb" for AWS;
  #                      a MetalLB/kube-vip class on bare metal
  #   annotations     -- provider LB config (NLB scheme, etc.)
  #   loadBalancerSourceRanges -- optional CIDR allow-list at the edge
  service:
    type: LoadBalancer
    loadBalancerClass: ""
    annotations: {}
    loadBalancerSourceRanges: []

tls:
  issuerName: dfe-letsencrypt
  acme:
    email: ""
    server: "https://acme-v02.api.letsencrypt.org/directory"
    cloudflareTokenSecretName: cloudflare-api-token
    cloudflareTokenSecretKey: token

domain: ""

# HTTPRoutes — map hostnames to backend services
routes:
  dfeUi:
    enabled: true
    hostname: "dfe"           # becomes {hostname}.{domain}
    backendService: dfe-ui
    backendNamespace: ""      # set via ArgoCD values overlay
    backendPort: 3000
    pathPrefix: /

  dfeEngine:
    enabled: true
    hostname: "dfe"
    backendService: dfe-engine
    backendNamespace: ""
    backendPort: 8000
    pathPrefix: /api

  argocd:
    enabled: true
    hostname: "argocd"
    backendService: argocd-server
    backendNamespace: argocd
    backendPort: 443

  hyperdx:
    enabled: true
    hostname: "hyperdx"
    backendService: dfe-hyperdx
    backendNamespace: ""      # set in values overlay (deployed with dfe-ui wave 5)
    backendPort: 8080

  # Forgejo (in-cluster deploy-repo FALLBACK git host). Infra UI -> default
  # internal; flip enabled:true to expose. Only deployed when no external git is
  # supplied (see layer2-deploy-repo appset).
  forgejo:
    enabled: false
    hostname: "forgejo"
    backendService: dfe-forgejo
    backendNamespace: forgejo
    backendPort: 3000

  # Kafbat (Kafka UI). Infra UI -> default internal; flip enabled:true to expose
  # (DFE test deployments do). Does its OWN OIDC (not an oidc.targetRoutes edge
  # policy), so do NOT add it there -- see the integrated-app auth pattern.
  kafbat:
    enabled: false
    hostname: "kafbat"
    backendService: dfe-kafbat
    backendNamespace: kafka
    backendPort: 8080

# OIDC — disabled by default (local auth is default).
# Each provider gets its own SecurityPolicy targeting the dfe-engine HTTPRoute.
# Provider addition/removal is a Helm values change + ArgoCD sync — NOT a
# dfe-engine API call. dfe-infra owns this config, dfe-engine only reads headers.
oidc:
  enabled: false
  # ESO ClusterSecretStore used to pull each provider's client secret from Vault
  # into a dfe-oidc-<name> K8s Secret (key: client-secret) the SecurityPolicy refs.
  secretStoreName: dfe-secret-store
  # Interactive HTTPRoutes the OIDC SecurityPolicy fronts. One policy is
  # generated per route, each with its OWN redirectURL on its OWN hostname
  # (cookies must be set on the host the user is on). Universal: add any future
  # interactive service's route here -- {name = HTTPRoute metadata.name,
  # hostname = its subdomain label under {domain}} -- and it is fronted with no
  # policy-code change. NOT a blanket Gateway-level policy: dfe-engine /api
  # machine paths use API-key/JWT and must not be redirected to OIDC login.
  targetRoutes:
    - name: dfe-engine
      hostname: dfe
    - name: hyperdx
      hostname: hyperdx
  providers: []
  # Example:
  # providers:
  #   - name: google-workspace
  #     issuerUrl: https://accounts.google.com
  #     clientId: "123456.apps.googleusercontent.com"
  #     clientSecretName: dfe-oidc-google
  #     clientSecretKey: client-secret
  #     scopes: [openid, email, profile]

# jwt_authn filter — chains after OIDC to extract claims into headers.
# These headers are the contract between Envoy and dfe-engine.
jwtAuthn:
  enabled: false
  issuer: ""
  audiences: []
  forwardHeaders:
    subject: X-Oidc-Subject
    groups: X-Oidc-Groups
    user: X-Forwarded-User    # backward compat (nginx convention)
