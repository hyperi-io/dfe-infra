{{- if .Values.routes.dfeEngine.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dfe-engine
  namespace: {{ .Values.routes.dfeEngine.backendNamespace | default .Values.appNamespace | default .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ .Values.routes.dfeEngine.hostname | default .Values.hostnames.dfe }}.{{ .Values.domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.routes.dfeEngine.pathPrefix }}
        {{- /* Engine-owned root paths on the shared hostname: the Swagger
             surface and /.well-known (JWKS + OIDC discovery, public so peers
             and the edge jwt_authn verify DFE tokens). dfe-ui owns every
             other root path. */}}
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /redoc
        - path:
            type: PathPrefix
            value: /openapi.json
        - path:
            type: PathPrefix
            value: /.well-known
      backendRefs:
        - name: {{ .Values.routes.dfeEngine.backendService }}
          port: {{ .Values.routes.dfeEngine.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
