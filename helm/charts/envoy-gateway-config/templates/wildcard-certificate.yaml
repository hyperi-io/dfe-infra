{{- if .Values.tls.wildcardCertificate.enabled }}
# The edge wildcard cert the https listener terminates with, requested explicitly
# because the Gateway-annotation route needs a cert-manager feature gate that is
# off by default and cannot be assumed on a cluster we do not own.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dfe-wildcard-tls
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  secretName: dfe-wildcard-tls
  dnsNames:
    - "*.{{ .Values.domain }}"
    - {{ .Values.domain | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.tls.issuerName }}
  # CNSA 2.0: ECDSA P-384 / SHA-384, not cert-manager's RSA-2048 default.
  privateKey:
    algorithm: {{ .Values.tls.privateKey.algorithm }}
    size: {{ .Values.tls.privateKey.size }}
    rotationPolicy: {{ .Values.tls.privateKey.rotationPolicy }}
{{- end }}
