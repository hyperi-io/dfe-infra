{{- if include "envoy-gateway-config.routeEnabled" (dict "ctx" . "key" "receiver") }}
# The dfe-receiver ingest door for exposure.mode: internal -- machine ingest
# (JSON POSTs to /ingest), never edge-OIDC'd because senders hold no browser
# session. Caller authentication is the receiver's own server.auth, which
# defaults to none.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routes.receiver.routeName }}
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" . "key" "receiver") }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ include "envoy-gateway-config.routeHost" (dict "ctx" . "key" "receiver") }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ .Values.routes.receiver.backendService }}
          port: {{ .Values.routes.receiver.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
