{{- if .Values.routes.otel.enabled }}
# Platform OTLP/HTTP ingest on the standard name otel.{domain} -- machine
# telemetry, never edge-OIDC'd (senders hold no browser session).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel
  namespace: {{ .Values.routes.otel.backendNamespace | default .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ .Values.routes.otel.hostname | default .Values.hostnames.otel }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ .Values.routes.otel.backendService }}
          port: {{ .Values.routes.otel.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
