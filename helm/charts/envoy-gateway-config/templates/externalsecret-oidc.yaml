{{- if .Values.oidc.enabled }}
{{- /* Policies live in their target route's namespace, so each provider's
       client secret must materialise in every namespace hosting one. */}}
{{- $namespaces := list }}
{{- range $route := .Values.oidc.targetRoutes }}
{{- $ns := $route.namespace | default $.Values.appNamespace | default $.Release.Namespace }}
{{- if not (has $ns $namespaces) }}{{- $namespaces = append $namespaces $ns }}{{- end }}
{{- end }}
{{- if .Values.routes.links.enabled }}
{{- $ns := .Values.routes.links.backendNamespace | default .Release.Namespace }}
{{- if not (has $ns $namespaces) }}{{- $namespaces = append $namespaces $ns }}{{- end }}
{{- end }}
{{- range $provider := .Values.oidc.providers }}
{{- range $ns := $namespaces }}
---
# Materialise the OIDC client secret for this provider from Vault into a K8s
# Secret named dfe-oidc-<name> (key: client-secret), which the SecurityPolicy
# references. ESO pulls from ClusterSecretStore {{ $.Values.oidc.secretStoreName }} at
# <project>/<env>/oidc/<name>.client-secret. dfe-engine writes that Vault secret
# when an admin configures the provider (engine is the OIDC SSoT).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dfe-oidc-{{ $provider.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.oidc.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $provider.clientSecretName | default (printf "dfe-oidc-%s" $provider.name) }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $provider.clientSecretKey | default "client-secret" }}
      remoteRef:
        key: {{ $.Values.project }}/{{ $.Values.env }}/oidc/{{ $provider.name }}
        property: client-secret
{{- end }}
{{- end }}
{{- end }}
