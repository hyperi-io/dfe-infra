apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: dfe-envoy
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Point at the EnvoyProxy CR (envoy-proxy.yaml) so the proxy's front-door
  # Service type / LB class / annotations are deployment-swappable.
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: dfe-envoy-proxy
    namespace: {{ .Values.gateway.namespace }}
