{{- if .Values.routes.dex.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: {{ .Values.routes.dex.backendNamespace | default .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ .Values.routes.dex.hostname | default .Values.hostnames.auth }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ .Values.routes.dex.backendService }}
          port: {{ .Values.routes.dex.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
