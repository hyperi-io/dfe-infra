{{- if .Values.routes.kafbat.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafbat
  namespace: {{ .Values.routes.kafbat.backendNamespace | default .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ .Values.routes.kafbat.hostname | default .Values.hostnames.kafbat }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ .Values.routes.kafbat.backendService }}
          port: {{ .Values.routes.kafbat.backendPort }}
{{- end }}
