{{- if .Values.routes.hyperdx.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperdx
  namespace: {{ .Values.routes.hyperdx.backendNamespace | default .Values.appNamespace | default .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ .Values.routes.hyperdx.hostname | default .Values.hostnames.hyperdx }}.{{ .Values.domain }}"
  rules:
    - filters:
        # The fork ships frame-ancestors 'self', which blocks its ONE
        # supported consumer -- the dfe-ui iframe on the deployment's UI
        # hostname. The deployment overwrites it with that origin until the
        # fork takes allowed ancestors from env.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: "frame-ancestors 'self' https://{{ .Values.routes.dfeUi.hostname | default .Values.hostnames.dfe }}.{{ .Values.domain }}"
      backendRefs:
        - name: {{ .Values.routes.hyperdx.backendService }}
          port: {{ .Values.routes.hyperdx.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
