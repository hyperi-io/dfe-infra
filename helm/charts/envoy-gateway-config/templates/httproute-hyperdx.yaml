{{- if .Values.routes.hyperdx.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperdx
  namespace: {{ .Values.routes.hyperdx.backendNamespace | default .Values.appNamespace | default .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - "{{ .Values.routes.hyperdx.hostname | default .Values.hostnames.hyperdx }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ .Values.routes.hyperdx.backendService }}
          port: {{ .Values.routes.hyperdx.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
