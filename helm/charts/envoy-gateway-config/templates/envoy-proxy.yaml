# EnvoyProxy -- customises the managed Envoy proxy's front-door Service so the
# HTTP plane's LB is SWAPPABLE (cloud LB <-> k8s LB) the same way the receiver's
# L4 LBs are. Referenced by the GatewayClass via parametersRef (see
# gateway-class.yaml). type + annotations are set directly; loadBalancerIP,
# loadBalancerClass, loadBalancerSourceRanges and externalIPs go through a
# StrategicMerge patch so it works across Envoy Gateway versions regardless of
# dedicated-field availability.
# externalIPs is not gated on type -- a cluster with no LB controller reaches the
# outside through it on a ClusterIP.
{{- $svc := .Values.envoyGateway.service }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dfe-envoy-proxy
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ $svc.type | default "LoadBalancer" }}
        {{- with $svc.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- $isLB := eq ($svc.type | default "LoadBalancer") "LoadBalancer" }}
        {{- $lbFields := and $isLB (or $svc.loadBalancerIP $svc.loadBalancerClass $svc.loadBalancerSourceRanges) }}
        {{- if or $lbFields $svc.externalIPs }}
        patch:
          type: StrategicMerge
          value:
            spec:
              {{- if $lbFields }}
              {{- /* Empty = the pool picks; set = the address DNS already names. */}}
              {{- if $svc.loadBalancerIP }}
              loadBalancerIP: {{ $svc.loadBalancerIP }}
              {{- end }}
              {{- if $svc.loadBalancerClass }}
              loadBalancerClass: {{ $svc.loadBalancerClass }}
              {{- end }}
              {{- with $svc.loadBalancerSourceRanges }}
              loadBalancerSourceRanges:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- end }}
              {{- with $svc.externalIPs }}
              externalIPs:
                {{- toYaml . | nindent 16 }}
              {{- end }}
        {{- end }}
