{{- $k := .Values.karpenter -}}
{{- range $name, $pool := $k.pools }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  {{- with $pool.weight }}
  # Higher wins for a pod that matches more than one pool.
  weight: {{ . }}
  {{- end }}
  # The ceiling the pool stops buying at.
  limits:
    {{- toYaml $pool.limits | nindent 4 }}
  disruption:
    consolidationPolicy: {{ $pool.consolidation.policy }}
    consolidateAfter: {{ $pool.consolidation.after | quote }}
    # Karpenter takes the most restrictive active budget naming a reason, and a
    # scheduled one is active from each schedule hit (UTC) for its duration.
    budgets:
      {{- range $pool.budgets }}
      - nodes: {{ .nodes | quote }}
        {{- with .reasons }}
        reasons:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- with .schedule }}
        schedule: {{ . | quote }}
        {{- end }}
        {{- with .duration }}
        duration: {{ . | quote }}
        {{- end }}
      {{- end }}
  template:
    {{- with $pool.labels }}
    metadata:
      labels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      # Stated even when it is Never, because the CRD's own default is 720h and
      # an omission reads as "no expiry" while meaning a forced replacement.
      expireAfter: {{ $pool.expireAfter | quote }}
      terminationGracePeriod: {{ include "karpenter-pools.terminationGracePeriod" (dict "ctx" $ "pool" $pool) | quote }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ $name }}
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - {{ $pool.arch | quote }}
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- range $pool.capacityTypes }}
            - {{ . | quote }}
            {{- end }}
        # The resolver's family alone: Karpenter launches the cheapest family listed, so an older one here is the one it picks.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            {{- range $pool.families }}
            - {{ . | quote }}
            {{- end }}
        {{- if $pool.generationIn }}
        # The pinned override: this pool stays on the named generation rather
        # than following the shape policy's floor.
        - key: karpenter.k8s.aws/instance-generation
          operator: In
          values:
            {{- range $pool.generationIn }}
            - {{ . | quote }}
            {{- end }}
        {{- else }}
        # The floor, one below the oldest family named above -- a guard against a
        # family the policy has not seen, not the selector itself.
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - {{ $pool.generationGt | quote }}
        {{- end }}
        {{- with $pool.minVcpu }}
        # families + generation alone bound WHICH instance line, not which SIZE
        # on it -- a workload sized up for its volume's EBS baseline (a bigger
        # instance sustains more IOPS/throughput at the same family) still fits
        # a smaller instance's cpu/memory REQUEST, which is all Karpenter's own
        # bin-packing looks at. Gt (n-1) expresses ">= n", the same requirement as
        # the Gte n the v1.14.1 CRD also accepts (gate-3-correctness.md P3).
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values:
            - {{ sub (int .) 1 | quote }}
        {{- end }}
        {{- with $pool.minMemoryGib }}
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values:
            # instance-memory is in MiB; the pool states GiB, so 1024x - 1.
            - {{ sub (mul (int .) 1024) 1 | quote }}
        {{- end }}
        {{- if and $k.tags $k.runInstanceSizes }}
        # Set only during a test run, whose account may deny every other size at
        # RunInstances (values.yaml, runInstanceSizes).
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            {{- range $k.runInstanceSizes }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
      {{- with $pool.taints }}
      taints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
