project: dfe
component: transform-elastic
# The component the IMAGE is published under. This app runs one deployment per
# source, so dfe-engine makes `component` instance-unique to keep the object
# names apart; the image is the app's, not the instance's. Empty falls back to
# `component`, which is only correct for a single-instance deployment.
imageComponent: transform-elastic
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Internal Service for the scalo Push listener, rendered on the direct transport
# only (dfe-common.pushService). 6000 is the DFE gRPC convention.
service:
  pushPort: 6000

kafka:
  # "disabled" is the DEPLOYMENT-WIDE transport dial, set once in the profile
  # values. Templates read it through dfe-common.transport, never by comparing
  # this string themselves.
  mode: ""
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""
  sourceTopic: ""        # set per deployment via ArgoCD values
  destTopic: ""          # set per deployment
  consumerGroup: ""      # defaults to dfe-transform-elastic
  # Empty leaves the deployment on plaintext and injects NO credentials. Setting
  # it turns SASL on and requires saslMechanism with it, because the app refuses
  # credentials that its security_protocol would never send.
  securityProtocol: ""
  saslMechanism: SCRAM-SHA-512

otel:
  endpoint: ""

# The app's scalo config, rendered VERBATIM into a ConfigMap. An OPAQUE
# passthrough: dfe-engine is the config authority and publishes it as the
# per-instance overlay, so the chart never interprets the per-app keys.
# Kafka credentials stay OUT of here and arrive as env from a Secret, which the
# app reads separately through scalo's KafkaConfig::from_env.
config: {}

# Where the config file is mounted. Separate from `config` so no chart-level key
# leaks into the app's own config file.
configMountPath: /etc/dfe-transform-elastic

# OTel service.name for this instance. Empty falls back to the app name, which
# leaves two instances of one app indistinguishable in the otel tables.
otelServiceName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}

# KEDA autoscaling -- folded into the chart. The DEFAULT trigger is scalo
# ScalingPressure (dfe_scaling_pressure, 0-100), with the native KEDA cpu scaler
# rendered alongside it so the HPA takes the higher of the two. Pressure is
# the advanced signal: the composite fuses Kafka CG lag + container-contract
# metrics (buffer, memory) AND hard-gates to 0 when the downstream sink is unreachable
# (circuit-breaker open), so pressure never scales out pods that would not help when
# the real bottleneck is downstream. It routes through the fail-safe dfe-keda-shim (a
# metric outage FREEZES scaling, never runs replicas up). Transforms are multi-instance;
# set pressure.service per instance. minReplicaCount stays 1 (scale-to-zero is 2.2 backlog).
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # second trigger: native KEDA cpu scaler (no shim needed)
  pressure:
    enabled: true             # DEFAULT: scalo ScalingPressure via the fail-safe dfe-keda-shim
    # service: dfe-transform-elastic   # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: dfe-keda-shim.<ns>.svc.cluster.local:8080 (default: the release namespace)

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
