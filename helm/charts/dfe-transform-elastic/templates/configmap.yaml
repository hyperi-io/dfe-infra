# The app's scalo config file, rendered from the .Values.config blob dfe-engine
# publishes, written to the path the image's CMD reads.
#
# The one key derived here is source.brokers on the bus. The app reads a
# --config file straight into its struct, where source.brokers is REQUIRED, and
# applies its DFE_TRANSFORM_ELASTIC_* env only after that; a file without the
# key stops the pod before any env can supply it. The broker list is a
# deployment fact, so it comes from kafka.bootstrapServers, never the engine.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $cfg := deepCopy (.Values.config | default dict) }}
    {{- if (include "dfe-common.transportIsBus" .) }}
    {{- $source := default dict (get $cfg "source") }}
    {{- if not (get $source "brokers") }}
    {{- $brokers := list }}
    {{- range splitList "," (.Values.kafka.bootstrapServers | default "") }}
    {{- if trim . }}
    {{- $brokers = append $brokers (trim .) }}
    {{- end }}
    {{- end }}
    {{- $_ := set $source "brokers" $brokers }}
    {{- end }}
    {{- $_ := set $cfg "source" $source }}
    {{- end }}
    {{- toYaml $cfg | nindent 4 }}
