project: dfe
component: forgejo
env: local
cloud: local

# Forgejo image (codeberg.org). Tag defaults to Chart.appVersion (15.0.3 LTS).
# Forgejo is a drop-in Gitea fork -- same REST API (the setup Job is unchanged)
# and same app.ini/env (accepts FORGEJO__ and GITEA__ prefixes).
image:
  repository: codeberg.org/forgejo/forgejo
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

# Admin credentials -- consumed from a K8s Secret created by bootstrap.sh
# (random password, replicated to the dfe namespace for dfe-engine's push creds).
admin:
  secretName: dfe-gitea-admin   # keys: username, password
  email: gitea-admin@dfe.local

# The deploy repo the setup Job creates (owner = admin user).
deployRepo:
  name: deploy
  defaultBranch: main
  private: true

# Image for the PostSync repo-creation Job (needs curl).
setup:
  image: curlimages/curl:8.20.0   # 2026-05 (clears 7-day cooldown); was stale 8.11.1

persistence:
  enabled: true
  storageClass: ""          # from values overlay (local-path, gp3, ...)
  size: 5Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  annotations: {}
