project: dfe
component: forgejo
env: local
cloud: local

# Forgejo image. Tag defaults to Chart.appVersion (15.0.5 LTS). Pulled from the
# CANONICAL Forgejo registry code.forgejo.org -- NOT codeberg.org/forgejo, whose
# container registry returns 503s under load (proven on the bare-cluster test:
# kubelet got "503 Service Unavailable" from codeberg.org, while code.forgejo.org
# served the same tag 200 OK). Forgejo is a drop-in Gitea fork -- same REST API
# (the setup Job is unchanged) and same app.ini/env (accepts FORGEJO__ and GITEA__
# prefixes). Digest-pin follow-up: dfe-common.image is tag-only today.
image:
  repository: code.forgejo.org/forgejo/forgejo
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

# Admin credentials -- consumed from a K8s Secret created by bootstrap.sh
# (random password, replicated to the dfe namespace for dfe-engine's push creds).
admin:
  secretName: dfe-forgejo-admin   # keys: username, password (created by bootstrap.sh)
  email: forgejo-admin@dfe.local

# The deploy repo the setup Job creates (owner = admin user).
deployRepo:
  name: deploy
  defaultBranch: main
  private: true

  # The app set a fresh deployment starts with: the core ingest path, the control
  # plane, and the embedded observability console. layer2-apps fans out one
  # Application per values/*-values.yaml, so an unseeded repo deploys no apps.
  # archiver, fetcher and the transform workers are opt-in -- an operator adds a
  # values file to enable one. Override per tier in
  # argocd/values/profile-<mode>.yaml; a Helm list is replaced rather than
  # merged, so an override states the whole set.
  seedApps:
    - dfe-engine
    - dfe-ui
    - dfe-receiver
    - dfe-loader
    # dfe-ui embeds HyperDX in an iframe, so the console is not optional -- the
    # UI's observability pages are blank without it.
    - hyperdx
  # Instance name for the seeded files -- values/<svc>-<instance>-values.yaml.
  # Multi-instance services get one file per instance, added by hand or by the
  # engine.
  seedInstance: default
  # Records which seedApps entries this deployment has already been offered, so
  # adding one reaches an existing deploy while a deleted values file stays
  # deleted.
  seedMarker: .seeded-apps

# The push hook that refreshes Argo CD, instead of waiting out its 300 s poll
# plus 60 s jitter -- the 5 to 9 minutes an engine source write takes to reach a
# pod without it. Registered as type `gogs`: Argo CD's handler has no gitea or
# forgejo parser, and Forgejo sends the X-Gogs-* headers the gogs one reads.
# The external git path configures the same hook on GitHub or GitLab --
# docs/DEPLOY-HELPERS.md carries that recipe.
webhook:
  enabled: true
  # Split into host and path because the host is also the webhook allow-list
  # entry (see gitea.env) and the two must not drift.
  argocdHost: argocd-server.argocd.svc.cluster.local
  path: /api/webhook
  # Minted by bootstrap.sh, which writes the same value into argocd-secret's
  # webhook.gogs.secret. Absent, the setup Job registers no hook and says so.
  secretName: dfe-argo-webhook
  secretKey: secret

# Image for the PostSync repo-creation Job (needs curl).
setup:
  image: curlimages/curl:8.21.0   # 2026-05 (clears 7-day cooldown); was stale 8.11.1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Resources for the short-lived init containers (perms-fix chown + app.ini/migrate).
initResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  enabled: true
  storageClass: ""          # from values overlay (local-path, gp3, ...)
  size: 5Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  annotations: {}
