project: dfe
component: forgejo
env: local
cloud: local

# Forgejo image. Tag defaults to Chart.appVersion (15.0.5 LTS). Pulled from the
# CANONICAL Forgejo registry code.forgejo.org -- NOT codeberg.org/forgejo, whose
# container registry returns 503s under load (proven on the bare-cluster test:
# kubelet got "503 Service Unavailable" from codeberg.org, while code.forgejo.org
# served the same tag 200 OK). Forgejo is a drop-in Gitea fork -- same REST API
# (the setup Job is unchanged) and same app.ini/env (accepts FORGEJO__ and GITEA__
# prefixes). Digest-pin follow-up: dfe-common.image is tag-only today.
image:
  repository: code.forgejo.org/forgejo/forgejo
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

# Admin credentials -- consumed from a K8s Secret created by bootstrap.sh
# (random password, replicated to the dfe namespace for dfe-engine's push creds).
admin:
  secretName: dfe-forgejo-admin   # keys: username, password (created by bootstrap.sh)
  email: forgejo-admin@dfe.local

# The deploy repo the setup Job creates (owner = admin user).
deployRepo:
  name: deploy
  defaultBranch: main
  private: true

  # The app set a fresh deployment starts with: the core ingest path plus the
  # control plane. layer2-apps fans out one Application per values/*-values.yaml,
  # so an unseeded repo deploys no apps. archiver, fetcher and the transform
  # workers are opt-in -- an operator adds a values file to enable one.
  # Override per tier in argocd/values/profile-<mode>.yaml; a Helm list is
  # replaced rather than merged, so an override states the whole set.
  seedApps:
    - dfe-engine
    - dfe-ui
    - dfe-receiver
    - dfe-loader
  # Instance name for the seeded files -- values/<svc>-<instance>-values.yaml.
  # Multi-instance services get one file per instance, added by hand or by the
  # engine.
  seedInstance: default

# Image for the PostSync repo-creation Job (needs curl).
setup:
  image: curlimages/curl:8.21.0   # 2026-05 (clears 7-day cooldown); was stale 8.11.1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Resources for the short-lived init containers (perms-fix chown + app.ini/migrate).
initResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  enabled: true
  storageClass: ""          # from values overlay (local-path, gp3, ...)
  size: 5Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  annotations: {}
