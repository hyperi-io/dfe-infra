apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  # HARDCODED 1 -- Forgejo is single-writer (leveldb queue + SQLite on ONE RWO
  # PVC): a 2nd replica cannot lock /data/data/queues/common and CrashLoopBackOffs,
  # so the app never goes Healthy and its PostSync repo-setup Job never runs. It
  # must therefore NEVER honor the shared profile-scale `replicaCount: 2` that
  # bleeds in via the common/profile valueFiles cascade. HA is not a Forgejo story
  # here (it is the ~5% fallback deploy-repo, not substrate).
  replicas: 1
  strategy:
    type: Recreate          # single SQLite-backed PVC, no concurrent writers
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
      initContainers:
        # Rancher's local-path provisioner (and some CSI drivers) do NOT honour the
        # pod fsGroup, so a freshly-provisioned PVC stays root-owned and the uid-1000
        # init below fails at `mkdir` on /data. Chown it first, as root; do NOT
        # "fix" it by running Forgejo as root instead. Reuses the (pinned) Forgejo
        # image so no extra image is introduced.
        - name: fix-data-perms
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        # Render app.ini from GITEA__* env, run migrations, ensure the admin user
        # exists (idempotent: create returns non-zero if present, ignored).
        - name: init
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p "${GITEA_CUSTOM}/conf"
              environment-to-ini --out "${GITEA_CUSTOM}/conf/app.ini"
              gitea migrate
              gitea admin user create \
                --username "${GITEA_ADMIN_USER}" \
                --password "${GITEA_ADMIN_PASSWORD}" \
                --email "${GITEA_ADMIN_EMAIL}" \
                --admin --must-change-password=false \
                || echo "admin user already exists"
          env:
            {{- include "gitea.env" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: gitea
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- include "gitea.env" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dfe-common.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
