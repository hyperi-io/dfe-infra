apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dfe-common.fullname" . }}-repo-setup
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # Runs after the Gitea Deployment is synced+healthy; idempotent so safe to rerun.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        # NOT dfe-common.selectorLabels: svc/dfe-forgejo selects on exactly
        # those, so this pod would join the endpoints clients resolve while the
        # Job runs -- and it serves nothing.
        app.kubernetes.io/name: {{ printf "%s-%s-repo-setup" .Values.project .Values.component | quote }}
    spec:
      restartPolicy: Never
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: repo-setup
          image: {{ .Values.setup.image | quote }}
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              GITEA="http://{{ include "dfe-common.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
              echo "Waiting for Gitea API..."
              for i in $(seq 1 60); do
                if curl -sf "$GITEA/api/healthz" >/dev/null 2>&1; then break; fi
                sleep 5
              done
              echo "Ensuring deploy repo '${REPO}' exists..."
              code=$(curl -s -o /dev/null -w "%{http_code}" -u "${GITEA_USER}:${GITEA_PASS}" \
                -X POST -H "Content-Type: application/json" \
                -d "{\"name\":\"${REPO}\",\"private\":${PRIVATE},\"default_branch\":\"${BRANCH}\",\"auto_init\":true}" \
                "$GITEA/api/v1/user/repos")
              if [ "$code" = "201" ] || [ "$code" = "409" ]; then
                echo "deploy repo ready (HTTP $code)"
              else
                echo "deploy repo creation failed (HTTP $code)"; exit 1
              fi

              # Seed the default app set. One values/<svc>-<inst>-values.yaml is
              # what enables an app, so an unseeded repo deploys nothing.
              AUTH="${GITEA_USER}:${GITEA_PASS}"
              REPO_API="$GITEA/api/v1/repos/${GITEA_USER}/${REPO}"
              API="$REPO_API/contents"

              # The marker records what this deployment has already been OFFERED,
              # which is a different question from what values/ currently holds:
              # deleting a values file is how an operator turns an app off, and a
              # new entry in seedApps still has to reach a populated repo.
              marker_sha=$(curl -s -u "$AUTH" "$API/${MARKER}?ref=${BRANCH}" \
                | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)
              if [ -n "${marker_sha}" ]; then
                seeded=$(curl -s -u "$AUTH" "$REPO_API/raw/${MARKER}?ref=${BRANCH}")
              else
                # A repo predating the marker: adopt values/ so the upgrade cannot
                # resurrect an app someone removed.
                seeded=$(curl -s -u "$AUTH" "$API/values?ref=${BRANCH}" | tr ',' '\n' \
                  | grep -o "\"name\":\"[^\"]*-${SEED_INSTANCE}-values\.yaml\"" \
                  | cut -d'"' -f4 | sed "s/-${SEED_INSTANCE}-values\.yaml\$//")
                [ -n "${seeded}" ] && echo "no seed marker -- adopting values/ as already-seeded"
              fi

              # Name every app that did not land rather than exiting on the first
              # error, so a partial seed is never silent.
              failed=""; added=""
              for svc in ${SEED_APPS}; do
                if echo "${seeded}" | grep -qx -- "${svc}"; then
                  echo "  ${svc} already seeded -- skipping"
                  continue
                fi
                file="${svc}-${SEED_INSTANCE}-values.yaml"
                body=$(printf '%s\n' \
                  "# Enables ${svc} for this deployment (seeded at bootstrap)." \
                  "# Delete this file to remove the app; add chart values here to" \
                  "# override the base + cloud + profile layers." \
                  "deploy:" \
                  "  service: ${svc}" \
                  "  instance: ${SEED_INSTANCE}" | base64 | tr -d '\n')
                code=$(curl -s -o /dev/null -w "%{http_code}" -u "$AUTH" \
                  -X POST -H "Content-Type: application/json" \
                  -d "{\"content\":\"${body}\",\"branch\":\"${BRANCH}\",\"message\":\"seed ${svc}\"}" \
                  "$API/values/${file}")
                if [ "$code" = "201" ]; then
                  echo "  seeded values/${file}"
                  added="${added} ${svc}"
                else
                  echo "  FAILED values/${file} (HTTP $code)"
                  failed="${failed} ${file}"
                fi
              done

              # Recorded even on a partial run, so an app that DID land is not
              # seeded a second time on the retry. Written whenever it is absent,
              # even with nothing new to seed: the engine reads a missing marker
              # as "nothing here was seeded".
              have=$(printf '%s\n' "${seeded}" | grep -v '^$' | sort -u)
              want=$(printf '%s\n%s\n' "${seeded}" "$(printf '%s' "${added}" | tr ' ' '\n')" \
                | grep -v '^$' | sort -u)
              if [ -z "${marker_sha}" ] || [ "${want}" != "${have}" ]; then
                content=$(printf '%s\n' "${want}" | base64 | tr -d '\n')
                if [ -n "${marker_sha}" ]; then
                  method=PUT; payload="{\"content\":\"${content}\",\"branch\":\"${BRANCH}\",\"sha\":\"${marker_sha}\",\"message\":\"record seeded apps\"}"
                else
                  method=POST; payload="{\"content\":\"${content}\",\"branch\":\"${BRANCH}\",\"message\":\"record seeded apps\"}"
                fi
                code=$(curl -s -o /dev/null -w "%{http_code}" -u "$AUTH" \
                  -X "${method}" -H "Content-Type: application/json" \
                  -d "${payload}" "$API/${MARKER}")
                case "${code}" in
                  200|201) echo "recorded ${MARKER}" ;;
                  *) echo "FAILED to write ${MARKER} (HTTP ${code}) -- the next run would re-seed"; exit 1 ;;
                esac
              fi

              if [ -n "${failed}" ]; then
                echo "deploy repo seeded INCOMPLETELY -- missing:${failed}"
                exit 1
              fi
              echo "deploy repo seeding up to date"

              # The push hook that tells Argo CD to refresh, instead of waiting
              # out its 300 s poll. Idempotent by URL: a hook already pointing
              # there is left alone rather than duplicated on every resync.
              if [ -z "${WEBHOOK_URL}" ]; then
                echo "no Argo webhook URL configured -- pushes wait for the poll"
              elif [ -z "${WEBHOOK_SECRET}" ]; then
                echo "no Argo webhook secret present -- hook NOT registered (pushes wait for the poll)"
              elif curl -s -u "$AUTH" "$REPO_API/hooks" | grep -qF "${WEBHOOK_URL}"; then
                echo "Argo webhook already registered"
              else
                # type gogs: Argo CD's webhook handler has no gitea or forgejo
                # parser, and Forgejo sends the X-Gogs-* headers the gogs one
                # reads. push only -- a branch or tag event refreshes nothing.
                code=$(curl -s -o /dev/null -w "%{http_code}" -u "$AUTH" \
                  -X POST -H "Content-Type: application/json" \
                  -d "{\"type\":\"gogs\",\"active\":true,\"events\":[\"push\"],\"config\":{\"url\":\"${WEBHOOK_URL}\",\"content_type\":\"json\",\"secret\":\"${WEBHOOK_SECRET}\"}}" \
                  "$REPO_API/hooks")
                if [ "$code" = "201" ]; then
                  echo "Argo webhook registered -> ${WEBHOOK_URL}"
                else
                  echo "Argo webhook registration FAILED (HTTP $code)"; exit 1
                fi
              fi
          env:
            - name: REPO
              value: {{ .Values.deployRepo.name | quote }}
            - name: BRANCH
              value: {{ .Values.deployRepo.defaultBranch | quote }}
            - name: PRIVATE
              value: {{ .Values.deployRepo.private | quote }}
            - name: SEED_APPS
              value: {{ join " " .Values.deployRepo.seedApps | quote }}
            - name: SEED_INSTANCE
              value: {{ .Values.deployRepo.seedInstance | quote }}
            - name: MARKER
              value: {{ .Values.deployRepo.seedMarker | quote }}
            - name: GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.secretName }}
                  key: username
            - name: GITEA_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.secretName }}
                  key: password
            {{- if .Values.webhook.enabled }}
            - name: WEBHOOK_URL
              value: {{ printf "https://%s%s" .Values.webhook.argocdHost .Values.webhook.path | quote }}
            # optional: an adopted Argo CD nobody minted a secret for leaves this
            # empty, and the Job says the hook was not registered rather than
            # failing the sync.
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webhook.secretName }}
                  key: {{ .Values.webhook.secretKey }}
                  optional: true
            {{- else }}
            - name: WEBHOOK_URL
              value: ""
            - name: WEBHOOK_SECRET
              value: ""
            {{- end }}
