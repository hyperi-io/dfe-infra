apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dfe-common.fullname" . }}-repo-setup
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # Runs after the Gitea Deployment is synced+healthy; idempotent so safe to rerun.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "dfe-common.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: repo-setup
          image: {{ .Values.setup.image | quote }}
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              GITEA="http://{{ include "dfe-common.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
              echo "Waiting for Gitea API..."
              for i in $(seq 1 60); do
                if curl -sf "$GITEA/api/healthz" >/dev/null 2>&1; then break; fi
                sleep 5
              done
              echo "Ensuring deploy repo '${REPO}' exists..."
              code=$(curl -s -o /dev/null -w "%{http_code}" -u "${GITEA_USER}:${GITEA_PASS}" \
                -X POST -H "Content-Type: application/json" \
                -d "{\"name\":\"${REPO}\",\"private\":${PRIVATE},\"default_branch\":\"${BRANCH}\",\"auto_init\":true}" \
                "$GITEA/api/v1/user/repos")
              if [ "$code" = "201" ] || [ "$code" = "409" ]; then
                echo "deploy repo ready (HTTP $code)"
              else
                echo "deploy repo creation failed (HTTP $code)"; exit 1
              fi

              # Seed the default app set. One values/<svc>-<inst>-values.yaml is
              # what enables an app, so an unseeded repo deploys nothing.
              API="$GITEA/api/v1/repos/${GITEA_USER}/${REPO}/contents"
              listing=$(curl -s -u "${GITEA_USER}:${GITEA_PASS}" "$API/values" || true)
              if echo "$listing" | grep -q -- '-values\.yaml'; then
                echo "values/ already populated -- leaving it alone:"
                echo "$listing" | tr ',' '\n' | grep -o '"name":"[^"]*-values\.yaml"' | sed 's/.*:"/  /;s/"$//'
                exit 0
              fi
              # The guard skips on any values file rather than filling gaps, so a
              # deleted app stays deleted and a mid-loop failure strands a partial
              # seed. Name what is missing rather than exiting on the first error.
              failed=""
              for svc in ${SEED_APPS}; do
                file="${svc}-${SEED_INSTANCE}-values.yaml"
                body=$(printf '%s\n' \
                  "# Enables ${svc} for this deployment (seeded at bootstrap)." \
                  "# Delete this file to remove the app; add chart values here to" \
                  "# override the base + cloud + profile layers." \
                  "deploy:" \
                  "  service: ${svc}" \
                  "  instance: ${SEED_INSTANCE}" | base64 | tr -d '\n')
                code=$(curl -s -o /dev/null -w "%{http_code}" -u "${GITEA_USER}:${GITEA_PASS}" \
                  -X POST -H "Content-Type: application/json" \
                  -d "{\"content\":\"${body}\",\"branch\":\"${BRANCH}\",\"message\":\"seed ${svc}\"}" \
                  "$API/values/${file}")
                if [ "$code" = "201" ]; then
                  echo "  seeded values/${file}"
                else
                  echo "  FAILED values/${file} (HTTP $code)"
                  failed="${failed} ${file}"
                fi
              done
              if [ -n "${failed}" ]; then
                echo "deploy repo seeded INCOMPLETELY -- missing:${failed}"
                echo "add them by hand; a re-run will not, because values/ is no longer empty"
                exit 1
              fi
              echo "deploy repo seeded with the default app set"
          env:
            - name: REPO
              value: {{ .Values.deployRepo.name | quote }}
            - name: BRANCH
              value: {{ .Values.deployRepo.defaultBranch | quote }}
            - name: PRIVATE
              value: {{ .Values.deployRepo.private | quote }}
            - name: SEED_APPS
              value: {{ join " " .Values.deployRepo.seedApps | quote }}
            - name: SEED_INSTANCE
              value: {{ .Values.deployRepo.seedInstance | quote }}
            - name: GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.secretName }}
                  key: username
            - name: GITEA_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.secretName }}
                  key: password
