# RBAC for the k8sattributes processor (configmap.yaml). Without this the
# collector's ServiceAccount is forbidden to list/watch pods -> the DaemonSet
# crashloops ("pods is forbidden"). Cluster-scoped: the processor enriches spans/
# metrics with pod + namespace metadata cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
{{- if .Values.clusterTelemetry.k8sCluster.enabled }}
  # k8s_cluster receiver: cluster-wide workload and quota state.
  - apiGroups: [""]
    resources: ["events", "replicationcontrollers", "resourcequotas", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if .Values.clusterTelemetry.kubeletStats.enabled }}
  # kubeletstats receiver: reads the node's own /stats/summary endpoint.
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/proxy"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dfe-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dfe-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
