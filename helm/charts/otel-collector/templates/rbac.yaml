# RBAC for the k8sattributes processor (configmap.yaml). Without this the
# collector's ServiceAccount is forbidden to list/watch pods -> the DaemonSet
# crashloops ("pods is forbidden"). Cluster-scoped: the processor enriches spans/
# metrics with pod + namespace metadata cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dfe-common.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dfe-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
