{{- if ne .Values.clusterTelemetry.providerLogs.flavour "none" }}
# Not the chart's shared account, so a cloud role bound to this one reaches nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-collector.providerLogsServiceAccount" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
{{- end }}
