{{- if ne .Values.clusterTelemetry.providerLogs.flavour "none" }}
# Not the chart's shared account: a cloud role bound to this one (EKS Pod
# Identity, on aws) reads the provider's logs and nothing else here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-collector.providerLogsServiceAccount" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
{{- end }}
