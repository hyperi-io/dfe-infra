apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dfe-common.fullname" . }}-daemonset
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-daemonset
  template:
    metadata:
      annotations:
        # The collector reads its config once, at start, so a config change rolls the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-daemonset
        # Not in the selector, which a live DaemonSet cannot change.
        app.kubernetes.io/part-of: {{ .Values.project | quote }}
    spec:
      # Root, see daemonset.podSecurityContext. The shared helper reads .Values.podSecurityContext,
      # so the daemonset's ids go in as a synthesised context.
      {{- include "dfe-common.podSecurityContext" (dict "Values" (dict "podSecurityContext" .Values.daemonset.podSecurityContext)) | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.fullname" . }}
      {{- with .Values.daemonset.priorityClass.name }}
      # See daemonset.priorityClass in values.yaml.
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "dfe-common.imagePullSecrets" . | nindent 6 }}
      {{- include "dfe-common.nodeSelector" . | nindent 6 }}
      # Every taint: a node the agent cannot run on reports no host metrics.
      tolerations:
        - operator: Exists
      containers:
        - name: {{ include "otel-collector.daemonsetContainerName" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          # Keeps kubeletstats CPU usage on the kubelet's UsageNanoCores. See docs/observability/otel-collector.md.
          args:
            - --config=/etc/otel/daemonset-config.yaml
            - --feature-gates=-receiver.kubeletstats.cpuUsageScrapeBased
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          env:
            # Read by the resource/node processor and the kubeletstats endpoint.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOMEMLIMIT
              value: {{ include "otel-collector.goMemLimit" (include "otel-collector.daemonsetMemory" .) | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.healthCheckPort }}
          # Served by the health_check extension in daemonset-config.yaml.
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            # host_metrics reads the node through this. HostToContainer shows volumes mounted after the pod started.
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
            - name: checkpoint
              mountPath: {{ .Values.daemonset.checkpoint.mountPath }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: hostfs
          hostPath:
            path: /
            type: Directory
        # A node directory, so the offsets survive the pod.
        - name: checkpoint
          hostPath:
            path: {{ .Values.daemonset.checkpoint.hostPath }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
