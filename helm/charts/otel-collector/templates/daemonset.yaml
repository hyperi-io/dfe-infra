apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dfe-common.fullname" . }}-daemonset
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-daemonset
  template:
    metadata:
      annotations:
        # The collector reads its config once, at start. Without this the pods
        # keep running the config they were born with and every later edit is
        # silently inert -- the same annotation every DFE app chart carries.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-daemonset
    spec:
      # Root, unlike every other DFE pod: node pod-log files are root-owned
      # (0640), so a non-root filelog receiver silently opens zero files.
      # Rootfs stays read-only and all capabilities stay dropped.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ include "dfe-common.fullname" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: ["--config=/etc/otel/daemonset-config.yaml"]
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          env:
            # Consumed by the resource/node processor and, when enabled, by the
            # kubeletstats endpoint -- each pod must reach its OWN node's kubelet.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: {{ .Values.healthCheckPort }}
          # Backed by the health_check extension enabled in daemonset-config.yaml
          # (service.extensions) -- the probe is only safe because the extension
          # serves this port.
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: tmp
          emptyDir: {}
