apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dfe-common.fullname" . }}-daemonset
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-daemonset
  template:
    metadata:
      annotations:
        # The collector reads its config once, at start. Without this the pods
        # keep running the config they were born with and every later edit is
        # silently inert -- the same annotation every DFE app chart carries.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-daemonset
    spec:
      # Root, unlike every other DFE pod (see daemonset.podSecurityContext).
      # The shared helper reads .Values.podSecurityContext, so the daemonset's
      # own ids are handed to it as a synthesised context -- one hardening
      # definition for both workloads in this chart.
      {{- include "dfe-common.podSecurityContext" (dict "Values" (dict "podSecurityContext" .Values.daemonset.podSecurityContext)) | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.fullname" . }}
      {{- include "dfe-common.imagePullSecrets" . | nindent 6 }}
      {{- include "dfe-common.nodeSelector" . | nindent 6 }}
      # Every taint, rather than the deployment's own toleration list: this is a
      # node agent, and a node it cannot run on reports no kubelet or host
      # metrics at all. The dedicated pools scripts/resolve_sizing.py taints are
      # the nodes whose telemetry matters most.
      tolerations:
        - operator: Exists
      containers:
        - name: {{ include "otel-collector.daemonsetContainerName" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: ["--config=/etc/otel/daemonset-config.yaml"]
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          env:
            # Consumed by the resource/node processor and, when enabled, by the
            # kubeletstats endpoint -- each pod must reach its OWN node's kubelet.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The Go runtime otherwise sizes its heap against the NODE, not this
            # container's limit, and collects too late to stay under it.
            - name: GOMEMLIMIT
              value: {{ include "otel-collector.goMemLimit" (include "otel-collector.daemonsetMemory" .) | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.healthCheckPort }}
          # Backed by the health_check extension enabled in daemonset-config.yaml
          # (service.extensions) -- the probe is only safe because the extension
          # serves this port.
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: checkpoint
              mountPath: {{ .Values.daemonset.checkpoint.mountPath }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        # A node directory, not an emptyDir: the offsets have to survive the pod
        # being replaced, which is exactly when the replay would happen.
        - name: checkpoint
          hostPath:
            path: {{ .Values.daemonset.checkpoint.hostPath }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
