{{- if .Values.otel.ingress.enabled }}
{{- $auth := .Values.otel.ingress.auth }}
# The OTLP ingress bearer token, from the deployment's secret store into the Secret the gateway mounts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $auth.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $auth.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $auth.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ $auth.remoteKey }}
        property: {{ $auth.property }}
{{- end }}
