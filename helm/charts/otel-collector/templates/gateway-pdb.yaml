{{- /*
Gateway PDB. The gateway selects on its own name label, not dfe-common.selectorLabels,
so the dfe-common.pdb helper cannot cover it. Renders only from gateway.replicas >= 2.
*/ -}}
{{- $enabled := true -}}
{{- $maxUnavailable := 1 -}}
{{- with .Values.gateway.pdb -}}
{{- if hasKey . "enabled" }}{{- $enabled = .enabled -}}{{- end -}}
{{- $maxUnavailable = .maxUnavailable | default 1 -}}
{{- end -}}
{{- if and $enabled (ge (int .Values.gateway.replicas) 2) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dfe-common.fullname" . }}-gateway
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  {{- /* maxUnavailable, because a minAvailable budget on a workload that can scale to 1 blocks every drain. */}}
  maxUnavailable: {{ $maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-gateway
{{- end }}
