apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  gateway-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.healthCheckPort }}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- if .Values.clusterTelemetry.k8sCluster.enabled }}
      k8s_cluster:
        collection_interval: {{ .Values.clusterTelemetry.k8sCluster.collectionInterval }}
        auth_type: serviceAccount
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory, storage, ephemeral-storage]
      {{- end }}
      {{- if .Values.clusterTelemetry.clickhouse.enabled }}
      # Server-side ClickHouse health. Column aliases become the metric names, so
      # each SELECT is a fixed set of named columns rather than a metric/value pair.
      sqlquery/clickhouse:
        driver: clickhouse
        datasource: "clickhouse://{{ .Values.clickhouse.user }}:${env:CLICKHOUSE_PASSWORD}@{{ .Values.clickhouse.host }}:{{ .Values.clickhouse.nativePort }}/{{ .Values.clickhouse.database }}"
        collection_interval: {{ .Values.clusterTelemetry.clickhouse.collectionInterval }}
        queries:
          # Instantaneous counters from system.metrics.
          - sql: >-
              SELECT
                toInt64(sumIf(value, metric = 'Query')) AS ch_queries_running,
                toInt64(sumIf(value, metric = 'Merge')) AS ch_merges_running,
                toInt64(sumIf(value, metric = 'PartMutation')) AS ch_mutations_running,
                toInt64(sumIf(value, metric = 'MemoryTracking')) AS ch_memory_tracked_bytes,
                toInt64(sumIf(value, metric = 'TCPConnection')) AS ch_tcp_connections,
                toInt64(sumIf(value, metric = 'ReadonlyReplica')) AS ch_readonly_replicas,
                toInt64(sumIf(value, metric = 'DelayedInserts')) AS ch_delayed_inserts
              FROM system.metrics
            metrics:
              - metric_name: clickhouse_queries_running
                value_column: ch_queries_running
              - metric_name: clickhouse_merges_running
                value_column: ch_merges_running
              - metric_name: clickhouse_mutations_running
                value_column: ch_mutations_running
              - metric_name: clickhouse_memory_tracked_bytes
                value_column: ch_memory_tracked_bytes
                unit: By
              - metric_name: clickhouse_tcp_connections
                value_column: ch_tcp_connections
              - metric_name: clickhouse_readonly_replicas
                value_column: ch_readonly_replicas
              # Non-zero means inserts are being throttled because merges cannot
              # keep up -- the step before "too many parts" rejects writes.
              - metric_name: clickhouse_delayed_inserts
                value_column: ch_delayed_inserts
          # Part pressure. max-parts-per-partition is the leading indicator of the
          # "too many parts" failure; the total is the context for it.
          - sql: >-
              SELECT
                toInt64(sum(part_count)) AS ch_active_parts,
                toInt64(max(part_count)) AS ch_max_parts_per_partition
              FROM (
                SELECT count() AS part_count
                FROM system.parts
                WHERE active
                GROUP BY database, table, partition
              )
            metrics:
              - metric_name: clickhouse_active_parts
                value_column: ch_active_parts
              - metric_name: clickhouse_max_parts_per_partition
                value_column: ch_max_parts_per_partition
          # Cumulative server counters. Rates are computed at query time.
          - sql: >-
              SELECT
                toInt64(sumIf(value, event = 'InsertedRows')) AS ch_inserted_rows,
                toInt64(sumIf(value, event = 'InsertedBytes')) AS ch_inserted_bytes,
                toInt64(sumIf(value, event = 'SelectedRows')) AS ch_selected_rows,
                toInt64(sumIf(value, event = 'MergedRows')) AS ch_merged_rows,
                toInt64(sumIf(value, event = 'Query')) AS ch_queries,
                toInt64(sumIf(value, event = 'FailedQuery')) AS ch_failed_queries,
                toInt64(sumIf(value, event = 'FailedInsertQuery')) AS ch_failed_insert_queries
              FROM system.events
            metrics:
              - metric_name: clickhouse_inserted_rows_total
                value_column: ch_inserted_rows
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_inserted_bytes_total
                value_column: ch_inserted_bytes
                data_type: sum
                monotonic: true
                unit: By
              - metric_name: clickhouse_selected_rows_total
                value_column: ch_selected_rows
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_merged_rows_total
                value_column: ch_merged_rows
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_queries_total
                value_column: ch_queries
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_failed_queries_total
                value_column: ch_failed_queries
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_failed_insert_queries_total
                value_column: ch_failed_insert_queries
                data_type: sum
                monotonic: true
          # Per-table size. One series per table, which is bounded by the DFE
          # schema rather than by traffic.
          - sql: >-
              SELECT
                database,
                table,
                toInt64(sum(rows)) AS ch_table_rows,
                toInt64(sum(bytes_on_disk)) AS ch_table_bytes
              FROM system.parts
              WHERE active
              GROUP BY database, table
            metrics:
              - metric_name: clickhouse_table_rows
                value_column: ch_table_rows
                attribute_columns: [database, table]
              - metric_name: clickhouse_table_bytes_on_disk
                value_column: ch_table_bytes
                attribute_columns: [database, table]
                unit: By
      {{- end }}
      {{- if .Values.clusterTelemetry.kafka.enabled }}
      kafka_metrics:
        brokers: [{{ .Values.kafka.bootstrapServers | quote }}]
        protocol_version: {{ .Values.clusterTelemetry.kafka.protocolVersion | quote }}
        collection_interval: {{ .Values.clusterTelemetry.kafka.collectionInterval }}
        scrapers:
          {{- toYaml .Values.clusterTelemetry.kafka.scrapers | nindent 10 }}
        {{- if .Values.clusterTelemetry.kafka.sasl.enabled }}
        auth:
          sasl:
            mechanism: {{ .Values.clusterTelemetry.kafka.sasl.mechanism }}
            username: {{ .Values.clusterTelemetry.kafka.sasl.username }}
            password: ${env:KAFKA_PASSWORD}
        {{- end }}
      {{- end }}
      {{- if or .Values.clusterTelemetry.selfTelemetry.enabled .Values.clusterTelemetry.dfeServices.enabled }}
      prometheus:
        config:
          scrape_configs:
            {{- if .Values.clusterTelemetry.selfTelemetry.enabled }}
            # Loopback scrape of this collector's own service.telemetry endpoint,
            # which is what puts otelcol_* into the same pipeline as everything else.
            - job_name: otelcol
              scrape_interval: 30s
              static_configs:
                - targets: ["127.0.0.1:{{ .Values.clusterTelemetry.selfTelemetry.port }}"]
            {{- end }}
            {{- if .Values.clusterTelemetry.dfeServices.enabled }}
            # The DFE services expose /metrics but only PUSH OTLP when built with
            # scalo's otel-metrics feature, which the Rust six are not (scalo-rs#28).
            # Scraping the exposition every chart already annotates is what gets
            # records_*, buffer_* and rdkafka_* into otel_metrics_* meanwhile.
            # Discovery is by annotation, so a new DFE service needs no edit here.
            - job_name: dfe-services
              scrape_interval: {{ .Values.clusterTelemetry.dfeServices.collectionInterval }}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
                  action: keep
                  regex: dfe
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  regex: (.+)
                  target_label: __metrics_path__
                # The receiver maps `job` onto service.name, so setting it per pod
                # is what gives each service its own ServiceName instead of one
                # bucket named after the scrape job.
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: replace
                  target_label: job
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: k8s_pod_name
            {{- end }}
      {{- end }}

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 5s
        limit_mib: 1536
      {{- if .Values.clusterTelemetry.k8sCluster.enabled }}
      # k8s_cluster emits no service.name, so its metrics would land in the same
      # unattributed bucket as anything else missing one.
      resource/k8s_cluster:
        attributes:
          - key: service.name
            value: k8s-cluster
            action: upsert
      {{- end }}
      {{- if .Values.clusterTelemetry.clickhouse.enabled }}
      resource/clickhouse:
        attributes:
          - key: service.name
            value: clickhouse
            action: upsert
      {{- end }}
      {{- if .Values.clusterTelemetry.kafka.enabled }}
      resource/kafka:
        attributes:
          - key: service.name
            value: kafka
            action: upsert
      {{- end }}

    exporters:
      {{- if .Values.exporters.hyperdx.enabled }}
      otlp/hyperdx:
        endpoint: {{ required "exporters.hyperdx.endpoint is required when enabled" .Values.exporters.hyperdx.endpoint }}
        tls:
          insecure: true
      {{- end }}
      {{- if .Values.exporters.clickhouse.enabled }}
      clickhouse:
        endpoint: {{ .Values.exporters.clickhouse.endpoint }}
        database: {{ .Values.exporters.clickhouse.database }}
        username: {{ .Values.exporters.clickhouse.username }}
        password: ${env:CLICKHOUSE_PASSWORD}
        timeout: 10s
        sending_queue:
          queue_size: 1000
        retry_on_failure:
          enabled: true
      {{- end }}
      prometheus:
        endpoint: 0.0.0.0:{{ .Values.gateway.service.prometheusPort }}
        metric_expiration: 5m
      {{- if .Values.gateway.debugExporter }}
      # Prints a line per batch to the collector's own log. Diagnostic only: on a
      # busy deploy it is the loudest thing in the namespace.
      debug:
        verbosity: basic
      {{- end }}

    service:
      extensions: [health_check]
      {{- if .Values.clusterTelemetry.selfTelemetry.enabled }}
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 127.0.0.1
                    port: {{ .Values.clusterTelemetry.selfTelemetry.port }}
      {{- end }}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters:
            {{- if .Values.gateway.debugExporter }}
            - debug
            {{- end }}
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        metrics:
          receivers:
            - otlp
            {{- if .Values.clusterTelemetry.selfTelemetry.enabled }}
            - prometheus
            {{- end }}
          processors: [memory_limiter, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- /*
          One pipeline per source that needs its own resource processor. A single
          pipeline cannot tag k8s_cluster, ClickHouse and Kafka with different
          service.name values, and the exporter fan-out is shared regardless.
        */}}
        {{- if .Values.clusterTelemetry.k8sCluster.enabled }}
        metrics/k8s_cluster:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource/k8s_cluster, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- end }}
        {{- if .Values.clusterTelemetry.clickhouse.enabled }}
        metrics/clickhouse:
          receivers: [sqlquery/clickhouse]
          processors: [memory_limiter, resource/clickhouse, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- end }}
        {{- if .Values.clusterTelemetry.kafka.enabled }}
        metrics/kafka:
          receivers: [kafka_metrics]
          processors: [memory_limiter, resource/kafka, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- end }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters:
            {{- if .Values.gateway.debugExporter }}
            - debug
            {{- end }}
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}

  daemonset-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.healthCheckPort }}

    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/*/otc-container/*.log]
        start_at: beginning
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
          {{- if .Values.logSeverity.enabled }}
          # The container runtime envelope carries no severity, so without this
          # every row lands SeverityText='' and a severity filter matches nothing.
          # One route per log format seen across the estate; a line matching none
          # keeps an empty severity rather than being guessed at. Every parser is
          # on_error: send, so a regex miss never drops the record.
          - type: router
            id: severity-router
            default: noop
            routes:
              - expr: 'body matches "^\\s*\\{.*\"(level|severity)\"\\s*:\\s*\"[A-Za-z]+\""'
                output: sev-json
              - expr: 'body matches "(^|\\s)level=[A-Za-z]+"'
                output: sev-logfmt
              - expr: 'body matches "^[EWIF][0-9]{4} [0-9]{2}:"'
                output: sev-klog
              - expr: 'body matches "<(Trace|Debug|Information|Warning|Error|Fatal)>"'
                output: sev-clickhouse
              - expr: 'body matches "\\[(TRACE|DEBUG|INFO|INFORMATION|NOTICE|WARN|WARNING|ERROR|FATAL|CRITICAL)\\]"'
                output: sev-bracket
              - expr: 'body matches "(^|[ \\t])(TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL|PANIC|trace|debug|info|warn|warning|error|fatal)([ \\t:]|$)"'
                output: sev-token

          # Structured JSON: etcd, cnpg, external-secrets, fleet, gitlab.
          - type: regex_parser
            id: sev-json
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '"(?:level|severity)"\s*:\s*"(?P<level>[A-Za-z]+)"'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level

          # logfmt: the argocd family, external-dns, actions-runner.
          - type: regex_parser
            id: sev-logfmt
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '(?:^|\s)level=(?P<level>[A-Za-z]+)'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level

          # klog: a single leading letter then MMDD, e.g. `E0820 22:06:05`.
          - type: regex_parser
            id: sev-klog
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '^(?P<level>[EWIF])[0-9]{4} [0-9]{2}:'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                error: E
                warn: W
                info: I
                fatal: F

          # ClickHouse server and keeper: `<Trace>`, `<Error>`.
          - type: regex_parser
            id: sev-clickhouse
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '<(?P<level>Trace|Debug|Information|Warning|Error|Fatal)>'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                info: Information

          # Bracketed: calico, coredns, harbor, rancher.
          - type: regex_parser
            id: sev-bracket
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '\[(?P<level>TRACE|DEBUG|INFO|INFORMATION|NOTICE|WARN|WARNING|ERROR|FATAL|CRITICAL)\]'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                info: [INFORMATION, NOTICE]
                fatal: CRITICAL

          # A delimited bare token: Rust tracing and the engine's own
          # `<ts> - <logger> - LEVEL - <msg>`, plus logback, zap and postgres.
          - type: regex_parser
            id: sev-token
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '(?:^|[ \t])(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL|PANIC|trace|debug|info|warn|warning|error|fatal)(?:[ \t:]|$)'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                fatal: [CRITICAL, PANIC]

          # The captured token is scaffolding; the parsed severity is the output.
          - type: remove
            id: sev-strip
            field: attributes["hdx.sev"]
            on_error: send
            output: noop

          - type: noop
            id: noop
          {{- end }}
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          network: {}
      {{- if .Values.clusterTelemetry.kubeletStats.enabled }}
      kubeletstats:
        collection_interval: {{ .Values.clusterTelemetry.kubeletStats.collectionInterval }}
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        # The kubelet serving cert is signed by the node's own CA, which is not in
        # the collector image's trust store on a vanilla RKE2 cluster.
        insecure_skip_verify: true
        metric_groups:
          {{- toYaml .Values.clusterTelemetry.kubeletStats.metricGroups | nindent 10 }}
      {{- end }}

    processors:
      batch:
        timeout: 5s
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name]
      # Container logs carry no service.name, so every filelog row lands with an
      # empty ServiceName and a group-by-service tile collapses to one bucket.
      # The filelog `container` operator already parses k8s.container.name out of
      # the pod log path, so the name only needs promoting. Container name first
      # (a pod can run several), then the workload, then the pod.
      transform/log_service_name:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
      # Node-scoped metrics carry no pod, so k8sattributes cannot enrich them and
      # they arrive with an empty ServiceName. Both attributes are set here instead.
      resource/node:
        attributes:
          - key: service.name
            value: k8s-node
            action: upsert
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert

    exporters:
      otlp/gateway:
        endpoint: {{ include "dfe-common.fullname" . }}-gateway.{{ .Release.Namespace }}.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, transform/log_service_name, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers:
            - hostmetrics
            {{- if .Values.clusterTelemetry.kubeletStats.enabled }}
            - kubeletstats
            {{- end }}
          processors: [k8sattributes, resource/node, batch]
          exporters: [otlp/gateway]
