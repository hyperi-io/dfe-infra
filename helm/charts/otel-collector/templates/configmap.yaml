apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  gateway-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.healthCheckPort }}
      {{- if .Values.otel.ingress.enabled }}
      # Checks every request to otlp/ingress against the token file, and
      # re-reads the file when the Secret behind it changes.
      bearertokenauth/ingress:
        filename: {{ include "otel-collector.ingressTokenDir" . }}/token
      {{- end }}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- if .Values.otel.ingress.enabled }}
      # OTLP/HTTP from outside the cluster, through the gateway's otel route. A
      # request without the bearer token is refused before any pipeline sees it.
      otlp/ingress:
        protocols:
          http:
            endpoint: 0.0.0.0:{{ .Values.otel.ingress.port }}
            auth:
              authenticator: bearertokenauth/ingress
      {{- end }}
      {{- if .Values.clusterTelemetry.k8sCluster.enabled }}
      k8s_cluster:
        collection_interval: {{ .Values.clusterTelemetry.k8sCluster.collectionInterval }}
        auth_type: serviceAccount
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory, storage, ephemeral-storage]
      {{- end }}
      {{- if .Values.clusterTelemetry.clickhouse.enabled }}
      # Server-side ClickHouse health. Column aliases become the metric names, so
      # each SELECT is a fixed set of named columns rather than a metric/value pair.
      sqlquery/clickhouse:
        driver: clickhouse
        datasource: "clickhouse://{{ .Values.clickhouse.user }}:${env:CLICKHOUSE_PASSWORD}@{{ .Values.clickhouse.host }}:{{ .Values.clickhouse.nativePort }}/{{ .Values.clickhouse.database }}"
        collection_interval: {{ .Values.clusterTelemetry.clickhouse.collectionInterval }}
        queries:
          # Instantaneous counters from system.metrics.
          - sql: >-
              SELECT
                toInt64(sumIf(value, metric = 'Query')) AS ch_queries_running,
                toInt64(sumIf(value, metric = 'Merge')) AS ch_merges_running,
                toInt64(sumIf(value, metric = 'PartMutation')) AS ch_mutations_running,
                toInt64(sumIf(value, metric = 'MemoryTracking')) AS ch_memory_tracked_bytes,
                toInt64(sumIf(value, metric = 'TCPConnection')) AS ch_tcp_connections,
                toInt64(sumIf(value, metric = 'ReadonlyReplica')) AS ch_readonly_replicas,
                toInt64(sumIf(value, metric = 'DelayedInserts')) AS ch_delayed_inserts
              FROM system.metrics
            metrics:
              - metric_name: clickhouse_queries_running
                value_column: ch_queries_running
              - metric_name: clickhouse_merges_running
                value_column: ch_merges_running
              - metric_name: clickhouse_mutations_running
                value_column: ch_mutations_running
              - metric_name: clickhouse_memory_tracked_bytes
                value_column: ch_memory_tracked_bytes
                unit: By
              - metric_name: clickhouse_tcp_connections
                value_column: ch_tcp_connections
              - metric_name: clickhouse_readonly_replicas
                value_column: ch_readonly_replicas
              # Non-zero means inserts are being throttled because merges cannot
              # keep up -- the step before "too many parts" rejects writes.
              - metric_name: clickhouse_delayed_inserts
                value_column: ch_delayed_inserts
          # Part pressure. max-parts-per-partition is the leading indicator of the
          # "too many parts" failure; the total is the context for it.
          - sql: >-
              SELECT
                toInt64(sum(part_count)) AS ch_active_parts,
                toInt64(max(part_count)) AS ch_max_parts_per_partition
              FROM (
                SELECT count() AS part_count
                FROM system.parts
                WHERE active
                GROUP BY database, table, partition
              )
            metrics:
              - metric_name: clickhouse_active_parts
                value_column: ch_active_parts
              - metric_name: clickhouse_max_parts_per_partition
                value_column: ch_max_parts_per_partition
          # Cumulative server counters. Rates are computed at query time.
          - sql: >-
              SELECT
                toInt64(sumIf(value, event = 'InsertedRows')) AS ch_inserted_rows,
                toInt64(sumIf(value, event = 'InsertedBytes')) AS ch_inserted_bytes,
                toInt64(sumIf(value, event = 'SelectedRows')) AS ch_selected_rows,
                toInt64(sumIf(value, event = 'MergedRows')) AS ch_merged_rows,
                toInt64(sumIf(value, event = 'Query')) AS ch_queries,
                toInt64(sumIf(value, event = 'FailedQuery')) AS ch_failed_queries,
                toInt64(sumIf(value, event = 'FailedInsertQuery')) AS ch_failed_insert_queries
              FROM system.events
            metrics:
              - metric_name: clickhouse_inserted_rows_total
                value_column: ch_inserted_rows
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_inserted_bytes_total
                value_column: ch_inserted_bytes
                data_type: sum
                monotonic: true
                unit: By
              - metric_name: clickhouse_selected_rows_total
                value_column: ch_selected_rows
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_merged_rows_total
                value_column: ch_merged_rows
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_queries_total
                value_column: ch_queries
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_failed_queries_total
                value_column: ch_failed_queries
                data_type: sum
                monotonic: true
              - metric_name: clickhouse_failed_insert_queries_total
                value_column: ch_failed_insert_queries
                data_type: sum
                monotonic: true
          # Per-table size. One series per table, which is bounded by the DFE
          # schema rather than by traffic.
          - sql: >-
              SELECT
                database,
                table,
                toInt64(sum(rows)) AS ch_table_rows,
                toInt64(sum(bytes_on_disk)) AS ch_table_bytes
              FROM system.parts
              WHERE active
              GROUP BY database, table
            metrics:
              - metric_name: clickhouse_table_rows
                value_column: ch_table_rows
                attribute_columns: [database, table]
              - metric_name: clickhouse_table_bytes_on_disk
                value_column: ch_table_bytes
                attribute_columns: [database, table]
                unit: By
      {{- end }}
      {{- if .Values.clusterTelemetry.kafka.enabled }}
      kafka_metrics:
        brokers: [{{ .Values.kafka.bootstrapServers | quote }}]
        protocol_version: {{ .Values.clusterTelemetry.kafka.protocolVersion | quote }}
        collection_interval: {{ .Values.clusterTelemetry.kafka.collectionInterval }}
        scrapers:
          {{- toYaml .Values.clusterTelemetry.kafka.scrapers | nindent 10 }}
        {{- if .Values.clusterTelemetry.kafka.sasl.enabled }}
        auth:
          sasl:
            mechanism: {{ .Values.clusterTelemetry.kafka.sasl.mechanism }}
            username: {{ .Values.clusterTelemetry.kafka.sasl.username }}
            password: ${env:KAFKA_PASSWORD}
        {{- end }}
      {{- end }}
      {{- if or .Values.clusterTelemetry.selfTelemetry.enabled .Values.clusterTelemetry.dfeServices.enabled .Values.clusterTelemetry.platformComponents.enabled (and .Values.clusterTelemetry.mskOpenMonitoring.enabled (eq .Values.kafka.provider "msk") .Values.kafka.brokerHosts) }}
      prometheus:
        config:
          scrape_configs:
            {{- if .Values.clusterTelemetry.selfTelemetry.enabled }}
            # Loopback scrape of this collector's own service.telemetry endpoint,
            # which is what puts otelcol_* into the same pipeline as everything else.
            - job_name: otelcol
              scrape_interval: 30s
              static_configs:
                - targets: ["127.0.0.1:{{ .Values.clusterTelemetry.selfTelemetry.port }}"]
            {{- end }}
            {{- if .Values.clusterTelemetry.dfeServices.enabled }}
            # The DFE services expose /metrics but only PUSH OTLP when built with
            # scalo's otel-metrics feature, which the Rust six are not (scalo-rs#28).
            # Scraping the exposition every chart already annotates is what gets
            # records_*, buffer_* and rdkafka_* into otel_metrics_* meanwhile.
            # Discovery is by annotation, so a new DFE service needs no edit here.
            - job_name: dfe-services
              scrape_interval: {{ .Values.clusterTelemetry.dfeServices.collectionInterval }}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
                  action: keep
                  regex: dfe
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  regex: (.+)
                  target_label: __metrics_path__
                # The receiver maps `job` onto service.name, so setting it per pod
                # is what gives each service its own ServiceName instead of one
                # bucket named after the scrape job.
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: replace
                  target_label: job
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: k8s_pod_name
            {{- end }}
            {{- if .Values.clusterTelemetry.platformComponents.enabled }}
            # The data operators' controller metrics. Endpoint discovery, so an
            # operator joins by exposing a metrics Service and needs no edit here.
            - job_name: platform-components
              scrape_interval: {{ .Values.clusterTelemetry.platformComponents.collectionInterval }}
              # controller-runtime authorises the scrape against the /metrics
              # nonResourceURL (see rbac.yaml); without a token it returns 403.
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                # The serving cert is issued by the operator's own cert-manager
                # Issuer, which is not in the collector's trust store.
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names:
                      {{- range $operator, $operatorNamespace := .Values.operatorNamespaces }}
                      - {{ $operatorNamespace }}
                      {{- end }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_endpoint_port_name]
                  action: keep
                  regex: {{ .Values.clusterTelemetry.platformComponents.portNames | quote }}
                # controller-runtime serves HTTPS on a port named `https`, and the
                # port number carries no scheme, so the name is the only signal.
                - source_labels: [__meta_kubernetes_endpoint_port_name]
                  action: replace
                  regex: https
                  replacement: https
                  target_label: __scheme__
                - source_labels: [__meta_kubernetes_service_name]
                  action: replace
                  target_label: job
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: k8s_pod_name
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: k8s_namespace_name
            {{- end }}
            {{- if and .Values.clusterTelemetry.mskOpenMonitoring.enabled (eq .Values.kafka.provider "msk") .Values.kafka.brokerHosts }}
            # MSK's own open_monitoring, in Prometheus text format on every
            # broker -- a DIFFERENT feed from kafka_metrics above, which speaks
            # the Kafka protocol and knows nothing about JVM or OS metrics.
            # Static targets, not kubernetes_sd_configs: the brokers are AWS
            # hosts, not pods in this cluster. job_name becomes each target's
            # `job` label, which the receiver maps onto service.name -- so
            # neither job needs a resource processor of its own.
            - job_name: msk-jmx-exporter
              scrape_interval: {{ .Values.clusterTelemetry.mskOpenMonitoring.collectionInterval }}
              static_configs:
                - targets:
                    {{- range splitList "," .Values.kafka.brokerHosts }}
                    - {{ printf "%s:%v" . $.Values.clusterTelemetry.mskOpenMonitoring.jmxPort | quote }}
                    {{- end }}
            - job_name: msk-node-exporter
              scrape_interval: {{ .Values.clusterTelemetry.mskOpenMonitoring.collectionInterval }}
              static_configs:
                - targets:
                    {{- range splitList "," .Values.kafka.brokerHosts }}
                    - {{ printf "%s:%v" . $.Values.clusterTelemetry.mskOpenMonitoring.nodeExporterPort | quote }}
                    {{- end }}
            {{- end }}
      {{- end }}

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      # Derived from gateway.resources.limits.memory, so resizing the container
      # resizes what it is allowed to buffer.
      memory_limiter:
        check_interval: 5s
        limit_mib: {{ include "otel-collector.limitMib" (include "otel-collector.gatewayMemory" .) }}
        # Headroom for what arrives between two checks; without it the limiter
        # only notices the overshoot after the runtime has already taken it.
        spike_limit_mib: {{ include "otel-collector.spikeMib" (include "otel-collector.gatewayMemory" .) }}
      {{- if .Values.clusterTelemetry.k8sCluster.enabled }}
      # k8s_cluster emits no service.name, so its metrics would land in the same
      # unattributed bucket as anything else missing one.
      resource/k8s_cluster:
        attributes:
          - key: service.name
            value: k8s-cluster
            action: upsert
      {{- end }}
      {{- if .Values.clusterTelemetry.clickhouse.enabled }}
      resource/clickhouse:
        attributes:
          - key: service.name
            value: clickhouse
            action: upsert
      {{- end }}
      {{- if .Values.clusterTelemetry.kafka.enabled }}
      resource/kafka:
        attributes:
          - key: service.name
            value: kafka
            action: upsert
      {{- end }}

    exporters:
      {{- if .Values.exporters.hyperdx.enabled }}
      otlp/hyperdx:
        endpoint: {{ required "exporters.hyperdx.endpoint is required when enabled" .Values.exporters.hyperdx.endpoint }}
        tls:
          insecure: true
        # An unreachable destination drops after this instead of retrying for
        # ever behind a full queue: self-monitoring degrades to loss, not a crash.
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.gateway.export.maxElapsedTime }}
      {{- end }}
      {{- if .Values.exporters.clickhouse.enabled }}
      clickhouse:
        # Derived from the shared clickhouse facts rather than held twice: the
        # Service name differs per mode, so a second copy resolves to no such
        # host on the mode it was not written for.
        endpoint: {{ .Values.exporters.clickhouse.endpoint | default (printf "tcp://%s:%v" .Values.clickhouse.host .Values.clickhouse.nativePort) }}
        database: {{ .Values.exporters.clickhouse.database | default .Values.clickhouse.database }}
        username: {{ .Values.exporters.clickhouse.username | default .Values.clickhouse.user }}
        password: ${env:CLICKHOUSE_PASSWORD}
        # dfe-schemas declares the otel tables and dfe-engine applies them at its
        # own startup, a wave before this collector. The exporter senses no
        # topology, so left to create its own tables it emits a plain CREATE
        # TABLE against whichever replica it connected to and the siblings end up
        # without the table -- or with a different engine. With create_schema off
        # the only SQL it sends is INSERT.
        create_schema: false
        {{- with .Values.exporters.clickhouse.connectionParams }}
        connection_params:
          {{- range $k, $v := . }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        timeout: 10s
        sending_queue:
          queue_size: 1000
        # Bounded, so a ClickHouse that has gone (a deleted Service, a rebuild)
        # costs the queued batches rather than backing the whole gateway up.
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.gateway.export.maxElapsedTime }}
      {{- end }}
      prometheus:
        endpoint: 0.0.0.0:{{ .Values.gateway.service.prometheusPort }}
        metric_expiration: 5m
      {{- if .Values.gateway.debugExporter }}
      # Prints a line per batch to the collector's own log. Diagnostic only: on a
      # busy deploy it is the loudest thing in the namespace.
      debug:
        verbosity: basic
      {{- end }}

    service:
      extensions: [health_check{{ if .Values.otel.ingress.enabled }}, bearertokenauth/ingress{{ end }}]
      {{- if .Values.clusterTelemetry.selfTelemetry.enabled }}
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 127.0.0.1
                    port: {{ .Values.clusterTelemetry.selfTelemetry.port }}
      {{- end }}
      pipelines:
        traces:
          receivers: [otlp{{ if .Values.otel.ingress.enabled }}, otlp/ingress{{ end }}]
          processors: [memory_limiter, batch]
          exporters:
            {{- if .Values.gateway.debugExporter }}
            - debug
            {{- end }}
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        metrics:
          receivers:
            - otlp
            {{- if .Values.otel.ingress.enabled }}
            - otlp/ingress
            {{- end }}
            {{- if or .Values.clusterTelemetry.selfTelemetry.enabled .Values.clusterTelemetry.dfeServices.enabled .Values.clusterTelemetry.platformComponents.enabled (and .Values.clusterTelemetry.mskOpenMonitoring.enabled (eq .Values.kafka.provider "msk") .Values.kafka.brokerHosts) }}
            # One receiver carries every scrape job, so this must match the
            # receiver's own gate or configured jobs are never routed anywhere.
            - prometheus
            {{- end }}
          processors: [memory_limiter, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- /*
          One pipeline per source that needs its own resource processor. A single
          pipeline cannot tag k8s_cluster, ClickHouse and Kafka with different
          service.name values, and the exporter fan-out is shared regardless.
        */}}
        {{- if .Values.clusterTelemetry.k8sCluster.enabled }}
        metrics/k8s_cluster:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource/k8s_cluster, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- end }}
        {{- if .Values.clusterTelemetry.clickhouse.enabled }}
        metrics/clickhouse:
          receivers: [sqlquery/clickhouse]
          processors: [memory_limiter, resource/clickhouse, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- end }}
        {{- if .Values.clusterTelemetry.kafka.enabled }}
        metrics/kafka:
          receivers: [kafka_metrics]
          processors: [memory_limiter, resource/kafka, batch]
          exporters:
            - prometheus
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}
        {{- end }}
        logs:
          receivers: [otlp{{ if .Values.otel.ingress.enabled }}, otlp/ingress{{ end }}]
          processors: [memory_limiter, batch]
          exporters:
            {{- if .Values.gateway.debugExporter }}
            - debug
            {{- end }}
            {{- if .Values.exporters.clickhouse.enabled }}
            - clickhouse
            {{- end }}
            {{- if .Values.exporters.hyperdx.enabled }}
            - otlp/hyperdx
            {{- end }}

  daemonset-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.healthCheckPort }}
      # filelog read offsets, on a node directory so they outlive the pod.
      file_storage/filelog:
        directory: {{ .Values.daemonset.checkpoint.mountPath }}
        # The collector refuses to start on a missing directory, so it makes its
        # own rather than depending on the volume type having pre-created it.
        create_directory: true
        timeout: 10s

    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        # Must match the daemonset's own container name (below) -- kubelet builds
        # this path from it. `otc-container` was the UPSTREAM chart's name, so
        # the exclusion never matched and the collector shipped its own logs,
        # one error line per failed export.
        exclude: [/var/log/pods/*/{{ include "otel-collector.daemonsetContainerName" . }}/*.log]
        # Checkpointed, so a restart resumes at the offset it stopped at.
        storage: file_storage/filelog
        # First run only -- the checkpoint decides every later start. A fresh
        # node's whole back-history is more than this container can buffer, and
        # re-ingesting it is what turned one restart into an OOM loop.
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
          {{- if .Values.logSeverity.enabled }}
          # The container runtime envelope carries no severity, so without this
          # every row lands SeverityText='' and a severity filter matches nothing.
          # One route per log format seen across the estate; a line matching none
          # keeps an empty severity rather than being guessed at. Every parser is
          # on_error: send, so a regex miss never drops the record.
          - type: router
            id: severity-router
            default: noop
            routes:
              - expr: 'body matches "^\\s*\\{.*\"(level|severity)\"\\s*:\\s*\"[A-Za-z]+\""'
                output: sev-json
              - expr: 'body matches "(^|\\s)level=[A-Za-z]+"'
                output: sev-logfmt
              - expr: 'body matches "^[EWIF][0-9]{4} [0-9]{2}:"'
                output: sev-klog
              - expr: 'body matches "<(Trace|Debug|Information|Warning|Error|Fatal)>"'
                output: sev-clickhouse
              - expr: 'body matches "\\[(TRACE|DEBUG|INFO|INFORMATION|NOTICE|WARN|WARNING|ERROR|FATAL|CRITICAL)\\]"'
                output: sev-bracket
              - expr: 'body matches "(^|[ \\t])(TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL|PANIC|trace|debug|info|warn|warning|error|fatal)([ \\t:]|$)"'
                output: sev-token

          # Structured JSON: etcd, external-secrets, fleet, gitlab.
          - type: regex_parser
            id: sev-json
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '"(?:level|severity)"\s*:\s*"(?P<level>[A-Za-z]+)"'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level

          # logfmt: the argocd family, external-dns, actions-runner.
          - type: regex_parser
            id: sev-logfmt
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '(?:^|\s)level=(?P<level>[A-Za-z]+)'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level

          # klog: a single leading letter then MMDD, e.g. `E0820 22:06:05`.
          - type: regex_parser
            id: sev-klog
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '^(?P<level>[EWIF])[0-9]{4} [0-9]{2}:'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                error: E
                warn: W
                info: I
                fatal: F

          # ClickHouse server and keeper: `<Trace>`, `<Error>`.
          - type: regex_parser
            id: sev-clickhouse
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '<(?P<level>Trace|Debug|Information|Warning|Error|Fatal)>'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                info: Information

          # Bracketed: calico, coredns, harbor, rancher.
          - type: regex_parser
            id: sev-bracket
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '\[(?P<level>TRACE|DEBUG|INFO|INFORMATION|NOTICE|WARN|WARNING|ERROR|FATAL|CRITICAL)\]'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                info: [INFORMATION, NOTICE]
                fatal: CRITICAL

          # A delimited bare token: Rust tracing and the engine's own
          # `<ts> - <logger> - LEVEL - <msg>`, plus logback, zap and postgres.
          - type: regex_parser
            id: sev-token
            parse_from: body
            parse_to: attributes["hdx.sev"]
            regex: '(?:^|[ \t])(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL|PANIC|trace|debug|info|warn|warning|error|fatal)(?:[ \t:]|$)'
            on_error: send
            output: sev-strip
            severity:
              parse_from: attributes["hdx.sev"].level
              mapping:
                fatal: [CRITICAL, PANIC]

          # The captured token is scaffolding; the parsed severity is the output.
          - type: remove
            id: sev-strip
            field: attributes["hdx.sev"]
            on_error: send
            output: noop

          - type: noop
            id: noop
          {{- end }}
      # root_path points the filesystem and disk scrapers at the node's root,
      # mounted read-only at /hostfs by the daemonset; without it they report
      # the collector container's own overlay.
      host_metrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          # The node's mount table also lists every container's overlay, every
          # pod volume under the kubelet and the kernel's pseudo filesystems.
          # None is node storage, and each would be a series of its own.
          filesystem:
            exclude_mount_points:
              mount_points:
                - '^/dev($|/)'
                - '^/proc($|/)'
                - '^/sys($|/)'
                - '^/run/k3s/containerd($|/)'
                - '^/run/containerd($|/)'
                - '^/var/lib/docker($|/)'
                - '^/var/lib/kubelet($|/)'
                - '^/snap($|/)'
              match_type: regexp
            exclude_fs_types:
              fs_types:
                - autofs
                - binfmt_misc
                - bpf
                - cgroup2
                - configfs
                - debugfs
                - devpts
                - devtmpfs
                - fusectl
                - hugetlbfs
                - iso9660
                - mqueue
                - nsfs
                - overlay
                - proc
                - procfs
                - pstore
                - rpc_pipefs
                - securityfs
                - selinuxfs
                - squashfs
                - sysfs
                - tracefs
              match_type: strict
          network: {}
      {{- if .Values.clusterTelemetry.kubeletStats.enabled }}
      kubeletstats:
        collection_interval: {{ .Values.clusterTelemetry.kubeletStats.collectionInterval }}
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        # The kubelet serving cert is signed by the node's own CA, which is not in
        # the collector image's trust store on a vanilla RKE2 cluster.
        insecure_skip_verify: true
        metric_groups:
          {{- toYaml .Values.clusterTelemetry.kubeletStats.metricGroups | nindent 10 }}
      {{- end }}

    processors:
      batch:
        timeout: 5s
        # Pinned rather than left to the default 8192: the queue below is sized
        # in batches, so an unbounded batch makes that bound meaningless.
        send_batch_size: 1024
      # Derived from daemonset.resources.limits.memory. Without it the pipeline
      # has no back pressure of its own and the kernel is the only limit.
      memory_limiter:
        check_interval: 5s
        limit_mib: {{ include "otel-collector.limitMib" (include "otel-collector.daemonsetMemory" .) }}
        spike_limit_mib: {{ include "otel-collector.spikeMib" (include "otel-collector.daemonsetMemory" .) }}
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name]
      # Container logs carry no service.name, so every filelog row lands with an
      # empty ServiceName and a group-by-service tile collapses to one bucket.
      # The filelog `container` operator already parses k8s.container.name out of
      # the pod log path, so the name only needs promoting. Container name first
      # (a pod can run several), then the workload, then the pod.
      transform/log_service_name:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
      # Node-scoped metrics carry no pod, so k8sattributes cannot enrich them and
      # they arrive with an empty ServiceName. Both attributes are set here instead.
      resource/node:
        attributes:
          - key: service.name
            value: k8s-node
            action: upsert
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert

    exporters:
      otlp/gateway:
        endpoint: {{ include "dfe-common.fullname" . }}-gateway.{{ .Release.Namespace }}.svc.cluster.local:4317
        tls:
          insecure: true
        # Bounded in batches against this container's own memory limit; the
        # default 1000 batches is more than the container can hold.
        sending_queue:
          enabled: true
          queue_size: {{ include "otel-collector.queueSize" (include "otel-collector.daemonsetMemory" .) }}
        # A gateway refusing data (its own memory_limiter) or gone drops after
        # this rather than being retried until the queue fills the container.
        retry_on_failure:
          enabled: true
          max_elapsed_time: {{ .Values.daemonset.export.maxElapsedTime }}

    service:
      extensions: [health_check, file_storage/filelog]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform/log_service_name, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers:
            - host_metrics
            {{- if .Values.clusterTelemetry.kubeletStats.enabled }}
            - kubeletstats
            {{- end }}
          processors: [memory_limiter, k8sattributes, resource/node, batch]
          exporters: [otlp/gateway]
