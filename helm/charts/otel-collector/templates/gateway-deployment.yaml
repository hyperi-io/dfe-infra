apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}-gateway
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-gateway
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-gateway
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      # The k8s_cluster receiver reads the API server, so the gateway needs the
      # chart's ServiceAccount rather than the namespace default the ClusterRole
      # is not bound to.
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          args: ["--config=/etc/otel/gateway-config.yaml"]
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          env:
            # The Go runtime otherwise sizes its heap against the NODE, not this
            # container's limit, and collects too late to stay under it.
            - name: GOMEMLIMIT
              value: {{ include "otel-collector.goMemLimit" (include "otel-collector.gatewayMemory" .) | quote }}
            {{- if or .Values.exporters.clickhouse.enabled .Values.clusterTelemetry.clickhouse.enabled }}
            # Expanded by the collector config (${env:CLICKHOUSE_PASSWORD});
            # the clickhouse-cluster chart projects the secret into this
            # namespace. Shared by the ClickHouse exporter and the sqlquery receiver.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporters.clickhouse.passwordSecretName }}
                  key: password
            {{- end }}
            {{- if and .Values.clusterTelemetry.kafka.enabled .Values.clusterTelemetry.kafka.sasl.enabled }}
            # Requires the kafka chart to project dfe-kafka-user into this
            # namespace via user.password.extraAppNamespaces.
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clusterTelemetry.kafka.sasl.passwordSecretName }}
                  key: {{ .Values.clusterTelemetry.kafka.sasl.passwordSecretKey }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            {{- if .Values.otel.ingress.enabled }}
            # The bearer-token receiver the gateway's otel route targets.
            - name: otlp-ingress
              containerPort: {{ .Values.otel.ingress.port }}
            {{- end }}
            - name: prometheus
              containerPort: {{ .Values.gateway.service.prometheusPort }}
            - name: health
              containerPort: {{ .Values.healthCheckPort }}
          # Backed by the health_check extension enabled in gateway-config.yaml
          # (service.extensions) -- the probe is only safe because the extension
          # serves this port.
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: tmp
              mountPath: /tmp
            {{- if .Values.otel.ingress.enabled }}
            - name: ingress-token
              mountPath: {{ include "otel-collector.ingressTokenDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
        {{- if .Values.otel.ingress.enabled }}
        # Required, not optional: without the file the extension cannot start, so
        # the pod waits for the Secret rather than crashlooping on a missing token.
        - name: ingress-token
          secret:
            secretName: {{ .Values.otel.ingress.auth.secretName }}
        {{- end }}
