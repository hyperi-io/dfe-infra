apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}-gateway
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-gateway
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: ["--config=/etc/otel/gateway-config.yaml"]
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          {{- if .Values.exporters.clickhouse.enabled }}
          env:
            # Expanded by the collector config (${env:CLICKHOUSE_PASSWORD});
            # the clickhouse-cluster chart projects the secret into this
            # namespace.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporters.clickhouse.passwordSecretName }}
                  key: password
          {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: {{ .Values.gateway.service.prometheusPort }}
            - name: health
              containerPort: {{ .Values.healthCheckPort }}
          # Backed by the health_check extension enabled in gateway-config.yaml
          # (service.extensions) -- the probe is only safe because the extension
          # serves this port.
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
