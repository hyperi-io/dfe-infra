apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}-gateway
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-gateway
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "dfe-common.fullname" . }}-gateway
        # Not in the selector, which a live Deployment cannot change.
        app.kubernetes.io/part-of: {{ .Values.project | quote }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      # The k8s_cluster receiver reads the API server, which the ClusterRole binds to this account only.
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      {{- include "otel-collector.waitForEngine" . | nindent 6 }}
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          args: ["--config=/etc/otel/gateway-config.yaml"]
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          env:
            - name: GOMEMLIMIT
              value: {{ include "otel-collector.goMemLimit" (include "otel-collector.gatewayMemory" .) | quote }}
            {{- if or .Values.exporters.clickhouse.enabled .Values.clusterTelemetry.clickhouse.enabled }}
            # Expanded by the collector config. dfe-extras copies the password into this namespace.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "otel-collector.clickhouseSecret" . }}
                  key: {{ .Values.exporters.clickhouse.passwordSecretKey | default (dig "serviceUsers" "otelWriter" "passwordSecretKey" "password" .Values.clickhouse) }}
            {{- end }}
            {{- if include "otel-collector.clickhouseCAKind" . }}
            # The sql_query driver verifies against the process's trust store.
            - name: SSL_CERT_DIR
              value: {{ include "otel-collector.clickhouseCADir" . }}
            {{- end }}
            {{- if and .Values.clusterTelemetry.kafka.enabled .Values.clusterTelemetry.kafka.sasl.enabled }}
            # The kafka chart projects dfe-kafka-user here (user.password.extraAppNamespaces).
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clusterTelemetry.kafka.sasl.passwordSecretName }}
                  key: {{ .Values.clusterTelemetry.kafka.sasl.passwordSecretKey }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            {{- if .Values.otel.ingress.enabled }}
            # The bearer-token receiver the gateway's otel route targets.
            - name: otlp-ingress
              containerPort: {{ .Values.otel.ingress.port }}
            {{- end }}
            - name: prometheus
              containerPort: {{ .Values.gateway.service.prometheusPort }}
            - name: health
              containerPort: {{ .Values.healthCheckPort }}
          # Served by the health_check extension in gateway-config.yaml.
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: tmp
              mountPath: /tmp
            {{- if include "otel-collector.clickhouseCAKind" . }}
            - name: clickhouse-ca
              mountPath: {{ include "otel-collector.clickhouseCADir" . }}
              readOnly: true
            {{- end }}
            {{- if .Values.otel.ingress.enabled }}
            - name: ingress-token
              mountPath: {{ include "otel-collector.ingressTokenDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
        {{- if eq (include "otel-collector.clickhouseCAKind" .) "secret" }}
        # Required, so the pod waits for the CA and does not crashloop on a certificate error.
        - name: clickhouse-ca
          secret:
            secretName: {{ .Values.clickhouse.tls.ca.secretName }}
        {{- else if eq (include "otel-collector.clickhouseCAKind" .) "configmap" }}
        - name: clickhouse-ca
          configMap:
            name: {{ .Values.clickhouse.tls.ca.configMapName }}
        {{- end }}
        {{- if .Values.otel.ingress.enabled }}
        # Required, so the pod waits for the Secret and does not crashloop on a missing token.
        - name: ingress-token
          secret:
            secretName: {{ .Values.otel.ingress.auth.secretName }}
        {{- end }}
