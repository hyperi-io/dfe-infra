# Design and settings: docs/observability/otel-collector.md.
project: dfe
component: otel-collector
env: local
cloud: local

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.165.0"  # == versions.yaml services.otel-collector (drift-checked).
  # == versions.yaml services-digests.otel-collector (drift-checked).
  digest: "sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849"
  pullPolicy: IfNotPresent

# The gateway's pod securityContext. The daemonset's is daemonset.podSecurityContext.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# Served by both collector configs and probed by their workloads.
healthCheckPort: 13133

gateway:
  replicas: 1
  # Adds the debug exporter, which prints a line per batch.
  debugExporter: false
  # Renders only when replicas >= 2.
  pdb:
    enabled: true
  export:
    maxElapsedTime: 120s
  # The one memory number: the limiter and GOMEMLIMIT derive from limits.memory.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  service:
    grpcPort: 4317
    httpPort: 4318
    prometheusPort: 8889

daemonset:
  # Root: node pod-log files are root-owned, so a non-root filelog opens none.
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  export:
    maxElapsedTime: 60s
  # Read offsets live on the node so they survive the pod.
  checkpoint:
    hostPath: /var/lib/dfe-otel-collector
    mountPath: /var/lib/otelcol/storage
  # The one memory number: the limiter, GOMEMLIMIT and the export queue derive from limits.memory.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Outranks the app pods so a full node evicts one for the agent.
  priorityClass:
    # false where the cluster already defines the class `name` refers to.
    create: true
    # Empty renders no priorityClassName.
    name: dfe-node-critical
    # Above 0, at most 1000000000. The API server refuses a change, so a new value needs a new name.
    value: 1000000

# Where the DFE apps run (the ApplicationSet passes the cluster annotation); empty falls back to {project}-{env}.
appNamespace: ""

# The gateway's hold until dfe-engine reports ready, the keys dfe-common.waitForEngine reads.
waitForEngine:
  enabled: true
  service: dfe-engine
  # Empty is appNamespace.
  namespace: ""
  port: 8000
  timeoutSeconds: 600
  intervalSeconds: 5
  # The collector image has no shell, so the wait runs on busybox's wget.
  image:
    repository: public.ecr.aws/docker/library/busybox
    tag: "1.38.0"  # == versions.yaml services.busybox (drift-checked).
    # == versions.yaml services-digests.busybox (drift-checked).
    digest: "sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Parse a severity out of each container log line (DaemonSet filelog).
logSeverity:
  enabled: true

# Cluster and dependency telemetry. The expensive scrapers are set per tier in argocd/values/profile-*.yaml.
clusterTelemetry:
  # Gateway only.
  k8sCluster:
    enabled: true
    collectionInterval: 30s

  # DaemonSet only. Off in slim, where container series are not worth it.
  kubeletStats:
    enabled: false
    collectionInterval: 30s
    metricGroups: [node, pod, container]

  # sql_query over system.metrics, system.events and system.parts, as the collector's own user.
  clickhouse:
    enabled: true
    collectionInterval: 30s

  # Broker-side metrics over the Kafka protocol. Off for the brokerless tiers (slim, mesh).
  # SASL needs dfe-kafka-user projected here through the kafka chart's `user.password.extraAppNamespaces`.
  kafka:
    enabled: false
    collectionInterval: 30s
    protocolVersion: "3.6.0"
    scrapers: [brokers, topics, consumers]
    # Dial TLS (system trust store). A managed broker always does.
    tls:
      enabled: false
    sasl:
      enabled: true
      # Empty derives it: the provider table's mechanism for a managed broker, else SCRAM-SHA-512.
      mechanism: ""
      username: dfe-kafka-user
      passwordSecretName: dfe-kafka-user
      passwordSecretKey: password

  # MSK's JMX and node exporters, a different feed from `kafka` above. Gateway only,
  # and renders only when kafka.external.provider is msk.
  mskOpenMonitoring:
    enabled: true
    collectionInterval: 30s
    jmxPort: 11001
    nodeExporterPort: 11002

  # The infra provider's own logs, in a collector of their own. See docs/observability/provider-logs.md.
  #   none     nothing renders.
  #   aws      aws_cloudwatch on the named CloudWatch log groups. Needs aws.region and at least one group.
  #   azure    azure_event_hub, fed by a diagnostic setting.
  #   gcp      googlecloudpubsub, fed by a log sink.
  #   rancher  filelog on the control-plane nodes, reading the kube-apiserver audit log.
  providerLogs:
    flavour: none
    # The workload that runs aws, azure and gcp. A DaemonSet runs rancher instead.
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      export:
        maxElapsedTime: 60s
      # aws only: the receiver's read offsets. Empty storageClass takes the cluster's default class.
      checkpoint:
        size: 1Gi
        storageClass: ""
    aws:
      region: ""
      # Read back this far when there is no checkpoint yet.
      initialLookback: 5m
      pollInterval: 1m
      # Cluster facts the cloud root outputs. Empty leaves that source out.
      eksAuditLogGroup: ""
      cloudTrailLogGroup: ""
    azure:
      # The Secret holding the Event Hub connection string, with its EntityPath.
      connectionSecretName: ""
      connectionSecretKey: connection-string
      consumerGroup: $Default
    gcp:
      # Fully qualified: projects/<project>/subscriptions/<name>. A Pull subscription.
      subscription: ""
    rancher:
      # RKE2's path once its audit-policy-file is set. Another distribution sets its own.
      auditLogPath: /var/lib/rancher/rke2/server/logs/audit.log
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      checkpoint:
        hostPath: /var/lib/dfe-otel-provider-logs
        mountPath: /var/lib/otelcol/storage

  # The collector's own otelcol_* metrics, scraped back on loopback.
  selfTelemetry:
    enabled: true
    port: 8888

  # Scrapes the DFE services' /metrics by pod annotation.
  dfeServices:
    enabled: true
    collectionInterval: 30s
    # Anchored regex over the pods' helm.sh/chart label. Drops charts that also push the same
    # metrics over OTLP, so a sum does not count them twice. Empty drops nothing.
    pushedCharts: "dfe-(engine|receiver|loader|fetcher|archiver|transform-vrl|transform-vector|transform-elastic)-[0-9].*|culvert-[0-9].*"

  # The data operators' controller metrics, found by Service endpoint in operatorNamespaces.
  platformComponents:
    enabled: true
    collectionInterval: 30s
    # `https` selects controller-runtime's secure endpoint.
    portNames: "https|metrics|http-metrics"

# Shared endpoint facts. A real deploy takes them from argocd/values/common.yaml.

# The discovery scope for platformComponents.
operatorNamespaces:
  clickhouse: clickhouse-operator-system
  strimzi: strimzi
  cnpg: cnpg-system

clickhouse:
  host: dfe-clickhouse.clickhouse.svc.cluster.local
  nativePort: 9000
  database: dfe
  # The shared clickhouse.tls block (argocd/values/common.yaml). See docs/observability/otel-collector.md#rows-and-writes.
  tls:
    enabled: false
    nativePort: 9440
    verify: true
    issuerRef:
      name: ""
    internalCA:
      present: false
    ca:
      secretName: ""
      configMapName: ""
      dataKey: ca.crt
  # Never the admin account: dfe-engine creates this user.
  serviceUsers:
    otelWriter:
      user: dfe_otel_writer
      passwordSecretName: otel-writer-clickhouse
      passwordSecretKey: password

kafka:
  # Comma separated for a multi-broker bootstrap list.
  bootstrapServers: "dfe-kafka.strimzi.svc.cluster.local:9092"
  # Set from the cluster-secret annotations by argocd/appsets/layer2-data.yaml.
  mode: ""
  external:
    provider: ""
  # MSK's bare broker hosts, no port, comma separated. Empty on every provider but msk.
  brokerHosts: ""

exporters:
  # OTLP push to a hyperdx-side receiver. Off: the dfe-hyperdx image has no OTLP listener.
  hyperdx:
    enabled: false
    endpoint: ""
  # Writes the otel_logs, otel_traces and otel_metrics tables HyperDX reads. The default sink.
  clickhouse:
    enabled: true
    # Empty derives these from the shared clickhouse facts above.
    endpoint: ""
    database: ""
    username: ""
    passwordSecretName: ""
    passwordSecretKey: ""
    # Merged into the exporter's DSN. See docs/observability/otel-collector.md#rows-and-writes.
    connectionParams:
      type_json_skip_duplicated_paths: "1"

# gNMI telemetry from network devices: gnmic subscribes and pushes OTLP to the gateway. See docs/observability/gnmi.md.
gnmic:
  enabled: false
  image:
    repository: ghcr.io/openconfig/gnmic
    tag: "0.49.1"
    digest: "sha256:d148508c7ab3e5fd446759648d529409c1e37c2cc99c8b681078d120ca1a302b"
    pullPolicy: IfNotPresent
  # Device name -> gnmic target settings: address, insecure, skip-verify, tls-ca and the rest of gnmic's target keys. Required when enabled.
  targets: {}
  # The Secret holding the login every target without its own username and password uses. Empty sends none.
  credentials:
    secretName: ""
    usernameKey: username
    passwordKey: password
  # gnmic's subscriptions map. Each path lands as its own metric.
  subscriptions:
    interface-counters:
      mode: stream
      paths:
        - /interfaces/interface/state/counters
      sample-interval: 30s
      stream-mode: sample
  output:
    # Prefix on every metric name.
    metricPrefix: gnmic
    # Value names matching one of these regexes export as cumulative sums, the rest as gauges.
    counterPatterns:
      - counters
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# OTLP ingest from outside the cluster, on a bearer token. See docs/observability/otel-collector.md#otlp-ingest-from-outside-the-cluster.
otel:
  ingress:
    enabled: false
    port: 4319
    auth:
      # The ClusterSecretStore the token is read from.
      secretStoreName: dfe-secret-store
      # The token's path in that store. Required when enabled.
      remoteKey: ""
      # The field within that entry.
      property: token
      # The Secret the token lands in, mounted into the gateway pod.
      secretName: dfe-otel-ingress-token
