project: dfe
component: otel-collector
env: local
cloud: local

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.158.0"  # 2026-07-22 (7-day-compliant). Pinned explicitly, not via appVersion.
  # == versions.yaml services-digests.otel-collector (drift-checked).
  digest: "sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5"
  pullPolicy: IfNotPresent

# The GATEWAY's pod securityContext. The contrib image ships USER 10001
# (numeric, verified via crane), so runAsNonRoot is satisfiable. The daemonset
# is the exception and carries its own ids under daemonset.podSecurityContext.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# health_check extension port, served by BOTH collector configs (gateway +
# daemonset) and probed by their workloads. The probes are only valid because
# configmap.yaml enables the extension in service.extensions -- a probe against
# a collector without the extension dials a closed port and kills the pod.
healthCheckPort: 13133

gateway:
  replicas: 1
  # Adds the `debug` exporter to the traces and logs pipelines, which prints one
  # line per batch to the collector's own log. Off by default: at a few hundred
  # records a second it is the loudest thing in the namespace and it tells an
  # operator nothing the pipeline metrics do not.
  debugExporter: false
  # Gateway PDB (templates/gateway-pdb.yaml): renders only when replicas >= 2,
  # same drain-safety gating as dfe-common.pdb. maxUnavailable defaults to 1.
  pdb:
    enabled: true
  export:
    # Retry ceiling on the gateway's own exporters. A destination that has gone
    # (a deleted ClickHouse Service, a rebuild) drops after this instead of
    # being retried behind a full queue until the gateway itself dies.
    maxElapsedTime: 120s
  # limits.memory is the ONE number the gateway's memory dials come from:
  # memory_limiter limit_mib is 80% of it, spike_limit_mib 20%, and GOMEMLIMIT
  # matches the 80%. Resize this and the config resizes with it.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  service:
    grpcPort: 4317
    httpPort: 4318
    prometheusPort: 8889

daemonset:
  # Root, unlike every other DFE pod: node pod-log files are root-owned (0640),
  # so a non-root filelog receiver silently opens zero files. Rootfs stays
  # read-only and all capabilities stay dropped (containerSecurityContext).
  # Node paths it mounts: /var/log/pods and the node root at /hostfs (for the
  # host_metrics filesystem and disk scrapers), both read-only, and the
  # checkpoint below, writable.
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  export:
    # Retry ceiling on the push to the gateway. A gateway refusing data because
    # of its own memory_limiter, or gone entirely, costs the queued batches
    # rather than a collector that retries until it is OOMKilled.
    maxElapsedTime: 60s
  # Where the filelog receiver keeps its read offsets. On the NODE, because they
  # have to survive the pod: without a checkpoint every restart re-ingests every
  # pod log on the node from the start, which floods the export queue and OOMs
  # the collector into the next restart.
  checkpoint:
    hostPath: /var/lib/dfe-otel-collector
    mountPath: /var/lib/otelcol/storage
  # limits.memory is the ONE number the daemonset's memory dials come from:
  # memory_limiter limit_mib is 80% of it, spike_limit_mib 20%, GOMEMLIMIT
  # matches the 80%, and the export queue holds a batch per 4 MiB of it.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Where the DFE apps run (the ApplicationSet passes the cluster annotation);
# empty falls back to {project}-{env}.
appNamespace: ""

# Cluster + dependency telemetry, feeding the pre-canned HyperDX dashboards
# (dfe-engine#184). The dashboards are identical on every profile; collection cost
# is not, so the expensive scrapers are gated here and enabled per profile.
# Parse a severity out of each container log line (DaemonSet filelog). Without it
# every log row stores SeverityText='' and no severity filter or error tile works.
# Verified against a 406-line sample of live cluster logs: 395 parsed, no line
# carrying a level token missed, and no false ERROR.
logSeverity:
  enabled: true

clusterTelemetry:
  # Cluster-scoped state: node conditions, allocatable, replica counts, pod phase.
  # Gateway-only -- it reads the API server, and one instance per cluster is the
  # contract.
  k8sCluster:
    enabled: true
    collectionInterval: 30s

  # Per-node/pod/container consumption, read off each node's kubelet. DaemonSet-only.
  # Container-level series multiply by every container on every node, so slim leaves
  # it off. `volume` is omitted: a series per mounted volume, unused by the PV tiles.
  kubeletStats:
    enabled: false
    collectionInterval: 30s
    metricGroups: [node, pod, container]

  # ClickHouse server metrics via sqlquery over system.metrics/events/parts.
  # Not the :9363 Prometheus endpoint -- the clickhouse-cluster chart does not
  # expose it and managed ClickHouse does not offer it, whereas these system tables
  # are readable from any client on any provider.
  # Credentials come from the gateway's existing CLICKHOUSE_PASSWORD env.
  clickhouse:
    enabled: true
    collectionInterval: 30s

  # Broker-side Kafka metrics. kafka_metrics speaks the Kafka protocol against
  # bootstrapServers, so single-broker and Strimzi share one config with no JMX
  # exporter. Complements the consumers' own rdkafka_* lag, which stops reporting
  # when a consumer dies.
  # Off by default -- the brokerless profiles (slim, mesh) have no Kafka to
  # scrape. SASL/SCRAM-SHA-512 is the DFE broker
  # standard, so the credential must be projected here via the kafka chart's
  # `user.password.extraAppNamespaces`.
  kafka:
    enabled: false
    collectionInterval: 30s
    # Pinned rather than left to the receiver default of 2.1.0.
    protocolVersion: "3.6.0"
    scrapers: [brokers, topics, consumers]
    sasl:
      enabled: true
      mechanism: SCRAM-SHA-512
      username: dfe-kafka-user
      passwordSecretName: dfe-kafka-user
      passwordSecretKey: password

  # MSK's own open_monitoring: the JMX exporter (broker JVM metrics) and node
  # exporter (broker OS metrics) AWS runs on every broker instance, in
  # Prometheus text format -- a DIFFERENT feed from the kafka block above,
  # which speaks the Kafka protocol itself and covers broker/topic/consumer
  # counts, not JVM or OS metrics. Gateway-only: the targets are the brokers'
  # own hosts, not anything running in this cluster. Rendered only when
  # kafka.provider is msk -- every other provider either exposes no such
  # endpoint (strimzi, redpanda) or is a SaaS body with no host to target
  # (confluent-cloud, redpanda-cloud).
  mskOpenMonitoring:
    enabled: true
    collectionInterval: 30s
    jmxPort: 11001
    nodeExporterPort: 11002

  # KEDA needs no receiver here: the operator pushes its own metrics over OTLP to
  # the gateway, enabled in argocd/appsets/layer1-addons.yaml. Kept as a documented
  # absence so the next reader does not add a scrape job for it.

  # The collector's own pipeline health (otelcol_*): queue depth, enqueue failures,
  # send failures. Served on loopback and scraped back into the same pipeline.
  selfTelemetry:
    enabled: true
    port: 8888

  # Scrape the DFE services' own /metrics. Every DFE chart already annotates its
  # pods via dfe-common.prometheusAnnotations, so this is discovery by annotation
  # rather than a target list. Needed because the Rust services expose Prometheus
  # but do not push OTLP (scalo-rs#28), which leaves the pipeline dashboards blank.
  # Turn it OFF for any service that starts pushing: the scrape and the push use
  # the same metric names but different instance ids, so both running gives two
  # series per metric and a sum tile counts it twice.
  dfeServices:
    enabled: true
    collectionInterval: 30s

  # The data operators' own controller metrics: reconcile errors, work-queue depth,
  # API latency. Scraped rather than pushed because none of them speak OTLP.
  # Discovery is by Service endpoint, not pod annotation: the ClickHouse chart's
  # scraping_annotations omit prometheus.io/scheme while its port serves HTTPS, so
  # an annotation-driven scrape fails the TLS handshake.
  # Bounded to operatorNamespaces -- the job presents the collector's
  # ServiceAccount token, which must not leave namespaces we install into.
  platformComponents:
    enabled: true
    collectionInterval: 30s
    # Port names to scrape. `https` selects controller-runtime's secure endpoint;
    # the plain names are the convention for unauthenticated exposition.
    portNames: "https|metrics|http-metrics"

# Shared endpoint facts. Defaulted here so the chart renders standalone; a real
# deploy takes them from argocd/values/common.yaml, which is the SSoT.

# Where the data operators run -- the discovery scope for platformComponents.
operatorNamespaces:
  clickhouse: clickhouse-operator-system
  strimzi: strimzi
  cnpg: cnpg-system

clickhouse:
  host: dfe-clickhouse.clickhouse.svc.cluster.local
  nativePort: 9000
  database: dfe
  user: default

kafka:
  bootstrapServers: "dfe-kafka.strimzi.svc.cluster.local:9092"
  # strimzi | redpanda | msk | confluent-cloud | redpanda-cloud, the SAME token
  # the kafka chart's own kafka.provider carries -- gates
  # clusterTelemetry.mskOpenMonitoring below. Populated from the
  # dfe.hyperi.io/kafka_provider cluster-secret annotation
  # (argocd/appsets/layer2-data.yaml); strimzi is both this chart's and the
  # kafka chart's own default, so an unset annotation changes nothing.
  provider: strimzi
  # MSK's own bare broker hosts (no port), comma separated -- the target list
  # the Prometheus receiver below needs. Derived by bootstrap.sh from
  # DFE_KAFKA_BOOTSTRAP; empty on every provider but msk.
  brokerHosts: ""

exporters:
  # OTLP push to a hyperdx-side receiver. OFF: the dfe-hyperdx image ships
  # no OTLP listener; flip on (with an endpoint) only when the fork deploys
  # its own collector.
  hyperdx:
    enabled: false
    endpoint: ""
  # ClickHouse exporter -- writes the otel_logs/otel_traces/otel_metrics
  # tables the embedded HyperDX reads. THE default telemetry sink.
  clickhouse:
    enabled: true
    # Empty -> derived from the shared clickhouse facts below, which is what a
    # real deploy wants; set these only to point the exporter somewhere else.
    endpoint: ""
    database: ""
    username: ""
    passwordSecretName: clickhouse-admin-password
    # ClickHouse session settings, merged into the exporter's DSN query string.
    #
    # A log body repeating a JSON path fails its whole batch with code 117 and
    # the retry never drains it, so one record stops the logs pipeline.
    # The skip keeps the first occurrence and is silent; the raw Body column
    # still holds the original text.
    connectionParams:
      type_json_skip_duplicated_paths: "1"

# OTLP ingest from OUTSIDE the cluster, through the gateway's otel route. Off,
# nothing here renders. On, a second OTLP/HTTP receiver listens on `port`, admits
# only a bearer token, and feeds the same pipelines, while 4317/4318 stay exactly
# as they are for senders inside the cluster. Defaulted here so the chart renders
# standalone. A real deploy takes the switch from argocd/values/common.yaml or
# the deploy repo's infra/common.yaml, which the gateway chart reads too.
otel:
  ingress:
    enabled: false
    port: 4319
    auth:
      # The ClusterSecretStore the token is read from.
      secretStoreName: dfe-secret-store
      # The token's path in that store. Required when enabled.
      remoteKey: ""
      # The field within that entry. Each line's first word is a valid token, so
      # a rotation can hold the old and the new one at once.
      property: token
      # The Secret the token lands in, mounted into the gateway pod.
      secretName: dfe-otel-ingress-token
