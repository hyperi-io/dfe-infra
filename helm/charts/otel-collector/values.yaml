project: dfe
component: otel-collector
env: local
cloud: local

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.158.0"  # 2026-07-22 (7-day-compliant). Pinned explicitly, not via appVersion.
  pullPolicy: IfNotPresent

# The contrib image ships USER 10001 (numeric, verified via crane), so
# runAsNonRoot is satisfiable. The daemonset already runs as 10001 today and
# reads /var/log/pods fine at that uid; this just makes it explicit + hardened.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# health_check extension port, served by BOTH collector configs (gateway +
# daemonset) and probed by their workloads. The probes are only valid because
# configmap.yaml enables the extension in service.extensions -- a probe against
# a collector without the extension dials a closed port and kills the pod.
healthCheckPort: 13133

gateway:
  replicas: 1
  # Adds the `debug` exporter to the traces and logs pipelines, which prints one
  # line per batch to the collector's own log. Off by default: at a few hundred
  # records a second it is the loudest thing in the namespace and it tells an
  # operator nothing the pipeline metrics do not.
  debugExporter: false
  # Gateway PDB (templates/gateway-pdb.yaml): renders only when replicas >= 2,
  # same drain-safety gating as dfe-common.pdb. maxUnavailable defaults to 1.
  pdb:
    enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  service:
    grpcPort: 4317
    httpPort: 4318
    prometheusPort: 8889

daemonset:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Where the DFE apps run (the ApplicationSet passes the cluster annotation);
# empty falls back to {project}-{env}.
appNamespace: ""

# Cluster + dependency telemetry, feeding the pre-canned HyperDX dashboards
# (dfe-engine#184). The dashboards are identical on every profile; collection cost
# is not, so the expensive scrapers are gated here and enabled per profile.
# Parse a severity out of each container log line (DaemonSet filelog). Without it
# every log row stores SeverityText='' and no severity filter or error tile works.
# Verified against a 406-line sample of live cluster logs: 395 parsed, no line
# carrying a level token missed, and no false ERROR.
logSeverity:
  enabled: true

clusterTelemetry:
  # Cluster-scoped state: node conditions, allocatable, replica counts, pod phase.
  # Gateway-only -- it reads the API server, and one instance per cluster is the
  # contract.
  k8sCluster:
    enabled: true
    collectionInterval: 30s

  # Per-node/pod/container consumption, read off each node's kubelet. DaemonSet-only.
  # Container-level series multiply by every container on every node, so slim leaves
  # it off. `volume` is omitted: a series per mounted volume, unused by the PV tiles.
  kubeletStats:
    enabled: false
    collectionInterval: 30s
    metricGroups: [node, pod, container]

  # ClickHouse server metrics via sqlquery over system.metrics/events/parts.
  # Not the :9363 Prometheus endpoint -- the clickhouse-cluster chart does not
  # expose it and managed ClickHouse does not offer it, whereas these system tables
  # are readable from any client on any provider.
  # Credentials come from the gateway's existing CLICKHOUSE_PASSWORD env.
  clickhouse:
    enabled: true
    collectionInterval: 30s

  # Broker-side Kafka metrics. kafka_metrics speaks the Kafka protocol against
  # bootstrapServers, so single-broker and Strimzi share one config with no JMX
  # exporter. Complements the consumers' own rdkafka_* lag, which stops reporting
  # when a consumer dies.
  # Off by default -- slim has no Kafka. SASL/SCRAM-SHA-512 is the DFE broker
  # standard, so the credential must be projected here via the kafka chart's
  # `user.password.extraAppNamespaces`.
  kafka:
    enabled: false
    collectionInterval: 30s
    # Pinned rather than left to the receiver default of 2.1.0.
    protocolVersion: "3.6.0"
    scrapers: [brokers, topics, consumers]
    sasl:
      enabled: true
      mechanism: SCRAM-SHA-512
      username: dfe-kafka-user
      passwordSecretName: dfe-kafka-user
      passwordSecretKey: password

  # KEDA needs no receiver here: the operator pushes its own metrics over OTLP to
  # the gateway, enabled in argocd/appsets/layer1-addons.yaml. Kept as a documented
  # absence so the next reader does not add a scrape job for it.

  # The collector's own pipeline health (otelcol_*): queue depth, enqueue failures,
  # send failures. Served on loopback and scraped back into the same pipeline.
  selfTelemetry:
    enabled: true
    port: 8888

  # Scrape the DFE services' own /metrics. Every DFE chart already annotates its
  # pods via dfe-common.prometheusAnnotations, so this is discovery by annotation
  # rather than a target list. Needed because the Rust services expose Prometheus
  # but do not push OTLP (scalo-rs#28), which leaves the pipeline dashboards blank.
  # Turn it OFF for any service that starts pushing: the scrape and the push use
  # the same metric names but different instance ids, so both running gives two
  # series per metric and a sum tile counts it twice.
  dfeServices:
    enabled: true
    collectionInterval: 30s

# Shared endpoint facts. Defaulted here so the chart renders standalone; a real
# deploy takes them from argocd/values/common.yaml, which is the SSoT.
clickhouse:
  host: dfe-clickhouse.clickhouse.svc.cluster.local
  nativePort: 9000
  database: dfe
  user: admin

kafka:
  bootstrapServers: "dfe-kafka.strimzi.svc.cluster.local:9092"

exporters:
  # OTLP push to a hyperdx-side receiver. OFF: the dfe-hyperdx image ships
  # no OTLP listener; flip on (with an endpoint) only when the fork deploys
  # its own collector.
  hyperdx:
    enabled: false
    endpoint: ""
  # ClickHouse exporter -- writes the otel_logs/otel_traces/otel_metrics
  # tables the embedded HyperDX reads. THE default telemetry sink.
  clickhouse:
    enabled: true
    endpoint: "tcp://dfe-clickhouse.clickhouse.svc.cluster.local:9000"
    # DFE canonical database (the CH-builtin `default` is retired); a parameter,
    # override per deployment. otel tables land as dfe.otel_*.
    database: dfe
    username: admin
    passwordSecretName: clickhouse-admin-password
