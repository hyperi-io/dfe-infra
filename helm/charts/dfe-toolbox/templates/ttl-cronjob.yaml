{{- if include "dfe-toolbox.idleManaged" . }}
{{- /*
Scales the toolbox Deployment to zero after toolbox.pod.idleSeconds without activity, or toolbox.pod.ttlSeconds after the pod starts, once a minute (files/idle-check.sh).
The CronJob runs the toolbox image for its kubectl and GNU date, so it needs no second pinned image.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dfe-common.fullname" . }}-ttl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dfe-common.fullname" . }}-ttl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The pod name carries a ReplicaSet hash, so exec cannot be fenced to one pod.
  # Held by this ServiceAccount alone, never the toolbox pod's. Same verbs as pods/portforward in rbac.yaml.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "dfe-common.fullname" . | quote }}]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ include "dfe-common.fullname" . | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dfe-common.fullname" . }}-ttl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dfe-common.fullname" . }}-ttl
subjects:
  - kind: ServiceAccount
    name: {{ include "dfe-common.fullname" . }}-ttl
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dfe-common.fullname" . }}-ttl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.toolbox.pod.ttlCheckSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          # Not dfe-common.labels: its app.kubernetes.io/name is the toolbox pod's own, so
          # this pod would match the SELECTOR below and the toolbox NetworkPolicy.
          labels:
            app.kubernetes.io/name: {{ printf "%s-%s-ttl" .Values.project .Values.component | quote }}
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
            app.kubernetes.io/part-of: {{ .Values.project | quote }}
            app.kubernetes.io/managed-by: "helm"
            app.kubernetes.io/version: {{ .Chart.AppVersion | default "0.0.0" | quote }}
            dfe.hyperi.io/env: {{ .Values.env | quote }}
            dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
        spec:
          {{- include "dfe-common.podSecurityContext" . | nindent 10 }}
          serviceAccountName: {{ include "dfe-common.fullname" . }}-ttl
          {{- include "dfe-common.imagePullSecrets" . | nindent 10 }}
          restartPolicy: Never
          containers:
            - name: ttl
              image: {{ include "dfe-common.image" . }}
              {{- include "dfe-common.containerSecurityContext" . | nindent 14 }}
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: DEPLOYMENT
                  value: {{ include "dfe-common.fullname" . | quote }}
                - name: SELECTOR
                  value: "app.kubernetes.io/name={{ printf "%s-%s" .Values.project .Values.component }}"
                - name: IDLE_SECONDS
                  value: {{ toString .Values.toolbox.pod.idleSeconds | quote }}
                - name: IDLE_WARN_SECONDS
                  value: {{ toString .Values.toolbox.pod.idleWarnSeconds | quote }}
                - name: TTL_SECONDS
                  value: {{ toString .Values.toolbox.pod.ttlSeconds | quote }}
                # kubectl's discovery cache lands under $HOME otherwise, which is read-only.
                - name: KUBECACHEDIR
                  value: /tmp/kube-cache
              command: ["/bin/bash", "/opt/dfe-idle/idle-check.sh"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: idle
                  mountPath: /opt/dfe-idle
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: idle
              configMap:
                name: {{ include "dfe-common.fullname" . }}-idle
{{- end }}
