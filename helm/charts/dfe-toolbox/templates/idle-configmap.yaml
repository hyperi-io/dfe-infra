{{- if include "dfe-toolbox.idleManaged" . }}
{{- /* The scale-down scripts, mounted at /opt/dfe-idle in the toolbox pod and in the CronJob, so the image needs no change. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-idle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/*").AsConfig | nindent 2 }}
{{- end }}
