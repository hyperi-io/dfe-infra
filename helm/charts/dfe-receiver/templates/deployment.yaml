apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config blob changes -- the app reads the file at
        # startup only, so a ConfigMap update alone would not take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      # Same class as dfe-engine and dfe-loader: k8s injects DFE_RECEIVER_PORT=
      # "tcp://IP:8080" from svc/dfe-receiver, into a pod that reads DFE_RECEIVER_*
      # as its own config (config/mod.rs ENV_PREFIX). DFE resolves by DNS and reads
      # none of these -- switch them off before the collision finds us.
      enableServiceLinks: false
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: receiver
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Mirrors the image CMD (dfe-receiver Dockerfile:43). Explicit so the
          # config path is visible here rather than buried in the image.
          args:
            - "--config"
            - "/etc/dfe-receiver/config.yaml"
          # Container ports come from the SAME .Values.listeners list that drives
          # the Services. When the engine's deployment-contracted overlay sets
          # listeners (the receiver's actually-enabled protocols), these follow
          # automatically; otherwise the chart default (http+grpc) applies.
          ports:
            {{- range .Values.listeners }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- include "dfe-common.kafkaProviderEnv" . | nindent 12 }}
            {{- if .Values.kafka.saslSecretName }}
            # SASL credential by env, not in the config blob -- see the same block in
            # dfe-loader. Env beats the config file, and the engine-authored YAML
            # carries a MASKED password, so these are load-bearing, not belt-and-braces.
            #
            # Names are the receiver's own flat-env contract
            # (dfe-receiver/src/config/mod.rs:274-281, prefix DFE_RECEIVER at :35).
            # It spells it USER where dfe-loader spells it USERNAME -- an upstream
            # inconsistency, not a typo here.
            #
            # The mechanism MUST be supplied too (dfe-engine#105): normalize()
            # (mod.rs:369-376) sets only sasl.enabled, and the receiver's SaslConfig
            # derives Default -> mechanism "" (mod.rs:1251), which librdkafka rejects.
            # dfe-loader does NOT share this: it has an explicit impl Default with
            # mechanism scram_sha_512 (kafka.rs:220-228).
            #
            # It rides the SAME secret as the credential (the store projects
            # sasl.mechanism alongside username/password), so the mechanism can never
            # drift from the password it belongs to.
            #
            # SPELLING TRAP, live-proven 2026-07-17: this value is a RAW PASSTHROUGH
            # to librdkafka -- mod.rs:1146 only uppercases it (`SCRAM-SHA-512`), where
            # dfe-loader parses an enum from `scram_sha_512`. The SAME logical value is
            # spelled DIFFERENTLY per service. Feeding the loader's spelling here dies
            # with "Unsupported SASL mechanism: SCRAM_SHA_512". The secret carries the
            # librdkafka spelling; do not "normalise" the two to look alike.
            - name: DFE_RECEIVER_KAFKA_SASL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: username
            - name: DFE_RECEIVER_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: password
            - name: DFE_RECEIVER_KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.saslSecretName }}
                  key: sasl.mechanism
            {{- end }}
            - name: DFE_RECEIVER_LISTEN_ADDRESS
              value: {{ .Values.receiver.listenAddress | quote }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-receiver
          volumeMounts:
            - name: config
              mountPath: /etc/dfe-receiver
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
