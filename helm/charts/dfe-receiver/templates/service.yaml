{{- /*
  Internal mode routes through the cluster Gateway, and the only gateway path
  the receiver has is an HTTPRoute (envoy-gateway-config, routes.receiver),
  which serves the listener named `http`. Any OTHER listener marked exposed has
  no path at all in this mode, so fail the render rather than deploy a listener
  that silently receives nothing.
*/}}
{{- if ne (.Values.exposure.mode | default "public") "public" }}
{{- range .Values.listeners }}
{{- if and .exposed (ne .name "http") }}
{{- fail (printf "dfe-receiver: listener %q (%v/%s) is exposed but exposure.mode is %q, and the cluster Gateway routes only the http listener. Either set exposure.mode: public so it gets a LoadBalancer, or add a dedicated Gateway listener plus a TCPRoute/UDPRoute for it and mark this listener exposed: false." .name .port (.protocol | default "TCP") $.Values.exposure.mode) }}
{{- end }}
{{- end }}
{{- end }}
# Internal Service (always). ClusterIP -- reachable in-cluster. Carries EVERY
# configured listener (.Values.listeners) so east-west producers and the health
# probes hit the same ports the container listens on.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.listeners }}
    - port: {{ .port }}
      targetPort: {{ .name }}
      protocol: {{ .protocol | default "TCP" }}
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
{{- if eq (.Values.exposure.mode | default "public") "public" }}
{{- /*
  Public exposure: the receiver is a single-homed airlock -- it ingests
  externally and produces to LOCAL Kafka, which stays private. EVERY listener
  marked `exposed: true` is opened on a public LoadBalancer. Because mixed TCP+UDP
  in one Service is not portable across cloud LBs, we render ONE LB per protocol
  family that has exposed listeners (e.g. gRPC/lumberjack on the TCP LB,
  netflow/syslog on the UDP LB). The LB implementation is SWAPPABLE via
  exposure.public.loadBalancerClass + annotations (cloud NLB <-> k8s MetalLB).
*/}}
{{- $exposedTCP := list }}
{{- $exposedUDP := list }}
{{- range .Values.listeners }}
  {{- if .exposed }}
    {{- if eq (.protocol | default "TCP") "UDP" }}
      {{- $exposedUDP = append $exposedUDP . }}
    {{- else }}
      {{- $exposedTCP = append $exposedTCP . }}
    {{- end }}
  {{- end }}
{{- end }}
{{- $pub := .Values.exposure.public }}
{{- if gt (len $exposedTCP) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-common.fullname" . }}-public
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    dfe.hyperi.io/exposure: public
  {{- with $pub.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $pub.serviceType | default "LoadBalancer" }}
  {{- /* The TCP door only: a second Service cannot hold the same address. */}}
  {{- if and (eq ($pub.serviceType | default "LoadBalancer") "LoadBalancer") $pub.loadBalancerIP }}
  loadBalancerIP: {{ $pub.loadBalancerIP }}
  {{- end }}
  {{- if and (eq ($pub.serviceType | default "LoadBalancer") "LoadBalancer") $pub.loadBalancerClass }}
  loadBalancerClass: {{ $pub.loadBalancerClass }}
  {{- end }}
  {{- with $pub.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- range $exposedTCP }}
    - port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if gt (len $exposedUDP) 0 }}
---
# Separate UDP LoadBalancer (netflow / syslog-udp) -- mixed TCP+UDP in one
# Service is not portable across cloud LB controllers.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-common.fullname" . }}-public-udp
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    dfe.hyperi.io/exposure: public
  {{- with $pub.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $pub.serviceType | default "LoadBalancer" }}
  {{- if and (eq ($pub.serviceType | default "LoadBalancer") "LoadBalancer") $pub.loadBalancerClass }}
  loadBalancerClass: {{ $pub.loadBalancerClass }}
  {{- end }}
  {{- with $pub.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- range $exposedUDP }}
    - port: {{ .port }}
      targetPort: {{ .name }}
      protocol: UDP
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
