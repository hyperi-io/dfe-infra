{{- if eq (.Values.exposure.mode | default "public") "public" }}
{{- if .Values.exposure.networkPolicy.enabled }}
{{- $exposed := list }}
{{- range .Values.listeners }}
  {{- if .exposed }}
    {{- $exposed = append $exposed . }}
  {{- end }}
{{- end }}
{{- if gt (len $exposed) 0 }}
{{- /*
  The namespace baseline (network-policies chart, dfe-ingress-policy) selects
  every pod and admits only the gateway, KEDA, otel and the other DFE
  namespaces, so external ingest is dropped on a policy-enforcing CNI even
  after the LoadBalancer provisions. NetworkPolicies are additive, so this one
  adds the exposed ingest ports without touching that baseline.

  Client-CIDR restriction is exposure.public.loadBalancerSourceRanges, not an
  ipBlock here: under the default externalTrafficPolicy kube-proxy SNATs
  external traffic to a node address, so an ipBlock would match the node rather
  than the client and drop traffic the LB had already allowed.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dfe-common.fullname" . }}-ingest
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    dfe.hyperi.io/exposure: public
spec:
  podSelector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- range $exposed }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
