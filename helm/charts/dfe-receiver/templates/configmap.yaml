# The app's scalo config file, rendered VERBATIM from the .Values.config blob.
# Layer B of the engine's values contract (dfe-engine helm/models.py): the engine
# is the config authority and emits `config` as an OPAQUE passthrough -- this
# chart never interprets the per-app keys, it only writes them to the path the
# image's CMD reads (/etc/dfe-receiver/config.yaml -- dfe-receiver Dockerfile:43).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $cfg := deepCopy (.Values.config | default dict) }}
    {{- if eq (default "" .Values.kafka.mode) "disabled" }}
    {{- /* No-kafka profile: route the default destination to the loader over
           direct gRPC. The receiver has no flat-env keys for loader.transport
           or destinations.default (config/mod.rs apply_flat_env), so this is
           the one seam that can set them. grpc_endpoint derives from address. */}}
    {{- $_ := set $cfg "destinations" (mergeOverwrite (default dict (get $cfg "destinations")) (dict "default" "loader")) }}
    {{- $_ := set $cfg "loader" (mergeOverwrite (default dict (get $cfg "loader")) (dict "address" .Values.loaderGrpcAddress "transport" "grpc")) }}
    {{- end }}
    {{- toYaml $cfg | nindent 4 }}
