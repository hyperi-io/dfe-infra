project: dfe
component: receiver
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 8443

receiver:
  listenAddress: "100.64.0.1"   # CGNAT range per spec Section 2.9

kafka:
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user

config:
  mountPath: /config
  nfs:
    server: ""
    path: ""

otel:
  endpoint: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- folded into the chart (no side-car keda-scalers chart).
# The engine/overlay drives these via the per-instance values file. Default
# trigger is the OTel-native scaling-pressure metric (NO Prometheus server).
# minReplicaCount stays 1 -- scale-to-zero is 2.2 backlog; set min/idle to 0 via
# the overlay to opt this pipeline app in later.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: metrics-api
      metadata:
        targetValue: "70"
        url: "http://dfe-otel-collector-gateway.otel.svc.cluster.local:8889/api/v1/query?query=avg(dfe_scaling_pressure{service_name=\"dfe-receiver\"})"
        valueLocation: "data.result.0.value.1"

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
