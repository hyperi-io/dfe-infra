project: dfe
component: receiver
env: local
cloud: local

image:
  repository: ""
  tag: ""
  # The immutable half of the pin; GHCR tags are mutable. == versions.yaml
  # digests.dfe-receiver (drift-checked).
  digest: "sha256:c4a772973472173eb29be80792d7eeec3312dfe5aad989df067fbe90feb6e00a"
  pullPolicy: IfNotPresent

replicaCount: 1

# PodDisruptionBudget (dfe-common.pdb): renders only where the workload can
# carry two pods, so a single-replica deployment never gets a budget that blocks
# node drains. The helper picks the form from the workload's floor.
pdb:
  enabled: true

service:
  type: ClusterIP

# Receiver ingest listeners -- the SINGLE SOURCE OF TRUTH for ports. The engine
# populates this from the receiver's enabled protocols (it configures the
# receiver), and the chart renders the container ports, the internal Service, AND
# the public LoadBalancer(s) from it. Enable a protocol in the engine overlay ->
# its port is opened end to end (container + Service + LB), no chart edit.
#   name     -- k8s port name (<=15 chars, lowercase alnum + '-')
#   port     -- listen port
#   protocol -- TCP | UDP  (netflow/syslog are UDP; grpc/https/lumberjack are TCP)
#   exposed  -- include on the PUBLIC LoadBalancer when exposure.mode=public,
#               and open on the ingest NetworkPolicy. Data-ingest protocols are
#               true; a listener carrying only admin/health surface is false.
#   appProtocol -- optional L7 hint on the Service port, for a proxy that has to
#               decide how to speak to this listener. Set on the east-west gRPC
#               door only: an L4 LoadBalancer never reads it, and some cloud LB
#               controllers act on it, so the public ports leave it unset.
# NOTE: mixed TCP+UDP in one Service is not portable across cloud LBs, so the
# public path renders ONE LoadBalancer per protocol family that has exposed
# listeners (see templates/service.yaml).
# The http listener carries the JSON ingest path and /livez + /readyz, so
# exposing ingest exposes both probe paths.
listeners:
  - { name: http, port: 8080, protocol: TCP, exposed: true }     # JSON ingest + OTLP/HTTP + probes
  - { name: grpc, port: 8443, protocol: TCP, exposed: true }     # OTLP/gRPC ingest
  # The PushEvents door for in-cluster producers -- dfe-fetcher sends here when
  # kafka.mode is disabled. NEVER exposed: it is unauthenticated by default and
  # the namespace baseline admits only the other DFE namespaces. Present in this
  # list is what switches the receiver's grpc server on (see the configmap), so
  # removing the entry closes the door.
  - { name: pushgrpc, port: 6000, protocol: TCP, exposed: false, appProtocol: kubernetes.io/h2c } # scalo Push RPC from in-cluster producers
  # Enable per the source's protocols via the engine overlay, e.g.:
  # - { name: lumberjack, port: 5044, protocol: TCP, exposed: true }  # Beats/Elastic
  # - { name: netflow,    port: 2055, protocol: UDP, exposed: true }  # NetFlow/IPFIX
  # - { name: syslog-udp, port: 514,  protocol: UDP, exposed: true }  # RFC3164/5424
  # - { name: syslog-tcp, port: 601,  protocol: TCP, exposed: true }  # RFC6587

# Ingress exposure SEAM. The receiver is a single-homed airlock: it ingests
# externally and produces to LOCAL Kafka, which stays private regardless. The
# overlay (198.18/15) + Kafka never face the public.
#
# mode:
#   public (DEFAULT) -- render one LoadBalancer per protocol family carrying the
#     exposed listeners, plus the NetworkPolicy that lets that traffic reach the
#     pods. A fresh deploy is therefore INTERNET-FACING on the ingest ports:
#     loadBalancerSourceRanges below is the allow-list, and it starts EMPTY,
#     which means every source address on earth. Set it, or bring an edge
#     (cloud LB / WAF / mTLS / API gateway) that does.
#   internal -- ClusterIP only, reached through the cluster Gateway. The gateway
#     path is an HTTPRoute (envoy-gateway-config, routes.receiver), so only the
#     listener named http has one; any OTHER exposed listener has no path at all
#     and the chart FAILS the render rather than accept it.
#   vpn -- ClusterIP only, reached over the edge-fleet tunnel. Senders dial the
#     VPN's LoadBalancer instead of the receiver's, so the receiver itself has
#     no public address at all and EVERY exposed listener is reachable, not
#     just http. The ingest NetworkPolicy then admits the VPN pods rather than
#     the world. The tunnel is the culvert chart, which is opt-in per
#     deployment: setting this mode without deploying it leaves the receiver
#     with no external path at all.
exposure:
  mode: public                # public | internal | vpn
  public:
    serviceType: LoadBalancer
    # The address the ingest door must answer on, when a DNS record already names
    # it. Empty lets the pool/CCM choose, so a rebuild can land on a different
    # address than the one senders are configured with. It pins the TCP LB alone:
    # the UDP LB is a separate Service and cannot hold the same address.
    loadBalancerIP: ""
    # SWAPPABLE LB implementation. loadBalancerClass selects WHO fulfils the
    # Service: leave "" for the cluster default (cloud CCM -- AWS NLB / GCP / Azure
    # via annotations), or set a class to target a specific provider, e.g.
    # "service.k8s.aws/nlb" (AWS Load Balancer Controller) or a k8s-native
    # MetalLB/kube-vip class on bare metal. Same chart, different overlay -> swap
    # cloud LB <-> k8s LB with one value, no template change.
    loadBalancerClass: ""
    annotations: {}           # provider-specific LB config (AWS NLB scheme, etc.)
    # THE INGRESS ALLOW-LIST. Empty is not "unset" -- it is 0.0.0.0/0, the whole
    # internet, on every exposed listener. Every deployment that does not want
    # that supplies its CIDRs here, e.g. ["203.0.113.0/24", "198.51.100.7/32"].
    # The receiver's server.auth.mode defaults to none, so an empty list means
    # unauthenticated posts to /ingest from anywhere (docs/INGEST-EDGE.md).
    loadBalancerSourceRanges: []
  # The tunnel that reaches this receiver in vpn mode.
  vpn:
    # Selector label of the VPN pods -- dfe-common.selectorLabels on the culvert
    # chart, i.e. {project}-{component}.
    podLabel: dfe-culvert
  # NetworkPolicy opening the exposed listener ports. The namespace baseline
  # (network-policies chart) admits only the gateway, KEDA, otel and the other
  # DFE namespaces, so external ingest is dropped without this even once the LB
  # provisions. In public mode it carries no client CIDRs -- kube-proxy SNAT
  # hides them, so the allow-list stays the LB's job; in vpn mode it names the
  # tunnel pods, which is exact. Not rendered in internal mode: the baseline
  # already admits the gateway.
  networkPolicy:
    enabled: true

receiver:
  # Bind on all pod interfaces. Not a CGNAT address: 100.64/10 is reserved for
  # VPN clients (argocd/values/common.yaml vpn.clientCIDR) and cannot bind in a
  # normal pod anyway. The pod's exposure is the Services and LBs above.
  listenAddress: "0.0.0.0"

  # What the receiver holds while the next stage is not taking records. On the
  # bus the broker is that slack; on the direct transport nothing downstream
  # stores anything, so this IS the slack in the whole chain and a profile
  # without a broker raises it. The keys map onto the app's own config.buffer,
  # and the chart writes them there -- the engine compiles routing, not
  # buffering, so this block is the one source for both the config file and the
  # spool volume the deployment mounts.
  buffer:
    # Bytes the buffers may hold. 0 = the app's auto-detect, which takes 85% of
    # the pod's memory limit and back-pressures at 80% of that.
    memoryLimit: 0
    spillover:
      # Spill to disk instead of dropping when memory fills. The trade belongs
      # in the values file that turns it on: an outage shorter than the buffer
      # is invisible to senders, a longer one back-pressures them.
      enabled: false
      path: /var/spool/dfe-receiver
      # How large the spool volume may grow. Kubernetes' cap on the emptyDir,
      # with no key on the app's side -- the app spills until its own
      # max_usage_percent of whatever filesystem it was given.
      sizeLimit: 10Gi

kafka:
  # "disabled" is the DEPLOYMENT-WIDE transport dial, set once in the profile
  # values: it drops every kafka env + secret ref and routes the default
  # destination to the loader over direct gRPC. Templates read it through
  # dfe-common.transport, never by comparing this string themselves.
  mode: ""
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""

# The DFE DLQ standard: kafka is the DLQ backend (a file DLQ write is an EROFS
# no-op on the read-only rootfs) and every write lands on the app's pre-created
# topic -- the kafka chart's kafka.dlqTopics list. Change the topic only
# together with that list, or the app dead-letters into a topic nothing created.
dlq:
  topic: dfe_receiver_dlq
  mode: kafka_only

# The app's scalo config, mounted VERBATIM at /etc/dfe-receiver/config.yaml (the
# image's CMD path -- dfe-receiver Dockerfile:43). This is an OPAQUE passthrough
# blob: the engine is the config authority and publishes it as the per-instance
# Argo multi-source $values overlay (values/dfe-receiver-<instance>-values.yaml),
# so the chart never needs to know the per-app keys. Empty here on purpose --
# baking defaults in would put deployment-specific addresses in a product chart,
# and Helm's map merge would silently leave stale keys behind when the engine's
# overlay does not overwrite them.
#
# NOTE: the receiver's own listen ports live in .Values.listeners (above), which
# drives the container ports + Services. Keep config.server.bind_address's port
# consistent with the matching listener.
config: {}

otel:
  endpoint: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- folded into the chart (no side-car keda-scalers chart).
# The engine/overlay drives these via the per-instance values file. The SHIPPED
# trigger is the native cpu scaler; the scalo ScalingPressure composite (0-100)
# through the fail-safe dfe-keda-shim is opt-in until every app emits the gauge
# (dfe-infra #302), and the HPA takes the higher of the two where both render.
# minReplicaCount stays 1 -- scale-to-zero is 2.2 backlog; set min/idle to 0 via
# the overlay to opt this pipeline app in later.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # second trigger: native KEDA cpu scaler (no shim needed)
  # OPT-IN: scale on scalo ScalingPressure (0-100) via the fail-safe dfe-keda-shim,
  # which freezes scaling on a metric outage rather than running replicas up.
  pressure:
    enabled: false            # no Rust app emits the gauge yet -- dfe-infra #302
    # service: dfe-receiver   # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: the library default names namespace dfe -- set this anywhere else (dfe-infra #301)

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
