apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config blob changes -- the app reads the file at
        # startup only, so a ConfigMap update alone would not take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: fetcher
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          # Mirrors the image CMD (dfe-fetcher Dockerfile:43). Explicit so the
          # config path is visible here rather than buried in the image.
          args:
            - "--config"
            - "/etc/dfe/fetcher.yaml"
          ports:
            # scalo's metrics server (defaults on 0.0.0.0:9090) hosts /metrics and
            # the /healthz + /readyz health endpoints -- one port for the scrape
            # annotation and the probes to agree on. Same scalo contract as dfe-loader.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: DFE_FETCHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiCredentials.secretName }}
                  key: {{ .Values.apiCredentials.apiKeyKey }}
            - name: DFE_FETCHER_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiCredentials.secretName }}
                  key: {{ .Values.apiCredentials.apiSecretKey }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-fetcher
          volumeMounts:
            - name: config
              mountPath: /etc/dfe
              readOnly: true
            # Writable scratch: the container rootfs is read-only
            # (dfe-common.containerSecurityContext), so anything writing /tmp
            # needs this emptyDir.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # WAS `exec: pgrep dfe-fetcher` -- a process-existence check that stays
          # green on a wedged-but-alive process, exactly the state liveness must
          # catch (k8s.md:970, containers.md:688-711). Moved to the scalo HTTP health
          # endpoints, matching dfe-loader (live-verified). NO startupProbe: scalo's
          # /startupz stays 503 until the app calls mark_started(), so a startup probe
          # would brick the pod (see the dfe-loader comment) -- add it upstream first.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-common.fullname" . }}-config
        - name: tmp
          emptyDir: {}
