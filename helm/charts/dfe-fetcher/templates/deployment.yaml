apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: fetcher
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: DFE_FETCHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiCredentials.secretName }}
                  key: {{ .Values.apiCredentials.apiKeyKey }}
            - name: DFE_FETCHER_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiCredentials.secretName }}
                  key: {{ .Values.apiCredentials.apiSecretKey }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-fetcher
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep dfe-fetcher"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          {{- if .Values.config.nfs.server }}
          nfs:
            server: {{ .Values.config.nfs.server }}
            path: {{ .Values.config.nfs.path }}
            readOnly: true
          {{- else }}
          emptyDir: {}
          {{- end }}
