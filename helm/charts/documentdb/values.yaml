project: dfe
component: documentdb
env: local
cloud: local

# Namespace the DFE apps run in, supplied by the appset from the cluster's
# dfe.hyperi.io/dfe_namespace annotation (layer2-data passes it to every data
# chart). The login and the gateway CA are copied there for hyperdx
# (templates/auth.yaml). Empty -> nothing is copied, and hyperdx cannot log in.
appNamespace: ""

# Where the operator addon installs CloudNativePG (its cloudnative-pg
# namespaceOverride in appsets/layer1-addons.yaml). templates/cnpg-rbac.yaml
# grants the operator there the EndpointSlice read its bundled chart omits.
operatorNamespace: cnpg-system

# Deployment-wide default StorageClass (set by the cloud overlay, e.g.
# local-path). documentdb.storage.storageClass overrides it, and empty everywhere
# falls through to the cluster default class.
storageClass: ""

# The DocumentDB cluster the operator runs: PostgreSQL with the DocumentDB
# extension on CloudNativePG, and the Mongo-wire gateway as a sidecar in every
# instance pod. The operator itself is a layer 1 addon (appsets/layer1-addons.yaml).
documentdb:
  # The release the images below carry. The operator's webhook reads it, because
  # a digest-pinned image reference carries no version it can parse.
  version: "1.0.0"
  image:
    # Mounted into PostgreSQL as an image volume: Kubernetes 1.35+, or 1.34
    # with the ImageVolume feature gate on.
    documentDB: "ghcr.io/documentdb/documentdb-kubernetes-operator/documentdb:1.0.0@sha256:6b2b014a754ca96ab0f028a1015bd735caa8eda0ec153e3e64dc5dab3ee83bf9"
    gateway: "ghcr.io/documentdb/documentdb-kubernetes-operator/gateway:1.0.0@sha256:63e89a22501ac35927137759f2da32e28d80ced626f555c62c4a17c4cc7bfb27"
    # The operator's documented base: a CNPG trixie image, which the extension's
    # glibc needs. PostgreSQL 18.6 is the DFE standard.
    postgres: "ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:0675340b02be838319b9b6f323c206693e519dcd62ec729d539be9f46bb7a2f9"
  # A primary and one streaming replica. CloudNativePG promotes the replica when
  # the primary fails, and that failover takes no quorum, so 2 is enough.
  instances: 2
  # The pod envelope per instance, Guaranteed: the operator gives the gateway
  # 3/16 of the memory and PostgreSQL the rest, and the CPU less the gateway's.
  resource:
    memory: 1Gi
    cpu: "1"
    gateway:
      cpu: 200m
  storage:
    size: 5Gi
    storageClass: ""  # empty -> top-level storageClass -> cluster default
    # The operator's default. bootstrap/destroy.sh sets this store's volumes to
    # Delete once the operator has gone, so a teardown leaves no disk behind.
    reclaimPolicy: Retain
  # CloudNativePG's own anti-affinity, on hosts, plus a zone preference. Preferred,
  # so a single-node or single-zone cluster still schedules both instances.
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    zoneTopologyKey: topology.kubernetes.io/zone
  # The extension runs pg_cron jobs every few seconds. cron.log_run records each
  # in cron.job_run_details, which pg_cron never purges and which shares the PVC.
  postgresParameters:
    cron.log_run: "off"
    cron.log_statement: "off"
  auth:
    # The Mongo-side login. The gateway on the primary creates it with
    # readWriteAnyDatabase and clusterAdmin from this Secret (keys username and
    # password), generated in-cluster once (templates/auth.yaml).
    username: hyperdx
    secretName: dfe-documentdb-credentials
  tls:
    # The gateway always serves TLS. Its certificate comes from a CA this chart
    # mints, and hyperdx verifies against a copy of that CA.
    caSecretName: dfe-documentdb-ca-keypair
    gatewaySecretName: dfe-documentdb-gateway-tls
    # ca.crt alone, the only Secret the app-namespace copy may read.
    caOnlySecretName: dfe-documentdb-ca-cert
    # Name of the CA copy in appNamespace, which argocd/values/apps/hyperdx mounts.
    appCaSecretName: dfe-documentdb-ca
    # The CA's own lifetime. Its key never rotates, so a client still holding the
    # previous CA copy verifies a gateway certificate the renewed CA signs. The
    # gateway certificate is the operator's: 90 days, renewed 15 days out.
    duration: 87600h
    renewBefore: 8760h
