{{- define "dfe-extras.engine.ingestBearerSecret" -}}
{{- /*
The Secret dfe-engine writes dfe-receiver's ingest bearer tokens into, one key per
listener (dfe-engine.mirrorSecret). The engine reads its name from
DFE_ENGINE_INGEST_BEARER_SECRET (_engine-env.tpl).

Only while the engine keeps what it mints on its own volume: the receiver reads
file:/var/run/secrets/dfe/ingest-bearer-tokens/<listener> sources then, and no
receiver pod can mount the engine's PVC. On a Secrets Manager store the receiver
reads aws: sources and none of this renders. Rendered with the engine, a wave
before dfe-receiver, so the receiver's mount finds it.
*/ -}}
{{- if not (include "dfe-engine.secretsOnAws" .) }}
{{- $name := required "ingestBearer.secretName is empty: the engine writes dfe-receiver's bearer tokens into this Secret, and the receiver mounts it" (dig "secretName" "" (.Values.ingestBearer | default dict)) }}
{{ include "dfe-engine.mirrorSecret" (dict "ctx" . "name" $name) }}
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.ingestBearerSecret") }}
