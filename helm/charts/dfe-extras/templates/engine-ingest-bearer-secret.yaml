{{- define "dfe-extras.engine.ingestBearerSecret" -}}
{{- /*
The Secret dfe-engine writes dfe-receiver's ingest bearer tokens into, one key per
listener, and the Role granting the engine's account get and update on that one
Secret. The engine reads its name from DFE_INGEST_BEARER_SECRET (_engine-env.tpl).

Only while the engine keeps what it mints on its own volume: the receiver reads
file:/var/run/secrets/dfe/ingest-bearer-tokens/<listener> sources then, and no
receiver pod can mount the engine's PVC. On a Secrets Manager store the receiver
reads aws: sources and none of this renders.

Rendered with no data: the engine owns every key, writing it through scalo's
kubernetes provider with the resourceVersion it read. Argo applies it server-side
naming no data, and layer2-apps.yaml ignores its /data, so a sync never takes a
token back. Rendered with the engine, a wave before dfe-receiver, so the
receiver's mount finds it.
*/ -}}
{{- if not (include "dfe-engine.secretsOnAws" .) }}
{{- $name := required "ingestBearer.secretName is empty: the engine writes dfe-receiver's bearer tokens into this Secret, and the receiver mounts it" (dig "secretName" "" (.Values.ingestBearer | default dict)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-writer
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
rules:
  # resourceNames holds the engine to this one Secret: no list, watch or create,
  # and no other Secret in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-writer
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "dfe-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.ingestBearerSecret") }}
