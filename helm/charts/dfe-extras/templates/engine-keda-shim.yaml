{{- define "dfe-extras.engine.kedaShim" -}}
{{- /*
dfe-keda-shim -- the KEDA metrics-api -> ClickHouse query adapter, its own pod on the engine image (`dfe-keda-shim
run`). KEDA's pressure and hunt-backlog triggers poll its Service. Its labels differ (app.kubernetes.io/name:
dfe-keda-shim) so the engine's Service selector never routes to it, which is why it is not another engine replica.
*/ -}}
{{- if .Values.kedaShim.enabled }}
{{- include "dfe-engine.sidecarServiceAccountObject" (dict "ctx" . "name" "dfe-keda-shim" "component" "keda-shim") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfe-keda-shim
  labels: &shimLabels
    app.kubernetes.io/name: dfe-keda-shim
    app.kubernetes.io/part-of: {{ .Values.project | quote }}
    app.kubernetes.io/managed-by: "helm"
    app.kubernetes.io/version: {{ .Chart.AppVersion | default "0.0.0" | quote }}
    app.kubernetes.io/component: keda-shim
    dfe.hyperi.io/env: {{ .Values.env | quote }}
    dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
spec:
  replicas: 1
  {{- include "dfe-common.rollout" . | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dfe-keda-shim
  template:
    metadata:
      labels: *shimLabels
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-engine.sidecarServiceAccount" (dict "ctx" . "name" "dfe-keda-shim") }}
      # Service links add a tcp://IP:PORT value per Service under the DFE_ENGINE_ prefix, which collides with the settings
      # this pod reads (DFE_ENGINE_KEDA_SHIM_PORT is an int).
      enableServiceLinks: false
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      # The engine creates the query reader at startup, so until it is Ready this user cannot log in.
      {{- include "dfe-common.waitForEngine" . | nindent 6 }}
      containers:
        - name: keda-shim
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No args: dfe-keda-shim registers one command (keda_shim/cli.py), which Typer collapses into a no-subcommand CLI,
          # so "run" would exit 2.
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          command: ["dfe-keda-shim"]
          ports:
            - name: http
              containerPort: {{ .Values.kedaShim.port }}
          env:
            # The shared signing key, as for the engine and the hunt runner.
            - name: DFE_ENGINE_API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecretName }}
                  key: {{ .Values.auth.jwtSecretKey }}
            # The engine's ClickHouse over the same transport. The shim reads only the pressure gauge and the hunt due-count, so
            # it connects as the query reader.
            {{- include "dfe-engine.clickhouseEnv" . | nindent 12 }}
            {{- $reader := dig "serviceUsers" "queryReader" dict .Values.clickhouse }}
            {{- if or (not $reader.user) (not $reader.passwordSecretName) }}
            {{- fail "clickhouse.serviceUsers.queryReader needs a user and a passwordSecretName: the keda shim connects as its own user, never the admin account" }}
            {{- end }}
            {{- include "dfe-engine.serviceClickhouseAuthEnv" $reader | nindent 12 }}
            - name: DFE_ENGINE_KEDA_SHIM_PORT
              value: {{ .Values.kedaShim.port | quote }}
            # Its account mounts no token, so scalo's logs take the namespace from here.
            {{- include "dfe-common.podNamespaceEnv" . | nindent 12 }}
            {{- with (include "dfe-extras.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; whole stack -> HyperDX
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-keda-shim
          volumeMounts:
            # The rootfs is read-only, so /tmp needs this emptyDir.
            - name: tmp
              mountPath: /tmp
            {{- with (include "dfe-engine.clickhouseCaMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.kedaShim.resources | nindent 12 }}
          # The engine image's Python boot outlasts the liveness window, so liveness is held off until this passes.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with (include "dfe-engine.clickhouseCaVolume" .) }}
        {{- . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: dfe-keda-shim
  labels:
    app.kubernetes.io/name: dfe-keda-shim
    app.kubernetes.io/part-of: {{ .Values.project | quote }}
    app.kubernetes.io/managed-by: "helm"
    app.kubernetes.io/component: keda-shim
    dfe.hyperi.io/env: {{ .Values.env | quote }}
    dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dfe-keda-shim
  ports:
    - name: http
      port: {{ .Values.kedaShim.port }}
      targetPort: http
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.kedaShim") }}
