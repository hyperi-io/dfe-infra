{{- define "dfe-extras.engine.alertDestinationsSecret" -}}
{{- /*
The Secret dfe-engine writes each hunt alert destination into, one key per
destination name holding its URL and enabled flag as JSON (dfe-engine.mirrorSecret).
The engine reads its name from DFE_ENGINE_HUNTS_ALERT_DESTINATIONS_SECRET.

Only while the engine keeps its secrets on its own volume, which no runner pod can
mount: dfe-hunt-runner mounts this Secret where its file provider looks instead.
On a Secrets Manager store the runner reads them there and none of this renders.
*/ -}}
{{- if not (include "dfe-engine.secretsOnAws" .) }}
{{- $name := required "alertDestinations.secretName is empty: the engine writes hunt alert destinations into this Secret, and dfe-hunt-runner mounts it" (dig "secretName" "" (.Values.alertDestinations | default dict)) }}
{{ include "dfe-engine.mirrorSecret" (dict "ctx" . "name" $name) }}
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.alertDestinationsSecret") }}
