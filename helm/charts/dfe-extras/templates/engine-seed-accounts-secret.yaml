{{- define "dfe-extras.engine.seedAccountsSecret" -}}
{{- /*
Stable named local logins, as a Secret the engine reads at startup (dfe-infra #106).

The engine RECONCILES these on every boot -- the configured password and groups
WIN -- so a full teardown+rebuild restores the exact shared team logins unchanged.
See settings.SeedAccount and auth/bootstrap._reconcile_seed_accounts in dfe-engine.

One key, `seed-accounts`: the JSON list DFE_AUTH_LOCAL_SEED_ACCOUNTS wants.

The `admin` account is NOT here -- the deploy mints it into auth.adminSecretName
(engine-admin-secret.yaml, dfe-infra #233).

DEFAULT-OFF: with no seed accounts this template renders nothing, so a vanilla
deploy gets no Secret and no env. The real values live in the gitignored .env /
the deploy-repo overlay, never in tracked values -- this chart ships publicly.
*/ -}}
{{- $sa := .Values.seedAuth -}}
{{- if gt (len $sa.seedAccounts) 0 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sa.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  seed-accounts: {{ toJson $sa.seedAccounts | quote }}
{{- end -}}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.seedAccountsSecret") }}
