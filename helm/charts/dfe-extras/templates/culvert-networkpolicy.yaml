{{- define "dfe-extras.culvert.networkPolicy" -}}
{{- if .Values.networkPolicy.enabled }}
{{- /*
  The culvert pods' whole egress surface, because the pod template carries dfe.hyperi.io/egress-scoped, which takes
  them out of the namespace-wide baseline (docs/deployment/edge-vpn.md). NetworkPolicies are additive, so without
  that label the baseline grants the whole namespace and nothing here narrows it.

  Client traffic is SNATed to the pod address, so what the pod may reach is what a client may reach. culvert's own
  iptables chain (CULVERT_ROUTING_CONTROL_ENABLED, routes.destinations) filters by CIDR inside the pod.

  Ingress carries no client CIDRs: kube-proxy SNATs external traffic to a node address, so an ipBlock would match
  the node. exposure.loadBalancerSourceRanges is the client allow-list. The admin rule below is the one exception:
  it matches a machine on the pod's ethernet side whose packets arrive addressed to an appliance's tunnel address,
  which the listener-port rule above does not admit.
*/}}
{{- $admin := .Values.peers.classes.admin }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        {{- range .Values.listeners }}
        {{- if .exposed }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
        {{- end }}
    # The collector scrapes /metrics; discovery is by pod annotation, so the
    # source is the namespace and the port is this chart's own.
    {{- if .Values.networkPolicy.otelNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.otelNamespace }}
    {{- end }}
    {{- if and $admin.enabled $admin.adminCIDRs }}
    # The reach-back is forwarded, not terminated, so the admitted port is the
    # appliance's own rather than any listener this pod carries.
    - from:
        {{- range $admin.adminCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $admin.reach }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
  egress:
    # The receiver's ingest listeners, and nothing else in its namespace.
    - to:
        - {{- if .Values.dfeNamespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dfeNamespace }}
          {{- end }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.ingest.podLabel }}
      ports:
        {{- range .Values.ingest.ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    # Cluster DNS. The tunnel pushes public resolvers to its clients, so this
    # is the server's own resolution only.
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- $telemetry := .Values.telemetry | default dict }}
    {{- with (include "dfe-extras.otelEndpoint" .) }}
    {{- if and (eq (toString ($telemetry.mode | default "hyperdx")) "receiver") (not $telemetry.receiverEndpoint) }}
    # receiver mode with no receiverEndpoint exports to the receiver's own OTLP port.
    - to:
        - {{- if $.Values.dfeNamespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.dfeNamespace }}
          {{- end }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Values.ingest.podLabel }}
      ports:
        - port: {{ regexReplaceAll "^.*:([0-9]+)$" . "${1}" | int }}
          protocol: TCP
    {{- else }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.otelNamespace }}
      ports:
        - port: {{ $.Values.networkPolicy.otelPort }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    # External PKI or an OIDC issuer outside the cluster: named here because
    # the pods take no baseline egress at all.
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "culvert") "body" "dfe-extras.culvert.networkPolicy") }}
