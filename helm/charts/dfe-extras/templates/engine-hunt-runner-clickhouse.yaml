{{- define "dfe-extras.engine.huntRunnerClickhouse" -}}
{{- /*
The hunt runner's ClickHouse password, as a Secret both the engine and the
runner read.

The engine creates dfe_hunt_runner, but a password it mints lands in its own
secrets store on its own volume, which the runner's pod cannot see. So the
password comes from here: the engine adopts it (DFE_CLICKHOUSE_HUNT_RUNNER_PASSWORD)
and re-asserts it on the user every reconcile, and the runner connects with it.

Rendered while either pod reads it: the runner while huntRunner.enabled, the
engine unless secrets.hunt-runner.enabled is false, since its reference is required.
*/ -}}
{{- $engineReads := ne (toString (dig "hunt-runner" "enabled" true (.Values.secrets | default dict))) "false" }}
{{- if or .Values.huntRunner.enabled $engineReads }}
{{- $hr := .Values.huntRunner.clickhouse -}}
{{- if or (not $hr.user) (not $hr.passwordSecretName) }}
{{- fail "huntRunner.clickhouse.user and huntRunner.clickhouse.passwordSecretName are required: the hunt runner connects to ClickHouse as its own user, never the admin account" }}
{{- end }}
{{- if or $hr.password $hr.passwordSecretCreate }}
{{- include "dfe-engine.clickhousePasswordSecret" (dict "ctx" . "name" $hr.passwordSecretName "key" $hr.passwordSecretKey "password" $hr.password) }}
{{- end }}
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.huntRunnerClickhouse") }}
