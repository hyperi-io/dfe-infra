{{- define "dfe-extras.engine.adminSecret" -}}
{{- /*
The two credentials the DEPLOY mints: the `admin` login and the `breakglass`
recovery admin (dfe-infra #233, dfe-engine #300).

ONE Secret per credential, minted IN-CLUSTER by ESO's Password generator with
refreshPolicy CreatedOnce -- same mechanism and same reasoning as the JWT
signing key next door (#225). Argo renders with `helm template`, so a
template-minted password is a NEW password on every sync; CreatedOnce writes the
value once and never rotates it under a live session.

This replaces the two Secrets that each claimed to be the admin password
(`dfe-engine-admin`, hand-made and unowned, and the seed-accounts
`admin-password` key). The named seed accounts stay where they are.

`changeme` is never rendered here, and a deployment that mints nothing is refused
at render time outside a dev posture.
*/ -}}
{{- $a := .Values.auth -}}
{{- $dev := include "dfe-engine.isDevPosture" . -}}
{{- if .Values.seedAuth.adminPassword }}
{{- fail "seedAuth.adminPassword is gone: the deploy mints the admin password (auth.adminSecretCreate) and auth.adminPassword pins a known one" }}
{{- end }}
{{- if and (not $a.adminSecretName) (not $dev) }}
{{- fail "auth.adminSecretName is empty but env is not a dev posture: the deploy must mint the admin password, and the engine refuses to start on the shipped default" }}
{{- end }}
{{- if and $a.adminPassword (not $a.adminSecretName) }}
{{- fail "auth.adminPassword is set but auth.adminSecretName is empty: name the Secret the password is delivered in" }}
{{- end }}
{{- /* Trimmed before comparing, the way the engine compares it. */ -}}
{{- if and (eq (default "" $a.adminPassword | trim) "changeme") (not $dev) }}
{{- fail "auth.adminPassword is the shipped default and env is not a dev posture: leave it empty so ESO mints one, or set a real password" }}
{{- end }}
{{- if and $a.adminSecretName $a.adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $a.adminSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # keep: the password outlives an uninstall, so a reinstall does not lock the
    # operator out of the account their people already use.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $a.adminSecretKey }}: {{ $a.adminPassword | quote }}
{{- else if and $a.adminSecretName $a.adminSecretCreate }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $a.adminSecretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 24
  digits: 4
  symbols: 0          # alphanumeric -- the operator retypes this into a login form
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $a.adminSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # The Secret carries ESO's ownerReference, so deleting this ExternalSecret by
    # hand garbage-collects the password with it.
    helm.sh/resource-policy: keep
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ $a.adminSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ $a.adminSecretKey }}: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $a.adminSecretName }}-gen
{{- end }}
{{- if and $a.breakglassSecretName $a.breakglassPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $a.breakglassSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $a.breakglassSecretKey }}: {{ $a.breakglassPassword | quote }}
{{- else if and $a.breakglassSecretName $a.breakglassSecretCreate }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $a.breakglassSecretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 24
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $a.breakglassSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # The engine hashes this ONCE into the deploy repo's governance settings; a
    # value that moved afterwards would leave the operator holding a password
    # that no longer matches the committed hash.
    helm.sh/resource-policy: keep
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ $a.breakglassSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ $a.breakglassSecretKey }}: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $a.breakglassSecretName }}-gen
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.adminSecret") }}
