{{- define "dfe-extras.ui.nextauth" -}}
{{- if .Values.config.nextauthSecretName }}
{{- if .Values.config.secretStoreName }}
{{/*
dfe-ui's NextAuth signing secret, read from the deployer's secrets store.

Opt-in: set config.secretStoreName. The key must match tf-secrets
`seed_ui_nextauth` (<project>/<env>/ui/nextauth), RELATIVE to the `secret` mount
the store pins itself. The store is what swaps for cloud -- point the
ClusterSecretStore at aws/gcp/azure and nothing here changes.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.config.nextauthSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.config.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.config.nextauthSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/ui/nextauth
        property: secret
{{- else }}
{{/*
dfe-ui's NextAuth signing secret, generated in-cluster.

The default, because requiring a secrets store makes the UI undeployable on a bare cluster: the ExternalSecret
reports "ClusterSecretStore is not ready" forever, the pod sits in CreateContainerConfigError and next-auth
refuses to start (NO_SECRET). Nothing outside the cluster needs the value, so it is generated once, as
docs/deployment/README.md, Secrets store, describes.
*/}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.config.nextauthSecretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 64
  digits: 10
  symbols: 0          # alphanumeric -- avoids escaping in env and URL contexts
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.config.nextauthSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ .Values.config.nextauthSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.config.nextauthSecretName }}-gen
{{- end }}
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-ui") "body" "dfe-extras.ui.nextauth") }}
