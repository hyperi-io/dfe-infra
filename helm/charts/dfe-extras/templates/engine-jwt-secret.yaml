{{- define "dfe-extras.engine.jwtSecret" -}}
{{- /*
The JWT signing key, as a Secret every dfe-engine pod can read.

The engine mints a key at startup into its own store: the PVC dfe-engine-config, or Secrets Manager on AWS.
dfe-hunt-runner and dfe-keda-shim are separate pods that read neither, so they would fall back to the dev
placeholder, which DFESettings rejects under env=production with auth enabled. Both would crashloop while the
engine stays up.

So the key is generated in-cluster by ESO's Password generator with refreshPolicy CreatedOnce, and the template
mints nothing (docs/deployment/README.md, Secrets store).
*/ -}}
{{- $name := .Values.auth.jwtSecretName -}}
{{- $key := .Values.auth.jwtSecretKey -}}
{{- if .Values.auth.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # keep: the key outlives an uninstall, because a reinstall that minted another would log every user out silently.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $key }}: {{ .Values.auth.jwtSecret | quote }}
{{- else if .Values.auth.jwtSecretCreate }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 64
  digits: 8
  symbols: 0          # alphanumeric -- avoids escaping in env and header contexts
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # The Secret carries ESO's ownerReference, so deleting this ExternalSecret by hand garbage-collects the key with it.
    # keep is what protects it.
    helm.sh/resource-policy: keep
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ $key }}: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}-gen
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-engine") "body" "dfe-extras.engine.jwtSecret") }}
