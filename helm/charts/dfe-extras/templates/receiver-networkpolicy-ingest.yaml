{{- define "dfe-extras.receiver.networkPolicyIngest" -}}
{{- $ingest := .Values.exposure.groups.ingest | default dict }}
{{- if and (eq (toString $ingest.enabled) "true") (eq (toString $ingest.door) "tunnel") .Values.exposure.networkPolicy.enabled }}
{{- $exposed := list }}
{{- range .Values.listeners }}
  {{- if .exposed }}
    {{- $exposed = append $exposed . }}
  {{- end }}
{{- end }}
{{- if gt (len $exposed) 0 }}
{{- /*
  The namespace baseline (network-policies chart, dfe-ingress-policy) selects
  every pod and admits only the gateway, KEDA, otel and the other DFE
  namespaces, so tunnelled ingest is dropped on a policy-enforcing CNI without
  this one. NetworkPolicies are additive, so it adds the exposed ingest ports
  without touching that baseline.

  It admits the tunnel pods, by label. They SNAT a client onto the pod network,
  so selecting them is exact and needs no addressing, and it keeps the receiver
  reachable ONLY through the tunnel on this door.

  The load balancer door's policy of the same name is
  argocd/values/apps/dfe-receiver's, rendered from the ports its load balancers
  serve.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dfe-common.fullname" . }}-ingest
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    dfe.hyperi.io/exposure: tunnel
spec:
  podSelector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- range $exposed }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.exposure.vpn.podLabel }}
{{- end }}
{{- end }}
{{- end -}}
{{- include "dfe-extras.render" (dict "root" . "charts" (list "dfe-receiver") "body" "dfe-extras.receiver.networkPolicyIngest") }}
