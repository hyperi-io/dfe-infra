# The component whose DFE-only objects render: its deploy.service, or dfe-hyperdx
# for hyperdx. Empty, or a component with no DFE-only objects (dfe-fetcher,
# dfe-transform-elastic), renders nothing, so every component's Application can
# carry this chart.
chartName: ""

# This chart's own settings. Every other key is a value the component reads: the
# same layers reach this chart and the component's thin chart, so both read a key
# at one path.
extras:
  # The transport each profile's values are built for. dfe-common.transport derives
  # the one a deployment runs from kafka.mode, and the render fails where the two
  # disagree. A profile not listed here is not checked.
  transports:
    slim: direct
    single: bus
    scale: bus
    mesh: direct

  # The version each component's objects are labelled with, and the engine image
  # tag the hunt runner and keda shim run (image.tag empty takes it). Each is
  # versions.yaml apps.<component> (content.dfe-hyperdx), checked by
  # scripts/check_versions_drift.py.
  appVersions:
    dfe-engine: "v1.22.63"
    dfe-ui: "v1.7.28"
    dfe-receiver: "v1.15.56"
    dfe-loader: "v1.18.57"
    dfe-archiver: "v1.7.38"
    dfe-fetcher: "v1.4.42"
    dfe-transform-vrl: "v1.1.37"
    dfe-transform-vector: "v1.0.54"
    dfe-transform-elastic: "v1.1.17"
    culvert: "v2.1.27"
    dfe-hyperdx: "v0.3.11"

  # Each component's defaults for the keys its objects read. A layer that sets a
  # key wins, false and empty included.
  defaults:
    dfe-receiver:
      project: dfe
      component: receiver
      env: local
      cloud: local
      # The tunnel door's ingest NetworkPolicy opens the exposed ones, and the
      # gateway door refuses an exposed listener other than http. A layer
      # replaces the whole list. The receiver binds nothing on 8443, so no entry
      # opens it.
      listeners:
        - { name: http, port: 8080, protocol: TCP, exposed: true }
        - { name: pushgrpc, port: 6000, protocol: TCP, exposed: false, appProtocol: kubernetes.io/h2c }
      # The door itself is exposure.groups.ingest, which argocd/values/common.yaml
      # supplies in every cascade; this default, no public door, is what a render
      # without that file gets.
      exposure:
        groups:
          ingest:
            enabled: false
            allow: []
            deny: []
            door: tunnel
        vpn:
          # Selector label of the tunnel pods the tunnel door's policy admits.
          podLabel: dfe-culvert
        networkPolicy:
          enabled: true
      kafka:
        mode: ""
        bootstrapServers: ""
        securityProtocol: ""
        messageMaxBytes: ""
      dlq:
        topic: dfe_receiver_dlq
        mode: kafka_only
    dfe-loader:
      project: dfe
      component: loader
      env: local
      cloud: local
      kafka:
        mode: ""
        bootstrapServers: ""
        securityProtocol: ""
      clickhouse:
        host: ""
        port: 8123
        database: dfe
        # argocd/values/common.yaml's clickhouse.serviceUsers.loader.
        serviceUsers:
          loader:
            user: dfe_loader
            passwordSecretName: loader-clickhouse
            passwordSecretKey: password
        tls:
          enabled: false
          port: 8443
          verify: true
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      dlq:
        topic: dfe_loader_dlq
        mode: kafka_only
      service:
        grpcPort: 6000
    dfe-archiver:
      project: dfe
      component: archiver
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-vrl:
      project: dfe
      component: transform-vrl
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-vector:
      project: dfe
      component: transform-vector
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-elastic:
      project: dfe
      component: transform-elastic
      env: local
      cloud: local
      service:
        pushPort: 6000
    culvert:
      project: dfe
      component: culvert
      env: local
      cloud: local
      # The tunnel policy admits the exposed ones. A layer replaces the whole list.
      listeners:
        - { name: wireguard, port: 51820, protocol: UDP, exposed: true, nodePort: 31820 }
        - { name: openvpn-udp, port: 1194, protocol: UDP, exposed: true, nodePort: 31194 }
        - { name: metrics, port: 9090, protocol: TCP, exposed: false }
      peers:
        classes:
          appliance:
            isolation: true
          admin:
            enabled: false
            # Where an admin reaches appliances from, on the pod's ethernet side.
            adminCIDRs: []
            peerCIDR: ""
            # The appliance ports the admin rule admits.
            reach:
              - 22
              - 443
      # The receiver pods and ports a tunnelled client may reach: its http ingest
      # listener, the one the receiver's ingest NetworkPolicy admits the tunnel on.
      ingest:
        podLabel: dfe-receiver
        ports:
          - { port: 8080, protocol: TCP }
      # The tunnel pods' whole egress surface: the receiver, DNS and telemetry. Set
      # enabled false in a layer to drop it; never true, which also switches on the
      # culvert chart's own policy of the same name.
      networkPolicy:
        enabled: true
        otelNamespace: otel
        otelPort: 4317
        # Extra egress rules in NetworkPolicy's own shape: an external PKI or OIDC issuer.
        extraEgress: []
      otel:
        endpoint: ""
      # The dfe-culvert-env ConfigMap and the refusals read these. One replica only:
      # WireGuard mints its server key in the pod.
      replicas: 1
      vpn:
        clientCIDR: "100.64.0.0/10"
        serverCN: ""
        fullTunnel: false
        dns:
          - "1.1.1.1"
          - "1.0.0.1"
        httpsTunnel: false
        oidc:
          enabled: false
          issuer: ""
          clientId: ""
          existingSecret: ""
          validateGroups: ""
      # Unset destinations are the networkModel service range (argocd/values/common.yaml).
      routes:
        destinations: ~
      pki:
        mode: local
        existingSecret: ""
        mountPath: /etc/vpn/pki-external
      exposure:
        serviceType: LoadBalancer
        loadBalancerSourceRanges: []
    dfe-ui:
      project: dfe
      component: ui
      env: local
      cloud: local
      config:
        nextauthSecretName: dfe-ui-nextauth
        # A ClusterSecretStore seeded with <project>/<env>/ui/nextauth. Empty
        # generates the secret in-cluster, so the UI deploys on a bare cluster.
        secretStoreName: ""
    dfe-hyperdx:
      project: dfe
      component: hyperdx
      env: local
      cloud: local
      usageStats:
        enabled: false
      clickhouse:
        host: dfe-clickhouse.clickhouse.svc.cluster.local
        port: 8123
        tls:
          enabled: false
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      mongodb:
        # $(MONGO_PASSWORD) is kubelet-expanded, so MONGO_URI stays in the thin chart's env.
        uri: "mongodb://hyperdx:$(MONGO_PASSWORD)@documentdb-service-dfe-documentdb.cnpg.svc.cluster.local:10260/hyperdx?tls=true&tlsCAFile=/etc/dfe/documentdb-ca/ca.crt&authMechanism=SCRAM-SHA-256"
        passwordSecretName: dfe-documentdb-credentials
        passwordSecretKey: password
      dfeAuth:
        enabled: true
        mode: oidc-proxy            # oidc-proxy | header-dev
        engineService: dfe-engine
        engineNamespace: ""         # empty -> this release's namespace
        enginePort: 8000
        engineJwksUrl: ""           # set to bypass the derivation entirely
        engineIssuer: ""
        headerEmail: x-oidc-subject
        headerGroups: x-oidc-groups
        defaultTeam: dfe
      sessionSecret:
        name: dfe-hyperdx-session
        key: session-secret
        create: true
      tokenEncryption:
        name: dfe-hyperdx-token-encryption
        key: token-encryption-key
        create: true
      dashboards:
        enabled: true
        mountPath: /etc/hyperdx/dashboards
        allTeams: true
        requireRefs: true
      localAuthPages:
        enabled: false
      frontendUrl: ""
    dfe-engine:
      project: dfe
      component: engine
      env: local
      cloud: local
      tenantIsolation:
        enabled: true
      e2eServer: false
      # The hunt runner's and keda shim's image: the engine's own pin.
      image:
        repository: ""
        tag: ""
        digest: "sha256:4b32bccfae4f1443e144843e86a31ad8878554a92aeb54a551d4b11d33451064"
        pullPolicy: IfNotPresent
      stackVersion: ""
      profile: ""
      uiVersion: "v1.7.28"           # == versions.yaml apps.dfe-ui
      kafka:
        mode: ""
        bootstrapServers: ""
        saslSecretName: dfe-kafka-user
        securityProtocol: ""
        provider: ""
        messageMaxBytes: ""
        topicReplicationFactor: ""
        topicRetentionMs: ""
      # The refs the engine's content init containers pull belong to the thin
      # chart's values.
      content:
        mountPath: /etc/dfe-engine/content
        entries:
          - { name: dfe-receiver-contract, kind: emit, role: contract, app: dfe-receiver }
          - { name: dfe-loader-contract, kind: emit, role: contract, app: dfe-loader }
          - { name: dfe-archiver-contract, kind: emit, role: contract, app: dfe-archiver }
          - { name: dfe-fetcher-contract, kind: emit, role: contract, app: dfe-fetcher }
          - { name: dfe-transform-vrl-contract, kind: emit, role: contract, app: dfe-transform-vrl }
          - { name: dfe-transform-vector-contract, kind: emit, role: contract, app: dfe-transform-vector }
          - { name: dfe-transform-elastic-contract, kind: emit, role: contract, app: dfe-transform-elastic }
      config:
        mountPath: /config
      clickhouse:
        host: ""
        port: 8123
        database: dfe
        # Each app's own user and the Secret its password is minted into, beside
        # the engine (argocd/values/common.yaml's clickhouse.serviceUsers).
        # passwordSecretCreate false hands a Secret to the deployment, under the
        # same name and key, and mints nothing.
        serviceUsers:
          loader:
            user: dfe_loader
            passwordSecretName: loader-clickhouse
            passwordSecretKey: password
          queryReader:
            user: dfe_query_reader
            passwordSecretName: query-reader-clickhouse
            passwordSecretKey: password
          otelWriter:
            user: dfe_otel_writer
            passwordSecretName: otel-writer-clickhouse
            passwordSecretKey: password
        tls:
          enabled: false
          port: 8443
          verify: true
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      retention:
        defaultTtlDays: 90
      otel:
        endpoint: ""
      gitops:
        enabled: true
        repoUrl: "http://dfe-forgejo.forgejo.svc.cluster.local:3000/dfe-admin/deploy.git"
        branch: main
        localPath: /var/run/dfe/deploy-repo
        credentialsSecret: dfe-deploy-repo-auth   # keys: username, password
      hyperdx:
        enabled: true
        service: dfe-hyperdx
        namespace: ""               # empty -> this release's namespace
        apiPort: 8000
        baseUrl: ""                 # set to bypass the derivation entirely
      auth:
        jwtSecretName: dfe-engine-jwt
        jwtSecretKey: jwt-secret
        jwtSecretCreate: true
        jwtSecret: ""
        trustProxyHeaders: false
        proxyProvider: ""
        apiKeyDefaultTtlDays: ""
        loginThrottle:
          enabled: ""
          usernameFailures: ""
          clientFailures: ""
          maxDelaySeconds: ""
        adminSecretName: dfe-engine-admin
        adminSecretKey: admin-password
        adminSecretCreate: true
        adminPassword: ""
        adminSecretPath: ""
        breakglassSecretName: dfe-engine-breakglass
        breakglassSecretKey: breakglass-password
        breakglassSecretCreate: true
        breakglassPassword: ""
      seedAuth:
        secretName: dfe-engine-seed-accounts
        seedAccounts: []
        adminPassword: ""
      oidc:
        enabled: false
        providers: []
      api:
        forwardedAllowIps: ""
        jwtExpireMinutes: ""
        maxSessionMinutes: ""
        docsEnabled: ""
      # The Secret the engine writes dfe-receiver's bearer tokens into off a
      # Secrets Manager store (argocd/values/common.yaml's ingestBearer).
      ingestBearer:
        secretName: dfe-ingest-bearer-tokens
      networkModel:
        podCIDR: ""
      authConfig:
        providersConfigMap: ""
        groupsConfigMap: ""
        caBundleConfigMap: ""
      kedaShim:
        enabled: true
        port: 8080
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      huntRunner:
        enabled: true
        poll: 15                    # seconds between runner ticks
        cap: 8                      # global cap on concurrent hunt runs
        clickhouse:
          user: dfe_hunt_runner
          passwordSecretName: hunt-runner-clickhouse
          passwordSecretKey: password
          passwordSecretCreate: true
          password: ""
        autoscaling:
          enabled: false
          minReplicaCount: 1
          maxReplicaCount: 5
          targetBacklog: 10         # due hunts per pod
          cooldownPeriod: 300
          pollingInterval: 30
          shimAddress: ""
        gitSync:
          enabled: true
          image:
            repository: registry.k8s.io/git-sync/git-sync
            tag: "v4.8.0"           # == versions.yaml services.git-sync
            digest: "sha256:a20644562fba94773e594885cb001aadb5a3172175f13ac1215e5b2033c9200e"
            pullPolicy: IfNotPresent
          mountPath: /deploy-repo
          link: current
          homePath: /git-sync-home
          period: 30s
          maxFailures: -1
          initialMaxFailures: 3
          huntsPath: config/hunts
          rulesPath: config/rules
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      waitForEngine:
        enabled: true
        service: dfe-engine
        namespace: ""
        port: 8000
        timeoutSeconds: 600
        intervalSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      nodeScheduling: {}
