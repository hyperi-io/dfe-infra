# The component whose DFE-only objects render: its deploy.service, or dfe-hyperdx. Empty, or a component with none
# (dfe-fetcher, dfe-transform-elastic), renders nothing.
chartName: ""

# This chart's own settings. Every other key is one the component reads, at the same path.
extras:
  # The transport each profile is built for. The render fails where kafka.mode disagrees. An unlisted profile is not
  # checked.
  transports:
    slim: direct
    single: bus
    scale: bus
    mesh: direct

  # The version each component's objects are labelled with, and the engine image tag the hunt runner and keda shim run
  # (image.tag empty takes it). Each is versions.yaml apps.<component>, checked by scripts/check_versions_drift.py.
  appVersions:
    dfe-engine: "v1.22.94-rc.8"
    dfe-ui: "v1.7.47-rc.3"
    dfe-receiver: "v1.15.72-rc.5"
    dfe-loader: "v1.18.76-rc.7"
    dfe-archiver: "v1.7.54-rc.6"
    dfe-fetcher: "v1.4.61-rc.6"
    dfe-transform-vrl: "v1.1.51-rc.5"
    dfe-transform-vector: "v1.0.68-rc.5"
    dfe-transform-elastic: "v1.1.35-rc.5"
    culvert: "v2.1.32"
    dfe-hyperdx: "v0.3.28-rc.3"

  # Each component's defaults. A layer that sets a key wins, false and empty included.
  defaults:
    dfe-receiver:
      project: dfe
      component: receiver
      env: local
      cloud: local
      # The tunnel door's ingest NetworkPolicy opens the exposed ones, and the gateway door refuses an exposed listener
      # other than http. A layer replaces the whole list.
      listeners:
        - { name: http, port: 8080, protocol: TCP, exposed: true }
        - { name: pushgrpc, port: 6000, protocol: TCP, exposed: false, appProtocol: kubernetes.io/h2c }
      # The door is exposure.groups.ingest (argocd/values/common.yaml). Without that file there is no public door.
      exposure:
        groups:
          ingest:
            enabled: false
            allow: []
            deny: []
            door: tunnel
        vpn:
          podLabel: dfe-culvert
          # The tunnel's own privileged namespace (appsets/layer2-edge.yaml). Empty selects the receiver's own.
          namespace: culvert
        networkPolicy:
          enabled: true
      # The DFE-wide record cap, in bytes.
      maxBodySize: 8000000
      kafka:
        mode: ""
        bootstrapServers: ""
        securityProtocol: ""
        messageMaxBytes: ""
      dlq:
        topic: dfe_receiver_dlq
        mode: kafka_only
    dfe-loader:
      project: dfe
      component: loader
      env: local
      cloud: local
      kafka:
        mode: ""
        bootstrapServers: ""
        securityProtocol: ""
      clickhouse:
        host: ""
        port: 8123
        database: dfe
        # argocd/values/common.yaml's clickhouse.serviceUsers.loader.
        serviceUsers:
          loader:
            user: dfe_loader
            passwordSecretName: loader-clickhouse
            passwordSecretKey: password
        tls:
          enabled: false
          port: 8443
          verify: true
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      dlq:
        topic: dfe_loader_dlq
        mode: kafka_only
      service:
        grpcPort: 6000
    dfe-archiver:
      project: dfe
      component: archiver
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-vrl:
      project: dfe
      component: transform-vrl
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-vector:
      project: dfe
      component: transform-vector
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-elastic:
      project: dfe
      component: transform-elastic
      env: local
      cloud: local
      service:
        pushPort: 6000
    culvert:
      project: dfe
      component: culvert
      env: local
      cloud: local
      # The receiver's namespace, passed by appsets/layer2-edge.yaml. Empty selects the tunnel's own.
      dfeNamespace: ""
      # The tunnel policy admits the exposed ones. A layer replaces the whole list.
      listeners:
        - { name: wireguard, port: 51820, protocol: UDP, exposed: true, nodePort: 31820 }
        - { name: openvpn-udp, port: 1194, protocol: UDP, exposed: true, nodePort: 31194 }
        - { name: metrics, port: 9090, protocol: TCP, exposed: false }
      peers:
        classes:
          appliance:
            isolation: true
          admin:
            enabled: false
            # Where an admin reaches appliances from, on the pod's ethernet side.
            adminCIDRs: []
            peerCIDR: ""
            reach:
              - 22
              - 443
      # The receiver's http ingest listener, which a tunnelled client reaches.
      ingest:
        podLabel: dfe-receiver
        ports:
          - { port: 8080, protocol: TCP }
      # The tunnel pods' whole egress surface (docs/deployment/edge-vpn.md). Set enabled false in a layer to drop it, never
      # true, which also switches on the culvert chart's own policy of the same name.
      networkPolicy:
        enabled: true
        otelNamespace: otel
        otelPort: 4317
        # Extra egress rules in NetworkPolicy's own shape: an external PKI or OIDC issuer.
        extraEgress: []
      otel:
        endpoint: ""
      # One replica only: WireGuard mints its server key in the pod.
      replicas: 1
      vpn:
        clientCIDR: "100.64.0.0/10"
        serverCN: ""
        fullTunnel: false
        dns:
          - "1.1.1.1"
          - "1.0.0.1"
        httpsTunnel: false
        oidc:
          enabled: false
          issuer: ""
          clientId: ""
          existingSecret: ""
          validateGroups: ""
      # Unset destinations are the networkModel service range (argocd/values/common.yaml).
      # allowedPorts scopes each destination to <port>/<tcp|udp> entries. Unset is the receiver's ingest ports (ingest.ports)
      # plus DNS on 53, which is all the pod's NetworkPolicy opens for a client. An empty list opens every port.
      routes:
        destinations: ~
        allowedPorts: ~
      pki:
        mode: local
        existingSecret: ""
        mountPath: /etc/vpn/pki-external
      exposure:
        serviceType: LoadBalancer
        loadBalancerSourceRanges: []
    dfe-ui:
      project: dfe
      component: ui
      env: local
      cloud: local
      config:
        nextauthSecretName: dfe-ui-nextauth
        # A ClusterSecretStore seeded with <project>/<env>/ui/nextauth. Empty generates the secret in-cluster.
        secretStoreName: ""
    dfe-hyperdx:
      project: dfe
      component: hyperdx
      env: local
      cloud: local
      usageStats:
        enabled: false
      clickhouse:
        host: dfe-clickhouse.clickhouse.svc.cluster.local
        port: 8123
        tls:
          enabled: false
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      mongodb:
        # $(MONGO_PASSWORD) is kubelet-expanded, so MONGO_URI stays in the thin chart's env.
        uri: "mongodb://hyperdx:$(MONGO_PASSWORD)@documentdb-service-dfe-documentdb.cnpg.svc.cluster.local:10260/hyperdx?tls=true&tlsCAFile=/etc/dfe/documentdb-ca/ca.crt&authMechanism=SCRAM-SHA-256"
        passwordSecretName: dfe-documentdb-credentials
        passwordSecretKey: password
      dfeAuth:
        enabled: true
        mode: oidc-proxy            # oidc-proxy | header-dev
        engineService: dfe-engine
        engineNamespace: ""         # empty -> this release's namespace
        enginePort: 8000
        engineJwksUrl: ""           # set to bypass the derivation entirely
        engineIssuer: ""
        headerEmail: x-oidc-subject
        headerGroups: x-oidc-groups
        defaultTeam: dfe
      sessionSecret:
        name: dfe-hyperdx-session
        key: session-secret
        create: true
      tokenEncryption:
        name: dfe-hyperdx-token-encryption
        key: token-encryption-key
        create: true
      dashboards:
        enabled: true
        mountPath: /etc/hyperdx/dashboards
        allTeams: true
        requireRefs: true
      localAuthPages:
        enabled: false
      frontendUrl: ""
    dfe-engine:
      project: dfe
      component: engine
      env: local
      cloud: local
      tenantIsolation:
        enabled: true
      e2eServer: false
      # The hunt runner's and keda shim's image: the engine's own pin.
      image:
        repository: ""
        tag: ""
        digest: "sha256:20953163ba109dfacc70f85a7fbc19257f50154294d2b3cdde8cabed0b232776"
        pullPolicy: IfNotPresent
      stackVersion: ""
      profile: ""
      uiVersion: "v1.7.47-rc.3"           # == versions.yaml apps.dfe-ui
      kafka:
        mode: ""
        bootstrapServers: ""
        saslSecretName: dfe-kafka-user
        securityProtocol: ""
        provider: ""
        messageMaxBytes: ""
        topicReplicationFactor: ""
        topicRetentionMs: ""
      # The refs the engine's content init containers pull belong to the thin
      # chart's values.
      content:
        mountPath: /etc/dfe-engine/content
        entries:
          - { name: dfe-receiver-contract, kind: emit, role: contract, app: dfe-receiver }
          - { name: dfe-loader-contract, kind: emit, role: contract, app: dfe-loader }
          - { name: dfe-archiver-contract, kind: emit, role: contract, app: dfe-archiver }
          - { name: dfe-fetcher-contract, kind: emit, role: contract, app: dfe-fetcher }
          - { name: dfe-transform-vrl-contract, kind: emit, role: contract, app: dfe-transform-vrl }
          - { name: dfe-transform-vector-contract, kind: emit, role: contract, app: dfe-transform-vector }
          - { name: dfe-transform-elastic-contract, kind: emit, role: contract, app: dfe-transform-elastic }
      config:
        mountPath: /config
      clickhouse:
        host: ""
        port: 8123
        database: dfe
        # Each app's user and the Secret its password is minted into, beside the engine (docs/clickhouse-identity.md, and
        # argocd/values/common.yaml's clickhouse.serviceUsers). passwordSecretCreate false hands a Secret to the deployment
        # under the same name and key and mints nothing.
        serviceUsers:
          loader:
            user: dfe_loader
            passwordSecretName: loader-clickhouse
            passwordSecretKey: password
          queryReader:
            user: dfe_query_reader
            passwordSecretName: query-reader-clickhouse
            passwordSecretKey: password
          otelWriter:
            user: dfe_otel_writer
            passwordSecretName: otel-writer-clickhouse
            passwordSecretKey: password
        tls:
          enabled: false
          port: 8443
          verify: true
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      retention:
        defaultTtlDays: 90
      otel:
        endpoint: ""
      gitops:
        enabled: true
        repoUrl: "http://dfe-forgejo.forgejo.svc.cluster.local:3000/dfe-admin/deploy.git"
        branch: main
        localPath: /var/run/dfe/deploy-repo
        credentialsSecret: dfe-deploy-repo-auth   # keys: username, password
      hyperdx:
        enabled: true
        service: dfe-hyperdx
        namespace: ""               # empty -> this release's namespace
        apiPort: 8000
        baseUrl: ""                 # set to bypass the derivation entirely
      auth:
        jwtSecretName: dfe-engine-jwt
        jwtSecretKey: jwt-secret
        jwtSecretCreate: true
        jwtSecret: ""
        trustProxyHeaders: false
        proxyProvider: ""
        apiKeyDefaultTtlDays: ""
        loginThrottle:
          enabled: ""
          usernameFailures: ""
          clientFailures: ""
          maxDelaySeconds: ""
        adminSecretName: dfe-engine-admin
        adminSecretKey: admin-password
        adminSecretCreate: true
        adminPassword: ""
        adminSecretPath: ""
        breakglassSecretName: dfe-engine-breakglass
        breakglassSecretKey: breakglass-password
        breakglassSecretCreate: true
        breakglassPassword: ""
      seedAuth:
        secretName: dfe-engine-seed-accounts
        seedAccounts: []
        adminPassword: ""
      oidc:
        enabled: false
        providers: []
      api:
        forwardedAllowIps: ""
        jwtExpireMinutes: ""
        maxSessionMinutes: ""
        docsEnabled: ""
      # The Secret the engine writes dfe-receiver's bearer tokens into off a Secrets Manager store (common.yaml's
      # ingestBearer).
      ingestBearer:
        secretName: dfe-ingest-bearer-tokens
      # The Secret the engine mirrors hunt alert destinations into off a Secrets Manager store (common.yaml's
      # alertDestinations).
      alertDestinations:
        secretName: dfe-alert-destinations
      networkModel:
        podCIDR: ""
      authConfig:
        providersConfigMap: ""
        groupsConfigMap: ""
        caBundleConfigMap: ""
      kedaShim:
        enabled: true
        port: 8080
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      huntRunner:
        enabled: true
        poll: 15                    # seconds between runner ticks
        cap: 8                      # global cap on concurrent hunt runs
        clickhouse:
          user: dfe_hunt_runner
          passwordSecretName: hunt-runner-clickhouse
          passwordSecretKey: password
          passwordSecretCreate: true
          password: ""
        autoscaling:
          enabled: false
          minReplicaCount: 1
          maxReplicaCount: 5
          targetBacklog: 10         # due hunts per pod
          cooldownPeriod: 300
          pollingInterval: 30
          shimAddress: ""
        # Hunt schedule smoothing, beta and off by default (docs/autoscaling.md).
        # An empty tunable takes the engine's default.
        smoothing:
          enabled: false
          cycleSeconds: ""
          bucketSeconds: ""
          windowDays: ""
          costQuantile: ""
          maxStepFraction: ""
          hysteresis: ""
          cooldownCycles: ""
          weightMemory: ""
          memoryCapBytes: ""
          horizonMaxSeconds: ""
        # Hunt auto-disable (docs/autoscaling.md), read by the hunt runner only.
        # Empty means the engine's default, which is on, so nothing renders until set.
        autodisable:
          enabled: ""
          failures: ""
          windowSeconds: ""
        gitSync:
          enabled: true
          image:
            repository: registry.k8s.io/git-sync/git-sync
            tag: "v4.8.0"           # == versions.yaml services.git-sync
            digest: "sha256:a20644562fba94773e594885cb001aadb5a3172175f13ac1215e5b2033c9200e"
            pullPolicy: IfNotPresent
          mountPath: /deploy-repo
          link: current
          homePath: /git-sync-home
          period: 30s
          maxFailures: -1
          initialMaxFailures: 3
          huntsPath: config/hunts
          rulesPath: config/rules
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      waitForEngine:
        enabled: true
        service: dfe-engine
        namespace: ""
        port: 8000
        timeoutSeconds: 600
        intervalSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      nodeScheduling: {}
