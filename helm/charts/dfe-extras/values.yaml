# The component whose DFE-only objects render: its deploy.service, or dfe-hyperdx
# for hyperdx. Empty, or a component with no DFE-only objects (dfe-fetcher,
# dfe-transform-elastic), renders nothing, so every component's Application can
# carry this chart.
chartName: ""

# This chart's own settings. Every other key is a value the component reads: the
# same layers reach this chart and the component's thin chart, so a key keeps the
# path the 2.2.0 component chart gave it.
extras:
  # The transport each profile's values are built for. dfe-common.transport derives
  # the one a deployment runs from kafka.mode, and the render fails where the two
  # disagree. A profile not listed here is not checked.
  transports:
    slim: direct
    single: bus
    scale: bus
    mesh: direct

  # The version each component's objects are labelled with, and the engine image
  # tag the hunt runner and keda shim run (image.tag empty takes it). Each is
  # versions.yaml apps.<component> (content.dfe-hyperdx), checked by
  # scripts/check_versions_drift.py.
  appVersions:
    dfe-engine: "v1.22.14"
    dfe-ui: "v1.7.6"
    dfe-receiver: "v1.15.42"
    dfe-loader: "v1.18.46"
    dfe-archiver: "v1.7.28"
    dfe-fetcher: "v1.4.32"
    dfe-transform-vrl: "v1.1.30"
    dfe-transform-vector: "v1.0.45"
    dfe-transform-elastic: "v1.1.9"
    culvert: "v2.1.17"
    dfe-hyperdx: "v0.2.8"

  # Each component's defaults for the keys its objects read, as its 2.2.0 chart
  # declared them. A layer that sets a key wins, false and empty included.
  defaults:
    dfe-receiver:
      project: dfe
      component: receiver
      env: local
      cloud: local
      # The ingest NetworkPolicy opens the exposed ones; internal mode refuses an
      # exposed listener other than http. A layer replaces the whole list. The
      # receiver binds nothing on 8443, so no entry opens it.
      listeners:
        - { name: http, port: 8080, protocol: TCP, exposed: true }
        - { name: pushgrpc, port: 6000, protocol: TCP, exposed: false, appProtocol: kubernetes.io/h2c }
      exposure:
        mode: public                # public | internal | vpn
        vpn:
          # Selector label of the tunnel pods the vpn-mode policy admits.
          podLabel: dfe-culvert
        networkPolicy:
          enabled: true
      # The thin chart's load balancer switch, as argocd/values/apps/dfe-receiver
      # sets it; dfe-extras.receiverExposureGuard holds it to exposure.mode.
      publicService:
        enabled: true
      kafka:
        mode: ""
        bootstrapServers: ""
        securityProtocol: ""
      dlq:
        topic: dfe_receiver_dlq
        mode: kafka_only
    dfe-loader:
      project: dfe
      component: loader
      env: local
      cloud: local
      kafka:
        mode: ""
        bootstrapServers: ""
        securityProtocol: ""
      clickhouse:
        host: ""
        port: 8123
        database: dfe
        tls:
          enabled: false
          port: 8443
          verify: true
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      dlq:
        topic: dfe_loader_dlq
        mode: kafka_only
      service:
        grpcPort: 6000
    dfe-archiver:
      project: dfe
      component: archiver
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-vrl:
      project: dfe
      component: transform-vrl
      env: local
      cloud: local
      service:
        pushPort: 6000
    dfe-transform-vector:
      project: dfe
      component: transform-vector
      env: local
      cloud: local
      service:
        pushPort: 6000
    culvert:
      project: dfe
      component: culvert
      env: local
      cloud: local
      # The tunnel policy admits the exposed ones. A layer replaces the whole list.
      listeners:
        - { name: wireguard, port: 51820, protocol: UDP, exposed: true, nodePort: 31820 }
        - { name: openvpn-udp, port: 1194, protocol: UDP, exposed: true, nodePort: 31194 }
        - { name: metrics, port: 9090, protocol: TCP, exposed: false }
      peers:
        classes:
          appliance:
            isolation: true
          admin:
            enabled: false
            # Where an admin reaches appliances from, on the pod's ethernet side.
            adminCIDRs: []
            peerCIDR: ""
            # The appliance ports the admin rule admits.
            reach:
              - 22
              - 443
      # The receiver pods and ports a tunnelled client may reach.
      ingest:
        podLabel: dfe-receiver
        ports:
          - { port: 8080, protocol: TCP }
          - { port: 8443, protocol: TCP }
      # The tunnel pods' whole egress surface: the receiver, DNS and telemetry. Set
      # enabled false in a layer to drop it; never true, which also switches on the
      # culvert chart's own policy of the same name.
      networkPolicy:
        enabled: true
        otelNamespace: otel
        otelPort: 4317
        # Extra egress rules in NetworkPolicy's own shape: an external PKI or OIDC issuer.
        extraEgress: []
      otel:
        endpoint: ""
    dfe-ui:
      project: dfe
      component: ui
      env: local
      cloud: local
      config:
        nextauthSecretName: dfe-ui-nextauth
        # A ClusterSecretStore seeded with <project>/<env>/ui/nextauth. Empty
        # generates the secret in-cluster, so the UI deploys on a bare cluster.
        secretStoreName: ""
    dfe-hyperdx:
      project: dfe
      component: hyperdx
      env: local
      cloud: local
      usageStats:
        enabled: false
      clickhouse:
        host: dfe-clickhouse.clickhouse.svc.cluster.local
        port: 8123
        user: ""
        passwordSecretName: ""
        passwordSecretKey: password
        tls:
          enabled: false
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      mongodb:
        # $(MONGO_PASSWORD) is kubelet-expanded, so MONGO_URI stays in the thin chart's env.
        uri: "mongodb://hyperdx:$(MONGO_PASSWORD)@dfe-ferretdb.cnpg.svc.cluster.local:27017/hyperdx?authSource=admin"
        passwordSecretName: dfe-ferretdb-password
        passwordSecretKey: password
      dfeAuth:
        enabled: true
        mode: oidc-proxy            # oidc-proxy | header-dev
        engineService: dfe-engine
        engineNamespace: ""         # empty -> this release's namespace
        enginePort: 8000
        engineJwksUrl: ""           # set to bypass the derivation entirely
        engineIssuer: ""
        headerEmail: x-oidc-subject
        headerGroups: x-oidc-groups
        defaultTeam: dfe
      sessionSecret:
        name: dfe-hyperdx-session
        key: session-secret
        create: true
      tokenEncryption:
        name: dfe-hyperdx-token-encryption
        key: token-encryption-key
        create: true
      dashboards:
        enabled: true
        mountPath: /etc/hyperdx/dashboards
        allTeams: true
        requireRefs: true
      localAuthPages:
        enabled: false
      frontendUrl: ""
    dfe-engine:
      project: dfe
      component: engine
      env: local
      cloud: local
      tenantIsolation:
        enabled: true
      e2eServer: false
      # The hunt runner's and keda shim's image: the engine's own pin.
      image:
        repository: ""
        tag: ""
        digest: "sha256:36f4e647053f3ddb6f1997bbbb6e99aaf6dc467ae09c7282639e7d1bc4c50044"
        pullPolicy: IfNotPresent
      stackVersion: ""
      profile: ""
      uiVersion: "v1.7.6"           # == versions.yaml apps.dfe-ui
      kafka:
        mode: ""
        bootstrapServers: ""
        saslSecretName: dfe-kafka-user
        securityProtocol: ""
        provider: ""
        messageMaxBytes: ""
      # Read for the role each entry carries: a catalogue entry sets
      # DFE_SOURCE_CATALOGUE_FILE. The refs the engine's content init containers
      # pull belong to the thin chart's values.
      content:
        mountPath: /etc/dfe-engine/content
        catalogueFile: sources.yaml
        entries:
          - { name: dfe-receiver-contract, kind: emit, role: contract, app: dfe-receiver }
          - { name: dfe-loader-contract, kind: emit, role: contract, app: dfe-loader }
          - { name: dfe-archiver-contract, kind: emit, role: contract, app: dfe-archiver }
          - { name: dfe-fetcher-contract, kind: emit, role: contract, app: dfe-fetcher }
          - { name: dfe-transform-vrl-contract, kind: emit, role: contract, app: dfe-transform-vrl }
          - { name: dfe-transform-vector-contract, kind: emit, role: contract, app: dfe-transform-vector }
          - { name: dfe-transform-elastic-contract, kind: emit, role: contract, app: dfe-transform-elastic }
          - { name: dfe-transform-elastic-catalogue, kind: emit, role: catalogue, app: dfe-transform-elastic }
      config:
        mountPath: /config
      clickhouse:
        host: ""
        port: 8123
        database: dfe
        tls:
          enabled: false
          port: 8443
          verify: true
          issuerRef:
            name: ""
          internalCA:
            present: false
          ca:
            secretName: ""
            configMapName: ""
            dataKey: ca.crt
      retention:
        defaultTtlDays: 90
      otel:
        endpoint: ""
      gitops:
        enabled: true
        repoUrl: "http://dfe-forgejo.forgejo.svc.cluster.local:3000/dfe-admin/deploy.git"
        branch: main
        localPath: /var/run/dfe/deploy-repo
        credentialsSecret: dfe-deploy-repo-auth   # keys: username, password
      hyperdx:
        enabled: true
        service: dfe-hyperdx
        namespace: ""               # empty -> this release's namespace
        apiPort: 8000
        baseUrl: ""                 # set to bypass the derivation entirely
      auth:
        jwtSecretName: dfe-engine-jwt
        jwtSecretKey: jwt-secret
        jwtSecretCreate: true
        jwtSecret: ""
        trustProxyHeaders: false
        proxyProvider: ""
        apiKeyDefaultTtlDays: ""
        loginThrottle:
          enabled: ""
          usernameFailures: ""
          clientFailures: ""
          maxDelaySeconds: ""
        adminSecretName: dfe-engine-admin
        adminSecretKey: admin-password
        adminSecretCreate: true
        adminPassword: ""
        adminSecretPath: ""
        breakglassSecretName: dfe-engine-breakglass
        breakglassSecretKey: breakglass-password
        breakglassSecretCreate: true
        breakglassPassword: ""
      seedAuth:
        secretName: dfe-engine-seed-accounts
        seedAccounts: []
        adminPassword: ""
      oidc:
        enabled: false
        providers: []
      api:
        forwardedAllowIps: ""
        jwtExpireMinutes: ""
        maxSessionMinutes: ""
        docsEnabled: ""
      networkModel:
        podCIDR: ""
      authConfig:
        providersConfigMap: ""
        groupsConfigMap: ""
        caBundleConfigMap: ""
      kedaShim:
        enabled: true
        port: 8080
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      huntRunner:
        enabled: true
        poll: 15                    # seconds between runner ticks
        cap: 8                      # global cap on concurrent hunt runs
        clickhouse:
          user: dfe_hunt_runner
          passwordSecretName: hunt-runner-clickhouse
          passwordSecretKey: password
          passwordSecretCreate: true
          password: ""
        autoscaling:
          enabled: false
          minReplicaCount: 1
          maxReplicaCount: 5
          targetBacklog: 10         # due hunts per pod
          cooldownPeriod: 300
          pollingInterval: 30
          shimAddress: ""
        gitSync:
          enabled: true
          image:
            repository: registry.k8s.io/git-sync/git-sync
            tag: "v4.7.1"           # == versions.yaml services.git-sync
            digest: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"
            pullPolicy: IfNotPresent
          mountPath: /deploy-repo
          link: current
          homePath: /git-sync-home
          period: 30s
          maxFailures: -1
          initialMaxFailures: 3
          huntsPath: config/hunts
          rulesPath: config/rules
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      waitForEngine:
        enabled: true
        service: dfe-engine
        namespace: ""
        port: 8000
        timeoutSeconds: 600
        intervalSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      nodeScheduling: {}
