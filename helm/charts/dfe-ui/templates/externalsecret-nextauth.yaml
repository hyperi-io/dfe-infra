{{- if .Values.config.nextauthSecretName }}
{{/*
Project dfe-ui's NextAuth signing secret out of the secrets store.

next-auth refuses to start in production without it -- "[next-auth][error][NO_SECRET]
Please define a `secret`" -- which is half of why dfe-ui crashlooped for the life of
this cluster (the other half: the chart probed /health/live, a route that did not
exist). values.yaml has DECLARED nextauthSecretName since the chart was written, but
nothing created the Secret and the deployment never read it, so the value was inert
-- the same trap saslSecretName sat in on dfe-loader/dfe-receiver.

The DEPLOY layer seeds the store (terraform/modules/tf-secrets `seed_ui_nextauth`)
and ESO only projects it: ESO's AppRole is read-only BY DESIGN, so nothing in-cluster
mints this. The store is also the one seam that swaps for cloud -- point the
ClusterSecretStore at aws/gcp/azure and nothing here changes.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.config.nextauthSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.config.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.config.nextauthSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        # Must match tf-secrets seed_ui_nextauth: <project>/<env>/ui/nextauth,
        # RELATIVE to the `secret` mount the store pins itself.
        key: {{ .Values.project }}/{{ .Values.env }}/ui/nextauth
        property: secret
{{- end }}
