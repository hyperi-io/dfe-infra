{{- if .Values.config.nextauthSecretName }}
{{- if .Values.config.secretStoreName }}
{{/*
dfe-ui's NextAuth signing secret, read from the deployer's secrets store.

Opt-in: set config.secretStoreName. The key must match tf-secrets
`seed_ui_nextauth` (<project>/<env>/ui/nextauth), RELATIVE to the `secret` mount
the store pins itself. This is the seam that swaps for cloud -- point the
ClusterSecretStore at aws/gcp/azure and nothing here changes.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.config.nextauthSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.config.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.config.nextauthSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/ui/nextauth
        property: secret
{{- else }}
{{/*
dfe-ui's NextAuth signing secret, generated IN-CLUSTER.

The default, because requiring a secrets store makes the UI undeployable on a
bare cluster: with no store the ExternalSecret reports "ClusterSecretStore is not
ready" forever and the pod sits in CreateContainerConfigError. next-auth then
refuses to start at all -- "[next-auth][error][NO_SECRET]".

Nothing outside the cluster needs this value, so an operator seeding it buys
nothing. Same mechanism and same reasoning as clickhouse-cluster's admin
password: refreshPolicy CreatedOnce writes it once, so a re-sync does not rotate
the signing secret out from under live sessions. refreshInterval "0" alone is
not enough: any spec-generation bump (an Argo re-label is one) makes ESO try
the generator again, and that attempt fails into SecretSyncedError forever.
*/}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.config.nextauthSecretName }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 48
  digits: 6
  symbols: 0          # alphanumeric -- avoids escaping in env and URL contexts
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.config.nextauthSecretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ .Values.config.nextauthSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secret: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.config.nextauthSecretName }}-gen
{{- end }}
{{- end }}
