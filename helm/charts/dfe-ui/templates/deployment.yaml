apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.config.nextPublicApiUrl | quote }}
            - name: NEXT_PUBLIC_HYPERDX_URL
              value: {{ .Values.config.nextPublicHyperdxUrl | quote }}
            {{- if .Values.config.nextauthSecretName }}
            # next-auth REFUSES to start in production without a secret
            # ("[next-auth][error][NO_SECRET]"), which is why dfe-ui crashlooped.
            # values.yaml has declared nextauthSecretName since the chart was written
            # but nothing read it and nothing created the Secret -- the same inert-value
            # trap saslSecretName sat in on dfe-loader/dfe-receiver. The Secret is
            # projected out of the secrets store by externalsecret-nextauth.yaml.
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.nextauthSecretName }}
                  key: secret
            {{- end }}
            # next-auth builds its callback URLs from this. Wrong or unset behind a
            # proxy and the login round-trip bounces to the wrong origin.
            - name: NEXTAUTH_URL
              value: {{ .Values.config.nextauthUrl | default (printf "https://%s" .Values.domain) | quote }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-ui
          volumeMounts:
            # Writable scratch for /tmp. Next.js also writes its .next cache to the
            # rootfs, which is why this chart sets readOnlyRootFilesystem:false rather
            # than relying on the rootfs being read-only (values.yaml).
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The same probe trinity + shape the Rust services use (scalo-rs
          # docs/core-pillars/HEALTH.md): startup owns the boot budget, liveness only
          # asks "is the process deadlocked", readiness owns traffic. dfe-ui now
          # serves the canonical paths with the canonical bodies.
          #
          # These probed /health/live + /health/ready against an app that had NO health
          # routes at all -- every probe 404'd, so readiness never passed and liveness
          # restarted the pod forever (392 restarts). Beware the near-miss that
          # replaced it: once the routes existed they were still behind the auth
          # middleware and answered 307 -> /login, and k8s counts 3xx as SUCCESS, so
          # the probe would have gone green on the login redirect while the app was
          # face down. Both live-proven 2026-07-17.
          #
          # Port is http (3000), not a metrics port: Next.js has ONE listener, so
          # unlike the Rust services there is no second server to host these on. Paths
          # and bodies are identical, which is what the probes actually read.
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            # 30 * 2s = 1 min boot budget, then restart. Next cold start is slow;
            # this is what stops a slow boot reading as a dead process.
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
