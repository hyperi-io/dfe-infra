apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  {{- include "dfe-common.replicas" . }}
  {{- include "dfe-common.rollout" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            # Heap cap that TRACKS the pod memory limit: the percentage flag
            # resolves against the cgroup limit, so raising resources.limits
            # in an overlay moves the heap cap with it -- no second number to
            # drift. Node's own default is ~50-55% of the limit; 70 leaves
            # headroom for RSS outside old-space (Buffers, Workers, code
            # cache) before the OOM killer. Requires Node 24+ (image ships
            # v24) and a memory limit set (the chart sets one). Verified
            # in-pod 2026-07-22: flag accepted, heap = 70% of memory.max.
            - name: NODE_OPTIONS
              value: {{ .Values.config.nodeOptions | default "--max-old-space-size-percentage=70" | quote }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.config.nextPublicApiUrl | quote }}
            # NextAuth's authorize fetch runs server-side; a missing base URL
            # makes every credentials login fail before reaching the engine.
            - name: INTERNAL_API_URL
              value: {{ .Values.config.internalApiUrl | default (printf "http://%s-engine.%s.svc.cluster.local:8000" .Values.project (include "dfe-common.namespace" .)) | quote }}
            # Read at request time by the (auth) layout: lights the /observe/*
            # sidebar entries that iframe the chromeless dfe-hyperdx fork.
            - name: HYPERDX_URL
              {{- /* No domain means no derived URL: printf would emit "https://hyperdx.", which is truthy and beats the port fallback the app uses when this is empty. */}}
              value: {{ .Values.config.hyperdxUrl | default (empty .Values.domain | ternary "" (printf "https://%s.%s" (coalesce .Values.config.hyperdxHostname (dig "hyperdx" "hyperdx" (.Values.hostnames | default dict))) .Values.domain)) | quote }}
            # Scopes the dfe_token cookie to {domain} so the HyperDX iframe
            # (hyperdx.{domain}) is sent the same engine token the UI (dfe.{domain})
            # holds. Empty leaves the cookie host-only (single-origin/docker).
            - name: DFE_COOKIE_DOMAIN
              value: {{ .Values.config.cookieDomain | default .Values.domain | quote }}
            {{- if .Values.config.nextauthSecretName }}
            # next-auth REFUSES to start in production without a secret
            # ("[next-auth][error][NO_SECRET]"), which is why dfe-ui crashlooped.
            # values.yaml has declared nextauthSecretName since the chart was written
            # but nothing read it and nothing created the Secret -- the same inert-value
            # trap saslSecretName sat in on dfe-loader/dfe-receiver. The Secret is
            # projected out of the secrets store by externalsecret-nextauth.yaml.
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.nextauthSecretName }}
                  key: secret
            {{- end }}
            # next-auth builds its callback URLs from this. Wrong or unset behind a
            # proxy and the login round-trip bounces to the wrong origin. The UI
            # serves on {hostname}.{domain} (the gateway routes.dfeUi default),
            # never the apex.
            {{- with .Values.config.nextauthUrl | default (empty .Values.domain | ternary "" (printf "https://%s.%s" (coalesce .Values.config.hostname (dig "dfe" "dfe" (.Values.hostnames | default dict))) .Values.domain)) }}
            - name: NEXTAUTH_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-ui
          volumeMounts:
            # Writable scratch for /tmp. Next.js also writes its .next cache to the
            # rootfs, which is why this chart sets readOnlyRootFilesystem:false rather
            # than relying on the rootfs being read-only (values.yaml).
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The same probes + shape the Rust services use (scalo-rs
          # docs/core-pillars/health.md): liveness only asks "is the process
          # deadlocked", readiness owns traffic. dfe-ui serves the canonical
          # paths with the canonical bodies.
          #
          # startupProbe targets /livez -- there is no startup route. Kubernetes
          # suspends liveness until the startup probe passes, so one path gives
          # both the long boot budget and a tight liveness period, and the two
          # cannot drift apart.
          #
          # These probed /health/live + /health/ready against an app that had NO health
          # routes at all -- every probe 404'd, so readiness never passed and liveness
          # restarted the pod forever (392 restarts). Beware the near-miss that
          # replaced it: once the routes existed they were still behind the auth
          # middleware and answered 307 -> /login, and k8s counts 3xx as SUCCESS, so
          # the probe would have gone green on the login redirect while the app was
          # face down. Both live-proven 2026-07-17.
          #
          # Port is http (3000), not a metrics port: Next.js has ONE listener, so
          # unlike the Rust services there is no second server to host these on. Paths
          # and bodies are identical, which is what the probes actually read.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            # 30 * 2s = 1 min boot budget, then restart. Next cold start is slow;
            # this is what stops a slow boot reading as a dead process.
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
