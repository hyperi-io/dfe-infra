project: dfe
component: ui
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# PodDisruptionBudget (dfe-common.pdb): renders only when replicaCount >= 2
# (the scale profile), so single-replica deployments never get a PDB that
# blocks node drains. The budget is maxUnavailable: 1 (autoscaler-safe: a KEDA scale-to-one pod can still evict).
pdb:
  enabled: true

# Next.js writes to its own rootfs at runtime (the .next cache), so the stack
# default readOnlyRootFilesystem:true would break it -- relax that one bit while
# keeping allowPrivilegeEscalation:false and cap drop ALL. podSecurityContext is
# left empty on purpose: the dfe-common defaults (runAsNonRoot, uid/gid 1000,
# RuntimeDefault seccomp) apply unchanged.
containerSecurityContext:
  readOnlyRootFilesystem: false
podSecurityContext: {}

service:
  type: ClusterIP
  port: 3000

# Prometheus scrapes /metrics HERE, not on the stack's usual 9090. Next.js has exactly
# one listener, so unlike the scalo services there is no separate metrics server to
# host it on -- the path and metric names match the rest of the stack, the port cannot.
# Read by dfe-common.prometheusAnnotations, which prefers this over the deploy-wide
# telemetry.prometheus.port.
metricsPort: 3000

config:
  # Subdomain label the UI serves on under {domain} -- mirrors the
  # envoy-gateway-config routes.dfeUi.hostname default.
  hostname: "dfe"
  nextPublicApiUrl: ""           # https://dfe.{domain}/api
  nextPublicHyperdxUrl: ""       # https://hyperdx.{domain}
  # Node heap cap. Default tracks the pod memory limit via the cgroup-aware
  # percentage flag (Node 24+); override only for a non-standard runtime.
  nodeOptions: "--max-old-space-size-percentage=70"
  nextauthSecretName: dfe-ui-nextauth
  # NextAuth builds its callback URLs from this; empty falls back to https://<domain>.
  nextauthUrl: ""
  # ClusterSecretStore holding the NextAuth signing secret, seeded by the deploy
  # layer (terraform/modules/tf-secrets seed_ui_nextauth).
  #
  # Empty generates the secret in-cluster instead, so the UI deploys on a bare
  # cluster with no secrets store. Set this only where the store is real and
  # seeded -- an unready store leaves the pod in CreateContainerConfigError.
  secretStoreName: ""

otel:
  endpoint: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# KEDA autoscaling -- CPU only (the UI is a stateless web frontend; the scalo
# ScalingPressure pipeline signal does not apply). Scales on request-driven CPU.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # native KEDA cpu scaler (no shim needed)

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
