project: dfe
component: ui
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

config:
  nextPublicApiUrl: ""           # https://dfe.{domain}/api
  nextPublicHyperdxUrl: ""       # https://hyperdx.{domain}
  nextauthSecretName: dfe-ui-nextauth

otel:
  endpoint: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# KEDA autoscaling -- CPU only (the UI is a stateless web frontend; the scalo
# ScalingPressure pipeline signal does not apply). Scales on request-driven CPU.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # native KEDA cpu scaler (no shim needed)

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
