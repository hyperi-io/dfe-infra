project: dfe
component: transform-vrl
# The component the IMAGE is published under. This app runs one deployment per
# source, so dfe-engine makes `component` instance-unique to keep the object
# names apart; the image is the app's, not the instance's. Empty falls back to
# `component`, which is only correct for a single-instance deployment.
imageComponent: transform-vrl
env: local
cloud: local

image:
  repository: ""
  tag: ""
  # The immutable half of the pin; GHCR tags are mutable. == versions.yaml
  # digests.dfe-transform-vrl (drift-checked).
  digest: "sha256:6f4bc907b237fbb02a146e7a6b3fefd68b263360e2b7b0ed1213584b5b3b26f7"
  pullPolicy: IfNotPresent

replicaCount: 1

# dfe-engine applies every ClickHouse object and every bootstrap Kafka topic at
# its own startup and gates /readyz on the result, so an init container waits on
# the engine Service before this pod starts (dfe-common.waitForEngine). Started
# first, this app finds no table and no topic.
waitForEngine:
  enabled: true
  service: dfe-engine
  # Empty -> this release's own namespace.
  namespace: ""
  port: 8000
  # On expiry the init container exits non-zero and the pod sits in
  # Init:CrashLoopBackOff rather than starting against an absent schema.
  timeoutSeconds: 600
  intervalSeconds: 5
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Internal Service for the scalo Push listener, rendered on the direct transport
# only (dfe-common.pushService). 6000 is the DFE gRPC convention.
service:
  pushPort: 6000

# gRPC target on the direct transport (kafka.mode: disabled): the LOADER's
# Service name + grpcPort. The transform's gRPC output is a scalo Transport/Push
# client, which the loader serves and the receiver does not (its :6000 speaks the
# Vector protocol). A URI, unlike the receiver's host:port loaderGrpcAddress:
# scalo's GrpcConfig.endpoint is parsed as one. Point it at another transform's
# push Service to chain two transforms.
loaderGrpcAddress: "http://dfe-loader:6000"

kafka:
  # "disabled" is the DEPLOYMENT-WIDE transport dial, set once in the profile
  # values. Templates read it through dfe-common.transport, never by comparing
  # this string themselves.
  mode: ""
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # Managed-Kafka provider identity (strimzi | redpanda | msk | redpanda-cloud |
  # confluent-cloud | msk_iam | plaintext). Empty = unset (no KAFKA_PROVIDER env,
  # current no-provider behaviour). When set, scalo's KafkaConfig DERIVES
  # security_protocol + sasl_mechanism from it -- never hand-set. Mirrors the
  # DFE Kafka credential contract (dfe-engine#98).
  provider: ""
  sourceTopic: ""        # set per deployment via ArgoCD values
  destTopic: ""          # set per deployment
  consumerGroup: ""      # defaults to dfe-transform-vrl

otel:
  endpoint: ""

# The app's scalo config, mounted VERBATIM at /etc/dfe-transform-vrl/config.yaml
# (the image's CMD path -- dfe-transform-vrl Dockerfile:43). This is an OPAQUE
# passthrough blob: the engine is the config authority and publishes it as the
# per-instance Argo multi-source $values overlay
# (values/dfe-transform-vrl-<instance>-values.yaml), so the chart never needs to
# know the per-app keys. Empty here on purpose -- baking defaults in would put
# deployment-specific addresses in a product chart, and Helm's map merge would
# silently leave stale keys behind when the engine's overlay does not overwrite
# them.
#
# One exception, in the ConfigMap rather than here: source.transport and
# sink.transport (plus source.listen and sink.endpoint on direct) are derived
# from kafka.mode by dfe-common.transformConfig, because which transport carries
# the records is a deployment fact and not the engine's to author.
config: {}

# Environment keys this deployment sets on top of the derived ones, as
# {NAME: value}. dfe-engine writes them here from the overlay's own extraEnv
# block, for a setting the app carries and this chart does not model. Rendered
# first in the container's env, so a key the chart also sets is overridden by
# the chart's own value below it.
extraEnv: {}

# The .vrl programs this instance runs, as a list of {name, content}. Written by
# dfe-engine into the per-instance overlay and rendered into a ConfigMap mounted at
# transformFilesDir. A list rather than a map because a filename's own dot would be
# ambiguous with the dot-path addressing the engine uses.
transformFiles: []

# Where transformFiles are mounted. Also exported as DFE_TRANSFORM_TRANSFORMS_DIR,
# which outranks the config file, so the app reads what the chart actually mounted.
transformFilesDir: ""

# Lookup tables the VRL programs read, as a list of {name, content}. The bundled
# filebeat pipeline needs its timezones table for the ios and meraki branches and
# errors every event out without it. The app has no flat-env key for these, so the
# ConfigMap derives the matching config.enrichment_tables[] entry under the mount
# below -- the engine cannot, the mount directory being the chart's.
enrichmentTables: []
enrichmentTablesDir: ""

# OTel service.name for this instance. Empty falls back to the app name, which
# leaves two instances of one app indistinguishable in the otel tables.
otelServiceName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}

# KEDA autoscaling -- folded into the chart. The SHIPPED trigger is the native KEDA
# cpu scaler; scalo ScalingPressure (0-100) renders beside it and the HPA takes the
# higher of the two. The shim matches this ServiceName's gauge under any metric prefix
# (dfe-engine#379), so no app release is needed for the name. Pressure is the advanced signal: the composite fuses Kafka CG lag
# + container-contract metrics (buffer, memory) AND hard-gates to 0 when the downstream
# sink is unreachable (circuit-breaker open), so pressure never scales out pods that
# would not help when the real bottleneck is downstream. It routes through the fail-safe
# dfe-keda-shim (a metric outage FREEZES scaling, never runs replicas up). Transforms are
# multi-instance; set pressure.service per instance. minReplicaCount stays 1
# (scale-to-zero is 2.2 backlog).
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # second trigger: native KEDA cpu scaler (no shim needed)
  pressure:
    enabled: true             # scalo ScalingPressure via the fail-safe dfe-keda-shim
    # service: dfe-transform-vrl   # ServiceName in otel_metrics_gauge (default: chart fullname)
    # targetValue: 70
    # shimAddress: dfe-keda-shim.<ns>.svc.cluster.local:8080 (default: the release namespace)

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
