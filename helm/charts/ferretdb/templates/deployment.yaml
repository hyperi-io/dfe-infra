apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
    spec:
      # The image declares USER "ferretdb" (a name); the helper emits a NUMERIC
      # runAsUser (1000, the ferretdb uid -- verified from the image passwd), which
      # is what the kubelet needs to satisfy runAsNonRoot.
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: ferretdb
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            # sslmode=require forces TLS to CNPG (which serves TLS by
            # default), closing the sslmode=prefer silent-plaintext
            # fallback. sslmode=verify-full + sslrootcert (the CNPG CA) is
            # the CA-backed CNSA end-state; set postgresql.sslrootcert to
            # a mounted ca.crt to enable it.
            - name: FERRETDB_POSTGRESQL_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}?sslmode={{ .Values.postgresql.sslmode }}{{ with .Values.postgresql.sslrootcert }}&sslrootcert={{ . }}{{ end }}"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.secretName }}
                  key: {{ .Values.postgresql.secretUserKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.secretName }}
                  key: {{ .Values.postgresql.secretPasswordKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on; FerretDB writes its state dir (/state,
            # the image's FERRETDB_STATE_DIR) and may use /tmp. Data itself lives in
            # PostgreSQL, so these are scratch.
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
