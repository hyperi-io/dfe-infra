project: dfe
component: ferretdb
env: local
cloud: local

# Namespace the DFE apps run in, supplied by the appset from the cluster's
# dfe.hyperi.io/dfe_namespace annotation (layer2-data passes it to every data
# chart). The generated DocumentDB password is projected there so hyperdx can
# authenticate (templates/auth.yaml). Empty -> the copy is skipped, and the
# consumers have no way to authenticate.
appNamespace: ""

# Deployment-wide default StorageClass (set by the cloud overlay, e.g.
# local-path). documentdb.storage.storageClass overrides per-component; empty
# everywhere falls through to the cluster default class.
storageClass: ""

image:
  repository: ghcr.io/ferretdb/ferretdb
  tag: ""  # defaults to Chart.appVersion
  # == versions.yaml services-digests.ferretdb (drift-checked); it pins the appVersion tag.
  digest: "sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985"
  pullPolicy: IfNotPresent
  # Public GHCR image: suppress the fleet-wide imagePullSecrets, which
  # bootstrap only materialises in the app namespace (the kafbat lesson).
  public: true

replicaCount: 1

# PodDisruptionBudget: renders only when replicaCount >= 2 (the scale
# profile), so single-replica deployments never get a PDB that blocks node
# drains. maxUnavailable: 1 (autoscaler-safe). Own manifest rather than
# dfe-common.pdb because this chart carries a second workload (documentdb)
# and the budget must select the proxy pods only.
pdb:
  enabled: true

ferretdb:
  # Deployment mode (the modularity seam -- docs/architecture.md swappable
  # table). DFE owns its metadata store; deploy unless an external one given:
  #   deploy   -> bundled FerretDB + the postgres-documentdb backend below.
  #   external -> deploy NOTHING; the deployment brings its own Mongo-wire
  #               endpoint and points the consumer at it directly (the hyperdx
  #               chart's mongodb.uri + mongodb.passwordSecretName seam).
  #               Mirrors clickhouse.mode=external.
  mode: deploy
  # FERRETDB_LOG_LEVEL: DEBUG, INFO, WARN or ERROR. At INFO every readiness
  # probe logs a connection, two commands and a ping, which the otel collector
  # ships into otel_logs.
  logLevel: WARN

# The FerretDB 2.x storage backend: PostgreSQL 17 WITH the DocumentDB
# extension (ghcr.io/ferretdb/postgres-documentdb), a standalone StatefulSet +
# PVC in this namespace. DELIBERATELY NOT the shared CNPG cluster: CNPG runs
# its own instance manager in place of the image entrypoint, so the extension
# preload/initialisation this image performs at initdb never happens there and
# FerretDB 2.x fails its DocumentDB check. Mirrors the proven dfe-docker
# compose pair (hyperdx-postgres + hyperdx-ferretdb).
documentdb:
  image:
    repository: ghcr.io/ferretdb/postgres-documentdb
    # PG17 pinned exception until ferretdb publishes an 18 image (they publish
    # 15/16/17 lines only); the DFE PostgreSQL standard is 18.6. Latest 17-line
    # tag paired with FerretDB 2.7.0, verified against ghcr.
    tag: "17-0.107.0-ferretdb-2.7.0"
    digest: "sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7"
    pullPolicy: IfNotPresent
  auth:
    # FerretDB 2.x delegates client auth to PostgreSQL (SCRAM-SHA-256 on the
    # wire): this PG user IS the Mongo-side login hyperdx authenticates with.
    # The password is generated in-cluster once (templates/auth.yaml) and
    # projected into appNamespace -- never a chart value, never in git.
    username: hyperdx
    secretName: dfe-ferretdb-password
  # MUST stay "postgres": the DocumentDB extension initialises against the
  # image's default database (upstream requirement; docs.ferretdb.io).
  database: postgres
  # TLS to the backend. The bundled image serves no TLS, so this default keeps
  # pgx's `prefer` for the in-namespace pod-to-pod hop. An EXTERNAL
  # DocumentDB-capable PG that serves TLS should raise this to
  # require/verify-full (the CNSA end-state once the bundled backend carries a
  # cert).
  sslmode: prefer
  storage:
    size: 5Gi
    storageClass: ""  # empty -> top-level storageClass -> cluster default
  # PostgreSQL settings passed as `postgres -c key=value`. The DocumentDB
  # extension schedules pg_cron jobs every 2 seconds. cron.log_statement logs
  # each run, and cron.log_run records each one in cron.job_run_details, which
  # pg_cron never purges and which shares the PVC above.
  postgresSettings:
    cron.log_run: "off"
    cron.log_statement: "off"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

service:
  port: 27017
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
