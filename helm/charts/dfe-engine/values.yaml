project: dfe
component: engine
env: local
cloud: local

image:
  repository: ""     # set from global.registry
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

config:
  mountPath: /config
  # NFS mount for local, cloud storage for others
  nfs:
    server: ""
    path: ""

clickhouse:
  host: ""
  port: 8123
  database: dfe

postgresql:
  host: ""
  port: 5432
  database: dfe
  secretName: dfe-pg-app

otel:
  endpoint: ""

# Gitops deploy repo -- dfe-engine renders + commits artifacts here; Argo applies.
# repoUrl + branch are SINGLE-SOURCED: the layer2-apps appset injects them as helm
# params from the cluster-secret config_repo_url / config_repo_revision
# annotations, so the engine's write target ALWAYS equals the repo Argo reads
# (they cannot drift). The values below are the standalone-install fallback only
# (in-cluster Forgejo). Push cred: dfe-deploy-repo-auth (keys username/password),
# created in this namespace by bootstrap.sh from the same input in both modes --
# Forgejo admin creds when bundled, DFE_CONFIG_REPO_USER/TOKEN when external git.
gitops:
  enabled: true
  repoUrl: "http://dfe-forgejo.forgejo.svc.cluster.local:3000/dfe-admin/deploy.git"
  branch: main
  localPath: /var/run/dfe/deploy-repo
  credentialsSecret: dfe-deploy-repo-auth   # keys: username, password

auth:
  jwtSecretName: dfe-engine-jwt
  oidcEnabled: false

# OIDC provider credentials — mounted as env vars from K8s Secrets.
# dfe-engine is the SSoT: it writes provider secrets to Vault and renders this
# oidc config into the gitops repo; ESO materialises the K8s Secrets. Deploy is
# local-auth-only; external OIDC is added later via dfe-engine + gitops.
oidc:
  enabled: false
  providers: []
  # Example:
  # providers:
  #   - name: google-workspace
  #     secretName: dfe-oidc-google
  #     envMappings:
  #       DFE_OIDC_GOOGLE_CLIENT_ID: client-id
  #       DFE_OIDC_GOOGLE_CLIENT_SECRET: client-secret
  #       DFE_GOOGLE_SA_JSON: service-account-json

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- AVAILABLE but DEFAULT-OFF. The engine is a gitops control plane
# (effective singleton: it mints secrets + owns the deploy-repo working copy), so
# multi-replica safety is unverified. Set keda.enabled=true in the overlay to CPU-
# autoscale it for read-heavy HA once leader-safety is confirmed.
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # native KEDA cpu scaler (no shim needed)

# dfe-keda-shim -- the KEDA metrics-api -> ClickHouse query adapter, folded into the
# engine chart as its OWN small pod (same engine image, `dfe-keda-shim run`, DISTINCT
# labels so it is NOT selected by the engine Service). KEDA's pressure + hunt-backlog
# triggers poll its Service (dfe-keda-shim:8080). Fail-safe: a metric outage returns
# last-good, freezing scaling (never runs replicas up). NB CPU-default autoscaling
# needs neither this pod nor the pressure opt-in -- the shim only serves the opt-in
# ScalingPressure signal + the hunt due-count. Set enabled:false to drop it.
kedaShim:
  enabled: true
  port: 8080
  otelDatabase: dfe   # ClickHouse db holding HyperDX's otel_metrics_gauge (pressure)
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# dfe-hunt-runner -- the pull-based hunt executor, folded into the engine chart as its
# OWN pod (engine image, `dfe-hunt-runner run`, DISTINCT labels). It coordinates every
# decision through ClickHouse (leases + watermarks), so adding pods just adds claimants;
# a dead pod's lease expires and its work is reclaimed. DEFAULT 1 pod -- most deployments
# need only one. Autoscaling is BETA + OPT-IN: set huntRunner.autoscaling.enabled to scale
# on the due-hunt backlog via the fail-safe dfe-keda-shim (AverageValue). A backlog/CH
# outage HOLDS current (the shim's fail-safe), never runs replicas up.
huntRunner:
  enabled: true
  poll: 15          # seconds between runner ticks
  cap: 8            # global cap on concurrent hunt runs (protects ClickHouse)
  autoscaling:
    enabled: false          # BETA opt-in; default 1 pod
    minReplicaCount: 1
    maxReplicaCount: 5
    targetBacklog: 10       # due-hunts per pod (AverageValue -> ceil(due / targetBacklog))
    cooldownPeriod: 300
    pollingInterval: 30
    shimAddress: dfe-keda-shim.dfe.svc.cluster.local:8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
