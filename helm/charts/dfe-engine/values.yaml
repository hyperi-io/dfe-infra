project: dfe
component: engine
env: local
cloud: local

# Reconcile the ClickHouse tenant fence on engine startup: per-org roles and
# users, the _org_id row policies, and the deny policies over tables without it.
# These policies ARE the isolation, so turning this off leaves _org_id on every
# row and nothing enforcing it.
tenantIsolation:
  enabled: true

# The dfe-ui Playwright suite's posture: the engine runs as DFE_ENV=test with its
# unauthenticated /api/e2e routes mounted, whose seed scripts wipe and reseed every
# account and app instance. For a throwaway deployment under test, never one anyone
# keeps. The render fails unless `env` is a dev posture. The appset passes the cluster
# secret's dfe.hyperi.io/e2e_server annotation, which `dfe-ops stack-deploy --e2e` sets.
e2eServer: false

image:
  repository: ""     # set from global.registry
  tag: ""
  # The immutable half of the pin; GHCR tags are mutable. == versions.yaml
  # digests.dfe-engine (drift-checked). Engine, hunt-runner and keda-shim share it.
  digest: "sha256:1a68bd0c0581f298a48cb96ebf5a21814bea24966c92778daac6d4d4596de248"
  pullPolicy: IfNotPresent

replicaCount: 1

# The certified stack version this deployment runs. The appset passes the cluster
# secret's dfe.hyperi.io/stack_version annotation, written by dfe-ops from
# --stack, so the engine reports the stack the cluster was deployed at when the
# deploy repo's pins.yaml names no base. Empty = report nothing rather than
# guess.
stackVersion: ""

# The tier this deployment was stood up as. The appset passes the cluster
# secret's dfe.hyperi.io/profile annotation -- the same value that selects
# argocd/values/profile-<x>.yaml, so the engine's answer cannot drift from the
# values the charts were rendered with. Empty = report nothing rather than
# guess, and every optional app is then listed as offered.
profile: ""

# The dfe-ui version this deployment renders, so GET /api/v1/system/deployment
# names it. Helm cannot read a sibling chart's appVersion, so this is a second
# copy of the versions.yaml apps.dfe-ui pin and check_versions_drift.py is what
# stops the two diverging.
uiVersion: "v1.7.5"

# The transport dial is the DEPLOYMENT-WIDE kafka.mode the profile values set,
# and dfe-common.transport reads a missing map as the bus default. On the bus
# the engine creates each source's _land/_load topics, so it needs the broker
# address and the same SASL credential the data-plane apps use.
kafka:
  mode: ""
  bootstrapServers: ""
  saslSecretName: dfe-kafka-user
  # The listener's wire protocol, the dial every app chart reads. Empty takes
  # SASL_PLAINTEXT, the in-cluster brokers' plain listener.
  securityProtocol: ""
  provider: ""
  # The max.message.bytes every topic the engine creates takes, in bytes -- the
  # kafka chart's own key for the same number. A managed broker sets it from the
  # message size the broker was built with (layer2-apps.yaml); empty leaves the
  # engine's own default.
  messageMaxBytes: ""

service:
  type: ClusterIP
  port: 8000

# Files this engine serves that another image owns: the reference transform
# pipelines the library and the console's copy-paste view show, the source
# catalogue a transform ships, and each app's own container contract -- the
# config schema and capability catalogue the settings API reads. Each entry
# becomes ONE init container that fills a shared emptyDir before the engine
# starts.
#
# NOT a ConfigMap and not a values blob: the elastic catalogue alone is 344 KB, so
# either form re-serialises it into etcd on every Argo sync.
#
# Entry fields:
#   name   the versions.yaml content pin this materialises, and the container name
#   kind   the vehicle -- `image` copies files out of a pinned app image the
#          deployment already has pull rights to; `asset` downloads a release
#          asset over the engine image's python; `emit` runs the pinned app image
#          so the app writes its own contract (role `contract`) or its own source
#          catalogue (role `catalogue`), neither of which the image carries as a
#          file
#   ref    the pinned image (tag@sha256) for `image` and `emit`, the asset URL for
#          `asset`
#   role   where the files land, and so what reads them: `library` puts them under
#          <mountPath>/library/<kind>, `catalogue` under <mountPath>/catalogue and
#          sets DFE_SOURCE_CATALOGUE_FILE, `contract` under
#          <mountPath>/contract/<app> where DFE_APP_CONTRACT_DIR points. Vehicle
#          and role are independent.
#   app    the service the entry speaks for: the subdirectory it writes, and the
#          command an `emit` entry runs. Required for `emit`.
#   files  [{from, to}] -- `from` is a path inside the image or a name inside the
#          asset, `to` is relative to the role's root. Absent for `emit`, where
#          the app decides what it writes.
#
# The emit entries carry a second copy of the versions.yaml apps + digests pins,
# so check_versions_drift.py reads both halves of each ref and --fix moves them
# with the SSoT. A deployment mirroring images elsewhere overrides the ref.
#
# The two LIBRARY pins are still empty, and the pins in versions.yaml say why:
# neither transform release carries its files as an asset, and neither Dockerfile
# copies them into the image, so there is nothing to fetch yet. The live block:
#
#     - name: dfe-transform-vector-templates
#       kind: image
#       ref: "ghcr.io/hyperi-io/dfe-transform-vector:<tag>@<digest>"
#       role: library
#       files:
#         - from: /usr/share/dfe-transform-vector/templates
#           to: vector-yaml
#     - name: dfe-transform-vrl-pipelines
#       kind: image
#       ref: "ghcr.io/hyperi-io/dfe-transform-vrl:<tag>@<digest>"
#       role: library
#       files:
#         - from: /usr/share/dfe-transform-vrl/pipelines
#           to: vrl
content:
  mountPath: /etc/dfe-engine/content
  # The catalogue's filename is the engine's contract, not a deployment choice:
  # the app manifest binds a catalogue by the name its app ships it under.
  catalogueFile: sources.yaml
  entries:
    - name: dfe-receiver-contract
      kind: emit
      role: contract
      app: dfe-receiver
      ref: "ghcr.io/hyperi-io/dfe-receiver:v1.15.41@sha256:c750b08c808cf3574a6a7a24d62064013aca18071cf2251df2e687b4cfb7465d"
    - name: dfe-loader-contract
      kind: emit
      role: contract
      app: dfe-loader
      ref: "ghcr.io/hyperi-io/dfe-loader:v1.18.45@sha256:26e3e438cafa1b3b3305299ce07d6040abbb829b123575f13e26ccb5463fd9a2"
    - name: dfe-archiver-contract
      kind: emit
      role: contract
      app: dfe-archiver
      ref: "ghcr.io/hyperi-io/dfe-archiver:v1.7.27@sha256:1ccaa927a5a2398c3448b04ed8c6a608484218a4238ed3980fda365d7463f698"
    - name: dfe-fetcher-contract
      kind: emit
      role: contract
      app: dfe-fetcher
      ref: "ghcr.io/hyperi-io/dfe-fetcher:v1.4.31@sha256:dc3def6f4ba52b170ac6c42f35a80b8de5cc38ee03fb67abe3fdfc9666946d96"
    - name: dfe-transform-vrl-contract
      kind: emit
      role: contract
      app: dfe-transform-vrl
      ref: "ghcr.io/hyperi-io/dfe-transform-vrl:v1.1.29@sha256:75d97417d09456fabc0931202cbcb7a13e015b1eae46ccde67b920e8a2514a2c"
    - name: dfe-transform-vector-contract
      kind: emit
      role: contract
      app: dfe-transform-vector
      ref: "ghcr.io/hyperi-io/dfe-transform-vector:v1.0.44@sha256:f0e3ccfe6c4dac66e5256da1272c4c0dcfee97ef1b1dc2388fe9e1a4e299d465"
    - name: dfe-transform-elastic-contract
      kind: emit
      role: contract
      app: dfe-transform-elastic
      ref: "ghcr.io/hyperi-io/dfe-transform-elastic:v1.1.8@sha256:447ecd904de58c1c7bc209335e9b72c57e3a17eb3ea652bc1574239860d9fe8b"
    # The source catalogue the settings API offers, printed by the pinned image
    # itself (`dfe-transform-elastic emit-catalogue`, dfe-transform-elastic#92)
    # so the deployment needs no access to the app's repository. An image that
    # predates the subcommand writes nothing, and the engine's catalogue API
    # then reports the file missing rather than the pod failing to start.
    - name: dfe-transform-elastic-catalogue
      kind: emit
      role: catalogue
      app: dfe-transform-elastic
      ref: "ghcr.io/hyperi-io/dfe-transform-elastic:v1.1.8@sha256:447ecd904de58c1c7bc209335e9b72c57e3a17eb3ea652bc1574239860d9fe8b"

# Where the engine reads each app's live metric manifest, {service} being the app's
# name. Each app chart publishes its metrics port on a Service of that name in this
# namespace; an app in another namespace needs the full Service address here. Empty
# reads none.
metricsManifestUrl: "http://{service}:9090/metrics/manifest"

config:
  mountPath: /config
  # The engine's runtime store lives here: local accounts, orgs, wizard
  # state, role bindings. A PVC by default -- on emptyDir a pod restart
  # factory-resets identity. The class comes from the cluster (the
  # bootstrap guarantees a default StorageClass exists).
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # empty -> cluster default class

# Restart this workload when a Secret or ConfigMap it consumes changes. Env from
# a secretKeyRef resolves once at pod start, so without this a rotated credential
# never reaches the running pod.
reload:
  enabled: true
  secrets: []     # empty with enabled -> reloader watches everything mounted
  configmaps: []

clickhouse:
  host: ""
  # The plaintext HTTP port, dialled only while tls.enabled is off.
  port: 8123
  database: dfe
  # HTTPS to ClickHouse for the engine, the hunt runner and the keda shim alike.
  # argocd/values/common.yaml turns it on for every deployment it builds and the
  # clickhouse-cluster chart serves it from the same block; off here keeps a
  # render with no CA (the dfe-stack trial) on plaintext. An external server sets
  # the same keys to reach its own endpoint.
  tls:
    enabled: false
    port: 8443
    # false only for a server whose certificate cannot be verified. Rendered
    # only with tls.enabled, because a plaintext port presents no certificate.
    verify: true
    # The CA that signed the server certificate, from a Secret or a ConfigMap in
    # this namespace, under dataKey. Both empty trusts the image's system roots,
    # which is right for a server with a public certificate.
    ca:
      secretName: ""
      configMapName: ""
      dataKey: ca.crt

# Days every time-series table DFE deploys keeps rows, the OTel tables included.
# 0 disables the default TTL.
# A source or a dfe-schemas definition that declares its own TTL overrides it.
retention:
  defaultTtlDays: 90

otel:
  endpoint: ""

# Gitops deploy repo -- dfe-engine renders + commits artifacts here; Argo applies.
# repoUrl + branch are SINGLE-SOURCED: the layer2-apps appset injects them as helm
# params from the cluster-secret config_repo_url / config_repo_revision
# annotations, so the engine's write target ALWAYS equals the repo Argo reads
# (they cannot drift). The values below are the standalone-install fallback only
# (in-cluster Forgejo). Push cred: dfe-deploy-repo-auth (keys username/password),
# created in this namespace by bootstrap.sh from the same input in both modes --
# Forgejo admin creds when bundled, DFE_CONFIG_REPO_USER/TOKEN when external git.
gitops:
  enabled: true
  repoUrl: "http://dfe-forgejo.forgejo.svc.cluster.local:3000/dfe-admin/deploy.git"
  branch: main
  localPath: /var/run/dfe/deploy-repo
  credentialsSecret: dfe-deploy-repo-auth   # keys: username, password

# HyperDX control surface: the engine confirms the fork's default team and
# seeds connections over engine-signed machine JWTs (no stored credential).
# The URL is derived from the co-deployed fork's service; a split deployment
# overrides namespace, and an out-of-cluster fork sets baseUrl directly.
hyperdx:
  enabled: true
  service: dfe-hyperdx
  namespace: ""   # empty -> this release's namespace
  apiPort: 8000
  baseUrl: ""     # set to bypass the derivation entirely

auth:
  # Every dfe-engine pod reads the signing key from this Secret. ESO's Password
  # generator writes it ONCE (refreshPolicy CreatedOnce), so re-rendering the
  # chart never changes it -- the render is stateless under Argo, and a key that
  # moves logs every operator out and rolls the engine (#224).
  # UPGRADING from a release that minted this Secret from the template: the
  # ExternalSecret adopts it (creationPolicy Owner) and overwrites the key on its
  # first reconcile, so every token issued before the upgrade dies once and the
  # engine rolls once. The key is stable from that reconcile on. See
  # docs/deployment/index.md.
  jwtSecretName: dfe-engine-jwt
  jwtSecretKey: jwt-secret
  # false when the deployment supplies this Secret from its own sealed secret or
  # its own ExternalSecret under jwtSecretName; the chart then creates nothing.
  jwtSecretCreate: true
  # Pin a known key for a deployment that restores from backup or rotates
  # centrally. Set -> a plain Secret carrying it, and no generator.
  jwtSecret: ""
  # There is no auth.oidcEnabled and deliberately no engine-side equivalent: the
  # engine has no OIDC on/off setting, it reads whatever provider YAML is under
  # <config.mountPath>/auth/oidc-providers. Turning OIDC on is three separate
  # statements, each with its own value here -- authConfig.providersConfigMap
  # supplies the provider definitions, oidc.enabled + oidc.providers mount their
  # client credentials, and auth.trustProxyHeaders says whether the gateway's
  # X-Oidc-* headers are believed (dfe-infra #222).
  #
  # Trust X-Oidc-Subject / -Email / -Groups as authenticated identity.
  #
  # Only true where the gateway in front of this route STRIPS those headers off
  # every inbound request AND re-adds them from a verified token -- both, not
  # either. The gateway chart does that when jwtAuthn.enabled is set; enabling
  # Envoy's OIDC redirect alone does NOT, which is why this is its own switch and
  # not a rider on oidc.enabled.
  #
  # A forged header is a full identity when this is wrong, so it stays false
  # until a deployment states otherwise.
  trustProxyHeaders: false
  # The OIDC provider a gateway login (X-Oidc-*) is stamped with. Its asserted
  # groups link only to groups linked to this provider, so group files that name
  # another provider (dex, entra) need it here. Empty leaves the engine's `oidc`.
  proxyProvider: ""
  # Days an API key created without an expiry lasts; 0 creates one that never
  # expires. Empty leaves the engine's 90.
  apiKeyDefaultTtlDays: ""
  # Back-off on failed password sign-ins, per username and per client address.
  # The count lives in each engine pod and resets on restart. Each empty key
  # leaves the engine's default: on, 5, 20, 900.
  loginThrottle:
    enabled: ""
    usernameFailures: ""
    clientFailures: ""
    maxDelaySeconds: ""

  # THE admin credential. ESO's Password generator mints it ONCE
  # (refreshPolicy CreatedOnce) into this Secret, the engine reads it from there
  # and reasserts it on every boot, and the engine REFUSES TO START on an unset
  # or `changeme` password unless `env` is a dev posture. Nothing here ever
  # renders a default, so a production deploy has no guessable login to leak.
  # This one Secret replaced the two that each claimed to be the admin password
  # (dfe-infra #233); the named seed accounts below are unchanged.
  # Fetch it with `dfe-ops creds`.
  #
  # EMPTY means this deployment mints nothing and the engine falls back to its
  # shipped default -- refused at render time unless `env` is a dev posture.
  adminSecretName: dfe-engine-admin
  adminSecretKey: admin-password
  # false when the deployment supplies this Secret from its own sealed secret or
  # its own ExternalSecret under adminSecretName; the chart then creates nothing.
  adminSecretCreate: true
  # Pin a known admin password (a restore, or a dev tyre-kick). Set -> a plain
  # Secret carrying it, and no generator. `changeme` outside a dev posture is
  # refused at render time.
  adminPassword: ""
  # scalo.secrets path this deployment sources the admin password from. Set it
  # and the engine's rotate-password endpoint writes through the secrets seam;
  # empty and that endpoint answers 501 with the kubectl patch command instead.
  # Empty by default: on k8s the Secret IS the store.
  adminSecretPath: ""
  # The break-glass recovery admin (username `breakglass`). Minted the same way,
  # but the engine hashes it ONCE into the deploy repo at
  # governance/settings/auth.yaml, so the account survives losing the engine, the
  # UI and this Secret. Empty name = no break-glass account at all.
  breakglassSecretName: dfe-engine-breakglass
  breakglassSecretKey: breakglass-password
  breakglassSecretCreate: true
  breakglassPassword: ""

# Stable named local logins (dfe-infra #106). The engine reconciles these on
# every boot -- the configured password and groups WIN -- so a teardown+rebuild
# restores the exact shared team logins unchanged. The `admin` account is NOT one
# of these: it is minted under auth.adminSecretName above (#233).
#
# DEFAULT-OFF: empty seedAccounts => no Secret, no env, a vanilla deploy is
# unaffected. This is a PRODUCT, and any one deployment's logins are that
# deployment's own, so the default stays inert.
#
# Real values NEVER live here (this chart ships publicly). Set them in the
# gitignored .env / the deploy-repo overlay. Each seed account is
# {username, password, groups}; groups must be engine group names
# (dfe-admins, dfe-analysts, dfe-viewers, dfe-infra) -- the engine skips unknown
# groups. Example:
#   seedAuth:
#     seedAccounts:
#       - username: alice
#         password: "<strong password>"
#         groups: [dfe-analysts]
seedAuth:
  # Chart-created Secret holding the seed-accounts JSON.
  secretName: dfe-engine-seed-accounts
  # Named accounts reconciled on every boot (config wins). Empty -> no seeding.
  seedAccounts: []
  # Set anywhere -> a render-time failure naming auth.adminPassword (#233).
  adminPassword: ""

# OIDC provider credentials -- mounted as env vars from K8s Secrets.
# dfe-engine is the SSoT: it writes provider secrets to Vault and renders this
# oidc config into the gitops repo; ESO materialises the K8s Secrets. Deploy is
# local-auth-only; external OIDC is added later via dfe-engine + gitops.
oidc:
  enabled: false
  providers: []
  # Example:
  # providers:
  #   - name: google-workspace
  #     secretName: dfe-oidc-google
  #     envMappings:
  #       DFE_OIDC_GOOGLE_CLIENT_ID: client-id
  #       DFE_OIDC_GOOGLE_CLIENT_SECRET: client-secret
  #       DFE_GOOGLE_SA_JSON: service-account-json

# Auth config delivery. The engine reads OIDC provider YAML from
# <config.mountPath>/auth/oidc-providers and group->role/org YAML from
# <config.mountPath>/auth/groups, both loaded at startup. Each key names a
# ConfigMap the deployment provides; empty leaves the engine's writable
# defaults (group CRUD via the API needs groupsConfigMap left empty).
# caBundleConfigMap (key ca-bundle.pem) also sets SSL_CERT_FILE for
# deployments whose IdP or datastores use a private CA. It is MERGED with the
# image's public roots first, so a private-CA deployment can still reach a
# hosted IdP -- SSL_CERT_FILE replaces the trust store rather than adding to it.
# Peer addresses or CIDRs whose X-Forwarded-Proto and X-Forwarded-For the engine
# believes: list every proxy hop in front of it, the gateway and dfe-ui pods both.
# The engine builds its OIDC redirect URIs from the scheme this decides, and
# audits (and throttles sign-ins by) the right-most forwarded address no listed
# hop added. Empty takes networkModel.podCIDR below. With both empty the engine
# keeps its loopback-only default: every callback URI is http://, which Okta and
# Entra refuse to register, and every request audits as the gateway's address.
# Never "*": it audits the left-most forwarded address, which the caller wrote.
api:
  forwardedAllowIps: ""
  # Minutes an issued API token stays valid. Empty leaves the engine's own
  # 60-minute default; a deployment that wants shorter sessions sets it here.
  jwtExpireMinutes: ""
  # Longest a session lasts from its sign-in, in minutes; a refresh never extends
  # a token past it. Empty leaves the engine's 720.
  maxSessionMinutes: ""
  # Swagger UI at /docs and ReDoc at /redoc: "true", "false", or empty to serve
  # them on a dev posture only. Set it in the deploy repo's infra/common.yaml, not
  # here: the gateway routes the two paths and the links page lists them from the
  # same key. /openapi.json is served either way.
  docsEnabled: ""

# Read-only here, and owned by argocd/values/common.yaml: the range the CNI hands
# pods, where the gateway and dfe-ui run. It is api.forwardedAllowIps's default, so
# a deployment on another pod range changes it there, once, for every chart.
networkModel:
  podCIDR: ""

authConfig:
  providersConfigMap: ""
  groupsConfigMap: ""
  caBundleConfigMap: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  annotations: {}   # workload identity annotations injected here

# KEDA autoscaling -- AVAILABLE but DEFAULT-OFF. The engine is a gitops control plane
# (effective singleton: it mints secrets + owns the deploy-repo working copy), so
# multi-replica safety is unverified. Set keda.enabled=true in the overlay to CPU-
# autoscale it for read-heavy HA once leader-safety is confirmed.
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 300
  pollingInterval: 15
  cpu:
    targetUtilization: 70     # native KEDA cpu scaler (no shim needed)

# dfe-keda-shim -- the KEDA metrics-api -> ClickHouse query adapter, folded into the
# engine chart as its OWN small pod (same engine image, `dfe-keda-shim run`, DISTINCT
# labels so it is NOT selected by the engine Service). KEDA's pressure + hunt-backlog
# triggers poll its Service (dfe-keda-shim:8080). Fail-safe: a metric outage returns
# last-good, freezing scaling (never runs replicas up). NB CPU-default autoscaling
# needs neither this pod nor the pressure opt-in -- the shim only serves the opt-in
# ScalingPressure signal + the hunt due-count. Set enabled:false to drop it.
kedaShim:
  enabled: true
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# dfe-hunt-runner -- the pull-based hunt executor, folded into the engine chart as its
# OWN pod (engine image, `dfe-hunt-runner run`, DISTINCT labels). It coordinates every
# decision through ClickHouse (leases + watermarks), so adding pods just adds claimants;
# a dead pod's lease expires and its work is reclaimed. DEFAULT 1 pod -- most deployments
# need only one. Autoscaling is BETA + OPT-IN: set huntRunner.autoscaling.enabled to scale
# on the due-hunt backlog via the fail-safe dfe-keda-shim (AverageValue). A backlog/CH
# outage HOLDS current (the shim's fail-safe), never runs replicas up.
huntRunner:
  enabled: true
  poll: 15          # seconds between runner ticks
  cap: 8            # global cap on concurrent hunt runs (protects ClickHouse)
  autoscaling:
    enabled: false          # BETA opt-in; default 1 pod
    minReplicaCount: 1
    maxReplicaCount: 5
    targetBacklog: 10       # due-hunts per pod (AverageValue -> ceil(due / targetBacklog))
    cooldownPeriod: 300
    pollingInterval: 30
    # Default: dfe-keda-shim in this release's namespace (dfe-common.kedaShimAddress).
    shimAddress: ""
  # How hunt and rule YAML REACHES the runner. The runner reads them off disk
  # (dfe_engine.hunt_runner.spec_loader on every reload tick) and the engine
  # governs them in the deploy repo, so without this the runner's directories are
  # an empty volume and no hunt has ever loaded (dfe-infra#212).
  #
  # A git-sync sidecar clones the SAME deploy repo the engine writes and Argo
  # reads -- repo, branch and credential all come from gitops.* above, so the
  # runner cannot end up watching a different repo, and no second credential is
  # minted. Renders only when gitops.enabled is also true: with no deploy repo
  # there is nothing to sync.
  gitSync:
    enabled: true
    # registry.k8s.io/git-sync/git-sync -- upstream Kubernetes sidecar.
    image:
      repository: registry.k8s.io/git-sync/git-sync
      tag: "v4.7.1"      # == versions.yaml services.git-sync (drift-checked)
      # == versions.yaml services-digests.git-sync (drift-checked).
      digest: "sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717"
      pullPolicy: IfNotPresent
    # Shared emptyDir. git-sync owns <mountPath>/repo and keeps <link> pointing at
    # the synced worktree; the runner reads through that link. Its own root is
    # never the volume root, which git-sync requires to be empty or emptiable.
    mountPath: /deploy-repo
    link: current
    # git-sync's own HOME, so a read-only rootfs still lets git write its config
    # without sharing the runner's /tmp.
    homePath: /git-sync-home
    # Seconds between fetches. Well inside the runner's own reload cadence (poll
    # 15s x the CLI's reload-every 20 ticks = 5 min), so a committed hunt is on
    # disk before the runner next looks for it.
    period: 30s
    # Retry forever: the default 0 exits git-sync on the FIRST fetch failure, so a
    # brief forge outage would take the hunt runner's pod down with it.
    maxFailures: -1
    # Attempts the init container gives the FIRST sync before the pod fails. The
    # sidecar's retry-forever applied to it would hide a bad credential as a
    # Running runner that loads zero hunts (dfe-infra#212).
    initialMaxFailures: 3
    # Where the engine commits hunts and rules in the deploy repo, relative to the
    # synced worktree.
    huntsPath: config/hunts
    rulesPath: config/rules
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The hunt-runner pod's init container, read by name by dfe-common.waitForEngine.
# The engine pod itself does not wait. The runner exits without the coordination
# tables the engine's schema phase creates, and it syncs in the engine's own wave,
# so this is the only thing holding it back. port == service.port.
waitForEngine:
  enabled: true
  service: dfe-engine
  # Empty -> this release's own namespace.
  namespace: ""
  port: 8000
  # On expiry the init container exits non-zero and the pod sits in
  # Init:CrashLoopBackOff rather than starting against an absent schema.
  timeoutSeconds: 600
  intervalSeconds: 5
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Node placement dial (overlay-settable; dfe-common.scheduling reads this).
nodeScheduling: {}
