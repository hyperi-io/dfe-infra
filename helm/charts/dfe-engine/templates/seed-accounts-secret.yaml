{{- /*
Stable named local logins, as a Secret the engine reads at startup (dfe-infra #106).

The engine RECONCILES these on every boot -- the configured password and groups
WIN -- so a full teardown+rebuild restores the exact shared team logins unchanged,
instead of the random-on-first-boot break-glass admin. See settings.SeedAccount
and auth/bootstrap._reconcile_seed_accounts in dfe-engine.

Two independent inputs, each with its own key so an env ref can guard on it:

  seed-accounts   the JSON list DFE_AUTH_LOCAL_SEED_ACCOUNTS wants (config wins,
                  reconciled every boot -- shared team logins)
  admin-password  the stable break-glass admin password DFE_AUTH_LOCAL_ADMIN_PASSWORD
                  wants (seeded only into an empty store, so it sets the INITIAL
                  admin credential rather than reconciling)

DEFAULT-OFF: with both empty this template renders nothing, so a vanilla deploy
gets no Secret and no env, and the engine mints its usual random admin. The real
values live in the gitignored .env / the deploy-repo overlay, never in tracked
values -- this chart ships publicly.
*/ -}}
{{- $sa := .Values.seedAuth -}}
{{- if or $sa.adminPassword (gt (len $sa.seedAccounts) 0) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sa.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if gt (len $sa.seedAccounts) 0 }}
  seed-accounts: {{ toJson $sa.seedAccounts | quote }}
  {{- end }}
  {{- if $sa.adminPassword }}
  admin-password: {{ $sa.adminPassword | quote }}
  {{- end }}
{{- end -}}
