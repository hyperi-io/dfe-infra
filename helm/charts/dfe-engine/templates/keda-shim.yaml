{{- /*
dfe-keda-shim -- the KEDA metrics-api -> ClickHouse query adapter, run as its OWN
small pod on the engine image (`dfe-keda-shim run`). KEDA's pressure + hunt-backlog
triggers poll its Service. It carries DISTINCT labels (app.kubernetes.io/name:
dfe-keda-shim) so the engine's Service selector (name: dfe-engine) never routes to
it and vice-versa -- the one reason it is not just another engine replica.
*/ -}}
{{- if .Values.kedaShim.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfe-keda-shim
  labels: &shimLabels
    app.kubernetes.io/name: dfe-keda-shim
    app.kubernetes.io/part-of: {{ .Values.project | quote }}
    app.kubernetes.io/managed-by: "helm"
    app.kubernetes.io/version: {{ .Chart.AppVersion | default "0.0.0" | quote }}
    app.kubernetes.io/component: keda-shim
    dfe.hyperi.io/env: {{ .Values.env | quote }}
    dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dfe-keda-shim
  template:
    metadata:
      labels: *shimLabels
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      # Third pod in this chart, same class as deployment.yaml + hunt-runner: k8s
      # injects DFE_KEDA_SHIM_PORT="tcp://IP:8080" from svc/dfe-keda-shim into every
      # pod here, and this one reads DFE_KEDA_SHIM_PORT as its own int setting. It
      # sets that env explicitly below, so the injected value is not proven to win --
      # which is exactly why it should not be left to chance.
      enableServiceLinks: false
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: keda-shim
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # NO args. dfe-keda-shim's Typer app registers exactly ONE command
          # (keda_shim/cli.py @app.command("run")), and Typer collapses a
          # single-command app into a no-subcommand CLI -- so the entrypoint IS the
          # command and passing "run" is an unexpected positional:
          #   Error: Got unexpected extra argument(s) (run)   [exit 2]
          # It then never bound :8080, so the probes failed and it restarted forever.
          # Broken since the CLI and this chart were authored the same day -- it has
          # NEVER worked. Contrast dfe-hunt-runner, which registers TWO commands
          # (materialise + run), so its args: ["run", ...] is genuinely correct: do
          # not "make them consistent" by copying args here.
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          command: ["dfe-keda-shim"]
          ports:
            - name: http
              containerPort: {{ .Values.kedaShim.port }}
          env:
            # Same in-cluster ClickHouse the engine reads (plaintext HTTP :8123). The
            # shim polls it READ-ONLY for the pressure gauge + the hunt due-count.
            - name: DFE_CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: DFE_CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: DFE_CLICKHOUSE_DATA_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: DFE_CLICKHOUSE_SECURE
              value: "false"
            - name: DFE_KEDA_SHIM_PORT
              value: {{ .Values.kedaShim.port | quote }}
            - name: DFE_KEDA_SHIM_OTEL_DATABASE
              value: {{ .Values.kedaShim.otelDatabase | quote }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; whole stack -> HyperDX
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-keda-shim
          volumeMounts:
            # Writable scratch: the container rootfs is read-only
            # (dfe-common.containerSecurityContext), so anything writing /tmp
            # needs this emptyDir.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.kedaShim.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dfe-keda-shim
  labels:
    app.kubernetes.io/name: dfe-keda-shim
    app.kubernetes.io/part-of: {{ .Values.project | quote }}
    app.kubernetes.io/managed-by: "helm"
    app.kubernetes.io/component: keda-shim
    dfe.hyperi.io/env: {{ .Values.env | quote }}
    dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dfe-keda-shim
  ports:
    - name: http
      port: {{ .Values.kedaShim.port }}
      targetPort: http
{{- end }}
