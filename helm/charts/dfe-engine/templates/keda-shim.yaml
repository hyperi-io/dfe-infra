{{- /*
dfe-keda-shim -- the KEDA metrics-api -> ClickHouse query adapter, run as its OWN
small pod on the engine image (`dfe-keda-shim run`). KEDA's pressure + hunt-backlog
triggers poll its Service. It carries DISTINCT labels (app.kubernetes.io/name:
dfe-keda-shim) so the engine's Service selector (name: dfe-engine) never routes to
it and vice-versa -- the one reason it is not just another engine replica.
*/ -}}
{{- if .Values.kedaShim.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfe-keda-shim
  labels: &shimLabels
    app.kubernetes.io/name: dfe-keda-shim
    app.kubernetes.io/part-of: {{ .Values.project | quote }}
    app.kubernetes.io/managed-by: "helm"
    app.kubernetes.io/version: {{ .Chart.AppVersion | default "0.0.0" | quote }}
    app.kubernetes.io/component: keda-shim
    dfe.hyperi.io/env: {{ .Values.env | quote }}
    dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dfe-keda-shim
  template:
    metadata:
      labels: *shimLabels
    spec:
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: keda-shim
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dfe-keda-shim"]
          args: ["run"]
          ports:
            - name: http
              containerPort: {{ .Values.kedaShim.port }}
          env:
            # Same in-cluster ClickHouse the engine reads (plaintext HTTP :8123). The
            # shim polls it READ-ONLY for the pressure gauge + the hunt due-count.
            - name: DFE_CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: DFE_CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: DFE_CLICKHOUSE_DATA_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: DFE_CLICKHOUSE_SECURE
              value: "false"
            - name: DFE_KEDA_SHIM_PORT
              value: {{ .Values.kedaShim.port | quote }}
            - name: DFE_KEDA_SHIM_OTEL_DATABASE
              value: {{ .Values.kedaShim.otelDatabase | quote }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; whole stack -> HyperDX
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-keda-shim
          resources:
            {{- toYaml .Values.kedaShim.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dfe-keda-shim
  labels:
    app.kubernetes.io/name: dfe-keda-shim
    app.kubernetes.io/part-of: {{ .Values.project | quote }}
    app.kubernetes.io/managed-by: "helm"
    app.kubernetes.io/component: keda-shim
    dfe.hyperi.io/env: {{ .Values.env | quote }}
    dfe.hyperi.io/cloud: {{ .Values.cloud | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dfe-keda-shim
  ports:
    - name: http
      port: {{ .Values.kedaShim.port }}
      targetPort: http
{{- end }}
