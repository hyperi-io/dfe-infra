{{- /*
The JWT signing key, as a Secret every dfe-engine pod can read.

The engine MINTS a key at startup into DFE_SECRETS_PATH, which is an emptyDir --
per-pod and ephemeral. dfe-hunt-runner and dfe-keda-shim are SEPARATE pods, so
they never see it, fall back to the shipped dev placeholder, and DFESettings
rejects that under env=production with auth enabled:

  api.jwt_secret is the known dev placeholder but env is 'production' with auth
  enabled; set a strong DFE_API_JWT_SECRET

Both sidecar workloads crashloop on it while the engine itself stays up, because
only the engine can see what the engine minted.

GENERATED, not sourced from Vault: a signing key the stack mints for itself must
not make a vanilla cluster depend on OpenBao. `lookup` reuses the existing value
on upgrade, so re-running helm does not invalidate live sessions -- and because
lookup adopts whatever is already there, an operator who wants this from ESO or
a sealed secret just creates it under the same name first and the chart leaves
it alone.
*/ -}}
{{- $name := .Values.auth.jwtSecretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if not $existing -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # helm.sh/resource-policy keep: the key outlives an uninstall on purpose.
    # Losing it invalidates every issued token, and a reinstall that silently
    # mints a different one logs every user out with no message saying why.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.auth.jwtSecretKey }}: {{ .Values.auth.jwtSecret | default (randAlphaNum 64) | quote }}
{{- end -}}
