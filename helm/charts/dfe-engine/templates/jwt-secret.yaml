{{- /*
The JWT signing key, as a Secret every dfe-engine pod can read.

The engine MINTS a key at startup into DFE_SECRETS_PATH, which is an emptyDir --
per-pod and ephemeral. dfe-hunt-runner and dfe-keda-shim are SEPARATE pods, so
they never see it, fall back to the shipped dev placeholder, and DFESettings
rejects that under env=production with auth enabled:

  api.jwt_secret is the known dev placeholder but env is 'production' with auth
  enabled; set a strong DFE_API_JWT_SECRET

Both sidecar workloads crashloop on it while the engine itself stays up, because
only the engine can see what the engine minted.

GENERATED IN-CLUSTER by ESO's Password generator, not minted by the template: a
signing key the stack mints for itself must not make a vanilla cluster depend on
OpenBao, and it must not change when the chart is merely RE-RENDERED. Argo
renders with `helm template`, where `lookup` always returns nil, so a
lookup-guarded `randAlphaNum` produced a fresh key on every render, Reloader
rolled the engine, and every issued token died with the old key (#224).

refreshPolicy CreatedOnce writes the value once and never rotates it under live
sessions; refreshInterval "0" alone is not enough, because any spec-generation
bump (an Argo re-label is one) makes ESO try the generator again. Same mechanism
and same reasoning as dfe-ui's NextAuth secret and the ClickHouse admin password.
*/ -}}
{{- $name := .Values.auth.jwtSecretName -}}
{{- $key := .Values.auth.jwtSecretKey -}}
{{- if .Values.auth.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # helm.sh/resource-policy keep: the key outlives an uninstall on purpose.
    # Losing it invalidates every issued token, and a reinstall that silently
    # mints a different one logs every user out with no message saying why.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $key }}: {{ .Values.auth.jwtSecret | quote }}
{{- else if .Values.auth.jwtSecretCreate }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 64
  digits: 8
  symbols: 0          # alphanumeric -- avoids escaping in env and header contexts
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # keep protects this ExternalSecret from a helm uninstall, and it is the only
    # thing protecting the key: the Secret carries ESO's ownerReference, so
    # deleting the ExternalSecret by hand garbage-collects the key with it.
    helm.sh/resource-policy: keep
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ $key }}: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}-gen
{{- end }}
