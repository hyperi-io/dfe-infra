apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
      annotations:
        {{- include "dfe-common.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "dfe-common.serviceAccountName" . }}
      # Kubernetes injects a legacy Docker-link env var per Service in the namespace:
      # svc/dfe-keda-shim -> DFE_KEDA_SHIM_PORT="tcp://198.19.253.104:8080". That
      # SHADOWS the engine's own DFE_KEDA_SHIM_PORT setting (settings.py), which
      # expects an int, and the pod dies at startup with
      # "invalid literal for int() with base 10: 'tcp://...:8080'".
      #
      # DFE resolves services by DNS and reads none of these, so switch them off.
      # This kills the whole CLASS, not just keda-shim: any future Service whose name
      # uppercases onto a DFE_* setting would do the same thing. The alternative --
      # renaming the setting -- just moves the collision somewhere else.
      #
      # Live-proven: engine v1.10.4/v1.10.5/v1.10.6 all crashloop without this the
      # moment a dfe-keda-shim Service exists. It went unnoticed for 4 days because
      # the deploy was pinned to v1.10.3, BEHIND the setting that collides.
      enableServiceLinks: false
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: engine
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          ports:
            # Observability (health + /metrics), served by scalo's ServiceApp on
            # 9090 -- the port the prometheus scrape annotation already targets.
            - name: obs
              containerPort: 9090
            - name: http
              containerPort: 8000
          env:
            # Declare the deployment's posture to the engine. WITHOUT this the
            # engine's `env` defaults to "production" (settings.py), so a dev
            # cluster silently self-identifies as prod: every gitcrud write is
            # routed to a review PR (commit_policy.resolve_mode -> "pr" for any
            # non-dev posture) instead of committing to the deploy repo. The
            # deployment already declares its posture -- pass the SAME value the
            # dfe.hyperi.io/env label carries, so the two cannot drift.
            # Generic, not a dev shortcut: a customer's env: production still
            # gets the PR flow, which is the point.
            - name: DFE_ENV
              value: {{ .Values.env | quote }}
            # The engine settings loader reads DFE_CLICKHOUSE_* (or legacy
            # CLICKHOUSE_*), NOT a DFE_ENGINE_ prefix -- the old DFE_ENGINE_* names
            # were silently ignored, leaving CH at the localhost:9000 default. The
            # connection authenticates against the always-present `default` db;
            # the startup bootstrap CREATEs the DFE data database (clickhouse.database).
            # secure=false: in-cluster CH is plaintext HTTP on :8123 (the engine
            # default secure=true would fail the TLS handshake). The engine has NO
            # PostgreSQL (YAML/git SSoT) -- the old DFE_ENGINE_PG_* env was dead.
            - name: DFE_CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: DFE_CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: DFE_CLICKHOUSE_DATA_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: DFE_CLICKHOUSE_SECURE
              value: "false"
            # Config-registry directories. WITHOUT these the engine leaves every
            # registry uninitialised and the config API returns 503 not_configured.
            # All live under the (writable) config mount; the engine seeds defaults
            # + does git-native CRUD here.
            - name: DFE_SOURCES_DIR
              value: {{ .Values.config.mountPath }}/sources
            - name: DFE_SERVICES_CONFIG_YAML_DIR
              value: {{ .Values.config.mountPath }}/services
            - name: DFE_DEPLOYMENT_CONFIG_DIR
              value: {{ .Values.config.mountPath }}/deployments
            - name: DFE_SCHEMAS_DIR
              value: {{ .Values.config.mountPath }}/schemas
            - name: DFE_FIELDMAPS_DIR
              value: {{ .Values.config.mountPath }}/fieldmaps
            - name: DFE_HUNTS_DIR
              value: {{ .Values.config.mountPath }}/hunts
            - name: DFE_HUNTS_RULES_DIR
              value: {{ .Values.config.mountPath }}/rules
            - name: DFE_HUNTS_ALERT_DESTINATIONS_DIR
              value: {{ .Values.config.mountPath }}/alerts
            # The shared signing key. Supplying it means the engine adopts the
            # same key its sidecar pods read, instead of minting a private one
            # only it can see.
            - name: DFE_API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecretName }}
                  key: {{ .Values.auth.jwtSecretKey }}
            # Secrets the engine MINTS (JWT signing key, per-group CH pw) go under
            # the WRITABLE config mount. The default ./.secrets resolves to
            # /app/.secrets on the root-owned WORKDIR (non-writable) -> the engine
            # crashes minting the JWT signing key at startup. (Same fix as dfe-docker.)
            - name: DFE_SECRETS_PATH
              value: {{ .Values.config.mountPath }}/.secrets
            # Auth stores (accounts/groups/api-keys, + oidc-providers) -- same
            # trap as DFE_SECRETS_PATH: without this the auth bootstrap falls
            # back to ./config/auth under the read-only /app WORKDIR and the
            # pod crashloops at startup (v1.10.7+, dfe-engine#106). emptyDir =
            # per-pod ephemeral: fine at 1 replica; >1 replica needs shared
            # storage for cross-pod JWKS (image-side work, dfe-engine#106).
            - name: DFE_AUTH_DIR
              value: {{ .Values.config.mountPath }}/auth
            # The CLASS-WIDE guard for the same fallback: auth is not the only
            # startup mkdir that defaults under cwd -- the org and
            # service-surface registries (and rbac/connections.yaml lookup)
            # resolve config/<x> under /app when DFE_CONFIG_DIR is unset, so
            # fixing auth alone just moves the crash to the next registry.
            # Point the shared root at the writable config mount.
            - name: DFE_CONFIG_DIR
              value: {{ .Values.config.mountPath }}
            {{- with (include "dfe-common.otelEndpoint" .) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT   # self-monitoring; telemetry.mode-resolved
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: dfe-engine
          {{- if .Values.gitops.enabled }}
            - name: DFE_GITOPS_ENABLED
              value: "true"
            - name: DFE_GITOPS_REPO_URL
              value: {{ .Values.gitops.repoUrl | quote }}
            - name: DFE_GITOPS_BRANCH
              value: {{ .Values.gitops.branch | quote }}
            - name: DFE_GITOPS_LOCAL_PATH
              value: {{ .Values.gitops.localPath | quote }}
            - name: DFE_GITOPS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.credentialsSecret }}
                  key: username
            - name: DFE_GITOPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.credentialsSecret }}
                  key: password
          {{- end }}
          {{- if .Values.oidc.enabled }}
            # OIDC = Envoy-fronted: the gateway authenticates the user and
            # injects the X-Oidc-* identity headers, so the engine must trust
            # them (auth Path 1). Coupled to oidc.enabled -- fail closed when
            # OIDC is off (local-auth deployments ignore these spoofable headers).
            - name: DFE_AUTH_TRUST_PROXY_AUTH_HEADERS
              value: "true"
          {{- range $provider := .Values.oidc.providers }}
          {{- range $envVar, $secretKey := $provider.envMappings }}
            - name: {{ $envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ $provider.secretName }}
                  key: {{ $secretKey }}
          {{- end }}
          {{- end }}
          {{- end }}
          volumeMounts:
            # Config is WRITABLE: the engine is a git-native config control plane
            # -- it seeds defaults + commits CRUD here (DirectoryConfigStore).
            # readOnly broke registry init. (emptyDir is ephemeral; a real deploy
            # backs this with a PVC or the git config repo -- follow-up.)
            - name: config
              mountPath: {{ .Values.config.mountPath }}
            # Writable scratch: the container rootfs is read-only
            # (dfe-common.containerSecurityContext), so anything writing /tmp
            # needs this emptyDir.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.gitops.enabled }}
            - name: deploy-repo
              mountPath: {{ dir .Values.gitops.localPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Probes hit the observability port (#106), not the API port -- the
          # engine serves health on 9090 now (with /health/* aliases).
          livenessProbe:
            httpGet:
              path: /livez
              port: obs
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: obs
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          {{- if .Values.config.nfs.server }}
          nfs:
            server: {{ .Values.config.nfs.server }}
            path: {{ .Values.config.nfs.path }}
            readOnly: true
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gitops.enabled }}
        - name: deploy-repo
          emptyDir: {}
        {{- end }}
