{{- if .Values.persistence.enabled }}
{{- /*
  Local-PKI durability. The server mints its CA on first start and writes it to
  /etc/vpn/pki; on the container's writable layer that means every restart
  mints a new CA and every client config issued against the old one stops
  working. External PKI needs no volume, so the two are mutually exclusive.
*/}}
{{- if eq .Values.pki.mode "external" }}
{{- fail "culvert: persistence.enabled with pki.mode: external. External PKI is delivered by Secret and writes nothing durable, so the volume would sit empty -- turn one of the two off." }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dfe-common.fullname" . }}-pki
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
