apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # The engine's machine-JWT control surface (GET /team, connections,
    # sources) talks to the API directly; without this port the connect
    # black-holes on the ClusterIP and callers hang.
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
    {{- if .Values.otlp.enabled }}
    - name: otlp-grpc
      port: {{ .Values.otlp.grpcPort }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.otlp.httpPort }}
      targetPort: otlp-http
    {{- end }}
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
