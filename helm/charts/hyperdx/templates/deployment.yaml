apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
    spec:
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: hyperdx
          image: {{ include "dfe-common.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: api
              containerPort: {{ .Values.service.apiPort }}
            {{- if .Values.otlp.enabled }}
            - name: otlp-grpc
              containerPort: {{ .Values.otlp.grpcPort }}
            - name: otlp-http
              containerPort: {{ .Values.otlp.httpPort }}
            {{- end }}
          env:
            - name: CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.secretName }}
                  key: {{ .Values.clickhouse.secretKey }}
            - name: MONGO_URI
              value: {{ .Values.mongodb.uri | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://dfe-otel-collector-gateway.otel.svc.cluster.local:4318"
            {{- if .Values.dfeAuth.enabled }}
            # Trust Envoy/oauth2-proxy identity headers (no HyperDX login).
            # Maps the universal DFE contract onto the fork's DFE_AUTH_HEADER_*.
            - name: DFE_AUTH_MODE
              value: {{ .Values.dfeAuth.mode | quote }}
            - name: DFE_AUTH_HEADER_EMAIL
              value: {{ .Values.dfeAuth.headerEmail | quote }}
            - name: DFE_AUTH_HEADER_GROUPS
              value: {{ .Values.dfeAuth.headerGroups | quote }}
            - name: DFE_AUTH_DEFAULT_TEAM
              value: {{ .Values.dfeAuth.defaultTeam | quote }}
            {{- end }}
            {{- if .Values.casbin.enabled }}
            - name: CASBIN_PG_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.casbin.urlSecretName }}
                  key: url
            {{- end }}
            {{- if .Values.defaultConnections.enabled }}
            - name: DEFAULT_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.defaultConnections.secretName }}
                  key: DEFAULT_CONNECTIONS
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
