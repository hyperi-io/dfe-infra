project: dfe
component: hyperdx
env: local
cloud: local

# dfe-hyperdx fork image (combined API + App). CONFIRM the published image
# name/tag from the fork's CI before first deploy.
image:
  repository: ghcr.io/hyperi-io/dfe-hyperdx
  tag: ""  # defaults to Chart.appVersion (fork CODE_VERSION)
  pullPolicy: IfNotPresent

replicaCount: 1

# Upstream's usage-stats phone-home. OFF by default -- see the reasoning on the
# USAGE_STATS_ENABLED env in templates/deployment.yaml. Set true only if a deployer
# actively chooses to report their usage to HyperDX upstream.
usageStats:
  enabled: false

# Telemetry ClickHouse (external -- the cluster's clickhouse).
#
# host: the OPERATOR-emitted service. In cluster mode the ClickHouse operator emits
# ONLY a headless service (<name>-clickhouse-headless) -- there is no plain
# `dfe-clickhouse` service on any layout it produces, so the old default resolved to
# nothing and hyperdx would have failed its first connection. Same trap the loader hit.
# Override per deploy (external/managed ClickHouse just points elsewhere).
clickhouse:
  host: dfe-clickhouse-clickhouse-headless.clickhouse.svc.cluster.local
  port: 8123
  database: dfe
  # user/secret: EMPTY means connect as the operator's default user with no password,
  # which is how dfe-loader and the engine already connect to this cluster. The old
  # default was `admin` + the clickhouse-admin-password secret, and that user DOES NOT
  # EXIST here -- proven live: "code 516: admin: Authentication failed ... or there is
  # no user with such name". A deploy that provisions a real CH user sets these.
  user: ""
  secretName: ""
  secretKey: password

# Mongo-protocol metadata store (FerretDB, deployed separately).
# NOTE: the fork targets FerretDB 2.7 (DocumentDB Postgres extension). The
# existing dfe-infra ferretdb app is 1.24 on vanilla CNPG PG17 -- confirm/upgrade
# before deploy. Creds come from the ferretdb secret.
mongodb:
  uri: "mongodb://hyperdx:hyperdx@dfe-ferretdb.cnpg.svc.cluster.local:27017/hyperdx?authMechanism=PLAIN"

# DFE auth: trust Envoy/oauth2-proxy identity headers (no HyperDX login).
# Header names map the UNIVERSAL DFE contract (X-Oidc-Subject / X-Oidc-Groups)
# onto the fork's DFE_AUTH_HEADER_* config.
dfeAuth:
  enabled: true
  mode: oidc-proxy
  headerEmail: x-oidc-subject
  headerGroups: x-oidc-groups
  defaultTeam: dfe

# Casbin dropped (DFE authz standard, Cut A): dfe-engine is the ONE PDP and
# CH GRANTs are the authoritative data control, so hyperdx needs IDENTITY only
# (the dfeAuth header seam above) -- no per-route policy engine, no Postgres
# policy store. See project_dfe_authz_standard / project_hyperdx_embed.

# DEFAULT_CONNECTIONS bootstrap (JSON array). dfe-engine renders this from its
# ConnectionConfig (generate_default_connections_json); secret-backed.
defaultConnections:
  enabled: false
  secretName: dfe-hyperdx-connections   # key: DEFAULT_CONNECTIONS

# OTLP ingest (Path A: HyperDX collector). Path B replaces this with the DFE
# receiver/loader; toggle off when using DFE ingestion.
otlp:
  enabled: true
  grpcPort: 4317
  httpPort: 4318

service:
  type: ClusterIP
  port: 8080
  apiPort: 8000

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
