project: dfe
component: hyperdx
env: local
cloud: local

# OWNERSHIP: the dfe-engine repo is the controller and SSoT for the HyperDX
# integration (it integrates most closely). Anything HyperDX needs doing --
# fork, image, this chart's behaviour -- routes through a GitHub issue on
# dfe-engine first. EXCEPTION: time-critical, security-urgent, or a small
# change that clearly cannot impact dfe-engine may land directly here; then
# raise a dfe-engine issue noting it was done, for politeness.

# dfe-hyperdx fork image (combined API + App), published to GHCR by the fork's CI.
image:
  repository: ghcr.io/hyperi-io/dfe-hyperdx
  tag: ""  # defaults to Chart.appVersion (fork CODE_VERSION)
  # The immutable half of the pin; GHCR tags are mutable. == versions.yaml
  # digests.dfe-hyperdx (drift-checked). The tag and this must move together.
  digest: "sha256:9ddfc727828b8b97e3aff347c22083a20e317adfa7c5621ec2c563e3b1a79ae6"
  pullPolicy: IfNotPresent

# The image runs as USER node, which its node:alpine base creates as uid 1000, so
# the DFE default runAsUser 1000 matches and runAsNonRoot admits the pod.
# readOnlyRootFilesystem is off because the App is Next.js-based.
containerSecurityContext:
  readOnlyRootFilesystem: false

replicaCount: 1

# Upstream's usage-stats phone-home. OFF by default -- see the reasoning on the
# USAGE_STATS_ENABLED env in templates/deployment.yaml. Set true only if a deployer
# actively chooses to report their usage to HyperDX upstream.
usageStats:
  enabled: false

# Telemetry ClickHouse (external -- the cluster's clickhouse).
#
# host: the service the deploy actually emits. Single mode emits `dfe-clickhouse`;
# a cluster-mode operator emits only a headless `<name>-clickhouse-headless`.
# Override per deploy (external/managed ClickHouse just points elsewhere).
clickhouse:
  host: dfe-clickhouse.clickhouse.svc.cluster.local
  port: 8123
  database: dfe
  # Key names match every other chart and the shared overlay. They were
  # secretName/secretKey here alone, so the overlay's passwordSecretName never
  # matched and the deployment rendered with NO password block at all.
  user: ""
  passwordSecretName: ""
  passwordSecretKey: password
  # HTTPS to ClickHouse. HyperDX dials the connection dfe-engine hands it, so the
  # scheme and port follow the engine's; this chart only makes the CA trusted.
  # argocd/values/common.yaml turns it on; off here keeps a render with no CA
  # on plaintext.
  tls:
    enabled: false
    # Read for one thing: whether the in-cluster server has a CA and so serves
    # TLS at all (clickhouse-cluster's rule). The appsets set internalCA.present
    # from the edge label; an explicit issuerRef.name counts on its own, and an
    # external server (clickhouse.mode external) needs neither.
    issuerRef:
      name: ""
    internalCA:
      present: false
    # The CA that signed the server certificate, from a Secret or a ConfigMap in
    # this namespace, under dataKey, added to Node's trust with
    # NODE_EXTRA_CA_CERTS. Both empty leaves Node's own roots alone.
    ca:
      secretName: ""
      configMapName: ""
      dataKey: ca.crt

# Restart this workload when a Secret or ConfigMap it consumes changes. Node reads
# NODE_EXTRA_CA_CERTS once at start, so without this a rotated ClickHouse CA
# never reaches the running pod.
reload:
  enabled: true

# Mongo-protocol metadata store: the bundled FerretDB 2.x (helm/charts/ferretdb,
# DocumentDB PG backend) -- the fork's target. FerretDB 2.x auth is SCRAM-SHA-256
# against the backend's PostgreSQL users (PLAIN was 1.x), so the URI carries no
# authMechanism and $(MONGO_PASSWORD) is kubelet-expanded from the secret the
# ferretdb chart projects into this namespace. External endpoint: set uri to the
# full URI (inline creds) and passwordSecretName to "".
mongodb:
  uri: "mongodb://hyperdx:$(MONGO_PASSWORD)@dfe-ferretdb.cnpg.svc.cluster.local:27017/hyperdx?authSource=admin"
  passwordSecretName: dfe-ferretdb-password
  passwordSecretKey: password

# DFE auth. Two modes, and they read different settings.
#
# oidc-proxy (default): dfe-engine is the single JWT issuer and hyperdx verifies
# its ES384 token against the engine's JWKS. `engineJwksUrl` is REQUIRED -- the
# fork throws without it, and the middleware swallows that into a fall-through,
# so every token-bearing request lands unauthenticated and 401s.
#
# header-dev: trust identity headers from a proxy, no token verification. Only
# this mode reads headerEmail/headerGroups.
dfeAuth:
  enabled: true
  mode: oidc-proxy
  # The engine's in-cluster service. The JWKS URL is derived from these, which is
  # correct wherever the engine is co-deployed; a split or preview deployment
  # overrides engineNamespace, and an out-of-cluster engine sets engineJwksUrl.
  engineService: dfe-engine
  engineNamespace: ""  # empty -> this release's namespace
  enginePort: 8000
  engineJwksUrl: ""  # set to bypass the derivation entirely
  # Enforced as the `iss` claim when set; empty accepts any issuer.
  engineIssuer: ""
  headerEmail: x-oidc-subject
  headerGroups: x-oidc-groups
  defaultTeam: dfe

# Express session signing key, generated once in-cluster by
# templates/generated-keys.yaml. Unset, the image signs sessions with a key
# published in upstream's source.
sessionSecret:
  name: dfe-hyperdx-session
  key: session-secret
  # false when the deployment supplies a Secret under `name` itself; the chart
  # then creates nothing and the pod still reads it.
  create: true

# Key that encrypts the third-party tokens HyperDX stores (TOKEN_ENCRYPTION_KEY),
# generated once in-cluster by templates/generated-keys.yaml as 64 hex chars.
# Unset, those tokens are stored in plain text. A deployment supplying its own
# (create: false) must give 64 hex chars or base64 of exactly 32 bytes: the
# image refuses to start on anything else.
tokenEncryption:
  name: dfe-hyperdx-token-encryption
  key: token-encryption-key
  create: true

# Casbin dropped (DFE authz standard, Cut A): dfe-engine is the ONE PDP and
# CH GRANTs are the authoritative data control, so hyperdx needs IDENTITY only
# (the dfeAuth header seam above) -- no per-route policy engine, no Postgres
# policy store. See project_dfe_authz_standard / project_hyperdx_embed.

# DEFAULT_CONNECTIONS bootstrap (JSON array). dfe-engine renders this from its
# ConnectionConfig (generate_default_connections_json); secret-backed.
defaultConnections:
  enabled: false
  secretName: dfe-hyperdx-connections   # key: DEFAULT_CONNECTIONS

# Pre-canned dashboards. dfe-engine is the SSoT for the CONTENT; this chart only
# carries it. An init container on the ENGINE image writes the shipped Template
# JSON into an emptyDir the hyperdx container mounts, so there is exactly one copy
# of a dashboard in the product and bumping the engine pin ships new dashboards.
#
# HyperDX's own provisioner then reads that directory on a one-minute cron and
# upserts each file per team. Two flags matter:
#   allTeams    - every team, not one hard-coded id; a tenant team seeded later
#                 still gets its dashboards.
#   requireRefs - skip a dashboard whose source names the team does not hold.
#                 That is what keeps operator telemetry off a tenant: only the
#                 platform team has `otel_metrics`, so only it gets the platform
#                 dashboards. No allow-list to maintain.
#
# image.tag is pinned rather than derived: Helm cannot read a sibling chart's
# appVersion, so this tracks versions.yaml apps.dfe-engine like every other pin.
dashboards:
  enabled: true
  mountPath: /etc/hyperdx/dashboards
  allTeams: true
  requireRefs: true
  image:
    repository: ""     # empty -> {{ global.registry }}/dfe-engine
    tag: "v1.22.15"     # == versions.yaml apps.dfe-engine (drift-checked)
    # The immutable half of the pin; GHCR tags are mutable. This init container
    # runs the ENGINE image, so it is versions.yaml digests.dfe-engine (drift-checked).
    digest: "sha256:3720bf69a4622727710eea99f9f0b6783fdc2a016120adfdba27c35dcb89f662"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Local email/password login+register pages (dev-only in the image). Opt-in
# stopgap for deployments whose OIDC wiring has not landed yet.
localAuthPages:
  enabled: false

# Browser-facing base URL. Empty derives https://{hostnames.hyperdx}.{domain};
# the image's localhost default breaks post-login redirects and the session
# cookie behind the gateway.
frontendUrl: ""

# OTLP ingest (Path A: HyperDX collector). Path B replaces this with the DFE
# receiver/loader; toggle off when using DFE ingestion.
otlp:
  enabled: true
  grpcPort: 4317
  httpPort: 4318

service:
  type: ClusterIP
  port: 8080
  apiPort: 8000

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
