project: dfe
component: hyperdx
env: local
cloud: local

# hyperi-hyperdx fork image (combined API + App). CONFIRM the published image
# name/tag from the fork's CI before first deploy.
image:
  repository: ghcr.io/hyperi-io/hyperi-hyperdx
  tag: ""  # defaults to Chart.appVersion (fork CODE_VERSION)
  pullPolicy: IfNotPresent

replicaCount: 1

# Telemetry ClickHouse (external -- the cluster's clickhouse).
clickhouse:
  host: dfe-clickhouse.clickhouse.svc.cluster.local
  port: 8123
  database: dfe
  user: admin
  secretName: clickhouse-admin-password
  secretKey: password

# Mongo-protocol metadata store (FerretDB, deployed separately).
# NOTE: the fork targets FerretDB 2.7 (DocumentDB Postgres extension). The
# existing dfe-infra ferretdb app is 1.24 on vanilla CNPG PG17 -- confirm/upgrade
# before deploy. Creds come from the ferretdb secret.
mongodb:
  uri: "mongodb://hyperdx:hyperdx@dfe-ferretdb.cnpg.svc.cluster.local:27017/hyperdx?authMechanism=PLAIN"

# DFE auth: trust Envoy/oauth2-proxy identity headers (no HyperDX login).
# Header names map the UNIVERSAL DFE contract (X-Oidc-Subject / X-Oidc-Groups)
# onto the fork's DFE_AUTH_HEADER_* config.
dfeAuth:
  enabled: true
  mode: oidc-proxy
  headerEmail: x-oidc-subject
  headerGroups: x-oidc-groups
  defaultTeam: dfe

# Casbin RBAC policy store (CNPG Postgres). dfe-engine is the SSoT and writes
# policies here. URL supplied via secret (contains credentials).
casbin:
  enabled: true
  urlSecretName: dfe-hyperdx-casbin   # key: url

# DEFAULT_CONNECTIONS bootstrap (JSON array). dfe-engine renders this from its
# ConnectionConfig (generate_default_connections_json); secret-backed.
defaultConnections:
  enabled: false
  secretName: dfe-hyperdx-connections   # key: DEFAULT_CONNECTIONS

# OTLP ingest (Path A: HyperDX collector). Path B replaces this with the DFE
# receiver/loader; toggle off when using DFE ingestion.
otlp:
  enabled: true
  grpcPort: 4317
  httpPort: 4318

service:
  type: ClusterIP
  port: 8080
  apiPort: 8000

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
