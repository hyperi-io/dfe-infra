project: dfe
component: kafka
env: local
cloud: local

# Namespace the DFE apps run in, from the cluster's dfe.hyperi.io/dfe_namespace annotation. Empty skips the app-namespace credential projection.
appNamespace: ""

# SCRAM-SHA-512 is the auth mechanism on every broker DFE deploys, Strimzi and Redpanda alike (docs/deployment/kafka/README.md).
# msk_iam still renders at mode=external, but scalo-rs and scalo-py reject it, so no DFE app connects with it (dfe-infra#292, not planned).
kafka:
  # disabled: no broker (slim and mesh use gRPC). single: one broker as a plain StatefulSet, no operator.
  # cluster: multi-broker through the operator. external: deploy nothing and connect to a supplied bootstrap.
  # The profile sets the default: slim and mesh disabled, single single, scale cluster.
  mode: disabled
  # strimzi (Apache-2.0) or redpanda (BSL, needs redpanda.acceptLicense: docs/deployment/kafka/redpanda-limitations.md).
  provider: strimzi
  name: dfe-kafka
  version: "4.3.1"
  # Digest of apache/kafka at the version above, for single mode. == versions.yaml services-digests.kafka-version
  imageDigest: "sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837"
  # The Kafka CLI image for the MSK bootstrap Job, the smoke test and dfe-ops client pods. Its -kafka- suffix must equal version.
  cliImage: "quay.io/strimzi/kafka:1.3.0-kafka-4.3.1@sha256:1f189b1f0f32684302d8b018b1d21b411e2469a9c465fbdc18fa3599cb5bbdad"
  # Strimzi cluster mode only; empty lets Strimzi raise it, one way, as soon as a version roll finishes (docs/deployment/upgrades.md).
  metadataVersion: ""
  # Brokers at mode=cluster. Single mode forces 1.
  replicas: 3
  # Strimzi only: spread the brokers, and the dedicated controllers when controllerPool is on, across nodes. DoNotSchedule keeps a broker Pending rather than share a node unevenly.
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  # Sources this deployment carries, for the KEDA triggers only: the autoscaler needs the topic name to read a consumer group's lag.
  # dfe-engine creates the topics from dfe-schemas, and this chart creates none. Each entry has a name, an optional partitions (that source's trigger ceiling, dfe-infra#148)
  # and an optional transform, which overrides kafka.autoscaling.transformKind. Example: [{name: okta}, {name: m365, partitions: 24}, {name: some_filebeat_source, transform: elastic}]
  landingTopics:
    sources: []
    suffix: _land
  # Redpanda provider options, behind the BSL gate. Deployed through the Redpanda operator, as Strimzi is.
  redpanda:
    acceptLicense: false
    image:
      repository: docker.redpanda.com/redpandadata/redpanda
      # == versions.yaml services.redpanda-version
      tag: "v26.2.6"
      # Single mode only, because the operator's chart refuses a tag that is not bare semver. == versions.yaml services-digests.redpanda-version
      digest: "sha256:8b1076e0d61bfceb66594dc01536427ce0b529f8ead35fdab9763ab6085891ce"
    auth:
      # The bootstrap superuser the operator creates and manages, and whose password Secret it generates.
      superuserName: "admin"
  # mode=external: connect to a supplied bootstrap. auth.type is scram, tls or msk_iam. scram and tls use a Vault-backed secret.
  # msk_iam has no static secret, and scalo rejects it, so no app connects (dfe-infra#292).
  external:
    bootstrap: ""
    # The managed broker's own partition count (its num_partitions tofu variable), read verbatim because kafka.replicas is not the managed broker count.
    # Empty falls back to the chart's formula, a known gap until it is wired from the dial.
    numPartitions: ""
    # Which managed or supplied Kafka this is, a key in the provider table (helm/library/dfe-common/templates/_kafka.tpl): strimzi, redpanda, msk, redpanda-cloud, confluent-cloud,
    # msk_iam (renders, scalo rejects it, dfe-infra#292), or the -no-tls pair for a cleartext listener. security.protocol and sasl.mechanism derive from it, never by hand.
    # confluent-cloud is the one PLAIN target, since Confluent Cloud has no SCRAM and its API key is the username. It runs over SASL_SSL (dfe-infra#9, dfe-engine#98).
    # Its broker auto-create is Dedicated-only, so topics go through the engine's topic-admin path. Guides: docs/deployment/kafka/.
    # Set with appNamespace, the credential is read from <project>/<env>/kafka/<provider> and projected into the app namespaces, and auth.secretName is not rendered.
    # Empty keeps the legacy shape: a password-only secret and nothing derived.
    provider: ""
    auth:
      type: scram
      secretName: dfe-kafka-external
      secretStoreName: dfe-secret-store
    # AWS MSK bootstrap Job, rendered only at mode=external with provider: msk (msk-bootstrap-job.yaml). Why it exists: docs/deployment/kafka/aws-msk-operations.md.
    msk:
      # The SASL/IAM bootstrap string on port 9098 (the msk module's bootstrap_iam output). Empty renders no Job.
      bootstrapIam: ""
      # The SCRAM principal the ACLs are written for. Must equal the username in the AmazonMSK_ secret.
      scramUsername: dfe-kafka-user
      # ARN of the AmazonMSK_ secret (the msk module's credential_ref output). Set, it is the one copy of the credential: the apps' copy reads its password from here through user.password.unprefixedStoreName.
      credentialRef: ""
      # Signing region. Empty leaves it to the AWS_REGION the EKS Pod Identity agent injects.
      region: ""
      bootstrap:
        # The OFF switch: the mode and provider gates keep the Job out of non-MSK deployments.
        enabled: true
        # Must match the Pod Identity association's service account and release namespace, or the pod gets no AWS credential.
        serviceAccount: dfe-kafka-bootstrap
        backoffLimit: 5
        # Seconds the finished Job survives. Its pod log is the only record of the ACLs written.
        ttlSecondsAfterFinished: 600
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # kafka.cliImage has no MSK IAM auth jar, so an init container fetches and verifies it.
        iamAuth:
          # An aws/aws-msk-iam-auth release tag.
          version: "2.3.9"
          # sha256 of aws-msk-iam-auth-<version>-all.jar as published. A mismatch fails the Job.
          sha256: "922064f312ddc8a5f3dbe65fcef3d02ddbd588a02e3a6f0fca4b5a4dbec1ba43"
          # Empty derives the GitHub release URL from version. An air-gapped deploy sets a mirror, and the checksum must still match.
          url: ""
  # Decided at deploy and refused afterwards (the engine holds it as a protected var). Matrix: docs/deployment/storage.md.
  # local keeps every segment on the PVC. tiered-object moves closed segments to object storage (KIP-405) and the PVC sizes the hot window.
  # tiered-object is cluster mode with strimzi only, because tieredStorage is a Strimzi Kafka CR field.
  storageModel: local
  # Strimzi operator version, must match versions.yaml strimzi-kafka-operator. Below 0.38.0 the render fails, since tieredStorage did not exist.
  operatorVersion: "1.2.0"
  # Strimzi supports type=custom only and ships no RemoteStorageManager, so the broker image must carry a plugin on classPath.
  tieredObject:
    className: ""
    classPath: ""
    # Plugin config keys verbatim. No secrets here, because they would be committed to git.
    config: {}
  # Object store credential. Never in config: wired into the broker environment from an ESO-materialised Secret.
  objectStore:
    secretName: dfe-kafka-tiered
    secretStoreName: dfe-secret-store
    # Where the credential sits in the store. Empty derives <project>/<env>/kafka/tiered, which is frozen. Set it to reuse an entry, e.g. services/minio on a store mounting kv.
    remoteKey: ""
    accessKeyProperty: access_key_id
    secretKeyProperty: secret_access_key
  storage:
    type: persistent-claim
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # The largest single event the chain carries, in bytes: one figure for broker message.max.bytes, replica.fetch.max.bytes and every topic's max.message.bytes.
  # Why 16 MiB: docs/deployment/kafka/README.md. scripts/resolve_sizing.py overrides it from sizing.yaml's event.message_chain_bytes.
  messageMaxBytes: 16777216
  broker:
    # Broker NIC in MB/s, full duplex, for Cruise Control's network goals. 1250 is 10 GbE. Set the real NIC: a figure above it makes the goals non-binding.
    networkMbS: 1250
  # Partition derivation: one number for num.partitions and every landing topic. Formula and rationale: docs/deployment/kafka/README.md, "Sizing dials". Increase-only, so the resolver never lowers it.
  sizing:
    # Consumer-group parallelism ceiling: a group has at most one consumer per partition.
    consumerCeiling: 10
    # Expected peak ingest in MB/s. 0 drops the throughput term.
    peakMbS: 0
    perPartitionCapMbS: 15
    minPartitionsPerBroker: 4
  # Retention derivation (formulas: docs/deployment/kafka/README.md, "Sizing dials"). Time retention is how long a consumer may be down before events are lost.
  retention:
    assumedConsumerDowntimeH: 24
    # Hours of dfe-archiver lag added on top. Raise this rather than the downtime figure.
    archiverLagH: 0
    # Fraction of the PVC the log may occupy. The rest is index, snapshot and in-flight segment space.
    usableFraction: 0.85
  # The KRaft broker profile, applied by the Strimzi Kafka CR and the single-broker server.properties. Redpanda maps the equivalents in redpanda.yaml.
  profile:
    # Cluster mode only: RF3 and minISR2 fail on one broker.
    scale:
      # Kafka's thread defaults are fixed, not core-scaled. Raise io before network. Below 30% idle on RequestHandlerAvgIdlePercent or NetworkProcessorAvgIdlePercent means still too low.
      numNetworkThreads: 8
      numIoThreads: 16
      # Follower fetch threads. The default of 1 serialises replication across every leader a broker follows.
      numReplicaFetchers: 2
      # Log recovery per data dir decides how long a crashed broker stays down.
      numRecoveryThreadsPerDataDir: 8
      # With the client's acks=all (idempotence implies it), survives one broker loss. Both clamp to the broker count at render.
      replicationFactor: 3
      minInsyncReplicas: 2
      # Off: dfe-engine creates the landing and DLQ topics at startup with explicit partition counts (dfe-infra#148).
      autoCreateTopics: false
      # The four thread dials render only at a broker CPU limit (else request) of this many vCPU or more. Below it they only add context switching.
      threadDialVcpuFloor: 4
    single:
      # On: the single tier has no topic operator to create the receiver's dynamic {source}_land topics.
      autoCreateTopics: true

  # Cruise Control, on by default at cluster mode. Kafka places partitions stickily, so without a rebalancer a scale-out leaves the load where it was. A single broker has none.
  rebalancing:
    # The OFF switch. Enabling writes metric.reporters into every broker, so flipping it rolls all brokers.
    enabled: true
    # Replica movement cap in bytes/s. Strimzi leaves it unlimited when unset. Move it with kafka.broker.networkMbS.
    replicationThrottleBytesS: 314572800
    # Strimzi's default goal order with LeaderReplicaDistributionGoal and LeaderBytesInDistributionGoal promoted to follow the seven hard goals, and nothing else reordered.
    # Rendered into both rebalance templates (kafka-rebalance-templates.yaml). [] falls back to Cruise Control's default. Why: docs/deployment/kafka/autoscaling.md.
    goals:
      - RackAwareGoal
      - MinTopicLeadersPerBrokerGoal
      - ReplicaCapacityGoal
      - DiskCapacityGoal
      - NetworkInboundCapacityGoal
      - NetworkOutboundCapacityGoal
      - CpuCapacityGoal
      - LeaderReplicaDistributionGoal
      - LeaderBytesInDistributionGoal
      - ReplicaDistributionGoal
      - PotentialNwOutGoal
      - DiskUsageDistributionGoal
      - NetworkInboundUsageDistributionGoal
      - NetworkOutboundUsageDistributionGoal
      - CpuUsageDistributionGoal
      - TopicReplicaDistributionGoal
      - IntraBrokerDiskCapacityGoal
      - IntraBrokerDiskUsageDistributionGoal
    # Cruise Control's pod. Strimzi sets no defaults, so unset it is the first thing evicted.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    # The Cruise Control UI, deployed wherever the rebalancer is. Strimzi ships none. docs/deployment/kafka/autoscaling.md.
    ui:
      # Follows kafka.rebalancing.enabled: a UI over an off rebalancer reports an empty cluster.
      enabled: true
      # linkedin/cruise-control-ui publishes a tarball and no image, so the pod fetches and checksum-verifies it and nginx serves it, as the MSK bootstrap Job does its jar.
      release:
        version: "0.4.0"
        # Empty derives the GitHub release URL. Set a mirror for pods with no egress to github.com.
        url: ""
        # sha256 of cruise-control-ui-<version>.tar.gz. Nothing upstream signs it, so this is the whole integrity check.
        sha256: "aa490482b023feb251651d1c86121a0625a515d7f3bd422f161b5206afbd383f"
      # The static server, and the proxy hop that holds the API credential.
      image:
        repository: nginxinc/nginx-unprivileged
        tag: "1.31.7-trixie"   # == versions.yaml services.nginx-unprivileged (drift-checked)
        # == versions.yaml services-digests.nginx-unprivileged (drift-checked).
        digest: "sha256:09b0d3eda2aa592d2487f284519419015cab010d7df16cd0fe224b585fc60eb6"
        pullPolicy: IfNotPresent
      # Sized for a static file server read by a few admins.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    redpanda:
      # node_add or off. Redpanda's default, continuous, is an Enterprise feature, and the chart refuses it. node_add moves replicas onto a new broker.
      partitionAutobalancingMode: node_add
      # Recovery bandwidth per sender in bytes/s. Redpanda's own default, pinned.
      raftLearnerRecoveryRate: 104857600
  # A separate KRaft controller pool at cluster mode. In combined mode a broker under GC or IO pressure is the metadata quorum, so separate is recommended for a new deployment (docs/deployment/kafka/README.md, "Sizing dials").
  # scripts/resolve_sizing.py sets it true in the values it writes.
  controllerPool:
    # false (combined) is the chart default. Flipping it on a live cluster re-forms the metadata quorum, and sizing.yaml's controller_mode lock refuses that without --migrate.
    enabled: false
    # Three tolerates losing one. Controllers are sized by partition count, not ingest.
    replicas: 3
    # Per controller: 1 dedicated vCPU, 4 GB RAM, 1 GB heap or more. The memory limit equals the request so the pod is not evicted for the heap it sized from the limit.
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
    storage:
      # The metadata log and snapshots use 10-20 GiB at our partition counts. A floor, not an estimate that grows with ingest.
      size: 20Gi
      storageClass: ""
  # Broker disk pressure, a PrometheusRule on the kubelet's volume stats for each broker PVC. Retention holds a record for its whole window, so an undersized disk fills instead of dropping data.
  # Renders at strimzi cluster mode where the cluster serves monitoring.coreos.com/v1.
  diskAlert:
    enabled: true
    # Percent of the PVC used before each level fires. warning < critical.
    warningPercent: 70
    criticalPercent: 85
    # How long the volume stays over a level before it fires.
    for: 10m
  # Broker-count autoscaling by KEDA (kafka-autoscaler.yaml) on the broker KafkaNodePool. Scale-out is automatic and scale-in is off below. Renders at strimzi cluster mode only. docs/deployment/kafka/autoscaling.md.
  autoscaling:
    enabled: true
    # KEDA maxReplicaCount. There is no floor dial: minReplicaCount is kafka.replicas. Keep it under the sizing-derived partition count (dfe-kafka.partitions) so an added broker gets partitions.
    maxBrokers: 6
    # KEDA pollingInterval in seconds, for both triggers.
    pollingInterval: 30
    # Lag on one source's landing topic, in its transform's consumer group, before KEDA asks for another broker. Shared by every per-source trigger.
    lagThreshold: 10
    # The transform kind a source's consumer group is named for (dfe-transform-{kind}-{source}), unless kafka.landingTopics.sources[].transform overrides it. vrl is the generic app, elastic the filebeat catalogue.
    transformKind: vrl
    # Per-broker capacity in MB/s for the PromQL trigger, which divides total bytes-in by it. Read only when metrics.usePrometheus is true.
    bytesInPerBrokerThresholdMBs: 80
    metrics:
      # The OFF switch. The on-prem cluster has no PromQL-queryable backend, so enable it only with a Prometheus-compatible endpoint and Strimzi JMX metrics, which this chart does not wire.
      # The render fails when this is true with no URL.
      usePrometheus: false
      prometheusUrl: ""
    # The OFF switch. Once KEDA scales brokers out they stay out until kafka.replicas is raised or this is on, because scale-in evacuates partitions first (the remove-brokers template).
    scaleIn:
      enabled: false
      # HPA scaleDown stabilisation window in seconds. The HPA API caps it at 3600.
      cooldownSeconds: 1800

# DFE service user (SCRAM-SHA-512)
user:
  name: dfe-kafka-user
  authentication:
    type: scram-sha-512
  password:
    # Reads the SCRAM password from the secrets store, which the deploy layer seeds (terraform/modules/tf-secrets seed_kafka_user). ESO projects it into this namespace and the app namespace.
    # Needs the store seeded first (tofu apply on tf-secrets). false falls back to a User Operator password in the broker namespace only, which leaves the app namespace with no dfe-kafka-user.
    # Why the store: docs/deployment/kafka/README.md, "Service user credential".
    fromSecretsStore: true
    secretStoreName: dfe-secret-store
    # The store with no path prefix, for a secret named outside the path: MSK's own (kafka.external.msk.credentialRef).
    unprefixedStoreName: dfe-secret-store-unprefixed
    extraAppNamespaces: []

# Tolerations for the dedicated node pools scripts/resolve_sizing.py taints. Inert without such a taint. An overlay's nodeScheduling.tolerations replaces this list.
nodeScheduling:
  tolerations:
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: kafka-broker
      effect: NoSchedule
    - key: dfe.hyperi.io/workload
      operator: Equal
      value: kraft-controller
      effect: NoSchedule
  # The dedicated pools this cluster runs, read by layer2-data from the cluster secret. A named pool is required by its pods.
  dedicatedPools: []
