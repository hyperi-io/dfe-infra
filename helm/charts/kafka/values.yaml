project: dfe
component: kafka
env: local
cloud: local

# Namespace the DFE apps run in. Supplied by the appset from the cluster's
# dfe.hyperi.io/dfe_namespace annotation (the SAME annotation layer2-apps uses to
# place the apps), so the two can never drift. Empty -> the app-namespace credential
# projection is skipped entirely.
appNamespace: ""

# DFE KAFKA AUTH STANDARD: SASL/SCRAM-SHA-512, everywhere, the same way.
# SCRAM-512 is the ONE auth mechanism that works reliably and identically across
# every option -- Strimzi (local/k8s), Redpanda, and every cloud-managed Kafka
# (Confluent, MSK SASL/SCRAM). It is the DFE standard for all deployed brokers.
# (mode=external may use msk_iam where the supplied broker mandates IAM, but the
# DFE-owned brokers are always SCRAM-512.) BOTH provider paths now enforce it:
# Strimzi via its listeners + KafkaUser, Redpanda via the operator's Redpanda CR
# (auth.sasl) + User CR -- both mint a dfe-kafka-user/password Secret of the same
# shape, so clients authenticate identically regardless of provider.
kafka:
  # Deployment mode (DFE owns its substrate; deploy unless external given):
  #   disabled -> no broker (the brokerless tiers slim + scale-mesh use gRPC)
  #   single   -> 1 broker, NON-OPERATOR standalone StatefulSet (single tier),
  #               like ClickHouse-single -> no Strimzi/Redpanda operator needed.
  #   cluster  -> multi-broker via the OPERATOR (scale tier); replicas below.
  #   external -> deploy nothing; connect to a supplied bootstrap (BYO/Confluent/MSK)
  # Profile sets the default (slim + scale-mesh -> disabled, single -> single,
  # scale -> cluster).
  mode: disabled
  # Broker provider when deployed: strimzi (default, Apache-2.0) or redpanda
  # (opt-in, BSL -- see docs/REDPANDA-LIMITATIONS.md; requires redpanda.acceptLicense).
  provider: strimzi
  name: dfe-kafka
  version: "4.2.0"
  # cluster node count. Defaults to 3; set higher for more brokers.
  # (single mode forces 1.)
  replicas: 3
  # Spread brokers across k8s workers (best-effort; never blocks scheduling).
  podSpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
  # The main data path's landing topic, created up-front so a BARE deploy can
  # come up: dfe-loader auto-discovers *_land topics and treats "none found" as
  # FATAL, so with no topic it crashloops until someone publishes -- which nothing
  # can do through a loader that is down. See kafka-bootstrap-topics.yaml for the
  # full reasoning + the name's derivation (receiver default_source + topic_suffix).
  # Turn off only for a deploy that provisions its topics some other way.
  defaultTopic:
    create: true
    name: main_land
    partitions: 3
    # Clamped to kafka.replicas at render -- asking for more replicas than brokers
    # leaves the topic un-Ready forever. The single tier has one broker and hard-
    # codes 1.
    replicationFactor: 3
  # The DFE DLQ standard: one dead-letter topic per fleet app plus one shared
  # topic for the transform family, pre-created like the landing topic above.
  # The fleet's containers run a read-only rootfs, so the file DLQ backend is a
  # no-op (EROFS) and kafka is every app's DLQ backend -- and a DLQ write
  # happens AT failure time, the one moment nothing can be creating topics.
  # Names are product policy; app charts point their DLQ at these by default.
  # Override per deployment only alongside the matching app-chart dlq.topic.
  # Broker auto-create stays ON (the receiver's dynamic {source}_land topics
  # need it), so a produce racing the wave-1 create can win with broker
  # defaults -- the idempotent create then keeps that topic's settings.
  dlqTopics:
    create: true
    # Poison messages are low-volume and read by a human, not a consumer group.
    partitions: 1
    # Clamped to kafka.replicas at render, like defaultTopic.
    replicationFactor: 3
    # Per-topic broker config for every DLQ topic. Retention runs longer than
    # the 72h data-topic default: a poisoned message is exactly the record an
    # operator must still find days later, and it exists nowhere else once its
    # source offset is committed.
    config:
      retention.ms: "604800000"  # 7 days
    names:
      - dfe_receiver_dlq
      - dfe_loader_dlq
      - dfe_archiver_dlq
      - dfe_fetcher_dlq
      - dfe_transform_dlq
  # The single tier's bootstrap-topics Job (the cluster tier uses CRs and runs
  # no pod of its own).
  topicJob:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  # Redpanda provider opts (BSL gate). Deployed via the Redpanda OPERATOR
  # (Redpanda + User CRDs), the same operator+thin-CR model as Strimzi.
  redpanda:
    acceptLicense: false
    image:
      repository: docker.redpanda.com/redpandadata/redpanda
      # Broker tag the operator chart 26.1.6 pairs with (see versions.yaml).
      tag: "v26.1.8"
    auth:
      # Bootstrap superuser the operator creates + manages (its admin identity
      # for reconciling the User CR). Operator generates its password Secret.
      superuserName: "admin"
  # External Kafka (mode=external): connect to a supplied bootstrap endpoint.
  # auth.type: scram | tls | msk_iam. scram/tls use a Vault-backed secret; msk_iam
  # uses AWS IAM (IRSA/workload-identity, SASL OAUTHBEARER) -- no static secret.
  external:
    bootstrap: ""
    auth:
      type: scram
      secretName: dfe-kafka-external
      secretStoreName: dfe-secret-store
  # Storage model, decided at deploy and refused afterwards (the engine holds
  # kafka.storageModel as a protected var). Named <family>-<bulk> in the
  # suite-wide vocabulary; full matrix: docs/deployment/storage.md
  #   local          -> every segment stays on the PVC, which is the capacity
  #                     ceiling.
  #   tiered-object  -> closed segments move to object storage (KIP-405 tiered
  #                     storage) and the PVC sizes the hot window only.
  # tiered-object is CLUSTER mode with the strimzi provider only: it is a
  # Strimzi Kafka CR field, and the single tier runs no operator.
  storageModel: local
  # Strimzi operator version this deployment runs -- MUST match versions.yaml
  # strimzi-kafka-operator. spec.kafka.tieredStorage landed in 0.38.0, so a lower
  # pin fails the render rather than emitting config the operator drops silently.
  operatorVersion: "0.51.0"
  # Plugin binding for storageModel: tiered-object. Strimzi supports type=custom
  # ONLY: it ships no RemoteStorageManager, so the broker image must carry a
  # plugin on classPath.
  tieredObject:
    className: ""
    classPath: ""
    # Plugin config keys verbatim (bucket, region, chunk size, ...). Secrets here
    # would be committed to git; use the environment instead.
    config: {}
  # Object bulk store credential. It NEVER appears in config -- the plugin reads
  # it from the environment, wired from an ESO-materialised Secret.
  objectStore:
    secretName: dfe-kafka-tiered
    secretStoreName: dfe-secret-store
    # Where the credential sits in the store. Empty derives the DFE-seeded path
    # <project>/<env>/kafka/tiered, which is frozen: moving it would strand a
    # deployment that seeded there and never set this. Set it to reuse an
    # existing entry, e.g. services/minio on a store mounting kv.
    remoteKey: ""
    # Field names within that entry.
    accessKeyProperty: access_key_id
    secretKeyProperty: secret_access_key
  storage:
    type: persistent-claim
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Broker/topic defaults -- DFE's opinionated, minimal, scale-safe baseline.
  # Applied by the Strimzi Kafka CR (cluster) + the non-operator single-broker
  # server.properties; the Redpanda paths map the equivalents (redpanda.yaml
  # clusterSpec.config.cluster). Full rationale + 2026 sources: docs/kafka/README.md.
  config:
    # compression.type=producer: the broker stores exactly the codec the client
    # sent, so it never decompress-recompresses on the ingest hot path. scalo's
    # client sizing profile OWNS the codec (lz4 default; zstd opt-in for
    # storage-bound topics). A fixed broker codec (e.g. zstd) that differs from the
    # producer's (lz4) forces broker-side re-compression on every produce -- avoid.
    compressionType: producer
    # Time-based retention only (log.retention.bytes left unset = -1). 72h exceeds
    # the max expected consumer downtime and DFE also archives to object storage via
    # dfe-archiver, so time-retention is the durable, portable default. Size-based
    # retention is PVC-specific -- set log.retention.bytes to match storage.size per
    # deploy; never bake a universal size (it can delete un-consumed forensic data).
    logRetentionHours: "72"
    # 512 MiB segments: finer retention granularity than the 1 GiB default (a
    # segment is only deletable once closed) while keeping open-file counts sane.
    # Raise toward 1 GiB on very-high-partition-density brokers.
    logSegmentBytes: "536870912"
    # 12 partitions: highly divisible (2/3/4/6/12) for balanced leadership as the
    # broker count grows, plus headroom for consumer-group parallelism. Keyed topics
    # cannot be repartitioned later without breaking key->partition mapping, so a
    # modest over-provision is deliberate. KRaft removes the old partition ceilings.
    numPartitions: "12"
    # Durability triad: RF3 + minISR2 + client acks=all (scalo enables idempotence
    # by default -> acks=all). Tolerates one broker loss with no data loss. RF is
    # clamped to the broker count for the single/small tiers (min(RF, replicas)).
    defaultReplicationFactor: "3"
    minInsyncReplicas: "2"
    # Never elect an out-of-sync replica as leader -- a data-forensics engine favours
    # consistency over availability. Kafka 4.x already defaults this false; pinned
    # here so the durability contract is explicit and auditable.
    uncleanLeaderElection: "false"
    # message.max.bytes is intentionally LEFT at the Kafka default (~1 MiB). It is
    # aligned with the scalo client contract: producer batch.size (128 KiB) <
    # broker message.max.bytes (1 MiB) <= the SMALLEST client per-partition fetch
    # budget (low_latency max.partition.fetch.bytes = 1 MiB). Raising it on one layer
    # without the others causes producer rejects or consumer stalls -- raise all
    # three together (broker + topic max.message.bytes + client fetch) only if you
    # genuinely need larger messages; prefer reference-based messaging for blobs.

# DFE service user (SCRAM-SHA-512)
user:
  name: dfe-kafka-user
  authentication:
    type: scram-sha-512
  password:
    # Route the SCRAM password through the secrets store instead of letting Strimzi's
    # User Operator generate one it keeps to itself. The DEPLOY layer seeds the store
    # (terraform/modules/tf-secrets `seed_kafka_user`); ESO only reads it, into both
    # this namespace and the app namespace. See kafka-user-credential.yaml.
    #
    # WHY the store rather than an in-cluster generator: it is the one seam that swaps
    # for a public-cloud deploy (ClusterSecretStore provider -> aws/gcp/azure on EKS).
    # Generating straight into a Secret would leave cloud needing a different
    # mechanism and the store path unexercised on-prem.
    #
    # REQUIRES the store to be seeded first -- `tofu apply` on tf-secrets. Without
    # the seed the ExternalSecret cannot resolve, the KafkaUser never gets a
    # password, and Kafka auth does not come up. Set false to fall back to the User
    # Operator generating into the broker namespace only, which is the CURRENT
    # behaviour and leaves the app namespace with no credential
    # (dfe-local/dfe-kafka-user NotFound, transforms in CreateContainerConfigError).
    fromSecretsStore: true
    secretStoreName: dfe-secret-store
    # Extra namespaces to project the credential into, beyond appNamespace.
    extraAppNamespaces: []
