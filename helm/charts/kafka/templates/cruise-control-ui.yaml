{{/* The nginx server that serves the UI and proxies to the Cruise Control API. One definition, because the pod annotation hashes it: nginx never re-reads a refreshed ConfigMap, so a changed config must roll the pod. */}}
{{- define "dfe-kafka.cruiseControlUiConf" -}}
{{- $ccHost := printf "%s-cruise-control.%s.svc" .Values.kafka.name .Release.Namespace -}}
server {
    listen 8080;
    server_name _;
    root /srv;
    index index.html;

    # A single-page app: every unknown path is one of the app's own routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /kafkacruisecontrol/ {
        # Written by the init container from the operator-managed secret. In a
        # file rather than here, because a ConfigMap is readable by anything
        # that can read a pod spec.
        include /etc/nginx/cruise-control-auth/auth.conf;
        # nginx resolves this name ONCE, at start, and refuses to start when it
        # does not resolve. That is the right way round here: the pod cannot
        # start before the operator-made secrets below exist, and the operator
        # makes the Service in the same reconcile, so a name that still does not
        # resolve is a restart rather than a 502 nobody reads.
        proxy_pass https://{{ $ccHost }}:9090/kafkacruisecontrol/;
        # Verification ON with the cluster CA named: left off, nginx accepts any
        # certificate and the TLS hop proves nothing.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/cruise-control-ca/ca.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name {{ $ccHost }};
        proxy_http_version 1.1;
        # An optimisation proposal is computed on the request, so the default
        # 60s read timeout cuts off the one call that matters.
        proxy_read_timeout 300s;
    }
}
{{- end }}
{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") .Values.kafka.rebalancing.enabled .Values.kafka.rebalancing.ui.enabled }}
{{- $ui := .Values.kafka.rebalancing.ui }}
{{- $name := printf "%s-cruise-control-ui" .Values.kafka.name }}
{{- $cc := printf "%s-cruise-control" .Values.kafka.name }}
{{- $tarball := printf "cruise-control-ui-%s.tar.gz" $ui.release.version }}
{{- $url := $ui.release.url | default (printf "https://github.com/linkedin/cruise-control-ui/releases/download/v%s/%s" $ui.release.version $tarball) }}
# The Cruise Control UI, which Strimzi does not ship. nginx serves the static app and makes the one hop to the Cruise Control API, so the browser only talks to this pod and the credential stays in it.
# The identity is the read-only USER account `healthcheck`. Both secrets come from the operator, so on a first sync the pod waits in ContainerCreating. See docs/deployment/kafka/autoscaling.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: cruise-control-ui
data:
  # Replaces the image's conf.d/default.conf. Its nginx.conf already points the pid file and temp paths at /tmp.
  default.conf: |
    {{- include "dfe-kafka.cruiseControlUiConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: cruise-control-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
      # The chart's selector labels are shared, so the second workload needs a component label.
      app.kubernetes.io/component: cruise-control-ui
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
        app.kubernetes.io/component: cruise-control-ui
      annotations:
        checksum/config: {{ include "dfe-kafka.cruiseControlUiConf" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      initContainers:
        # Fetches and verifies the UI release and writes the nginx auth line. Reuses the server image so the pod has one image to review.
        - name: fetch-ui
          image: "{{ $ui.image.repository }}:{{ $ui.image.tag }}@{{ $ui.image.digest }}"
          imagePullPolicy: {{ $ui.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml $ui.resources | nindent 12 }}
          volumeMounts:
            - name: ui
              mountPath: /srv
            - name: auth
              mountPath: /etc/nginx/cruise-control-auth
            - name: api-credential
              mountPath: /etc/cruise-control-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -e
              URL="{{ $url }}"
              WANT="{{ $ui.release.sha256 }}"
              TGZ=/tmp/{{ $tarball }}
              echo "Fetching ${URL}"
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL -o "$TGZ" "$URL"
              else
                wget -q -O "$TGZ" "$URL"
              fi
              # Verified before unpacking, because nothing upstream signs this asset.
              GOT=$(sha256sum "$TGZ" | cut -d' ' -f1)
              if [ "$GOT" != "$WANT" ]; then
                echo "checksum mismatch for ${URL}: got ${GOT}, want ${WANT}" >&2
                exit 1
              fi
              tar -xzf "$TGZ" -C /tmp
              cp -R /tmp/cruise-control-ui/dist/. /srv/
              # The url is relative, so API calls come back to this pod.
              printf '%s,%s,/kafkacruisecontrol/\n' "{{ .Values.project }}" "{{ .Values.kafka.name }}" > /srv/static/config.csv
              # The Basic header is computed once, so the password reaches no ConfigMap, page or log line.
              printf 'proxy_set_header Authorization "Basic %s";\n' \
                "$(printf 'healthcheck:%s' "$(cat /etc/cruise-control-api/healthcheck.password)" | base64 | tr -d '\n')" \
                > /etc/nginx/cruise-control-auth/auth.conf
              echo "cruise-control-ui {{ $ui.release.version }} verified: ${GOT}"
      containers:
        - name: nginx
          image: "{{ $ui.image.repository }}:{{ $ui.image.tag }}@{{ $ui.image.digest }}"
          imagePullPolicy: {{ $ui.image.pullPolicy }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml $ui.resources | nindent 12 }}
          volumeMounts:
            - name: ui
              mountPath: /srv
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/cruise-control-auth
              readOnly: true
            - name: cluster-ca
              mountPath: /etc/nginx/cruise-control-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
      volumes:
        - name: ui
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ $name }}
        # Memory-backed so the credential never reaches a node's disk.
        - name: auth
          emptyDir:
            medium: Memory
        - name: api-credential
          secret:
            # Written by the Cluster Operator for any cluster with spec.cruiseControl.
            secretName: {{ $cc }}-api
            items:
              - key: healthcheck.password
                path: healthcheck.password
        - name: cluster-ca
          secret:
            secretName: {{ .Values.kafka.name }}-cluster-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: cruise-control-ui
spec:
  type: ClusterIP
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cruise-control-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Strimzi's NetworkPolicy admits only the operators to Cruise Control on 9090, so a policy-enforcing cluster refuses the UI. Policies add up, so this admits the one caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-to-cruise-control
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: cruise-control-ui
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: {{ .Values.kafka.name }}
      strimzi.io/name: {{ $cc }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dfe-common.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: cruise-control-ui
      ports:
        - protocol: TCP
          port: 9090
{{- end }}
