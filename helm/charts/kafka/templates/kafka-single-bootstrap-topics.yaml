{{- if eq .Values.kafka.mode "single" }}
{{- $topics := include "dfe-kafka.bootstrapTopics" . | fromJsonArray }}
{{- if $topics }}
{{- $name := .Values.kafka.name }}
# The bootstrap topics for the single tier (default landing topic + per-app DLQ
# topics -- the list is the dfe-kafka.bootstrapTopics helper), created with the
# broker's own CLI.
#
# kafka-bootstrap-topics.yaml covers the cluster tier with Strimzi KafkaTopic
# CRs. Those CRs do nothing here: the single tier runs a plain StatefulSet and
# installs no operator, so a CR is accepted, never reconciled, and the topic
# never exists.
#
# Without the landing topic dfe-loader exits on "Auto-discovery found no
# matching topics" and crashloops until someone publishes -- which nothing can
# do through a loader that is down. Without the DLQ topics the first poisoned
# message has nowhere to go: the file DLQ is a no-op on the fleet's read-only
# rootfs (EROFS), and a DLQ write happens at failure time, when nothing can be
# creating topics.
apiVersion: batch/v1
kind: Job
metadata:
  # The topic list is hashed into the name so a changed list is a NEW Job rather
  # than an edit to an immutable one. Replace=true cannot do that job: the API
  # server only defaults spec.selector on CREATE, so replacing a Job that
  # declares none is rejected outright and the Application never syncs again.
  name: {{ $name }}-bootstrap-topics-{{ $topics | toJson | sha256sum | trunc 8 }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # A TRACKED resource, not a PostSync hook. Argo omits hooks from an
    # Application's resource tree, so a hook that never fires is invisible -- and
    # this one did not fire, leaving the loader crashlooping on a deploy that
    # reported success.
    #
    # Wave 1 runs it after the wave-0 broker reports healthy.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        # NOT dfe-common.selectorLabels: that is exactly what the headless broker
        # Service selects on, so this pod would join the endpoints clients resolve
        # for the bootstrap address -- with no readiness probe, for the whole
        # broker wait plus every topic create, and listening on nothing.
        app.kubernetes.io/name: {{ printf "%s-%s-bootstrap-topics" .Values.project .Values.component | quote }}
    spec:
      restartPolicy: Never
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: create-topics
          image: "apache/kafka:{{ .Values.kafka.version }}"
          resources:
            {{- toYaml .Values.kafka.topicJob.resources | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BOOTSTRAP="{{ $name }}.{{ .Release.Namespace }}.svc.cluster.local:9092"
              CFG=/tmp/client.properties
              # Admin calls authenticate as the same service user the apps use,
              # over the same derived protocol and mechanism -- one table, so this
              # Job cannot disagree with the broker beside it (dfe-infra#191).
              cat > "$CFG" <<EOF
              security.protocol={{ include "dfe-common.kafkaSecurityProtocol" (include "dfe-kafka.providerIdentity" .) }}
              sasl.mechanism={{ include "dfe-common.kafkaSaslMechanism" (include "dfe-kafka.providerIdentity" .) }}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
              EOF
              echo "Waiting for broker ${BOOTSTRAP}..."
              for i in $(seq 1 60); do
                if /opt/kafka/bin/kafka-broker-api-versions.sh \
                     --bootstrap-server "$BOOTSTRAP" --command-config "$CFG" >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              # --if-not-exists so an operator who repartitioned a topic keeps
              # their settings; this only guarantees the topics are there at all.
              # Replication is hard-coded 1: the single tier has one broker.
              {{- range $t := $topics }}
              {{- /* The toJson round-trip makes numbers float64; a bare render
                     of a large one is scientific notation, which the broker
                     CLI rejects. Integral floats render via int64. */}}
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --command-config "$CFG" --create --if-not-exists --topic "{{ $t.name }}" --partitions {{ $t.partitions }} --replication-factor 1{{ range $k, $v := $t.config }} --config {{ $k }}={{ if kindIs "float64" $v }}{{ int64 $v }}{{ else }}{{ $v }}{{ end }}{{ end }}
              echo "topic {{ $t.name }} present:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --command-config "$CFG" --describe --topic "{{ $t.name }}"
              {{- end }}
          env:
            - name: KAFKA_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.user.name }}, key: username }
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.user.name }}, key: password }
{{- end }}
{{- end }}
