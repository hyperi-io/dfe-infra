{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") }}
{{- $p := .Values.kafka.profile.scale }}
{{- $replicas := int (include "dfe-kafka.brokerCount" .) }}
{{- $rf := min (int $p.replicationFactor) $replicas }}
{{- $isr := min (int $p.minInsyncReplicas) $replicas }}
{{- $threadDials := ge (int (include "dfe-kafka.brokerMilliCpu" .)) (mul (int $p.threadDialVcpuFloor) 1000) }}
# Cluster-wide config only. Replicas, storage and resources are in kafka-nodepool.yaml.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.kafka.name }}
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    {{- with .Values.kafka.metadataVersion }}
    # Quoted: an unquoted 4.2 reaches Strimzi as a float.
    metadataVersion: {{ . | quote }}
    {{- end }}
    # Without simple authorization the User Operator rejects the KafkaUser's ACLs and never mints its secret.
    authorization:
      type: simple
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    config:
      offsets.topic.replication.factor: {{ $rf }}
      transaction.state.log.replication.factor: {{ $rf }}
      transaction.state.log.min.isr: {{ $isr }}
      default.replication.factor: {{ $rf }}
      min.insync.replicas: {{ $isr }}
      num.partitions: {{ include "dfe-kafka.partitions" . }}
      log.retention.ms: {{ include "dfe-kafka.retentionMs" . }}
      log.retention.bytes: {{ include "dfe-kafka.retentionBytes" . }}
      # Off at the cluster tier: dfe-engine creates topics with explicit partition counts.
      auto.create.topics.enable: {{ $p.autoCreateTopics }}
      # With every topic's max.message.bytes, or a produce is rejected and a follower stalls.
      message.max.bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
      replica.fetch.max.bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
      {{- if $threadDials }}
      # Only at a broker CPU limit of kafka.profile.scale.threadDialVcpuFloor vCPU or more.
      num.network.threads: {{ $p.numNetworkThreads }}
      num.io.threads: {{ $p.numIoThreads }}
      num.replica.fetchers: {{ $p.numReplicaFetchers }}
      num.recovery.threads.per.data.dir: {{ $p.numRecoveryThreadsPerDataDir }}
      {{- end }}
      {{- if eq (include "dfe-kafka.storageBulk" .) "object" }}
      # The per-topic half (remote.storage.enable) is applied by dfe-engine, which creates every topic.
      remote.log.storage.system.enable: "true"
      {{- end }}
    {{- with (include "dfe-kafka.tieredStorage" .) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if eq (include "dfe-kafka.storageBulk" .) "object" }}
    template:
      kafkaContainer:
        env:
          {{- include "dfe-kafka.objectStoreEnv" . | nindent 10 }}
    {{- end }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
  {{- if .Values.kafka.rebalancing.enabled }}
  # Cruise Control moves data onto new brokers (kafka-rebalance-templates.yaml).
  cruiseControl:
    # Without these, Strimzi drops the network goals from default.goals and hard.goals and rebalances network-blind.
    brokerCapacity:
      inboundNetwork: {{ include "dfe-kafka.brokerCapacityNetwork" . | quote }}
      outboundNetwork: {{ include "dfe-kafka.brokerCapacityNetwork" . | quote }}
    resources:
      {{- toYaml .Values.kafka.rebalancing.resources | nindent 6 }}
    # Fires on a spec.replicas change to an existing pool only.
    autoRebalance:
      - mode: add-brokers
        template:
          name: {{ .Values.kafka.name }}-rebalance-add-brokers
      - mode: remove-brokers
        template:
          name: {{ .Values.kafka.name }}-rebalance-remove-brokers
  {{- end }}
{{- end }}
