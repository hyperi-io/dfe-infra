{{- if and (eq .Values.kafka.mode "cluster") (has .Values.kafka.provider (list "strimzi" "redpanda")) (not .Values.user.password.fromSecretsStore) }}
# The two non-secret keys (username, sasl.mechanism) the apps read from dfe-kafka-user when the credential is not projected from the store.
# The operators' Secret carries no username, so those pods sit in CreateContainerConfigError (dfe-infra#187).
# A Fake generator supplies the values because ESO rejects an ExternalSecret with neither data nor dataFrom.
# Merge adds the keys to the operator's Secret, and ESO retries until it exists.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Fake
metadata:
  name: {{ .Values.user.name }}-appkeys
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  data:
    username: {{ .Values.user.name | quote }}
    # Derived from the provider table (dfe-infra#10), in librdkafka spelling: dfe-receiver rejects the engine model's underscore form.
    sasl.mechanism: {{ include "dfe-common.kafkaSaslMechanism" (include "dfe-kafka.providerIdentity" .) | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.user.name }}-appkeys
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  target:
    name: {{ .Values.user.name }}
    creationPolicy: Merge
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Fake
          name: {{ .Values.user.name }}-appkeys
{{- end }}
