{{- $a := .Values.kafka.autoscaling }}
{{- $hasPrometheusTrigger := and $a.metrics.usePrometheus $a.metrics.prometheusUrl }}
{{/*
KEDA's ScaledObject schema requires a non-empty `triggers` list -- an armed
autoscaler with no landing source declared and no Prometheus endpoint wired up
would render `triggers: null`, which the CRD rejects and the kafka Application
never syncs. So the whole autoscaler -- ConfigMap, TriggerAuthentication and
ScaledObject alike -- renders only when at least one trigger actually would.
NOTES.txt tells the operator why nothing rendered, since kafka.autoscaling.enabled
being true with no ScaledObject to show for it looks like a bug rather than the
armed-but-idle state it is.
*/}}
{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") $a.enabled (or .Values.kafka.landingTopics.sources $hasPrometheusTrigger) }}
{{- $minReplicas := int (include "dfe-kafka.brokerCount" .) }}
# The broker-count autoscaler: a KEDA ScaledObject whose scaleTargetRef is the
# broker KafkaNodePool (kafka-nodepool.yaml), NOT the Kafka CR -- Strimzi 1.2.0
# put the /scale subresource (specReplicasPath: .spec.replicas,
# statusReplicasPath: .status.replicas) on KafkaNodePool, and moving
# spec.replicas there is exactly what triggers Strimzi's own autoRebalance
# (kafka-rebalance-templates.yaml: add-brokers moves data onto a broker that
# just joined, remove-brokers moves it off one about to leave, BEFORE Strimzi
# removes it). KEDA only ever raises the count by default: scale-in is held
# off by disabling the underlying HPA's scale-down direction outright unless
# kafka.autoscaling.scaleIn.enabled is true (see the ScaledObject below).
# docs/deployment/kafka/autoscaling.md has the full picture.
#
# A ConfigMap, not a Secret: the KafkaUser name is a resource name, not a
# credential. The User Operator already owns a Secret of that name (see the
# TriggerAuthentication below), so this exists only to hand KEDA the
# username half of the pair without minting a second credential store.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.kafka.name }}-broker-scaler-username
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  username: {{ .Values.user.name | quote }}
---
# Reuses the KafkaUser's OWN Secret: kafka-user.yaml's KafkaUser resource
# always reconciles a Secret named after .Values.user.name, whether the
# password came from the store (user.password.fromSecretsStore=true) or was
# generated by the User Operator -- so the scaler's credential can never
# drift from the one every other DFE client already authenticates with.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Values.kafka.name }}-broker-scaler-auth
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.user.name }}
      key: password
    # Strimzi's own cluster CA, the same secret + key cruise-control-ui.yaml
    # trusts for its proxy hop -- so KEDA verifies the broker's certificate
    # rather than taking the TLS listener on faith.
    - parameter: ca
      name: {{ .Values.kafka.name }}-cluster-ca-cert
      key: ca.crt
  configMapTargetRef:
    - parameter: username
      name: {{ .Values.kafka.name }}-broker-scaler-username
      key: username
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.kafka.name }}-broker-scaler
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaNodePool
    name: {{ include "dfe-kafka.nodePoolName" . }}
  # No floor dial: this is always the resolved broker count (kafka.replicas),
  # the same number kafka-nodepool.yaml's own spec.replicas starts at.
  minReplicaCount: {{ $minReplicas }}
  maxReplicaCount: {{ int $a.maxBrokers }}
  pollingInterval: {{ int $a.pollingInterval }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          {{- if $a.scaleIn.enabled }}
          stabilizationWindowSeconds: {{ int $a.scaleIn.cooldownSeconds }}
          {{- else }}
          # The OFF switch, never an on switch: Disabled means the HPA this
          # ScaledObject drives never reduces replicas on its own (Kubernetes
          # autoscaling/v2 HPAScalingRules.selectPolicy=Disabled "disables the
          # scaling in this direction") -- once KEDA scales brokers out, they
          # stay out until a human raises kafka.replicas or flips
          # kafka.autoscaling.scaleIn.enabled.
          selectPolicy: Disabled
          {{- end }}
  triggers:
    # The always-available signal: one trigger per landing source, each
    # watching the TRANSFORM consumer group that actually reads <source>_land
    # (apps.yaml's source_binding.config.source.group_id) -- not dfe-loader,
    # which consumes <source>_load one hop downstream and lags behind the
    # brokers' own backlog rather than measuring it. <kind> is the per-source
    # kafka.landingTopics.sources[].transform override when the deploy set
    # one, else kafka.autoscaling.transformKind. Works with no extra
    # deploy-time wiring, unlike the prometheus trigger below.
    {{- range $s := .Values.kafka.landingTopics.sources }}
    {{- $kind := $s.transform | default $a.transformKind }}
    - type: kafka
      metricType: Value
      metadata:
        # Deliberately NOT dfe-kafka.bootstrapServers: that helper is pinned to
        # the plain listener (port 9092, tls: false) for kafbat and the
        # otel-collector's metrics receiver, and changing it would flip both.
        # KEDA is the one client here carrying a broker password over the
        # wire on its own connection (no proxy in front of it, unlike
        # cruise-control-ui), so it takes the cluster's "tls" listener
        # (kafka.yaml, port 9093, tls: true) instead, verified against the
        # cluster CA above rather than run bare.
        bootstrapServers: {{ printf "%s-kafka-bootstrap:9093" $.Values.kafka.name | quote }}
        topic: {{ printf "%s%s" $s.name $.Values.kafka.landingTopics.suffix | quote }}
        consumerGroup: {{ printf "dfe-transform-%s-%s" $kind $s.name | quote }}
        lagThreshold: {{ int $a.lagThreshold | quote }}
        sasl: scram_sha512
        tls: enable
      authenticationRef:
        name: {{ $.Values.kafka.name }}-broker-scaler-auth
    {{- end }}
    {{- if $hasPrometheusTrigger }}
    # Opt-in: needs BOTH a queryable PromQL endpoint (prometheusUrl) and
    # Strimzi's Kafka JMX metrics wired onto the Kafka CR -- neither ships
    # with this chart today (validateAutoscaling only checks the URL is set
    # when this is requested; it cannot check the metric itself exists).
    # See docs/deployment/kafka/autoscaling.md.
    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: {{ $a.metrics.prometheusUrl | quote }}
        query: sum(rate(kafka_server_brokertopicmetrics_bytesin_total[5m])) / 1000000
        threshold: {{ $a.bytesInPerBrokerThresholdMBs | quote }}
    {{- end }}
{{- end }}
