{{- $a := .Values.kafka.autoscaling }}
{{- $hasPrometheusTrigger := and $a.metrics.usePrometheus $a.metrics.prometheusUrl }}
{{/* KEDA rejects an empty triggers list, so the whole autoscaler renders only when a trigger would fire. NOTES.txt says why nothing rendered. */}}
{{- if include "dfe-kafka.autoscalerRendered" . }}
{{- $minReplicas := int (include "dfe-kafka.brokerCount" .) }}
# A KEDA ScaledObject on the broker KafkaNodePool, whose /scale subresource moves spec.replicas and so fires Strimzi's autoRebalance. See docs/deployment/kafka/autoscaling.md.
# The username half of the credential for KEDA. A ConfigMap because the KafkaUser name is a resource name, not a secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.kafka.name }}-broker-scaler-username
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  username: {{ .Values.user.name | quote }}
---
# The KafkaUser's own Secret, which exists whether or not the password came from the secrets store.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Values.kafka.name }}-broker-scaler-auth
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.user.name }}
      key: password
    # The cluster CA, as cruise-control-ui.yaml uses, so KEDA verifies the broker certificate.
    - parameter: ca
      name: {{ .Values.kafka.name }}-cluster-ca-cert
      key: ca.crt
  configMapTargetRef:
    - parameter: username
      name: {{ .Values.kafka.name }}-broker-scaler-username
      key: username
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.kafka.name }}-broker-scaler
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: kafka.strimzi.io/v1
    kind: KafkaNodePool
    name: {{ include "dfe-kafka.nodePoolName" . }}
  # Always the resolved broker count (kafka.replicas). There is no floor dial.
  minReplicaCount: {{ $minReplicas }}
  maxReplicaCount: {{ int $a.maxBrokers }}
  pollingInterval: {{ int $a.pollingInterval }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          {{- if $a.scaleIn.enabled }}
          stabilizationWindowSeconds: {{ int $a.scaleIn.cooldownSeconds }}
          {{- else }}
          # Disabled stops the HPA scaling in on its own, so brokers KEDA adds stay until kafka.replicas is raised or scaleIn.enabled is set.
          selectPolicy: Disabled
          {{- end }}
  triggers:
    # One trigger per landing source, on the consumer group of the transform that reads <source>_land. Not dfe-loader, which lags behind the backlog instead of measuring it.
    {{- range $s := .Values.kafka.landingTopics.sources }}
    {{- $kind := $s.transform | default $a.transformKind }}
    - type: kafka
      metricType: Value
      metadata:
        # The tls listener (9093) verified against the cluster CA, not dfe-kafka.bootstrapServers (plain, 9092), because KEDA sends the password on its own connection.
        bootstrapServers: {{ printf "%s-kafka-bootstrap:9093" $.Values.kafka.name | quote }}
        topic: {{ printf "%s%s" $s.name $.Values.kafka.landingTopics.suffix | quote }}
        consumerGroup: {{ printf "dfe-transform-%s-%s" $kind $s.name | quote }}
        lagThreshold: {{ int $a.lagThreshold | quote }}
        sasl: scram_sha512
        tls: enable
      authenticationRef:
        name: {{ $.Values.kafka.name }}-broker-scaler-auth
    {{- end }}
    {{- if $hasPrometheusTrigger }}
    # Opt-in. Needs a PromQL endpoint and Strimzi JMX metrics, which this chart does not ship (docs/deployment/kafka/autoscaling.md).
    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: {{ $a.metrics.prometheusUrl | quote }}
        query: sum(rate(kafka_server_brokertopicmetrics_bytesin_total[5m])) / 1000000
        threshold: {{ $a.bytesInPerBrokerThresholdMBs | quote }}
    {{- end }}
{{- end }}
