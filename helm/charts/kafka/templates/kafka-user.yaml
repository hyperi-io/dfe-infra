{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .Values.user.name }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  authentication:
    type: {{ .Values.user.authentication.type }}
    {{- if .Values.user.password.fromSecretsStore }}
    # CONSUME the store-backed password rather than letting the User Operator
    # generate one. A UO-generated password exists ONLY as a Secret in THIS
    # namespace, and the apps run elsewhere -- nothing bridges the two, which is why
    # dfe-local/dfe-kafka-user does not exist today. Sourcing it from the store makes
    # the store the single point both this namespace and the app namespace read from.
    # "If not set, a new password is generated by the User Operator" (KafkaUser v1).
    # See kafka-user-credential.yaml for the generate -> push -> read chain.
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .Values.user.name }}-store
          key: password
    {{- end }}
  authorization:
    type: simple
    acls:
      # Produce, consume, and every topic call dfe-engine makes (TopicAdmin in
      # its dfe_engine/kafka/topics.py). Create makes the declared
      # bootstrap topic set at the engine's own startup -- nothing else creates
      # a topic on any tier. Alter is CreatePartitions, which widens a topic
      # when a source's throughput changes. Delete is what DELETE
      # /sources/{name} needs to take a source's _land/_load pair with it.
      # DescribeConfigs and AlterConfigs are the engine's topic status read and
      # its incremental config converge, and the smoke suite's DLQ retention
      # check reads the same config. One principal serves every path and the
      # ACL is one wildcard rule, so the grant cannot be narrowed to the source
      # topics alone. The managed bodies grant this set too: msk-bootstrap-job.yaml
      # and terraform/modules/managed-kafka/{confluent,redpanda}-cloud/acls.tf.
      # EVERY CLUSTER OPERATION IS STILL WITHHELD: a compromised engine
      # principal must not be able to reconfigure or take over the bus. The
      # engine's describe_cluster needs none -- the broker answers it to any
      # authenticated client unless it asks for authorised operations, which
      # the engine does not.
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Read", "Write", "Create", "Describe", "Alter", "Delete", "DescribeConfigs", "AlterConfigs"]
      - resource:
          type: group
          # patternType: prefix means the name IS the literal prefix -- do NOT
          # include a '*' glob (that would match groups starting "dfe-*", not
          # "dfe-"). All DFE consumer groups are "dfe-"-prefixed.
          name: "dfe-"
          patternType: prefix
        operations: ["Read", "Describe"]
{{- end }}
