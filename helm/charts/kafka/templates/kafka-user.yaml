{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") }}
# Reconciles the dfe-kafka-user Secret (user.name) that every app chart reads.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .Values.user.name }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  authentication:
    type: {{ .Values.user.authentication.type }}
    {{- if .Values.user.password.fromSecretsStore }}
    # Takes the store-backed password: a User Operator password exists only in this namespace and the apps run elsewhere. See kafka-user-credential.yaml.
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .Values.user.name }}-store
          key: password
    {{- end }}
  authorization:
    type: simple
    acls:
      # Every topic call dfe-engine's TopicAdmin makes (dfe_engine/kafka/topics.py): Create for the bootstrap topic set, Alter for CreatePartitions,
      # Delete for DELETE /sources/{name}, DescribeConfigs and AlterConfigs for status reads and config converge. One wildcard rule serves every path.
      # All cluster operations stay withheld, so a compromised engine principal cannot reconfigure the bus. The managed bodies grant the same set
      # (msk-bootstrap-job.yaml, terraform/modules/managed-kafka/*/acls.tf).
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Read", "Write", "Create", "Describe", "Alter", "Delete", "DescribeConfigs", "AlterConfigs"]
      - resource:
          type: group
          # A prefix pattern's name is the literal prefix: a '*' would match "dfe-*" groups, not "dfe-".
          name: "dfe-"
          patternType: prefix
        operations: ["Read", "Describe"]
{{- end }}
