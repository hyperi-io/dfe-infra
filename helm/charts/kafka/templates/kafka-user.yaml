{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .Values.user.name }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  authentication:
    type: {{ .Values.user.authentication.type }}
    {{- if .Values.user.password.fromSecretsStore }}
    # CONSUME the store-backed password rather than letting the User Operator
    # generate one. A UO-generated password exists ONLY as a Secret in THIS
    # namespace, and the apps run elsewhere -- nothing bridges the two, which is why
    # dfe-local/dfe-kafka-user does not exist today. Sourcing it from the store makes
    # the store the single point both this namespace and the app namespace read from.
    # "If not set, a new password is generated by the User Operator" (KafkaUser v1).
    # See kafka-user-credential.yaml for the generate -> push -> read chain.
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .Values.user.name }}-store
          key: password
    {{- end }}
  authorization:
    type: simple
    acls:
      # Allow DFE services to produce/consume on all dfe topics
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Read", "Write", "Create", "Describe"]
      - resource:
          type: group
          # patternType: prefix means the name IS the literal prefix -- do NOT
          # include a '*' glob (that would match groups starting "dfe-*", not
          # "dfe-"). All DFE consumer groups are "dfe-"-prefixed.
          name: "dfe-"
          patternType: prefix
        operations: ["Read", "Describe"]
{{- end }}
