{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .Values.user.name }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  authentication:
    type: {{ .Values.user.authentication.type }}
    {{- if .Values.user.password.fromSecretsStore }}
    # CONSUME the store-backed password rather than letting the User Operator
    # generate one. A UO-generated password exists ONLY as a Secret in THIS
    # namespace, and the apps run elsewhere -- nothing bridges the two, which is why
    # dfe-local/dfe-kafka-user does not exist today. Sourcing it from the store makes
    # the store the single point both this namespace and the app namespace read from.
    # "If not set, a new password is generated by the User Operator" (KafkaUser v1).
    # See kafka-user-credential.yaml for the generate -> push -> read chain.
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .Values.user.name }}-store
          key: password
    {{- end }}
  authorization:
    type: simple
    acls:
      # Produce, consume, and the whole topic lifecycle dfe-engine drives. Create
      # makes the declared bootstrap topic set at the engine's own startup --
      # nothing else creates a topic on any tier. Alter raises a partition count
      # when a source's throughput changes. Delete is what DELETE /sources/{name}
      # needs: the same dial that made a source's _land/_load pair removes it,
      # and without the grant deleting a source leaves its topics behind and
      # costs the loader a partition assignment for a source nothing can write
      # to. One principal serves both paths and the ACL is one wildcard rule, so
      # the grant cannot be narrowed to the source topics alone.
      # EVERY CLUSTER OPERATION IS STILL WITHHELD: a compromised engine
      # principal must not be able to reconfigure or take over the bus.
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Read", "Write", "Create", "Describe", "Alter", "Delete"]
      - resource:
          type: group
          # patternType: prefix means the name IS the literal prefix -- do NOT
          # include a '*' glob (that would match groups starting "dfe-*", not
          # "dfe-"). All DFE consumer groups are "dfe-"-prefixed.
          name: "dfe-"
          patternType: prefix
        operations: ["Read", "Describe"]
{{- end }}
