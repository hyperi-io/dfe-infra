{{- if and (eq .Values.kafka.mode "cluster") (has .Values.kafka.provider (list "strimzi" "redpanda")) .Values.user.password.fromSecretsStore }}
{{- if not .Values.appNamespace }}
{{- fail "kafka: user.password.fromSecretsStore=true needs appNamespace set (the appset passes it from the cluster's dfe.hyperi.io/dfe_namespace annotation). Without it the broker's user would take its password from the store while the apps got no credential at all -- half-configured and silent. Set appNamespace, or set user.password.fromSecretsStore=false to fall back to the broker's operator generating into the broker namespace only." }}
{{- end }}
# Reads the service user's SCRAM password out of the secrets store, for the KafkaUser or Redpanda User. The deploy layer seeds the store (terraform/modules/tf-secrets seed_kafka_user)
# and ESO only reads it, because its AppRole policy is read-only. Why the store: docs/deployment/kafka/README.md, "Service user credential".
# Named -store because the User Operator owns a Secret called dfe-kafka-user in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.user.name }}-store
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.user.password.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.user.name }}-store
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "dfe-kafka.credentialKey" . }}
        property: password
{{- end }}
