{{- if and (eq .Values.kafka.mode "cluster") (eq .Values.kafka.provider "strimzi") .Values.user.password.fromSecretsStore }}
{{- if not .Values.appNamespace }}
{{- fail "kafka: user.password.fromSecretsStore=true needs appNamespace set (the appset passes it from the cluster's dfe.hyperi.io/dfe_namespace annotation). Without it the KafkaUser would take its password from the store while the apps got no credential at all -- half-configured and silent. Set appNamespace, or set user.password.fromSecretsStore=false to fall back to the User Operator generating into the broker namespace only." }}
{{- end }}
# Read the DFE service user's SCRAM password OUT of the secrets store, for the
# KafkaUser to consume.
#
# The store is the source of truth and the DEPLOY layer seeds it
# (terraform/modules/tf-secrets `seed_kafka_user`, alongside the `seed_argocd` it is
# modelled on). Nothing in-cluster writes it: ESO's AppRole policy is read-only by
# design, so ESO projects this credential and never mints it. That is deliberate --
# an in-cluster PushSecret was tried and the policy refuses it (403 on
# PUT secret/metadata/...), which is the posture working, not a bug.
#
# Why the store rather than letting the User Operator generate: a UO-generated
# password exists ONLY as a Secret in the BROKER's namespace, and the apps run
# elsewhere with nothing bridging the two -- which is why dfe-local/dfe-kafka-user
# does not exist today and the transforms sit in CreateContainerConfigError. With the
# store in front, this namespace and the app namespace read the same one value.
#
# And the store is the ONE seam that swaps for cloud: flip the ClusterSecretStore's
# provider to aws/gcp/azure on EKS and nothing here changes.
#
# Named distinctly from `dfe-kafka-user` because the User Operator owns a Secret of
# that name in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.user.name }}-store
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.user.password.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.user.name }}-store
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "dfe-kafka.credentialKey" . }}
        property: password
{{- end }}
