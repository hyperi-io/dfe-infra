{{- if eq .Values.kafka.provider "redpanda" }}
{{- if eq .Values.kafka.mode "cluster" }}
# Empty placeholder for the Redpanda CR's auth.sasl.secretRef. The redpanda chart
# REQUIRES secretRef to name an existing Secret when SASL is enabled, and only
# creates it itself when auth.sasl.users[] is non-empty (we keep it empty). This
# secret carries extra STATIC SASL users -- DFE needs none (the real superuser is
# the operator-generated bootstrap user; the service account is the User CR), so
# users.txt is empty. Created by our chart so prod (Argo) and the test harness
# both get it with no manual/ESO step.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kafka.name }}-superusers
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.txt: ""
{{- end }}
{{- end }}
