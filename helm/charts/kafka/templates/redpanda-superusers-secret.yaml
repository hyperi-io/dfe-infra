{{- if eq .Values.kafka.provider "redpanda" }}
{{- if eq .Values.kafka.mode "cluster" }}
# Empty placeholder for the Redpanda CR's auth.sasl.secretRef: the redpanda chart needs an existing Secret there and only makes one when auth.sasl.users[] is non-empty. DFE has no static SASL users, so users.txt is empty.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kafka.name }}-superusers
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.txt: ""
{{- end }}
{{- end }}
