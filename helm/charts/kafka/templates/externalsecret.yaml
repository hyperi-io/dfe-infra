{{- if and (eq .Values.kafka.mode "external") (ne .Values.kafka.external.auth.type "msk_iam") }}
# External Kafka credentials (SCRAM / TLS). DFE deploys no broker; consumers
# connect to kafka.external.bootstrap.
# NOTE: for AWS MSK IAM auth (auth.type=msk_iam) there is NO static secret --
# auth uses AWS IAM via IRSA/workload-identity (SASL OAUTHBEARER), so the
# consumer ServiceAccounts carry the IAM role; nothing is rendered here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kafka.external.auth.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kafka.external.auth.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kafka.external.auth.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/kafka/external
        property: password
{{- end }}
