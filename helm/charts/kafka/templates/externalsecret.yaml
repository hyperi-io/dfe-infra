{{- /* A named provider with an app namespace goes through clusterexternalsecret-appns.yaml instead, which reads the seeded kafka/<provider> path; this one reads kafka/external. */}}
{{- if and (eq .Values.kafka.mode "external") (ne .Values.kafka.external.auth.type "msk_iam") (not (and .Values.kafka.external.provider .Values.appNamespace)) }}
{{- $identity := include "dfe-kafka.providerIdentity" . }}
# External Kafka credentials (SCRAM / TLS). DFE deploys no broker; consumers
# connect to kafka.external.bootstrap.
# NOTE: for AWS MSK IAM auth (auth.type=msk_iam) there is NO static secret --
# auth uses AWS IAM via IRSA/workload-identity (SASL OAUTHBEARER), so the
# consumer ServiceAccounts carry the IAM role; nothing is rendered here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kafka.external.auth.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kafka.external.auth.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kafka.external.auth.secretName }}
    creationPolicy: Owner
    {{- if $identity }}
    # Naming the provider buys the same secret SHAPE the DFE-owned tiers produce
    # (username + password + sasl.mechanism), so an app authenticates against a
    # supplied broker exactly as it does against ours. On Confluent Cloud the
    # username IS the API key, which is why it comes out of the store rather
    # than being templated as the tiers above template dfe-kafka-user.
    template:
      engineVersion: v2
      data:
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
        sasl.mechanism: {{ include "dfe-common.kafkaSaslMechanism" $identity | quote }}
    {{- end }}
  data:
    {{- if $identity }}
    - secretKey: username
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/kafka/external
        property: username
    {{- end }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/kafka/external
        property: password
{{- end }}
