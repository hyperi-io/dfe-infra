{{- /* A named provider with an app namespace goes through clusterexternalsecret-appns.yaml instead, which reads the seeded kafka/<provider> path; this one reads kafka/external. */}}
{{- if and (eq .Values.kafka.mode "external") (ne .Values.kafka.external.auth.type "msk_iam") (not (and .Values.kafka.external.provider .Values.appNamespace)) }}
{{- $identity := include "dfe-kafka.providerIdentity" . }}
# Credentials for an external broker (SCRAM or PLAIN). msk_iam has no static secret, so nothing renders for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kafka.external.auth.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kafka.external.auth.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kafka.external.auth.secretName }}
    creationPolicy: Owner
    {{- if $identity }}
    # A named provider gets the Secret shape the DFE-owned tiers produce. The username is read from the store because on Confluent Cloud it is the API key.
    template:
      engineVersion: v2
      data:
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
        sasl.mechanism: {{ include "dfe-common.kafkaSaslMechanism" $identity | quote }}
    {{- end }}
  data:
    {{- if $identity }}
    - secretKey: username
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/kafka/external
        property: username
    {{- end }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.project }}/{{ .Values.env }}/kafka/external
        property: password
{{- end }}
