{{- if eq .Values.kafka.storageModel "tiered" }}
{{- $key := .Values.kafka.tiered.remoteKey | default (printf "%s/%s/kafka/tiered" .Values.project .Values.env) }}
# Object-store credential for storageModel: tiered. Same seam as the
# mode=external broker credential: the deploy layer seeds the store, ESO
# materialises the Secret, and the RemoteStorageManager reads it from the broker
# environment -- so nothing is inline in the Kafka CR, which lives in git.
{{- /*
The remote key and its field names are values, so a deployment can bind a
credential the estate already holds rather than re-seeding it under a DFE path.
Template comments, so the defaults still render byte-identically.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kafka.tiered.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kafka.tiered.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kafka.tiered.secretName }}
    creationPolicy: Owner
  data:
    {{- /* secretKey is what the broker env reads; only the remote side is settable. */}}
    - secretKey: access_key_id
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.kafka.tiered.accessKeyProperty }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.kafka.tiered.secretKeyProperty }}
{{- end }}
