{{- if eq .Values.kafka.mode "single" }}
# The single tier has no User Operator, so the password is generated in-cluster (ESO Password generator) in the Secret shape the operator tiers produce. The broker registers this user at storage format time (--add-scram, kafka-single.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.user.name }}-gen
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 6
  symbols: 0          # alphanumeric -- avoids JAAS / shell escaping in the broker config
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.user.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: {{ .Values.user.name }}
    creationPolicy: Owner
    # Keeps the first password, which the broker registered at first start. CreatedOnce alone re-runs the generator on an altered Secret.
    immutable: true
    template:
      engineVersion: v2
      data:
        username: {{ .Values.user.name | quote }}
        password: "{{ `{{ .password }}` }}"
        # Derived from the provider table, never hand-set (dfe-infra#10).
        sasl.mechanism: {{ include "dfe-common.kafkaSaslMechanism" (include "dfe-kafka.providerIdentity" .) | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.user.name }}-gen
{{- end }}
