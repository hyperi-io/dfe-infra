{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") }}
{{- $replicas := int (include "dfe-kafka.brokerCount" .) }}
# The pool that always exists. In the chart's default (combined) mode it
# carries both broker and controller roles -- this file adds the controller
# role, and kafka-controller-nodepool.yaml renders nothing. Set
# kafka.controllerPool.enabled=true to split the KRaft controllers into their
# own pool instead: recommended for a NEW deployment (a broker under GC or IO
# pressure is otherwise also the metadata quorum), but a migration -- never a
# default -- on a cluster that already exists.
# replicas: cluster -> kafka.replicas (default 3, set higher). This is also the
# ONLY field a scale-out changes, and the only change that triggers Cruise
# Control's auto-rebalance.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.kafka.name }}-pool
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  roles:
    {{- if not .Values.kafka.controllerPool.enabled }}
    - controller
    {{- end }}
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage.size }}
        kraftMetadata: shared
        deleteClaim: false
        {{- with (.Values.kafka.storage.storageClass | default .Values.storageClass) }}
        class: {{ . }}
        {{- end }}
  resources:
    requests:
      cpu: {{ .Values.kafka.resources.requests.cpu }}
      memory: {{ .Values.kafka.resources.requests.memory }}
    limits:
      cpu: {{ .Values.kafka.resources.limits.cpu }}
      memory: {{ .Values.kafka.resources.limits.memory }}
  {{- if or .Values.nodeScheduling .Values.kafka.podSpread.enabled }}
  template:
    pod:
      {{- if .Values.nodeScheduling }}
      {{- if .Values.nodeScheduling.nodeSelector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- range $key, $val := .Values.nodeScheduling.nodeSelector }}
                  - key: {{ $key }}
                    operator: In
                    values:
                      - {{ $val | quote }}
                  {{- end }}
      {{- end }}
      {{- if .Values.nodeScheduling.tolerations }}
      tolerations:
        {{- toYaml .Values.nodeScheduling.tolerations | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.kafka.podSpread.enabled }}
      {{- /* Counts broker pods only -- strimzi.io/cluster alone also takes the
      entity operator and Cruise Control (label source:
      scripts/tests/test_kafka_pool_spread.py). */}}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.kafka.podSpread.maxSkew }}
          topologyKey: {{ .Values.kafka.podSpread.topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.kafka.name }}
              strimzi.io/broker-role: "true"
  {{- end }}
  {{- end }}
{{- end }}
