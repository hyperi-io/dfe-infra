{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") }}
{{- $replicas := int (include "dfe-kafka.brokerCount" .) }}
# The broker pool, which also holds the controller role unless kafka.controllerPool.enabled splits it out (kafka-controller-nodepool.yaml).
# spec.replicas is the one field a scale-out changes.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.kafka.name }}-pool
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "dfe-common.labels" . | nindent 4 }}
    {{- if include "dfe-kafka.autoscalerRendered" . }}
    # KEDA scales this pool (kafka-autoscaler.yaml), so layer2-data leaves spec.replicas alone.
    dfe.hyperi.io/replicas-owner: keda
    {{- end }}
spec:
  replicas: {{ $replicas }}
  roles:
    {{- if not .Values.kafka.controllerPool.enabled }}
    - controller
    {{- end }}
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage.size }}
        kraftMetadata: shared
        deleteClaim: false
        {{- with (.Values.kafka.storage.storageClass | default .Values.storageClass) }}
        class: {{ . }}
        {{- end }}
  resources:
    requests:
      cpu: {{ .Values.kafka.resources.requests.cpu }}
      memory: {{ .Values.kafka.resources.requests.memory }}
    limits:
      cpu: {{ .Values.kafka.resources.limits.cpu }}
      memory: {{ .Values.kafka.resources.limits.memory }}
  {{- if or .Values.nodeScheduling .Values.kafka.podSpread.enabled }}
  template:
    pod:
      {{- if .Values.nodeScheduling }}
      {{- with include "dfe-kafka.poolSelector" (dict "root" $ "pool" "kafka-broker") | fromYaml }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- range $key, $val := . }}
                  - key: {{ $key }}
                    operator: In
                    values:
                      - {{ $val | quote }}
                  {{- end }}
      {{- end }}
      {{- if .Values.nodeScheduling.tolerations }}
      tolerations:
        {{- toYaml .Values.nodeScheduling.tolerations | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.kafka.podSpread.enabled }}
      {{- /* Broker pods only: strimzi.io/cluster alone also matches the entity operator and Cruise Control. */}}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.kafka.podSpread.maxSkew }}
          topologyKey: {{ .Values.kafka.podSpread.topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.kafka.name }}
              strimzi.io/broker-role: "true"
  {{- end }}
  {{- end }}
{{- end }}
