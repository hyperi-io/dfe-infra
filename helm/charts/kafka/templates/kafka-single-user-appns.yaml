{{- if and (eq .Values.kafka.mode "single") .Values.appNamespace }}
{{- /* The namespaces the copy below lands in, and the only ones the store serves. */}}
{{- $consumers := concat (list .Values.appNamespace) (.Values.user.password.extraAppNamespaces | default list) | uniq }}
# The single tier's SCRAM credential, copied into the APP namespace. Single mode has no store to read, and a second generator ExternalSecret would mint a different password,
# so ESO's kubernetes provider copies the existing Secret through a ServiceAccount that can read that one Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.user.name }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.user.name }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
rules:
  # resourceNames limits the ESO token to the one Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.user.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.user.name }}-reader
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.user.name }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.user.name }}-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.user.name }}-broker-ns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  # Without conditions a ClusterSecretStore serves every namespace, so any ExternalSecret could read what the Role names.
  conditions:
    - namespaces:
        {{- range $consumers }}
        - {{ . | quote }}
        {{- end }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        # kube-root-ca.crt exists in every namespace, so the API server CA needs no distribution.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: {{ .Values.user.name }}-reader
          namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.user.name }}-appns
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.user.name }}
  refreshTime: 1h
  namespaceSelectors:
    {{- range $consumers }}
    - matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.user.name }}-broker-ns
      kind: ClusterSecretStore
    target:
      # The name every dfe-* chart's kafka.saslSecretName defaults to.
      name: {{ .Values.user.name }}
      creationPolicy: Owner
    # Copied key for key, so the Secret matches the broker's byte for byte.
    data:
      - secretKey: username
        remoteRef:
          key: {{ .Values.user.name }}
          property: username
      - secretKey: password
        remoteRef:
          key: {{ .Values.user.name }}
          property: password
      - secretKey: sasl.mechanism
        remoteRef:
          key: {{ .Values.user.name }}
          property: sasl.mechanism
{{- end }}
