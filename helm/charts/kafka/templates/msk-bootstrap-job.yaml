{{- if and (eq .Values.kafka.mode "external") (eq .Values.kafka.external.provider "msk") }}
{{- $msk := .Values.kafka.external.msk }}
{{- if and $msk.bootstrap.enabled $msk.bootstrapIam }}
{{- $iam := $msk.bootstrap.iamAuth }}
{{- $jarName := printf "aws-msk-iam-auth-%s-all.jar" $iam.version }}
{{- $jarUrl := $iam.url | default (printf "https://github.com/aws/aws-msk-iam-auth/releases/download/v%s/%s" $iam.version $jarName) }}
{{- $topicOps := list "Read" "Write" "Create" "Describe" "Alter" "Delete" "DescribeConfigs" "AlterConfigs" }}
# The MSK bootstrap: writes the SCRAM principal's ACLs over SASL/IAM, because nothing else can write the first ACL (docs/deployment/kafka/aws-msk-operations.md, "The bootstrap Job").
# It creates no topic, since dfe-engine does at startup, which is why the grants include Create. The ACL set is kafka-user.yaml's, grant for grant.
apiVersion: batch/v1
kind: Job
metadata:
  # The inputs are hashed into the name so a changed principal, grant set or jar version is a new Job. Replace=true cannot replace one: the API server only defaults spec.selector on create.
  name: {{ .Values.kafka.name }}-msk-bootstrap-{{ printf "%s|%s|%s" $msk.scramUsername (join "," $topicOps) $iam.version | sha256sum | trunc 8 }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # Tracked, not a PreSync hook: Argo omits hooks from the resource tree, so a hook that never fires is invisible. Tracked, the Job holds the app layer back until the ACLs exist.
    # Wave 0 follows the wave -1 ServiceAccount.
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ $msk.bootstrap.backoffLimit }}
  ttlSecondsAfterFinished: {{ $msk.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      # The Pod Identity association names this account and namespace, and the agent injects credentials only when both match.
      serviceAccountName: {{ $msk.bootstrap.serviceAccount }}
      # Holds a Pod Identity credential that writes ACLs and fetches a jar, so it gets the hardening cruise-control-ui.yaml has.
      {{- include "dfe-common.podSecurityContext" . | nindent 6 }}
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      volumes:
        # The jar the init container fetches, for the CLI container.
        - name: iam-auth
          emptyDir: {}
        # The client properties are written at runtime, so /tmp must be writable.
        - name: tmp
          emptyDir: {}
      initContainers:
        # kafka.cliImage has the Kafka CLIs but not the MSK IAM auth library, so this fetches the jar with the same image. wget is the fallback where curl is absent.
        - name: fetch-iam-auth
          image: {{ required "kafka.cliImage names the image the MSK bootstrap Job runs" .Values.kafka.cliImage | quote }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml $msk.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: iam-auth
              mountPath: /opt/msk-iam
          command:
            - /bin/sh
            - -c
            - |
              set -e
              URL="{{ $jarUrl }}"
              WANT="{{ $iam.sha256 }}"
              JAR=/opt/msk-iam/{{ $jarName }}
              echo "Fetching ${URL}"
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL -o "$JAR" "$URL"
              else
                wget -q -O "$JAR" "$URL"
              fi
              # Verified before the CLI loads it, because the jar signs the admin calls.
              GOT=$(sha256sum "$JAR" | cut -d' ' -f1)
              if [ "$GOT" != "$WANT" ]; then
                echo "checksum mismatch for ${URL}: got ${GOT}, want ${WANT}" >&2
                exit 1
              fi
              echo "aws-msk-iam-auth {{ $iam.version }} verified: ${GOT}"
      containers:
        - name: msk-bootstrap
          image: {{ required "kafka.cliImage names the image the MSK bootstrap Job runs" .Values.kafka.cliImage | quote }}
          {{- include "dfe-common.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml $msk.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: iam-auth
              mountPath: /opt/msk-iam
            - name: tmp
              mountPath: /tmp
          env:
            # kafka-run-class.sh appends the shipped libs to CLASSPATH, which is how the IAM login module reaches the CLI.
            - name: CLASSPATH
              value: /opt/msk-iam/{{ $jarName }}
            {{- with $msk.region }}
            # Normally unset, as the Pod Identity agent injects AWS_REGION. This pins the signing region.
            - name: AWS_REGION
              value: {{ . | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BOOTSTRAP="{{ $msk.bootstrapIam }}"
              CFG=/tmp/msk-client.properties
              # No credential here: the login module reads the Pod Identity agent's.
              cat > "$CFG" <<EOF
              security.protocol=SASL_SSL
              sasl.mechanism=AWS_MSK_IAM
              sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
              sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
              EOF
              echo "Waiting for ${BOOTSTRAP}..."
              for i in $(seq 1 60); do
                if /opt/kafka/bin/kafka-broker-api-versions.sh \
                     --bootstrap-server "$BOOTSTRAP" --command-config "$CFG" >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              # kafka-acls.sh --add is idempotent, so a re-run re-asserts the grants.
              /opt/kafka/bin/kafka-acls.sh --bootstrap-server "$BOOTSTRAP" --command-config "$CFG" --add --allow-principal "User:{{ $msk.scramUsername }}" {{ range $topicOps }}--operation {{ . }} {{ end }}--topic "*" --resource-pattern-type literal
              # A prefixed name is the literal prefix: a '*' would match "dfe-*" groups, not "dfe-".
              /opt/kafka/bin/kafka-acls.sh --bootstrap-server "$BOOTSTRAP" --command-config "$CFG" --add --allow-principal "User:{{ $msk.scramUsername }}" --operation Read --operation Describe --group "dfe-" --resource-pattern-type prefixed
              echo "ACLs now on the cluster:"
              /opt/kafka/bin/kafka-acls.sh --bootstrap-server "$BOOTSTRAP" --command-config "$CFG" --list
{{- end }}
{{- end }}
