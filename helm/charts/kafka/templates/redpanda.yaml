{{- if eq .Values.kafka.provider "redpanda" }}
{{- if eq .Values.kafka.mode "cluster" }}
{{- /* Inside the mode gate: a leftover provider: redpanda on mode: external
       deploys no Redpanda from anywhere, so demanding the licence there refuses
       a render that ships nothing. Single mode carries its own check, beside the
       StatefulSet it deploys (kafka-single.yaml). */}}
{{- if not .Values.kafka.redpanda.acceptLicense }}
{{- fail "Redpanda is BSL-licensed (source-available, not OSS): set kafka.redpanda.acceptLicense=true to proceed. Running DFE+redpanda as a service needs a commercial licence from BOTH HyperI (DFE) and Redpanda Data (redpanda) -- see docs/REDPANDA-LIMITATIONS.md." }}
{{- end }}
{{- $replicas := int (include "dfe-kafka.brokerCount" .) }}
{{- $rf := min (int .Values.kafka.profile.scale.replicationFactor) $replicas }}
# Redpanda cluster, managed by the Redpanda operator (cluster.redpanda.com/v1alpha2).
# First-class provider alongside Strimzi, run the SAME way: operator + thin CR.
# SASL/SCRAM-512 on, TLS off (SCRAM over plaintext internal -- matches Strimzi's
# plain listener and the DFE kafka auth standard). The operator generates+manages
# the bootstrap superuser secret; the dfe service account is a separate User CR
# (redpanda-user.yaml), whose secret shape matches the Strimzi KafkaUser secret so
# clients are identical across providers.
apiVersion: cluster.redpanda.com/v1alpha2
kind: Redpanda
metadata:
  name: {{ .Values.kafka.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  clusterSpec:
    # DFE broker/topic defaults mapped to Redpanda cluster properties (Kafka's
    # server.properties names differ on Redpanda). NOT yet live-validated: verify
    # the config.cluster path against the pinned operator (26.2.3) on first deploy.
    # compression is intentionally omitted -- Redpanda topics default compression to
    # `producer`, matching the Strimzi default (the client sizing profile owns the
    # codec). min.insync.replicas has no direct cluster property: Redpanda's Raft
    # consensus needs a write quorum (majority) for acks=all, giving the RF3
    # durability equivalent; set min.insync.replicas per-topic for a stricter floor.
    # unclean leader election does not apply -- Raft never elects a non-quorum leader.
    config:
      cluster:
        default_topic_partitions: {{ include "dfe-kafka.partitions" . }}
        default_topic_replications: {{ $rf }}
        log_retention_ms: {{ include "dfe-kafka.retentionMs" . }}
        retention_bytes: {{ include "dfe-kafka.retentionBytes" . }}
        # Redpanda's half of the size chain. kafka_batch_max_bytes is the
        # message ceiling (default 1 MiB) and kafka_max_message_size_upper_limit_bytes
        # is the guard it cannot be raised past, so both move together.
        kafka_batch_max_bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
        kafka_max_message_size_upper_limit_bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
        # Pinned rather than left at the shipped default: v26.2.2 defaults this
        # to `continuous`, which is licence-gated and sanctioned back to node_add
        # on an unlicensed cluster -- so a licence appearing later would change
        # balancing behaviour with no config change of ours.
        partition_autobalancing_mode: {{ ternary .Values.kafka.rebalancing.redpanda.partitionAutobalancingMode "off" .Values.kafka.rebalancing.enabled | quote }}
        # Per-sender bandwidth while a new replica catches up -- Redpanda's
        # equivalent of the Strimzi replication throttle.
        raft_learner_recovery_rate: {{ int64 .Values.kafka.rebalancing.redpanda.raftLearnerRecoveryRate }}
    # DFE runs redpanda headless -- no Console UI (extra pod + its own config/secret).
    console:
      enabled: false
    statefulset:
      replicas: {{ $replicas }}
    # The operator's chart refuses an image.tag that is not bare semver, so this CR cannot carry kafka.redpanda.image.digest.
    image:
      repository: {{ .Values.kafka.redpanda.image.repository }}
      tag: {{ .Values.kafka.redpanda.image.tag }}
    storage:
      persistentVolume:
        enabled: true
        size: {{ .Values.kafka.storage.size }}
        {{- with (.Values.kafka.storage.storageClass | default .Values.storageClass) }}
        storageClass: {{ . | quote }}
        {{- end }}
    resources:
      requests:
        cpu: {{ .Values.kafka.resources.requests.cpu | quote }}
        memory: {{ .Values.kafka.resources.requests.memory | quote }}
      limits:
        cpu: {{ .Values.kafka.resources.limits.cpu | quote }}
        memory: {{ .Values.kafka.resources.limits.memory | quote }}
    tls:
      enabled: false
    auth:
      sasl:
        enabled: true
        mechanism: SCRAM-SHA-512
        # The operator auto-generates the bootstrap superuser secret
        # (<name>-bootstrap-user/password) and PREPENDS this user to the cluster
        # superusers list, then authenticates as it to reconcile the User CR --
        # so no secret for us to provide and no static users needed.
        bootstrapUser:
          name: {{ .Values.kafka.redpanda.auth.superuserName }}
          mechanism: SCRAM-SHA-512
        # secretRef must be set AND the Secret must pre-exist (the chart only
        # creates it when users[] is non-empty, which we keep empty). It would
        # carry extra static SASL users; we need none, so it is an empty
        # placeholder (redpanda-superusers-secret.yaml).
        secretRef: {{ .Values.kafka.name }}-superusers
    {{- if .Values.nodeScheduling }}
    {{- if .Values.nodeScheduling.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.nodeScheduling.nodeSelector | nindent 6 }}
    {{- end }}
    {{- if .Values.nodeScheduling.tolerations }}
    tolerations:
      {{- toYaml .Values.nodeScheduling.tolerations | nindent 6 }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
