{{- if eq .Values.kafka.provider "redpanda" }}
{{- if eq .Values.kafka.mode "cluster" }}
{{- /* Inside the mode gate: provider: redpanda left on mode: external deploys no Redpanda, so the licence check would refuse a render that ships nothing. Single mode checks beside its StatefulSet (kafka-single.yaml). */}}
{{- if not .Values.kafka.redpanda.acceptLicense }}
{{- fail "Redpanda is source-available under the Business Source License 1.1: set kafka.redpanda.acceptLicense=true once you have read it. See docs/deployment/kafka/redpanda-limitations.md." }}
{{- end }}
{{- $licence := .Values.kafka.redpanda.enterprise.licenseSecretRef }}
{{- if and (not $licence.name) (not (has .Values.kafka.rebalancing.redpanda.partitionAutobalancingMode (list "off" "node_add"))) }}
{{- fail (printf "kafka.rebalancing.redpanda.partitionAutobalancingMode %q is a Redpanda Enterprise feature: use node_add or off, or name a licence in kafka.redpanda.enterprise.licenseSecretRef." .Values.kafka.rebalancing.redpanda.partitionAutobalancingMode) }}
{{- end }}
{{- $replicas := int (include "dfe-kafka.brokerCount" .) }}
{{- $rf := min (int .Values.kafka.profile.scale.replicationFactor) $replicas }}
# Redpanda cluster via the Redpanda operator (cluster.redpanda.com/v1alpha2), a thin CR as with Strimzi. SASL/SCRAM-512 with TLS off, matching Strimzi's plain listener.
# The operator makes the bootstrap superuser Secret. The service account is the User CR (redpanda-user.yaml), and the app-namespace Secret comes from the same ClusterExternalSecret as Strimzi.
apiVersion: cluster.redpanda.com/v1alpha2
kind: Redpanda
metadata:
  name: {{ .Values.kafka.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  clusterSpec:
    # DFE broker and topic defaults, in Redpanda's cluster property names.
    # No compression property: Redpanda topics default to producer. No min.insync.replicas: Raft needs a quorum for acks=all.
    # No unclean leader election: Raft never elects a non-quorum leader.
    config:
      cluster:
        default_topic_partitions: {{ include "dfe-kafka.partitions" . }}
        default_topic_replications: {{ $rf }}
        log_retention_ms: {{ include "dfe-kafka.retentionMs" . }}
        retention_bytes: {{ include "dfe-kafka.retentionBytes" . }}
        # Both move with the size chain: the first is the message ceiling and the second the guard it cannot be raised past.
        kafka_batch_max_bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
        kafka_max_message_size_upper_limit_bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
        # Pinned: Redpanda's defaults turn both on as Enterprise features, and one in use when the trial licence lapses blocks broker upgrades.
        partition_autobalancing_mode: {{ ternary .Values.kafka.rebalancing.redpanda.partitionAutobalancingMode "off" .Values.kafka.rebalancing.enabled | quote }}
        {{- if not $licence.name }}
        core_balancing_continuous: false
        {{- end }}
        # Per-sender bandwidth while a replica catches up, Redpanda's equivalent of the Strimzi replication throttle.
        raft_learner_recovery_rate: {{ int64 .Values.kafka.rebalancing.redpanda.raftLearnerRecoveryRate }}
    {{- with $licence.name }}
    # Beta: a licensed cluster keeps Redpanda's default Enterprise features.
    enterprise:
      licenseSecretRef:
        name: {{ . | quote }}
        key: {{ $licence.key | quote }}
    {{- end }}
    # No Console UI (an extra pod, config and Secret).
    console:
      enabled: false
    statefulset:
      replicas: {{ $replicas }}
    # The operator's chart refuses an image.tag that is not bare semver, so this CR cannot carry kafka.redpanda.image.digest.
    image:
      repository: {{ .Values.kafka.redpanda.image.repository }}
      tag: {{ .Values.kafka.redpanda.image.tag }}
    storage:
      persistentVolume:
        enabled: true
        size: {{ .Values.kafka.storage.size }}
        {{- with (.Values.kafka.storage.storageClass | default .Values.storageClass) }}
        storageClass: {{ . | quote }}
        {{- end }}
    resources:
      requests:
        cpu: {{ .Values.kafka.resources.requests.cpu | quote }}
        memory: {{ .Values.kafka.resources.requests.memory | quote }}
      limits:
        cpu: {{ .Values.kafka.resources.limits.cpu | quote }}
        memory: {{ .Values.kafka.resources.limits.memory | quote }}
    tls:
      enabled: false
    auth:
      sasl:
        enabled: true
        mechanism: SCRAM-SHA-512
        # The operator generates the bootstrap superuser Secret and prepends this user to the superusers, so no secret or static users are needed.
        bootstrapUser:
          name: {{ .Values.kafka.redpanda.auth.superuserName }}
          mechanism: SCRAM-SHA-512
        # Must be set and the Secret must pre-exist (redpanda-superusers-secret.yaml): the chart only creates it when users[] is non-empty.
        secretRef: {{ .Values.kafka.name }}-superusers
    {{- if .Values.nodeScheduling }}
    {{- with include "dfe-kafka.poolSelector" (dict "root" $ "pool" "kafka-broker") | fromYaml }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.nodeScheduling.tolerations }}
    tolerations:
      {{- toYaml .Values.nodeScheduling.tolerations | nindent 6 }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
