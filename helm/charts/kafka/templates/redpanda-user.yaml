{{- if eq .Values.kafka.provider "redpanda" }}
{{- if eq .Values.kafka.mode "cluster" }}
# DFE service account on redpanda -- the operator's User CR, the direct analogue
# of the Strimzi KafkaUser (kafka-user.yaml). Same SCRAM-512 mechanism, same ACLs
# (topic '*': Read/Write/Create/Describe/Alter/Delete/DescribeConfigs/AlterConfigs;
# consumer groups prefixed 'dfe-': Read/Describe), and the same password source:
# <user>-store when user.password.fromSecretsStore is on, else a Secret named
# after the user that the operator generates into. Neither carries username or
# sasl.mechanism, so clusterexternalsecret-appns.yaml and kafka-user-appkeys.yaml
# write those, as they do on Strimzi.
#
# The topic set is the same on every provider because one principal drives every
# topic call dfe-engine makes; kafka-user.yaml maps each operation to its call.
# Cluster operations are withheld here as they are there.
apiVersion: cluster.redpanda.com/v1alpha2
kind: User
metadata:
  name: {{ .Values.user.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  cluster:
    # clusterRef SRV discovery is broken when SASL is enabled (operator bug #1130
    # "Operator fails to load credentials from clusterRef when SASL is enabled" --
    # the User controller does an SRV lookup of _kafka._tcp.<svc> that fails).
    # staticConfiguration points the controller straight at the kafka + admin
    # endpoints, authenticating as the operator-generated bootstrap superuser.
    # Revert to clusterRef once the upstream bug is fixed.
    staticConfiguration:
      kafka:
        brokers:
          - {{ .Values.kafka.name }}.{{ .Release.Namespace }}.svc.cluster.local:9093
        sasl:
          username: {{ .Values.kafka.redpanda.auth.superuserName }}
          mechanism: SCRAM-SHA-512
          passwordSecretRef:
            name: {{ .Values.kafka.name }}-bootstrap-user
            key: password
      admin:
        urls:
          - http://{{ .Values.kafka.name }}.{{ .Release.Namespace }}.svc.cluster.local:9644
        sasl:
          username: {{ .Values.kafka.redpanda.auth.superuserName }}
          mechanism: SCRAM-SHA-512
          passwordSecretRef:
            name: {{ .Values.kafka.name }}-bootstrap-user
            key: password
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .Values.user.name }}{{ if .Values.user.password.fromSecretsStore }}-store{{ end }}
          key: password
  authorization:
    type: simple
    acls:
      - type: allow
        resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Read", "Write", "Create", "Describe", "Alter", "Delete", "DescribeConfigs", "AlterConfigs"]
      - type: allow
        resource:
          type: group
          # patternType prefixed -> the name is the literal prefix (NOT a glob).
          # All DFE consumer groups are "dfe-"-prefixed.
          name: "dfe-"
          patternType: prefixed
        operations: ["Read", "Describe"]
{{- end }}
{{- end }}
