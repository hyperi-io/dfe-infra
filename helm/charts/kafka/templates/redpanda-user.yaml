{{- if eq .Values.kafka.provider "redpanda" }}
{{- if eq .Values.kafka.mode "cluster" }}
# The Redpanda operator's User CR, the analogue of the Strimzi KafkaUser (kafka-user.yaml): same SCRAM-512, same ACLs, same password source
# (<user>-store when user.password.fromSecretsStore, else the operator-generated Secret). Neither Secret has username or sasl.mechanism,
# so clusterexternalsecret-appns.yaml and kafka-user-appkeys.yaml write them.
apiVersion: cluster.redpanda.com/v1alpha2
kind: User
metadata:
  name: {{ .Values.user.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  cluster:
    # clusterRef discovery fails with SASL on (redpanda-operator #1130), so the controller is pointed at the endpoints directly, as the bootstrap superuser.
    staticConfiguration:
      kafka:
        brokers:
          - {{ .Values.kafka.name }}.{{ .Release.Namespace }}.svc.cluster.local:9093
        sasl:
          username: {{ .Values.kafka.redpanda.auth.superuserName }}
          mechanism: SCRAM-SHA-512
          passwordSecretRef:
            name: {{ .Values.kafka.name }}-bootstrap-user
            key: password
      admin:
        urls:
          - http://{{ .Values.kafka.name }}.{{ .Release.Namespace }}.svc.cluster.local:9644
        sasl:
          username: {{ .Values.kafka.redpanda.auth.superuserName }}
          mechanism: SCRAM-SHA-512
          passwordSecretRef:
            name: {{ .Values.kafka.name }}-bootstrap-user
            key: password
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .Values.user.name }}{{ if .Values.user.password.fromSecretsStore }}-store{{ end }}
          key: password
  authorization:
    type: simple
    acls:
      - type: allow
        resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Read", "Write", "Create", "Describe", "Alter", "Delete", "DescribeConfigs", "AlterConfigs"]
      - type: allow
        resource:
          type: group
          # A prefixed name is the literal prefix, not a glob.
          name: "dfe-"
          patternType: prefixed
        operations: ["Read", "Describe"]
{{- end }}
{{- end }}
