{{- if and (eq .Values.kafka.mode "external") (eq .Values.kafka.external.provider "msk") }}
{{- $msk := .Values.kafka.external.msk }}
{{- if and $msk.bootstrap.enabled $msk.bootstrapIam }}
# The identity the MSK bootstrap Job runs as (msk-bootstrap-job.yaml). No Kubernetes RBAC: the Job talks to MSK and never the API server.
# The Pod Identity association in terraform/modules/managed-kafka/msk/bootstrap.tf names this account and namespace, and a rename on either side leaves the Job with no credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $msk.bootstrap.serviceAccount }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    # Wave -1: the account has to exist before the Job that names it.
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
{{- end }}
