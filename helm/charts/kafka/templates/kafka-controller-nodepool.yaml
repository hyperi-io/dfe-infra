{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") .Values.kafka.controllerPool.enabled }}
# The KRaft controller pool, the metadata quorum kept off the brokers. Why and how it is sized: docs/deployment/kafka/README.md, "Sizing dials".
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.kafka.name }}-controller
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.kafka.controllerPool.replicas }}
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.controllerPool.storage.size }}
        kraftMetadata: shared
        deleteClaim: false
        {{- with (.Values.kafka.controllerPool.storage.storageClass | default .Values.kafka.storage.storageClass | default .Values.storageClass) }}
        class: {{ . }}
        {{- end }}
  resources:
    {{- toYaml .Values.kafka.controllerPool.resources | nindent 4 }}
  {{- if or .Values.nodeScheduling .Values.kafka.podSpread.enabled }}
  template:
    pod:
      {{- if .Values.nodeScheduling }}
      {{- with include "dfe-kafka.poolSelector" (dict "root" $ "pool" "kraft-controller") | fromYaml }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- range $key, $val := . }}
                  - key: {{ $key }}
                    operator: In
                    values:
                      - {{ $val | quote }}
                  {{- end }}
      {{- end }}
      {{- if .Values.nodeScheduling.tolerations }}
      tolerations:
        {{- toYaml .Values.nodeScheduling.tolerations | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.kafka.podSpread.enabled }}
      # Three controllers on one node are one node loss from no control plane.
      {{- /* Controller pods only (label source: scripts/tests/test_kafka_pool_spread.py). */}}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.kafka.podSpread.maxSkew }}
          topologyKey: {{ .Values.kafka.podSpread.topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.kafka.name }}
              strimzi.io/controller-role: "true"
      {{- end }}
  {{- end }}
{{- end }}
