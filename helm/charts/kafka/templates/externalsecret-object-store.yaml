{{- if eq (include "dfe-kafka.storageBulk" .) "object" }}
{{- /* kafka/tiered is frozen: a deployment seeded there that never set remoteKey would lose its credential if it moved. */ -}}
{{- $key := .Values.kafka.objectStore.remoteKey | default (printf "%s/%s/kafka/tiered" .Values.project .Values.env) }}
# The object-store credential: the deploy layer seeds the store, ESO materialises the Secret and the broker environment carries it, so nothing is inline in the Kafka CR.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kafka.objectStore.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kafka.objectStore.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kafka.objectStore.secretName }}
    creationPolicy: Owner
  data:
    {{- /* secretKey is what the broker env reads; only the remote side is settable. */}}
    - secretKey: access_key_id
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.kafka.objectStore.accessKeyProperty }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.kafka.objectStore.secretKeyProperty }}
{{- end }}
