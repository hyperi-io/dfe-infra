{{- if eq (include "dfe-kafka.storageBulk" .) "object" }}
{{- /* The derived path is frozen at kafka/tiered: a deployment that seeded there
and never set remoteKey would lose its credential if it moved. */ -}}
{{- $key := .Values.kafka.objectStore.remoteKey | default (printf "%s/%s/kafka/tiered" .Values.project .Values.env) }}
# Object-store credential for any model with an object bulk store. Same seam as
# the mode=external broker credential: the deploy layer seeds the store, ESO
# materialises the Secret, and the RemoteStorageManager reads it from the broker
# environment -- so nothing is inline in the Kafka CR, which lives in git.
{{- /*
The remote key and its field names are values, so a deployment can bind a
credential the estate already holds rather than re-seeding it under a DFE path.
Template comments, so the defaults still render byte-identically.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kafka.objectStore.secretName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kafka.objectStore.secretStoreName | default "dfe-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kafka.objectStore.secretName }}
    creationPolicy: Owner
  data:
    {{- /* secretKey is what the broker env reads; only the remote side is settable. */}}
    - secretKey: access_key_id
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.kafka.objectStore.accessKeyProperty }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.kafka.objectStore.secretKeyProperty }}
{{- end }}
