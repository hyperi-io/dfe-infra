{{- /* A managed broker (mode=external with a named provider) takes the same projection: its credential is seeded in the store like ours, and nothing else puts it where the apps read it. */}}
{{- $inCluster := and (eq .Values.kafka.mode "cluster") (eq .Values.kafka.provider "strimzi") .Values.user.password.fromSecretsStore }}
{{- $managed := and (eq .Values.kafka.mode "external") .Values.kafka.external.provider (ne .Values.kafka.external.auth.type "msk_iam") }}
{{- /* Confluent Cloud's username is its API key, so it is read from the store; a SCRAM principal is a fixed name, and on MSK the one the bootstrap Job's ACLs grant. */}}
{{- $storedUser := and $managed (eq .Values.kafka.external.provider "confluent-cloud") }}
{{- $username := .Values.user.name }}
{{- if and $managed (eq .Values.kafka.external.provider "msk") }}
{{- $username = .Values.kafka.external.msk.scramUsername }}
{{- end }}
{{- if and (or $inCluster $managed) .Values.appNamespace }}
# The DFE service user's credential, projected into the APP namespace(s) from the
# secrets store.
#
# This chart owns the KafkaUser, so it owns making that user's credential reachable
# by the apps. Strimzi mints only into the broker's namespace and nothing bridges the
# two (stakater Reflector is NOT deployed -- only *reloader*, a different product),
# so without this every dfe-* pod that wants Kafka sits in CreateContainerConfigError.
#
# ClusterExternalSecret, not a plain ExternalSecret, because the Secret must land in
# a namespace this Application does not target. It is cluster-scoped and singly
# owned, so no second Argo Application fights over the same Secret -- which is what
# would happen if each dfe-* chart created its own `dfe-kafka-user`.
#
# Selected by `kubernetes.io/metadata.name`, the label Kubernetes puts on EVERY
# namespace, so no extra labelling step is needed. `spec.namespaces` would be
# simpler but is deprecated in favour of namespaceSelectors.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.user.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.user.name }}
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: {{ .Values.appNamespace }}
    {{- range .Values.user.password.extraAppNamespaces }}
    - matchLabels:
        kubernetes.io/metadata.name: {{ . }}
    {{- end }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.user.password.secretStoreName | default "dfe-secret-store" }}
      kind: ClusterSecretStore
    target:
      # The name every dfe-* chart's kafka.saslSecretName defaults to.
      name: {{ .Values.user.name }}
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          # The SAME secret shape kafka-single-user.yaml produces, so clients
          # authenticate identically across the single and scale tiers.
          #
          # username is templated, not stored: only the password is a secret, and
          # Strimzi's own Secret notably does NOT carry a username key (it has
          # password + sasl.jaas.config), which is exactly why the apps fail today.
          #
          # sasl.mechanism is carried because dfe-receiver cannot supply it itself --
          # its normalize() sets only sasl.enabled and its SaslConfig derives
          # Default -> mechanism "", which librdkafka rejects. dfe-loader has an
          # explicit default and does not need this. Derived from the provider
          # table, never hand-set: the librdkafka spelling (SCRAM-SHA-512), since
          # the underscore form the engine model emits is rejected.
          {{- if $storedUser }}
          # Except on Confluent Cloud, where the username IS the API key.
          username: "{{ `{{ .username }}` }}"
          {{- else }}
          username: {{ $username | quote }}
          {{- end }}
          password: "{{ `{{ .password }}` }}"
          sasl.mechanism: {{ include "dfe-common.kafkaSaslMechanism" (include "dfe-kafka.providerIdentity" .) | quote }}
    data:
      {{- if $storedUser }}
      - secretKey: username
        remoteRef:
          key: {{ include "dfe-kafka.credentialKey" . }}
          property: username
      {{- end }}
      - secretKey: password
        remoteRef:
          key: {{ include "dfe-kafka.credentialKey" . }}
          property: password
{{- end }}
