{{- /* A managed broker (mode=external with a named provider) takes the same projection: its credential is in the store -- seeded like ours, or on MSK the broker's own secret -- and nothing else puts it where the apps read it. */}}
{{- $inCluster := and (eq .Values.kafka.mode "cluster") (has .Values.kafka.provider (list "strimzi" "redpanda")) .Values.user.password.fromSecretsStore }}
{{- $managed := and (eq .Values.kafka.mode "external") .Values.kafka.external.provider (ne .Values.kafka.external.auth.type "msk_iam") }}
{{- /* Confluent Cloud's username is its API key, so it is read from the store; a SCRAM principal is a fixed name, and on MSK the one the bootstrap Job's ACLs grant. */}}
{{- $storedUser := and $managed (eq .Values.kafka.external.provider "confluent-cloud") }}
{{- $username := .Values.user.name }}
{{- if and $managed (eq .Values.kafka.external.provider "msk") }}
{{- $username = .Values.kafka.external.msk.scramUsername }}
{{- end }}
{{- /* On MSK the broker's own AmazonMSK_ secret is the one copy, read by ARN through the store with no path prefix. */}}
{{- $mskSecret := and $managed (eq .Values.kafka.external.provider "msk") .Values.kafka.external.msk.credentialRef }}
{{- $storeName := .Values.user.password.secretStoreName | default "dfe-secret-store" }}
{{- $key := include "dfe-kafka.credentialKey" . }}
{{- if $mskSecret }}
{{- $storeName = .Values.user.password.unprefixedStoreName }}
{{- $key = .Values.kafka.external.msk.credentialRef }}
{{- end }}
{{- if and (or $inCluster $managed) .Values.appNamespace }}
# The service user's credential, projected from the secrets store into the app namespace(s). Strimzi mints only into the broker's namespace, so without this every dfe-* pod that wants Kafka sits in CreateContainerConfigError.
# A ClusterExternalSecret because the Secret lands outside this Application's namespace, and one cluster-scoped owner stops a second Argo Application fighting over it.
# Namespaces are selected by kubernetes.io/metadata.name, which every namespace carries.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.user.name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  externalSecretName: {{ .Values.user.name }}
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: {{ .Values.appNamespace }}
    {{- range .Values.user.password.extraAppNamespaces }}
    - matchLabels:
        kubernetes.io/metadata.name: {{ . }}
    {{- end }}
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ $storeName }}
      kind: ClusterSecretStore
    target:
      # The name every dfe-* chart's kafka.saslSecretName defaults to.
      name: {{ .Values.user.name }}
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          # The Secret shape kafka-single-user.yaml produces. username is templated, not stored, because Strimzi's Secret has no username key.
          # sasl.mechanism is carried because a client's default is wrong for a PLAIN broker. Derived from the provider table, in librdkafka spelling (SCRAM-SHA-512).
          {{- if $storedUser }}
          # Confluent Cloud: the username is the API key.
          username: "{{ `{{ .username }}` }}"
          {{- else }}
          username: {{ $username | quote }}
          {{- end }}
          password: "{{ `{{ .password }}` }}"
          sasl.mechanism: {{ include "dfe-common.kafkaSaslMechanism" (include "dfe-kafka.providerIdentity" .) | quote }}
    data:
      {{- if $storedUser }}
      - secretKey: username
        remoteRef:
          key: {{ $key }}
          property: username
      {{- end }}
      - secretKey: password
        remoteRef:
          key: {{ $key }}
          property: password
{{- end }}
