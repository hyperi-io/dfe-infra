{{- if and (eq .Values.kafka.provider "strimzi") (eq .Values.kafka.mode "cluster") .Values.kafka.rebalancing.enabled }}
{{/*
Configuration templates the Kafka CR's autoRebalance modes point at, not rebalance requests: the strimzi.io/rebalance-template annotation makes the Cluster Operator copy them into a KafkaRebalance on a spec.replicas change.
No strimzi.io/cluster label, as in Strimzi's own example, or each would read as a request. replicationThrottle is always set because Strimzi leaves replica movement unlimited otherwise. Goals: kafka.rebalancing.goals.
*/}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: {{ .Values.kafka.name }}-rebalance-add-brokers
  annotations:
    strimzi.io/rebalance-template: "true"
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicationThrottle: {{ int64 .Values.kafka.rebalancing.replicationThrottleBytesS }}
  {{- with .Values.kafka.rebalancing.goals }}
  goals:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: {{ .Values.kafka.name }}-rebalance-remove-brokers
  annotations:
    strimzi.io/rebalance-template: "true"
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  replicationThrottle: {{ int64 .Values.kafka.rebalancing.replicationThrottleBytesS }}
  {{- with .Values.kafka.rebalancing.goals }}
  goals:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
