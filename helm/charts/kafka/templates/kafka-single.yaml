{{- if eq .Values.kafka.mode "single" }}
{{- $name := .Values.kafka.name }}
{{- $fqdn := printf "%s.%s.svc.cluster.local" $name .Release.Namespace }}
# The single tier: a plain StatefulSet with no operator, and the same SASL/SCRAM-SHA-512 user as the cluster tier (kafka-single-user.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
  ports:
    - name: sasl
      port: 9092
      targetPort: 9092
{{- if eq .Values.kafka.provider "redpanda" }}
{{- if not .Values.kafka.redpanda.acceptLicense }}
{{- fail "Redpanda is source-available under the Business Source License 1.1: set kafka.redpanda.acceptLicense=true once you have read it. See docs/deployment/kafka/redpanda-limitations.md." }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
    spec:
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: redpanda
          image: "{{ .Values.kafka.redpanda.image.repository }}:{{ .Values.kafka.redpanda.image.tag }}{{ with .Values.kafka.redpanda.image.digest }}@{{ . }}{{ end }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cat >/etc/redpanda/.bootstrap.yaml <<CFG
              superusers: ["${KAFKA_USER}"]
              enable_sasl: true
              kafka_enable_authorization: true
              # Single broker is RF1, so default_topic_replications keeps its default of 1.
              default_topic_partitions: {{ include "dfe-kafka.partitions" . }}
              log_retention_ms: {{ include "dfe-kafka.retentionMs" . }}
              retention_bytes: {{ include "dfe-kafka.retentionBytes" . }}
              kafka_batch_max_bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
              kafka_max_message_size_upper_limit_bytes: {{ include "dfe-kafka.messageMaxBytes" . }}
              CFG
              rpk redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M \
                --node-id 0 --check=false \
                --kafka-addr SASL_PLAINTEXT://0.0.0.0:9092 \
                --advertise-kafka-addr SASL_PLAINTEXT://{{ $fqdn }}:9092 &
              RP_PID=$!
              until rpk cluster health >/dev/null 2>&1; do kill -0 "${RP_PID}" || exit 1; sleep 2; done
              rpk security user create "${KAFKA_USER}" -p "${KAFKA_PASSWORD}" --mechanism SCRAM-SHA-512 || true
              {{- if .Values.kafka.redpanda.enterprise.licenseSecretRef.name }}
              # Beta: a licensed broker keeps Redpanda's default Enterprise features, and must report no violation.
              (umask 077 && printf '%s' "${REDPANDA_LICENSE}" > /tmp/redpanda.license)
              rpk cluster license set --path /tmp/redpanda.license
              rm -f /tmp/redpanda.license
              licence="$(rpk cluster license info --format json | tr -d ' \n\t')"
              case "${licence}" in
                *'"license_violation":false'*) ;;
                *) echo "ERROR: Redpanda licence violation: ${licence}" >&2; kill "${RP_PID}"; exit 1 ;;
              esac
              {{- else }}
              # Set on every start, because .bootstrap.yaml reaches only a new volume. Both are Enterprise features Redpanda turns on by default.
              rpk cluster config set partition_autobalancing_mode node_add
              rpk cluster config set core_balancing_continuous false
              # The text form drops an empty list, so read the JSON. Stripping whitespace keeps the match on a pretty-printed reply.
              licence="$(rpk cluster license info --format json | tr -d ' \n\t')"
              case "${licence}" in
                *'"enterprise_features_in_use":[]'*) ;;
                *) echo "ERROR: Redpanda Enterprise features in use: ${licence}" >&2; kill "${RP_PID}"; exit 1 ;;
              esac
              {{- end }}
              wait $RP_PID
          env:
            {{- with .Values.kafka.redpanda.enterprise.licenseSecretRef }}
            {{- if .name }}
            - name: REDPANDA_LICENSE
              valueFrom:
                secretKeyRef: { name: {{ .name }}, key: {{ .key }} }
            {{- end }}
            {{- end }}
            - name: KAFKA_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.user.name }}, key: username }
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.user.name }}, key: password }
          ports:
            - containerPort: 9092
          # Without a probe the headless Service publishes the pod IP before the listener binds.
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.kafka.storage.storageClass | default .Values.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}
{{- else }}
---
# Apache Kafka KRaft standalone: the broker Strimzi manages, run without the operator, as one combined broker and controller. The entrypoint formats storage and adds the SCRAM user (--add-scram).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  server.properties.template: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093
    listeners=SASL_PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=SASL_PLAINTEXT://{{ $fqdn }}:9092
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=SASL_PLAINTEXT
    sasl.enabled.mechanisms=SCRAM-SHA-512
    sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
    listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="__USER__" password="__PASSWORD__";
    log.dirs=/var/lib/kafka/data
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    default.replication.factor=1
    min.insync.replicas=1
    # No thread-pool dials: this tier runs on a 2-core broker, where they only add context switching.
    num.partitions={{ include "dfe-kafka.partitions" . }}
    log.retention.ms={{ include "dfe-kafka.retentionMs" . }}
    log.retention.bytes={{ include "dfe-kafka.retentionBytes" . }}
    message.max.bytes={{ include "dfe-kafka.messageMaxBytes" . }}
    replica.fetch.max.bytes={{ include "dfe-kafka.messageMaxBytes" . }}
    # On: this tier has no topic operator to create the receiver's dynamic {source}_land topics.
    auto.create.topics.enable={{ .Values.kafka.profile.single.autoCreateTopics }}
  entrypoint.sh: |
    #!/bin/sh
    set -e
    DATA=/var/lib/kafka/data
    CONF=/tmp/server.properties
    sed -e "s|__USER__|${KAFKA_USER}|g" -e "s|__PASSWORD__|${KAFKA_PASSWORD}|g" \
      /mnt/config/server.properties.template > "$CONF"
    if [ ! -f "$DATA/meta.properties" ]; then
      CID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)
      /opt/kafka/bin/kafka-storage.sh format -t "$CID" -c "$CONF" \
        --add-scram "SCRAM-SHA-512=[name=${KAFKA_USER},password=${KAFKA_PASSWORD}]"
    fi
    exec /opt/kafka/bin/kafka-server-start.sh "$CONF"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "dfe-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dfe-common.labels" . | nindent 8 }}
    spec:
      {{- include "dfe-common.scheduling" . | nindent 6 }}
      containers:
        - name: kafka
          image: "apache/kafka:{{ .Values.kafka.version }}{{ with .Values.kafka.imageDigest }}@{{ . }}{{ end }}"
          command: ["/bin/sh", "/mnt/config/entrypoint.sh"]
          env:
            - name: KAFKA_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.user.name }}, key: username }
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.user.name }}, key: password }
          ports:
            - containerPort: 9092
              name: sasl
          # Without a probe the headless Service publishes the pod IP before KRaft is listening.
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /mnt/config
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.kafka.storage.storageClass | default .Values.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}
{{- end }}
{{- end }}
