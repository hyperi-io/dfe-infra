apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-common.fullname" . }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.openvpn.udp.port }}
      targetPort: openvpn-udp
      protocol: UDP
      name: openvpn-udp
    - port: {{ .Values.openvpn.tcp.port }}
      targetPort: openvpn-tcp
      protocol: TCP
      name: openvpn-tcp
    - port: {{ .Values.openvpn.https.port }}
      targetPort: openvpn-https
      protocol: TCP
      name: openvpn-https
    - port: {{ .Values.wireguard.port }}
      targetPort: wireguard
      protocol: UDP
      name: wireguard
    - port: {{ .Values.wireguard.dpiBypass.port }}
      targetPort: wg-dpi
      protocol: TCP
      name: wg-dpi
    - port: {{ .Values.vpn.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "dfe-common.selectorLabels" . | nindent 4 }}
