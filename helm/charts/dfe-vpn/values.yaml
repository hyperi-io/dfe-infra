project: dfe
component: vpn
env: local
cloud: local

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

vpn:
  protocol: openvpn
  serverCn: ""
  fullTunnel: false
  pushRoutes: ""
  networkProfile: default
  dns1: "1.1.1.1"
  dns2: "1.0.0.1"
  dnsDomain: ""
  maxClients: auto
  healthPort: 8080
  logMode: file

openvpn:
  udp:
    enabled: true
    port: 1194
    network: "192.168.100.0"
    netmask: "255.255.255.0"
  tcp:
    enabled: true
    port: 1194
    network: "192.168.102.0"
    netmask: "255.255.255.0"
  https:
    enabled: true
    port: 443
    network: "192.168.101.0"
    netmask: "255.255.255.0"

wireguard:
  port: 51820
  network: "192.168.200.0/24"
  mtu: 1420
  persistentKeepalive: 25
  dpiBypass:
    enabled: false
    port: 4443

oidc:
  enabled: false
  issuerUrl: ""
  clientId: ""
  clientSecretName: ""

otel:
  enabled: true
  endpoint: ""

metrics:
  enabled: true
  port: 9176

pki:
  mode: local
  externalType: ""

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  annotations: {}

networkPolicy:
  enabled: true
