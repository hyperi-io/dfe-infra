{{- if .Values.loader.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.loader.deploymentName }}-scaler
  namespace: {{ .Values.loader.namespace | default .Release.Namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ .Values.loader.deploymentName }}
  minReplicaCount: {{ .Values.loader.minReplicas }}
  maxReplicaCount: {{ .Values.loader.maxReplicas }}
  cooldownPeriod: {{ .Values.loader.cooldownPeriod }}
  pollingInterval: {{ .Values.loader.pollingInterval }}
  triggers:
    # OTel-native: queries OTel Collector's metrics endpoint (NOT a Prometheus server)
    - type: metrics-api
      metadata:
        targetValue: {{ .Values.loader.scalingPressureThreshold | quote }}
        url: "http://{{ .Values.otel.collectorEndpoint }}:{{ .Values.otel.metricsPort }}/api/v1/query?query=avg(dfe_scaling_pressure{service_name=\"dfe-loader\"})"
        valueLocation: "data.result.0.value.1"
{{- end }}
