project: dfe
component: keda-scalers
env: local
cloud: local

# OTel Collector Gateway — metrics endpoint
# NO Prometheus anywhere. The OTel Collector exposes an OTLP-native metrics API.
# KEDA uses the external (Kedify OTEL Scaler) trigger to receive metrics via OTLP push.
# Fallback: OTel Collector's Prometheus-format exporter (:8889) queried via KEDA's
# prometheus trigger type — but this is an OTel component, NOT a Prometheus server.
otel:
  collectorEndpoint: "dfe-otel-collector-gateway.otel.svc.cluster.local"
  metricsPort: 8889

# Kafka connection for transform ScaledObjects
kafka:
  bootstrapServers: "dfe-kafka-kafka-bootstrap.strimzi.svc.cluster.local:9092"
  # TriggerAuthentication references a K8s secret with SASL credentials
  authSecretName: dfe-kafka-user
  saslType: scram_sha512

# --- Service scalers ---

receiver:
  enabled: true
  deploymentName: dfe-receiver
  namespace: ""   # set via ArgoCD values
  minReplicas: 1
  maxReplicas: 10
  cooldownPeriod: 120
  pollingInterval: 15
  scalingPressureThreshold: "0.7"

loader:
  enabled: true
  deploymentName: dfe-loader
  namespace: ""
  minReplicas: 1
  maxReplicas: 10
  cooldownPeriod: 120
  pollingInterval: 15
  scalingPressureThreshold: "0.7"

# Transform apps — scale-to-zero via Kafka consumer lag
# Each entry creates a ScaledObject tied to a single Kafka topic
transforms: []
# Example:
# - name: transform-wasm
#   deploymentName: dfe-transform-wasm
#   namespace: ""
#   topic: "events_land"
#   consumerGroup: "dfe-transform-wasm"
#   lagThreshold: "10"
#   activationLagThreshold: "1"     # activate from zero at 1+ message
#   minReplicas: 0                  # scale to zero when idle
#   maxReplicas: 10
#   cooldownPeriod: 300             # 5 min idle → scale to 0
#   pollingInterval: 15
