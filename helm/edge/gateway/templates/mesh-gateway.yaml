{{- if and .Values.mesh .Values.mesh.enabled }}
{{- $mesh := .Values.mesh }}
{{- $gw := $mesh.gateway }}
# The INTERNAL Gateway the stage pools sit behind on the direct transport, apart
# from the edge one (docs/deployment/values-shared.md#mesh-pool-balancer). ONE
# listener with no hostname: each pool's GRPCRoute carries its own.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.name }}
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.className }}
  # Its OWN proxy parameters: the class's edge EnvoyProxy is a LoadBalancer.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $gw.name }}-proxy
  listeners:
    - name: mesh
      protocol: HTTP
      port: {{ $mesh.port }}
      allowedRoutes:
        namespaces:
          from: All
        # GRPCRoute only: the pools speak gRPC and nothing else.
        kinds:
          - group: gateway.networking.k8s.io
            kind: GRPCRoute
---
# The mesh proxy: ClusterIP, with more than one replica because every record
# passes through it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $gw.name }}-proxy
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: {{ $mesh.proxy.replicas }}
        container:
          image: {{ $.Values.envoyGateway.proxy.image | quote }}
---
# How the proxy talks to a pool: round robin, with an HTTP/2 PING keepalive that
# finds a silently dead connection.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $gw.name }}-pools
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
  loadBalancer:
    type: {{ $mesh.loadBalancer.type }}
  http2:
    connectionKeepalive:
      interval: {{ $mesh.keepalive.interval }}
      timeout: {{ $mesh.keepalive.timeout }}
---
# The same keepalive on the sender's side of the proxy, which has no idle-connection
# handling of its own.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $gw.name }}-senders
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
  http2:
    connectionKeepalive:
      interval: {{ $mesh.keepalive.interval }}
      timeout: {{ $mesh.keepalive.timeout }}
{{- end }}
