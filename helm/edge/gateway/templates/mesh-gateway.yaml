{{- if and .Values.mesh .Values.mesh.enabled }}
{{- $mesh := .Values.mesh }}
{{- $gw := $mesh.gateway }}
# The INTERNAL Gateway the stage pools sit behind on the direct transport. It is
# a second Gateway, not another listener on the edge one: the edge terminates
# TLS for browsers on 443, and this carries cleartext HTTP/2 between pods on the
# pod network, so putting both on one Gateway would put the data plane behind
# the edge's TLS and OIDC policies.
#
# ONE listener, no hostname. Each pool's GRPCRoute carries its own hostname
# (dfe-common.poolListener), which is what tells the pools apart; naming them
# here as well would put every pool -- including the transform deployments that
# come and go with their sources -- inside this object.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.name }}
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.className }}
  # Its OWN proxy parameters, not the class's. The GatewayClass points at the
  # edge EnvoyProxy, whose Service is a LoadBalancer -- inherited here that
  # would put a public address in front of the data plane.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $gw.name }}-proxy
  listeners:
    - name: mesh
      protocol: HTTP
      port: {{ $mesh.port }}
      allowedRoutes:
        namespaces:
          from: All
        # GRPCRoute only. The pools speak gRPC and nothing else, so an HTTPRoute
        # attaching here would be a mistake rather than a feature.
        kinds:
          - group: gateway.networking.k8s.io
            kind: GRPCRoute
---
# The mesh proxy itself: ClusterIP, because everything that dials it is a pod,
# and more than one replica, because every record on this profile passes through
# it and a single proxy pod would be both the bottleneck and the outage.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $gw.name }}-proxy
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: {{ $mesh.proxy.replicas }}
        container:
          image: {{ $.Values.envoyGateway.proxy.image | quote }}
---
# How the proxy talks to a pool. Round robin rather than the Least Request
# default: every push is one unary RPC of roughly one batch, so the cheap
# measure is the right one, and an even split is what the deploy proof counts.
#
# The HTTP/2 keepalive is the reason a pool listener beats a Service in the
# first place surviving an idle period: one connection carries every request, so
# if it dies silently -- a conntrack entry expiring, a node dropping out -- the
# proxy has to find out by PING rather than on the next batch.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $gw.name }}-pools
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
  loadBalancer:
    type: {{ $mesh.loadBalancer.type }}
  http2:
    connectionKeepalive:
      interval: {{ $mesh.keepalive.interval }}
      timeout: {{ $mesh.keepalive.timeout }}
---
# The same keepalive on the sender's side of the proxy. Both halves need it: a
# dead connection the sender still holds stalls that sender's whole pipeline,
# and the sender is a DFE app with no idle-connection handling of its own.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $gw.name }}-senders
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
  http2:
    connectionKeepalive:
      interval: {{ $mesh.keepalive.interval }}
      timeout: {{ $mesh.keepalive.timeout }}
{{- end }}
