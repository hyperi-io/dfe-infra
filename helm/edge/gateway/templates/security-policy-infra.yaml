{{- if and .Values.oidc.enabled .Values.oidc.providers }}
{{- $policyRoutes := include "envoy-gateway-config.infraPolicyRoutes" (dict "ctx" .) | fromJsonArray }}
{{- $loginName := include "envoy-gateway-config.loginProviderName" (dict "ctx" .) }}
{{- range $login := $.Values.oidc.providers }}
{{- if eq $login.name $loginName }}
{{- range $key := $policyRoutes }}
{{- $r := index $.Values.routes $key }}
{{- $ns := include "envoy-gateway-config.routeNs" (dict "ctx" $ "key" $key) }}
{{- $host := include "envoy-gateway-config.routeHost" (dict "ctx" $ "key" $key) }}
---
# Edge RBAC for an infra-class route: OIDC login, then the groups claim -- read
# from the access token this policy issued and re-validated against the
# provider's JWKS -- must carry one of adminGroups. Authentication alone is
# not enough, and defaultAction Deny means a token with no groups claim is
# refused rather than admitted.
#
# ONE policy per route, never one per provider: two SecurityPolicies naming the
# same HTTPRoute with no sectionName conflict, and only the oldest applies.
# oidc.loginProvider owns the interactive redirect; every configured provider is
# still a JWT issuer below with an Allow rule of its own, so a session minted by
# any of them is accepted here rather than dropped without a word.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-oidc-{{ $r.routeName }}-admin
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}
  oidc:
    provider:
      {{- include "envoy-gateway-config.oidcProvider" (dict "provider" $login) | nindent 6 }}
    clientID: {{ $login.clientId }}
    clientSecret:
      name: {{ $login.clientSecretName | default (printf "dfe-oidc-%s" $login.name) }}
      namespace: {{ $ns }}
    scopes:
      {{- toYaml ($login.scopes | default (list "openid" "email" "profile" "groups")) | nindent 6 }}
    redirectURL: "https://{{ $host }}.{{ $.Values.domain }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    {{- /* One cookie per route: a shared name would let a session minted on one
           infra host be replayed on another. */}}
    cookieNames:
      accessToken: dfe-{{ $r.routeName }}-access-token
  jwt:
    providers:
      {{- range $provider := $.Values.oidc.providers }}
      - name: {{ $provider.name }}
        issuer: {{ $provider.issuerUrl }}
        remoteJWKS:
          uri: {{ $provider.jwksUrl | default (printf "%s/keys" $provider.issuerUrl) }}
        extractFrom:
          cookies:
            - dfe-{{ $r.routeName }}-access-token
      {{- end }}
  {{- /* Replaces dfe-edge-fence on an internet-facing gateway, so the address
         check is ANDed into every rule, and an empty list keeps no rule at all. */}}
  {{- $facing := $.Values.envoyGateway.service.internetFacing }}
  {{- $allowed := include "envoy-gateway-config.cidrList" (dict "value" $.Values.ui.allowed_cidrs) | fromJsonArray }}
  authorization:
    defaultAction: Deny
    {{- if or (not $facing) $allowed }}
    rules:
      {{- range $provider := $.Values.oidc.providers }}
      - name: allow-admin-groups-{{ $provider.name }}
        action: Allow
        principal:
          {{- if $facing }}
          clientCIDRs:
            {{- toYaml $allowed | nindent 12 }}
          {{- end }}
          jwt:
            provider: {{ $provider.name }}
            claims:
              - name: groups
                valueType: StringArray
                values:
                  {{- toYaml $.Values.adminGroups | nindent 18 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
