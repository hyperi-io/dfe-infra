{{- /* Attached by listener, so the routes that own one are the whole list -- a
       route riding another's (routes.<key>.publicListenerOf) is already covered
       by its owner's entry, and naming it again would be a duplicate targetRef. */}}
{{- $public := include "envoy-gateway-config.publicListenerRoutes" (dict "ctx" .) | fromJsonArray }}
{{- if $public }}
{{- $trusted := include "envoy-gateway-config.cidrList" (dict "value" .Values.ui.trusted_proxy_cidrs) | fromJsonArray }}
# Edge settings for the public listeners only, attached by sectionName. A
# listener-scoped ClientTrafficPolicy REPLACES the Gateway-scoped one for that
# listener rather than merging with it, so the curve and cipher posture from
# templates/client-traffic-policy.yaml is restated here -- dropping it would
# quietly hand the public listeners Envoy Gateway's defaults, which admit
# AES-128, CBC and P-256.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: dfe-public-edge
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  targetRefs:
    {{- range $key := $public }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      sectionName: https-public-{{ (index $.Values.routes $key).routeName }}
    {{- end }}
  {{- /* With no clientIPDetection Envoy Gateway sets use_remote_address and no
         trusted hops (internal/xds/translator/listener.go at v1.9.2), so the
         client the CIDR filter judges is the TCP peer and a caller's own
         X-Forwarded-For counts for nothing. Only a CDN or other L7 proxy named
         in ui.trusted_proxy_cidrs is believed. */}}
  {{- with $trusted }}
  # X-Forwarded-For is read only when the TCP peer is inside this list: right to
  # left, the first address outside it is the client.
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  tls:
    minVersion: {{ .Values.ui.tls.min_version | quote }}
    maxVersion: {{ .Values.tls.edge.maxVersion | quote }}
    ecdhCurves:
      {{- toYaml .Values.tls.edge.ecdhCurves | nindent 6 }}
    {{- with .Values.tls.edge.ciphers }}
    # Applied at TLS 1.2 only; ignored at 1.3 (BoringSSL fixes the suite).
    ciphers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
