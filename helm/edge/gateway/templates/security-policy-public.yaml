{{- $public := include "envoy-gateway-config.publicRoutes" (dict "ctx" .) | fromJsonArray }}
{{- $allowed := include "envoy-gateway-config.cidrList" (dict "value" .Values.ui.allowed_cidrs) | fromJsonArray }}
{{- $edgeRoutes := list }}
{{- range $route := .Values.oidc.targetRoutes }}
{{- $edgeRoutes = append $edgeRoutes $route.name }}
{{- end }}
{{- range $key := $public }}
{{- $r := index $.Values.routes $key }}
{{- $ns := include "envoy-gateway-config.routeNs" (dict "ctx" $ "key" $key) }}
{{- $host := include "envoy-gateway-config.publicHost" (dict "ctx" $ "key" $key) }}
{{- $hasProviders := and $.Values.oidc.enabled $.Values.oidc.providers }}
{{- $edge := and $hasProviders (or $r.edgePolicy (has $r.routeName $edgeRoutes)) }}
{{- if $edge }}
{{- range $provider := $.Values.oidc.providers }}
---
# Edge login on the PUBLIC hostname. Its own redirectURL and its own cookie: an
# OIDC session cookie is set on the host the user is on, and a session minted on
# the internal name must not be replayable on the public one.
# defaultAction Deny means a request that matches no rule is refused, so a token
# carrying no groups claim -- or an address outside ui.allowed_cidrs -- is
# turned away rather than admitted.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-public-oidc-{{ $provider.name }}-{{ $r.routeName }}
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}-public
  oidc:
    provider:
      issuer: {{ $provider.issuerUrl }}
    clientID: {{ $provider.clientId }}
    clientSecret:
      name: {{ $provider.clientSecretName | default (printf "dfe-oidc-%s" $provider.name) }}
      namespace: {{ $ns }}
    scopes:
      {{- toYaml ($provider.scopes | default (list "openid" "email" "profile" "groups")) | nindent 6 }}
    redirectURL: "https://{{ $host }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    cookieNames:
      accessToken: dfe-{{ $r.routeName }}-public-access-token
  jwt:
    providers:
      - name: {{ $provider.name }}
        issuer: {{ $provider.issuerUrl }}
        remoteJWKS:
          uri: {{ $provider.jwksUrl | default (printf "%s/keys" $provider.issuerUrl) }}
        extractFrom:
          cookies:
            - dfe-{{ $r.routeName }}-public-access-token
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-admin-groups
        action: Allow
        {{- /* Every principal in a rule must match, so naming both the claim and
               the address ANDs them: the right group from the wrong address is
               refused. */}}
        principal:
          {{- with $allowed }}
          clientCIDRs:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          jwt:
            provider: {{ $provider.name }}
            {{- if $r.edgePolicy }}
            claims:
              - name: groups
                valueType: StringArray
                values:
                  {{- toYaml $.Values.adminGroups | nindent 18 }}
            {{- end }}
{{- end }}
{{- else if $allowed }}
---
# The login on this route is the app's own, so the only thing the edge can add
# is where a request may come from. Deny by default; the allow rule is the
# address list.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-public-cidr-{{ $r.routeName }}
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}-public
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-listed-cidrs
        action: Allow
        principal:
          clientCIDRs:
            {{- toYaml $allowed | nindent 12 }}
{{- end }}
{{- end }}
