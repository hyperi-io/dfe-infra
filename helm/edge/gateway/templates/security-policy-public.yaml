{{- $public := include "envoy-gateway-config.publicRoutes" (dict "ctx" .) | fromJsonArray }}
{{- $allowed := include "envoy-gateway-config.cidrList" (dict "value" .Values.ui.allowed_cidrs) | fromJsonArray }}
{{- $fence := include "envoy-gateway-config.webFence" (dict "ctx" .) }}
{{- $edgeRoutes := list }}
{{- range $route := .Values.oidc.targetRoutes }}
{{- $edgeRoutes = append $edgeRoutes $route.name }}
{{- end }}
{{- range $key := $public }}
{{- $r := index $.Values.routes $key }}
{{- $ns := include "envoy-gateway-config.routeNs" (dict "ctx" $ "key" $key) }}
{{- $host := include "envoy-gateway-config.publicHost" (dict "ctx" $ "key" $key) }}
{{- $hasProviders := and $.Values.oidc.enabled $.Values.oidc.providers }}
{{- $edge := and $hasProviders (or $r.edgePolicy (has $r.routeName $edgeRoutes)) }}
{{- if $edge }}
{{- $loginName := include "envoy-gateway-config.loginProviderName" (dict "ctx" $) }}
{{- range $login := $.Values.oidc.providers }}
{{- if eq $login.name $loginName }}
---
# Edge login on the PUBLIC hostname. Its own redirectURL and its own cookie: an
# OIDC session cookie is set on the host the user is on, and a session minted on
# the internal name must not be replayable on the public one.
# ONE policy per route, never one per provider: two SecurityPolicies naming the
# same HTTPRoute conflict and only the oldest applies. oidc.loginProvider owns
# the redirect; every provider stays a JWT issuer with an Allow rule of its own.
# defaultAction Deny means a request that matches no rule is refused, so a token
# carrying no groups claim -- or an address outside ui.allowed_cidrs -- is
# turned away rather than admitted.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-public-oidc-{{ $login.name }}-{{ $r.routeName }}
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}-public
  oidc:
    provider:
      {{- include "envoy-gateway-config.oidcProvider" (dict "provider" $login) | nindent 6 }}
    clientID: {{ $login.clientId }}
    clientSecret:
      name: {{ $login.clientSecretName | default (printf "dfe-oidc-%s" $login.name) }}
      namespace: {{ $ns }}
    scopes:
      {{- toYaml ($login.scopes | default (list "openid" "email" "profile" "groups")) | nindent 6 }}
    redirectURL: "https://{{ $host }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    cookieNames:
      accessToken: dfe-{{ $r.routeName }}-public-access-token
  jwt:
    providers:
      {{- range $provider := $.Values.oidc.providers }}
      - name: {{ $provider.name }}
        issuer: {{ $provider.issuerUrl }}
        remoteJWKS:
          uri: {{ $provider.jwksUrl | default (printf "%s/keys" $provider.issuerUrl) }}
        extractFrom:
          cookies:
            - dfe-{{ $r.routeName }}-public-access-token
      {{- end }}
  {{- /* The jwt block already refuses a request with no valid token, and the
         CRD rejects a jwt principal naming no claim, so a route with no group
         check and no address list takes no authorization block at all. */}}
  {{- if eq $fence "deny" }}
  authorization:
    defaultAction: Deny
  {{- else if $r.edgePolicy }}
  authorization:
    defaultAction: Deny
    rules:
      {{- range $provider := $.Values.oidc.providers }}
      - name: allow-admin-groups-{{ $provider.name }}
        action: Allow
        {{- /* Every principal in a rule must match, so naming both the claim and
               the address ANDs them: the right group from the wrong address is
               refused. */}}
        principal:
          {{- with $allowed }}
          clientCIDRs:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          jwt:
            provider: {{ $provider.name }}
            claims:
              - name: groups
                valueType: StringArray
                values:
                  {{- toYaml $.Values.adminGroups | nindent 18 }}
      {{- end }}
  {{- else if $allowed }}
  {{- include "envoy-gateway-config.fenceAuthorization" (dict "cidrs" $allowed "indent" 2) }}
  {{- end }}
{{- end }}
{{- end }}
{{- else if or $allowed (eq $fence "deny") }}
---
# The login on this route is the app's own, so the only thing the edge can add
# is where a request may come from. Deny by default; the allow rule is the
# address list, and with no list on an internet-facing gateway there is none.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-public-cidr-{{ $r.routeName }}
  namespace: {{ $ns }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}-public
  {{- include "envoy-gateway-config.fenceAuthorization" (dict "cidrs" $allowed "indent" 2) }}
{{- end }}
{{- end }}
