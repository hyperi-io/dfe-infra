{{- if .Values.envoyGateway.service.internetFacing }}
# The web fence for an internet-facing gateway: refuse every address. A
# SecurityPolicy on a route REPLACES this one for that route rather than merging
# with it, and every route this chart renders carries its own exposure group's
# policy, so only a route nothing here knows about -- one another namespace
# attaches -- is held by this default.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-edge-fence
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    dfe.hyperi.io/edge-fence: {{ include "envoy-gateway-config.groupSummary" (dict "ctx" .) | quote }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  {{- include "envoy-gateway-config.fenceAuthorization" (dict "cidrs" (list) "indent" 2) }}
---
# The :80 redirect sends every caller to https and serves nothing itself, so a
# 403 here would hide the move to TLS and protect nothing: the fence above holds
# the https side.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Values.gateway.name }}-http-redirect-open
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.gateway.name }}-http-redirect
  authorization:
    defaultAction: Allow
{{- end }}
