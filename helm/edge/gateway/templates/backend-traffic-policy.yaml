{{- /* Internal names ride the same internet-facing load balancer as the public
       ones, so they take a limit too, and off the internet they stay unlimited. */}}
{{- if and .Values.ui.rate_limit.enabled .Values.envoyGateway.service.internetFacing }}
{{- range $key := include "envoy-gateway-config.webRouteKeys" (dict "ctx" .) | fromJsonArray }}
{{- $r := index $.Values.routes $key }}
---
# One bucket per client address per route per proxy replica, and no shared
# bucket, so one caller's dashboard cannot empty the route for everyone else.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dfe-internal-{{ $r.routeName }}-ratelimit
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" $ "key" $key) }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}
  rateLimit:
    local:
      rules:
        {{- include "envoy-gateway-config.rateLimitRules" (dict "ctx" $ "shared" false) | nindent 8 }}
{{- end }}
{{- end }}
