{{- /* Internal names ride the same internet-facing load balancer as the public
       ones, so they take a limit too, and off the internet they stay unlimited. */}}
{{- if and .Values.ui.rate_limit.enabled .Values.envoyGateway.service.internetFacing }}
{{- range $key := include "envoy-gateway-config.webRouteKeys" (dict "ctx" .) | fromJsonArray }}
{{- $r := index $.Values.routes $key }}
---
# One bucket per client address per route per proxy replica. A rule with no
# client selector is one bucket every caller shares, so none is rendered, and a
# source CIDR matches one address family, so each family has its own rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dfe-internal-{{ $r.routeName }}-ratelimit
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" $ "key" $key) }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}
  rateLimit:
    local:
      rules:
        {{- range $family := list "0.0.0.0/0" "::/0" }}
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: {{ $family | quote }}
          limit:
            requests: {{ int64 $.Values.ui.rate_limit.per_client_requests }}
            unit: {{ $.Values.ui.rate_limit.unit }}
        {{- end }}
{{- end }}
{{- end }}
