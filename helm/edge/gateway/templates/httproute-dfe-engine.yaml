{{- if include "envoy-gateway-config.routeEnabled" (dict "ctx" . "key" "dfeEngine") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routes.dfeEngine.routeName }}
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" . "key" "dfeEngine") }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    {{- include "envoy-gateway-config.dnsMarker" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      # See httproute-argocd.yaml: pinned off the plaintext :80 listener.
      sectionName: https
  hostnames:
    - "{{ include "envoy-gateway-config.routeHost" (dict "ctx" . "key" "dfeEngine") }}.{{ .Values.domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.routes.dfeEngine.pathPrefix }}
        {{- /* Engine-owned root paths on the shared hostname: the Swagger
             surface where the engine serves it, the spec, and /.well-known
             (JWKS + OIDC discovery, public so peers and the edge jwt_authn
             verify DFE tokens). dfe-ui owns every other root path. */}}
        {{- if include "envoy-gateway-config.engineDocs" (dict "ctx" .) }}
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /redoc
        {{- end }}
        - path:
            type: PathPrefix
            value: /openapi.json
        - path:
            type: PathPrefix
            value: /.well-known
      {{- include "envoy-gateway-config.responseHeaders" (dict "hsts" (include "envoy-gateway-config.edgeHsts" (dict "ctx" .)) "indent" 6) }}
      backendRefs:
        - name: {{ .Values.routes.dfeEngine.backendService }}
          port: {{ .Values.routes.dfeEngine.backendPort }}
          group: ""
          kind: Service
          weight: 1
      {{- with .Values.routes.dfeEngine.requestTimeout }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
    {{- include "envoy-gateway-config.hiddenRule" (dict "ctx" . "key" "dfeEngine" "indent" 4) }}
{{- end }}
