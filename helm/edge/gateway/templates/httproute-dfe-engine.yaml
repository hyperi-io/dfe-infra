{{- /* Two routes to the one engine Service on the one hostname, split by path
       family so each answers to its own exposure group: the browser families
       to console, the CLI families, the spec and SCIM to api. dfe-ui owns every
       other path on the hostname. */}}
{{- range $key := list "dfeEngine" "dfeEngineCli" }}
{{- if include "envoy-gateway-config.routeEnabled" (dict "ctx" $ "key" $key) }}
{{- $r := index $.Values.routes $key }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.routeName }}
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" $ "key" $key) }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
  annotations:
    {{- include "envoy-gateway-config.dnsMarker" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      # See httproute-argocd.yaml: pinned off the plaintext :80 listener.
      sectionName: https
  hostnames:
    - "{{ include "envoy-gateway-config.routeHost" (dict "ctx" $ "key" $key) }}.{{ $.Values.domain }}"
  rules:
    - matches:
        {{- range include "envoy-gateway-config.enginePaths" (dict "ctx" $ "key" $key "public" false) | fromJsonArray }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      {{- include "envoy-gateway-config.responseHeaders" (dict "hsts" (include "envoy-gateway-config.edgeHsts" (dict "ctx" $)) "indent" 6) }}
      backendRefs:
        - name: {{ $r.backendService }}
          port: {{ $r.backendPort }}
          group: ""
          kind: Service
          weight: 1
      {{- with $r.requestTimeout }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
    {{- include "envoy-gateway-config.hiddenRule" (dict "ctx" $ "key" $key "indent" 4) }}
{{- end }}
{{- end }}
