{{- if include "envoy-gateway-config.routeEnabled" (dict "ctx" . "key" "otel") }}
# Platform OTLP/HTTP ingest on the standard name otel.{domain} -- machine
# telemetry, never edge-OIDC'd (senders hold no browser session).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routes.otel.routeName }}
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" . "key" "otel") }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    {{- include "envoy-gateway-config.dnsMarker" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      # See httproute-argocd.yaml: pinned off the plaintext :80 listener.
      sectionName: https
  hostnames:
    - "{{ include "envoy-gateway-config.routeHost" (dict "ctx" . "key" "otel") }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ .Values.routes.otel.backendService }}
          port: {{ .Values.routes.otel.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
