{{- $public := include "envoy-gateway-config.publicRoutes" (dict "ctx" .) | fromJsonArray }}
{{- if .Values.ui.rate_limit.enabled }}
{{- range $key := $public }}
{{- $r := index $.Values.routes $key }}
---
# A shared bucket is the wall a distributed credential-stuffing run hits before
# it reaches the login, and a bucket per client address stops one caller
# spending it alone. Both count per route per proxy replica, so two replicas
# serve twice these rates in total.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dfe-public-{{ $r.routeName }}-ratelimit
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" $ "key" $key) }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.routeName }}-public
  rateLimit:
    {{- /* No `type:` -- it is deprecated in favour of naming the local or
           global body directly, and naming both is how they combine. */}}
    local:
      rules:
        {{- include "envoy-gateway-config.rateLimitRules" (dict "ctx" $ "shared" true) | nindent 8 }}
{{- end }}
{{- end }}
