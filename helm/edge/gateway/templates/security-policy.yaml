{{- if and .Values.oidc.enabled .Values.oidc.providers }}
{{- $loginName := include "envoy-gateway-config.loginProviderName" (dict "ctx" .) }}
{{- range $provider := .Values.oidc.providers }}
{{- if eq $provider.name $loginName }}
{{- range $route := $.Values.oidc.targetRoutes }}
---
# One SecurityPolicy per interactive route, each with its OWN redirectURL on its OWN
# hostname, so the OIDC session cookie is set on the host the user is on. Add a
# route to oidc.targetRoutes and it is fronted with no policy-code change. Per
# ROUTE and not per provider, because two policies on one HTTPRoute conflict and
# only the oldest applies: oidc.loginProvider names the one that owns the login.
{{- /* A SecurityPolicy only targets routes in its own namespace, so the
       policy and its client secret live where the route does. */}}
{{- $routeNs := $route.namespace | default $.Values.appNamespace | default $.Release.Namespace }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-oidc-{{ $route.name }}
  namespace: {{ $routeNs }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.name }}
  oidc:
    provider:
      {{- include "envoy-gateway-config.oidcProvider" (dict "provider" $provider) | nindent 6 }}
    clientID: {{ $provider.clientId }}
    clientSecret:
      name: {{ $provider.clientSecretName | default (printf "dfe-oidc-%s" $provider.name) }}
      namespace: {{ $routeNs }}
    scopes:
      {{- toYaml ($provider.scopes | default (list "openid" "email" "profile")) | nindent 6 }}
    redirectURL: "https://{{ $route.hostname }}.{{ $.Values.domain }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
  {{- /* The route's only policy, so it carries the route's exposure group rule. */}}
  {{- include "envoy-gateway-config.groupAuthorization" (dict "ctx" $ "group" (include "envoy-gateway-config.groupOfRouteName" (dict "ctx" $ "name" $route.name)) "indent" 2) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
