{{- if .Values.oidc.enabled }}
{{- range $provider := .Values.oidc.providers }}
{{- range $route := $.Values.oidc.targetRoutes }}
---
# One SecurityPolicy per (provider x interactive route). Each route gets its
# OWN redirectURL on its OWN hostname so the OIDC session cookie is set on the
# host the user is actually on (a single shared redirectURL would break OIDC on
# every subdomain except the callback host). Universal: add a route to
# oidc.targetRoutes and it is fronted automatically -- no policy-code change.
{{- /* A SecurityPolicy only targets routes in its own namespace, so the
       policy and its client secret live where the route does. */}}
{{- $routeNs := $route.namespace | default $.Values.appNamespace | default $.Release.Namespace }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dfe-oidc-{{ $provider.name }}-{{ $route.name }}
  namespace: {{ $routeNs }}
  labels:
    {{- include "dfe-common.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.name }}
  oidc:
    provider:
      issuer: {{ $provider.issuerUrl }}
      {{- /* Naming both endpoints skips Envoy Gateway's own .well-known fetch,
             which its CONTROL PLANE performs against the system trust store with
             no field anywhere to hand it a CA bundle. An IdP served by this
             deployment's dfe-internal-ca is therefore undiscoverable and the
             policy is rejected outright (dfe-infra #222). */}}
      {{- with $provider.authorizationEndpoint }}
      authorizationEndpoint: {{ . | quote }}
      {{- end }}
      {{- with $provider.tokenEndpoint }}
      tokenEndpoint: {{ . | quote }}
      {{- end }}
      {{- with $provider.endSessionEndpoint }}
      endSessionEndpoint: {{ . | quote }}
      {{- end }}
      {{- /* The token exchange then goes to the IdP's Service over the pod
             network instead of back out through the gateway's public hostname.
             A ref outside this policy's namespace needs a ReferenceGrant in the
             IdP's namespace. */}}
      {{- with $provider.backendRefs }}
      backendRefs:
        {{- range . }}
        - name: {{ .name }}
          {{- with .namespace }}
          namespace: {{ . }}
          {{- end }}
          {{- with .port }}
          port: {{ . }}
          {{- end }}
          kind: {{ .kind | default "Service" }}
          group: {{ .group | default "" | quote }}
        {{- end }}
      {{- end }}
      {{- /* Cluster settings for that backend -- timeouts, retries, health
             checks. NOT a place to put a CA: backendSettings carries no TLS
             field, so an HTTPS IdP Service needs a BackendTLSPolicy targeting
             the Service instead. */}}
      {{- with $provider.backendSettings }}
      backendSettings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    clientID: {{ $provider.clientId }}
    clientSecret:
      name: {{ $provider.clientSecretName | default (printf "dfe-oidc-%s" $provider.name) }}
      namespace: {{ $routeNs }}
    scopes:
      {{- toYaml ($provider.scopes | default (list "openid" "email" "profile")) | nindent 6 }}
    redirectURL: "https://{{ $route.hostname }}.{{ $.Values.domain }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
{{- end }}
{{- end }}
{{- end }}
