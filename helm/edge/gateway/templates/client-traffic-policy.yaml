{{- $limit := .Values.envoyGateway.connectionLimit }}
{{- if or .Values.tls.edge.enabled $limit.enabled }}
# Edge TLS posture and the per-listener connection limit: docs/cnsa-standard.md#transport-tls.
# ONE policy, because two ClientTrafficPolicies naming the same Gateway with no
# sectionName conflict and only the oldest applies. TLS termination only: the
# jwt_authn filter is in envoy-patch-policy.yaml.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: dfe-edge-tls
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  {{- if $limit.enabled }}
  connection:
    connectionLimit:
      value: {{ int64 $limit.value }}
  {{- end }}
  {{- if .Values.tls.edge.enabled }}
  tls:
    minVersion: {{ .Values.tls.edge.minVersion | quote }}
    maxVersion: {{ .Values.tls.edge.maxVersion | quote }}
    ecdhCurves:
      {{- toYaml .Values.tls.edge.ecdhCurves | nindent 6 }}
    {{- with .Values.tls.edge.ciphers }}
    # Applied at TLS 1.2 only; ignored at 1.3 (BoringSSL fixes the suite).
    ciphers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
