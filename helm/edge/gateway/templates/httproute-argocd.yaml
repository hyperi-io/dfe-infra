{{- if include "envoy-gateway-config.routeEnabled" (dict "ctx" . "key" "argocd") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routes.argocd.routeName }}
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" . "key" "argocd") }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      # Pinned to the HTTPS listener: with no sectionName this route would
      # attach to the plaintext :80 listener too (same wildcard hostname), and
      # :80 carries only the HTTP -> HTTPS redirect (httproute-http-redirect.yaml).
      sectionName: https
  hostnames:
    - "{{ include "envoy-gateway-config.routeHost" (dict "ctx" . "key" "argocd") }}.{{ .Values.domain }}"
  rules:
    - backendRefs:
        - name: {{ .Values.routes.argocd.backendService }}
          port: {{ .Values.routes.argocd.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
