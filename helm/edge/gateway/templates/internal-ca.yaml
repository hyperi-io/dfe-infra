{{- if .Values.tls.internalCA.enabled }}
# Internal mesh CA: a self-signed bootstrap Issuer mints an ECDSA P-384 CA, whose
# ClusterIssuer `dfe-internal-ca` signs the data plane's in-cluster certs so they
# chain to one root (docs/cnsa-standard.md#certificates). Inert until a
# Certificate references the issuer.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dfe-selfsigned-bootstrap
  namespace: {{ .Values.tls.internalCA.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dfe-internal-ca
  namespace: {{ .Values.tls.internalCA.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: dfe-internal-ca
  secretName: dfe-internal-ca-tls
  duration: {{ .Values.tls.internalCA.duration | quote }}
  renewBefore: {{ .Values.tls.internalCA.renewBefore | quote }}
  # ECDSA P-384; cert-manager signs with SHA-384 for a P-384 key.
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: dfe-selfsigned-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.tls.internalCA.issuerName }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  ca:
    secretName: dfe-internal-ca-tls
{{- end }}
