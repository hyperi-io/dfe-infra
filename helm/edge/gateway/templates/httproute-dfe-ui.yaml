{{- if include "envoy-gateway-config.routeEnabled" (dict "ctx" . "key" "dfeUi") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.routes.dfeUi.routeName }}
  namespace: {{ include "envoy-gateway-config.routeNs" (dict "ctx" . "key" "dfeUi") }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
  annotations:
    {{- include "envoy-gateway-config.dnsMarker" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      # See httproute-argocd.yaml: pinned off the plaintext :80 listener.
      sectionName: https
  hostnames:
    - "{{ include "envoy-gateway-config.routeHost" (dict "ctx" . "key" "dfeUi") }}.{{ .Values.domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.routes.dfeUi.pathPrefix }}
      backendRefs:
        - name: {{ .Values.routes.dfeUi.backendService }}
          port: {{ .Values.routes.dfeUi.backendPort }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
