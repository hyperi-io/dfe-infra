# The managed Envoy proxy's front-door Service, so the HTTP plane's load balancer
# swaps (cloud LB <-> k8s LB) as the receiver's does. The GatewayClass references it
# (gateway-class.yaml). Only externalIPs goes through a StrategicMerge patch,
# because it has no field of its own. It is not gated on type: a cluster with no LB
# controller reaches the outside through it on a ClusterIP.
{{- $svc := .Values.envoyGateway.service }}
{{- $public := include "envoy-gateway-config.publicRoutes" (dict "ctx" .) | fromJsonArray }}
{{- /* The second wall: the load balancer fences the WHOLE front door, because one
       Service carries every listener. Envoy still holds each route to its own
       group. */}}
{{- $sourceRanges := include "envoy-gateway-config.lbSourceRanges" (dict "ctx" .) | fromJsonArray }}
{{- /* Every name this edge answers on, public and internal. external-dns picks
       the zone by matching the suffix, so the public names land in the
       delegated public zone and every internal name stays in the private one
       with no zone filter to keep in step. */}}
{{- $hostnames := list }}
{{- if $public }}
{{- range $key, $r := .Values.routes }}
{{- if include "envoy-gateway-config.routeEnabled" (dict "ctx" $ "key" $key) }}
{{- $hostnames = append $hostnames (printf "%s.%s" (include "envoy-gateway-config.routeHost" (dict "ctx" $ "key" $key)) $.Values.domain) }}
{{- end }}
{{- end }}
{{- range $key := $public }}
{{- $hostnames = append $hostnames (include "envoy-gateway-config.publicHost" (dict "ctx" $ "key" $key)) }}
{{- end }}
{{- $hostnames = $hostnames | uniq | sortAlpha }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dfe-envoy-proxy
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          image: {{ .Values.envoyGateway.proxy.image | quote }}
      envoyService:
        type: {{ $svc.type | default "LoadBalancer" }}
        {{- /* What each web group admits, by state and by address, for dfe-ops
               and anyone reading the Service, written wherever a group is
               fenced at all. */}}
        {{- $fence := "" }}
        {{- $summary := include "envoy-gateway-config.groupSummary" (dict "ctx" .) }}
        {{- if or $svc.internetFacing (regexMatch "=(listed|allow-all|deny)" $summary) }}
        {{- $fence = $summary }}
        {{- end }}
        {{- if or $svc.annotations $hostnames $fence }}
        annotations:
          {{- with $svc.annotations }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with $fence }}
          dfe.hyperi.io/edge-fence: {{ . | quote }}
          dfe.hyperi.io/edge-fence-ranges: {{ include "envoy-gateway-config.groupRanges" (dict "ctx" $) | quote }}
          {{- end }}
          {{- /* Written only once a public zone is named, so a deployment that
                 manages its own DNS by hand is untouched. The marker beside it
                 is what external-dns's annotation filter matches -- that filter
                 covers Services as well as routes, so the hostname alone would
                 no longer be read. */}}
          {{- with $hostnames }}
          external-dns.alpha.kubernetes.io/hostname: {{ join "," . | quote }}
          {{- include "envoy-gateway-config.dnsMarker" $ | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- $isLB := eq ($svc.type | default "LoadBalancer") "LoadBalancer" }}
        {{- if $isLB }}
        {{- /* Empty = the pool picks; set = the address DNS already names. */}}
        {{- with $svc.loadBalancerIP }}
        loadBalancerIP: {{ . }}
        {{- end }}
        {{- with $svc.loadBalancerClass }}
        loadBalancerClass: {{ . }}
        {{- end }}
        {{- with $sourceRanges }}
        loadBalancerSourceRanges:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- with $svc.externalIPs }}
        patch:
          type: StrategicMerge
          value:
            spec:
              externalIPs:
                {{- toYaml . | nindent 16 }}
        {{- end }}
