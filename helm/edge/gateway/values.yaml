project: dfe
component: gateway
env: local
cloud: local

gateway:
  name: dfe-gateway
  namespace: envoy-gateway-system
  listenerPort: 443

# Front-door LB for the HTTP plane (docs/deployment/edge.md). Named envoyGateway because otel-collector owns `gateway`.
# loadBalancerIP empty lets the pool choose, which a rebuild re-rolls under every published hostname.
# externalIPs is for a cluster with no LB controller: pair it with type ClusterIP.
envoyGateway:
  service:
    type: LoadBalancer
    loadBalancerIP: ""
    loadBalancerClass: ""
    annotations: {}
    loadBalancerSourceRanges: []
    externalIPs: []
    # Declared, not derived: what makes a Service public is cloud-specific. True turns on the web fence and
    # validateUi's guard, and false is refused where the cloud's markers say it is public.
    # True in edge-aws.yaml, edge-gcp.yaml and edge-azure.yaml.
    internetFacing: false
  # The data-plane image both EnvoyProxy resources run: the
  # services.envoy-gateway-proxy pin in versions.yaml.
  proxy:
    image: "docker.io/envoyproxy/envoy:distroless-v1.39.5@sha256:9d84a586119a27b50437dbb01eccd4722832741539b1ed53c8e9d6da6067a6e0"
  # Per listener, per proxy replica (ClientTrafficPolicy connection.connectionLimit).
  connectionLimit:
    enabled: true
    # A fifth of the proxy's 50000 downstream connections, so a flood on one
    # listener leaves the rest room.
    value: 10000

# Pool balancer for the direct transport: docs/deployment/values-shared.md#mesh-pool-balancer.
# enabled, gateway and port are argocd/values/common.yaml's `mesh:`, so only this
# chart's two dials are declared here.
mesh:
  proxy:
    replicas: 2
  loadBalancer:
    # RoundRobin | LeastRequest | Random | RingHash | Maglev | ConsistentHash.
    type: RoundRobin
  # HTTP/2 PING keepalive, both sides of the proxy.
  keepalive:
    interval: 30s
    timeout: 10s

tls:
  issuerName: dfe-letsencrypt

  # The edge wildcard cert as an explicit Certificate, for a cluster whose
  # cert-manager runs without the gateway-shim (--enable-gateway-api). Exactly one
  # of the two issues it.
  wildcardCertificate:
    enabled: false

  # ECDSA P-384 / SHA-384 leaf, not cert-manager's RSA-2048 default:
  # docs/cnsa-standard.md#certificates.
  privateKey:
    algorithm: ECDSA        # ECDSA | RSA
    size: 384               # P-384; 3072+ if RSA
    rotationPolicy: Always

  # Edge TLS posture (ClientTrafficPolicy): docs/cnsa-standard.md#transport-tls.
  edge:
    enabled: true
    # The `prod` floor, "1.3" for `highsec` (docs/cnsa-standard.md#profiles). Quote
    # it: an unquoted 1.2 parses as a float and is rejected.
    minVersion: "1.2"
    maxVersion: "1.3"
    # Preference order, hybrid post-quantum first
    # (docs/cnsa-standard.md#post-quantum-migration---the-path-to-full-cnsa-20).
    # The accepted group name depends on the Envoy build.
    ecdhCurves:
      - X25519MLKEM768
      - P-384
      - X25519
    # TLS 1.2 only: AES-256-GCM, no AES-128, no CBC. At 1.3 BoringSSL fixes the suites.
    ciphers:
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
    # Strict-Transport-Security on every route of the wildcard listener. Empty
    # derives it from the edge issuer: off for an unpersisted internal root, on for
    # any other (docs/deployment/edge.md#response-hardening). true or false wins.
    hsts: ""

  # Internal mesh CA: a self-signed root mints the ECDSA P-384 CA behind the
  # `dfe-internal-ca` ClusterIssuer, which backing-service certs (ClickHouse,
  # Kafka, OTLP) chain to. Inert until a Certificate references the issuer.
  internalCA:
    enabled: true
    issuerName: dfe-internal-ca
    # A ClusterIssuer reads its CA secret from cert-manager's
    # cluster-resource-namespace, so the CA cert and bootstrap Issuer live there.
    namespace: cert-manager
    duration: "87600h"     # 10y root
    renewBefore: "720h"    # 30d

    # Keeps the root across a rebuild (docs/deploy-tls-trust.md). Off by default, because an ExternalSecret aimed
    # at a store the deployment lacks is Degraded forever and fails the Argo sync.
    # `dfe-ops ca --status` says which a deployment is in. Vault issuer mode renders none of it.
    persist:
      enabled: false
      secretStoreName: dfe-secret-store
      secretStoreKind: ClusterSecretStore
      # KV path in the {project}/{env}/<area>/<name> convention. Empty derives it.
      # The root is stored as <remoteKey>-crt and <remoteKey>-key, and the path
      # itself is read for a root an older release stored there.
      remoteKey: ""
      # Underscored, not tls.crt: the Vault provider reads a property as a gjson
      # path, where a dot means nesting.
      certProperty: tls_crt
      keyProperty: tls_key
      # Tags on the two store entries. AWS Secrets Manager applies them at
      # CreateSecret, Vault ignores them. bootstrap.sh and layer2-edge.yaml fill
      # this from DFE_RESOURCE_TAGS.
      tags: {}

  acme:
    email: ""
    server: "https://acme-v02.api.letsencrypt.org/directory"
    cloudflareTokenSecretName: cloudflare-api-token
    cloudflareTokenSecretKey: token

  # PUBLIC certificates for the exposed UIs, from a second issuer: Let's Encrypt by
  # DNS-01 on Route 53 through cert-manager's Pod Identity role, so no key here
  # (docs/edge-auth-cloud.md#public-hostnames-on-a-cloud-deploy).
  public:
    # The ClusterIssuer the public Certificates reference. Point it at an issuer you
    # already have and leave email empty to render none of your own.
    issuerName: dfe-letsencrypt-public
    # Blank = no public ClusterIssuer is rendered. ACME requires a contact.
    email: ""
    server: "https://acme-v02.api.letsencrypt.org/directory"
    route53:
      # Blank = cert-manager reads the region from its own environment.
      region: ""
      # The cluster module's public_zone_id output. Blank makes cert-manager look the
      # zone up, one ListHostedZonesByName per challenge, and it can match the wrong
      # zone where names overlap.
      hostedZoneID: ""

  # Vault/OpenBao PKI issuer mode: vault.server renders issuerName Vault-backed,
  # acme.email renders it ACME, set exactly one. bootstrap.sh seeds the AppRole
  # SecretID Secret from DFE_CERTMANAGER_SECRET_ID.
  vault:
    server: ""             # e.g. https://bao.example.com:8200
    path: ""               # PKI sign path, e.g. pki_tls/sign/example-role
    caBundle: ""           # base64 PEM chain that verifies `server`'s TLS
    appRole:
      path: approle
      roleId: ""
      secretName: cert-manager-approle
      secretKey: secretId

domain: ""

# Where the DFE app services run. A route with no backendNamespace lands here, so
# route and backend share a namespace. bootstrap.sh passes DFE_NAMESPACE. Empty
# falls back to the release namespace, where an app backendRef cannot resolve.
appNamespace: ""

# Service-name map from the deploy-config SSoT (argocd/values/common.yaml). A
# routes.*.hostname overrides its entry for this deployment.
hostnames: {}

# OIDC groups the edge policy admits to every infra route with edgePolicy, from
# argocd/values/common.yaml. Empty refuses to render.
adminGroups: []

# Read-only here, owned by the kafka chart: the Cruise Control UI is one of its
# workloads. The same keys let one profile overlay reach both charts, and the
# defaults match its own, so a deployment with no Kafka renders no route.
kafka:
  mode: disabled
  provider: strimzi
  rebalancing:
    enabled: true
    ui:
      enabled: true

# Whether the bundled Forgejo is the deploy repo, from the cluster label
# dfe.hyperi.io/bundled-deploy-repo. The forgejo route renders only when true.
deployRepo:
  bundled: false

# Read-only here, owned by the otel-collector chart: the otel route fronts its
# bearer-token OTLP receiver, which exists only while this switch is on. The same
# keys as argocd/values/common.yaml, and the defaults match the collector's.
otel:
  ingress:
    enabled: false
    # The collector's authenticated OTLP/HTTP port, which the route targets.
    port: 4319
    auth:
      # Where the secret store holds the token. On with this empty refuses.
      remoteKey: ""

# Read-only here, owned by the dfe-engine chart: /docs and /redoc are routed only
# where the engine serves them. Same key as argocd/values/common.yaml.
api:
  docsEnabled: ""

# Who may reach each surface, by group (console, api, admin, ingest): docs/edge-auth.md and
# docs/edge-auth-cloud.md. Shared with the dfe-receiver and culvert charts, and a missing group refuses to render.
# An empty allow refuses every address on an internet-facing Service and means no fence elsewhere.
exposure:
  groups: {}
  # The cluster's own egress addresses, written from the cluster secret and never
  # by hand. Every web group admits them.
  selfRanges: []

# PUBLIC UI EXPOSURE, off until a deployment names a public zone (docs/edge-auth-cloud.md#public-hostnames-on-a-cloud-deploy).
# The key names are the dial's (snake_case), so a deployer's overlay is a copy rather than a translation.
ui:
  # The delegated public zone the UIs answer on (the dial's dns.public_zone).
  # Empty publishes no public hostname.
  public_domain: ""

  # Which PRODUCT UIs answer on a public hostname. The admin UIs' flags are
  # exposure.groups.admin.tools.
  public:
    dfe_ui: true
    hyperdx: false

  # The engine API on the product's public hostname. dfe-ui leaves NEXT_PUBLIC_API_URL empty, so the browser
  # calls the engine at window.location.origin under /api/v1, and without a route there every call lands on dfe-ui.
  engine_api:
    # Rides dfe-ui's hostname, listener and certificate, so it is off when
    # ui.public.dfe_ui is.
    with_product: true
    # The api group's route (CLI families, /openapi.json) on the product hostname
    # too. Off, because a browser uses neither.
    cli_families_public: false
    # /api/v1/scim/v2 on the product hostname, which needs exposure.groups.api.scim.
    # An external SaaS IdP needs it, an in-cluster one does not.
    scim_public: false

  # THE CDN OPT-IN, comma-separated. Empty believes no X-Forwarded-For: the client is the TCP peer
  # (docs/edge-auth-cloud.md#the-client-address-the-fence-judges). Name only an L7 proxy that writes the header,
  # never an L4 load balancer or a shared subnet, or any host in it can claim any address. A /0 is refused.
  trusted_proxy_cidrs: ""

  # LOCAL to each proxy replica: global needs Redis and an EnvoyGateway install change, so it is refused.
  # A public route has a shared bucket and a per-client one, an internal-name web route on an internet-facing
  # Service only the per-client one. Counts are whole numbers, unquoted.
  rate_limit:
    enabled: true
    # Each public route's shared bucket. Must exceed per_client_requests, or one
    # caller can empty it.
    requests: 6000
    # Every web route, per client address.
    per_client_requests: 1200
    unit: Minute            # Second | Minute | Hour | Day | Month | Year
    scope: local            # local only -- global is refused at render

  # Web application firewall, `none` only: docs/edge-auth-cloud.md#what-fails-the-render.
  waf:
    mode: none              # none only
    plan: ""                # reserved: the CDN plan the WAF rides on
    managed_rules: ""       # reserved: comma-separated managed rule groups

  # Public edge TLS. Quote min_version, as for tls.edge.minVersion. hsts adds
  # Strict-Transport-Security to every public response.
  tls:
    min_version: "1.2"
    hsts: true

# HTTPRoutes, mapping hostnames to backend services. A route's `class` (product | api | infra | ingest) picks its
# exposure group, and the cascade deciding whether it renders is in
# docs/edge-auth.md#route-class-and-the-switches-that-reach-it.
routes:
  dfeUi:
    class: product
    # Opt-out. A group switch beats it, and otel and receiver also wait on
    # otel.ingress.enabled and exposure.groups.ingest.door.
    enabled: true
    # The HTTPRoute's name, which a SecurityPolicy targetRef names.
    routeName: dfe-ui
    # The `hostnames` entry giving the subdomain label. `hostname` overrides it.
    hostnameKey: dfe
    hostname: ""              # empty = hostnames.dfe from the config SSoT
    backendService: dfe-ui
    backendNamespace: ""      # set via ArgoCD values overlay
    backendPort: 3000
    pathPrefix: /
    # PathPrefix values answered 404 on this route and its public face. dfe-ui
    # answers its Prometheus scrape unauthenticated on the app port.
    hiddenPaths:
      - /metrics

  dfeEngine:
    class: product
    enabled: true
    routeName: dfe-engine
    hostnameKey: dfe
    hostname: ""
    backendService: dfe-engine
    backendNamespace: ""
    backendPort: 8000
    # /api/v1, never /api: NextAuth serves /api/auth/* on dfe-ui at the same origin.
    pathPrefix: /api/v1
    # A source create or deploy commits, pushes and syncs before it answers, which
    # runs past Envoy's 15s default. Empty leaves the proxy's default.
    requestTimeout: 120s
    # Answers on dfe-ui's public listener and certificate, because the browser calls
    # the engine at its own origin.
    publicListenerOf: dfeUi
    # THE PATH FAMILIES, from the engine team (hyperi-io/dfe-engine#395). A PathPrefix matches whole path elements,
    # so naming a family opens that family alone (docs/deployment/edge.md#what-the-engine-apis-split-gets-wrong).
    # Between this and cliFamilies every family is named, and one in neither answers nowhere. What the browser calls:
    browserFamilies:
      - auth
      - config/client
      - deployment
      - system
      - orgs
      - sources
      - services
      - field-maps
      - rules
      - alerts
      - transforms
      - schemas
      - hunts
      - governance
      - helm
      - apps
      - backing-services
      - library
      - gitops
      - lifecycle
      - repository
      - ingest
      - usage
    # Engine ROOT paths the browser needs: JWKS and OIDC discovery, public by design
    # so peers and the edge jwt_authn can verify DFE tokens.
    browserPaths:
      - /.well-known
    # NEVER public, under any flag: /api/e2e, /docs, /redoc, /livez, /readyz.

  # The engine's CLI surface: a second route to the same Service and hostname, in
  # the api group.
  dfeEngineCli:
    class: api
    enabled: true
    routeName: dfe-engine-cli
    hostnameKey: dfe
    hostname: ""
    backendService: dfe-engine
    backendNamespace: ""
    backendPort: 8000
    pathPrefix: /api/v1
    requestTimeout: 120s
    publicListenerOf: dfeUi
    # The families the `dfe` CLI uses and no browser does.
    cliFamilies:
      - queries
      - sigma
      - cel
      - pipeline
      - authoring
      - app-contracts
      - tasks
      - synthetic-data
      - sample
      - samples
      - hyperdx
      - kafka/topics
    # The CLI is generated from the live spec, so a CLI run from outside needs it.
    cliPaths:
      - /openapi.json
    # Carried when exposure.groups.api.scim is true.
    scimPrefix: /api/v1/scim/v2

  # Argo CD, on argocd-server's plain HTTP port: bootstrap.sh installs Argo with
  # server.insecure, and an adopted Argo needs it or a BackendTLSPolicy
  # (docs/deployment/gateway-oidc.md#argo-cds-own-login).
  argocd:
    class: infra
    enabled: true
    # Infra only: the OIDC and group check (adminGroups) in front of the route.
    edgePolicy: true
    # Infra only: the backend has a login of its own. false renders the route
    # only behind the edge policy.
    ownLogin: true
    routeName: argocd
    hostnameKey: argocd
    hostname: ""
    backendService: argocd-server
    backendNamespace: argocd
    backendPort: 80
    # Infra only, required: the name and one-line purpose the engine lists
    # (templates/admin-links.yaml).
    adminLink:
      name: Argo CD
      purpose: GitOps sync state of every application this deployment runs

  # HyperDX. Class product: dfe-ui's Observe page frames it, so it renders wherever the console does and the infra
  # kill switch never takes it away. No edge OIDC policy: an interactive redirect cannot complete in a frame the IdP
  # refuses. The fork is its own PEP, authenticating from the dfe_token cookie dfe-ui shares across the domain.
  hyperdx:
    class: product
    enabled: true
    routeName: hyperdx
    hostnameKey: hyperdx
    hostname: ""
    backendService: dfe-hyperdx
    backendNamespace: ""      # set in values overlay (deployed with dfe-ui wave 5)
    backendPort: 8080

  # Forgejo, the in-cluster deploy-repo FALLBACK, rendered only with
  # deployRepo.bundled. The edge policy gates the UI and blocks git-over-HTTP from
  # outside the cluster, which nothing needs: Argo and the engine use its Service DNS.
  forgejo:
    class: infra
    enabled: true
    edgePolicy: true
    ownLogin: true
    routeName: forgejo
    hostnameKey: git
    hostname: ""
    backendService: dfe-forgejo
    backendNamespace: forgejo
    backendPort: 3000
    adminLink:
      name: Forgejo
      purpose: The bundled deploy repo every configuration change is committed to

  # Kafbat. Class infra, so the kill switch covers it, but no edge policy: it runs
  # its own OIDC against the same provider, and a second interactive redirect would
  # land in one page load.
  kafbat:
    class: infra
    enabled: true
    edgePolicy: false
    ownLogin: true
    routeName: kafbat
    hostnameKey: kafbat
    hostname: ""
    backendService: dfe-kafbat
    backendNamespace: kafka
    backendPort: 8080
    adminLink:
      name: Kafbat
      purpose: Kafka topics, consumer groups and their lag

  # The Cruise Control UI (kafka chart, ns strimzi). It has NO auth of its own, so
  # it renders only behind the edge policy, and only where the kafka chart renders
  # the Service: strimzi, kafka.mode cluster, both rebalancing switches on.
  cruiseControl:
    class: infra
    enabled: true
    edgePolicy: true
    ownLogin: false
    routeName: cruise-control
    hostnameKey: cruiseControl
    hostname: ""
    # <kafka.name>-cruise-control-ui
    backendService: dfe-kafka-cruise-control-ui
    backendNamespace: strimzi
    backendPort: 8080
    adminLink:
      name: Cruise Control
      purpose: Kafka partition balance and rebalance proposals

  # Deployment links page (bundled chart, ns links). NO auth of its own, so it
  # renders only behind the edge policy.
  links:
    class: infra
    enabled: true
    edgePolicy: true
    ownLogin: false
    routeName: links
    hostnameKey: links
    hostname: ""
    backendService: dfe-links
    backendNamespace: links
    backendPort: 8080
    adminLink:
      name: Deployment links
      purpose: Every web surface this deployment exposes, with a reachability check

  # dfe-receiver ingest on receiver.{domain}, rendered only while
  # exposure.groups.ingest.door is gateway: any other door would make this a second
  # door around it. Only the receiver's http listener is routable here.
  receiver:
    class: ingest
    enabled: true
    routeName: receiver
    hostnameKey: receiver
    hostname: ""
    backendService: dfe-receiver
    backendNamespace: ""
    backendPort: 8080
    # The receiver's config.server.auth.mode, restated because this chart cannot read another's values: none | header |
    # bearer | mtls | both. Refused on an internet-facing Service unless header or bearer, because Envoy
    # terminates TLS and mtls never sees a client certificate.
    authMode: none

  # Platform OTLP/HTTP ingest from outside the cluster, rendered only with
  # otel.ingress.enabled and routed to otel.ingress.port: docs/deployment/edge.md#otlp-ingress.
  otel:
    class: ingest
    enabled: true
    routeName: otel
    hostnameKey: otel
    hostname: ""
    backendService: dfe-otel-collector-gateway
    backendNamespace: otel

# OIDC, off by default (local auth is the default): docs/deployment/gateway-oidc.md.
# One SecurityPolicy per provider on the dfe-engine HTTPRoute. A provider change is
# a values change and an Argo sync, never a dfe-engine API call.
oidc:
  enabled: false
  # ESO ClusterSecretStore pulling each provider's client secret into a
  # dfe-oidc-<name> Secret (key client-secret) the SecurityPolicy references.
  secretStoreName: dfe-secret-store
  # The interactive HTTPRoutes the OIDC SecurityPolicy fronts: {name = HTTPRoute metadata.name, hostname = subdomain
  # label, optional namespace}. Each gets its OWN redirectURL on its OWN hostname, because cookies are set per host.
  # Not a Gateway-wide policy: dfe-engine /api machine paths use API-key/JWT and must not redirect to login.
  targetRoutes:
    # HyperDX is deliberately NOT here: it is iframed in dfe-ui, so an interactive redirect cannot
    # complete (the IdP denies framing) and the fork is its own PEP on the dfe_token cookie.
    - name: dfe-engine
      hostname: dfe
  # The provider owning the interactive login on every fronted route. A
  # SecurityPolicy takes ONE oidc provider and two on one route conflict, so the
  # choice is declared. Empty takes the first entry. The others stay JWT issuers.
  loginProvider: ""
  providers: []
  # Provider examples, including a private-CA IdP: docs/deployment/gateway-oidc.md.

# jwt_authn filter, chained after OIDC: claims into the headers dfe-engine reads.
# DEFAULT OFF until the two limits in docs/deployment/gateway-oidc.md are answered.
jwtAuthn:
  enabled: false
  issuer: ""
  audiences: []
  forwardHeaders:
    subject: X-Oidc-Subject
    # Never arrives: claimToHeaders takes no array claim and `groups` is one, so an
    # edge login reaches the engine with ZERO roles
    # (docs/deployment/gateway-oidc.md#x-oidc-groups-cant-be-minted).
    groups: X-Oidc-Groups
    user: X-Forwarded-User    # backward compat (nginx convention)
  # The patch policy's jwt_authn reads an Authorization Bearer header and an OIDC login leaves the browser holding a COOKIE.
  # auth.trustProxyHeaders is per engine but header stripping is per listener, so setting it makes X-Oidc-* spoofable
  # everywhere that engine is reachable.
