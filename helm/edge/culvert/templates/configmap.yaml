# Tuning profile, mounted at /etc/vpn/profiles/culvert.yaml and selected by
# CULVERT_PROFILE=culvert. TUNING ONLY -- MTU, buffers, keepalive. Routing,
# addressing and authentication all come through the CULVERT_* environment,
# which overrides a profile key anyway, so a value set in both places would
# read as intent and do nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-config
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  culvert.yaml: |
    {{- toYaml .Values.tuning | nindent 4 }}
