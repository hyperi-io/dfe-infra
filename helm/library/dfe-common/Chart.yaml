apiVersion: v2
name: dfe-common
description: Shared Helm template helpers for all DFE charts. Provides commonLabels and fullname macros per spec Section 9.4.
type: library
# 0.8.0: otelEndpoint picks the derived gateway port from a chart-declared
#        .Values.otelProtocol -- grpc (default, unchanged) 4317, http 4318.
#        dfe-ui runs @vercel/otel, which ships no gRPC exporter, so a :4317 URL
#        lost every trace silently. Default-preserving: a chart that declares
#        nothing renders exactly as it did on 0.7.0.
# 0.7.0: dfe-common.image takes an optional image.digest and renders
#        tag@sha256:... , so a mutable registry tag cannot land bytes other than
#        the ones versions.yaml pins. Charts with no digest render unchanged.
# 0.6.0: add _enrichmenttables.tpl -- ConfigMap, volume and mount for the lookup
#        tables a transform reads, delivered the same way as the programs.
# 0.5.0: add _reload.tpl -- reloader annotations so a rotated Secret reaches a
#        running pod instead of waiting for the next unrelated restart.
# 0.4.0: add _replicas.tpl -- omit `replicas:` when KEDA scales the app, so Argo
#        selfHeal has no rendered value to revert every scale back to.
# 0.3.0: add _transformfiles.tpl -- ConfigMap data, volume, mount and
#        DFE_TRANSFORM_TRANSFORMS_DIR for the transform files dfe-engine writes
#        into the per-instance overlay.
# 0.2.0: add dfe-common.pdb (PodDisruptionBudget helper, replica-gated) and
#        image.public (suppresses imagePullSecrets for public-registry charts).
# 0.1.3: add podSecurityContext + containerSecurityContext hardening helpers
#        (_security.tpl) and the app.kubernetes.io/instance label. All consumers
#        move to 0.1.3 in the same change (previously a mix of 0.1.0/0.1.1/0.1.2).
# 0.1.2: prometheusAnnotations honours a chart-declared .Values.metricsPort.
# NOTE for anyone editing templates/ here: charts VENDOR this library as a
# committed charts/dfe-common-<version>.tgz, so an edit does NOTHING until the
# dependent chart re-runs `helm dependency update`. Bump this version, point the
# chart's Chart.yaml at it, then re-vendor -- otherwise you get a silent no-op.
version: 0.8.0
