## Project:   dfe-infra
## File:      sizing/targets/aws.yaml
## Purpose:   The per-target dial matrix for `cloud: aws` -- every sizing dial
##            the target changes or refuses, and why, so the sizing report can
##            print the whole list rather than implying nothing was dropped on
##            this target's account.
## Language:  YAML
##
## License:   BUSL-1.1
## Copyright: (c) 2026 HYPERI PTY LIMITED

## Read by scripts/resolve_sizing.py's build_report -- see the module
## docstring's TARGETS_DIR paragraph. Every dial below carries a `state` of
## `blocked`, `renamed` or `managed`, plus the one-sentence `reason` the report
## prints beside it. NO LISTS: nested maps and scalars only, parsed by
## scripts/yaml_subset.py.
##
## AWS is the one POPULATED target: nothing here is blocked, because the
## resolver, tofu and Karpenter carry every dial between them rather than a
## vendor's own control plane taking it away.

node_shapes:
  state: managed
  reason: "select_shape resolves the concrete instance type against the live EC2 and Pricing APIs and commits the answer to shapes/resolved/aws-<region>.json, so a Graviton generation change is a reviewed diff, not a manual pick."

storage_classes:
  state: managed
  reason: "compute-shapes.yaml sets storage_class_owner: bootstrap for aws -- bootstrap.sh creates the baseline gp3 class (3,000 IOPS / 125 MiB/s, the free tier) whenever the deployment's own class is absent, so a PVC always has somewhere to bind; per-use-case classes carrying the resolved iops and throughput (A6 in resolve_sizing.py refuses an unset throughput or an iopsPerGB field) are a follow-on."

pool_generation_floor:
  state: managed
  reason: "build_pool_classes admits only the family select_shape chose (under cheapest-of, the generations that policy compared) and floors aws.generationGt one below it, or emits aws.generationIn on a pinned policy. Karpenter launches the cheapest family a pool allows, so an older family on the list would be the one it launches, and a new Graviton generation reaches the pools with the next resolve, as a reviewed diff."

clickhouse_cache_volume:
  state: managed
  reason: "build_values emits clickhouse.objectStore.cache.volume from the resolved shape's own instance-store volume (compute-shapes.yaml's clickhouse.volumes.cache) -- instance-store with the shape's cache size whenever the chosen r9gd-class type carries local NVMe, pvc otherwise -- so a large gp3 cache is never the default a resolve presents."
