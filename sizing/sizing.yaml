## Floors: what a deployment gets with no throughput estimate. Its throughput is reported, never targeted.
floors:
  kafka_brokers:
    value: 3
    unit: nodes
    applies_to: all-providers
    source: helm/charts/kafka/templates/kafka.yaml:43
    read: 2026-09-13
