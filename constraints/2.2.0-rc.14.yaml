# Compatibility constraints for DFE stack 2.2.0-rc.14.
#
# Referenced from versions.yaml stacks."2.2.0-rc.14".constraints.
# Validated by: python3 scripts/dfe-stack compat-check --stack 2.2.0-rc.14
#
# The interdependency limitations we found live here MACHINE-READABLY (they were
# prose comments before). Rules are keyed by ID (a MAP, not a list) so the
# existing stdlib reader parses this with zero new parser code. Each rule is a
# GUARD (`when-*` on one pin) plus a REQUIREMENT (`require-*` on another pin):
# if the guard holds for this stack, the requirement MUST hold too.
#   when-key + one of:  when-range | when-equals
#   require-key + one of:  require-range | require-equals | require-matches | require-present
#   *-range: whitespace-separated comparators (>= <= > < ==), ALL must hold.
#   severity: error (blocks under --strict) | warn (advisory).
# Version compare is TOLERANT (strip a leading v, leading-numeric dotted
# segments), so 26.3.13.31 and v26.1.8 both parse. require-matches is a plain
# substring test (for the 4-part ferretdb backend tag).
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

schema: 1
stack: "2.2.0-rc.14"

rules:

  strimzi-kafka-ceiling:
    severity: "error"
    when-key: "operators.strimzi-kafka-operator"
    when-range: ">=1.2.0 <1.3.0"
    require-key: "services.kafka-version"
    require-range: ">=4.2.0 <=4.3.1"
    reason: "strimzi 1.2 supports Apache Kafka 4.2.0-4.3.1 (4.3.1 default); 1.1 removed 4.1.x"
    source: "https://github.com/strimzi/strimzi-kafka-operator/blob/1.2.0/kafka-versions.yaml"

  clickhouse-operator-server-range:
    severity: "warn"
    when-key: "operators.clickhouse-operator"
    when-equals: "0.0.8"
    require-key: "services.clickhouse-version"
    require-range: ">=25.0.0 <27.0.0"
    reason: "PLACEHOLDER bound -- the official clickhouse-operator 0.0.8 does not publish an explicit clickhouse-server compatibility range. Confirm the tested range and promote to error. Also verify the CRD kind (upstream docs say ClickHouseInstallation; our comment says ClickHouseCluster). NOTE: when-equals is an EXACT match, so this guard must be re-pointed on every clickhouse-operator bump or the rule silently stops firing."
    source: "https://github.com/ClickHouse/clickhouse-operator/releases"

  clickhouse-keeper-server-pairing:
    severity: "error"
    when-key: "services.clickhouse-version"
    when-equals: "26.3.42.3"
    require-key: "services.clickhouse-keeper"
    require-equals: "26.3.42.3"
    reason: "Keeper ships in the ClickHouse release, and helm/charts/clickhouse-cluster runs the server and Keeper from the same one, so the two pins move as one. Error severity: a server bump leaves this when-equals guard dead, which fails --strict until the keeper pin and this rule are re-pointed together."
    source: "https://github.com/ClickHouse/ClickHouse/releases"

  redpanda-operator-broker-pairing:
    severity: "warn"
    when-key: "operators.redpanda-operator"
    when-equals: "26.2.4"
    require-key: "services.redpanda-version"
    require-equals: "v26.2.3"
    reason: "redpanda-operator chart 26.2.4 is tested/paired with broker image v26.2.3. Other broker tags are untested with this operator (a tested-pairing recommendation, not a proven hard break -- hence warn)."
    source: "https://github.com/redpanda-data/redpanda-operator/releases"

  envoy-gateway-proxy-pairing:
    severity: "error"
    when-key: "operators.envoy-gateway"
    when-equals: "v1.9.2"
    require-key: "services.envoy-gateway-proxy"
    require-equals: "distroless-v1.39.2"
    reason: "Envoy Gateway v1.9.2 compiles in docker.io/envoyproxy/envoy:distroless-v1.39.1 as its default proxy; helm/edge/gateway pins distroless-v1.39.2 explicitly over it for BoringSSL CVE-2026-35189, one patch ahead on the same Envoy minor. The gateway and proxy pins move as one. Error severity: a gateway bump leaves this when-equals guard dead, which fails --strict until the proxy pin and this rule are re-pointed together."
    source: "https://github.com/envoyproxy/gateway/blob/v1.9.2/api/v1alpha1/shared_types.go"

  ferretdb2-requires-documentdb:
    severity: "error"
    when-key: "services.ferretdb"
    when-range: ">=2.0.0"
    require-key: "services.documentdb-pg"
    require-matches: "ferretdb-2"
    reason: "FerretDB 2.x REQUIRES the postgres-documentdb backend (a documentdb 2.x image). 1.x to 2.x is not in-place upgradable (dump/restore)."
    source: "https://docs.ferretdb.io/"

# Accepted, tracked exceptions the check must not fail on yet. A waiver names a
# rule id it suppresses (or a free scope), a reason, an expiry, and a ref.
# (None currently: the k8s-ferretdb-chart-lag waiver retired when the k8s
# ferretdb chart moved to 2.x with its bundled documentdb backend.)
waivers:
