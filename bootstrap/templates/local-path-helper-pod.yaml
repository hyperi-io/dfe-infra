# local-path-provisioner's helperPod.yaml, written into the local-path-config
# ConfigMap by bootstrap.sh. Upstream's deploy/local-path-storage.yaml at the
# bootstrap.local-path-provisioner tag, with its untagged busybox image pinned.
apiVersion: v1
kind: Pod
metadata:
  name: helper-pod
spec:
  priorityClassName: system-node-critical
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
  containers:
  - name: helper-pod
    image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    imagePullPolicy: IfNotPresent
