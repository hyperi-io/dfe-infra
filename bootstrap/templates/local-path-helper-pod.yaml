# local-path-provisioner's helperPod.yaml, written into the local-path-config
# ConfigMap by bootstrap.sh. Upstream's deploy/local-path-storage.yaml at the
# bootstrap.local-path-provisioner tag, with its untagged busybox image pinned
# and read from the Docker Official Image's public.ecr.aws mirror, which serves
# the same index digest, so a Docker Hub rate limit cannot stop it.
apiVersion: v1
kind: Pod
metadata:
  name: helper-pod
spec:
  priorityClassName: system-node-critical
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
  containers:
  - name: helper-pod
    image: public.ecr.aws/docker/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    imagePullPolicy: IfNotPresent
