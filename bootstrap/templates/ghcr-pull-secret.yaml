# ExternalSecret — syncs GHCR pull credential from OpenBao to K8s.
# The pull secret is used by all DFE pods (via imagePullSecrets in values).
# To rotate: update secret/dfe/ghcr-pull-secret in OpenBao, ESO refreshes in 1h.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: ${DFE_NAMESPACE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dfe-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: dfe/ghcr-pull-secret
        property: dockerconfigjson
