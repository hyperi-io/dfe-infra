# Plain Valkey deployment for ArgoCD cache.
# No Bitnami, no operator — just a single-replica Deployment + Service.
# ArgoCD only needs a simple Redis-compatible cache; no persistence required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: argocd
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
          ports:
            - name: valkey
              containerPort: 6379
          args:
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - ""
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: argocd
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      name: valkey
  selector:
    app.kubernetes.io/name: valkey
