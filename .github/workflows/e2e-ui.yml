# Typechecks the e2e-ui harness and runs its OIDC self-test against the local mock IdP,
# which needs no cluster, no live IdP and no secret.
name: e2e-ui harness

# No `paths:` here, the `changes` job filters. docs/ci-maintenance-design.md, "CI workflows".
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes through the token.
permissions:
  contents: read

jobs:
  changes:
    name: changed paths (e2e-ui)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Match the changed files against the paths
        id: filter
        uses: ./.github/actions/changes
        with:
          paths: |
            tests/e2e-ui/**
            .github/workflows/e2e-ui.yml
            .github/actions/changes/action.yml

  selftest:
    name: e2e-ui typecheck + OIDC harness self-test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a restored cache is one more input to trust.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      # From the repo root, so tsc prints repo-relative paths and its errors annotate the file in the PR.
      - name: Typecheck the harness
        working-directory: .
        run: tests/e2e-ui/node_modules/.bin/tsc --noEmit -p tests/e2e-ui/tsconfig.json

      - name: Install the Chromium headless shell
        run: node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: OIDC harness self-test against the mock IdP
        run: node_modules/.bin/playwright test --project=oidc-live-selftest
