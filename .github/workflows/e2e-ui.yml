# Starts on every PR and push to main, and runs when the browser suite changed.
# Typechecks the e2e-ui harness and runs its OIDC self-test against the local
# mock IdP, which needs no cluster, no live IdP and no secret.
name: e2e-ui harness

# No `paths:` here: a PR outside them would start no run, and a required check
# that never reports blocks the merge. The `changes` job applies the filter.
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes through the token.
permissions:
  contents: read

jobs:
  # The self-test needs this job and runs unless it positively found nothing in
  # PATHS, so a failure here runs the self-test rather than skipping it.
  changes:
    name: changed paths (e2e-ui)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    env:
      # One pattern a line, an exact path or `dir/**`; a `#` line is a note.
      PATHS: |
        tests/e2e-ui/**
        .github/workflows/e2e-ui.yml
    steps:
      # Depth 2 carries a pull request merge commit's two parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Match the changed files against PATHS
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t patterns < <(grep -Ev '^[[:space:]]*(#|$)' <<< "$PATHS")
          for p in "${patterns[@]}"; do
            stem=${p%/\*\*}
            if [[ $stem == *'*'* ]]; then
              echo "::error::'$p' is neither an exact path nor dir/**, the two forms this filter reads"
              exit 1
            fi
          done
          changed="$RUNNER_TEMP/changed"
          all=false
          case "$EVENT" in
            pull_request)
              # The checkout is the merge commit, whose first parent is the base branch tip.
              if git rev-parse -q --verify 'HEAD^2' > /dev/null; then
                git diff --no-renames --name-only -z 'HEAD^1' HEAD > "$changed"
              else
                all=true
              fi
              ;;
            push)
              if [[ $BEFORE =~ ^0*$ ]] || ! git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
                all=true
              else
                git diff --no-renames --name-only -z "$BEFORE" HEAD > "$changed"
              fi
              ;;
            *)
              all=true
              ;;
          esac
          relevant=$all
          if [[ $all == false ]]; then
            while [[ $relevant == false ]] && IFS= read -r -d '' f; do
              for p in "${patterns[@]}"; do
                if [[ $p == */'**' ]]; then
                  prefix=${p%\*\*}
                  if [[ $f == "$prefix"* ]]; then relevant=true; fi
                elif [[ $f == "$p" ]]; then
                  relevant=true
                fi
                if [[ $relevant == true ]]; then
                  echo "in PATHS: $f"
                  break
                fi
              done
            done < "$changed"
          fi
          echo "event $EVENT, run every check: $all, relevant: $relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  selftest:
    name: e2e-ui typecheck + OIDC harness self-test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # A named runner image, so a move of the ubuntu-latest label cannot swap the tools these steps run on.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 24 is the Active LTS major hyperi-ci's versions.yaml sets for TypeScript CI.
      # No cache: the install is six packages, and a restored cache is one more input to trust.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # npm ci fails on a lockfile that disagrees with package.json and checks every
      # tarball against its integrity hash. Nothing in the tree needs an install script.
      - name: Install from the committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      # From the repo root, so tsc prints repo-relative paths and its errors annotate the file in the PR.
      - name: Typecheck the harness
        working-directory: .
        run: tests/e2e-ui/node_modules/.bin/tsc --noEmit -p tests/e2e-ui/tsconfig.json

      # The self-test runs headless, so the Chromium headless shell is the only browser it opens.
      - name: Install the Chromium headless shell
        run: node_modules/.bin/playwright install --with-deps --only-shell chromium

      # The project keeps no trace, screenshot or video (playwright.config.ts), and no step uploads the report.
      - name: OIDC harness self-test against the mock IdP
        run: node_modules/.bin/playwright test --project=oidc-live-selftest
