# versions.yaml is the SSoT for both deploy targets, but only one of them reads
# it live. dfe-infra self-updates through GitOps; dfe-docker holds a committed
# dial, so a `current` move reaches it only when somebody edits that number by
# hand -- which is how it came to sit two release candidates behind
# (dfe-infra#116). This carries the move across as a pull request.
#
# It moves ONE number. What that number selects still comes out of the signed
# stack manifest, so nothing here is a second copy of a pin, and the config that
# genuinely differs between the docker and k8s topologies is not synced.
name: Stack pin propagate

on:
  push:
    branches: [main]
    paths:
      - 'versions.yaml'
      - 'scripts/propagate_stack_pin.py'
      - '.github/workflows/stack-pin-propagate.yml'
  workflow_dispatch:

# Nothing is written in THIS repo; the write is on the target, through a GitHub
# App token scoped to dfe-docker rather than the ambient token.
permissions:
  contents: read

concurrency:
  group: stack-pin-propagate
  cancel-in-progress: true

jobs:
  propagate:
    name: move the consumer's stack dial onto current
    # A named runner image, so a move of the ubuntu-latest label cannot swap the python3 and tools these steps run on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # contents:write lands the dial on a branch, pull-requests:write opens the PR.
      - name: Mint a dfe-docker token
        id: docker-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dfe-docker
          permission-contents: write
          permission-pull-requests: write

      - name: Open the bump PR on dfe-docker
        env:
          GH_TOKEN: ${{ steps.docker-token.outputs.token }}
        run: python3 scripts/propagate_stack_pin.py --open-pr
