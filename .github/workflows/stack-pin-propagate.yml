# Carries a versions.yaml `current` move onto dfe-docker's committed stack dial as a pull request.
# docs/ci-maintenance-design.md, "CI workflows".
name: Stack pin propagate

on:
  push:
    branches: [main]
    paths:
      - 'versions.yaml'
      - 'scripts/propagate_stack_pin.py'
      - '.github/workflows/stack-pin-propagate.yml'
  # A `current` move lands before its tag exists, so the push run skips; the tag
  # comes from Stack Release, whose own token cannot trigger a tag-push workflow.
  workflow_run:
    workflows: ['Stack Release']
    types: [completed]
  workflow_dispatch:

# Nothing is written in this repo. The write is on dfe-docker, through an App token scoped to it.
permissions:
  contents: read

concurrency:
  group: stack-pin-propagate
  cancel-in-progress: true

jobs:
  propagate:
    name: move the consumer's stack dial onto current
    # A Stack Release that failed cut no tag, so there is nothing to move onto.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # contents:write lands the dial on a branch, pull-requests:write opens the PR.
      - name: Mint a dfe-docker token
        id: docker-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dfe-docker
          permission-contents: write
          permission-pull-requests: write

      - name: Open the bump PR on dfe-docker
        env:
          GH_TOKEN: ${{ steps.docker-token.outputs.token }}
        run: python3 scripts/propagate_stack_pin.py --open-pr
