# One-shot: bootstrap the dfe-engine GHCR package.
# GitHub Apps can't create the FIRST org package — only GITHUB_TOKEN in Actions can.
# After this runs once, delete this file and use hyperi-container-mgt app for pushes.
name: Bootstrap dfe-engine package
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout dfe-engine
        uses: actions/checkout@v4
        with:
          repository: hyperi-io/dfe-engine
          path: dfe-engine
          token: ${{ secrets.GIT_TOKEN }}

      - name: Checkout hyperi-pylib
        uses: actions/checkout@v4
        with:
          repository: hyperi-io/hyperi-pylib
          path: hyperi-pylib
          token: ${{ secrets.GIT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build hyperi-pylib wheel
        run: cd hyperi-pylib && uv build --wheel -o ../dfe-engine/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          cd dfe-engine
          docker build \
            -f - \
            -t ghcr.io/hyperi-io/dfe-engine:2.2.0 \
            . <<'DOCKERFILE'
          FROM python:3.12-slim AS builder
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /usr/local/bin/uv
          WORKDIR /app
          COPY hyperi_pylib-*.whl /tmp/
          COPY pyproject.toml README.md ./
          COPY src/ src/
          RUN uv venv .venv \
              && uv pip install --python .venv/bin/python /tmp/hyperi_pylib-*.whl \
              && uv pip install --python .venv/bin/python .
          FROM python:3.12-slim
          LABEL org.opencontainers.image.source="https://github.com/hyperi-io/dfe-infra"
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY --from=builder /app/.venv /app/.venv
          COPY --from=builder /app/src /app/src
          ENV PATH="/app/.venv/bin:$PATH"
          RUN useradd --create-home --uid 1000 appuser
          USER appuser
          EXPOSE 8000
          ENTRYPOINT ["dfe-api"]
          CMD ["run"]
          DOCKERFILE
          docker push ghcr.io/hyperi-io/dfe-engine:2.2.0
