# Builds the DFE docs site from every released stack's pins, plus the unlisted
# /next/ preview from each member's default branch, and deploys it to the docs
# Worker. A pull request that touches the site builds it and deploys nothing.
name: Docs Site

on:
  workflow_dispatch:
  schedule:
    # 02:17 AEST: /next/ follows the members' default branches.
    - cron: "17 16 * * *"
  # A new stack release is a new version in the menu.
  workflow_run:
    workflows: ["Stack Release"]
    types: [completed]
    branches: [main]
  # A merged docs change publishes now. content-root/ and publish.yaml reach every
  # version, and docs/ reaches /next/, which reads this repo's default branch.
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Not a required check, so a path filter here cannot block a merge.
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# One deploy at a time, never cancelled midway. A newer push to a pull request replaces its older build.
concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: build, and deploy from main
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # A named runner image, so a move of the ubuntu-latest label cannot swap the python3 these steps run on.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 24 is the Active LTS major hyperi-ci's versions.yaml sets for TypeScript CI.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # npm ci checks every tarball against the lockfile's integrity hash. The build needs no install script.
      - name: Install from the committed lockfile
        working-directory: docs-site
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Anonymous fetches only: every member repository is public.
      - name: Gather each member's docs at its pinned ref
        run: python3 docs-site/scripts/aggregate.py --next

      - name: Stray report
        run: cat docs-site/content/_reports/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build every version and merge them
        run: python3 docs-site/scripts/build_site.py

      # main's own pages, assembled the same way at the same moment, so a member's /next/ change reaches both trees.
      - name: Assemble main's pages for the docs gate
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth 1 origin main
          git worktree add "$RUNNER_TEMP/main" FETCH_HEAD
          python3 "$RUNNER_TEMP/main/docs-site/scripts/aggregate.py" --next --out "$RUNNER_TEMP/content-main"

      # A pull request fails only on findings main's pages do not already carry, so a page awaiting its rewrite blocks nobody. Elsewhere the gate reports.
      - name: Docs gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 docs-site/scripts/gate.py --baseline "$RUNNER_TEMP/content-main" --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 docs-site/scripts/gate.py --report-only --summary "$GITHUB_STEP_SUMMARY"
          fi

      # Uploads a version and sends it all traffic. The Worker and its domain are created by OpenTofu, never here.
      - name: Deploy to the docs Worker
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          GIT_SHA: ${{ github.sha }}
        run: |
          npx --no-install wrangler versions upload --tag "$GIT_SHA" --message "dfe-infra $GIT_SHA"
          version_id="$(jq -r 'select(.type == "version-upload") | .version_id' "$WRANGLER_OUTPUT_FILE_PATH")"
          test -n "$version_id"
          npx --no-install wrangler versions deploy --version-id "$version_id" --percentage 100 --yes
