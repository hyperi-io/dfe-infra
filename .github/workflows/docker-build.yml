# Builds and pushes DFE service images to JFrog on merge to main.
# This covers Dockerfiles in dfe-infra (utility images like ImperativeOperations).
# Future: change registry to ghcr.io/hyperi-io when OSS.
name: Docker Build + Push

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ${{ secrets.JFROG_HOST }}
  IMAGE_PREFIX: ${{ secrets.JFROG_HOST }}/dfe

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to JFrog registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push images
        run: |
          set -e
          for dockerfile in docker/*/Dockerfile; do
            [ -f "$dockerfile" ] || continue
            service=$(basename "$(dirname "$dockerfile")")
            echo "==> Building $service"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "$dockerfile" \
              --tag "${IMAGE_PREFIX}/${service}:${GITHUB_SHA::8}" \
              --tag "${IMAGE_PREFIX}/${service}:latest" \
              --push \
              "$(dirname "$dockerfile")"
          done
