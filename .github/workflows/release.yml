# Explicit-version stack tagger + manifest publisher.
#
# The stack version is versions.yaml `current` (a CURATED manifest decision, not
# commit-derived). On push to main this:
#   1. GATES the stack: drift-check + compat-check --strict + release-gate + the
#      third-party amd64/arm64 check + a live-registry digest verify, all read
#      anonymously because every image the stack pins is public.
#   2. reads `current`; if its tag already exists -> nothing to cut (idempotent,
#      so editing pins WITHOUT bumping `current` just re-runs the gate).
#   3. else cuts the `current` tag, then renders + signs + publishes the manifest
#      INLINE (folded from the old stack-manifest.yml -- a GITHUB_TOKEN-pushed tag
#      does NOT re-trigger a separate workflow, so publishing must live here).
#   4. on a release-maturity tag, advances the `latest` pointer through a pull
#      request that merges once main's required checks pass on it.
#
# NEVER hand-tag: humans curate `current` + the stacks entry; this cuts the tag.
name: Stack Release

on:
  push:
    branches: [main]
    paths:
      - 'versions.yaml'
      - 'constraints/**'
  workflow_dispatch:

permissions:
  contents: write   # push the tag + the GH release; the `latest` PR uses an App token
  packages: write   # push the OCI artifact
  id-token: write   # cosign keyless via GitHub OIDC

# Serialise release runs so two quick pushes to versions.yaml cannot cut/publish
# or advance `latest` concurrently (the tag + manifest are already immutable by
# the time latest advances). Do NOT cancel-in-progress -- a mid-flight publish
# must finish.
concurrency:
  group: stack-release
  cancel-in-progress: false

# The same Helm helm-lint.yml pins, so the release gate resolves chart appVersions
# exactly as the PR check did.
env:
  HELM_VERSION: "4.3.0"

jobs:
  release:
    name: gate, tag `current`, publish + sign the manifest
    # A named runner image, so a move of the ubuntu-latest label cannot swap the python3 and tools these steps run on.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: dfe-stack + tag existence checks

      - name: Gate -- drift + compatibility + release-gate
        run: |
          set -euo pipefail
          python3 scripts/check_versions_drift.py
          python3 scripts/dfe-stack compat-check --strict
          python3 scripts/dfe-stack release-gate

      # The chart-installed add-ons take their image tags from their chart's
      # appVersion, which --resolve-charts reads with helm.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Third-party images are public, so this needs no credential; the DFE
      # images are dfe-stack release-gate's, above.
      - name: Gate -- every pinned third-party image ships linux/amd64 and linux/arm64
        run: python3 scripts/check_image_arch.py --third-party-only --resolve-charts

      # Every DFE image and thin chart is public, so verify reads each tag's digest
      # anonymously through docker buildx imagetools; one an outsider cannot pull fails here.
      - name: Gate -- every pinned DFE image and chart digest matches the registry
        run: python3 scripts/dfe-stack verify

      - name: Resolve `current` + decide whether to cut
        id: ver
        run: |
          set -euo pipefail
          CURRENT=$(python3 scripts/dfe-stack current)
          if [ -z "$CURRENT" ]; then echo "error: no current pointer" >&2; exit 1; fi
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${CURRENT}" >/dev/null; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            echo "tag ${CURRENT} already exists -- nothing to cut"
          else
            echo "cut=true" >> "$GITHUB_OUTPUT"
            echo "will cut ${CURRENT}"
          fi
          MATURITY=$(python3 scripts/dfe-stack maturity --stack "$CURRENT")
          echo "maturity=${MATURITY}" >> "$GITHUB_OUTPUT"

      - name: Cut the tag
        if: steps.ver.outputs.cut == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.current }}"
          git config user.name "hyperi-ci"
          git config user.email "ci@hyperi.io"
          git tag -a "$TAG" -m "DFE stack $TAG"
          git push origin "$TAG"

      - name: Render manifest + docker env + image list + graph
        if: steps.ver.outputs.cut == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.current }}"
          python3 scripts/dfe-stack render --stack "$TAG" --out "dfe-manifest-${TAG}.yaml"
          python3 scripts/dfe-stack render --target docker --stack "$TAG" --out "dfe-env-${TAG}.txt"
          python3 scripts/dfe-stack images --stack "$TAG" > "dfe-images-${TAG}.txt"
          python3 scripts/dfe-stack graph > "dfe-upgrade-graph.json"
          FILES="dfe-manifest-${TAG}.yaml dfe-env-${TAG}.txt dfe-images-${TAG}.txt dfe-upgrade-graph.json"
          if [ -f "constraints/${TAG}.yaml" ]; then
            cp "constraints/${TAG}.yaml" "dfe-constraints-${TAG}.yaml"
            FILES="$FILES dfe-constraints-${TAG}.yaml"
          fi
          sha256sum $FILES > SHA256SUMS
          echo "FILES=$FILES" >> "$GITHUB_ENV"

      - name: Attach to the GitHub release
        if: steps.ver.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MATURITY: ${{ steps.ver.outputs.maturity }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.current }}"
          # Only a release-maturity tag may become GitHub's "Latest"; an rc or beta publishes as a prerelease.
          KIND=(--prerelease --latest=false)
          if [ "$MATURITY" = "release" ]; then KIND=(--latest); fi
          gh release create "$TAG" --verify-tag --title "DFE $TAG" --generate-notes "${KIND[@]}" || true
          gh release upload "$TAG" --clobber $FILES SHA256SUMS

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: steps.ver.outputs.cut == 'true'

      - name: Push manifest as an OCI artifact
        if: steps.ver.outputs.cut == 'true'
        id: oras_push
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.current }}"
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/${{ github.repository_owner }}/dfe-stack-manifest:${TAG}"
          ARGS="dfe-manifest-${TAG}.yaml:application/yaml dfe-env-${TAG}.txt:text/plain dfe-images-${TAG}.txt:text/plain dfe-upgrade-graph.json:application/json"
          if [ -f "dfe-constraints-${TAG}.yaml" ]; then ARGS="$ARGS dfe-constraints-${TAG}.yaml:application/yaml"; fi
          DIGEST=$(oras push "$REF" \
            --artifact-type application/vnd.hyperi.dfe.stack-manifest.v1+yaml \
            $ARGS \
            --format go-template --template '{{.digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.ver.outputs.cut == 'true'

      - name: Cosign sign the artifact (keyless, GitHub OIDC)
        if: steps.ver.outputs.cut == 'true'
        run: |
          set -euo pipefail
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/dfe-stack-manifest@${{ steps.oras_push.outputs.digest }}"

      # main takes no update without its required checks, so `latest` moves through a
      # pull request, opened with the App's token because one opened with GITHUB_TOKEN
      # starts its checks waiting for a human's approval.
      - name: Mint a dfe-infra token for the `latest` pull request
        id: latest-token
        if: steps.ver.outputs.cut == 'true' && steps.ver.outputs.maturity == 'release'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      # A checkout of its own, so the branch push carries the App token rather than
      # the GITHUB_TOKEN the first checkout persisted.
      - name: Check out main with the App token
        if: steps.ver.outputs.cut == 'true' && steps.ver.outputs.maturity == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .latest
          token: ${{ steps.latest-token.outputs.token }}

      - name: Advance `latest` through a pull request
        if: steps.ver.outputs.cut == 'true' && steps.ver.outputs.maturity == 'release'
        working-directory: .latest
        env:
          GH_TOKEN: ${{ steps.latest-token.outputs.token }}
          TAG: ${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          branch="stack-latest/${TAG}"
          title="chore: advance latest -> ${TAG}"
          git config user.name "hyperi-ci"
          git config user.email "ci@hyperi.io"
          # A branch and pull request left by an earlier run at this tag are reused, not refused.
          lease=$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)
          pr=$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url // ""')
          for attempt in 1 2 3; do
            echo "attempt ${attempt}: ${branch} from the current main"
            git fetch -q --no-tags --depth=1 origin main
            git checkout -q -B "$branch" FETCH_HEAD
            python3 scripts/dfe-stack set-latest "$TAG"
            if git diff --quiet -- versions.yaml; then
              echo "main already points latest at ${TAG}"
              exit 0
            fi
            git commit -q -m "$title" -- versions.yaml
            head=$(git rev-parse HEAD)
            git push -q --force-with-lease="refs/heads/${branch}:${lease}" origin "HEAD:refs/heads/${branch}"
            lease=$head
            if [ -z "$pr" ]; then
              pr=$(gh pr create --base main --head "$branch" --title "$title" \
                --body "Stack Release moves the top-level \`latest:\` pointer onto ${TAG}, a release-maturity stack.")
            fi
            # gh pr checks fails at once while the head carries no check, so it waits for the head and its first check.
            registered=false
            for _ in $(seq 40); do
              if [ "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" = "$head" ] \
                && gh pr checks "$pr" --json name --jq length > /dev/null 2>&1; then
                registered=true
                break
              fi
              sleep 15
            done
            if [ "$registered" != true ]; then
              echo "::error::no check registered on ${head} within 10 minutes; ${pr} is left open"
              exit 1
            fi
            if ! timeout 60m gh pr checks "$pr" --watch --fail-fast --interval 30; then
              echo "::error::a check on ${head} failed or did not finish; ${pr} is left open"
              exit 1
            fi
            # A required check can report after the others finish, so a refused merge is retried before it is judged.
            state=UNKNOWN
            for _ in $(seq 10); do
              if gh pr merge "$pr" --squash --match-head-commit "$head"; then
                echo "latest -> ${TAG} merged through ${pr}"
                exit 0
              fi
              state=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus || echo UNKNOWN)
              # DIRTY is a conflict with what main took since the branch was cut, so the branch is rebuilt on main.
              if [ "$state" = DIRTY ]; then
                continue 2
              fi
              sleep 30
            done
            echo "::error::${pr} stayed unmergeable (${state}) on ${head}"
            exit 1
          done
          echo "::error::${branch} still conflicted with main after 3 attempts; ${pr} is left open"
          exit 1
