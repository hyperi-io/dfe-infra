# Runs on every PR and push to main.
# Validates all Terraform modules and runs tests.
# Matrix: both terraform and opentofu to ensure compatibility.
name: Terraform Validate

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-validate.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-validate.yml'

jobs:
  validate:
    name: validate + test (${{ matrix.tf }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tf: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        if: matrix.tf == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.7.0"

      # terraform is RETIRING -- see hyperi-io/hyperi-developer#11. OpenTofu is
      # being made canonical across HyperI; this matrix leg stays only until #11
      # lands, then the job drops to tofu alone.
      - name: Install Terraform
        if: matrix.tf == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.0"

      - name: Validate all modules
        run: |
          set -e
          for dir in terraform/modules/*/; do
            echo "==> Validating $dir"
            ${{ matrix.tf }} -chdir="$dir" init -backend=false
            ${{ matrix.tf }} -chdir="$dir" validate
          done

      - name: Run tests (modules with .tftest.hcl)
        run: |
          set -e
          for dir in terraform/modules/*/; do
            if ls "${dir}tests/"*.tftest.hcl 2>/dev/null | grep -q .; then
              echo "==> Testing $dir"
              ${{ matrix.tf }} -chdir="$dir" test
            fi
          done
