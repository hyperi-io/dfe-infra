# Validates every OpenTofu module and environment root, and runs the module tests.
name: OpenTofu Validate

# No `paths:` here, the `changes` job filters. docs/ci-maintenance-design.md, "CI workflows".
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes through the token.
permissions:
  contents: read

# Tracks versions.yaml toolbox.tofu (check_versions_drift.py), so the operator shell and CI validate on one OpenTofu.
env:
  TOFU_VERSION: "1.13.9"

jobs:
  changes:
    name: changed paths (tofu)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Match the changed files against the paths
        id: filter
        uses: ./.github/actions/changes
        with:
          paths: |
            terraform/**
            .github/workflows/tf-validate.yml
            .github/actions/changes/action.yml

  validate:
    name: validate + test (tofu)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # Targets are found from the files themselves: edge/ and toolbox/ hold no .tf of their own and keep their tests under aws/.
      # Process substitution, not a pipe into while, so set -e sees a failure inside the loop.
      - name: Validate every module
        run: |
          set -e
          while IFS= read -r dir; do
            echo "==> Validating $dir"
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
          done < <(find terraform/modules -name '*.tf' -printf '%h\n' | sort -u)

      - name: Run every module's tests
        run: |
          set -e
          while IFS= read -r dir; do
            echo "==> Testing $dir"
            tofu -chdir="$dir" test
          done < <(find terraform/modules -name '*.tftest.hcl' -printf '%h\n' | sed 's:/tests$::' | sort -u)

  # A root checks the arguments it passes its modules, and is what an operator applies.
  validate-roots:
    name: validate environment roots (tofu)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # -lockfile=readonly fails a root whose committed .terraform.lock.hcl is missing or stale.
      # Zero roots found fails rather than reporting a pass over nothing.
      - name: Validate every environment root
        run: |
          set -e
          count=0
          while IFS= read -r dir; do
            echo "==> Validating $dir"
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$dir" validate
            count=$((count + 1))
          done < <(find terraform/environments -name '*.tf' -printf '%h\n' | sort -u)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::no .tf found under terraform/environments -- nothing was validated"
            exit 1
          fi
          echo "validated $count environment roots"

      # Each root's tests mock every provider, so they need no credential, and zero
      # roots with tests fails rather than passing over nothing.
      - name: Run every environment root's tests
        run: |
          set -e
          count=0
          while IFS= read -r dir; do
            echo "==> Testing $dir"
            tofu -chdir="$dir" test
            count=$((count + 1))
          done < <(find terraform/environments -name '*.tftest.hcl' -printf '%h\n' | sed 's:/tests$::' | sort -u)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::no .tftest.hcl found under terraform/environments -- no root test ran"
            exit 1
          fi
          echo "tested $count environment roots"
