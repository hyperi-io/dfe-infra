# Runs on every PR and push to main.
# Validates all Terraform modules and runs tests.
# Matrix: both terraform and opentofu to ensure compatibility.
name: Terraform Validate

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-validate.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-validate.yml'

jobs:
  validate:
    name: validate + test (${{ matrix.tf }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tf: [terraform, tofu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install OpenTofu
        if: matrix.tf == 'tofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.7.0"

      - name: Install Terraform
        if: matrix.tf == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Validate all modules
        run: |
          set -e
          for dir in terraform/modules/*/; do
            echo "==> Validating $dir"
            ${{ matrix.tf }} -chdir="$dir" init -backend=false
            ${{ matrix.tf }} -chdir="$dir" validate
          done

      - name: Run tests (modules with .tftest.hcl)
        run: |
          set -e
          for dir in terraform/modules/*/; do
            if ls "${dir}tests/"*.tftest.hcl 2>/dev/null | grep -q .; then
              echo "==> Testing $dir"
              ${{ matrix.tf }} -chdir="$dir" test
            fi
          done
