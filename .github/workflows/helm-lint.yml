# Lints all Helm charts on every PR and push to main.
name: Helm Lint

# No `paths:` here, the `changes` job filters. docs/ci-maintenance-design.md, "CI workflows".
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to this repo. Cross-repo reads use App tokens minted per step, which these scopes do not govern.
permissions:
  contents: read

# One Helm for every job here, so the bats renders are the charts the lint job lints.
env:
  HELM_VERSION: "4.3.0"

jobs:
  changes:
    name: changed paths (helm lint)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      images: ${{ steps.images.outputs.relevant }}
      published: ${{ steps.published.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Match the changed files against the paths
        id: filter
        uses: ./.github/actions/changes
        with:
          paths: |
            helm/**
            argocd/**
            bootstrap/**
            versions.yaml
            # The dfe-ops upgrade tests walk it, so an edit to it alone ran none of them.
            upgrade-order.yaml
            # The app catalogue is data the composition and profile tests read, so an
            # edit to it alone used to merge with nothing run (dfe-infra#255).
            apps.yaml
            deployment.example.yaml
            constraints/**
            # Whole tree: the job now lints every file under scripts/, not only the
            # handful it runs.
            scripts/**
            ruff.toml
            .python-version
            suite.yaml
            docs/suite-graph.md
            # test_workflow_log_masks.py walks every workflow and three more tests read named ones.
            .github/workflows/**
            # The filter itself, which test_helm_lint_triggers.py reads and runs.
            .github/actions/**
            # test_no_cost_figures.py sweeps every doc and the README.
            docs/**
            README.md
            # Several tests read the modules and roots, and the drift check sweeps the .tf files for pins.
            terraform/**
            # test_validate_sizing.py and test_no_cost_figures.py read the sizing tables and shapes.
            sizing/**
            shapes/**
            # test_toolbox_inputs.py walks the base build context.
            docker/dfe-toolbox/**
            # test_dfe_stack.py ties the customManager regex to versions.yaml.
            renovate.json
            # test_check_versions_drift.py asserts the operator's dial is ignored from the root.
            .gitignore
            # test_tester_idp.py holds the fixture to the spec's truth table.
            tests/e2e-ui/specs/engine/oidc-rba.spec.ts
            # dfe-sweep's committed defaults, which test_sweep_defaults.py validates.
            config/defaults.yaml
            # test_docs_aggregate.py loads docs-site/scripts/aggregate.py and copies content-root/.
            docs-site/**

      # Registries rate-limit a shared runner, so the arch check runs only where its verdict can change.
      # test_helm_lint_triggers.py holds this list to the checker's import closure.
      - name: Match the changed files against what the arch check reads
        id: images
        uses: ./.github/actions/changes
        with:
          paths: |
            versions.yaml
            # CHART_VALUES_IMAGES in check_image_arch.py
            helm/charts/documentdb/values.yaml
            helm/charts/forgejo/values.yaml
            helm/charts/kafka/values.yaml
            scripts/check_image_arch.py
            scripts/image-arch-proven.json
            scripts/dfe-stack
            scripts/check_suite_drift.py
            scripts/composition.py
            scripts/manifest_deps.py
            scripts/oci_registry.py
            scripts/profiles.py
            scripts/registry_pins.py
            scripts/stack_comments.py
            scripts/stack_freeze.py
            scripts/stack_images.py
            scripts/suite_graph.py
            scripts/version_range.py
            scripts/yaml_subset.py
            # The job's own environment.
            .github/workflows/helm-lint.yml
            .github/actions/**
            .python-version
            scripts/tests/requirements-ci.txt
            scripts/tests/requirements-merrow.txt

      # The published-chart renders pull every thin chart from the registry, so they run only where their verdict can change.
      # test_helm_lint_triggers.py holds this list to the render's inputs.
      - name: Match the changed files against what the published renders read
        id: published
        uses: ./.github/actions/changes
        with:
          paths: |
            versions.yaml
            scripts/tests/fixtures/contracts/**
            scripts/tests/fixtures/thin-renders/**
            scripts/tests/_weave.py
            scripts/tests/_gate.py
            scripts/tests/test_weave_published.py
            scripts/dfe-weave
            scripts/check_versions_drift.py
            scripts/version_range.py
            argocd/appsets/layer2-apps.yaml
            argocd/appsets/layer2-edge.yaml
            argocd/values/**
            helm/charts/dfe-extras/**
            # The job's own environment.
            .github/workflows/helm-lint.yml
            .github/actions/**
            .python-version
            scripts/tests/requirements-ci.txt

  lint:
    name: helm lint + yaml validate
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      # Full history carries the stack tags, which test_stack_freeze.py holds every released block to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A venv outside the checkout, so no walk of the tree reaches its site-packages. The install is its own step because `uv run --with-requirements` does not check hashes.
      - name: Set up uv and the repo's Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: false

      # A python3 that is not the venv's would run every step below on the runner's own Python and still pass, so the version is checked first.
      - name: Install the pinned test dependencies, hashes required
        run: |
          uv pip install --require-hashes -r scripts/tests/requirements-ci.txt -r scripts/tests/requirements-merrow.txt
          python3 -c 'import pathlib, sys; want = pathlib.Path(".python-version").read_text().strip(); have = "%d.%d" % sys.version_info[:2]; sys.exit(None if have == want else f"python3 is {have}, .python-version says {want}")'

      # Pinned, so a ruff release cannot fail a PR that changed nothing.
      - name: Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"
          args: check
          src: .

      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"
          args: format --check
          src: .

      - name: Drift-check failure paths
        run: python3 scripts/tests/test_check_versions_drift.py

      - name: SSoT annotation + Renovate manager contract
        run: python3 scripts/tests/test_dfe_stack.py

      - name: suite.yaml reader and queries
        run: python3 scripts/tests/test_suite_graph.py

      - name: Suite drift check failure paths
        run: python3 scripts/tests/test_check_suite_drift.py

      - name: Terraform-output reader
        run: python3 scripts/tests/test_bridge.py

      - name: Namespace drift failure paths
        run: python3 scripts/tests/test_check_namespace_drift.py

      - name: Pin evidence failure paths
        run: python3 scripts/tests/test_pin_evidence.py

      - name: No chart gates a boolean dial on `with`
        run: python3 scripts/tests/test_with_on_a_boolean.py

      - name: Version drift check (versions.yaml is SSoT)
        run: python3 scripts/check_versions_drift.py

      # Gates the stack under development only. `--all` reports the frozen blocks' backlog without failing.
      - name: Pin evidence check (a bump must move its justification)
        run: python3 scripts/check_pin_evidence.py

      - name: Namespace drift check (common.yaml is SSoT)
        run: python3 scripts/check_namespace_drift.py

      # Cross-repo citations are skipped on this bare checkout and said so. --strict is for an operator run with the member clones on disk.
      - name: Suite graph drift check (suite.yaml is SSoT)
        run: python3 scripts/check_suite_drift.py

      - name: Shared-submodule drift check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_submodule_drift.py

      # Without `--strict` rule violations are advisory, and release.yml runs it strict. No `|| true`, which would also
      # swallow the structural exits.
      - name: Stack compatibility check (advisory)
        run: python3 scripts/dfe-stack compat-check

      # Exits 0 on a lag and annotates a warning: the bump is a reviewed versions.yaml change behind the release-age gate.
      - name: Karpenter AMI alias currency (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_karpenter_ami.py

      # dfe-ops has no extension, so no glob elsewhere compiles it.
      - name: dfe-ops compiles
        run: python3 -m py_compile scripts/dfe-ops

      - name: refresh waits for its sync and refuses a namespace-less smoke run
        run: python3 scripts/tests/test_dfe_ops_refresh.py

      - name: Readiness gate judges the deploy's own namespaces
        run: python3 scripts/tests/test_readiness_gate.py

      - name: Access summary reads the live routes and this deploy's Gateway
        run: python3 scripts/tests/test_access_summary.py

      - name: Tester IdP renders a dex that emits groups, with no secret in the values
        run: python3 scripts/tests/test_tester_idp.py

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Versions are the stack's own pins (versions.yaml). Each download is checked against its release's checksum.
      # gh downloads with the job token: an anonymous release-asset download from a shared runner can get a 403.
      - name: Install the pinned clickhouse and argocd binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "this step fetches amd64 builds, runner is $(uname -m)" >&2; exit 1; }
          ch="$(python3 bootstrap/read_versions.py services.clickhouse-version)"
          argo="$(python3 bootstrap/read_versions.py toolbox.argocd-cli)"
          bin="${RUNNER_TEMP}/test-tools"
          work="$(mktemp -d)"
          mkdir -p "${bin}"
          # ClickHouse publishes a sha512 file beside each package; its tag carries the -lts suffix.
          pkg="clickhouse-common-static-${ch}-amd64.tgz"
          gh release download "v${ch}-lts" --repo ClickHouse/ClickHouse --dir "${work}" --pattern "${pkg}" --pattern "${pkg}.sha512"
          (cd "${work}" && sha512sum --check "${pkg}.sha512")
          tar -xzf "${work}/${pkg}" --strip-components=3 -C "${bin}" "clickhouse-common-static-${ch}/usr/bin/clickhouse"
          gh release download "${argo}" --repo argoproj/argo-cd --dir "${work}" --pattern argocd-linux-amd64 --pattern cli_checksums.txt
          (cd "${work}" && grep ' argocd-linux-amd64$' cli_checksums.txt | sha256sum --check)
          install -m 0755 "${work}/argocd-linux-amd64" "${bin}/argocd"
          rm -rf "${work}"
          echo "${bin}" >> "${GITHUB_PATH}"
          "${bin}/clickhouse" local --version
          "${bin}/argocd" version --client --short

      # Every file under scripts/tests, including ones no step above names.
      - name: scripts/tests under pytest
        run: python3 -m pytest scripts/tests -n auto --dist worksteal -q -rs -p no:cacheprovider --durations=25

      # A step of its own because it reads the engine's bundled apps.yaml over the network (gh api) with a dfe-engine
      # App token, contents:read. Exit 2 (snapshot unreadable) fails. A fork pull request is handed no secrets, so it
      # skips with a notice rather than passing.
      - name: Mint a dfe-engine read token
        id: engine-token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dfe-engine
          permission-contents: read

      - name: Engine's bundled apps.yaml snapshot matches the SSoT
        env:
          GH_TOKEN: ${{ steps.engine-token.outputs.token || github.token }}
          HAS_ENGINE_TOKEN: ${{ steps.engine-token.outputs.token != '' }}
        run: |
          set +e
          python3 scripts/composition.py --check-engine-snapshot
          code=$?
          set -e
          if [[ "$code" -eq 2 && "$HAS_ENGINE_TOKEN" != "true" ]]; then
            echo "::notice::engine snapshot not checked -- a fork pull request is handed no secrets, so no token could read hyperi-io/dfe-engine. The push to main checks the same commit. Skipped rather than reported as a pass."
            exit 0
          fi
          if [[ "$code" -eq 2 ]]; then
            echo "::error::engine snapshot UNREADABLE with a dfe-engine App token -- the App installation needs contents:read on hyperi-io/dfe-engine. An unread mirror is not a passing check."
          fi
          exit "$code"

      - name: External-service egress derives per mode
        run: python3 scripts/tests/test_external_egress.py

      - name: Storage model renders and the cascade holds
        run: python3 scripts/tests/test_storage_model.py

      - name: Gateway OIDC and gateway egress render the working shape
        run: python3 scripts/tests/test_gateway_oidc.py

      # docs/deployment/edge.md cites this as the proof of the exposure cascade.
      - name: Gateway route exposure cascade and render guards
        run: bash scripts/test-route-exposure.sh

      - name: Rendered images carry the pinned digest
        run: python3 scripts/tests/test_image_digest_pin.py

      - name: A chart render is reproducible
        run: python3 scripts/tests/test_render_stable.py

      - name: The private root persists, and dfe-ops ca exports it
        run: python3 scripts/tests/test_internal_ca.py

      - name: Front-door addresses pin and the domain carries the profile
        run: python3 scripts/tests/test_pinned_addresses.py

      - name: Hunt runner reads hunts off the synced deploy repo
        run: python3 scripts/tests/test_hunt_runner_gitsync.py

      - name: Default retention reaches the engine and the schema apply
        run: python3 scripts/tests/test_default_ttl.py

      - name: App pods replace surge-first and carry a disruption budget
        run: python3 scripts/tests/test_rollout.py

      - name: Bus or direct is derived once, for every chart
        run: python3 scripts/tests/test_transport.py

      - name: Every stage pool gets the same listener, on the one profile that asks
        run: python3 scripts/tests/test_pool_listener.py

      - name: The engine is told its profile and its ui pin
        run: python3 scripts/tests/test_engine_deployment_facts.py

      - name: Lint library charts via test charts
        run: |
          set -e
          for test_dir in helm/library/*/tests/lint-test/; do
            echo "==> Linting via $test_dir"
            helm dependency update "$test_dir"
            helm lint "$test_dir"
          done

      - name: Lint application charts
        run: |
          set -e
          for chart_dir in helm/charts/*/ helm/edge/*/; do
            if [[ -f "$chart_dir/Chart.yaml" ]]; then
              echo "==> Linting $chart_dir"
              helm dependency update "$chart_dir" 2>/dev/null || true
              helm lint "$chart_dir"
            fi
          done

      # A parse inside `a && b` is exempt from set -e, so it is a command of its own.
      - name: Validate YAML syntax of ArgoCD manifests
        run: |
          set -e
          while IFS= read -r -d '' f; do
            python3 -c 'import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1])))' "$f"
            echo "OK: $f"
          done < <(find argocd -name '*.yaml' -type f -print0)

  # A job of its own, so a lint failure cannot hide these results.
  bats:
    name: bootstrap bats
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by commit; the runner image's own bats is whatever version it ships.
      - name: Checkout bats-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bats-core/bats-core
          ref: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
          path: .bats-core
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The bootstrap templates render through bootstrap/render_env.py, so a missing python3 fails here by name.
      - name: Run bootstrap/tests
        run: |
          command -v python3
          .bats-core/bin/bats --formatter tap bootstrap/tests/

      - name: Shellcheck bootstrap/tests
        run: shellcheck -S warning -s bash bootstrap/tests/*.bats

  # Registry reads need no secret: every image is public. DFE images are dfe-stack release-gate's, so --third-party-only
  # keeps them out. The `images` filter skips this job when nothing the check reads changed, and release.yml runs the same check before it tags.
  third-party-arch:
    name: third-party images carry amd64 and arm64
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' && needs.changes.outputs.images != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A venv outside the checkout, so no walk of the tree reaches its site-packages. The install is its own step because `uv run --with-requirements` does not check hashes.
      - name: Set up uv and the repo's Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: false

      # A python3 that is not the venv's would run every step below on the runner's own Python and still pass, so the version is checked first.
      - name: Install the pinned test dependencies, hashes required
        run: |
          uv pip install --require-hashes -r scripts/tests/requirements-ci.txt
          python3 -c 'import pathlib, sys; want = pathlib.Path(".python-version").read_text().strip(); have = "%d.%d" % sys.version_info[:2]; sys.exit(None if have == want else f"python3 is {have}, .python-version says {want}")'

      # --resolve-charts reads each chart's appVersion with helm.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # A digest-pinned image cannot change, so its verdict from an earlier run is not read
      # again. Each run saves under its own key and restores the newest one for the same pins.
      - name: Restore the proven image verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-arch-verdicts.json
          key: image-arch-verdicts-${{ hashFiles('versions.yaml', 'helm/charts/forgejo/values.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            image-arch-verdicts-${{ hashFiles('versions.yaml', 'helm/charts/forgejo/values.yaml') }}-
            image-arch-verdicts-

      - name: Every pinned third-party image ships linux/amd64 and linux/arm64
        id: gate
        run: python3 scripts/check_image_arch.py --third-party-only --resolve-charts --verdict-cache "${RUNNER_TEMP}/image-arch-verdicts.json" --seed scripts/image-arch-proven.json

      # Saved on a failed gate too: the file holds only the verdicts that passed.
      - name: Save the proven image verdicts
        if: ${{ !cancelled() && steps.gate.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-arch-verdicts.json
          key: image-arch-verdicts-${{ hashFiles('versions.yaml', 'helm/charts/forgejo/values.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The goldens render each thin chart on the one library _weave.py pins, so a chart published on another library still
  # passes them. This job renders the chart the registry serves, by its chart-digests pin. The pulls are anonymous:
  # _weave.py hands helm an empty registry config and Docker config.
  published-charts:
    name: published thin charts render as their goldens
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' && needs.changes.outputs.published != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A venv outside the checkout, so no walk of the tree reaches its site-packages. The install is its own step because `uv run --with-requirements` does not check hashes.
      - name: Set up uv and the repo's Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: false

      # A python3 that is not the venv's would run every step below on the runner's own Python and still pass, so the version is checked first.
      - name: Install the pinned test dependencies, hashes required
        run: |
          uv pip install --require-hashes -r scripts/tests/requirements-ci.txt
          python3 -c 'import pathlib, sys; want = pathlib.Path(".python-version").read_text().strip(); have = "%d.%d" % sys.version_info[:2]; sys.exit(None if have == want else f"python3 is {have}, .python-version says {want}")'

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # SHORTCUT: a push to main reports a difference without failing while main pins
      # charts that differ from their goldens. Drop continue-on-error once a push passes.
      - name: Each published thin chart renders as its golden
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          DFE_WEAVE_PUBLISHED: "1"
        run: python3 -m pytest scripts/tests/test_weave_published.py -q -p no:cacheprovider

  # Drift guard (#22): the dfe-deploy template's governance actions dial chart values by dot-path, so a chart renaming a
  # dial var would orphan an action. dfe-deploy's CI checks action structure and leaves the chart side here. The checkout
  # uses an App token scoped to dfe-deploy. A fork pull request is handed no secrets, so the job skips there.
  governance-drift:
    name: governance actions vs chart values
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A venv outside the checkout, so no walk of the tree reaches its site-packages. The install is its own step because `uv run --with-requirements` does not check hashes.
      - name: Set up uv and the repo's Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: false

      # A python3 that is not the venv's would run every step below on the runner's own Python and still pass, so the version is checked first.
      - name: Install the pinned test dependencies, hashes required
        run: |
          uv pip install --require-hashes -r scripts/tests/requirements-ci.txt
          python3 -c 'import pathlib, sys; want = pathlib.Path(".python-version").read_text().strip(); have = "%d.%d" % sys.version_info[:2]; sys.exit(None if have == want else f"python3 is {have}, .python-version says {want}")'

      - name: Mint a dfe-deploy read token
        id: deploy-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dfe-deploy
          permission-contents: read

      - name: Checkout dfe-deploy template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperi-io/dfe-deploy
          token: ${{ steps.deploy-token.outputs.token }}
          path: .dfe-deploy
          persist-credentials: false

      - name: Governance drift check
        run: python3 scripts/check_governance_drift.py --deploy-root .dfe-deploy --require

      # The drift check above sees a key, not the keys beside it. This renders the thin path with each action applied and
      # fails on a pod left reading a Secret the action stopped minting.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Governance actions render without an orphaned Secret
        env:
          DFE_DEPLOY_ROOT: .dfe-deploy
        run: python3 -m pytest scripts/tests/test_governance_actions.py -q -p no:cacheprovider
