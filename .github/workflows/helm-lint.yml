# Lints all Helm charts on every PR and push to main.
name: Helm Lint

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'argocd/**'
      - 'bootstrap/**'
      - 'versions.yaml'
      - 'deployment.example.yaml'
      - 'constraints/**'
      - 'scripts/check_versions_drift.py'
      - 'scripts/check_governance_drift.py'
      - 'scripts/check_namespace_drift.py'
      - 'scripts/check_submodule_drift.py'
      - 'scripts/check_suite_drift.py'
      - 'scripts/suite_graph.py'
      - 'suite.yaml'
      - 'docs/suite-graph.md'
      - 'scripts/tests/**'
      - 'scripts/dfe-stack'
      - 'scripts/dfe-ops'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    paths:
      - 'helm/**'
      - 'argocd/**'
      - 'bootstrap/**'
      - 'versions.yaml'
      - 'deployment.example.yaml'
      - 'constraints/**'
      - 'scripts/check_versions_drift.py'
      - 'scripts/check_governance_drift.py'
      - 'scripts/check_namespace_drift.py'
      - 'scripts/check_submodule_drift.py'
      - 'scripts/check_suite_drift.py'
      - 'scripts/suite_graph.py'
      - 'suite.yaml'
      - 'docs/suite-graph.md'
      - 'scripts/tests/**'
      - 'scripts/dfe-stack'
      - 'scripts/dfe-ops'
      - '.github/workflows/helm-lint.yml'
  # A push made with GITHUB_TOKEN triggers no workflow, so the propagate job's
  # write-back leaves its own head commit unchecked. workflow_dispatch is the
  # documented exception to that rule and is how it asks for this run.
  workflow_dispatch:

jobs:
  lint:
    name: helm lint + yaml validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs first: a drift check whose patterns have stopped matching prints
      # the same OK as one that is working.
      - name: Drift-check failure paths
        run: python3 scripts/tests/test_check_versions_drift.py

      # Ties renovate.json's customManager regex to versions.yaml: a manager
      # that matches nothing proposes nothing and reports no error.
      - name: SSoT annotation + Renovate manager contract
        run: python3 scripts/tests/test_dfe_stack.py

      # The suite.yaml reader is a hand-written subset parser: a shape it
      # cannot read fails here before it fails inside a tool.
      - name: suite.yaml reader and queries
        run: python3 scripts/tests/test_suite_graph.py

      # A drift check that has stopped matching prints the same OK as one
      # that is working, so each of its verdicts gets a case that produces it.
      - name: Suite drift check failure paths
        run: python3 scripts/tests/test_check_suite_drift.py

      - name: Terraform-output reader
        run: python3 scripts/tests/test_bridge.py

      # A namespaceSelector naming an absent namespace matches nothing and
      # raises no error (#136), so the guard's failure paths run first.
      - name: Namespace drift failure paths
        run: python3 scripts/tests/test_check_namespace_drift.py

      - name: Version drift check (versions.yaml is SSoT)
        run: python3 scripts/check_versions_drift.py

      - name: Namespace drift check (common.yaml is SSoT)
        run: python3 scripts/check_namespace_drift.py

      # Cross-repo citations are SKIPPED on this bare checkout and said so;
      # the in-repo half (structure, charts, pins, the docs diagrams) is
      # binding. --strict belongs to an operator run with the member clones
      # on disk, which a runner does not have.
      - name: Suite graph drift check (suite.yaml is SSoT)
        run: python3 scripts/check_suite_drift.py

      # Renovate raises the submodule bump; nothing stops one repo sitting on it.
      - name: Shared-submodule drift check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_submodule_drift.py

      # Omitting `--strict` is what makes rule violations advisory; the release
      # workflow runs it strict. No `|| true`: that also swallows the structural
      # exits -- a missing constraints file, or one declaring a different stack.
      - name: Stack compatibility check (advisory)
        run: python3 scripts/dfe-stack compat-check

      # dfe-ops is the CLI every deploy, verify, teardown and cycle runs
      # through, and has no extension, so no glob elsewhere ever compiles it.
      - name: dfe-ops compiles
        run: python3 -m py_compile scripts/dfe-ops

      # A refresh that annotated but has not synced would otherwise pass the
      # readiness gate against the pods the previous revision left behind.
      - name: refresh waits for its sync and refuses a namespace-less smoke run
        run: python3 scripts/tests/test_dfe_ops_refresh.py

      # The gate decides whether a deploy is declared up, and both of its ways
      # of being wrong (a 5h-old restart count, another distribution's
      # namespaces) fail a healthy deploy.
      - name: Readiness gate judges the deploy's own namespaces
        run: python3 scripts/tests/test_readiness_gate.py

      # A hostname is the overlay's to choose, so the summary reads its
      # endpoints off the live HTTPRoutes rather than composing them.
      - name: Access summary reads the live routes and this deploy's Gateway
        run: python3 scripts/tests/test_access_summary.py

      # A wrong dex connector does not crash: it authenticates and returns an
      # empty groups claim, so the RBAC chain the fixture exists to prove is
      # never exercised. The render is the only place that is caught.
      - name: Tester IdP renders a dex that emits groups, with no secret in the values
        run: python3 scripts/tests/test_tester_idp.py

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "4.2.3"

      # An over-wide egress policy renders green and passes a dry-run, so the
      # derived external-service egress is checked by set equality per mode.
      - name: External-service egress derives per mode
        run: python3 scripts/tests/test_external_egress.py

      # storageModel=local must stay a no-op, and the deploy-repo overlay must
      # keep beating the profile file -- the ordering nothing else asserts.
      - name: Storage model renders and the cascade holds
        run: python3 scripts/tests/test_storage_model.py

      # An issuer-only OIDC policy and a 443 egress rule both render green and
      # then fail at admission or drop every packet (#222, #223).
      - name: Gateway OIDC and gateway egress render the working shape
        run: python3 scripts/tests/test_gateway_oidc.py

      # versions.yaml pinning tag@sha256 is worth nothing if the chart renders a
      # bare tag, and a bare tag is mutable.
      - name: Rendered images carry the pinned digest
        run: python3 scripts/tests/test_image_digest_pin.py

      # The hunt runner read its hunts off an emptyDir nothing wrote for 42
      # hours while the pod stayed Running (#212), so the paths and the volume
      # are asserted rather than the sidecar's presence.
      - name: Hunt runner reads hunts off the synced deploy repo
        run: python3 scripts/tests/test_hunt_runner_gitsync.py

      - name: Lint library charts via test charts
        run: |
          set -e
          for test_dir in helm/library/*/tests/lint-test/; do
            echo "==> Linting via $test_dir"
            helm dependency update "$test_dir"
            helm lint "$test_dir"
          done

      - name: Lint application charts
        run: |
          set -e
          for chart_dir in helm/charts/*/; do
            if [[ -f "$chart_dir/Chart.yaml" ]]; then
              echo "==> Linting $chart_dir"
              helm dependency update "$chart_dir" 2>/dev/null || true
              helm lint "$chart_dir"
            fi
          done

      - name: Validate YAML syntax of ArgoCD manifests
        run: |
          set -e
          for f in $(find argocd -name '*.yaml' -type f); do
            python3 -c "import yaml,sys; list(yaml.safe_load_all(open('$f')))" && echo "OK: $f"
          done

  # Drift guard (#22): the dfe-deploy template's governance actions dial chart
  # values by dot-path; a chart renaming a dial var would orphan an action
  # silently. dfe-deploy's own CI validates action STRUCTURE and leaves the
  # chart side to us. dfe-deploy is PRIVATE, so this needs a repo secret
  # DFE_DEPLOY_TOKEN (read access to hyperi-io/dfe-deploy); without it the job
  # reports a LOUD skip rather than a silent green.
  governance-drift:
    name: governance actions vs chart values
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.DFE_DEPLOY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout dfe-deploy template
        if: env.HAS_DEPLOY_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperi-io/dfe-deploy
          token: ${{ secrets.DFE_DEPLOY_TOKEN }}
          path: .dfe-deploy

      - name: Governance drift check
        if: env.HAS_DEPLOY_TOKEN == 'true'
        run: python3 scripts/check_governance_drift.py --deploy-root .dfe-deploy --require

      - name: Governance drift check SKIPPED
        if: env.HAS_DEPLOY_TOKEN != 'true'
        run: echo "::warning::governance drift NOT checked -- no DFE_DEPLOY_TOKEN secret (needs read on hyperi-io/dfe-deploy)"
