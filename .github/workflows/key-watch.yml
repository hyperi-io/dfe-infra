# Weekly check of the toolbox's pinned signing keys and the upstream fix the gen-8 instance hold waits on
# (scripts/check_signing_keys.py). A failed run is the notice.
name: Key Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * 0"

permissions:
  contents: read

jobs:
  watch:
    name: signing keys and upstream holds
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check keys and holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_signing_keys.py --online
