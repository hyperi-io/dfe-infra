# Renovate edits versions.yaml (the SSoT) and nothing else -- it cannot reach
# the appset pins, the Chart.yaml appVersions or the bare `version:` keys, so it
# could only ever move one mirror of a key that has up to three. This job
# re-resolves the digests, propagates the SSoT across every mirror, runs the
# drift check, and pushes the result back onto Renovate's own branch so the PR
# arrives green.
#
# Runs on PUSH, not pull_request: a pull_request run from a bot gets a read-only
# token and cannot push. Renovate pushes its branches to this repo (never a
# fork), so a push trigger is same-repo and the token is writable.
name: Renovate propagate

on:
  push:
    branches:
      - 'renovate/**'

# Least privilege: write the branch, read packages so ghcr digests resolve,
# dispatch so the checks this job's own push cannot trigger get asked for.
permissions:
  contents: write
  packages: read
  actions: write
  statuses: write

concurrency:
  group: renovate-propagate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  propagate:
    name: propagate versions.yaml to the pin mirrors
    # A named runner image, so a move of the ubuntu-latest label cannot swap the python3 and tools these steps run on.
    runs-on: ubuntu-24.04
    # Only Renovate's own pushes -- a human pushing a renovate/** branch keeps
    # their commit unaltered.
    if: github.actor == 'renovate[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Anonymous ghcr pulls are rate-limited and can fail outright; the token
      # this job already holds removes that as a failure mode.
      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before the propagation: refresh-digests writes versions.yaml only, so a
      # digest it moves reaches the chart copies that read it only through --fix.
      - name: Re-resolve third-party digests
        run: python3 scripts/dfe-stack refresh-digests

      # Refuses rather than guessing when a pattern stops matching, so a chart
      # that changed shape is never written at a guessed offset. A refusal still
      # reaches the drift check below, which is the gate and what gets reported.
      - name: Propagate the SSoT into every mirror
        continue-on-error: true
        run: python3 scripts/check_versions_drift.py --fix

      - name: Check every mirror against the SSoT
        id: drift
        continue-on-error: true
        run: python3 scripts/check_versions_drift.py

      - name: Push the propagation back onto the branch
        id: push
        if: steps.drift.outcome == 'success'
        run: |
          set -euo pipefail
          # Explicit paths, never `git add -A`: this job runs on a bot's branch
          # with a writable token, so it commits only what the propagator owns.
          git add -- versions.yaml helm argocd bootstrap terraform
          if git diff --cached --quiet; then
            echo "SSoT and mirrors already agree; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): propagate versions.yaml to the pin mirrors" \
            -m "Renovate edits the SSoT; the mirrors are generated. See scripts/check_versions_drift.py --fix."
          # Explicit refspec rather than relying on checkout leaving a tracking
          # branch -- a detached HEAD would otherwise fail only at this step.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A workflow_dispatch run does not attach to the PR, so a commit status is
      # the only verdict from this job the PR shows. It carries the drift check's
      # own exit, on the commit the branch now points at: the propagation when
      # one was pushed, Renovate's commit otherwise.
      - name: Report the drift check on the branch head
        if: steps.drift.outcome == 'success' || steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          set -euo pipefail
          if [ "${DRIFT_OUTCOME}" = "success" ]; then
            state=success
            description="SSoT propagated to every mirror; drift check passed"
          else
            state=failure
            description="Drift check failed after propagation; nothing was pushed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            --method POST \
            -f state="${state}" \
            -f context="pin propagation" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # The pull_request run for a bot-authored commit lands in `action_required`
      # and waits for a human, so the branch would otherwise go unverified until
      # someone noticed. workflow_dispatch is not gated that way.
      - name: Ask for the checks the bot push cannot trigger
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run helm-lint.yml --ref "${GITHUB_REF_NAME}"

      - name: Fail the run when drift remains
        if: steps.drift.outcome == 'failure'
        run: |
          echo "::error::check_versions_drift.py failed after propagation; see its step above."
          exit 1
