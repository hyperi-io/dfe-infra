# Re-resolves digests, propagates versions.yaml into every pin mirror, runs the drift check and pushes the result
# onto Renovate's branch so its PR arrives passing. docs/ci-maintenance-design.md, "CI workflows".
name: Renovate propagate

on:
  push:
    branches:
      - 'renovate/**'

# The push uses the App token, which these scopes do not govern. statuses: write is the commit status.
permissions:
  contents: read
  statuses: write

concurrency:
  group: renovate-propagate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  propagate:
    name: propagate versions.yaml to the pin mirrors
    runs-on: ubuntu-26.04
    # Only Renovate's own pushes -- a human pushing a renovate/** branch keeps
    # their commit unaltered.
    if: github.actor == 'renovate[bot]'
    steps:
      # contents:write on this repo alone, since the propagation commit is all it pushes.
      - name: Mint a dfe-infra write token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Full history, for the stack tags refresh-digests checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Before the propagation: refresh-digests writes versions.yaml only, so --fix carries a moved digest to the chart copies.
      - name: Re-resolve third-party digests
        run: python3 scripts/dfe-stack refresh-digests --skip-released

      # A refusal (a pattern that stopped matching) still reaches the drift check below, which is the gate.
      - name: Propagate the SSoT into every mirror
        continue-on-error: true
        run: python3 scripts/check_versions_drift.py --fix

      - name: Check every mirror against the SSoT
        id: drift
        continue-on-error: true
        run: python3 scripts/check_versions_drift.py

      - name: Push the propagation back onto the branch
        if: steps.drift.outcome == 'success'
        run: |
          set -euo pipefail
          # Explicit paths, never `git add -A`: this job runs on a bot's branch
          # with a writable token, so it commits only what the propagator owns.
          git add -- versions.yaml helm argocd bootstrap terraform
          if git diff --cached --quiet; then
            echo "SSoT and mirrors already agree; nothing to push."
            exit 0
          fi
          # renovate.json's gitIgnoredAuthors names this author, so Renovate keeps rebasing the branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): propagate versions.yaml to the pin mirrors" \
            -m "Renovate edits the SSoT; the mirrors are generated. See scripts/check_versions_drift.py --fix."
          # Explicit refspec rather than relying on checkout leaving a tracking
          # branch -- a detached HEAD would otherwise fail only at this step.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # A commit status, because this run's own check sits on Renovate's commit and a propagation push replaces it as the PR head.
      - name: Report the drift check on the branch head
        if: steps.drift.outcome == 'success' || steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          set -euo pipefail
          if [ "${DRIFT_OUTCOME}" = "success" ]; then
            state=success
            description="SSoT propagated to every mirror; drift check passed"
          else
            state=failure
            description="Drift check failed after propagation; nothing was pushed"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            --method POST \
            -f state="${state}" \
            -f context="pin propagation" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail the run when drift remains
        if: steps.drift.outcome == 'failure'
        run: |
          echo "::error::check_versions_drift.py failed after propagation; see its step above."
          exit 1
