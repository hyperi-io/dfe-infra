## Project:   dfe-infra
## File:      upgrade-order.yaml
## Purpose:   The order a stack upgrade applies in, as data
## Language:  YAML
##
## License:   BUSL-1.1
## Copyright: (c) 2026 HYPERI PTY LIMITED

## A stack bump is a diff of versions.yaml applied in THIS order, never in the
## order the file happens to list things. The bootstrap stage moves first
## because ESO and cert-manager gate every secret and certificate below them;
## operators next, because their CRDs gate everything they own, and a
## stored-version conversion has to run BEFORE the operator that drops the old
## version starts; data services next, coordinators before the stores that
## depend on them; apps last.
##
## `key` is the versions.yaml path inside the current stack block. `image` and
## `chart` name the component's image digest and thin-chart digest, which move
## with `key` as one component, so a digest that moves under an unchanged tag
## still moves the step. Maps keyed
## by a two-digit order, never lists: the repo's stdlib YAML reader handles
## nested maps and scalars only. `before` names a step that must complete on
## the RUNNING cluster before the version moves; `finalise` names the one-way
## step held back for a soak after the roll; `pair` names the key that moves
## with this one as a single change; `rollback` names the reverse path when
## one exists, or the literal `none` when the step cannot be undone (a
## one-way step also carrying `finalise` is `none` by definition and does not
## need to repeat it -- `dfe-ops upgrade rollback` refuses by name either way).

stages:
  "10-bootstrap":
    "10-external-secrets":
      key: bootstrap.external-secrets
    "20-cert-manager":
      key: bootstrap.cert-manager
    "30-argocd":
      key: bootstrap.argocd
  "20-operators":
    "10-envoy-gateway":
      key: operators.envoy-gateway
    "20-external-dns":
      key: operators.external-dns
    "30-keda":
      key: operators.keda
    "50-strimzi-kafka-operator":
      key: operators.strimzi-kafka-operator
      before: "Strimzi stored-version conversion on the running cluster, with the RUNNING release's tool: bin/v1-api-conversion.sh convert-resource --all-namespaces, then bin/v1-api-conversion.sh crd-upgrade"
    "60-redpanda-operator":
      key: operators.redpanda-operator
      pair: services.redpanda-version
    "70-clickhouse-operator":
      key: operators.clickhouse-operator
  "30-services":
    "10-postgresql":
      key: services.postgresql
    "20-clickhouse-keeper":
      key: services.clickhouse-version
      scope: keeper
    "30-clickhouse-server":
      key: services.clickhouse-version
      scope: server
      rollback: "within the same LTS line only"
    "40-kafka-brokers":
      key: services.kafka-version
      finalise: "metadata.version bump after a soak (apply --finalise drops the kafka.metadataVersion hold); one way"
      rollback: "none"
    "50-redpanda-brokers":
      key: services.redpanda-version
      pair: operators.redpanda-operator
    "60-otel-collector":
      key: services.otel-collector
  "40-apps":
    "10-dfe-engine":
      key: apps.dfe-engine
      image: digests.dfe-engine
      chart: chart-digests.dfe-engine
    ## After dfe-engine: HyperDX verifies the engine's JWT against the engine's JWKS.
    "15-dfe-hyperdx":
      key: content.dfe-hyperdx
      image: digests.dfe-hyperdx
      chart: chart-digests.hyperdx
    "20-dfe-receiver":
      key: apps.dfe-receiver
      image: digests.dfe-receiver
      chart: chart-digests.dfe-receiver
    "30-dfe-transform-vrl":
      key: apps.dfe-transform-vrl
      image: digests.dfe-transform-vrl
      chart: chart-digests.dfe-transform-vrl
    "40-dfe-transform-vector":
      key: apps.dfe-transform-vector
      image: digests.dfe-transform-vector
      chart: chart-digests.dfe-transform-vector
    "45-dfe-transform-elastic":
      key: apps.dfe-transform-elastic
      image: digests.dfe-transform-elastic
      chart: chart-digests.dfe-transform-elastic
    "50-dfe-loader":
      key: apps.dfe-loader
      image: digests.dfe-loader
      chart: chart-digests.dfe-loader
    "60-dfe-archiver":
      key: apps.dfe-archiver
      image: digests.dfe-archiver
      chart: chart-digests.dfe-archiver
    "70-dfe-fetcher":
      key: apps.dfe-fetcher
      image: digests.dfe-fetcher
      chart: chart-digests.dfe-fetcher
    "80-dfe-ui":
      key: apps.dfe-ui
      image: digests.dfe-ui
      chart: chart-digests.dfe-ui
    "90-culvert":
      key: apps.culvert
      image: digests.culvert
      chart: chart-digests.culvert
