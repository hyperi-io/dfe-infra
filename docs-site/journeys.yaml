# docs-site/journeys.yaml -- the sidebar: four reader journeys, each a run of
# sections, and the section every published page sits in. Pages keep their URLs.
# scripts/aggregate.py checks it and hands it to docusaurus.config.js through
# content/site.json. Nested maps and quoted scalars only (scripts/yaml_subset.py).

# Journeys and their sections, in sidebar order. A section no page lands in is
# left out of the sidebar.
sidebar:
  Evaluate:
    How DFE fits together: ""
    Try the demo: ""
    Try a local working copy: ""
    Elastic Beats alongside or swapped: ""
    AWS logs through the fetcher: ""
  Deploy:
    Choose a target: ""
    Docker: ""
    Kubernetes on-prem: ""
    AWS: ""
    Kafka choices: ""
    Exposure and access: ""
    Remote access (culvert, optional): ""
    The deploy repo: ""
  Operate:
    Sources: ""
    Transforms: ""
    Detections and hunts: ""
    Users and OIDC: ""
    The console: ""
    Monitoring: ""
    Scaling: ""
    Day to day and troubleshooting: ""
    Upgrade: ""
    Archiving: ""
  Reference:
    Configuration: ""
    HTTP API: ""
    Query API: ""
    Schemas: ""
    The event header: ""
    Metrics: ""
    ClickHouse: ""
    Fetcher: ""
    Kafka client settings: ""
    Alert webhooks: ""
    Security: ""

# Where each page sits: member (or content-root, the suite's own pages) -> a path
# under its docs/ -> "Journey / Section". A path ending in / covers a directory,
# `default` covers every page nothing longer matches, and "" puts a page at the
# top of the sidebar, above the journeys. Every member that publishes a page needs
# a default.
placement:
