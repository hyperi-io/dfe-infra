# The landing page's words. src/pages/index.js and src/components/landing/ lay them out.
# {name} is filled per build: stack, version, newest, release_notes, api_path. A card whose
# link fills to nothing is left out. In prose, `code` and [text](link) are rendered.
# Every claim is checkable on the page its card links to.

description: "How to run the Data Fusion Engine: quickstarts, deployment guides and the reference for every part of the suite."

hero:
  eyebrow: "DFE {version} documentation"
  title: Data Fusion
  accent: Engine
  tagline: Land it. Use it. Scale it.
  lead: "What you used Splunk, Elastic and a lakehouse for, without the limitations. Your data works the day it lands, months of it stay usable, and you tune only what pays, on your own infrastructure."
  actions:
    - {label: Get started, to: /quickstart/, primary: true}
    - {label: "What's different", to: /coming-from/}
    - {label: Install, to: /dfe-infra/deployment/}
  badges:
    - {label: Every field lands on day one, to: "/coming-from/#nothing-breaks-when-a-source-changes"}
    - {label: Months queryable, not days, to: "/coming-from/#stored-as-clickhouse-columns"}
    - {label: Open at every joint, to: "/coming-from/#open-at-every-joint"}
    - {label: Multi-tenant by default, to: "/coming-from/#multi-tenant-by-default-with-visibility-control"}
    - {label: "Kubernetes, Docker and cloud", to: /quickstart/}
    - {label: Open source, href: "https://github.com/hyperi-io"}

differences:
  eyebrow: Key differences
  title: What DFE does differently
  lead: Coming from Splunk, Elastic or a lakehouse? Read these first.
  link: {label: Coming from Splunk or Elastic, to: /coming-from/}
  cards:
    - eyebrow: Ingest
      title: Nothing breaks when a source changes
      text: Every field lands and works from day one, with no data contract to police upstream. Then you spend schema effort only where it pays you back.
      to: /coming-from/#nothing-breaks-when-a-source-changes
    - eyebrow: Efficiency
      title: No raw copy by default
      text: A second copy of every record doubles what Kafka, the loader, ClickHouse and the archive write and read. DFE parses at the edge and keeps `_raw` only where you turn it on.
      to: /coming-from/#the-original-bytes-are-off-by-default
    - eyebrow: Integration
      title: Open at every joint
      text: Loosely coupled parts with a standard protocol at each joint. Vector, Fluentd, the OpenTelemetry Collector, any Kafka, ClickHouse Cloud and your own secrets store each plug in at their joint.
      to: /coming-from/#open-at-every-joint
    - eyebrow: Storage
      title: Months queryable, not days
      text: Each source lands as ClickHouse columns, with no index built over every byte. More days stay queryable on the same hardware.
      to: /coming-from/#stored-as-clickhouse-columns
    - eyebrow: Queries
      title: Sources join
      text: Fact tables for the observability data, dimension tables for the context, joined in SQL. Ask which devices in your inventory stopped reporting, in one query.
      to: /coming-from/#sources-join
    - eyebrow: Config
      title: GitOps by design
      text: Console and API changes are commits to your deploy repo. You get history, review and a git revert to undo.
      to: /coming-from/#gitops-by-design-from-the-ground-up

    - eyebrow: Access
      title: Multi-tenant by default
      text: Every record carries an `_org_id`, for customer isolation and flexible visibility splits by unit, region or team. The console's ClickHouse role filters every search to the viewer's organisation.
      to: /coming-from/#multi-tenant-by-default-with-visibility-control
    - eyebrow: Parsing
      title: Parsed once, at the edge
      text: The receiver and fetcher parse as data arrives, so no search pays to extract fields again.
      to: /coming-from/#parsed-once-at-the-edge
    - eyebrow: Deployment
      title: Runs on your infrastructure
      text: Your data centre or your own cloud account, from one box to a cluster, with the same images and config model.
      to: /coming-from/#it-runs-on-your-infrastructure

whats_new:
  eyebrow: Updates
  title: "What's new"
  link: {label: All releases, href: "https://github.com/hyperi-io/dfe-infra/releases"}
  cards:
    - eyebrow: Latest release
      title: "DFE {newest}"
      text: What changed in this release, from the dfe-infra release notes.
      action: Release notes
      href: "{release_notes}"
    - eyebrow: Deploy
      title: DFE on AWS
      text: OpenTofu builds EKS on Graviton, with Kafka from Amazon MSK, Confluent Cloud or Redpanda Cloud. From there it's the same bootstrap as any other cluster.
      action: Read the guide
      to: /dfe-infra/deployment/aws/
    - eyebrow: Reference
      title: HTTP API reference
      text: Every dfe-engine endpoint, generated from the OpenAPI spec this release ships.
      action: Browse the API
      to: "{api_path}"

capabilities:
  eyebrow: Capabilities
  title: What the suite does
  cards:
    - icon: ingest
      eyebrow: Ingest
      title: Your shippers, one edge
      text: dfe-receiver speaks each agent's own protocol, so your shippers send as they are. Everything leaves it as JSON.
      chips: [Elastic Beats, OpenTelemetry, Syslog, Webhooks]
      to: /dfe-receiver/architecture/
    - icon: routing
      eyebrow: Routing
      title: Define a source once
      text: You define a source once, with its routing, schema and detections. The receiver, the loader and the hunt runner all read that one definition.
      chips: [Sources, Kafka topics, Schemas]
      to: /dfe-engine/data-plane/source/
    - icon: storage
      eyebrow: Storage
      title: Into ClickHouse
      text: dfe-loader writes batches to ClickHouse as RowBinary, so ClickHouse doesn't parse them again. Delivery from Kafka is at-least-once.
      chips: [ClickHouse, RowBinary, Dead-letter queue]
      to: /dfe-loader/
    - icon: hunting
      eyebrow: Hunting
      title: Rules and scheduled hunts
      text: A rule is a SQL query on a source. A hunt runs rules on a schedule and writes matches to the alerts table.
      chips: [SQL rules, Hunts, Alerts]
      to: /dfe-engine/data-plane/source-detections/
    - icon: observability
      eyebrow: Observability
      title: The stack reports on itself
      text: Every service sends its own logs and metrics over OpenTelemetry, so the console shows the stack's health before your first event arrives.
      chips: [OpenTelemetry, DFE console, /livez /readyz /metrics]
      to: /dfe-docker/observability/

deploy:
  eyebrow: Deploy
  title: Where it runs
  lead: Docker on one host. Kubernetes when it has to scale, on your own cluster or on EKS. Same images and config model on all three.
  action: Quickstart
  cards:
    - icon: host
      eyebrow: dfe-docker
      title: Docker Compose
      text: One host. A laptop, a demo box or a proof of concept.
      to: /quickstart/docker/
    - icon: cluster
      eyebrow: dfe-infra
      title: Kubernetes on-premises
      text: Your cluster, Kubernetes 1.35 or later. We test on RKE2, but the charts don't need any particular distribution.
      to: /quickstart/kubernetes/
    - icon: cloud
      eyebrow: dfe-infra
      title: Amazon EKS
      text: OpenTofu builds it on Graviton. Kafka comes from Amazon MSK, Confluent Cloud or Redpanda Cloud.
      to: /quickstart/aws/

closing:
  title: Start with the demo
  lead: One host with Docker. Live firewall syslog comes in, and each vendor's lines land parsed in their own ClickHouse table.
  actions:
    - {label: Run the demo, to: /quickstart/demo/, primary: true}
    - {label: Source on GitHub, href: "https://github.com/hyperi-io"}

# Each command must match the source named beside it, and the matching page under
# content-root/quickstart/.
quickstart:
  eyebrow: Quickstart
  title: Stand DFE up
  tabs:
    - value: demo
      label: Demo
      blocks:
        - text: "Needs Docker, Python 3 and [uv](https://docs.astral.sh/uv/)."
        # dfe-docker Makefile targets init, stack, up and demo. The profile names are service_profiles.yaml's.
        - code: |-
            git clone https://github.com/hyperi-io/dfe-docker && cd dfe-docker
            make init
            make stack VERSION={stack}
            echo 'DFE_PROFILE=single-kafka' >> .env
            make up
            make demo
        - text: "Then open the console. `make demo-stop` ends it."
      guide: {label: The demo, to: /quickstart/demo/}
    - value: docker
      label: Docker
      blocks:
        - text: "Needs Docker and Python 3."
        - code: |-
            git clone https://github.com/hyperi-io/dfe-docker && cd dfe-docker
            make init
            make stack VERSION={stack}
            echo 'DFE_PROFILE=slim-grpc' >> .env
            make up
        - text: "Then send it an event:"
        # dfe-docker docs/evaluating.md, "Seeing your own data go through".
        - code: |-
            curl -X POST http://localhost:8080/ingest \
              -H 'Content-Type: application/json' \
              -d '{"_source":"main","message":"hello dfe"}'
      guide: {label: Docker quickstart, to: /quickstart/docker/}
    - value: kubernetes
      label: Kubernetes
      blocks:
        - text: "Needs Kubernetes 1.35+ and `kubectl`. Set `DFE_DOMAIN` and `DFE_REPO_URL` in the env file first."
        # bootstrap/local.env.example and scripts/dfe-ops preflight, stack-deploy.
        - code: |-
            git clone --branch {stack} https://github.com/hyperi-io/dfe-infra && cd dfe-infra
            (umask 077 && cp bootstrap/local.env.example bootstrap/local.env)
            python3 scripts/dfe-ops preflight --mode single --env-file bootstrap/local.env
            python3 scripts/dfe-ops stack-deploy --stack {stack} --mode single \
              --target-revision {stack} --env-file bootstrap/local.env
        - text: "It ends by checking an event reaches ClickHouse."
      guide: {label: Kubernetes on-premises quickstart, to: /quickstart/kubernetes/}
    - value: aws
      label: AWS
      blocks:
        - text: "Needs AWS credentials, OpenTofu and `kubectl`. Answer the wizard: aws, `scale`, and your Kafka."
        # dfe-infra docs/deployment/wizard.md, then docs/deployment/aws.md "Resolving sizing artefacts".
        - code: |-
            python3 scripts/dfe-ops init
            python3 scripts/resolve_sizing.py --dial deployment.yaml --live \
              --out terraform/environments/aws
            python3 scripts/render_dial.py --tofu
        - text: "Then build and deploy:"
        # dfe-infra docs/deployment/aws.md, "Applying the plan".
        - code: |-
            (cd terraform/environments/aws && tofu init \
              && tofu plan -out=deployment.tfplan && tofu apply deployment.tfplan)
            eval "$(tofu -chdir=terraform/environments/aws output -raw kubeconfig_command)"
            python3 scripts/dfe-ops stack-deploy --stack {stack} --mode scale \
              --from-terraform terraform/environments/aws
      guide: {label: AWS quickstart, to: /quickstart/aws/}
