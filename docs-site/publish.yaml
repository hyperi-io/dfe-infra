# docs-site/publish.yaml -- what the docs site leaves out and where it mounts a
# member, on top of the stacks versions.yaml releases and the members suite.yaml
# lists. scripts/aggregate.py reads it with scripts/yaml_subset.py, so it holds
# nested maps and quoted scalars only: no lists, no flow collections.

# Released stacks the site does not build: no version menu entry, no tree under
# /v/<stack>/. Each maps to the reason.
dropped_versions:
  2.2.0: "superseded by 2.2.1"

# A member whose docs mount inside another member's section rather than at the
# top of the sidebar: member -> the member it mounts under. The parent mounts at
# the top level itself, and a member its parent does not reach falls back to the
# top level.
mount_under:
  dfe-hyperdx: "dfe-ui"

# Pages for the people who build, test and release DFE rather than for an
# organisation running it: process pages, and the components' developer docs,
# which stay in their repos. member -> a path under its docs/ -> why it stays
# off the site. A path ending in / covers the whole directory. The file stays in
# its repo, and a published page linking to it links to GitHub instead. `all-pages` keeps
# a member's whole docs/ off the site.
internal:
  clickhouse-dfe:
    all-pages: "a library's developer docs"
  culvert:
