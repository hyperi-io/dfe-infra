# docs-site/gate.yaml -- the phrases scripts/gate.py reports on a published page.
# Each section maps a phrase to what to write instead. A phrase matches whole
# words, case-insensitively, in prose only: code blocks, inline code, link
# targets, HTML comments and maths are never read. Nested maps and quoted scalars
# only (scripts/yaml_subset.py).

# Notes to self and the working process, which never belong on a published page.
process:
  to be proven: "state what is proven, or leave the claim out"
  each card links to: "delete: the page shows it"
  workstream: "describe the product, not the work that built it"
  the lead: "describe the product, not who coordinated the work"
  subagent: "describe the product, not how it was written"
  this session: "describe the product, not the session"
  TODO.md: "link the tracking issue, or leave it out"
  not written yet: "write it, or remove the page"
  coming soon: "write it, or remove the page"
  to be written: "write it, or remove the page"

# Hedges in front of a fact.
hedge:
  should work: "say what is checked, or what it does"
  is expected to: "say what it does"
  it may be the case: "state the fact"
  one could argue: "state the position"
  we believe: "state the fact and its evidence"

# Words the house style replaces with the plain claim. Left out on purpose:
# ensure, navigate, underscore, highlight, space and enable, whose plain senses run
# through operator docs (disk space, enable a feature).
register:
  seam: "name the boundary: where one part hands over to the other"
  substrate: "name the layer: distro, cluster, broker, datastore, CNI, nodes"
  load-bearing: "say what breaks"
  wall clock: "actual time, real time, elapsed time"
  simply: "delete: the sentence means the same without it"
  merely: "delete: the sentence means the same without it"
  obviously: "delete: the sentence means the same without it"
  trivially: "delete: the sentence means the same without it"
  effectively: "delete, or say what it actually does"
  essentially: "delete, or say what it actually does"
  genuine: "delete"
  genuinely: "delete"
  first-class: "say what it supports"
  battle-tested: "say what it has survived"
  footgun: "name what breaks and how far it reaches"
  blast radius: "name what breaks and how far it reaches"
  north star: "say the goal"
  paper over: "say what is left unfixed"
  serves as: "is, does"
  the following: "delete, and write the thing"
  leverage: "use"
  leverages: "uses"
  leveraging: "using"
  utilise: "use"
  utilize: "use"
  robust: "say what it withstands"
  seamless: "say what the reader does not have to do"
  seamlessly: "say what the reader does not have to do"
  crucial: "say what breaks without it"
  pivotal: "say what breaks without it"
  vital: "say what breaks without it"
  delve: "say it, or read / look at"
  dive into: "say it, or read / look at"
  deep dive: "say it, or read / look at"
  a testament to: "delete, and state the evidence"
  landscape: "name the thing"
  realm: "name the thing"
  world of: "name the thing"
  unlock: "say what it now does"
  unlocks: "say what it now does"
  empower: "say what it now does"
  elevate: "say what it now does"
  supercharge: "say what it now does"
  boasts: "has, does"
  offers up: "has, does"
  brings to the table: "has, does"
  it is worth noting: "delete, and note it"
  it is important to note: "delete, and note it"
  in today's world: "delete"
  in the modern era: "delete"
  game-changer: "say the measured difference"
  revolutionary: "say the measured difference"
  cutting-edge: "say the measured difference"
  holistic: "say what it covers"
  comprehensive: "say what it covers"
  end-to-end: "say what it covers"
  foster: "say the mechanism"
  facilitate: "say the mechanism"
  posture: "use the term the context needs"
