  # Most keys stay where they were: dfe-extras renders the hunt runner, the keda
  # shim, the minted Secrets, the app catalogue and dfe-engine-env from them.
  dfe-engine:
    chart: helm/charts/dfe-engine
    keys:
      project:
        to: project
        note: >-
          dfe-extras names its objects from it. The thin chart's own name is
          fullnameOverride, see component.
      component:
        to: fullnameOverride
        note: >-
          fullnameOverride is <project>-<component>, and dfe-extras derives the
          component from it. The default renders dfe-engine, the chart's name.
      env:
        to: env
        note: The appset's env parameter; dfe-extras writes DFE_ENV from it.
      cloud:
        to: cloud
      global.registry:
        to: global.registry
      e2eServer:
        to: e2eServer
      profile:
        to: profile
      stackVersion:
        to: stackVersion
      uiVersion:
        to: uiVersion
        note: dfe-extras' default is the drift-checked copy of versions.yaml apps.dfe-ui.
      tenantIsolation.enabled:
        to: tenantIsolation.enabled
      retention.defaultTtlDays:
        to: retention.defaultTtlDays
      api:
        to: api
      networkModel.podCIDR:
        to: networkModel.podCIDR
      hyperdx:
        to: hyperdx
      mesh.enabled:
        to: mesh.enabled
      mesh.gateway.namespace:
        to: mesh.gateway.namespace
      kafka.mode:
        to: kafka.mode
        note: >-
          dfe-extras writes DFE_TRANSPORT_* from it and fails the render where it
          runs another transport than the profile's. apps/dfe-engine/profile-slim.yaml
          and profile-mesh.yaml switch the kafka secret group off.
      kafka.bootstrapServers:
        to: kafka.bootstrapServers
      kafka.securityProtocol:
        to: kafka.securityProtocol
      kafka.messageMaxBytes:
        to: kafka.messageMaxBytes
      kafka.saslSecretName:
        to: kafka.saslSecretName
        note: >-
          secrets.kafka.existingSecret takes it through tpl. Empty no longer drops
          the SASL references: set secrets.kafka.enabled to false as well.
      kafka.provider:
        dropped: A values.yaml leaf no engine template read.
      clickhouse.host:
        to: clickhouse.host
      clickhouse.port:
        to: clickhouse.port
      clickhouse.database:
        to: clickhouse.database
      clickhouse.user:
        to: clickhouse.user
      clickhouse.mode:
        to: clickhouse.mode
      clickhouse.passwordSecretName:
        to: clickhouse.passwordSecretName
        note: >-
          secrets.clickhouse.existingSecret takes it through tpl, and the keda shim
          reads it. Empty no longer drops DFE_CLICKHOUSE_PASSWORD: set
          secrets.clickhouse.enabled to false as well.
      clickhouse.passwordSecretKey:
        to: [clickhouse.passwordSecretKey, secrets.clickhouse.keys.password]
        note: The keda shim reads the first, and the library's key names take no tpl.
      clickhouse.tls.enabled:
        to: clickhouse.tls.enabled
      clickhouse.tls.port:
        to: clickhouse.tls.port
      clickhouse.tls.verify:
        to: clickhouse.tls.verify
      clickhouse.tls.issuerRef.name:
        to: clickhouse.tls.issuerRef.name
      clickhouse.tls.internalCA.present:
        to: clickhouse.tls.internalCA.present
      clickhouse.tls.ca.secretName:
        to: clickhouse.tls.ca.secretName
        note: >-
          apps/dfe-engine/values.yaml mounts the CA from this Secret, else from
          configMapName, optional on every pod; dfe-extras sets DFE_CLICKHOUSE_CA_CERT.
      clickhouse.tls.ca.configMapName:
        to: clickhouse.tls.ca.configMapName
      clickhouse.tls.ca.dataKey:
        to: clickhouse.tls.ca.dataKey
      config.mountPath:
        to: config.mountPath
        note: >-
          dfe-extras names every DFE_*_DIR under it and the auth seed copies there,
          but the claim mounts at the contract's writable path, /config, which a
          value cannot move. An overlay leaves it at /config.
      config.persistence.enabled:
        to: writablePaths.config.persistence.enabled
        note: >-
          false mounts an emptyDir. The singleton still replaces the pod with
          Recreate, where 2.2.0 surged a second engine pod.
      config.persistence.size:
        to: writablePaths.config.persistence.size
      config.persistence.storageClass:
        to: writablePaths.config.persistence.storageClass
      content.mountPath:
        to: content.mountPath
      content.catalogueFile:
        to: content.catalogueFile
      content.entries:
        to: content.entries
        note: >-
          dfe-extras sets DFE_SOURCE_CATALOGUE_FILE from the roles, and each content
          init container in apps/dfe-engine/values.yaml reads its ref by name. An
          overlay that adds or drops an entry restates initContainers whole.
      authConfig.providersConfigMap:
        to: authConfig.providersConfigMap
        note: >-
          The auth seed mounts the named ConfigMap, else an empty directory it
          skips. Reloader restarts the pod on a change, in place of 2.2.0's
          lookup checksum, which read empty under Argo.
      authConfig.groupsConfigMap:
        to: authConfig.groupsConfigMap
        note: The same as providersConfigMap.
      authConfig.caBundleConfigMap:
        to: authConfig.caBundleConfigMap
        note: >-
          dfe-extras sets SSL_CERT_FILE from it. The seed mounts the whole
          ConfigMap, where 2.2.0 projected ca-bundle.pem alone.
      gitops.enabled:
        to: gitops.enabled
        note: >-
          dfe-extras drops DFE_GITOPS_* and the hunt runner's git-sync on false.
          Set secrets.gitops.enabled to false as well; the deploy-repo emptyDir
          stays mounted.
      gitops.repoUrl:
        to: gitops.repoUrl
      gitops.branch:
        to: gitops.branch
      gitops.localPath:
        to: gitops.localPath
        note: DFE_GITOPS_LOCAL_PATH, and the deploy-repo emptyDir mounts at its directory.
      gitops.credentialsSecret:
        to: gitops.credentialsSecret
        note: secrets.gitops.existingSecret takes it through tpl, and the hunt runner's git-sync reads it.
      auth.jwtSecretName:
        to: auth.jwtSecretName
        note: >-
          dfe-extras mints it, the hunt runner and keda shim read it, and
          secrets.jwt.existingSecret takes it through tpl.
      auth.jwtSecretKey:
        to: [auth.jwtSecretKey, secrets.jwt.keys.secret]
        note: dfe-extras writes the key and the thin chart reads it, and the library's key names take no tpl.
      auth.jwtSecretCreate:
        to: auth.jwtSecretCreate
      auth.jwtSecret:
        to: auth.jwtSecret
      auth.adminSecretName:
        to: auth.adminSecretName
        note: >-
          dfe-extras mints it and names it in DFE_AUTH_LOCAL_ADMIN_SECRET_NAME, and
          secrets.admin.existingSecret takes it through tpl. Empty no longer drops
          DFE_AUTH_LOCAL_ADMIN_PASSWORD: set secrets.admin.enabled to false as well.
      auth.adminSecretKey:
        to: [auth.adminSecretKey, secrets.admin.keys.password]
        note: dfe-extras writes the key and the thin chart reads it, and the library's key names take no tpl.
      auth.adminSecretCreate:
        to: auth.adminSecretCreate
      auth.adminPassword:
        to: auth.adminPassword
      auth.adminSecretPath:
        to: auth.adminSecretPath
      auth.breakglassSecretName:
