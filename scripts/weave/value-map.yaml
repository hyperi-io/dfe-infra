# Where each .Values key a 2.2.0 app chart reads goes once the app runs on its
# thin chart: the key that carries a deploy repo's overlay value for the thin
# chart, its integration values (argocd/values/apps) and dfe-extras, or why
# nothing reads it any more. scripts/tests/test_weave_value_map.py fails on a key
# the chart reads that this file does not hold, and the dfe-ops upgrade
# migration stage rewrites stored overlays from it.
#
#   apps.<deploy.service>:
#     chart: the 2.2.0 chart directory
#     keys:
#       <2.2.0 path>:
#         to: <path>, or a list of paths   the key or keys that carry the value
#                                          now; the same path where it is kept
#         dropped: <reason>                nothing reads it after the switch
#         note: <text>                     what a deployer has to know
#
# An entry covers the keys beneath it. The 2.2.0 charts read every moved key
# through `default`, so an empty or null value there meant "derive it": the
# migration moves a set value only.

apps:
  dfe-ui:
    chart: helm/charts/dfe-ui
    keys:
      project:
        to: project
        note: >-
          dfe-extras names the NextAuth store key <project>/<env>/ui/nextauth from
          it. The thin chart's own name is fullnameOverride, see component.
          INTERNAL_API_URL names dfe-engine, the engine chart's name, so a
          deployment that renamed the engine sets extraEnv.INTERNAL_API_URL.
      component:
        to: fullnameOverride
        note: >-
          fullnameOverride is <project>-<component>. The default renders dfe-ui,
          the chart's name, so only a renamed instance sets it.
      env:
        to: env
        note: The appset's env parameter; apps/_common.yaml labels from it and dfe-extras keys the NextAuth store by it.
      cloud:
        to: cloud
        note: apps/_common.yaml labels from it, else from the cloud file's global.cloud.
      domain:
        to: domain
      global.registry:
        to: global.registry
      hostnames.dfe:
        to: hostnames.dfe
      hostnames.hyperdx:
        to: hostnames.hyperdx
      config.hostname:
        to: hostnames.dfe
        note: The label NEXTAUTH_URL derives from. In dfe-ui's own overlay it reaches no other chart.
      config.hyperdxHostname:
        to: hostnames.hyperdx
        note: The label HYPERDX_URL derives from. In dfe-ui's own overlay it reaches no other chart.
      config.hyperdxUrl:
        to: extraEnv.HYPERDX_URL
      config.internalApiUrl:
        to: extraEnv.INTERNAL_API_URL
      config.nextPublicApiUrl:
        to: extraEnv.NEXT_PUBLIC_API_URL
      config.nextauthUrl:
        to: extraEnv.NEXTAUTH_URL
      config.cookieDomain:
        to: extraEnv.DFE_COOKIE_DOMAIN
      config.nodeOptions:
        to: extraEnv.NODE_OPTIONS
      config.nextauthSecretName:
        to: config.nextauthSecretName
        note: >-
          dfe-extras names the NextAuth ExternalSecret from it, and
          secrets.nextauth.existingSecret takes it through tpl. Empty no longer
          drops NEXTAUTH_SECRET: next-auth refuses to start without one either way.
      config.secretStoreName:
        to: config.secretStoreName
        note: dfe-extras reads it; empty generates the secret in-cluster.
      otel.endpoint:
        to: otel.endpoint
        note: >-
          Exported as written with otel.protocol http/protobuf, so it carries its
          scheme and names the collector's OTLP/HTTP port. 2.2.0 added the scheme
          and moved 4317 to 4318.
      otel.tls:
        to: otel.tls
        note: apps/_common.yaml's endpoint template schemes a bare endpoint from it.
      telemetry.mode:
        to: telemetry.mode
      telemetry.hyperdxEndpoint:
        to: telemetry.hyperdxEndpoint
      telemetry.collectorNamespace:
        to: telemetry.collectorNamespace
      telemetry.receiverEndpoint:
        to: telemetry.receiverEndpoint
      telemetry.externalEndpoint:
        to: telemetry.externalEndpoint
      telemetry.prometheus.scrape:
        to: telemetry.prometheus.scrape
      telemetry.prometheus.port:
        dropped: The contract's metrics_port (3000) is the scrape port.
      telemetry.prometheus.path:
        dropped: The contract's health.metrics_path is the scrape path.
      metricsPort:
        dropped: The contract's metrics_port (3000) is the scrape port.
      image.repository:
        to: image.repository
      image.tag:
        to: image.tag
      image.digest:
        to: image.digest
      image.pullPolicy:
        to: image.pullPolicy
      image.public:
        dropped: >-
          dfe-common's opt-out of imagePullSecrets for a public image. scalo-service
          renders imagePullSecrets as given, so an overlay sets it empty instead.
      imageComponent:
        dropped: >-
          dfe-common's image name. scalo-service names the image after the
          contract's app_name, and image.repository replaces it whole.
      imagePullSecrets:
        to: imagePullSecrets
      replicaCount:
        to: replicaCount
      resources:
        to: resources
      service.type:
        to: service.type
      service.port:
        dropped: The contract's metrics_port (3000) sets the Service port.
      nodeScheduling.nodeSelector:
        to: nodeSelector
      nodeScheduling.tolerations:
        to: tolerations
      podSecurityContext.enabled:
        to: podSecurityContext.enabled
      podSecurityContext.runAsNonRoot:
        to: podSecurityContext.runAsNonRoot
      podSecurityContext.runAsUser:
        to: podSecurityContext.runAsUser
      podSecurityContext.runAsGroup:
        to: podSecurityContext.runAsGroup
      podSecurityContext.fsGroup:
        to: podSecurityContext.fsGroup
      podSecurityContext.seccompProfileType:
        to: podSecurityContext.seccompProfile.type
      containerSecurityContext:
        to: containerSecurityContext
        note: Merged over the contract's security block, under the same field names.
      pdb.enabled:
        to: pdb.enabled
      pdb.minAvailable:
        to: pdb.minAvailable
      pdb.maxUnavailable:
        to: pdb.maxUnavailable
      keda.enabled:
        to: keda.enabled
      keda.minReplicaCount:
        to: keda.minReplicaCount
      keda.maxReplicaCount:
        to: keda.maxReplicaCount
      keda.idleReplicaCount:
        to: keda.idleReplicaCount
      keda.cooldownPeriod:
        to: keda.cooldownPeriod
      keda.pollingInterval:
        to: keda.pollingInterval
      keda.cpu.targetUtilization:
        to: keda.cpu.targetUtilization
      keda.triggers:
        to: keda.triggers
      keda.triggerAuthentication.secretTargetRef:
        to: keda.triggerAuthentication.secretTargetRef
      keda.pressure:
        dropped: >-
          dfe-common's ScalingPressure trigger, which dfe-ui never turned on: it
          scales on CPU.

  hyperdx:
    chart: helm/charts/hyperdx
    keys:
      project:
        to: project
        note: >-
          dfe-extras names dfe-hyperdx-env from it. The thin chart's own name is
          fullnameOverride, see component.
      component:
        to: fullnameOverride
        note: >-
          fullnameOverride is <project>-<component>. The default renders
          dfe-hyperdx, the chart's name, so only a renamed instance sets it.
      env:
        to: env
      cloud:
        to: cloud
      domain:
        to: domain
      global.registry:
        to: global.registry
        note: The image now follows it; 2.2.0 hard-coded ghcr.io for this image alone.
      hostnames.dfe:
        to: hostnames.dfe
      hostnames.hyperdx:
        to: hostnames.hyperdx
      hyperdxHostname:
        to: hyperdxHostname
        note: dfe-extras derives FRONTEND_URL from it.
      dfeHostname:
        to: dfeHostname
        note: dfe-extras derives NEXT_PUBLIC_DFE_UI_BASE_URL from it.
      frontendUrl:
        to: frontendUrl
      dfeUiBaseUrl:
        to: dfeUiBaseUrl
      usageStats.enabled:
        to: usageStats.enabled
      localAuthPages.enabled:
        to: localAuthPages.enabled
      dfeAuth:
        to: dfeAuth
        note: Every key beneath it is read by dfe-extras for dfe-hyperdx-env.
      clickhouse.host:
        to: clickhouse.host
      clickhouse.port:
        to: clickhouse.port
      clickhouse.user:
        to: clickhouse.user
      clickhouse.mode:
        to: clickhouse.mode
      clickhouse.database:
        dropped: >-
          It fed CLICKHOUSE_DB, which HyperDX never reads
          (packages/api/src/config.ts reads CLICKHOUSE_HOST, _USER and _PASSWORD).
      clickhouse.passwordSecretName:
        to: clickhouse.passwordSecretName
        note: >-
          secrets.clickhouse.existingSecret takes it through tpl. The reference
          is optional now, so empty leaves CLICKHOUSE_PASSWORD unresolved where
          2.2.0 left it out.
      clickhouse.passwordSecretKey:
        to: secrets.clickhouse.keys.password
      clickhouse.tls.enabled:
        to: clickhouse.tls.enabled
      clickhouse.tls.issuerRef.name:
        to: clickhouse.tls.issuerRef.name
      clickhouse.tls.internalCA.present:
        to: clickhouse.tls.internalCA.present
      clickhouse.tls.ca.secretName:
        to: clickhouse.tls.ca.secretName
      clickhouse.tls.ca.dataKey:
        to: clickhouse.tls.ca.dataKey
      clickhouse.tls.ca.configMapName:
        to: clickhouse.tls.ca.configMapName
        note: >-
          dfe-extras sets NODE_EXTRA_CA_CERTS from it, and apps/hyperdx/values.yaml
          mounts the CA from this ConfigMap when secretName is empty, as 2.2.0 did.
      mongodb.uri:
        to: mongodb.uri
      mongodb.passwordSecretName:
        to: mongodb.passwordSecretName
        note: >-
          Empty no longer drops MONGO_PASSWORD: an external endpoint with inline
          credentials sets extraEnv.MONGO_PASSWORD to null as well.
      mongodb.passwordSecretKey:
        to: mongodb.passwordSecretKey
      sessionSecret.name:
        to: sessionSecret.name
        note: dfe-extras names the ExternalSecret from it, and secrets.session.existingSecret takes it through tpl.
      sessionSecret.key:
        to: [sessionSecret.key, secrets.session.keys.secret]
        note: dfe-extras writes the key and the thin chart reads it, and the library's key names take no tpl.
      sessionSecret.create:
        to: sessionSecret.create
      tokenEncryption.name:
        to: tokenEncryption.name
      tokenEncryption.key:
        to: [tokenEncryption.key, secrets.token-encryption.keys.key]
        note: dfe-extras writes the key and the thin chart reads it, and the library's key names take no tpl.
      tokenEncryption.create:
        to: tokenEncryption.create
      defaultConnections:
        dropped: >-
          Nothing writes dfe-hyperdx-connections, and dfe-engine retired the
          DEFAULT_CONNECTIONS blob for per-team connections
          (src/dfe_engine/api/v1/hyperdx.py).
      dashboards.enabled:
        to: dashboards.enabled
        note: >-
          false drops the provisioner env. The init container and its volume sit
          in apps/hyperdx/values.yaml, so an overlay sets initContainers to [] as well.
      dashboards.mountPath:
        to: dashboards.mountPath
      dashboards.allTeams:
        to: dashboards.allTeams
      dashboards.requireRefs:
        to: dashboards.requireRefs
      dashboards.image.repository:
        to: dashboards.image.repository
      dashboards.image.tag:
        to: dashboards.image.tag
      dashboards.image.digest:
        to: dashboards.image.digest
      dashboards.image.pullPolicy:
        to: dashboards.image.pullPolicy
      dashboards.resources:
        to: initContainers
        note: The init container sits whole in apps/hyperdx/values.yaml; an overlay restates the list.
      otlp:
        dropped: OTLP ports 4317 and 4318 are dropped. The fork image runs no OTLP receiver.
      reload.enabled:
        to: reload.enabled
      reload.secrets:
        to: reload.secrets
      reload.configmaps:
        to: reload.configmaps
        note: apps/hyperdx/values.yaml lists dfe-hyperdx-env, and an overlay's list replaces it.
      image.repository:
        to: image.repository
      image.tag:
        to: image.tag
      image.digest:
        to: image.digest
      image.pullPolicy:
        to: image.pullPolicy
      image.public:
        dropped: >-
          dfe-common's opt-out of imagePullSecrets for a public image. scalo-service
          renders imagePullSecrets as given, so an overlay sets it empty instead.
      imageComponent:
        dropped: >-
          dfe-common's image name. scalo-service names the image after the
          contract's app_name, and image.repository replaces it whole.
      imagePullSecrets:
        to: imagePullSecrets
      replicaCount:
        to: replicaCount
      resources:
        to: resources
      service.type:
        to: service.type
      service.port:
        dropped: The contract's port http (8080) sets the Service port.
      service.apiPort:
        dropped: The contract's metrics_port (8000) sets the Service port.
      nodeScheduling.nodeSelector:
        to: nodeSelector
      nodeScheduling.tolerations:
        to: tolerations
      podSecurityContext.enabled:
        to: podSecurityContext.enabled
      podSecurityContext.runAsNonRoot:
        to: podSecurityContext.runAsNonRoot
      podSecurityContext.runAsUser:
        to: podSecurityContext.runAsUser
      podSecurityContext.runAsGroup:
        to: podSecurityContext.runAsGroup
      podSecurityContext.fsGroup:
        to: podSecurityContext.fsGroup
      podSecurityContext.seccompProfileType:
        to: podSecurityContext.seccompProfile.type
      containerSecurityContext:
        to: containerSecurityContext
        note: >-
          The app container only. The dashboards init container's securityContext
          sits in apps/hyperdx/values.yaml.

  dfe-archiver:
    chart: helm/charts/dfe-archiver
    keys:
      project:
        to: project
        note: >-
          dfe-extras names the mesh route from it. The thin chart's own name is
          fullnameOverride, see component.
      component:
        to: fullnameOverride
        note: >-
          fullnameOverride is <project>-<component>. The default renders
          dfe-archiver, the chart's name, so only a renamed instance sets it.
      env:
        to: env
      cloud:
        to: cloud
      global.registry:
        to: global.registry
      config:
        to: config
        note: >-
          The engine's config blob, written to /etc/dfe/archiver.yaml as before.
          On the direct profiles configOverrides.transport carries grpc beside it.
      extraEnv:
        to: extraEnv
        note: >-
          A name the integration values also set takes the overlay's value now,
          where 2.2.0 let the chart's own value win.
      kafka.mode:
        to: kafka.mode
        note: >-
          dfe-extras fails the render where it runs another transport than the
          profile's, whose apps/dfe-archiver/profile-*.yaml carry the transport's
          env and secrets.
      kafka.bootstrapServers:
        to: kafka.bootstrapServers
        note: KAFKA_BROKERS on the bus profiles, through tpl.
      kafka.securityProtocol:
        to: kafka.securityProtocol
        note: >-
          KAFKA_SECURITY_PROTOCOL on the bus profiles, through tpl. Empty renders
          the variable empty, which the app reads as unset, where 2.2.0 left it out.
      kafka.saslSecretName:
        to: kafka.saslSecretName
        note: >-
          secrets.kafka.existingSecret takes it through tpl. Empty no longer drops
          the SASL references: set secrets.kafka.enabled to false instead.
      archive.localPath:
        to: archive.localPath
        note: >-
          ARCHIVER_DESTINATION is file://<localPath>, through tpl. The writable
          directory at that path comes from extraVolumes and extraVolumeMounts,
          which apps/dfe-archiver/local-dfe.yaml sets. Another cloud restates both.
      s3.endpoint:
        to: s3.endpoint
        note: S3_ENDPOINT, through tpl. Empty renders it empty, which the app reads as unset.
      s3.bucket:
        to: s3.bucket
        note: S3_BUCKET, through tpl. Empty renders it empty, which the app reads as unset.
      s3.secretName:
        to: s3.secretName
        note: >-
          secrets.s3.existingSecret takes it through tpl. The references stay
          optional. Empty no longer drops them: set secrets.s3.enabled to false.
      spool.path:
        dropped: >-
          The spool is the contract's writable path `spool`, at
          /var/spool/dfe/archiver, and ARCHIVER_SPOOL_DIR names the same path.
      spool.sizeLimit:
        to: writablePaths.spool.sizeLimit
      dlq.topic:
        to: dlq.topic
        note: DLQ_TOPIC on the bus profiles, through tpl.
      dlq.mode:
        to: dlq.mode
        note: DLQ_MODE on the bus profiles, through tpl.
      service.pushPort:
        to: service.pushPort
        note: >-
          dfe-extras' mesh route reads it. The listener is the contract's push
          port and ARCHIVER_GRPC_LISTEN, both 6000, so moving it is a contract change.
      waitForEngine.enabled:
        to: initContainers
        note: The wait-for-engine block in apps/dfe-archiver/values.yaml. Off is an initContainers list without it.
      waitForEngine.service:
        to: waitForEngine.service
      waitForEngine.namespace:
        to: waitForEngine.namespace
      waitForEngine.port:
        to: waitForEngine.port
      waitForEngine.timeoutSeconds:
        to: waitForEngine.timeoutSeconds
      waitForEngine.intervalSeconds:
        to: waitForEngine.intervalSeconds
      waitForEngine.resources:
        to: initContainers
        note: The init container sits whole in apps/dfe-archiver/values.yaml, so an overlay restates the list.
      otel.endpoint:
        to: otel.endpoint
        note: Exported as written with otel.protocol grpc, so it carries its scheme.
      otel.tls:
        to: otel.tls
        note: apps/_common.yaml's endpoint template schemes a bare endpoint from it.
      telemetry.mode:
        to: telemetry.mode
      telemetry.hyperdxEndpoint:
        to: telemetry.hyperdxEndpoint
      telemetry.collectorNamespace:
        to: telemetry.collectorNamespace
      telemetry.receiverEndpoint:
        to: telemetry.receiverEndpoint
      telemetry.externalEndpoint:
        to: telemetry.externalEndpoint
      telemetry.prometheus.scrape:
        to: telemetry.prometheus.scrape
      telemetry.prometheus.port:
        dropped: The contract's metrics_port (9090) is the scrape port.
      telemetry.prometheus.path:
        dropped: The contract's health.metrics_path is the scrape path.
      metricsPort:
        dropped: The contract's metrics_port (9090) is the scrape port.
      versionCheck:
        to: versionCheck
        note: ARCHIVER_VERSION_CHECK__*, the names 2.2.0 wrote.
      image.repository:
        to: image.repository
      image.tag:
        to: image.tag
      image.digest:
        to: image.digest
      image.pullPolicy:
        to: image.pullPolicy
      image.public:
        dropped: >-
          dfe-common's opt-out of imagePullSecrets for a public image. scalo-service
          renders imagePullSecrets as given, so an overlay sets it empty instead.
      imageComponent:
        dropped: >-
          dfe-common's image name. scalo-service names the image after the
          contract's app_name, and image.repository replaces it whole.
      imagePullSecrets:
        to: imagePullSecrets
      replicaCount:
        to: replicaCount
      resources:
        to: resources
      terminationGracePeriodSeconds:
        to: terminationGracePeriodSeconds
      nodeScheduling.nodeSelector:
        to: nodeSelector
      nodeScheduling.tolerations:
        to: tolerations
      podSecurityContext.enabled:
        to: podSecurityContext.enabled
      podSecurityContext.runAsNonRoot:
        to: podSecurityContext.runAsNonRoot
      podSecurityContext.runAsUser:
        to: podSecurityContext.runAsUser
      podSecurityContext.runAsGroup:
        to: podSecurityContext.runAsGroup
      podSecurityContext.fsGroup:
        to: podSecurityContext.fsGroup
      podSecurityContext.seccompProfileType:
        to: podSecurityContext.seccompProfile.type
      containerSecurityContext:
        to: containerSecurityContext
        note: The app container only. The wait-for-engine init container's sits in its block.
      serviceAccount.create:
        to: serviceAccount.create
      serviceAccount.annotations:
        to: serviceAccount.annotations
      serviceAccount.mountToken:
        to: serviceAccount.mountToken
      reload.enabled:
        to: reload.enabled
      reload.secrets:
        to: reload.secrets
      reload.configmaps:
        to: reload.configmaps
      pdb.enabled:
        to: pdb.enabled
      pdb.minAvailable:
        to: pdb.minAvailable
      pdb.maxUnavailable:
        to: pdb.maxUnavailable
      keda.enabled:
        to: keda.enabled
      keda.minReplicaCount:
        to: keda.minReplicaCount
      keda.maxReplicaCount:
        to: keda.maxReplicaCount
      keda.idleReplicaCount:
        to: keda.idleReplicaCount
      keda.cooldownPeriod:
        to: keda.cooldownPeriod
      keda.pollingInterval:
        to: keda.pollingInterval
      keda.cpu.targetUtilization:
        to: keda.cpu.targetUtilization
      keda.triggers:
        to: keda.triggers
      keda.triggerAuthentication.secretTargetRef:
        to: keda.triggerAuthentication.secretTargetRef
      keda.pressure.enabled:
        to: keda.extraTriggers
        note: >-
          The pressure trigger block in apps/dfe-archiver/profile-*.yaml, on every
          profile but slim. Off is an extraTriggers list without it.
      keda.pressure.service:
        to: keda.pressure.service
      keda.pressure.shimAddress:
        to: keda.pressure.shimAddress
      keda.pressure.targetValue:
        to: keda.pressure.targetValue
      mesh.enabled:
        to: mesh.enabled
        note: dfe-extras reads every mesh key for the pool route, as the 2.2.0 chart did.
      mesh.port:
        to: mesh.port
      mesh.gateway:
        to: mesh.gateway
      mesh.routePolicy:
        to: mesh.routePolicy

  dfe-transform-vrl:
    chart: helm/charts/dfe-transform-vrl
    keys:
      project:
        to: project
        note: >-
          dfe-extras names the mesh route from it. The thin chart's own name is
          fullnameOverride, see component.
      component:
        to: fullnameOverride
        note: >-
          fullnameOverride is <project>-<component>, which dfe-engine makes unique
          per instance. It also names the default consumer group and telemetry.
      env:
        to: env
      cloud:
        to: cloud
      global.registry:
        to: global.registry
      config:
        to: config
        note: >-
          The engine's config blob. source.transport, sink.transport and, on the
          direct profiles, source.listen come from configOverrides and win over it.
      extraEnv:
        to: extraEnv
        note: >-
          A name the integration values also set takes the overlay's value now,
          where 2.2.0 let the chart's own value win.
      kafka.mode:
        to: kafka.mode
        note: >-
          dfe-extras fails the render where it runs another transport than the
          profile's, whose apps/dfe-transform-vrl/profile-*.yaml carry the transport.
      kafka.bootstrapServers:
        to: kafka.bootstrapServers
        note: DFE_TRANSFORM_SOURCE_BROKERS and _SINK_BROKERS on the bus profiles, through tpl.
      kafka.securityProtocol:
        to: [configOverrides.source.tls.enabled, configOverrides.sink.tls.enabled]
        note: >-
          2.2.0 turned source.tls and sink.tls on for a protocol carrying SSL. The
          config file takes no template, so a TLS listener sets both to true.
      kafka.saslSecretName:
        to: kafka.saslSecretName
        note: >-
          secrets.kafka.existingSecret takes it through tpl. Empty no longer drops
          the SASL references: set secrets.kafka.enabled to false instead.
      kafka.sourceTopic:
        to: kafka.sourceTopic
        note: DFE_TRANSFORM_SOURCE_TOPICS on the bus profiles. Empty renders it empty, which the app reads as unset.
      kafka.destTopic:
        to: kafka.destTopic
        note: DFE_TRANSFORM_SINK_TOPIC on the bus profiles. Empty renders it empty, which the app reads as unset.
      kafka.consumerGroup:
        to: kafka.consumerGroup
        note: DFE_TRANSFORM_SOURCE_GROUP_ID on the bus profiles. Empty is the instance's fullname.
      kafka.autoOffsetReset:
        to: config.source.auto_offset_reset
        note: The bus profiles default it to earliest, and an overlay value wins as before.
      loaderPort:
        to: config.sink.endpoint
        note: >-
          The direct profiles' default endpoint names port 6000, so a loader on
          another port is a config.sink.endpoint.
      service.pushPort:
        to: service.pushPort
        note: >-
          dfe-extras' mesh route reads it. The listener is the contract's push
          port and configOverrides.source.listen, both 6000.
      transformFiles:
        to: fileSets.transforms.files
      transformFilesDir:
        to: fileSets.transforms.mountPath
        note: DFE_TRANSFORM_TRANSFORMS_DIR names the mount whenever there are files.
      enrichmentTables:
        to: fileSets.enrichment.files
        note: >-
          2.2.0 derived a config.enrichment_tables entry per mounted table. The
          config file takes no template, so whoever writes the files names each
          table there, under fileSets.enrichment.mountPath.
      enrichmentTablesDir:
        to: fileSets.enrichment.mountPath
      otelServiceName:
        to: otel.serviceName
        note: Empty is the fullname, as 2.2.0's dfe-<component>.
      waitForEngine.enabled:
        to: initContainers
        note: The wait-for-engine block in apps/dfe-transform-vrl/values.yaml. Off is an initContainers list without it.
      waitForEngine.service:
        to: waitForEngine.service
      waitForEngine.namespace:
        to: waitForEngine.namespace
      waitForEngine.port:
        to: waitForEngine.port
      waitForEngine.timeoutSeconds:
        to: waitForEngine.timeoutSeconds
      waitForEngine.intervalSeconds:
        to: waitForEngine.intervalSeconds
      waitForEngine.resources:
