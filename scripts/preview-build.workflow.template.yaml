# DRAFT TEMPLATE 2026-07-07 -- non-main branch build for previews.
#
# Drop into a SERVICE repo's .github/workflows/ (dfe-hyperdx, dfe-engine).
# It builds the branch image and pushes to Harbor `dfe-preview` -- workflow_dispatch
# only (NEVER on push/main), so it can't pollute main or ghcr. The main->ghcr
# release flow is untouched.
#
# Kept as a .template here (not under .github/workflows/) so it is authored now and
# copied in the morning; it does NOT need main to be free.
#
# Secrets (from OpenBao kv/services/harbor -> repo/org secrets):
#   HARBOR_ROBOT_USER / HARBOR_ROBOT_TOKEN  (the dfe-preview robot)
# Vars:
#   HARBOR_HOST=inhyperi.io   PREVIEW_PROJECT=dfe-preview

name: preview-build
on:
  workflow_dispatch:
    inputs:
      preview_name: { description: "preview name (e.g. hdx29)", required: true }
      # `service` + `dockerfile` are per-repo; hardcode per copy or pass in.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4       # the dispatched branch (github.ref)
      - name: Short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to Harbor
        run: echo "${{ secrets.HARBOR_ROBOT_TOKEN }}" | docker login "${{ vars.HARBOR_HOST }}" -u "${{ secrets.HARBOR_ROBOT_USER }}" --password-stdin
      - name: Build + push
        env:
          IMAGE: ${{ vars.HARBOR_HOST }}/${{ vars.PREVIEW_PROJECT }}/SERVICE:${{ inputs.preview_name }}-${{ steps.sha.outputs.sha }}
        run: |
          docker build -t "$IMAGE" -f DOCKERFILE .   # e.g. docker/hyperdx/Dockerfile
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
      # Optional: bump the matching argocd/previews/<name>-SERVICE.yaml image + PR,
      # or let Argo Image Updater pick up the new tag. (DECIDE: open Q3.)
