# The app manifest the engine's management API reflects. Helm reads only files
# inside a chart, so `python3 scripts/composition.py --write-catalogue` keeps
# files/apps.yaml equal to apps.yaml at the repo root, and the manifest then
# travels with the stack revision rather than with an engine release.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dfe-common.fullname" . }}-app-catalogue
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
data:
  apps.yaml: |
    {{- .Files.Get "files/apps.yaml" | nindent 4 }}
