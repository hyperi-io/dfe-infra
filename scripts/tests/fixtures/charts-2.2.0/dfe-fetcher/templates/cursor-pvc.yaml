{{- if .Values.persistence.enabled }}
# The cursor store's durable home: the fetch window each connection resumed
# from. Opt-in, because losing it re-fetches the default window rather than
# losing data, and the slim tier is not guaranteed a StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dfe-common.fullname" . }}-cursor
  labels:
    {{- include "dfe-common.labels" . | nindent 4 }}
spec:
  # ReadWriteOnce is enough because a fetcher runs one replica: N replicas of one
  # config are N duplicate polls, not a shared workload (see keda in values.yaml).
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
