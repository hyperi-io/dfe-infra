        image: registry.example.com/dfe/dfe-engine:<pin:apps.dfe-engine>@<pin:digests.dfe-engine>
        imagePullPolicy: IfNotPresent
        name: wait-for-engine
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        dfe.hyperi.io/workload: dfe
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: dfe-keda-shim
      tolerations:
      - effect: NoSchedule
        key: dfe.hyperi.io/workload
        operator: Equal
        value: dfe
      volumes:
      - emptyDir: {}
        name: tmp
      - name: clickhouse-ca
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: dfe-clickhouse-ca
