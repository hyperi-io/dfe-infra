        - name: DFE_CLICKHOUSE_PORT
          value: '8443'
        - name: DFE_CLICKHOUSE_DATA_DATABASE
          value: dfe
        - name: DFE_CLICKHOUSE_SECURE
          value: 'true'
        - name: DFE_CLICKHOUSE_VERIFY
          value: 'true'
        - name: DFE_CLICKHOUSE_CA_CERT
          value: /etc/dfe/clickhouse-ca/ca.crt
        - name: DFE_CLICKHOUSE_USERNAME
          value: dfe_hunt_runner
        - name: DFE_CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: hunt-runner-clickhouse
        - name: DFE_HUNTS_DIR
          value: /deploy-repo/repo/current/config/hunts
        - name: DFE_HUNTS_RULES_DIR
          value: /deploy-repo/repo/current/config/rules
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://dfe-otel-collector-gateway.otel.svc.cluster.local:4317
        - name: OTEL_SERVICE_NAME
          value: dfe-hunt-runner
        image: registry.example.com/dfe/dfe-engine:<pin:apps.dfe-engine>@<pin:digests.dfe-engine>
        imagePullPolicy: IfNotPresent
        name: hunt-runner
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /tmp
          name: tmp
        - mountPath: /deploy-repo
          name: deploy-repo
          readOnly: true
        - mountPath: /etc/dfe/clickhouse-ca
          name: clickhouse-ca
          readOnly: true
      - args:
        - --repo=https://git.example.com/dfe-deploy.git
        - --ref=main
        - --root=/deploy-repo/repo
        - --link=current
        - --period=30s
        - --max-failures=-1
        env:
        - name: GITSYNC_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: dfe-deploy-repo-auth
        - name: GITSYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: dfe-deploy-repo-auth
        - name: HOME
          value: /git-sync-home
        - name: TMPDIR
          value: /git-sync-home
        image: registry.k8s.io/git-sync/git-sync:<pin:services.git-sync>@<pin:services-digests.git-sync>
        imagePullPolicy: IfNotPresent
        name: git-sync
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /deploy-repo
          name: deploy-repo
        - mountPath: /git-sync-home
          name: git-sync-home
      enableServiceLinks: false
      initContainers:
      - command:
        - /bin/sh
        - -c
        - "set -eu\nURL=\"http://dfe-engine.dfe.svc.cluster.local:8000/readyz\"\nDEADLINE=$(( $(date +%s) + 600 ))\necho \"waiting for ${URL}\"\nuntil curl -fsS -o /dev/null --max-time 5 \"$URL\"; do\n  if [ \"$(date +%s)\" -ge \"$DEADLINE\" ]; then\n    echo \"dfe-engine did not report ready at ${URL} within 600s -- GET /api/v1/system/schema on the engine says why\" >&2\n    exit 1\n  fi\n  sleep 5\ndone\necho \"dfe-engine is ready\"\n"
        image: registry.example.com/dfe/dfe-engine:<pin:apps.dfe-engine>@<pin:digests.dfe-engine>
        imagePullPolicy: IfNotPresent
        name: wait-for-engine
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      - args:
        - --repo=https://git.example.com/dfe-deploy.git
        - --ref=main
        - --root=/deploy-repo/repo
        - --link=current
        - --one-time
        - --max-failures=3
        env:
        - name: GITSYNC_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: dfe-deploy-repo-auth
        - name: GITSYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: dfe-deploy-repo-auth
        - name: HOME
          value: /git-sync-home
        - name: TMPDIR
          value: /git-sync-home
        image: registry.k8s.io/git-sync/git-sync:<pin:services.git-sync>@<pin:services-digests.git-sync>
        imagePullPolicy: IfNotPresent
        name: git-sync-init
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /deploy-repo
          name: deploy-repo
        - mountPath: /git-sync-home
          name: git-sync-home
      nodeSelector:
        dfe.hyperi.io/workload: dfe
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: dfe-hunt-runner
      tolerations:
      - effect: NoSchedule
        key: dfe.hyperi.io/workload
        operator: Equal
        value: dfe
      volumes:
      - emptyDir: {}
        name: config
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: deploy-repo
      - emptyDir: {}
        name: git-sync-home
      - name: clickhouse-ca
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: dfe-clickhouse-ca
