apiVersion: apps/v1
kind: Deployment
metadata:
  labels: &id001
    app.kubernetes.io/component: hunt-runner
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: dfe-hunt-runner
    app.kubernetes.io/part-of: dfe
    app.kubernetes.io/version: <pin:apps.dfe-engine>
    dfe.hyperi.io/cloud: local
    dfe.hyperi.io/env: dev
  name: dfe-hunt-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dfe-hunt-runner
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - args:
        - run
        - --poll
        - '15'
        - --cap
        - '8'
        command:
        - dfe-hunt-runner
        env:
        - name: DFE_API_JWT_SECRET
