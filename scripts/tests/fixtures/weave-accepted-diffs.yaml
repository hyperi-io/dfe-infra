# Every difference the chart-switch gate accepts between a component's 2.2.0
# render and its thin chart beside dfe-extras, each with its reason. Read by
# scripts/tests/_gate.py for test_weave_identity.py and test_weave_runtime.py,
# and by test_dfe_extras.py for the env its ConfigMaps leave out.
#
# A section is a deploy.service, or "*" for every component.
#   added:  objects only the new render holds, Kind/name -> reason.
#   removed: objects only the 2.2.0 render holds, which Argo prunes, Kind/name ->
#           reason. A PersistentVolumeClaim is refused here.
#   diffs:  leaf differences in an object both renders hold. `object` and `path`
#           are globs where `*` matches anything; `old` and `new`, when given,
#           pin the value (a string with `*` is a glob), and "<absent>" is a
#           leaf one render does not have. `scenarios` limits an entry to the
#           named _gate.SCENARIOS. A path reads as _gate.runtime_view writes it:
#           the main container is containers[main], env is the effective env.
# test_weave_runtime.py fails on an entry that no longer matches any diff.

"*":
  diffs:
    - object: "*"
      path: "*labels[app.kubernetes.io/managed-by]"
      old: helm
      new: Helm
      reason: scalo-service writes .Release.Service where dfe-common wrote a literal.
    - object: "*"
      path: "*labels[helm.sh/chart]"
      old: <absent>
      reason: scalo-service labels each object with its chart's name and version.
    - object: "*"
      path: "*labels[dfe.hyperi.io/cloud]"
      old: local
      new: aws
      reason: >-
        2.2.0 labelled every layer 2 app cloud=local, a chart default no layer set.
        apps/_common.yaml takes the cloud from the cloud file's global.cloud.
    - object: Deployment/*
      path: spec.template.spec.containers[main].name
      reason: >-
        Every main container takes the chart's name. bootstrap/smoke-test-hyperdx.sh
        and smoke-test-integration.sh still address the old names.
    - object: Deployment/*
      path: spec.template.spec.serviceAccountName
      old: default
      reason: The pod runs on its own ServiceAccount, where 2.2.0 left it on the namespace default.
    - object: Deployment/*
      path: spec.template.spec.automountServiceAccountToken
      old: true
      new: false
      reason: >-
        scalo-service leaves the token unmounted unless asked. Neither dfe-ui nor
        dfe-hyperdx calls the Kubernetes API.
    - object: Deployment/*
      path: spec.template.spec.volumes[serviceaccount-files].projected.sources
      old: <absent>
      reason: >-
        With the token unmounted, scalo-service still mounts the cluster CA and the
        namespace, from kube-root-ca.crt and the downward API.
    - object: Deployment/*
      path: spec.template.spec.containers[main].volumeMounts[/var/run/secrets/kubernetes.io/serviceaccount].*
      old: <absent>
      reason: The mount of that serviceaccount-files volume, read-only.
    - object: Deployment/*
      path: spec.template.spec.containers[main].env[POD_NAMESPACE].valueFrom.fieldRef.fieldPath
      old: <absent>
      new: metadata.namespace
      reason: scalo-service sets POD_NAMESPACE on every pod.
    - object: Deployment/*
      path: spec.template.spec.volumes[writable-tmp].emptyDir
      old: <absent>
      new: {}
      reason: scalo-service mounts a scratch /tmp on every pod, named writable-tmp.
    - object: Deployment/*
      path: spec.template.spec.containers[main].volumeMounts[/tmp].name
      new: writable-tmp
      reason: The mount of that scratch /tmp.
    - object: Deployment/*
      path: spec.template.spec.containers[main].livenessProbe.timeoutSeconds
      old: 1
      new: 3
      reason: scalo-service probes time out at 3 s.
    - object: Deployment/*
      path: spec.template.spec.containers[main].readinessProbe.timeoutSeconds
      old: 1
      new: 3
      reason: scalo-service probes time out at 3 s.
    - object: Deployment/*
      path: spec.template.spec.containers[main].readinessProbe.failureThreshold
      old: 3
      new: 2
      reason: scalo-service takes a pod out of its Service after two failed readiness checks.
    - object: Deployment/*
      path: spec.template.spec.containers[main].startupProbe.periodSeconds
      old: 2
      new: 5
      reason: scalo-service runs the startup probe every 5 s over the contract's budget.
    - object: Deployment/*
      path: spec.template.spec.containers[main].startupProbe.failureThreshold
      old: 30
      new: 12
      reason: The contract's 60 s startup budget at a 5 s period, the 30 x 2 s 2.2.0 gave.
    - object: Deployment/*
      path: spec.template.spec.containers[main].startupProbe.timeoutSeconds
      old: 1
      new: 3
      reason: scalo-service probes time out at 3 s.

dfe-ui:
  diffs:
    - object: Deployment/dfe-ui
      path: metadata.annotations[reloader.stakater.com/auto]
      old: <absent>
      new: "true"
      reason: apps/_common.yaml turns Reloader on fleet-wide, so a rotated NextAuth secret restarts the pod.
    - object: Deployment/dfe-ui
      path: spec.template.spec.securityContext.*
      old: 1000
      new: 1001
      reason: >-
        The contract runs the pod as uid and gid 1001, the image's USER on both
        arches, where 2.2.0 ran it as 1000.
    - object: "*/dfe-ui"
      path: "*ports[3000/TCP].name"
      old: http
      new: metrics
      reason: scalo-service names the metrics port `metrics`. Next.js serves traffic and /metrics on 3000.
    - object: Deployment/dfe-ui
      path: spec.template.spec.volumes[tmp].emptyDir
      old: {}
      new: <absent>
      reason: The /tmp emptyDir is scalo-service's writable-tmp now.
    - object: ServiceAccount/dfe-ui
      path: automountServiceAccountToken
      old: <absent>
      new: false
      reason: scalo-service's ServiceAccount carries no token by default.
    - object: Deployment/dfe-ui
      path: spec.template.spec.containers[main].env[NEXTAUTH_URL]
      old: <absent>
      new: ""
      scenarios: [no-domain]
      reason: >-
        With no domain extraEnv renders NEXTAUTH_URL empty where 2.2.0 left it
        out. next-auth reads an empty NEXTAUTH_URL as unset (not verified on a
        live pod).
    - object: Deployment/dfe-ui
      path: spec.template.spec.containers[main].env[OTEL_EXPORTER_OTLP_ENDPOINT]
      old: <absent>
      new: ""
      scenarios: [prometheus]
      reason: Prometheus mode renders the endpoint empty, which the stack reads as "export nothing".
    - object: Deployment/dfe-ui
      path: spec.template.spec.containers[main].env[OTEL_EXPORTER_OTLP_PROTOCOL]
      old: <absent>
      new: http/protobuf
      scenarios: [prometheus]
      reason: The protocol rides beside the empty endpoint, which exports nothing.

hyperdx:
  added:
    ConfigMap/dfe-hyperdx-env: >-
      dfe-extras carries the env 2.2.0 wrote under conditionals, read through
      extraEnvFrom, so a variable stays absent where 2.2.0 left it out.
    ServiceAccount/dfe-hyperdx: The pod's own ServiceAccount, where 2.2.0 used the namespace default.
    PodDisruptionBudget/dfe-hyperdx: >-
      scalo-service budgets any workload of two or more replicas (scale and
      mesh). 2.2.0 hyperdx carried no budget.
  diffs:
    - object: Deployment/dfe-hyperdx
      path: metadata.annotations[configmap.reloader.stakater.com/reload]
      old: <absent>
      new: dfe-hyperdx-env
      reason: A changed dfe-hyperdx-env restarts the pod, as a changed 2.2.0 env did by rolling it.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].envFrom
      old: <absent>
      reason: The pod reads dfe-hyperdx-env, whose content the env leaves are held to.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].env[CLICKHOUSE_PORT]
      old: "8123"
      new: <absent>
      reason: HyperDX reads only CLICKHOUSE_HOST, which carries the port (dfe-hyperdx packages/api/src/config.ts).
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].env[CLICKHOUSE_DB]
      old: dfe
      new: <absent>
      reason: HyperDX never reads it (packages/api/src/config.ts reads CLICKHOUSE_HOST, _USER and _PASSWORD).
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].env[CLICKHOUSE_PASSWORD].valueFrom.secretKeyRef.optional
      old: <absent>
      new: true
      reason: The contract marks the clickhouse group optional, because the app starts without it.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].env[OTEL_SERVICE_NAME]
      old: <absent>
      new: dfe-hyperdx
      reason: scalo-service names every app's telemetry after its chart.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].env[OTEL_EXPORTER_OTLP_ENDPOINT]
      old: http://dfe-otel-collector-gateway.otel.svc.cluster.local:4318
      new: ""
      scenarios: [prometheus]
      reason: >-
        2.2.0 hard-coded the collector in every mode. The endpoint follows
        telemetry.mode now, and prometheus mode exports nothing.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].image
      old: ghcr.io/hyperi-io/dfe-hyperdx:*
      new: registry.example.com/dfe/dfe-hyperdx:*
      reason: >-
        2.2.0 hard-coded ghcr.io for this image alone. It follows global.registry
        like every other dfe-* image; the tag and digest are held equal.
    - object: Deployment/dfe-hyperdx
      path: spec.strategy.rollingUpdate.maxSurge
      old: 25%
      new: 1
      reason: >-
        Surge first, so the new pod passes readiness before the old one goes.
        2.2.0 took Kubernetes' 25% default.
    - object: Deployment/dfe-hyperdx
      path: spec.strategy.rollingUpdate.maxUnavailable
      old: 25%
      new: 0
      reason: Surge first, as above.
    - object: Deployment/dfe-hyperdx
      path: spec.template.metadata.annotations[prometheus.io/*]
      old: <absent>
      reason: Scrape annotations on the contract's metrics port, 8000 /metrics, which 2.2.0 hyperdx never carried.
    - object: "*/dfe-hyperdx"
      path: "*ports[8000/TCP].name"
      old: api
      new: metrics
      reason: >-
        scalo-service names the metrics port `metrics`. The API, its probes and
        /metrics share 8000, and callers dial it by number.
    - object: "*/dfe-hyperdx"
      path: "*ports[431*/TCP].*"
      new: <absent>
      reason: OTLP ports 4317 and 4318 are dropped. The fork image runs no OTLP receiver.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.volumes[clickhouse-ca].*.optional
      old: <absent>
      new: true
      reason: >-
        Mounted on every pod, optional, because a static volume cannot follow
        clickhouse.tls. NODE_EXTRA_CA_CERTS still follows it.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.volumes[clickhouse-ca].*
      old: <absent>
      scenarios: [clickhouse-plaintext]
      reason: >-
        The same optional volume on plaintext ClickHouse, where 2.2.0 mounted
        none. Nothing reads it: dfe-hyperdx-env leaves NODE_EXTRA_CA_CERTS out.
    - object: Deployment/dfe-hyperdx
      path: spec.template.spec.containers[main].volumeMounts[/etc/dfe/clickhouse-ca].*
      old: <absent>
      scenarios: [clickhouse-plaintext]
      reason: The mount of that optional volume.

dfe-archiver:
  diffs:
    - &scalo-checksum-config
      object: Deployment/*
      path: spec.template.metadata.annotations[checksum/config]
      reason: >-
        scalo-service hashes the config file it renders, where 2.2.0 hashed the
        whole ConfigMap template. A config change rolls the pods either way.
    - &scalo-liveness-delay
      object: Deployment/*
      path: spec.template.spec.containers[main].livenessProbe.initialDelaySeconds
      old: 10
      new: 0
      reason: The startup probe holds liveness off until the app first answers, in place of a fixed delay.
    - &scalo-liveness-period
      object: Deployment/*
      path: spec.template.spec.containers[main].livenessProbe.periodSeconds
      old: 30
      new: 10
      reason: scalo-service checks liveness every 10 s once the startup probe has passed.
    - &scalo-readiness-delay
      object: Deployment/*
      path: spec.template.spec.containers[main].readinessProbe.initialDelaySeconds
      old: 5
      new: 0
      reason: Readiness is checked from the start, so the pod joins its Service on its first pass.
    - &scalo-startup-probe
      object: Deployment/*
      path: spec.template.spec.containers[main].startupProbe.*
      old: <absent>
      reason: >-
        scalo-service adds a startup probe on /livez over the contract's 120 s
        budget (24 x 5 s). 2.2.0 gave a starting pod 100 s: a 10 s delay, then
        three 30 s liveness periods.
    - &scalo-tmp-volume
      object: Deployment/*
      path: spec.template.spec.volumes[tmp].emptyDir
      old: {}
      new: <absent>
      reason: The /tmp emptyDir is scalo-service's writable-tmp now.
    - &scalo-prometheus-endpoint
      object: Deployment/*
      path: spec.template.spec.containers[main].env[OTEL_EXPORTER_OTLP_ENDPOINT]
      old: <absent>
      new: ""
      scenarios: [prometheus]
      reason: Prometheus mode renders the endpoint empty, which the stack reads as "export nothing".
    - object: Deployment/dfe-archiver
      path: spec.template.spec.containers[main].env[ARCHIVER_DESTINATION]
      old: <absent>
      new: ""
      reason: >-
        Rendered empty with no archive.localPath, where 2.2.0 left it out. The
        app's flat env reads an empty value as unset (scalo flat_env_string).
    - object: Deployment/dfe-archiver
      path: spec.template.spec.containers[main].env[S3_*]
      old: <absent>
      new: ""
      reason: >-
        S3_ENDPOINT and S3_BUCKET render empty with no s3.endpoint or s3.bucket,
        where 2.2.0 left them out. The app reads an empty value as unset.
    - object: ConfigMap/dfe-archiver-config
      path: data[archiver.yaml]
      old: "{}\n"
      new: "transport: grpc\n"
      reason: >-
        On the direct profiles the file names the transport ARCHIVER_TRANSPORT
        already selects, because the contract's push port opens on
        config.transport.
    - object: Deployment/dfe-archiver
      path: spec.template.spec.volumes[spool].emptyDir.sizeLimit
      old: 10Gi
      new: <absent>
      reason: The spool is the contract's writable path `spool` now, mounted as writable-spool.
    - object: Deployment/dfe-archiver
      path: spec.template.spec.volumes[writable-spool].emptyDir.sizeLimit
      old: <absent>
      new: 10Gi
      reason: The same spool and the same 10Gi cap, under scalo-service's volume name.
    - object: Deployment/dfe-archiver
      path: spec.template.spec.containers[main].volumeMounts[/var/spool/dfe/archiver].name
      old: spool
      new: writable-spool
      reason: The spool's mount, at the same path.

dfe-transform-vrl:
  added:
    ConfigMap/dfe-transform-vrl-transforms: &scalo-fileset-transforms >-
      scalo-service renders a file set's ConfigMap with or without files, where
      2.2.0 rendered it only with some. The app reads the empty mount only when
      DFE_TRANSFORM_TRANSFORMS_DIR names it, which it does only with files.
    ConfigMap/dfe-transform-vrl-enrichment: &scalo-fileset-enrichment >-
      scalo-service renders a file set's ConfigMap with or without files. A
      table is read only where config.enrichment_tables names it.
    Service/dfe-transform-vrl: &scalo-bus-service >-
      scalo-service fronts the metrics port on every profile, where 2.2.0
      rendered the Service on the direct transport only, for its push port.
  diffs:
    - *scalo-checksum-config
    - *scalo-liveness-delay
    - *scalo-liveness-period
    - *scalo-readiness-delay
    - *scalo-startup-probe
    - *scalo-tmp-volume
    - *scalo-prometheus-endpoint
    - &scalo-transform-checksums
      object: Deployment/*
      path: spec.template.metadata.annotations[checksum/*]
      new: <absent>
      reason: >-
        One checksum/files annotation over every file set replaces checksum/transforms
        and checksum/enrichment.
    - &scalo-files-checksum
      object: Deployment/*
      path: spec.template.metadata.annotations[checksum/files]
      old: <absent>
      reason: A change to either file set rolls the pods, as each set's own checksum did.
    - &scalo-fileset-volumes
      object: Deployment/*
      path: spec.template.spec.volumes[fileset-*].configMap.name
      old: <absent>
      reason: The two file sets' ConfigMaps, mounted whether or not they hold files.
    - &scalo-fileset-mounts
      object: Deployment/*
      path: spec.template.spec.containers[main].volumeMounts[/etc/dfe-transform-*].*
      old: <absent>
      reason: The file sets' read-only mounts, at the directories 2.2.0 mounted them at.
    - &scalo-push-service-metrics
      object: Service/*
      path: spec.ports[9090/TCP].*
      old: <absent>
      reason: >-
        scalo-service puts the metrics port on every Service it renders. The 2.2.0
        Service of a transform carried the push port alone.
    - &scalo-transform-dir
      object: Deployment/*
      path: spec.template.spec.containers[main].env[DFE_TRANSFORM_TRANSFORMS_DIR]
      old: <absent>
      new: ""
      reason: >-
        Empty with no transform files, where 2.2.0 left it out. The app's flat
        env reads an empty value as unset, so its own config decides.
    - &scalo-source-topics
      object: Deployment/*
      path: spec.template.spec.containers[main].env[DFE_TRANSFORM_SOURCE_TOPICS]
      old: <absent>
      new: ""
      reason: >-
        Empty with no kafka.sourceTopic, where 2.2.0 left it out. The app reads
        an empty value as unset, so the engine's routing stands.
    - &scalo-sink-topic
      object: Deployment/*
      path: spec.template.spec.containers[main].env[DFE_TRANSFORM_SINK_TOPIC]
      old: <absent>
      new: ""
      reason: >-
        Empty with no kafka.destTopic, where 2.2.0 left it out. The app reads an
        empty value as unset, so the engine's routing stands.
    - &scalo-slim-loader-endpoint
      object: ConfigMap/*-config
      path: data[config.yaml]
      old: "sink:\n  endpoint: http://dfe-loader.dfe.svc.cluster.local:6000\n  transport: direct\nsource:\n  listen: 0.0.0.0:6000\n  transport: direct\n"
      new: "sink:\n  endpoint: http://dfe-loader:6000\n  transport: direct\nsource:\n  listen: 0.0.0.0:6000\n  transport: direct\n"
      reason: >-
        The default loader endpoint on the slim profile is the Service's short
        name, which resolves in the pod's own namespace. The config file takes no
        template, so it cannot name the namespace. The engine's endpoint wins.

dfe-transform-vector:
  added:
    ConfigMap/dfe-transform-vector-transforms: *scalo-fileset-transforms
    ConfigMap/dfe-transform-vector-enrichment: *scalo-fileset-enrichment
    Service/dfe-transform-vector: *scalo-bus-service
  diffs:
    - *scalo-checksum-config
    - *scalo-liveness-delay
    - *scalo-liveness-period
    - *scalo-readiness-delay
    - *scalo-startup-probe
    - *scalo-tmp-volume
    - *scalo-prometheus-endpoint
    - *scalo-transform-checksums
    - *scalo-files-checksum
    - *scalo-fileset-volumes
    - *scalo-fileset-mounts
    - *scalo-push-service-metrics
    - *scalo-transform-dir
    - *scalo-source-topics
    - *scalo-sink-topic
    - *scalo-slim-loader-endpoint
    - object: Deployment/dfe-transform-vector*
      path: spec.template.spec.volumes[vector-*].emptyDir
      old: {}
      new: <absent>
      reason: >-
        Vector's data and run directories are the contract's writable paths `data`
        and `run` now.
    - object: Deployment/dfe-transform-vector*
      path: spec.template.spec.volumes[writable-*].emptyDir
      old: <absent>
      new: {}
      reason: The same two emptyDirs, under scalo-service's volume names.
    - object: Deployment/dfe-transform-vector*
      path: spec.template.spec.containers[main].volumeMounts[/var/*/vector].name
      reason: The mounts of those two directories, at the same paths.

dfe-transform-elastic:
  added:
    Service/dfe-transform-elastic: *scalo-bus-service
  removed:
    Service/dfe-transform-elastic-mesh: &elastic-no-mesh >-
      The mesh trio routed to port 6000, which the thin render opens only where the
      instance's config names the direct transport. apps.yaml declares this app
      bus-only until dfe-transform-elastic#19, so the engine compiles no sender to
      the mesh alias and no config opens the port.
    GRPCRoute/dfe-transform-elastic-mesh: *elastic-no-mesh
    BackendTrafficPolicy/dfe-transform-elastic-mesh: *elastic-no-mesh
  diffs:
    - *scalo-checksum-config
    - *scalo-liveness-delay
    - *scalo-liveness-period
    - *scalo-readiness-delay
    - *scalo-startup-probe
    - *scalo-tmp-volume
    - *scalo-prometheus-endpoint
    - object: Deployment/dfe-transform-elastic*
      path: spec.template.spec.initContainers[wait-for-engine].*
      old: <absent>
      reason: >-
        The pod waits for dfe-engine like every other stage. The 2.2.0 chart
        started it before the engine had created its topics.
    - object: ConfigMap/dfe-transform-elastic*-config
      path: data[config.yaml]
      old: "{}\n"
      new: "source:\n  brokers: []\n  group_id: \"\"\n  name: \"\"\n  topics: []\n"
      reason: >-
        The app's own idle defaults on the bus, so the engine's source block
        parses with brokers present: the thin chart cannot add a key only when
        the overlay names a source, as 2.2.0 did. An empty name idles the app.
    - object: Deployment/dfe-transform-elastic*
      path: spec.template.spec.containers[main].env[DFE_TRANSFORM_ELASTIC_SOURCE_BROKERS]
      old: <absent>
      reason: >-
        The source's broker list from kafka.bootstrapServers, applied after the
        file is read, where 2.2.0 wrote it into the file.
    - object: "*/dfe-transform-elastic*"
      path: "*ports[6000/TCP].*"
      new: <absent>
      reason: >-
        The push port opens only where the instance's config names the direct
        transport. apps.yaml declares this app bus-only, so no source sends it
        that config, where 2.2.0 published the port on every direct profile.
    - *scalo-push-service-metrics

dfe-receiver:
  added:
    ConfigMap/dfe-receiver-env: >-
      dfe-extras carries the env 2.2.0 wrote under conditionals, read through
      extraEnvFrom, so a variable stays absent where 2.2.0 left it out.
  diffs:
    - object: Deployment/dfe-receiver
      path: metadata.annotations[configmap.reloader.stakater.com/reload]
      old: <absent>
      new: dfe-receiver-env
      reason: A changed dfe-receiver-env restarts the pod, as a changed 2.2.0 env did by rolling it.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].envFrom
      old: <absent>
      reason: The pod reads dfe-receiver-env, whose content the env leaves are held to.
    - object: Deployment/dfe-receiver
      path: spec.template.metadata.annotations[checksum/config]
      reason: >-
        2.2.0 hashed its whole ConfigMap template, scalo-service hashes the config
        file. Either rolls the pod on a config change; the file itself is compared
        as ConfigMap/dfe-receiver-config.
    - object: ConfigMap/dfe-receiver-config
      path: data[config.yaml]
      old: |
        buffer:
          memory_limit: 0
        destinations:
          default: loader
        grpc:
          bind_address: 0.0.0.0:6000
          enabled: true
        loader:
          grpc_endpoint: http://dfe-loader.dfe.svc.cluster.local:6000
          transport: grpc
      new: |
        buffer:
          memory_limit: 0
        destinations:
          default: loader
        grpc:
          bind_address: 0.0.0.0:6000
          enabled: true
        loader:
          grpc_endpoint: http://dfe-loader:6000
          transport: grpc
      reason: >-
        The loader's short Service name, which resolves in whatever namespace the
        pair is deployed to. The config value takes no tpl, so the namespace the
        2.2.0 chart spelled out cannot be derived.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].env[DFE_RECEIVER_BIND_ADDRESS]
      old: 0.0.0.0:8080
      new: <absent>
      reason: >-
        The app's own default bind address. The contract fixes the http port at
        8080, so a listener list can no longer move it.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].env[DFE_RECEIVER_BEARER_TOKENS].valueFrom.secretKeyRef.*
      old: <absent>
      reason: >-
        The contract's auth group, optional: bearer tokens reach the app from
        dfe-receiver-auth when a deployment creates it, and no Secret means no
        tokens, as 2.2.0 had.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].env[OTEL_EXPORTER_OTLP_ENDPOINT]
      old: <absent>
      new: ""
      scenarios: [prometheus]
      reason: Prometheus mode renders the endpoint empty, which the stack reads as "export nothing".
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].*Probe.httpGet.port
      old: 8080
      new: 9090
      reason: >-
        The contract probes the metrics port, where the scalo runtime serves
        /livez and /readyz with the pipeline's readiness check. The http listener
        answers the same (dfe-receiver src/server/http/mod.rs).
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].*Probe.initialDelaySeconds
      new: 0
      reason: The startup probe holds liveness and readiness back until the app answers.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].startupProbe.*
      old: <absent>
      reason: >-
        A startup probe on /livez over the contract's 60 s budget, which every
        DFE pipeline chart lacked.
    - object: "*/dfe-receiver"
      path: "*ports[8443/TCP].*"
      new: <absent>
      reason: >-
        Nothing in dfe-receiver binds 8443. Its OTLP/gRPC listener is 4317, which
        the contract opens while config.otlp.enabled is true.
    - object: "*/dfe-receiver"
      path: "*ports[6000/TCP].name"
      old: pushgrpc
      new: grpc
      reason: The contract's name for the PushEvents port. Producers dial it by number.
    - object: Service/dfe-receiver
      path: spec.ports[6000/TCP].appProtocol
      old: <absent>
      new: kubernetes.io/h2c
      reason: >-
        The contract declares the PushEvents port cleartext HTTP/2, which local.yaml's
        listener list left off when it restated the list.
    - object: NetworkPolicy/dfe-receiver-ingest
      path: spec.ingress
      old:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: dfe-culvert
          ports:
            - { port: 8080, protocol: TCP }
            - { port: 8443, protocol: TCP }
      new:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: dfe-culvert
          ports:
            - { port: 8080, protocol: TCP }
      reason: The tunnel no longer reaches 8443, which nothing in the receiver binds.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.volumes[tmp].emptyDir
      old: {}
      new: <absent>
      reason: The /tmp emptyDir is scalo-service's writable-tmp now.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.containers[main].volumeMounts[/var/spool/dfe-receiver].name
      old: spool
      new: writable-spool
      reason: >-
        The spool is the contract's spool writable path, mounted while
        config.buffer.spillover.enabled is true; scalo-service names its volume
        writable-spool.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.volumes[spool].emptyDir.sizeLimit
      old: 20Gi
      new: <absent>
      reason: The same node-local spool, under its new volume name.
    - object: Deployment/dfe-receiver
      path: spec.template.spec.volumes[writable-spool].emptyDir.sizeLimit
      old: <absent>
      new: 20Gi
      reason: The same node-local spool and cap, under its new volume name.

dfe-loader:
  added:
    ConfigMap/dfe-loader-env: >-
      dfe-extras carries the env 2.2.0 wrote under conditionals, read through
      extraEnvFrom, so a variable stays absent where 2.2.0 left it out, and keeps
      2.2.0's refusals of a ClickHouse TLS setup the loader cannot dial.
  diffs:
    - object: Deployment/dfe-loader
      path: metadata.annotations[configmap.reloader.stakater.com/reload]
      old: <absent>
      new: dfe-loader-env
      reason: A changed dfe-loader-env restarts the pod, as a changed 2.2.0 env did by rolling it.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].envFrom
      old: <absent>
      reason: The pod reads dfe-loader-env, whose content the env leaves are held to.
    - object: Deployment/dfe-loader
      path: spec.template.metadata.annotations[checksum/config]
      reason: >-
        2.2.0 hashed its whole ConfigMap template, scalo-service hashes the config
        file. Either rolls the pod on a config change; the file itself is compared
        as ConfigMap/dfe-loader-config.
    - object: ConfigMap/dfe-loader-config
      path: data[loader.yaml]
      old: "clickhouse:\n  protocol: http\n"
      new: "clickhouse:\n  protocol: http\ntransport: grpc\n"
      reason: >-
        The contract opens the push port while config.transport is grpc, so the
        direct profiles write the transport DFE_LOADER_TRANSPORT already sets.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].env[DFE_LOADER_*_PASSWORD].*
      new: <absent>
      reason: >-
        The ClickHouse and SASL passwords come from the contract's secret groups,
        under the figment names below.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].env[DFE_LOADER_KAFKA_SASL_USERNAME].*
      new: <absent>
      reason: The SASL user comes from the contract's kafka group, under the figment name below.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].env[DFE_LOADER__*].valueFrom.secretKeyRef.*
      old: <absent>
      reason: >-
        The contract's figment names, DFE_LOADER__KAFKA__SASL__USERNAME and
        _PASSWORD and DFE_LOADER__CLICKHOUSE__PASSWORD, reach the same config
        keys as the flat names 2.2.0 set (dfe-loader src/config/loader.rs), on the
        same Secrets and keys.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].env[OTEL_EXPORTER_OTLP_ENDPOINT]
      old: <absent>
      new: ""
      scenarios: [prometheus]
      reason: Prometheus mode renders the endpoint empty, which the stack reads as "export nothing".
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].*Probe.initialDelaySeconds
      new: 0
      reason: The startup probe holds liveness and readiness back until the app answers.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].livenessProbe.periodSeconds
      old: 30
      new: 10
      reason: >-
        scalo-service checks liveness every 10 s once startup passes. 30 s came
        from the exec probe 2.2.0 replaced.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].startupProbe.*
      old: <absent>
      reason: >-
        A startup probe on /livez over the contract's 60 s budget, which every
        DFE pipeline chart lacked.
    - object: "*/dfe-loader"
      path: "*ports[6000/TCP].name"
      old: grpc
      new: push
      reason: The contract's name for the push port. The receiver and the mesh route dial it by number.
    - object: "*/dfe-loader"
      path: "*ports[6000/TCP].*"
      new: <absent>
      reason: >-
        On the bus profiles the loader consumes the broker and binds nothing on
        6000; the contract opens it only while config.transport is grpc.
    - object: Deployment/dfe-loader
      path: spec.template.spec.initContainers[clickhouse-ca-bundle].command
      new:
        - /bin/sh
        - -c
        - |
          set -eu
          if [ -n "${SSL_CERT_FILE:-}" ]; then
            cat /etc/ssl/certs/ca-certificates.crt /etc/dfe-clickhouse-ca/ca.crt > /etc/dfe-trust/ca-bundle.pem
          fi
      reason: >-
        The bundle is written only where dfe-loader-env sets SSL_CERT_FILE, which
        is where 2.2.0 rendered the init container at all.
    - object: Deployment/dfe-loader
      path: spec.template.spec.initContainers[clickhouse-ca-bundle].env[SSL_CERT_FILE].valueFrom.configMapKeyRef.*
      old: <absent>
      reason: The init container reads SSL_CERT_FILE from dfe-loader-env, optional, to know whether to write the bundle.
    - object: Deployment/dfe-loader
      path: spec.template.spec.volumes[clickhouse-ca].*.optional
      old: <absent>
      new: true
      reason: >-
        Mounted on every pod, optional, because a static volume cannot follow
        clickhouse.tls. SSL_CERT_FILE still follows it.
    - object: Deployment/dfe-loader
      path: spec.template.spec.volumes[tmp].emptyDir
      old: {}
      new: <absent>
      reason: The /tmp emptyDir is scalo-service's writable-tmp now.
    - object: Deployment/dfe-loader
      path: spec.template.spec.initContainers[clickhouse-ca-bundle].*
      old: <absent>
      scenarios: [clickhouse-plaintext]
      reason: >-
        On plaintext ClickHouse the bundle init container still runs, and writes
        nothing, because dfe-loader-env sets no SSL_CERT_FILE there.
    - object: Deployment/dfe-loader
      path: spec.template.spec.volumes[*].*
      old: <absent>
      scenarios: [clickhouse-plaintext]
      reason: The CA and bundle volumes that init container mounts, optional and empty respectively.
    - object: Deployment/dfe-loader
      path: spec.template.spec.containers[main].volumeMounts[/etc/dfe-trust].*
      old: <absent>
      scenarios: [clickhouse-plaintext]
      reason: The empty bundle directory, which nothing reads without SSL_CERT_FILE.

dfe-engine:
  added:
    ConfigMap/dfe-engine-env: >-
      dfe-extras carries the env 2.2.0 wrote under conditionals, read through
      extraEnvFrom, so a variable stays absent where 2.2.0 left it out.
  removed:
    PodDisruptionBudget/dfe-engine: >-
      The contract marks the engine a singleton, and scalo-service budgets no
      singleton. 2.2.0 rendered minAvailable 1 over the engine's one pod on scale
      and mesh, which blocked every voluntary eviction, a node drain included.
  diffs:
    - object: Deployment/dfe-engine
      path: metadata.annotations[configmap.reloader.stakater.com/reload]
      old: <absent>
      new: dfe-engine-env,dfe-engine-app-catalogue
      reason: >-
        A changed dfe-engine-env or app catalogue restarts the pod, as a changed
        2.2.0 env or the catalogue checksum rolled it.
    - object: Deployment/dfe-engine
      path: spec.template.metadata.annotations[checksum/app-catalogue]
      new: <absent>
      reason: >-
        Reloader restarts the pod on a change to dfe-engine-app-catalogue
        (reload.configmaps), in place of the checksum 2.2.0 took over its own
        copy of the template.
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].envFrom
      old: <absent>
      reason: The pod reads dfe-engine-env, whose content the env leaves are held to.
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].args
      old: <absent>
      new: [run]
      reason: The contract's entrypoint args, which equal the image's own CMD ["run"].
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].env[DFE_AUTH_LOCAL_SEED_ACCOUNTS].valueFrom.secretKeyRef.*
      old: <absent>
      reason: >-
        The contract's seed-accounts group is optional, so the reference leaves the
        variable unset, as 2.2.0 did, until seedAuth.seedAccounts makes dfe-extras
        render dfe-engine-seed-accounts.
    - *scalo-liveness-delay
    - *scalo-readiness-delay
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].ports[9090/TCP].name
      old: obs
      new: metrics
      reason: >-
        scalo-service names the metrics port `metrics`. Health and /metrics stay on
        9090, and the probes resolve to the same number.
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].startupProbe.periodSeconds
      old: 10
      new: 5
      reason: scalo-service runs the startup probe every 5 s over the contract's budget.
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].startupProbe.failureThreshold
      old: 30
      new: 60
      reason: The contract's 300 s startup budget at a 5 s period, the 30 x 10 s 2.2.0 gave.
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].volumeMounts[/config].name
      old: config
      new: writable-config
      reason: >-
        The config claim is the contract's writable path `config`, which
        scalo-service mounts as writable-config at the same path.
    - object: Deployment/dfe-engine
      path: spec.template.spec.volumes[config].persistentVolumeClaim.claimName
      old: dfe-engine-config
      new: <absent>
      reason: The same claim, under scalo-service's volume name below.
    - object: Deployment/dfe-engine
      path: spec.template.spec.volumes[writable-config].persistentVolumeClaim.claimName
      old: <absent>
      new: dfe-engine-config
      reason: >-
        The claim keeps its 2.2.0 name: scalo-service names it <fullname>-<path
        name>, and the writable path is named config.
    - *scalo-tmp-volume
    - object: Deployment/dfe-engine
      path: spec.template.spec.initContainers[auth-config-seed].*
      old: <absent>
      reason: >-
        The auth seed runs on every pod, because a list item cannot follow
        authConfig. With no ConfigMap named its sources are empty directories, and
        it copies nothing.
    - object: Deployment/dfe-engine
      path: spec.template.spec.volumes[*].emptyDir.sizeLimit
      old: <absent>
      new: 1Mi
      reason: >-
        The auth seed's three sources where authConfig names no ConfigMap: empty
        directories, capped at 1Mi.
    - object: Deployment/dfe-engine
      path: spec.template.spec.volumes[clickhouse-ca].*.optional
      old: <absent>
      new: true
      reason: >-
        Mounted on every pod, optional, because a static volume cannot follow
        clickhouse.tls. DFE_CLICKHOUSE_CA_CERT still follows it.
    - object: Deployment/dfe-engine
      path: spec.template.spec.volumes[clickhouse-ca].*
      old: <absent>
      scenarios: [clickhouse-plaintext]
      reason: >-
        The same optional volume on plaintext ClickHouse, where 2.2.0 mounted
        none. Nothing reads it: dfe-engine-env leaves DFE_CLICKHOUSE_CA_CERT out.
    - object: Deployment/dfe-engine
      path: spec.template.spec.containers[main].volumeMounts[/etc/dfe/clickhouse-ca].*
      old: <absent>
      scenarios: [clickhouse-plaintext]
      reason: The mount of that optional volume.
    - object: Service/dfe-engine
      path: spec.ports[9090/TCP].*
      old: <absent>
      reason: >-
        scalo-service puts the metrics port on the Service, where 2.2.0 carried
        the API port alone. Prometheus already scraped /metrics on the pod's 9090.
    - object: ServiceAccount/dfe-engine
      path: automountServiceAccountToken
      old: <absent>
      new: false
      reason: >-
        scalo-service's ServiceAccount carries no token by default. The engine runs
        no Kubernetes client, and DFE_DEPLOYMENT_TARGET names the target it would
        otherwise detect from the mount.
    - *scalo-prometheus-endpoint
